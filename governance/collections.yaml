    implemented:
      - parser and AST support for canonical fixed-array, dynamic-array, slice, list, map, and set type forms
      - Sema recognition and arity validation for compiler-known collection families
      - loader-proven core sources may define ordinary impl members for list, map, and set through the shared compiler/LSP privilege gate; stdlib and user sources remain rejected
      - Place-backed fixed-array and slice indexing used by borrow and ownership analysis
      - contextual collection type identities exposed to formatter and LSP registries
      - omitted initialization of mutable owning T[] produces its canonical allocation-free empty default
      - list[T] indexing resolves ordinary reads, shared and mutable element Places, and indexed replacement through the canonical element type
      - list indexing accepts built-in and compatible named integer indexes, rejects invalid types and statically provable negative or bounded-capacity failures, and records mandatory runtime Len checks otherwise
      - list index facts remain separate from array facts so unavailable list Semantic IR and lowering cannot be inferred accidentally
      - "array literal range segments (2026-10-05, collections.md § 5.6a, user decisions: fixed arrays only, rune segments may not cover surrogates): the parser reads `lower..upper` and `lower..<upper` elements; Sema resolves each to an ArrayLiteralRange plan entry with inclusive compile-time bounds and its value count (rune and character literals by scalar value, integers by the shared constant evaluation), infers or checks the fixed length from the contributed values, and rejects runtime bounds, descending bounds, non-integer or contract element types, bounds outside the element type, surrogate-covering rune segments, and a T[] target with S1119 collections.range-segment-invalid; a range anywhere else (for example an ordinary call argument) is S1119 'a range is not a value in Sec 0.1' instead of a silent invalid type; Semantic IR builds one compact array.construct range segment per source segment (constant lower-bound operand, count length) and drops empty segments; the legacy emit-mlir generator rejects range segments explicitly (TestArrayLiteralRangeSegments, TestArrayLiteralRangeSegmentErrors, TestRangeSegmentsParseInArrayLiteralsAndArguments, TestArrayLiteralRangeSegmentsBuildCompactSegments)"
      - sec/core/rune.sec IsLowerLetter builds its table as an inferred fixed rune array of range segments (2026-10-05)
      - "MD-058 capacity surface (2026-10-12, collections.md §§ 3.1, 13.12, 14.3, 14.8, 15.2, 15.5, 16; rules/corrections/applied/md058-collection-capacity-reservation-correction-20261012.md): the compiler-known registry gives every list, map and set a read-only Capacity (CKM-LIST/MAP/SET-CAPACITY), and dynamic forms (no ConstArgs bound) Reserve(additional: uint) Result[void, CollectionError] (structural mutation) and the associated factory WithCapacity(capacity: uint) Result[Collection, CollectionError]; list[T].WithCapacity (parsed as an indexed owner) and map[K, V]/set[T].WithCapacity (type arguments on the call) resolve their receiver type; bounded forms, T[], slices and fixed arrays reject Reserve and WithCapacity, T[] keeps no Capacity, and no Capacity() method exists; synthetic LSP declarations document every new member (TestCollectionCapacityReservationSurface, TestCollectionCapacityReservationRejections)"
      - Nonempty literals targeting owning T[] are rejected with mandatory S1155 (collections.dynamic-array-literal-invalid), a source location and guidance to use an empty mutable owner plus Append or fixed T[N]. Range segments retain S1119. Contextual [] remains valid under the later MD-027 correction, including declarations, assignments, returns, fields and calls. Rejected literals publish no literal plan; CLI stops before lowering and preserves existing output; LSP carries the same diagnostic. Older fixtures use fixed backing, typed owner inputs or empty defaults according to their original test purpose.
      - Owning-array frontend identity is verified across copyability, destruction, equality, initialization and transfer (2026-10-16, correction26). T[] remains MoveOnly and non-trivially destructible independently of element copyability, including named owners and containing fixed arrays/structs; fixed arrays retain element-derived traits. Fixed/owning families cannot initialize each other or gain owner content equality, explicit moves preserve the owner type and consume the source, and explicit shared/mutable slices remain valid. Fixed-array equality now requires the complete canonical type identity instead of checking only shape and recursively comparing elements, rejecting distinct nominal wrappers and nested nominal mismatches with S1019. Equality resolution is extracted into type_equality.go. All-depth/reanalysis, CLI output-preservation and unsaved LSP checks pass; executable dynamic owner layout and operations remain in the separate P18/lowering work.
    remaining:
      - "MD-058 runtime behaviour: lower Reserve and WithCapacity with the guaranteed Capacity >= Len + n, the no-op path, transactional failure including map/set rehash, allocation-context use and CollectionError classification; verify borrow conflicts, relocation invalidation and fault-injected rollback (collections.md §§ 13.12, 14.8, 15.5); Semantic IR and both legacy backends have no list/map/set operations today"
      - complete parser, AST, and Sema coverage for the canonical fixed-array and slice syntax contract
      - array literal inference, bounds, indexing, slicing, assignment, equality, and ownership validation
      - full borrow and lifetime validation for slice creation, reborrowing, and returned sub-slices
      - compiler-defined layout, overflow, alignment, and length validation
      - explicit array, slice, and list operations in Semantic IR and lowering through MLIR and LLVM
      - focused valid, invalid, recovery, analysis, and backend test coverage
