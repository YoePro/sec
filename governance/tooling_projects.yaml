  - id: tooling.project-build-numbering
    area: tooling-projects
    status: implemented
    integrated: "2026-10-04"
    summary: >-
      Visible, manually editable manifest build numbers with transactional
      automatic increment (§ 27–§ 30), superseding the revision-1 hidden
      `.sec/state/build-counters.toml` counter (§ 52(3)), which was never
      implemented.
    rules:
      - rules/projects/projects.md
    remaining: []
    implemented:
      - comment- and layout-preserving manifest mutation through the parsed manifest syntax (§ 49(5))
      - PlanBuildNumberEdit and ManifestDocument.ReplaceBuildNumber locate exactly one explicit Project or Target-local build integer through parsed TOML key components and byte ranges; quoted/escaped/dotted keys and inline tables are supported, comments/string/array contents cannot forge storage, missing local fields never mutate inherited Project storage, and invalid VersionNumbers or duplicate/malformed TOML are rejected. Only the selected scalar changes; comments, order, whitespace, CRLF and unrelated values remain byte-identical. Equal values retain their existing spelling.
      - BuildNumberEdit.Commit uses the shared permission-preserving same-directory staged atomic manifest replacement, checks original bytes and inode before publication, rejects stale snapshots, removes staged files and avoids rewriting byte-identical edits. The extracted writer also serves init transactions and retains protected rollback. The build invocation layer owns automatic allocation, locking, success-only publication and explicit overrides.
      - manual reset and jump acceptance, and no automatic reset after major, minor, or revision changes (§ 8(6)–(7))
      - project-scoped counter on `[version].build` and Target-scoped counter requiring a Target-local build field (§ 28)
      - "Manifest resolves immutable per-Target BuildCounter facts from parsed TOML: enabled must be boolean, scope defaults to target and accepts only target/project, unknown settings fail, active target scope requires explicit local version.build, and active project scope owns Project version.build and rejects local build overrides. Disabled counters retain ordinary version inheritance. Shared model validation is consumed by init and discovered compiler build projects; diagnostics identify counter keys and source lines, including inline or quoted declarations, without accepting text inside strings."
      - BuildNumberCandidate and LoadBuildNumberCandidate derive a bounded next value and complete Target version plus an exact edit from the current manifest snapshot. Explicit reload honors forward jumps, backward edits and zero resets, preserves the build baseline across major/minor/revision changes, ignores legacy hidden state, and reports overflow without producing an edit. Candidate calculation performs no reservation or mutation. The separate BuildInvocation layer and CLI build now own serialized reservation and success-only commit across requested Variants.
      - explicit `--build-number` for one invocation without mutating the manifest (§ 30)
      - candidate allocation committed exactly once after all requested builds succeed, unchanged manifest after a failed build, one candidate across a multi-Variant Target, and serialized parallel builds (§ 29)
      - BuildInvocation reserves the current baseline plus one under a project-wide OS file lock, rereading the manifest after waiting and keeping one candidate/version across the requested Target Variants. Compiler build replans against the locked snapshot, commits once after every Variant links, and prints the successful version only after commit. Frontend/backend/link failures, aborted invocations, overflow and stale manifest commits leave authoritative values unchanged; process exit releases OS locks. Independent Target counters are conservatively serialized to avoid concurrent replacement of the shared manifest. Persistent lock inodes contain no counter authority.
      - sec build accepts a declared Target name (all configured Variants) or the existing source-file form; --target filters named builds, while ambiguous multi-Variant -o is rejected. --build-number is a bounded invocation-only override used by every selected Variant, bypasses automatic allocation/locks and performs no manifest edits. Final structured versions are rendered once; retained LLVM artifacts carry the rendered version and a version-sensitive identity based on ProjectUUID, Target and Variant, without timestamps. Source-level build metadata API and complete configuration/cache policy remain separate work.
    revised: "2026-10-13"
    code:
      - internal/project/build_number_edit.go
      - internal/project/manifest_write.go
      - cmd/compiler/init_manifest_write.go
      - internal/project/build_counter.go
      - internal/project/manifest.go
      - internal/project/manifest_locations.go
      - cmd/compiler/build_counter_validation.go
      - cmd/compiler/build_command.go
      - internal/project/build_invocation.go
      - cmd/compiler/build_options.go
      - cmd/compiler/build_selection.go
    tests:
      - internal/project/build_number_edit_test.go
      - internal/project/build_counter_test.go
      - cmd/compiler/build_counter_validation_test.go
      - internal/project/build_invocation_test.go
      - cmd/compiler/build_invocation_test.go
      - testdata/projects/build_tools/clang_stub.sh
    verification:
