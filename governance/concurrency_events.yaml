  summary: Tracks language-visible Event[T], Event[T,N], EventStorage[T,N], Subscription and EventSubscribeResult,
    short/full declaration forms, owner-only publication, fixed-capacity synchronous dispatch, subscription
    ownership/lifetimes and compiler-known surface. Parser and initial Sema support exist, but runtime
    subscriber storage, dispatch and lowering do not. Owner-approved borrowed payload and retained
    external capturing-handler storage replace the current by-value frontend callback signature; runtime
    support remains unimplemented.
