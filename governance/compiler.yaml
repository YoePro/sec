        result: passed 2026-11-12 for the graph materialization boundary and diagnostic registration.
      - command: go test -p 4 ./internal/sema -run ^TestCTEMaterialization -count=1
        result: "passed 2026-11-12 on final graph-budget diagnostic wording: 0.014s."
