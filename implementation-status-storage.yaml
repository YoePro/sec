repository_baseline:
  commit: 814a584
  note: latest publicly verifiable main; current main content reviewed
baseline_confirmed:
- The current storage.md is already the canonical modern storage model and defines independent StorageOrigin, BackingRelation,
  ReclamationAuthority, AddressStability, MemorySpaceKind, RegionDependencies, InvalidationDomain and ValidityEpoch facts.
- The current book embeds a large Current implementation status section that is non-normative and is removed in v2.
- Current storage origins are Automatic, Static, ThreadLocal, Arena, AllocatorBacked and Unknown; legacy Inline/External/Foreign/FixedAddress
  categories are explicitly non-canonical.
- Current Semantic IR requirements distinguish stable facts, path-dependent state and explicit domain/object/backing/pin/protection
  operations.
