- unsupported forms
- deviations
- Package 8 recommendations
package8:
  name: Checked Integer Arith Lowering
  goal: Lower schema-v4 integer semantic ops to total signless standard MLIR computations
    of (result, failed), retaining existing explicit failure edges.
  likely_scope:
  - siN/uiN -> signless iN
  - signedness-aware lower-op selection
  - integer constants normalization
  - unary plus elimination
  - bitwise Arith lowering
  - signed/unsigned cmpi predicates
  - checked add/sub/mul without poison
  - safe div/rem without UB
  - safe shifts without poison/masking
  - signed-left overflow detection
  - 8/16/32/64/128/256 tests
  still_deferred:
  - try/ArithmeticError
  - panic endpoint lowering
  - float
  - decimal
  - named/unit numeric
  - numeric casts
  - foreign ABI
  - ownership
  - aggregates
  - allocation
  - register/MMIO
  - concurrency
  - LLVM dialect
upstream_mlir_references:
- https://mlir.llvm.org/docs/Dialects/ArithOps/
- https://mlir.llvm.org/docs/DialectConversion/
