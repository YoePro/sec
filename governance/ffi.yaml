      - internal/codegen/llvm/types.go
      - internal/codegen/mlir/generator.go
      - internal/ir/semantic/model.go
      - internal/ir/semantic/builder.go
      - internal/parser/foreign_types.go
      - internal/sema/foreign_c_types.go
      - internal/layout/c_abi.go
      - internal/layout/scalar_plan.go
      - cmd/compiler/target.go
      - internal/cst/roles.go
      - internal/formatter/token_spacing.go
