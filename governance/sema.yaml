      - "fixed-array and slice membership (2026-11-01): Semantic IR and schema-12 Sec MLIR represent builtin integer, byte, bool, char, rune, enum and floating element searches with exact-once needle-then-source evaluation, first-match exit and no allocation. Large arrays use bounded-size CFG; slices preserve temporal/spatial guards and named holders, and release direct temporary borrows. Resolver-confirmed membership bool results no longer falsely retain local or match-arm reference origins. String, decimal, named-wrapper and aggregate equality plus physical array/slice lowering remain blocked; the broad membership point is not complete."
