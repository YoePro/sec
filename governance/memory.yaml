      - Existing MLIR/LLVM infrastructure lowers broad function, control-flow, aggregate, Result/Option, and reference-adjacent operations; compile-time borrow checking already removes the need for runtime borrow counters in established cases.
    remaining:
      - consume resolved Semantic IR borrow/reference facts rather than reconstructing source borrow legality from pointer shapes
      - erase compile-time-only borrow bookkeeping when safe while preserving required provenance/bounds/address-space/generation checks
      - preserve final-use ordering so invalidating move/replacement/destruction cannot be scheduled before the last required borrow use
