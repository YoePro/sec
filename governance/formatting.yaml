schema_version: 1
area: formatting
purpose: Source formatting, formatting fixes, and formatter behavior.
integrations:
  - id: tooling.cst-lexical-foundation
    area: tooling
    status: partial
    integrated: "2026-09-16"
    revised: "2026-10-01"
    summary: >-
      Introduces a lexer-backed, byte-lossless concrete-syntax foundation and
      lexical delimiter hierarchy. The formatter remains primarily a bespoke
      trimmed-line transformation pipeline, but selected grammar-aware slices
      now use parser-owned roles projected onto exact CST tokens.
    rules:
      - rules/tooling/formatter.md
      - rules/foundations/lexical_structure.md
      - rules/compiler/parser_recovery.md
    code:
      - internal/ast/ast.go
      - internal/parser/parser.go
      - internal/parser/expression.go
      - internal/cst/document.go
      - internal/cst/groups.go
      - internal/cst/roles.go
      - internal/formatter/formatter.go
      - internal/formatter/cst_spacing.go
      - internal/formatter/corrections.go
      - internal/formatter/block_comments.go
      - internal/formatter/line_comments.go
      - internal/formatter/struct_field_alignment.go
      - internal/formatter/parameter_alignment.go
      - internal/formatter/enum_value_alignment.go
    tests:
      - internal/parser/parser_test.go
      - internal/cst/document_test.go
      - internal/cst/groups_test.go
      - internal/cst/roles_test.go
      - internal/formatter/formatter_test.go
      - testdata/cst/groups_valid.sec
      - testdata/cst/groups_invalid.sec
    implemented:
      - retain source-ordered lexer tokens, comments, whitespace, invalid tokens, lexical diagnostics, original byte ranges, and an initial BOM without changing original source bytes
      - preserve exact round trips over Unicode, CRLF, nested comments, interpolated and raw strings, and invalid UTF-8 bytes
      - use lexer-owned comment tokens for trailing-comment boundary detection during formatter alignment
      - retain the previous conservative scanner for malformed single-line source until structural recovery is available
      - derive nested parenthesized, bracketed, and braced delimiter groups from real lexer tokens, retaining incomplete groups and unmatched closers without synthetic recovery
      - conservatively classify documents with lexer diagnostics, unmatched real closers, or incomplete real delimiter groups as uncertain and preserve their complete source bytes during ordinary formatting
      - project parser-owned generic-constraint conjunction roles onto exact CST tokens and use their byte spans for canonical formatter spacing without rewriting ordinary bitwise-and expressions or recovered missing constraints
      - project parser-owned contextual matrix-operator roles onto exact CST tokens and share one CST spacing pass with generic constraints, replacing the formatter's former standalone AST-reflection and line/column rewrite
      - project parser-confirmed statement-only increment and decrement aliases onto exact CST tokens and rewrite them in the shared CST pass, replacing a second formatter-local AST reflection and line/column rewrite while preserving invalid expression uses
      - project unit-metadata declaration roles only inside impl blocks targeting parsed unit declarations and canonicalize their names from exact CST byte spans, replacing a separate parser run and rune-column rewrite while preserving ordinary impl members
      - project valid top-level test-name string roles onto exact CST tokens and normalize only their horizontal header trivia, replacing the formatter's per-line lexer while preserving exact string spelling and ordinary identifiers, calls, and strings
      - project opening-block roles from parser-owned ownership AvailabilityExpression if conditions and normalize only that concrete brace boundary, replacing blind line-text substitutions while preserving ordinary available/is/not identifiers and conditions
      - project operators and real grouping delimiters from parser-owned structural unit expressions onto exact CST tokens and compact only their horizontal trivia, replacing the formatter's angle-bracket line heuristic while preserving ordinary comparisons and arithmetic
      - retain the exact parameter-list opener on parsed function, lambda, and initializer nodes, project it into a CST role, and remove only its preceding horizontal trivia instead of scanning signature lines
      - project parser-confirmed commas between grouped let and typed declarators into CST roles and normalize only their horizontal separator trivia, replacing the formatter's grouped-let line scanner while leaving expression commas untouched
      - project parser-owned match payload and field delimiters, explicit field-binding colons, where guards, and match/try arrows onto exact CST tokens, replacing the formatter's match-arm line scanner while leaving recovered invalid arrows untouched
      - complete parser-owned match-pattern punctuation with CST roles for closing payload and field delimiters plus shallow-field commas, enforcing compact payload bindings and canonical single-line field padding without touching invalid recovered patterns
      - project separators and terminating colons from valid parser-owned switch case/default headers onto exact CST tokens and canonicalize their horizontal punctuation spacing without claiming recovered invalid clauses
      - use complete parent-child CST delimiter groups for the opt-in redundant nested-parentheses correction, removing the inner pair only when it is the outer pair's sole non-trivia content and preserving intervening comments
      - retain complete outer condition-parenthesis tokens on parsed if, while, and switch nodes and project them into an opt-in correction role only when they own the whole condition or subject and the following body is valid
      - format standalone multiline block and documentation comment tokens from the lossless CST into aligned-star form while retaining single-line and inline forms and shielding comment-owned delimiters from structural indentation
      - normalize the post-delimiter margin of lexer-owned line-comment tokens to `// text` or canonical empty `//` without reflowing comment prose or touching comment-like text in literals and block comments
      - project parser-attached argument-free attribute endings and their declaration starts into CST roles, placing `@noCopy` and `@noPanic` on their own immediately attached lines without attribute-name-specific formatter scanning
      - project matching closing delimiters for parser-valid function, method, initializer, and lambda parameter lists and add the grammar-permitted trailing comma when such a list is multiline
      - retain parser-owned explicit lambda-capture delimiters as CST roles and add the grammar-permitted trailing comma when a complete capture list is multiline
      - project parser-confirmed executable block delimiters into CST roles and expand one-line and empty executable bodies to canonical multiline layout without rewriting aggregate literals or compact empty structural declarations
      - retain parser-owned range, slice-range, and contextual for-step tokens as CST roles and normalize only their horizontal trivia, keeping range operators compact and step surrounded by one space without rewriting ordinary step identifiers
      - project complete struct-field colon, type-start, and tag anchors into CST roles; align contiguous field type columns structurally, then align tags as a secondary column, splitting at comments, blank lines, multiline fields, and declaration boundaries while independently dropping a primary or secondary candidate that exceeds the default sixteen-space padding limit
      - retain the exact initializer token on complete enum members and project canonical equals assignments into CST roles; align contiguous explicit-value groups while comments, blank lines, implicit members, declaration boundaries, legacy colon spellings, and excessive padding split or disable alignment
      - project declaration colons and first concrete type tokens for complete callable parameters, including variadic spread starts, into CST roles; align compatible contiguous multiline parameter groups while single-line lists, blank-line boundaries, recovered parameters, and excessive padding remain conservative
      - retain complete generic type-argument brackets on parser-owned type references and project them into CST roles; add the grammar-permitted trailing comma only to genuinely multiline lists while leaving single-line generics, arrays, indexing, and recovered incomplete syntax untouched
    remaining:
      - add grammar-aware CST nodes and stable parser-owned source ranges above the new lexical delimiter hierarchy without duplicating AST semantics
      - attach parser missing-token and skipped-token recovery nodes to the concrete syntax model
      - replace the bespoke trimmed-line formatter pipeline with a CST-driven formatter whose structure, trivia ownership, safe regions, indentation, alignment, and comment placement decisions originate in internal/cst
      - migrate existing parser/AST/lexer-assisted formatter special cases onto grammar-aware CST roles instead of growing parallel source-analysis paths
      - support incremental and minimal-edit syntax-tree formatting
    verification:
      - command: go test ./internal/cst ./internal/formatter -count=1
        result: passed
      - command: go test ./internal/parser ./internal/cst ./internal/formatter -run 'Enum|FormatAlignsExplicitEnumValueAssignments|ApplyProgramRolesMarksExplicitEnumAssignments' -count=1
        result: passed on 2026-09-30; parser-owned enum assignment tokens drive CST roles, canonical spacing, group alignment, group boundaries, padding fallback, and idempotence
      - command: go test ./internal/cst ./internal/formatter -run 'Test(ApplyProgramRolesMarksCallableParameterAlignmentAnchors|FormatAlignsMultilineCallableParametersFromCST|FormatDropsCallableParameterAlignmentBeyondPaddingLimit|FormatCallableParameterBlankLinesSplitAlignmentGroups|FormatAddsTrailingCommaToMultilineCallableParameters)' -count=1
        result: passed on 2026-10-01; parser-owned parameter anchors drive multiline type-column alignment, variadic starts, blank-line group boundaries, padding fallback, trailing commas, and idempotence
      - command: go test ./internal/parser ./internal/cst ./internal/formatter -run 'Test(ParseRetainsCompleteGenericTypeArgumentDelimiters|ApplyProgramRolesMarksOnlyTypeArgumentListDelimiters|FormatAddsTrailingCommaToMultilineTypeArguments)' -count=1
        result: passed on 2026-10-01; parser-owned generic brackets distinguish type arguments from arrays and indexing, drive multiline trailing commas, and preserve single-line and idempotent output
  - id: tooling.formatter-delimiter-handoff
    area: tooling
    status: implemented
    integrated: "2026-08-12"
    summary: >-
      Preserves indentation when one continuation line closes a multiline call
      and aggregate literal while opening an attached try-handler block.
    rules:
      - rules/tooling/formatter.md
      - rules/foundations/grammar.md
      - rules/errors/errorhandling.md
    code:
      - internal/formatter/formatter.go
    tests:
      - internal/formatter/formatter_test.go
      - cmd/lsp/main_test.go
    implemented:
      - recognize closing-heavy delimiter handoff lines such as `}) {` without discarding the newly opened handler indentation level
      - indent try-handler arms beneath the attached handler block and restore the enclosing statement and function indentation after its closing brace
      - ignore interpolated-string braces while determining the last structural delimiter on the continuation line
      - verify formatting idempotence for a multiline typed struct literal passed to a fallible method under try
    verification:
      - command: go test ./internal/formatter -run TestFormatTryHandlerAfterStructLiteralCallArgument -v
        result: passed
      - command: go test ./cmd/lsp -run 'Format|Formatting' -v
        result: passed
  - id: tooling.formatter-canonical-token-spacing
    area: tooling
    status: implemented
    integrated: "2026-10-01"
    summary: >-
      Normalizes the same-line horizontal gap between adjacent tokens from
      parser-owned CST roles: binary, assignment, and initialization operators,
      unary prefix operators and the consuming call-site marker, the let type
      colon, statement and control-flow keywords, and same-line opening braces.
    rules:
      - rules/tooling/formatter.md
    code:
      - internal/cst/roles.go
      - internal/formatter/token_spacing.go
      - internal/formatter/formatter.go
    tests:
      - internal/cst/roles_test.go
      - internal/formatter/token_spacing_test.go
      - internal/formatter/formatter_test.go
      - cmd/lsp/main_test.go
    implemented:
      - "§6(5): infix operators, including not in and the for-header in, have one space on both sides"
      - "§6(6) and §21(5): unary prefix operators and the <- consuming marker attach to their operand"
      - "§6(4): a let type-annotation colon binds to its identifier and is followed by one space"
      - "§6(7): assignment, compound-assignment, :=, and :<- operators have one space on both sides"
      - let, let mut, return with a value, if, else, while, for, switch, and match keywords are followed by one space
      - "§8(1)–(3) and §18(1): an executable block, switch body, or match body brace on the header line follows one space, giving canonical } else {"
      - roles come from the parsed AST (InfixExpression, PrefixExpression, AssignmentStatement, LetStatement, control statements) so identical spellings in other grammatical positions, such as a generic constraint & or a typed declaration head, are not affected
      - gaps that cross a line break or hold a comment are never changed, and malformed documents are left byte-for-byte unchanged
      - the pass runs before indentation and alignment so later column alignment observes the canonical token spelling; CLI and LSP share it
    remaining:
      - continuation-line indentation for operators split across lines remains owned by formatter-canonical-layout
      - spacing for remaining unroled positions such as struct-literal braces stays with the existing line-oriented passes until it moves to CST roles
    verification:
      - command: go test ./internal/cst ./internal/formatter ./cmd/lsp -run 'Test(ApplyProgramRolesMarksSpacingRoles|FormatCanonicalTokenSpacing|FormatTokenSpacingLeaves|FormatGenericConstraintConjunctionsFromCST|FormatDeclarationGroupSeparatorsFromCST|FormatSource)' -count=1
        result: passed on 2026-10-01
      - command: format every non-invalid testdata .sec file twice and compare ASTs
        result: passed on 2026-10-01 with no new idempotence or AST differences; the four pre-existing differences (switch_valid idempotence; units_advanced_valid, lexer/interpolation_balanced_valid, and formatter/check_noncanonical AST changes) are identical at HEAD
  - id: tooling.formatter-brace-blank-lines
    area: tooling
    status: implemented
    integrated: "2026-10-01"
    summary: >-
      Removes decorative empty lines directly inside opening and closing braces
      and protects multiline string literals from the line-oriented pass.
    rules:
      - rules/tooling/formatter.md
    code:
      - internal/formatter/formatter.go
      - internal/formatter/multiline_tokens.go
    tests:
      - internal/formatter/token_spacing_test.go
    implemented:
      - "§7(2): an empty line immediately after a line ending in an opening brace, or immediately before a line starting with a closing brace, is removed"
      - "§7(1): existing collapse of repeated empty lines is retained, so ordinary separation between statements keeps one empty line"
      - "§6(8) and §29: continuation lines of a multiline string or raw-string token are emitted byte-for-byte, keep their blank lines, and do not contribute braces to indentation; the token's start line is re-indented only and its braces are counted with the literal masked"
      - fixes the previous behavior in which a closing brace inside a multiline raw string was re-indented, changing the string value
    remaining:
      - structured/compact optional separation from §7(3)–(13) depends on formatter-project-configuration
    verification:
      - command: go test ./internal/formatter -run 'TestFormat(RemovesBlankLinesInsideBraces|PreservesMultilineRawStrings)' -count=1
        result: passed on 2026-10-01
      - command: go test ./...
        result: passed on 2026-10-01
  - id: tooling.formatter-property-accessor-layout
    area: tooling
    status: implemented
    integrated: "2026-10-01"
    summary: >-
      Expands compressed impl property layouts to one accessor per line with
      the property's closing brace on its own line before line-oriented
      indentation runs.
    rules:
      - rules/tooling/formatter.md
    code:
      - internal/formatter/property_layout.go
      - internal/formatter/formatter.go
      - internal/formatter/block_comments.go
    tests:
      - internal/formatter/comment_property_layout_test.go
    implemented:
      - "§16(7): `property X: int { get {` ... `} }`, `} }` endings, and one-line `{ get { return a } }` forms become the canonical property block with each accessor on its own line"
      - the parser-owned getter block, setter keyword, and property body delimiters locate the break points, so only line breaks are inserted and existing executable-block expansion and indentation handle the rest
      - "§16(9): a fallible setter keeps try set together on its own line"
      - fixes indentation drift in which a compressed property shifted the following members and top-level declarations
      - bodyless interface property requirements such as { get } keep their compact form, and malformed documents are left unchanged
      - "§12(8), §12(12), §12(14): block comments with an opener indented further than their body no longer repeat `*` on the following lines (see tooling.cst-lexical-foundation progress)"
    remaining:
    verification:
      - command: go test ./internal/formatter -run 'TestFormat(ShiftedBlockCommentOpener|CompressedPropertyAccessors|PropertyRequirementStaysCompact)' -count=1
        result: passed on 2026-10-01
      - command: go test ./... and formatting every non-invalid testdata file twice with AST comparison
        result: passed on 2026-10-01 with only the four pre-existing differences that are identical at HEAD
  - id: tooling.formatter-single-line-call-spacing
    area: tooling
    status: implemented
    integrated: "2026-08-24"
    summary: >-
      Normalizes whitespace and trailing commas in calls already written on one
      physical line while preserving intentional multiline call layout.
    rules:
