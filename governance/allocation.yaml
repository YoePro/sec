      - AllocationFacts/AllocationFact expose deterministic detached allocation-free/may-allocate/unknown facts for represented callables from canonical synchronous graph effects, resolved types/bindings and trusted foreign contracts; known allocating paths remain visible independently of unresolved evidence
      - allocation-free requires valid completed semantic analysis and covered bodies/cleanup; missing bodies/contracts, unresolved calls, generic templates and incompletely modeled construction, closure, spawn/await, owning collection or nontrivial cleanup coverage remain unknown rather than being inferred free from empty effect lists
      - sec analyse's allocation section and callable LSP hover consume the same canonical facts, preserving positive and unknown cause paths; source selection and advisory/validity counts are unchanged
