      - "static storage (2026-10-16, semantic_ir.md § 28, static.md §§ 2-4): Module.Statics with stable @N identities, qualified names, type, mutability, enclosing function, address-taken flag and exact compile-time initializer (integer-family or bool literal, or the zero default) and no startup function; static.load, static.store (mutable only) and place.static-root, verified against the static; module-level bindings and function-local `static let` (formerly miscompiled as automatic locals) both lower to it (TestStaticStorageLowersToModuleStatics, TestVerifierChecksStaticStorage)"
      - "static storage in the compilation track (2026-10-18, user decision: globals for all statics): emit-sec-mlir publishes each module static as sec.static.global (symbol, type, exact initial value, is_mutable) and accesses as sec.static.load/store; scalar layout and integer lowering convert the access types and sec-lower-static-storage emits internal LLVM globals (constant when immutable) accessed through llvm.mlir.addressof; Semantic IR lowers compound assignment to a mutable static as load/operator/store. Address-taken statics (static Place roots) remain unsupported. Tests: TestStaticStorageEmitRoutes, TestNativeTrackBuildsAndRuns/statics, lit Conversion/SecToLLVM/static-storage-and-panic.mlir"
      - "static methods (2026-10-12, impl.md §§ 11, 13; semantic_ir.md §§ 60-61): every `static fn` of a non-generic impl block in the requested module lowers as an ordinary function under its qualified Target.Name identity (Sema ResolvedMethodForDeclaration), and a resolved static-method call is a direct call to it, including calls between methods; Sec MLIR emits them as qualified functions; instance method calls report the explicit `instance method call` boundary and static methods of generic implementations stay unsupported (TestStaticMethodsLowerAsDirectCalls, TestMethodLoweringBoundaries, TestStaticMethodsEmitAsQualifiedFunctions)"
    remaining:
