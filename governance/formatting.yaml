          Sec construct is locally unambiguous. Do not infer programmer intent,
          mutability, ownership policy, missing types, overloads, control-flow
          meaning, error policy, or allocation policy.
        acceptance:
          - "`language_corrections = false` performs no correction-catalogue rewrites."
          - Corrections operate on proven syntax context, not blind regular-expression substitution.
          - Positive and negative tests exist for every correction rule.
          - "Historical consuming parameter syntax `name: <- Type` corrects to `->name: Type` only when that syntax is unambiguous."
          - "Statement `i++` corrects to `i += 1` without introducing expression-level post-increment semantics."
          - The correction catalogue can expand through dogfooding without weakening the unambiguity rule.
        implemented:
