    governance_inputs:
      - rules/corrections/applied/blocking-governance-merge-20261113-20261113.yaml
    verification:
      - command: go test -p 4 ./cmd/compiler ./cmd/lsp -run 'TestBlockingHover|TestThreadConfigLSP|TestTaskSpawnResult|TestTaskFailureDomainDiagnostics|TestSpawnGrammar|TestNamedThreadConfiguration' -count=1 -timeout=120s
        result: PASS on 2026-11-13; existing concurrency tooling regression subset only.
      - command: go test -p 4 ./internal/parser ./internal/sema -run 'Event|Subscription|Spawn|Task|Thread|Select|Atomic|ISR|NoBlock|Blocking' -count=1 -timeout=120s
        result: PASS on 2026-11-13; existing frontend regression subset only, not runtime conformance.
