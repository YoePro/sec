schema_version: 1
updated: "2026-08-14"
purpose: >-
  Canonical implementation ledger for compiler and tooling work. Normative
  language behavior remains in rules/, while implementation status is migrated
  here as rulebooks are rewritten.

status_values:
  implemented: The described scope is integrated and verified.
  partial: A usable vertical slice is integrated, with listed work remaining.
  planned: The scope is documented but no implementation slice is integrated.

integrations:
  - id: tooling.lsp-same-module-analysis
    area: tooling
    status: implemented
    integrated: "2026-08-14"
    summary: >-
      Analyzes every valid sibling source declaring the active file's module
      as one compiler-owned semantic program, including unsaved editor
      snapshots, so declarations resolve consistently across module files.
    rules:
      - rules/projects/modules.md
      - rules/projects/projects.txt
      - rules/tooling/lsp.md
    code:
      - cmd/lsp/main.go
      - internal/lsp/server/documents.go
      - internal/lsp/server/module_sources.go
    tests:
      - cmd/lsp/main_test.go
      - internal/lsp/server/module_sources_test.go
    implemented:
      - deterministic same-directory .sec discovery and same-module filtering
      - active in-memory source retained while assembling sibling AST statements
      - open sibling snapshots take precedence over their on-disk contents
      - one Sema analysis supplies diagnostics, completion, hover, definitions, highlights, semantic tokens, and call hierarchy
      - cross-file definition locations retain the declaring file URI and range
      - diagnostics are published only for the requested source while sibling declarations contribute semantic facts
      - opening, changing, saving, or closing one module document refreshes diagnostics for open sibling documents
      - malformed siblings are isolated until their own document analysis instead of poisoning every open file in the module
    verification:
      - command: go test ./cmd/lsp -run 'SameModule|CoreInt|OpenSibling|DifferentModule' -count=1
        result: passed

  - id: frontend.modules
    area: frontend-projects-and-resolution
    status: partial
    integrated: "2026-08-14"
    summary: >-
      Establishes the canonical Sec module model shared by compiler and tooling.
      The first integrated slice provides host-independent logical import-path
      validation, root-qualified ModuleIdentity, plan-qualified ModuleInstance,
      deterministic dependency graph ordering and SCC cycle reports, parser
      rejection of dotted module declarations, and existing deterministic LSP
      same-directory assembly. Full project/std/platform resolution, file-local
      binding tables, surfaces, visibility, and incremental invalidation remain.
    rules:
      - rules/projects/modules.md
      - rules/projects/projects.txt
      - rules/foundations/grammar.md
      - rules/foundations/names_scopes_visibility.md
      - rules/foundations/lexical_structure.md
      - rules/compiler/compiler_pipeline.txt
      - rules/compiler/semantic_ir.txt
      - rules/platform/platform_model.md
      - rules/tooling/diagnostics.txt
      - rules/tooling/lsp.md
    code:
      - internal/modules/model.go
      - internal/modules/graph.go
      - internal/parser/parser.go
      - internal/lsp/server/module_sources.go
      - cmd/compiler/main.go
      - cmd/lsp/main.go
    tests:
      - internal/modules/model_test.go
      - internal/modules/graph_test.go
      - internal/parser/parser_test.go
      - internal/lsp/server/module_sources_test.go
      - cmd/compiler/main_test.go
      - cmd/lsp/main_test.go
    implemented:
      - root-qualified canonical ModuleIdentity distinct from short source ModuleName
      - CompilationPlan-qualified ModuleInstance identity without changing logical ModuleIdentity
      - host-independent canonical import-path validation rejecting empty components, traversal, absolute paths, backslashes, and trailing separators
      - parser rejection of dotted source module declarations with a dedicated explanatory diagnostic
      - platform and regression sources migrated from legacy dotted module declarations to canonical short ModuleName declarations
      - cross-module platform syscall entry points made explicitly public instead of relying on legacy dotted-name visibility grouping
      - single, aliased, and grouped import syntax with canonical-path validation
      - deterministic ModuleGraph storage, duplicate-edge and self-import rejection, strongly connected components, representative cycle paths, and dependency-first topological ordering
      - deterministic same-directory LSP module assembly with editor overlays and shared declaration analysis
      - partial project, std, and platform source import discovery with deterministic source-file ordering
    remaining:
      - enforce one source directory per module and validate every selected source file's ModuleName against its directory or project-root rule
      - assemble every CompilationPlan module namespace before body analysis in the command-line compiler, independent of filesystem and source-file order
      - preserve source-file ownership for private declarations while exposing module-internal declarations across all sibling source files
      - replace flattened imported AST inclusion with source-file-local import binding tables and module-wide dependency-edge union
      - resolve canonical project, std, and platform ImportRootIdentity values without reserved-root fallback into project sources
      - validate every resolved import destination's module declaration, source membership, and active-plan selection
      - derive default qualifiers from resolved ModuleName and support aliases without rewriting declaration or module identity
      - enforce per-file qualifier uniqueness and require aliases when distinct ModuleIdentities share one ModuleName
      - reject duplicate canonical ModuleIdentity imports per source file and integrate canonical self-import checks with resolver diagnostics
      - keep imported declarations qualified, prevent implicit name injection and re-export, and reject unsupported selective and wildcard imports
      - enforce internal-directory access during canonical resolution before declaration visibility checks
      - integrate the canonical ModuleGraph into compiler and LSP resolution, cycle diagnostics, and CompilationPlan processing
      - retain deterministic navigable import-edge locations in cycle reports
      - keep logical ModuleIdentity stable across Variants while separating plan-specific ModuleInstance graphs and selected sources
      - implement canonical ModuleSurface creation from public declarations and reject public signatures exposing inaccessible semantic types
      - construct stable cross-module declaration identities from ModuleIdentity and owning declaration identity
      - retain module graph facts for initialization consumers without treating dependency order as initialization order
      - discover only the source graph reachable for the active Target and CompilationPlan
      - add deterministic ModuleSurface fingerprints and compatible separate-compilation serialization
      - invalidate importer resolution only as permitted by semantic surface changes, with conservative fallback when equivalence is unproven
      - add dependency-driven SourceFile to ModuleInstance to ModuleSurface incremental invalidation
      - share the complete canonical resolver between command-line compilation and LSP completion, navigation, rename, and diagnostics
      - add structured diagnostics for inconsistent module declarations, unresolved imports, illegal internal access, duplicate imports, qualifier collisions, cycles, and inaccessible public signatures
      - preserve original import spelling, resolved identity, local qualifier, source location, access cause, and CompilationPlan in diagnostic facts
      - add multi-module integration tests for same-name modules, file-local bindings, roots, case sensitivity, internal access, graph shapes, Variants, surfaces, invalidation, and scheduling determinism
    excluded:
      - implicit import re-export
      - selective and wildcard imports
      - conditional-import source syntax
      - source-level dotted module declarations
      - module graph as an implicit initialization or deinitialization order
      - ABI, mangling, or linker spelling defined by ModuleSurface
    verification:
      - command: go test ./internal/modules ./internal/parser -run 'Module|Import' -count=1
        result: passed

  - id: tooling.lsp-try-result-hover
    area: tooling
    status: planned
    integrated: "2026-08-14"
    summary: >-
      Makes hover at try and its operand explain the callable's declared
      carrier, the value produced on success, and the exact failure-handling
      path. This keeps ordinary absence in Option distinct from typed failure
      in Result and makes bodyless propagation visible to the user.
    rules:
      - rules/errors/errorhandling.txt
      - rules/tooling/lsp.md
    remaining:
      - show the operand callable's exact declared Option[T] or Result[T, E] return type
      - for valid try over Result[T, E], show that the try expression itself produces T rather than Result[T, E]
      - for bodyless try, show the propagated E and the enclosing function's required Result[U, E] return type
      - distinguish bodyless propagation from a local try handler and identify where Err is consumed
      - explain that Option[T] represents ordinary absence, is not an error channel, and cannot be propagated with try
      - consume ResolvedTryOf and resolved callable facts from Sema without reconstructing Result or Option semantics in the LSP
      - add hover tests for Result propagation, local handling, Option-returning calls, invalid try operands, and mismatched enclosing error types

  - id: frontend.static-declarations-members
    area: frontend-analysis-and-lowering
    status: partial
    integrated: "2026-08-14"
    summary: >-
      Tracks revision-2.0 static storage and type-associated member semantics.
      The frontend recognizes static storage and functions and resolves the
      established type-qualified storage path, while compile-time
      initialization, static properties, specialization, concurrency proofs,
      deterministic destruction, and explicit backend representation remain
      incomplete.
    rules:
      - rules/declarations/static.md
      - rules/declarations/impl.md
      - rules/declarations/properties.md
      - rules/foundations/grammar.md
      - rules/foundations/attributes.md
      - rules/compiler/semantic_ir.txt
    code:
      - internal/lexer/lexer.go
      - internal/ast/ast.go
      - internal/parser/parser.go
      - internal/sema/analyzer.go
      - internal/sema/types.go
      - internal/sema/call_graph.go
      - cmd/lsp/main.go
    tests:
      - internal/lexer/lexer_test.go
      - internal/parser/parser_test.go
      - internal/sema/analyzer_test.go
      - internal/sema/concurrency_test.go
      - cmd/lsp/main_test.go
    implemented:
      - static keyword tokenization and declaration-position parsing
      - static let and static let mut parsing at module, function, and impl-member positions
      - static fn parsing and AST classification, including receiver-free interface requirements
      - ordinary impl fn declarations remain instance-bound with compiler-provided implicit self while static fn bodies receive no self
      - static-let symbols are classified with Static storage origin by Sema
      - type-associated static storage is registered under its qualified type member identity and supports Type.Name reads
      - static functions participate in resolved static-method calls and compiler-owned call-graph dispatch facts
      - static storage declarations in primary and same-module impl extends fragments enter the combined semantic member surface
      - static members remain separate from nominal instance fields and layout
      - compiler-known static properties and functions participate in LSP member completion through the shared Sema registry
    remaining:
      - verify and complete static overload/member distinction and duplicate diagnostics across every primary and extension fragment member category
      - complete Type.Name writes and targeted diagnostics rejecting instance-qualified access to static storage, methods, and properties
      - add static property AST classification, parser, formatter, Sema, LSP, interface conformance, and lowering support with mandatory explicit setter parameters
      - ensure function-local static declarations use one persistent storage location rather than ordinary per-invocation local lowering
      - enforce compile-time-evaluable static initializers and reject runtime calls without synthesizing startup or lazy-init functions
      - resolve source-order-independent static initializer dependencies and diagnose cycles
      - specialize generic static storage independently for every concrete monomorphization
      - analyze statically provable unsynchronized shared mutable access and unsafe mutable-reference escape
      - remove redundant module-level static during canonical formatting and optionally provide an informational LSP diagnostic
      - represent StaticStorage, StaticLoad, StaticStore, StaticMethod, StaticProperty, StaticInitialize, and StaticDestroy explicitly or unambiguously in Semantic IR
      - lower static storage, initialization, access, mutation, specialization, and target-supported deterministic destruction through Sec MLIR and LLVM
      - preserve dependency- and use-constrained shutdown order without promising destruction after forced termination
      - verify that static never implies linker section, absolute address, MMIO, memory space, or another physical placement policy
      - add the revision-2.0 parser, Sema, formatter, LSP, concurrency, Semantic IR, and backend regression matrix recorded by the static rulebook
    verification:
      - command: go test ./internal/lexer ./internal/parser ./internal/sema ./cmd/lsp -run 'Static|static' -count=1
        result: passed; current matching parser, Sema, and LSP coverage confirms the integrated frontend subset

  - id: frontend.generics-v2
    area: frontend-analysis-and-lowering
    status: partial
    integrated: "2026-08-14"
    summary: >-
      Tracks revision-2.0 compile-time type generics and demand-driven
      monomorphization. Generic structs, functions, unions, interfaces, impl
      scopes, inference, substitution, nominal instance caching, and basic
      constraint declaration validation have substantial frontend support;
      multi-constraints, partial explicit prefixes, method-level generics,
      explicit conformance checks, complete specialization identity, and
      concrete-only backend lowering remain incomplete.
    rules:
      - rules/declarations/generics.md
      - rules/declarations/impl.md
      - rules/declarations/interfaces.md
      - rules/foundations/grammar.md
      - rules/types/types.md
      - rules/compiler/semantic_ir.txt
    code:
      - internal/ast/ast.go
      - internal/parser/parser.go
      - internal/parser/expression.go
      - internal/sema/analyzer.go
      - internal/sema/types.go
    tests:
      - internal/parser/parser_test.go
      - internal/sema/analyzer_test.go
      - internal/sema/copy_move_test.go
      - testdata/generics_valid.sec
      - testdata/generics_invalid.sec
    implemented:
      - generic parameter parsing on type, function, and interface declarations
      - generic type-argument parsing, nested generic references, and attached explicit generic calls
      - generic declaration arity registration, parameter scopes, and duplicate parameter diagnostics
      - generic struct template instantiation with recursive concrete field substitution and preserved nominal identity
      - canonical caching of repeated concrete generic type instances by declaration identity and ordered arguments
      - generic function template registration, exact full explicit argument calls, argument-based inference, and expected-result inference
      - canonical caching of repeated concrete generic function instances within one analysis
      - generic union template registration, concrete payload substitution, and empty and single-payload construction paths
      - generic impl target correspondence, owning parameter scopes, and concrete nested type and property substitution paths
      - generic interface declaration parsing, header registration, and use of interface-owned parameters in requirement types
      - rejection of unknown constraints and constraints that do not name interfaces
      - conservative copy/move treatment when a generic parameter lacks a proven copy capability
      - direct, array-mediated, and changing-argument recursive generic storage diagnostics with indirection cases retained
    remaining:
      - represent and validate multiple interface constraints joined by & across parser, AST, Sema, formatter, LSP, and diagnostics
      - accept a positional prefix of explicit generic function or method arguments and infer the remainder while rejecting holes
      - implement method-level generics for instance and static methods, including nested owning/method scopes, overload resolution, monomorphization, and lowering
      - reject additional method-level generic parameters on interface requirements while permitting use of the interface's own parameters
      - complete generic named-type semantics for type ID[T] int and valid type Wrapped[T] T forms, including identity, conversions, contracts, and lowering
      - complete concrete generic interface instantiation, inheritance, conformance substitution, and canonical identity
      - require valid explicit interface conformance when satisfying every generic constraint; matching members alone are insufficient
      - retain ordered constraint sets in templates and recheck them for every explicit or inferred concrete substitution
      - ensure generic templates use only operations guaranteed by their declared constraints
      - complete generic primary and impl extends member composition for every substituted member category
      - specialize static storage independently for every concrete generic instantiation
      - complete generic-union layout, match, ownership, destruction, Semantic IR, and backend lowering after substitution
      - detect every non-converging recursive instantiation and report the complete concrete instantiation path
      - assign deterministic cross-module symbol identities to concrete types, functions, methods, and static storage
      - represent generic templates and canonical concrete instances explicitly in Semantic IR with declaration identity, ordered arguments, resolved constraints, substitution, and source provenance
      - prevent unresolved generic parameters or constraints from reaching ABI, FFI, Sec MLIR, LLVM, or any representation-dependent lowering
      - add the complete revision-2.0 parser, Sema, formatter, LSP, interface, ownership, recursion, Semantic IR, ABI, and backend regression matrix
    excluded:
      - generic enums
      - runtime generic dispatch, type erasure, implicit boxing, and runtime reflection-based specialization
      - higher-kinded types, type-parameter packs, variadic type parameters, generic argument holes, and default generic arguments
      - negative constraints, union-of-types constraints, inferred structural conformance, and automatic interface implementation
      - const or value generics without a separate normative rulebook and syntax
    verification:
      - command: go test ./internal/parser ./internal/sema -run 'Generic|Generics' -count=1
        result: passed

  - id: frontend.functions-v2
    area: frontend-analysis-and-lowering
    status: partial
    integrated: "2026-08-14"
    summary: >-
      Tracks revision-2.0 ordinary functions, parameter ownership contracts,
      deterministic call entry, overloads, and native typed variadics. The
      established parser and Sema cover explicit ordinary declarations,
      signatures, bodies, calls, overloads, returns, generics, fixed-array
      spread, and receiver contracts. Owned by-value parameter bindings now
      have the required callee-local mutability and call ownership is committed
      only after every source argument has analyzed successfully; consuming
      arrow parameters now have a verified parser/Sema/tooling slice, while
      native variadic packs and complete callable/backend ownership metadata
      remain major work.
    rules:
      - rules/declarations/functions.md
      - rules/declarations/generics.md
      - rules/declarations/interfaces.md
      - rules/declarations/spread.md
      - rules/foundations/grammar.md
      - rules/memory/ownership.md
      - rules/memory/copy_move.md
      - rules/errors/errorhandling.txt
      - rules/compiler/semantic_ir.txt
    code:
      - internal/ast/ast.go
      - internal/parser/parser.go
      - internal/parser/expression.go
      - internal/sema/analyzer.go
      - internal/sema/types.go
      - internal/sema/semantic_facts.go
      - internal/sema/parameter_usage.go
      - internal/formatter/formatter.go
      - cmd/lsp/main.go
    tests:
      - internal/parser/parser_test.go
      - internal/sema/analyzer_test.go
      - internal/sema/copy_move_test.go
      - internal/sema/semantic_facts_test.go
      - internal/formatter/formatter_test.go
      - cmd/lsp/main_test.go
    implemented:
      - ordinary named fn declarations with mandatory explicit return types and bodies
      - parameter parsing including canonical name colon ref Type and name colon ref mut Type, trailing commas, duplicate diagnostics, resolved parameter and result types, and function-local scopes
      - signature registration before body analysis, including direct and mutual recursion
      - single-value returns, explicit void, result-type checking, and reachable-path return diagnostics
      - basic overload sets distinguished by parameter signature with return types excluded as discriminators
      - exact matches preferred over conversions and ambiguity and no-match diagnostics
      - generic function templates, full explicit specialization, argument inference, expected-result inference, and concrete instance caching
      - implicit concrete method receivers plus explicit shared, mutable, consuming, and static interface receiver contracts
      - calls retain resolved concrete callable and call-dispatch facts for Sema, LSP, and call-graph consumers
      - call and spread-source expressions are analyzed left-to-right
      - outer-call move transfer is applied only after all arguments analyze successfully, so a failed later argument does not consume an earlier direct binding
      - fixed-array argument spread with exactly-once source analysis, increasing-index expansion, and copyability checks
      - owned by-value parameters are mutable callee-local bindings while shared and mutable-reference parameter bindings remain non-rebindable
      - forced-consuming `-> name: T` parameter parsing and AST/Sema retention for ordinary, generic, method, interface, initializer, and lambda parameter-list consumers
      - forced consumption marks copyable as well as move-only caller Places unavailable only after successful outer-call argument analysis
      - consuming ref and ref mut parameter rejection with dedicated diagnostics
      - rejection of overload pairs differing only by ordinary versus consuming parameter mode
      - interface requirements and concrete conformance preserve consuming parameter contracts independently of receiver capability
      - formatter preservation and canonical spacing for consuming parameter arrows
      - LSP function and initializer hover labels expose `-> name: T` from compiler-owned resolved signatures
      - parameter-usage analysis records forced-consuming call demand
      - parameter mutability facts flow from Sema into LSP semantic-token readonly classification without LSP-owned language reconstruction
      - ordinary move-only by-value arguments consume the caller at successful call entry while reference parameters borrow
      - standalone discardable call results and compiler-known must-use result categories participate in Sema validation
    remaining:
      - remove legacy ref name colon Type parameter spelling after migrating remaining formatter, bootstrap, diagnostics, and examples, and normalize legacy and canonical reference modes to one AST and signature identity during the transition
      - preserve forced-consuming parameter modes in first-class callable types, Semantic IR parameter ownership, call ArgumentActions, Sec MLIR, and LLVM lowering
      - add native final `name: ...T` parameter syntax and reject multiple, non-final, and consuming variadic parameters
      - model compiler-known call-lifetime variadic packs with Len, indexing, iteration, re-spread, structural read-only behavior, no Ptr, no escape, and no element move-out
      - implement per-element copy or move transfer for direct variadic arguments and destruction of remaining owned pack elements
      - support runtime-length and multiple spread sources into native variadic destinations while rejecting consuming spread from move-only collections
      - prefer a fixed-arity overload over an otherwise equally ranked variadic overload
      - preserve consuming modes, variadic shape, and concrete specialization in function values and callable compatibility
      - make receiver-capability inference include consuming concrete receivers and complete interface conformance for every parameter ownership and variadic contract
      - represent parameter modes, strict argument order, delayed transfer commit, cleanup edges, and native packs explicitly in Semantic IR
      - lower calls and native packs through Sec MLIR and LLVM without hidden heap allocation or confusion with foreign varargs
      - add exact revision-2.0 diagnostics and the full parser, Sema, ownership, formatter, LSP, Semantic IR, ABI, and backend test matrix from functions.md
    excluded:
      - ordinary bodyless prototypes
      - multiple return values
      - consuming native variadic parameter syntax
      - runtime-generic callables or unresolved overload sets as function values
      - native variadic ABI equivalence with C or foreign varargs
    verification:
      - command: go test ./internal/parser ./internal/sema ./internal/formatter ./cmd/lsp -run 'Consuming|FunctionHoverShowsConsuming|OwnedParameters' -count=1
        result: passed

