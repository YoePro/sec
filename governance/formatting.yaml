          - "MD-036/MD-054 project configuration (2026-10-12, formatter.md § 4(18)-(23), projects.md § 6(8)-(10)): internal/project.ParseManifestFormat reads the [format] table of .sec/sec.toml (the § 4(5) keys only; unknown keys, wrong value kinds, duplicate keys and a second table are manifest errors); internal/formatconfig resolves explicit invocation options over [format] over the § 4(5) defaults (language_corrections = false), validates format_version = 1, indentation_width, vertical_style, width_mode and the width settings, and finds the owning project by the same nearest-.sec/sec.toml rule as the compiler and LSP; sec fmt adds --indentation-width, keeps --fix as the explicit language_corrections override, validates every file's configuration before writing any file, and never rewrites the manifest; LSP formatting uses the same resolver and returns no edit for an invalid configuration (TestResolveAppliesOverridesManifestAndDefaults, TestResolveRejectsInvalidConfiguration, TestForSourceUsesTheOwningProject, TestFmtCommandUsesProjectFormatConfiguration, TestLSPFormattingUsesProjectFormatConfiguration)"
        remaining:
