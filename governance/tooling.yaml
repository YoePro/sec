      - Current frontend already emits selected move/resource/defer diagnostics with related source locations.
      - Formatter/LSP already preserve several ownership/move constructs and expose initial ownership facts.
      - Shared Sema accepts repeated discard of already unavailable discardable Places and retains resolved operand facts, so LSP diagnostics do not duplicate stale use-after-discard logic.
