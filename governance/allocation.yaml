      - "AllocationContextFacts/AllocationContexts expose source-qualified canonical context/domain evidence for represented allocation sites: runtime string plans preserve actual implicit profile/availability/origin; typed Arena allocation results preserve the explicitly selected analysis-local domain and receiver; Arena constructors expose their created domain separately from unresolved backing selection"
      - sec analyse and LSP share context descriptions for every synchronously reachable allocation site, with shortest canonical paths through recursion/defer and no spawned-context leakage; LSP also appends exact operation-point context hover to string operators and compiler-known Arena members
      - unavailable noalloc/freestanding contexts, unknown foreign/indirect selection, missing result types and conflicting source metadata remain explicit rather than acquiring guessed ambient contexts or domain identities; folded strings have no runtime context site; full general context propagation and target/profile semantics remain owned by frontend/analysis/target-policy allocation
      - "CallGraph.AllocationCause reconstructs a deterministic detached source witness for the canonical @noAlloc allocation/unknown path: policy root, every same-stack call site, introducing callee declaration and terminal operation; source gaps stay incomplete and spawned execution is excluded"
      - S1108 carries AllocationCause without changing validity or emitting extra diagnoses; compiler human/JSON output adds ordered allocation.cause notes and deduplicated related source links, while LSP consumes the same witness with cross-file unsaved UTF-16 navigation and accurate introducing-operation labels
      - ordinary, deferred and recursive transitive violations, unknown foreign behavior, immutable witnesses, owning terminal-location parity, single diagnostic identity, duplicate-link suppression and overlay/source-gap handling are verified; broader operation coverage and ISR/target-policy diagnostics remain owned by their existing integrations
      - published LSP module facts retain the compiler-assembled transitive source dependency closure; open/change/save/close invalidates the edited module and open dependent modules, replacing import dependencies after reanalysis and conservatively refreshing unknown/unresolved closures
      - allocation effects/context/cause facts are recomputed from each current Sema snapshot and target plan; manifest/watched-file/configuration refresh invalidates queued active-plan work and retained/in-flight cross-target diagnostics, preventing old imported contracts or profile facts from being merged into current results
      - snapshot changes during an otherwise current batch discard the result and requeue analysis rather than stranding prior diagnostics; source dependency metadata is published only with a current batch; unrelated analyzed modules retain their generations and cross-target results
      - body and trusted extern-contract edits, import replacement/removal, closed-file changes, closing allocating overlays, hosted/freestanding/hosted profile reloads, obsolete job rejection, cross-target eviction and reused-Sema summary replacement at all depths are verified; cross-target recomputation retains the existing open/save scheduling policy
      - compiler, sec analyse and LSP consume canonical Sema allocation facts and mandatory S1098/S1108 occurrences under the same selected target; every LSP analysis entry supplies the current AST so active source target directives, including unsaved edits, select the registry plan before manifest defaults while dependency directives do not replace the active profile
