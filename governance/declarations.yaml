      - no-shadowing enforcement exists for some inherited value-symbol scopes but is not a unified rule across parameters, members, types, generics, imports, aliases, and compiler-provided contextual bindings
      - the compiler maintains separate symbol, type, generic-type, function, and member registries rather than one uniformly collision-checked declaration namespace
