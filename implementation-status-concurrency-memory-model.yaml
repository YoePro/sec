fragment:
  id: concurrency-memory-model-v2
  merge_target: implementation-status.yaml
  generated_for_rulebook: rules/concurrency/concurrency_memory_model.md
  repository_baseline: 0f5027d
  document_revision: "2.0"
  sec_language_version: "0.1"
  generated_at: "2026-09-06"
  purpose: >
    Synchronize the Sec concurrency memory model with exact MemoryOrder,
    per-atomic modification order, normative release sequences, CompareExchange
    success/failure semantics, explicit fences, task/thread completion, canonical
    race-analysis ownership, Semantic IR and CompilationPlan lowering.
  codex_instructions:
    - Reconcile with existing implementation-status entries; do not duplicate stronger/newer evidence.
    - Treat modification order and release sequence as normative Sec concepts.
    - Release sequences continue only through contiguous RMW modifications on the same atomic object.
    - Successful CompareExchange is RMW; failed CompareExchange is read-only.
    - A plain Store breaks the previous release sequence.
    - Implement real fence synchronization semantics, not only backend fence emission.
    - Two fences do not synchronize without qualifying atomic communication.
    - Keep volatile distinct from synchronization.
    - Keep data-race analysis in data_races.md; this rulebook supplies memory-model facts.
    - Use canonical CamelCase atomic API spellings in tests and diagnostics.
    - Do not hard-code a compiler-host memory model or target width as language truth.

