  - id: tooling.lsp-expected-type-member-completion
    area: tooling-lsp
    status: implemented
    integrated: "2026-10-03"
    summary: >-
      Member completion written directly as a returned value offers only members
      whose value type matches the expected return type, including property
      getters whose expected type is the property type (user decision
      2026-10-03: only, not merely ranked first).
    rules:
      - rules/tooling/lsp.md
      - rules/declarations/unions.md
      - rules/foundations/operators.md
    code:
      - cmd/lsp/main.go
      - cmd/lsp/state_test_completion.go
      - cmd/lsp/subject_completion.go
      - cmd/lsp/expected_value_completion.go
      - internal/sema/value_assignability.go
    tests:
      - cmd/lsp/expected_type_completion_test.go
      - cmd/lsp/expected_value_completion_test.go
      - cmd/lsp/state_test_completion_test.go
      - testdata/lsp/state_test_completion/context.sec.in
    implemented:
      - property getter bodies supply the property's declared Sema type as the expected return type, alongside function and method bodies
      - "`return receiver.` member completion filters fields, properties, events, compiler-known members, static symbols, enum members, and union variants by their type, and methods by any overload's return type"
      - the receiver of a selector chain is located over identifiers, dots, and balanced call and index groups, so `return self.inner.` is also a return-value position
      - inside a property getter the property itself is not offered on self, since returning it would recurse
      - member completion outside a direct return value stays unfiltered
      - "comparison operands (2026-10-03): the right operand of == or != completes only the left operand's type, with qualified enum members, bool literals, and visible symbols and functions of that type, and `== receiver.` filters members by that type"
      - "switch case items (2026-10-03): `case` in a subject switch offers the subject type's values and omits enum members already named by another case"
      - "match arm patterns (2026-10-03): a new arm line offers the subject's uncovered qualified enum members, bare union and Option variants, or Ok and Err for a Result, followed by `_`; arms with guards do not count as covering"
      - the in-progress case or arm line is blanked and a comparison gets a placeholder operand so the enclosing construct parses; identifier subjects fall back to their resolved Sema binding
      - "`is` state tests offering the subject's variants"
      - is/is not completion uses shared analyzed subject types to offer only union variants, Option Some/None and Result Ok/Err, with prefix filtering, valid one-owner qualifiers and deterministic ordering; supports member and call subjects, stored/returned booleans, incomplete if/while headers, grouped tests, negation, Unicode and CRLF positions without introducing payload bindings or wildcards
      - a focused state_test_completion.go recovers only the unfinished variant and consumes shared cached compiler analysis; unknown/non-union subjects and mismatched owners yield no guessed variants, and lexical tokens distinguish tests from strings, comments, payload bindings and contextual members named is
      - "expected value positions (2026-10-26): a selector written directly as the value of a typed let (binding type), an assignment (target binding type), a call argument (parameter type of the resolved call or the only overload of that arity; ref and variadic parameters excluded), a struct literal field (declared field type) or a match arm value (Sema's match type or the agreeing other arm types) completes only members of that type; untyped lets and selectors nested in larger expressions stay unfiltered"
      - "assignability (2026-10-26): every expected-type filter asks Sema's ValueAssignable (canInitialize for typed values) instead of comparing type names, so the one-way concrete-error-to-error widening, references, unit quantities and Sema's contextual conversions follow the compiler exactly"
    remaining: []
    reconciliation:
      - "the former remaining item named widening, Option/Result wrapping, generic instantiation and interface satisfaction; Sec has no implicit typed scalar widening (types.md typed scalar identity, typecompatibility matrix) and no implicit Some/Ok wrapping (Sema rejects `let x: Option[int] := y`), so the LSP offers exactly what Sema's assignability accepts and invents no further relation"
    verification:
      - command: go test ./cmd/lsp ./internal/sema ./internal/lsp/...
        result: passed on 2026-10-26 with TestMemberCompletionUsesExpectedValueTypes and TestExpectedTypeCompletionFollowsSemaAssignability; TestCompletionKeepsNamedStringOptionFlowAndEnumMembers now targets its intended untyped `let n := value.` site (the first `value.` is a typed uint let, which correctly filters)
      - command: go vet ./cmd/lsp ./internal/sema
        result: passed on 2026-10-26
      - command: go test ./cmd/lsp ./internal/lsp/... -count=1
        result: passed on 2026-10-14; complete LSP, protocol and server suites; final operator-word guard also passed in targeted race verification
      - command: go vet ./cmd/lsp ./internal/lsp/...
        result: passed on 2026-10-14
      - command: go test -race ./cmd/lsp -run 'TestStateTestCompletion|TestComparisonCompletion|TestMatchArmCompletion|TestSwitchCaseCompletion|TestBlankLineOutside|TestServerAnswersConcurrentRequestsExactlyOnce' -count=1
        result: passed on 2026-10-14; variant and qualifier completion, negation, incomplete headers, Option/Result, stored/returned tests, member/call subjects, grouped expressions, Unicode/CRLF and exclusion of comments, strings, payload bindings, contextual members and operator-word replacement; previous subject completion and concurrent request handling remain verified
      - command: go test ./cmd/lsp -run MemberCompletion -count=1
        result: passed on 2026-10-03 for a FileMode getter offering only FileMode fields and methods without the getter's own property, an unfiltered non-return selector, and a string method return
      - command: go test ./cmd/lsp -run 'Comparison|SwitchCaseCompletion|MatchArmCompletion|BlankLineOutside' -count=1
        result: passed on 2026-10-03 for == and != self. operands, an uncovered switch case, union, Option, and Result match arms, and unchanged global completion on a blank line outside match
