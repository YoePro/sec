        result: passed
      - command: go run ./cmd/compiler emit-mlir testdata/ir/test_ffi_link_name.sec -o /tmp/sec-ffi-link-name.mlir --verify
        result: passed
      - command: clang LLVM IR verification
        result: passed
      - command: go test ./internal/sema ./internal/diagnostics -run 'TestExternRejectsUnresolvedGenericDeclaration|TestRegistryIsValid|TestKnownDiagnosticSeverities' -count=1
        result: passed; unresolved generic extern declarations are rejected without losing later concrete declarations
      - command: go test ./cmd/lsp -run TestAnalyzePublishesUnresolvedGenericExtern -count=1
        result: passed; LSP publishes the shared S1041 diagnostic at the generic parameter
      - command: go test ./...
        result: passed after the FFI frontend change and governance migration
      - command: "go test ./internal/parser ./internal/sema ./internal/layout ./internal/formatter -run 'Foreign|TestCFundamental|TestUnresolvedForeign|CABI' -count=1"
        result: passed on 2026-10-02 with parsing, malformed and unsupported forms, per-model widths and signedness, distinct-type initialization, literal shaping, explicit conversions, owning diagnostics, model coherence, and formatter contiguity
      - command: "go test ./cmd/compiler -run 'TestTargetsCarryCoherentCABIModels' -count=1"
        result: "passed on 2026-10-02; every registered target plan validates, and C::long := 3000000000 is accepted for linux-amd64 but rejected for windows-amd64 through sec analyse --target"
      - command: go test ./... -count=1
        result: passed across all packages on 2026-10-02
      - command: "go test ./internal/sema -run 'TestForeignSignatures|TestExternFunctionValidation' -count=1"
        result: passed on 2026-10-02 with six legal multi-type signatures and nineteen rejected forms across parameter, referent, and return positions for C and system
      - command: "go test ./internal/parser ./internal/sema -run 'TestParseNullTestCondition|TestNullSentinel' -count=1"
        result: passed on 2026-10-02 with if/while is null, annotation/assignment/return/argument contexts, shadowing, missing unsafe, missing context, equality in both operand orders, non-pointer subjects, and the rejected negated form
