    implemented:
      - canonical access, mutation, ownership, lifetime, identity, shape, storage, representation, and precision dimensions
      - deterministic per-callable summaries for explicit parameters and implicit impl receivers
      - immutable Analyzer snapshot API with defensive structural cloning of types, Places, projections, uses, and demand sets
      - local read, field and element write, index, slice, iteration, reference formation, and explicit move evidence
      - canonical Place evidence for fields, constant and dynamic indexes, and half-open slices
      - random-access, sequence, known-range, and constant minimum-extent shape demand
      - direct resolved ref and ref-mut call-boundary demand plus dimension-specific conservative unknown demand for unresolved and foreign calls
      - returned, retained, transferred, task, thread, and foreign lifetime demand consumed from escape summaries
      - copied projected returns no longer create false returned-lifetime or address-identity demand
      - explicit <- call arguments attribute consumption demand to the underlying caller Place
      - focused regressions for unused parameters, field reads and writes, indexing, iteration, returned borrows, implicit self, and snapshot immutability
      - transitive direct-call demand propagation for ordinary parameters and method receivers with translated Place projections
      - declaration-order-independent monotone fixed-point solving over call-graph SCC ordering, including recursive and mutually recursive callables
      - bounded propagated projection depth with partial-precision widening and conservative unknown widening when an interactive summary budget is exhausted
      - interprocedural convergence metadata in immutable analysis snapshots
      - A2001 is emitted after demand convergence only for exact call-only, non-mutating, value-identity, representation-neutral BorrowSufficient parameters
      - explicit reference and consuming declaration contracts block the shared-reference advisory
      - large-value size estimation is recommendation evidence and does not mutate semantic demand
      - Sema-proven never-executed if paths are excluded from parameter demand while conditions and all conditionally reachable paths remain represented
      - statements after return, panic, checked unreachable, loop control, and other proven block terminators do not contribute parameter demand
      - compiler-owned if continuation facts suppress following-block demand when every semantically reachable branch terminates
      - direct by-value parameter uses contribute WholeValue shape demand, while projected field/index access and direct reference flow retain their narrower independent shape and identity facts
      - compiler-known dynamic-array, list, map, and set operations that add, remove, or clear elements consume canonical member-operation contracts and produce exact StructuralMutation demand on the resolved receiver Place, distinct from ordinary element or field writes
      - "`sec analyse` and `sec analyse --all` run parameter usage analysis by default at Deep depth and report the declared capability and the access, mutation, ownership, lifetime, identity, shape, and precision demand of every receiver and parameter in the selected sources"
