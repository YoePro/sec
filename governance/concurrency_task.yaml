      - command: go test -p 4 ./internal/sema ./internal/ir/semantic -count=1 -timeout=120s
        result: "passed 2026-11-11: complete Sema 21.400s and Semantic IR 8.471s."
      - command: go test -p 4 ./internal/sema ./cmd/compiler ./cmd/lsp -run 'PanicMetadataCore|CompilerKnownPanicInfo' -count=1 -timeout=90s
        result: "passed 2026-11-11: Sema 0.031s, compiler 1.021s, LSP 1.952s; exact five-field source and uint32 ID, 32/64-bit contexts, copyability, same source/fallback and TaskOutcome identity, provenance spoof rejection, six malformed trusted declarations, ordinary CLI use and LSP navigation to real core source."
      - command: go test ./internal/sema ./cmd/lsp -run 'Test(Spawn|Await|TaskOutcome|CompilerKnownTaskErrorHasExactVariants|TrustedCoreOwnsTaskOutcomeDeclarations|HoverUsesCompilerOwnedTaskOutcomeType|CompletionUsesExactCompilerOwnedTaskErrorVariants|SelectValidChannelBranches|SelectRejectsDuplicateTaskBranch|CancelInsideSpawnedLambdaIsAllowed)' -count=1
        result: passed
