    implemented:
      - Established frontend ownership/move state for direct Places, nested fields, selected union payloads, static slice intervals, branches, loops, break/continue, and local aliases.
      - Initial must-closed resource cleanup state for local io.File/io.Directory across branch and loop control flow.
      - Initial defer delayed-use analysis preventing conflicting move/discard before deferred reads.
      - Recursive destruction classification for supported arrays, structs, unions, Result payloads, primitive values, references, raw pointers, slices, and resolved stored fields.
      - Compiler-known lifecycle owners whose cleanup is hidden behind opaque intrinsic representation are non-trivially destructible, including Task, Thread, Arena, Mutex, MutexGuard, Subscription, Channel, Sender, Receiver, and MessageTicket.
      - Destruction classification propagates recursively through aggregates while remaining independent from copy prohibition; @noCopy alone does not make an otherwise trivial value non-trivially destructible.
      - Current frontend distinguishes several moved, returned, discarded, detached, released, and consuming-projection reasons for related diagnostics.
      - Discard of an already unavailable discardable local or tracked field Place is accepted as a frontend no-op without a second read or destruction action; later ordinary use remains unavailable.
      - Supported discard, move, and replacement paths reject invalidation while an overlapping borrow or deferred use requires the Place to remain valid.
    remaining:
      - 'destruction-classification-completion: derive custom-free, imported/foreign owner, concrete interface, generic-instantiation, and every remaining compiler-known lifecycle classification from canonical resolved facts'
      - 'general-cleanup-responsibility: replace narrow File/Directory must-closed tracking with general exact-once destruction responsibility for every non-trivial owned value'
      - 'availability-integration: consume ownership-v2 Available/PartiallyAvailable/Unavailable/ConditionallyAvailable plus separate UnavailableReason/provenance when computing cleanup'
      - 'partial-aggregate-destruction: recursively destroy exactly still-owned Available sub-Places and skip moved/discarded/uninitialized sub-Places'
      - 'conditional-destruction: preserve branch/path-specific ownership and statically eliminate conditional cleanup whenever possible'
      - 'discard-convergence: implement explicit conditional availability/destruction plans, backend no-double-destruction, and new cleanup registration after reinitialization'
      - 'replacement-reinitialization: distinguish Available replacement from Unavailable reinitialization and ConditionallyAvailable mixed replacement/reinitialization with pre-commit semantic validation'
      - 'custom-free-frontend: implement free AST/parser/member registration/Sema body rules, non-callability, no Result/value return, no defer, no self escape/resurrection, no whole-self transfer, and no owned-field move-out in Sec 0.1'
      - 'custom-free-partial-move-ban: reject partial field moves for types defining custom free and identify the free declaration in diagnostics'
      - 'free-field-cleanup: model free body followed by remaining initialized owned-field destruction without duplicate release'
      - 'construction-failure-cleanup: track staged init field/resource acquisition and clean only successfully initialized obligations without invoking completed-value free'
      - 'defer-unified-order: model automatic destruction and defer registration in one source-ordered LIFO cleanup plan while preserving earliest legal destruction'
      - 'result-option-union-cleanup: destroy only active retained payloads and integrate moved-out payload state'
      - 'result-projection-cleanup: preserve the implemented Result.Ok()/Err() ownership consumption through retained-payload transfer and inactive-side destruction/end semantics'
      - 'try-return-cleanup: integrate bodyless try, partial handlers, handler-produced failures, and return try with exact transferred-payload exclusion from local cleanup'
      - 'ffi-allocator-authority: preserve release/deallocator authority and accepted-ownership state for foreign transfers'
      - 'volatile-boundary: ensure ending local snapshots never creates additional volatile/MMIO accesses or hardware reset/clear behavior'
      - 'static-global-destruction: defer to canonical ProgramShutdownPlan/TargetProfile support instead of applying the old blanket global-destruction restriction'
    required_tests:
      - trivial scalar has no required runtime destruction operation
      - opaque compiler-known lifecycle owners are non-trivially destructible and propagate that classification through aggregates
      - '@noCopy without cleanup-bearing fields remains trivially destructible'
      - non-trivial local is destroyed exactly once
      - locals clean in reverse successful registration order when lifetimes otherwise overlap
      - struct fields destroy in reverse declaration order
      - fixed array initialized elements destroy in reverse index order
      - move cancels former-owner cleanup
      - consuming -> call cancels caller cleanup only after transfer commitment
      - return value and return <-value both transfer cleanup responsibility
      - partially moved aggregate destroys only still-owned fields
      - moved/discarded field is never destroyed twice
      - custom-free type rejects partial field move
      - conditional move yields conditional cleanup only on paths still owning the value
      - statically resolvable conditional ownership requires no runtime availability flag
      - discard available value destroys once and converges to unavailable
      - second discard of unavailable Place is legal no-op and performs no destruction
      - discard conditionally available Place destroys only still-owned paths and converges every outgoing path
      - reinitialization of unavailable mutable Place performs no old cleanup and registers new cleanup
      - replacement of available mutable Place destroys old value exactly once before new ownership commits
      - conditional replacement destroys old value only on paths where it still exists
      - create first, defer, create second exits second then defer then first
      - defer-referenced value remains alive until deferred execution
      - fallible init failure cleans only successfully initialized owned fields/resources
      - completed-value free is not invoked for failed partial construction
      - direct value.free() is rejected
      - free cannot return value or Result
      - defer inside free is rejected
      - whole self escape/move from free is rejected
      - owned field move-out from free is rejected in Sec 0.1
      - remaining owned fields destroy after custom free exactly once
      - Result destroys only active retained payload
      - Option destroys Some payload only
      - Result.Ok()/Err() consume correctly without double destruction
      - bodyless try propagation cleans unrelated still-owned locals
      - return try establishes transferred result before local cleanup
      - break/continue clean only exited regions and preserve loop-carried values
      - zero-iteration loop does not destroy never-created iteration locals
