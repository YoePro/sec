    implemented: []
    remaining:
      - "Publication command and source inventory: add a dedicated yamlstatus command with documented source root, output directory and optional deployment base path/URL. Derive book selection and categories from rules/README.md and language-rulebook-status.md with explicit handling of written, living, planned, deferred and repository-sync-pending documents. Publish current canonical books; classify or exclude historical snapshots, package plans, proposals and corrections explicitly rather than publishing every Markdown file indiscriminately. Report inventory/source inconsistencies and unavailable books without inventing content or implementation claims."
      - "Markdown renderer: select and pin a maintained Go Markdown-to-HTML package after evaluating its license, supported syntax and security controls. Render the actual rulebook dialect, including tables, fenced code with language labels, nested lists, blockquotes, inline code, links, images, Unicode and existing raw HTML conventions. Inventory .txt rulebooks and give them an explicit readable publication format or documented exclusion. Keep parsing/rendering in specialized files with templates separate from Go; do not grow the governance-report renderer into a second unrelated subsystem."
