  - id: governance.yamlstatus-rulebook-publication
    area: governance-documentation-publication
    status: implemented
    revised: "2026-11-19"
    created: "2026-11-18"
    summary: cmd/yamlstatus books publishes canonical rulebooks as a deterministic linked static HTML site with configurable checkout/output roots and deployment prefix, root/category indexes, Unicode heading anchors, book/resource links, safe rendering and confined IO, read-only validation, staged manifest-based regeneration and cron-safe destination locking. All tracked requirements are implemented and verified. The governance statistics -html report remains unchanged; documentation status does not establish compiler implementation progress.
    rules:
