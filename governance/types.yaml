      - function-type parsing, semantic identity, assignability, direct callable-value invocation, and capture-independent source signatures
      - RawPtr[T] and RawPtr[void] semantic identities with unsafe conversion, dereference, and pointer-operation validation
      - compiler-known list, map, set, vector, matrix, tensor, tensor_view, Result, Option, Task, Thread, shape, layout, and memory-space identities
      - exact decimal literal semantic interpretation and legacy direct LLVM decimal constants, integer conversion, and return values
      - active int128, int256, uint128, uint256, and decimal128 language identities
      - representability-checked contextual shaping of integer-family literals for comparisons, arithmetic, and non-shift bitwise operators, including fixed-width contexts such as uint32 & 1 and uint32 ^ 1u
      - typed runtime numeric operands remain subject to exact compatibility and are not treated as shapeable literals
