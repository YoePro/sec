    code:
      - internal/sema/generic_cleanup.go
      - internal/sema/cleanup_parameters.go
      - internal/sema/cleanup_registrations.go
      - internal/sema/cleanup_cancellations.go
      - internal/sema/cleanup_assignments.go
      - internal/sema/cleanup_match_bindings.go
      - internal/ir/semantic/generic_cleanup.go
      - internal/ir/semantic/generic_specialization.go
      - internal/ir/semantic/cleanup_producers.go
      - internal/ir/semantic/reference_receiver.go
      - internal/ir/semantic/reference_use.go
    implemented:
      - "GOS-1 (2026-11-16): a specialization resolves the template's copy/move facts for its concrete argument. Template validity already makes every unproven-copy T value a move; the builder reclassifies template types through the substitution (triviallyCopyable/copyClassificationOf), and copy-conditional match bindings become copy-trivial or move (matchPlanOf). T = int keeps trivial copies; a move-only T moves and cancels. Partial moves of a T field out of a parameter use the concrete owner's state."
      - "GOS-2 (2026-11-16): Sema registers owned cleanup for parameters, locals, match/handler bindings, assignments and cancellations whose type mentions a generic parameter (mayRequireDestruction), with the symbolic generic destruction plan (monomorphization.md § 11.4). The specialization resolves each registration against the concrete type: it imports the concrete destruction plans or drops the registration for a concrete no-op destruction. The cleanup plan is read from the template's callable identity."
      - "GOS-3 (2026-11-16): defer, discard, replacement and return transfer of T values lower with concrete facts. A defer reads a T owner. An explicit or implicit discard ends a move-only T with own.discard and its plan. A `let mut x :<- a; x = Keep(<-b)` replacement uses own.replace-place, also in loops. Returns transfer and cancel."
      - "GOS-4 (2026-11-16): the 'generic specialization with the ownership-sensitive argument' boundary is removed. Specialized bodies consume the concrete plans through specialization-aware accessors (generic_cleanup.go). A fresh unit variant `E.Empty` is now an owned argument (also non-generic). TestGenericSpecializationBoundaries and TestGenericErrorOwnershipLoweringBoundary were turned into positive tests, as was the CLI emit-ir check."
      - "GOS-5 (2026-11-16): methods and properties of impl[T] owners with a move-only T specialize per concrete owner. `self.value = Pass(<-v)` through a `ref mut self` (and through any `ref mut` holder) replaces the owned field with its plan (own.replace-place), also for non-generic owners. Properties lower through lowering.user-properties."
      - "GOS-6 (2026-11-16): generic structs and unions holding an owned T are covered: construction (Cell[T] literal, Either[T].Left), payload binding and match moving the payload, field moves out of a T-holding parameter, and destruction with the concrete Cell[main::Box] and Either[main::Box] plans."
      - "GOS-7 (2026-11-16): TestSchema13GenericOwnershipSpecialization runs the place, reference-guard, cleanup, destruction-plan and ownership verifiers on 32/64-bit over testdata/semantic_ir/generic_ownership_specialization.sec. It covers free functions, impl[T] receivers, generic structs/unions, Option/Result payloads, try, defer and loops. Move-only and trivial arguments are checked per specialization."
    revised: "2026-11-16"
    tests:
      - internal/lowering/secmlir/generic_ownership_specialization_test.go
      - testdata/semantic_ir/generic_ownership_specialization.sec
      - internal/ir/semantic/generic_specialization_test.go
