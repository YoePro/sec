package5:
  name: Sec MLIR scalar/storage/call lowering foundation
  goal: Begin explicit dialect conversion toward lower standard MLIR without ownership
    features.
  likely_scope:
  - target representation policy for !sec.int/!sec.uint/!sec.float
  - constant lowering where representation is known
  - trivial local storage lowering
  - direct call normalization when metadata obligation discharged
  - foreign call lower representation retaining ABI metadata
  - conversion target legality tests
  still_deferred:
  - copy/move/destruction
  - borrowing
  - Result/try
  - defer/cleanup
  - aggregates
  - allocation
  - register/MMIO
  - concurrency
