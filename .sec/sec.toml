[project]
name = "sec"
uuid = "e3856637-43bf-4166-bf83-07edd6e03c5d"
imports = []

[version]
major = 0
minor = 1
revision = 0
build = 0
format = "[major].[minor].[revision].[build]"

[build]
backend = "mlir"
profile = "server"
diagnostics = "default"

[analysis]
lsp_depth = "interactive"

[profile.server]
optimization = "none"
debug = "line"
strip = false

[variant.linux-amd64]
os = "linux"
arch = "amd64"
