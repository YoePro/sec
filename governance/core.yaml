area: core
purpose: Compiler-known fundamentals and trusted core surfaces.
integrations:
  - id: core.string-slice-helper
    area: core-and-lowering
    status: partial
    integrated: "2026-08-23"
    revised: "2026-09-25"
    summary: >-
      The checked core API and representation-level behavior exist, but the
      current compiler-known registry and name-specific direct-generator path
      predate the correction that assigns this implementation detail to a
      private privileged-core helper. The compatibility entry now carries and
      enforces its exact sec/core/string.sec owner instead of granting access to
      every trusted core file. The registry and generator cases remain
      temporary until the referenced direct MLIR/LLVM core-body syntax is
      defined and implemented in the frontend.
    rules:
      - rules/compiler/compiler_known_members.md
      - rules/library/core-library.md
      - rules/types/types.md
      - rules/foundations/names_scopes_visibility.md
      - rules/corrections/applied/correction-string-slice-helper-20260823.md
    code:
      - internal/sema/compiler_known_members.go
      - internal/sema/analyzer.go
      - internal/codegen/llvm/statements.go
      - internal/codegen/mlir/generator.go
      - cmd/lsp/main.go
      - sec/core/string.sec
    tests:
      - internal/sema/compiler_known_members_test.go
      - internal/sema/analyzer_test.go
      - internal/codegen/llvm/generator_test.go
      - internal/codegen/mlir/generator_test.go
      - cmd/lsp/main_test.go
    implemented:
      - checked string.Slice validates start <= end and end <= string length before calling the unchecked operation
      - the current compatibility path requires loader-proven core provenance, validates (string, uint, uint) -> string, and records sec/core/string.sec as its exact temporary owner
      - another trusted core source file cannot invoke the source-file-private compatibility helper
      - the current compatibility path keeps the operation out of ordinary LSP completion
      - directly emit pointer offset and end-minus-start length in the AST LLVM and MLIR generators without a helper symbol
      - remove the invalid core implementation that attempted to apply array slice syntax to string
    remaining:
      - define or identify the exact privileged-core inline MLIR/LLVM function-body syntax referenced by the correction
      - implement that syntax in lexer, parser, AST, Sema, formatter, and the applicable backend path
      - move __StringSliceUnchecked into core/string.sec as a real source-file-private helper with a direct low-level body
      - remove CKF-STRING-SLICE-UNCHECKED, its temporary OwnerFile fact, and the name-specific Sema, LSP, LLVM, and MLIR compatibility cases
      - connect backing-storage lifetime facts to the finalized owned-string representation
    verification:
      - command: go test ./internal/sema -run 'TestCompilerKnown(StringSlice|GlobalRegistry)' -count=1
        result: passed on 2026-09-24 with exact owner-file metadata, same-file acceptance, other-core-file rejection, argument typing, and registry coverage
      - command: go test ./internal/codegen/llvm -run TestGenerateCompilerKnownStringSliceUnchecked -count=1
        result: passed on 2026-09-24 after the owner-file increment through the full repository test run
      - command: go test ./internal/codegen/mlir -run TestGenerateCompilerKnownStringSliceUnchecked -count=1
        result: passed on 2026-09-24 after the owner-file increment through the full repository test run
      - command: go test ./cmd/lsp -run TestCompletionExcludesCompilerInternalFunctions -count=1
        result: passed on 2026-09-24 after the owner-file increment through the full repository test run
      - command: go test ./... -count=1 && go vet ./...
        result: passed on 2026-09-24

  - id: core.named-string-member-inheritance
    area: core-member-resolution
    status: implemented
    integrated: "2026-09-10"
    summary: >-
      Resolves privileged-core string instance methods and readable properties
      through a named string type's underlying-type chain without converting
      the receiver or erasing nominal identity, and exposes the eligible member
      surface through LSP completion.
    rules:
      - rules/compiler/compiler_known_members.md
      - rules/library/core-library.md
      - rules/tooling/lsp.md
    code:
      - internal/sema/analyzer.go
      - cmd/lsp/main.go
    tests:
      - internal/sema/compiler_known_members_test.go
      - cmd/lsp/main_test.go
      - testdata/lsp/named_string_underlying_members_valid.sec
    implemented:
      - exact methods declared on the nominal string type retain lookup precedence
      - exact properties declared on the nominal string type retain lookup precedence
      - trusted core methods declared on string are inherited by named string receivers
      - trusted core instance properties declared on string are inherited by named string receivers after exact nominal lookup
      - inherited properties retain getter validation, declaration binding, and their declared result types
      - inherited calls retain the named receiver and the core declaration's parameter and result types
      - IndexOf on a named string returns Option[uint]
      - ByteLen on a named string returns uint
      - LSP completion derives inherited string methods and properties from Sema facts
      - non-string named types do not acquire ordinary underlying methods through this integration
    verification:
      - command: go test ./internal/sema -run TestNamedStringInheritsPrivilegedCoreMembers -count=1
        result: passed
      - command: go test ./cmd/lsp -run TestCompletionKeepsNamedStringOptionFlowAndEnumMembers -count=1
        result: passed
      - command: go run ./cmd/compiler sema testdata/lsp/named_string_underlying_members_valid.sec
        result: passed with 0 errors and 0 warnings
    limitations:
      - Semantic IR lowering of named string parameters remains blocked by the separately governed Package 13 non-scalar parameter limitation
      - The complete net/url module currently stops at missing function bodies in percent.sec before semantic analysis

  - id: compiler.compiler-known-surfaces
    area: compiler-known-types-members-interfaces-platform-identities
    status: partial
    repository_baseline: 998d8d1
    revised: "2026-09-24"
    rules:
      - rules/compiler/compiler_known_members.md
      - rules/compiler/compiler.md
      - rules/compiler/compile_time_evaluation.md
      - rules/corrections/applied/compiler-known-fundamentals-cross-rulebook-correction-20260907.md
    code:
      - internal/sema/compiler_known_members.go
      - internal/sema/analyzer.go
      - cmd/lsp/main.go
    tests:
      - internal/sema/compiler_known_members_test.go
      - cmd/lsp/main_test.go
    implemented:
      - value.SizeOf and TypeName.SizeOf resolve through authoritative read-only compiler-known property entries with uint results
      - the superseded global SizeOf(TypeName) function is absent from the compiler-known function registry, Sema reservation,
        and LSP completion; ordinary user module functions named SizeOf remain legal
      - invalid legacy SizeOf(TypeName) calls receive ordinary unresolved-call diagnostics rather than obsolete intrinsic validation
      - ToString is exposed by the shared compiler-known registry as a universal frontend fallback on concrete value types; an exact user-owned nominal fn ToString() string still wins ordinary method lookup, while differently shaped overloads remain callable without suppressing the no-argument fallback
      - trusted core primitive ToString overloads participate in ordinary method resolution before the compiler-known fallback when their arity is used; byte.ToString(byte.ByteStringFormat) accepts its enum argument while byte.ToString() retains the universal fallback
      - byte, char, and rune arrays/slices resolve to distinct stable sequence-materialization identities; byte sequence ToString returns string and preserves the represented encoded bytes, while rune sequence materialization retains scalar-to-multibyte encoding semantics
    remaining:
      - carry universal and byte/char/rune sequence ToString identities into explicit Semantic IR operations and maintained lowering, including allocation/effect facts and complete per-type-family fallback formatting semantics
      - audit every compiler-known Sec declaration for complete canonical syntax/owning module and mark compiler-only structures explicitly
      - keep compiler authority distinct from ordinary _/__ source visibility
      - expose compiler-known Iterator[T] through one canonical interface registry/conformance path
      - share compiler-known member/interface identities between compiler and LSP
      - route compiler-known platform/resource identities from the frozen CompilationPlan
      - prevent user-defined arbitrary compiler-known extension
      - keep generated helpers/resource identities deterministic and traceable
    verification:
      - command: go test ./internal/sema -run 'CompilerKnown(FundamentalMembers|CanonicalPropertyAndCollectionRestrictions|GlobalRegistryHasStableRequiredIDs)|RemovedGlobalSizeOf' -count=1
        result: passed
      - command: go test ./cmd/lsp -run CompletionUsesCanonicalCompilerKnownGlobalFunctions -count=1
        result: passed
      - command: go test ./internal/sema -run 'TestCompilerKnown(UniversalToStringAndTextSequences|FundamentalMembers)' -count=1
        result: passed on 2026-09-24; universal fallback lookup, exact user replacement, and stable byte/char/rune sequence IDs return string
      - command: go test ./internal/sema -run 'CompilerKnownPrimitiveToStringOverload|CompilerKnownUniversalToString' -count=1
        result: passed on 2026-09-25; trusted core primitive enum-argument overload resolution and the simultaneous parameterless fallback are covered
      - command: go test ./cmd/lsp -run TestCompletionIncludesCompilerKnownMembers -count=1
        result: passed on 2026-09-24; ToString completion is sourced from the shared registry for ordinary arrays and slice views
