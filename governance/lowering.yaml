    summary: "Execution started 2026-10-17 with the Sema range model (package16-todo.md section B). Implemented: exact arbitrary-precision half-open slice projection bounds (P16-09), stable compiler-only dynamic range identities (P16-10), static subrange composition and empty-slice provenance (P16-12), canonical range-error classification (P16-13), and read-only slice creation plans (P16-14). Not implemented: resolved slice index plans, effects, Semantic IR slice types and operations, schema 12 and --sec-verify-slice-guards. Schema 12 depends on schema 11, which the compiler emits and verifies since P15-50..P15-60."
    predecessors:
      - SEC-MLIR-P15 (partial; schema 11, emitter and verifiers implemented 2026-10-17)
    rules:
      - rules/mlir/packages/sec-mlir-dialect_package16.md
      - rules/mlir/packages/sec-mlir-dialect_package16.yaml
      - rules/mlir/normative-sync/sec_slice_sync_v1.md
