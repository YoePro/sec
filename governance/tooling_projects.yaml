        result: passed on 2026-10-13
      - command: go test -race ./cmd/compiler -run 'BuildCLI|ParseBuild' -count=1
        result: passed on 2026-10-13 after final snapshot replanning; actual parallel compiler processes commit consecutive values, failed later Variant and concurrent editor preserve manifest state, named and filtered Target builds share one candidate, explicit numbers affect retained IR without mutation, real clang produces an executable returning the fixture result
      - command: go test -race ./internal/project ./cmd/compiler -run 'BuildInvocation|BuildCLI|BuildNumber|BuildCounter|ParseBuild' -count=1
        result: passed on 2026-10-13; OS lock serialization, canceled waits and explicit bypass, candidate reuse, double-commit prevention and no premature writes
