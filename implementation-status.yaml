    lowering_remaining:
      - lower static ownership state without unnecessary runtime flags
      - lower genuinely dynamic conditional ownership through local SSA or drop-state when policy permits
      - eliminate runtime ownership state when static proof is sufficient
      - conditionally destroy exactly once for discard, replacement, and scope exit
      - commit call transfers atomically at the callee-entry boundary
