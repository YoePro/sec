  - id: lowering.integer-enum-representation
    status: implemented
    summary: Discharges ordinary integer enums and proven-exact enum-to-integer conversions from the P11/P12 semantic boundary into the single source-to-binary track after scalar layout. Sema/Semantic IR exactness contracts cross the emitter and enum erasure boundaries with verifier-checked proof basis and plan width. Native carriers, aliases, defaults, CFG merges, local storage and direct calls remain covered; checked/integer-to-enum conversions, bit-backed enums and physical union/Result/Option representations remain outside this slice.
    rules:
      - rules/declarations/enums.md
      - rules/memory/layout.md
      - rules/mlir/lowering-versions/sec_mlir_lowering_v7.md
      - rules/compiler/compiler_pipeline.md
      - rules/compiler/semantic_ir.md
      - rules/mlir/dialect-versions/sec_mlir_dialect_v11.md
    implemented:
      - sec-lower-integer-enums resolves ordinary enum representations only after scalar layout and before trivial storage and checked-integer lowering; earlier package pipelines retain nominal enums. Constants select exact case values, not ordinals; equality preserves alias semantics; default int carriers follow the 32/64-bit plan.
      - Function parameters/results, enum-valued CFG merge arguments, local storage and direct calls carry the resolved integer representation without unrealized casts. Storage records the resolved carrier's scalar kind for checked-integer normalization.
      - ResolvedEnumConversionOf excludes selected ordinary calls and function-valued callees; enum-shaped argument/result signatures do not authorize replacing a call with a conversion. The focused enum fact queries were extracted from semantic_facts.go into enum_facts.go.
      - Exact enum-to-integer lowering consumes the Sema/Semantic IR proof carried by sec.conversion_proof instead of recomputing case-domain exactness. Missing contracts fail closed, plan-specific contracts must match the module's explicit index layout, and enum erasure preserves the contract on any resulting sec.numeric.convert_exact. Earlier schema enum modules remain readable without the new attribute, but require it to lower.
    remaining: []
