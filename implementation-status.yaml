      - consume canonical interrupt masking, priority, nesting, and exclusion facts to eliminate impossible ISR cycles without moving ISR-specific policy into deadlock analysis
      - consume canonical condition/event progress-provider semantics and model condition waits that release/reacquire a resource according to their actual contract
      - preserve resource-specific reentrancy, capacity, acquisition-count, release, and progress semantics instead of silently treating all synchronization resources as exclusive mutexes
      - add bounded symbolic resource abstractions for dynamic resource collections, including indexed resources and AnyIndex-like widened identities while preserving known roots/projections
      - consume canonical range, index, alias, ownership, and ordering facts so same-resource, proven-disjoint, and sorted dynamic acquisition cases remain distinguishable
      - add dependency-edge evidence carrying source cause, execution context, interprocedural cause path, path-condition summary, and proof strength sufficient for stable cycle diagnostics
      - distinguish ProvenDeadlock, PotentialDeadlock, and Unknown throughout analysis, summaries, diagnostics, and tooling
      - require a sound reachable simultaneously realizable cyclic wait witness before classifying a result as ProvenDeadlock
      - classify meaningful supported cycles with incomplete path, identity, scheduling, capacity, or compatibility proof as PotentialDeadlock rather than ProvenDeadlock
      - keep insufficient dependency information as Unknown rather than fabricating a potential cycle
      - distinguish deadlock findings from failure to prove a positive deadlock-freedom requirement imposed by language, target, runtime, ISR, project, or CompilationPlan policy
      - add path-compatibility reasoning coupled to execution-instance identity so mutually exclusive branches in one instance can still be considered across distinct concurrent instances where permitted
      - consume MayOverlap, CannotOverlap, MayPreempt, MayReenter, completion, and related canonical execution-context facts when deciding cycle realizability
      - add explicit self-deadlock reasoning for non-reentrant resource reacquisition and self-wait dependencies without requiring a second execution context
      - consume guaranteed timeout, cancellation, completion, and other progress facts only when canonical semantics guarantee cycle-breaking progress; merely possible escape must not eliminate a deadlock proof
      - add resource-capacity reasoning sufficient to avoid treating counting or multi-capacity resources as capacity-one locks; preserve PotentialDeadlock or Unknown when capacity precision is insufficient
      - add deterministic cycle detection and SCC condensation over lock-order and generalized wait-for dependency graphs
      - select deterministic representative cycles favoring stronger proof, smaller understandable dependency chains, precise identities, clear source locations, and minimal uncertainty
      - retain compact interprocedural cause paths for every representative cycle edge so diagnostics can navigate through nested calls without dumping the full graph
      - use symbolic path summaries, bounded context sensitivity, SCC condensation, edge aggregation, and widening to avoid exponential path or runtime-instance explosion
      - ensure precision loss may weaken ProvenDeadlock to PotentialDeadlock or Unknown but never strengthen an unsupported result
      - allow increased Deep precision to upgrade PotentialDeadlock to ProvenDeadlock when the missing witness is established or remove it when path/resource/execution incompatibility is proven
      - add scoped positive NoLockOrderCycle or NoDeadlockCycle facts where a partial-order or generalized no-cycle proof is established
      - provide LSP diagnostics with primary and related source locations for acquisitions, waits, completion dependencies, callbacks, and other representative cycle edges
      - present ProvenDeadlock and high-confidence PotentialDeadlock findings as NeedToKnow while keeping positive no-cycle explanations and detailed graph views configurable OptionalInsight
      - ensure Unknown is not presented as PotentialDeadlock and that required deadlock-freedom proof failures receive their own diagnostic category
      - prioritize cycle explanation, navigation, resource order, and cause paths over generic automatic lock-reordering fixes
      - integrate Interactive, Standard, and Deep analysis budgets without introducing a separate global Intermediate analysis mode
      - support progressive LSP refinement from fast Interactive/cached findings through Standard-equivalent analysis and optional Deep precision
      - represent Pending LSP analysis state separately from ProvenDeadlock, PotentialDeadlock, and Unknown and invalidate stale findings immediately when proof dependencies change
      - keep finding identity stable across refinement when the same semantic cycle persists and only proof detail or classification strength changes
      - watch project analysis configuration and refresh affected summaries, findings, graph views, and optional insight without requiring an LSP restart
      - add dependency-driven incremental invalidation for body, callee summary, callable target, resource identity, Place/provenance, acquire/release, guard lifetime, ownership, completion, callback/reentry, FFI, ISR/platform, capacity, CompilationPlan, and schema changes
      - stop unnecessary transitive invalidation when a reanalyzed function produces an exported deadlock summary semantically equivalent to its previous summary
      - invalidate dependent cycle findings when any required supporting edge disappears even if other graph edges remain
      - add versioned separate-compilation summaries carrying symbolic acquisitions, releases, waits, resource-order edges, held-on-return state, execution effects, callback/reentry behavior, and localized uncertainty
      - introduce CompilationPlan dependence only where runtime scheduling, ISR/preemption, platform synchronization, foreign behavior, resource capacity, or callback/reentry semantics actually differ
      - integrate deadlock analysis into default sec analyse all-analysis behavior and support explicit deadlock-only analysis selection
      - expose optional Deep lock-order and WaitForGraph views, unknown-wait causes, held-resource state, resource aliases, join dependencies, callback/reentry edges, ISR/preemption edges, and positive no-cycle proofs
      - add required ProvenDeadlock, PotentialDeadlock, Unknown, safe/non-deadlock, interprocedural, defer/cleanup, task/thread, callable, FFI, ISR, resource-semantics, dynamic-resource, incremental-LSP, performance, determinism, and false-positive regression tests
      - maintain a permanent false-positive regression corpus for partial lock orders, scoped guards, condition waits that release mutexes, nonblocking acquisition, guaranteed timeout, serialized execution, ISR masking, ordered dynamic locks, resource transfer, reentrancy, and join-after-release patterns
      - update implementation-status verification commands when the first conforming vertical slice is integrated

  - id: compiler.platform-model
    area: compiler-platform-and-tooling
    status: planned
    summary: >-
      Adds the canonical Sec platform registry and resolver, producing immutable
      per-Target/per-Variant CompilationPlans with typed architecture, CPU, Device,
      memory, runtime, execution, ABI, link, source-selection, capability,
      fingerprint, diagnostic, and LSP-invalidation facts without host-dependent
      target guessing or duplicated downstream platform resolution.
    rules:
      - rules/platform/platform_model.md
      - rules/projects/projects.txt
      - rules/compiler/compiler.txt
      - rules/compiler/compiler_pipeline.txt
      - rules/memory/storage.md
      - rules/memory/layout.md
      - rules/platform/ffi.md
      - rules/declarations/registers.md
      - rules/platform/fixed-address-bindings.md
      - rules/concurrency/concurrency_runtime_model.md
      - rules/concurrency/concurrency_memory_model.md
      - rules/analysis/stack_analysis.md
      - rules/analysis/data_races.md
      - rules/analysis/deadlock_analysis.md
      - rules/analysis/isr_analysis.md
      - rules/tooling/lsp.md
      - rules/tooling/diagnostics.txt
    remaining:
      - add canonical Target and Variant platform-resolution integration that produces one concrete CompilationPlan for each requested Target x Variant pair
      - keep Target as the logical product and Variant as the concrete platform-specific build configuration throughout compiler and tooling APIs
      - introduce typed canonical identities for platform, architecture, CPU, Device, ABI, TargetProfile, runtime, execution, memory, and link definitions instead of downstream free-form target strings
      - add deterministic alias normalization and reject unknown or ambiguous canonical platform identities
      - add explicit BuildProfile versus TargetProfile separation in platform resolution and downstream plan consumers
      - add immutable registry snapshots and immutable verified CompilationPlan snapshots for each compiler/LSP generation
      - add typed resolved ArchitectureModel facts including CPU baseline, optional TuneCPU, resolved CPU features, pointer/word properties, endianness, alignment, and target hardware capabilities required by consumers
      - support explicit project and CLI CPU selection without implicit host CPU fallback
      - support explicit native-CPU discovery only as a requested resolution step and freeze the detected canonical CPU/features into the plan
      - add optional Device definitions that may provide and constrain architecture, CPU, features, memory regions, MMIO, interrupt inputs, source mapping, and other concrete hardware facts
      - reject incompatible explicit CPU, architecture, ABI, feature, TargetProfile, runtime, execution, and Device combinations regardless of configuration precedence
      - distinguish configuration precedence from compatibility so a higher-precedence override selects only among legal alternatives
      - add canonical MemoryEnvironment identities and facts for address spaces, memory spaces, MMIO, Device regions, and pointer-relevant platform properties without redefining storage ownership/lifetime semantics
      - add canonical RuntimeEnvironment service and helper contracts including availability and relevant MayBlock, MayAllocate, MayPanic, reentrancy, interrupt-safety, and required-context information where needed by analyses/lowering
      - add canonical ExecutionEnvironment facts for threads, tasks, interrupts, scheduling, preemption, nesting, masking, reentry, context transitions, and physical stack domains by referencing the owning concurrency/interrupt models
      - expose resolved preemption/nesting/reentry relationships to race, deadlock, stack, and ISR analyses instead of making those analyses derive platform semantics from raw priorities or OS names
      - add a resolved ABIModel reference selected once by the platform resolver and consumed consistently by lowering, FFI, machine-stack analysis, linking, and debug-information work
      - add a resolved LinkEnvironment for object format, entry conventions, startup requirements, relocation/link capabilities, and target libraries while keeping detailed linking semantics in its own rulebook
      - separate platform semantic capabilities from CompilerTargetSupport and toolchain availability so missing compiler emission/link support is not reported as invalid source or missing hardware capability
      - model capability availability as Supported, Unsupported, or Unknown and capability activation separately as Enabled, Disabled, or NotApplicable
      - reject or defer consumers that require Unknown platform facts instead of guessing from the compiler host or another target
      - add deterministic TargetProfile capability/constraint composition without arbitrary registry inheritance or late overwrite semantics
      - add deterministic default selection for omitted ABI, CPU, and other target facts and reject ambiguous defaults
      - add CPU feature dependency/conflict validation and ensure TuneCPU cannot broaden the CPU capability baseline
      - add platform source selection from canonical resolved identities rather than inferring semantics from directory depth or file presence
      - validate required platform/runtime source implementations before later linker failure obscures missing platform support
      - add canonical resolution provenance so diagnostics/tooling can explain whether an effective value came from a compiler default, TargetProfile, project Variant, Target override, Device, or command-line override
      - add structured platform diagnostics distinguishing unknown definitions, invalid configuration, unsupported combinations, disabled capabilities, missing required capabilities, missing platform implementation, missing compiler support, missing toolchain support, and malformed registry definitions
      - keep Target and Variant identity on plan-dependent diagnostics and support safe presentation grouping without merging distinct per-plan semantic results
      - add declarative external platform/Device definition schema support after the built-in typed registry path is stable; do not require arbitrary executable compiler plugins for target definitions
      - schema-validate external registry definitions and reject unknown references, duplicate identities, illegal overrides, feature conflicts, malformed numeric/address ranges, invalid memory regions, and invalid interrupt metadata before plan resolution
      - enforce project/package source-path trust boundaries for platform source mappings and prevent external metadata from injecting arbitrary host filesystem sources
      - add explicit registry/domain ownership and override/refinement rules so Device metadata may refine concrete hardware facts without redefining underlying architecture/CPU semantics
      - make platform fact derivation acyclic for Sec 0.1 and perform cross-domain compatibility validation after independently resolving the participating models
      - add a CompilationPlan verifier that checks required identities/facts, feature legality, Device constraints, cross-domain compatibility, runtime/execution requirements, source-selection coherence, and fingerprint readiness before freeze
      - prevent arbitrary partially initialized CompilationPlans from becoming valid compiler inputs
