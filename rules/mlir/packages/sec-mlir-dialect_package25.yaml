- param vs return
- multi-part and indirect aggregates
- stack pressure
- sret and hidden context
- safe refs versus RawPtr
- C/system ABI
- C structs/unions/bitfields
- C varargs
- callbacks
- ordinary vs unsafe extern
- negative foreign legality
- no unwind
- ABI fingerprint/cache
- deterministic cross-target cold versus warm
