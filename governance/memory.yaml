    remaining:
      - represent DestroyValue/DestroyPlace/DestroySubPlace/DestroyActiveVariant/ConditionalDestroy or equivalent explicit terminal cleanup semantics
      - represent InvokeFree, allocator-aware DeallocateOwnedStorage, cleanup registration/order, and cleanup regions
      - preserve cancellation of cleanup after move, discard, return, consuming argument, aggregate transfer, and FFI transfer
      - represent Replace versus Reinitialize and the old-destination destruction plan
