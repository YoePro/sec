baseline_confirmed:
- Current layout.md is already a modern canonical layout specification based on concrete CompilationPlan resolution.
- It embeds a Current implementation status section that is removed from the normative v2 book.
- Current rules require declaration-order struct layout, complete sized layout before by-value storage, target-aware SizeOf,
  and backend consumption of Sec-resolved layout.
- Current implementation already has fixed-width scalars, fixed arrays, struct field order, enum underlying types, union variant
  order, register widths and partial target-sensitive SizeOf, but lacks one canonical ResolvedLayout service.
