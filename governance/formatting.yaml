      - internal/cst/delimiter_spacing.go
      - internal/formatter/token_spacing.go
    tests:
      - internal/formatter/formatter_test.go
      - cmd/lsp/main_test.go
    implemented:
      - remove inner boundary padding from same-line parenthesized and bracketed groups
      - normalize top-level comma spacing and remove trailing commas in same-line parenthesized and bracketed groups
      - retain one inner space for non-empty same-line braced groups and compact whitespace-only groups to `{}`
      - expose identical behavior through sec fmt and the shared LSP formatter
      - preserve literal token bytes, comment-bearing group boundaries, unproven syntax and every multiline delimiter boundary while formatting independent comment-free child groups from CST roles
    verification:
      - command: go test ./internal/cst ./internal/formatter ./cmd/compiler ./cmd/lsp -run 'CSTDelimiterSpacing|SingleLineDelimiterRoles|FormatSourceNormalizesSingleLine|FormatNormalizesSameLine|FormatNormalizesSingleLine' -count=1
