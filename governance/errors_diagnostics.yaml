schema_version: 1
area: errors-diagnostics
purpose: >-
  Track implementation of the canonical diagnostic registry, structured
  diagnostic occurrences, diagnostic policy, localization, CLI/LSP identity,
  machine-readable output, mentor diagnostics, and migration from legacy raw
  diagnostic text.
integrations:
  - id: diagnostics.unreachable-statement-s3001
    area: semantic-diagnostics
    status: partial
    integrated: '2026-09-16'
    audited: '2026-09-22'
    revised: '2026-10-04'
    summary: Sema emits the reserved mandatory S3001 diagnostic for the first statement after a terminating statement in a block and for the first statement in an if branch or while body excluded by a literal or currently supported folded integer/boolean condition, with a source range and actionable explanation shared by CLI and LSP.
    rules:
      - rules/tooling/diagnostics.md
      - rules/control-flow/flowcontrol_if.md
    code:
      - internal/diagnostics/diagnostics.go
      - internal/sema/analyzer.go
      - internal/sema/analyzer_control_flow.go
      - internal/sema/analyzer_relational_reachability.go
      - cmd/compiler/main.go
      - cmd/lsp/main.go
    tests:
      - internal/diagnostics/diagnostics_test.go
      - internal/sema/relational_reachability_test.go
      - internal/sema/known_variant_test.go
      - internal/sema/analyzer_test.go
      - internal/sema/concurrency_test.go
      - internal/sema/assert_false_termination_test.go
      - internal/sema/unreachable_branch_test.go
      - cmd/compiler/main_test.go
      - cmd/lsp/main_test.go
    implemented:
      - S3001 control-flow.unreachable-statement is registered as a mandatory semantic error
      - statements after terminating return, break, continue, and other established non-continuing paths retain the error and carry S3001, an exact source range, and actionable help
      - non-empty branches excluded by literal false and literal true conditions report S3001 on their first statement while empty excluded branches remain valid
      - non-empty while bodies excluded by literal false report S3001 on their first statement while the canonical empty form remains valid
      - folded integer comparisons, boolean equality, negation, and short-circuit boolean operators prove excluded if and while paths through the same S3001 diagnostic and immutable ResolvedIfFlow facts
      - statements following folded-true while loops without a reachable current-loop break receive S3001 from the shared non-continuation fact
      - "relational path proof (2026-10-04): an if condition built from integer comparisons (&&/||) over stable bindings and constants that the dominating, unmutated condition facts of the path decide reports S3001 on the excluded branch, with help naming the earlier conditions; else branches and the code after an if whose only continuing branch fixes the condition receive the negated or held condition as a path fact, so contradictions, repeated tests after an exit, and else-if exhaustion are found; the statement-fallthrough query consumes ResolvedIfFlow. A stable binding is immutable, or a mutable working binding (such as an owned parameter) that its function never assigns, mutably borrows, or mentions inside a lambda or spawn; member reads never qualify. Loop bodies start a new mutation epoch so facts from before a loop never decide conditions inside it, and a while condition is a fact at each body entry; a condition that type ranges and contracts decide without any path fact is left to the Deep pitfall.range.meaningless-comparison information (TestDominatingRelationsProveBranchesUnreachable)"
      - "known-variant state tests (2026-10-04): `binding is Variant` on an immutable binding whose active variant is proven by construction or a dominating test reports S3001 on the excluded branch, either direction (governed in declarations.yaml frontend.unions; TestKnownActiveVariantDecidesStateTests)"
      - CLI prints the stable code and help; LSP publishes the same Sema code and help
      - the canonical sec diagnostics S3001 detail command exposes S3001 identity, family, default severity, mandatory/configurable state, and active status from the central registry
    remaining:
      - route additional proven-unreachable paths through the same canonical S3001 diagnostic where their flow proof exists, beyond the constant-condition and stable-binding relational subsets: match and switch arms decided by path facts, member reads with mutation-aware invalidation, and per-binding instead of whole-function stability
      - implement structured localization, richer extended rule explanations, and machine-readable emitted-diagnostic output
    corrections_applied:
      - rules/corrections/applied/compiler-testing-cross-rulebook-correction-20260926.md
    verification:
      - command: go test ./internal/sema ./internal/diagnostics ./cmd/compiler -run 'Test(UnreachableStatementsInsideWhileBody|SwitchCaseReportsUnreachableAfterReturn|InfiniteForWithContinueMakesFollowingReturnUnreachable|CancelOutsideCancellableContext|AssertFalseRejectsFollowingCodeButUnprovenAssertFallsThrough|PrintSemaErrorIncludesStableIDAndDescription|RegistryIsValid|KnownDiagnosticSeverities)' -count=1
        result: passed
      - command: go test ./internal/sema ./internal/diagnostics ./cmd/lsp -count=1
        result: passed, including S3001 LSP code and help
      - command: go test ./internal/sema -run 'TestConstantIfBranchesReportCanonicalUnreachableStatement' -count=1
        result: passed on 2026-09-22 with literal-false, literal-true else, and empty-branch coverage
      - command: go test ./internal/sema -run 'TestConstantFalseWhileReportsCanonicalUnreachableStatement' -count=1
        result: passed on 2026-09-22
      - command: go test ./internal/sema -run 'Test(FoldedBooleanConditionsReportCanonicalUnreachableStatement|ResolvedIfFlowRetainsPathExecutionAndTermination)' -count=1
        result: passed on 2026-10-01 with integer arithmetic/comparison folding, boolean negation and short-circuit proof, known integer bindings, while-body diagnostics, runtime-condition conservatism, and resolved path facts
      - command: go test ./internal/sema -run 'Test(ResolvedWhileFlowRetainsFoldedConditionAndExitFacts|FoldedTrueWhileControlsReturnAndReachability)' -count=1
        result: passed on 2026-10-01 with folded loop-condition facts, post-loop S3001, missing-return separation for reachable breaks, and impossible-break exclusion
      - command: go test ./cmd/compiler -run DiagnosticCatalog -count=1
        result: passed on 2026-09-27 with registry-backed S3001 detail and unknown-ID rejection
      - command: go run ./cmd/compiler sema testdata/sema/assert_false_termination_invalid.sec
        result: printed S3001 with source position and help; exited with the expected fixture error plus four unrelated try errors in sec/core/string.sec
      - command: go test ./...
        result: all packages passed except cmd/compiler on 2026-09-27, which fails on thirteen unrelated missing StringError.InvalidUtf8 payload errors in sec/core/utf8.sec
  - id: errors.diagnostics
    area: errors-diagnostics
    status: partial
    integrated: true
    audited: true
    revised: 2026-10-06
    document_revision: "2.0"
    repository_baseline: main-reviewed-2026-09-30
    replaces:
      - rules/tooling/diagnostics.txt
    canonical_rulebook:
      - rules/tooling/diagnostics.md
    summary: >-
      Revision 2.0 separates stable ID namespace from topic-family metadata,
      preserves every published and retired ID, adopts the published L lexer
      namespace, removes obsolete numeric subject-subrange guidance, makes
      `sec diagnostics <ID>` the canonical detailed lookup, defines the logical
      definition/occurrence/fix schemas, synchronizes explicit discard, and
      keeps mutable implementation status in governance.
    rules:
      - id: diagnostics.identity
        paragraphs:
          - "§ 5"
          - "§ 6"
          - "§ 12"
          - "§ 31"
        requirement: >-
          Every emitted primary diagnostic has one registered stable ID and
          symbolic name; active and retired IDs are never reused.
      - id: diagnostics.namespaces
        paragraphs:
          - "§ 5"
          - "§ 31"
        requirement: >-
          L, P, S, A, B, and F are ID namespaces. Numeric allocation is opaque
          and does not encode semantic subject.
      - id: diagnostics.definition-schema
        paragraphs:
          - "§ 7"
          - "§ 12"
        requirement: >-
          Registry definitions converge on the canonical logical definition and
          argument schemas.
      - id: diagnostics.occurrence-schema
        paragraphs:
          - "§ 8"
          - "§ 9"
          - "§ 10"
          - "§ 11"
          - "§ 14"
        requirement: >-
          Emitted diagnostics converge on the canonical structured occurrence,
          source-location, note/help, and fix model.
      - id: diagnostics.lookup
        paragraphs:
          - "§ 13"
          - "§ 17"
        requirement: >-
          Canonical commands are `sec diagnostics`,
          `sec diagnostics --json`, and `sec diagnostics <ID>`.
      - id: diagnostics.policy
        paragraphs:
          - "§ 4"
          - "§ 18"
          - "§ 19"
        requirement: >-
          Mandatory diagnostics remain errors; configurable diagnostics resolve
          through deterministic rule/category/preset policy. Sec 0.1 defines no
          source-level suppression syntax.
      - id: diagnostics.localization
        paragraphs:
          - "§ 16"
          - "§ 17"
        requirement: >-
          Message rendering is localization-independent from diagnostic identity,
          with English as canonical fallback.
      - id: diagnostics.lsp
        paragraphs:
          - "§ 15"
        requirement: >-
          LSP source is `sec` and LSP diagnostic code is the canonical stable ID.
      - id: diagnostics.dead-unused
        paragraphs:
          - "§ 21"
          - "§ 22"
          - "§ 23"
          - "§ 24"
        requirement: >-
          Reserved dead/unreachable/unused/assignment IDs remain reserved;
          emission requires the semantic proof required by the owning analysis.
      - id: diagnostics.unreachable-statement-s3001
        paragraphs:
          - "§ 21(3)"
          - "§ 21(4)"
          - "§ 21(5)"
        requirement: >-
          Proven statements after an unconditional transfer use mandatory
          S3001 / control-flow.unreachable-statement with explanatory help.
      - id: diagnostics.discard
        paragraphs:
          - "§ 20"
          - "§ 25"
        requirement: >-
          Diagnostic transport follows the canonical discard semantics owned by
          rules/control-flow/discard.md without redefining discard.
      - id: diagnostics.mentor
        paragraphs:
          - "§ 27"
        requirement: >-
          Mentor diagnostics expose evidence and do not claim certainty beyond
          completed analysis.
      - id: diagnostics.testing
        paragraphs:
          - "§ 28"
          - "§ 30"
        requirement: >-
          Diagnostic output is deterministic and conformance tests assert stable
          structured identity rather than exact English prose.
    code:
      - internal/diagnostics/diagnostics.go
      - internal/parser/errors.go
      - internal/parser/recovery.go
      - internal/sema/errors.go
      - internal/sema/scalar_literals.go
      - internal/sema/scalar_literals_test.go
      - testdata/sema/unicode_scalar_literals_valid.sec
      - testdata/sema/unicode_scalar_literals_invalid.sec
      - internal/sema/analyzer_match_ownership.go
      - internal/sema/analyzer_struct_layout.go
      - internal/sema/analyzer_lifetime.go
      - internal/sema/place.go
      - internal/sema/discard_diagnostic_test.go
      - internal/diagnostics/diagnostics_test.go
      - cmd/compiler/diagnostic_catalog.go
      - cmd/compiler/diagnostic_catalog_test.go
      - cmd/compiler/diagnostic_output.go
      - cmd/compiler/diagnostic_output_test.go
      - cmd/compiler/main.go
      - cmd/compiler/module_sources.go
      - testdata/diagnostics/emitted_occurrences_invalid.sec
    implemented:
      - id: diagnostics.emitted-occurrence-json
        description: >-
          Every diagnostic-producing CLI command (lex, token, parse, ast, sema,
          emit-ir, emit-llvm, emit-sec-mlir, emit-mlir, build) accepts
          `--diagnostic-format <human|json>` anywhere in its arguments. JSON
          mode writes exactly one `sec.diagnostic-occurrences` version-1
          document to the diagnostic stream (stderr), so command products on
          stdout stay unchanged. Each occurrence carries id, registered name,
          effective severity, structured arguments, a primary span with
          one-based start and exclusive end, ordered related locations (for
          example the earlier declaration of S1004), notes, help with display
          text, fixes, a message key with display text, and the producing
          stage derived from the ID namespace. Lexer and parser occurrences
          come from the structured lexer and parser diagnostics rather than
          message strings; single-file commands fill span files. Occurrences
          are ordered by file, line, column, and stable ID; successful commands
          emit an empty list; human output is byte-for-byte unchanged and
          logically equivalent to the JSON occurrences. The catalog exports
          the matching `emitted_occurrence_fields` schema.
      - id: diagnostics.s1120-unicode-scalar-literal
        description: >-
          Numeric t/r literals outside U+0000..U+10FFFF or within surrogate
          code points U+D800..U+DFFF emit mandatory S1120
          literal.invalid-unicode-scalar with the literal source span,
          explicit valid-domain explanation and integer-codepoint help.
          Trusted core provenance does not bypass scalar validation. Source
          regressions cover decimal and hexadecimal surrogates, out-of-range
          literals, range endpoint rejection, valid boundary scalars and
          noncharacters, and integer-domain surrogate checks from uint or rune.
      - id: diagnostics.stack-budget-identities
        description: >-
          The registry allocates mandatory Error identities S1121
          stack.budget-exceeded, S1122 stack.budget-proof-unavailable and S1123
          stack.budget-unbounded-demand, distinguishing proven finite excess,
          failure to establish sufficiency and proven unbounded demand.
          Diagnostic production and verification are owned by
          sema.stack-analysis in governance/analysis.yaml; shared CLI/LSP
          transports retain the registered identities and explanatory help.
      - id: diagnostics.emitted-occurrence-migration-fallback
        description: >-
          Temporary fallback under rules/tooling/diagnostics.md § 32(2): an
          unmigrated semantic or parser diagnostic without a registered ID, a
          parser warning, an ILLEGAL token without a structured cause, and a
          project/build/target/tool error (for example `semantic IR error`) are
          emitted as occurrences with null id and name and `unregistered: true`
          instead of an invented identity; tool errors carry no primary span
          (§ 9(6)). Message and help keys are `<name>.message`/`<name>.help`
          (or `unregistered.*`) until localization catalogs exist. Arguments
          are empty until definitions declare argument schemas
          (diagnostics.registry-definition-v2) and fixes are empty until the
          fix schema exists (diagnostics.complete-fix-schema).
      - id: diagnostics.registry-core
        description: >-
          A central registry exists in internal/diagnostics with stable ID,
          symbolic name, topic family, default severity, mandatory flag, and
          retired flag.
      - id: diagnostics.lexer-ids
        description: >-
          Published lexical diagnostics L1001 through L1021 are registered and
          establish the L namespace; L1021
          lexer.unescaped-interpolation-closing-brace (MD-005) reports an
          unmatched single closing brace in interpolated-string text.
      - id: diagnostics.parser-ids
        description: >-
          Parser diagnostics P2001 through at least P2034 are registered (P2030–P2033 are the assertion syntax diagnostics, P2034 the legacy try match wrapper);
          P2001 remains the compatibility fallback for unmigrated parser paths.
      - id: diagnostics.semantic-migration
        description: >-
          A growing registered S namespace exists, including S1001 through
          S1119 definitions in the reviewed registry plus mandatory S3001 and
          S4001. S1097 operators.string-materialization-requires-try and S1098
          allocation.string-materialization-without-context implement MD-004;
          S1099 names.confusable-identifier implements MD-001; S1100
          members.tostring-signature enforces the uniform
          Result[string, StringError] ToString result (MD-035); S1101
          compile-time.execution-unavailable marks a contract or default
          position whose semantic CTE needs a call or property getter the
          executor cannot yet run (MD-011); S1102
          panic.assert-condition-not-bool reports a non-bool assertion
          condition with type-specific help; S1103
          declarations.explicit-self-parameter reports a legacy explicit
          receiver parameter in an impl method; S1104 names.parameter-shadows-declaration and S1105
          names.generic-parameter-shadows-declaration report a parameter or
          generic parameter hiding a visible generic parameter, function, or
          module variable (types keep S1040 and S1039); S1106 interfaces.missing-member and S1107
          interfaces.incompatible-member report interface conformance at the
          implementation with the requirement as labelled related location;
          S1108 allocation.no-alloc-violation reports a @noAlloc function with
          a reachable allocation or unknown allocation behavior; S1109
          initialization.missing-entry, S1110 initialization.invalid-entry,
          and S1111 initialization.duplicate-entry enforce the command and
          firmware entry contracts; S1112 attribute.duplicate, S1113
          attribute.duplicate-argument, S1114 attribute.invalid-argument, and
          S1115 attribute.not-allowed-on-target are reported uniformly by the
          general attribute parser; S1116 blocking.no-block-violation verifies
          @noBlock; S1117 attribute.conflict and S1118
          attribute.argument-not-compile-time enforce conflicting single-valued
          attributes and plan-time attribute arguments; S1119
          collections.range-segment-invalid rejects invalid array literal and
          Append range segments and ranges used as values.
      - id: diagnostics.s1052-union-payload-move-storage
        description: >-
          Invalid move-only payload extraction from union storage that cannot
          retain an independently tracked partial-move state uses mandatory
          S1052/ownership.union-payload-move-storage, names the affected payload
          Place, explains the missing ownership capability, and suggests either
          matching a local owning union or borrowing the payload.
      - id: diagnostics.s1053-duplicate-contract-membership-value
        description: >-
          Duplicate values in one ordered in-contract use mandatory
          S1053/types.duplicate-in-contract-value, focus the repeated value,
          relate it to the first source-ordered occurrence, provide removal or
          replacement guidance, and retain the same identity through LSP.
      - id: diagnostics.s1054-empty-contract-membership
        description: >-
          Empty ordered in-contracts are retained as AST recovery nodes and use
          mandatory S1054/types.empty-in-contract from Sema, with a focused
          range, value-addition guidance, and unchanged identity through LSP.
      - id: diagnostics.s1055-recursive-struct-layout
        description: >-
          Direct, forward mutual, fixed-array-mediated, Option/Result-mediated,
          and generic-instantiation by-value struct cycles use mandatory
          S1055/struct.recursive-by-value-layout, focus the
          field closing the cycle, show the complete resolved field path, and
          suggest a canonical indirection or dynamic-storage boundary.
      - id: diagnostics.s1056-switch-pattern-binding
        description: >-
          Variant payload binding and wildcard items in switch cases use
          mandatory S1056/switch.pattern-binding, focus the attempted pattern,
          and direct the programmer to match or default instead of cascading
          into undefined-name diagnostics.
      - id: diagnostics.s1057-local-shadows-declaration
        description: >-
          Local bindings that hide a visible generic parameter, same-module
          type, or free function use mandatory
          S1057/names.local-shadows-declaration with the hidden declaration as
          related evidence.
      - id: diagnostics.s1058-regex-contract-unavailable
        description: >-
          A regex contract on a string named type uses mandatory
          S1058/types.regex-contract-unavailable with removal help, because
          the regular-expression syntax and engine are not yet defined
          (MD-010); the contract is never silently dropped.
      - id: diagnostics.s1059-s1069-defaults-and-contracts
        description: >-
          Default and contract failures use mandatory registered identities:
          S1059 types.default-violates-contract, S1060
          types.default-not-representable, S1061
          types.ambiguous-implicit-default, S1062 types.no-default-value,
          S1063 struct.invalid-defaulted-field, S1064
          types.inapplicable-contract, S1065 types.unsatisfiable-contract-set,
          S1066 types.invalid-contract-argument, S1067
          types.incompatible-in-contract-value, S1068
          types.value-violates-contract, and S1069
          types.constrained-assignment-requires-try. Names S1059-S1063 come
          from rules/types/default_values.md "Diagnostics"; status detail is
          owned by frontend.default-values and frontend.type-contracts-v2.
      - id: diagnostics.s1070-authoritative-member-replacement
        description: >-
          A user impl member that would replace an authoritative compiler-known
          property such as SizeOf uses mandatory
          S1070/members.authoritative-compiler-property with help; status
          detail is owned by compiler.compile-time-evaluation.
      - id: diagnostics.s1071-recursive-union-layout
        description: >-
          By-value layout cycles through unions only (variant payloads and
          payload fields, including Option/Result and generic instantiation
          carriers) use mandatory S1071/union.recursive-by-value-layout with the
          variant path and indirection help; status detail is owned by
          analysis.layout and frontend.unions.
      - id: diagnostics.s1072-s1074-arena-typed-allocation
        description: >-
          Safe Arena.New[T] and Arena.Alloc[T] type requirements use mandatory
          S1072/arena.unsized-allocation-type,
          S1073/arena.allocation-missing-default, and
          S1074/arena.non-trivially-destructible-allocation with help, matching
          the distinct arena.md § 120 error families; status detail is owned by
          analysis.arena-allocation.
      - id: diagnostics.s1075-structural-mutation-during-iteration
        description: >-
          Structural mutation or replacement of a collection while an enclosing
          for loop iterates it uses mandatory
          S1075/for.structural-mutation-during-iteration with both Places, help,
          and the loop as related location; status detail is owned by
          frontend.for-loops-v2.
      - id: diagnostics.ffi-c-fundamental-types
        description: >-
          Foreign-qualified names use P2021/parser.malformed-foreign-qualification
          and P2022/parser.unsupported-foreign-form in the parser, and
          S1076/ffi.unknown-c-fundamental-type,
          S1077/ffi.c-abi-model-unavailable, and
          S1078/ffi.unresolved-c-binding-type, S1079/ffi.illegal-foreign-type, and
          the null-sentinel diagnostics S1080-S1083 in Sema, each with help; status
          detail is owned by frontend.ffi-v2.
      - id: diagnostics.custom-free
        description: >-
          Custom free uses S1084/destruction.invalid-custom-free for duplicate
          or interface free declarations, S1085/ownership.custom-free-partial-move
          with the free declaration as related location, S1086/destruction.defer-inside-free,
          and S1087/destruction.free-consumes-self, each with help; status detail
          is owned by frontend.destruction.
      - id: diagnostics.ownership-availability
        description: >-
          Uses and borrows of unavailable Places use S1088/ownership.use-after-move,
          S1089/ownership.conditionally-unavailable-use, and
          S1090/ownership.partially-unavailable-use with mentor help and the
          earlier ownership operation as related location; discard keeps S4001.
          Status detail is owned by frontend.ownership-v2.
      - id: diagnostics.s4001-use-after-discard
        description: >-
          Reads and borrows after explicit discard use mandatory
          S4001/ownership.use-after-discard with actionable help and the
          discard source location as related evidence.
      - id: diagnostics.retired-preservation
        description: >-
          Retired registry entries remain preserved; reviewed code includes
          S1020/operator.string-runtime-concat and
          S1026/associated-values.redundant-static as retired definitions.
      - id: diagnostics.a2001
        description: >-
          A2001/performance.large-value-parameter is registered as configurable
          Information.
      - id: diagnostics.a2002-a2003
        description: >-
          A2002/operators.redundant-state-test-comparison and
          A2003/operators.negated-state-test are configurable Warning
          bad-practice diagnostics for `(test) == true` and `!(test)` (MD-006),
          each recommending the canonical direct state test.
      - id: diagnostics.s1014
        description: >-
          S1014/switch.incomplete-enum-coverage is registered as configurable
          Warning, proving that S namespace does not itself imply mandatory
          Error.
      - id: diagnostics.catalog-list
        description: >-
          `sec diagnostics` lists registered definitions in stable ID order.
      - id: diagnostics.catalog-json
        description: >-
          `sec diagnostics --json` exports registry/catalog data and compiler
          field-schema descriptions.
      - id: diagnostics.lookup-by-id
        description: >-
          `sec diagnostics <ID>` provides registry-backed detail for active and
          retired known IDs and rejects unknown IDs as ordinary tool errors.
      - id: diagnostics.catalog-schema-tests
        description: >-
          Reflection-backed catalog tests check that exported host structures
          remain represented by the catalog schema, including lexer-token
          scalar start/end positions and original UTF-8 byte ranges.
      - id: diagnostics.parser-structured-transport
        description: >-
          Parser diagnostics expose structured ID, primary token, expected/
          unexpected token, recovery context, and recovery episode data.
      - id: diagnostics.parser-recovery-cap
        description: >-
          Parser diagnostic recovery has deterministic deduplication and a
          bounded diagnostic cap with P2015 terminal reporting.
      - id: diagnostics.sema-basic-transport
        description: >-
          Semantic diagnostic transport carries severity, optional stable ID,
          help text and source coordinates.
      - id: diagnostics.lsp-code
        description: >-
          LSP semantic and migrated parser diagnostics expose the stable
          diagnostic ID as the diagnostic code.
      - id: diagnostics.s3001
        description: >-
          Proven statement-after-terminator diagnostics use mandatory S3001 with
          explanatory help in CLI and LSP.
    partial:
      - id: diagnostics.registry-definition-v2
        description: >-
          Current Definition contains ID, Name, Family, DefaultSeverity,
          Mandatory and Retired. Revision 2.0 also requires explicit namespace,
          optional policy category, argument schema, message keys and related-ID
          metadata in the canonical logical definition model.
      - id: diagnostics.occurrence-unification
        description: >-
          Parser and semantic diagnostics still use different host structures.
          They are migration adapters and do not yet expose one complete
          canonical occurrence surface.
      - id: diagnostics.id-migration
        description: >-
          Many diagnostics are registered, but raw/unmigrated parser, semantic,
          compiler and build diagnostics remain.
      - id: diagnostics.catalog-coverage
        description: >-
          Catalog output explicitly reports incomplete coverage while raw
          diagnostics remain unmigrated.
      - id: diagnostics.mentor-analysis
        description: >-
          A2001 exists, but richer evidence-driven mentor analysis remains
          incomplete.
    unimplemented:
      - id: diagnostics.localized-catalogs
        description: >-
          Structured localization catalogs, template validation, locale
          selection and English fallback rendering are not complete.
      - id: diagnostics.policy-engine
        description: >-
          Complete rule/category/preset policy with project, target,
          target-variant and CLI precedence is not implemented.
      - id: diagnostics.complete-dead-analysis
        description: >-
          S3002-S3005 and the full proof-aware unreachable/dead-store/pure-result
          analysis are not complete.
      - id: diagnostics.complete-unused-analysis
        description: >-
          S3101-S3107 complete semantic unused analysis is not implemented.
      - id: diagnostics.assignment-condition
        description: >-
          Reserved S3201 must remain reserved until the canonical
          assignment-in-condition diagnostic is implemented.
      - id: diagnostics.complete-fix-schema
        description: >-
          Canonical Automatic/ExplicitSafe/Suggestion fixes with ordered
          TextEdit payloads are not implemented end-to-end.
    not_planned_for_sec_0_1:
      - id: diagnostics.source-suppression
        description: >-
          Revision 2.0 defines no source-level diagnostic suppression syntax.
          Implementations must not invent one from the old rulebook.
      - id: diagnostics.sec-explain
        description: >-
          `sec explain` is obsolete; detailed lookup belongs to
          `sec diagnostics <ID>`.
    identified_bugs: []
    required_tests:
