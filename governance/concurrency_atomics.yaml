      - "Concrete capability facts now retain a declared implementation kind and identity independently of language eligibility: native instruction, compiler intrinsic, verified platform primitive or target-declared emulation. Separate three-state LockFree, Blocking and InterruptSafe facts preserve explicit guarantees and unknowns without inferring them from mechanism, target width, profile or host. Affirmative availability requires producer provenance and a selected implementation; unknown or denied availability cannot select one, and invalid classifications or property values are rejected before freezing. Immutable lookup and canonical target projection preserve all realization facts. Source analysis on 32/64-bit plans confirms that unknown, denied, native and emulated facts neither remove uint64 eligibility nor authorize float64. These are compiler-internal facts, not a new public lock-free query, target guarantee, runtime fallback or native lowering path; source requirement production and capability diagnostics (MD-095), concrete registered-target guarantees and lowering remain pending."
      - Plan freezing rejects a supported realization unless Blocking is proven No when NoBlocking or InterruptSafe is required, and InterruptSafe is separately proven Yes when required. Known violations and missing property proofs are distinct typed AtomicContextViolation errors retaining exact requirement/implementation evidence; errors include target/profile context and preserve every failed guarantee. Native, intrinsic, primitive and emulated mechanisms use the same checks; a lock-free claim or interrupt-related name never substitutes for context proof. Validation occurs before publishing the immutable table and never selects a fallback. Unknown or denied capability facts remain non-affirmative without inventing Sema's Unknown policy. This completes the represented plan model and context checks; source-to-requirement production, source diagnostics and concrete registered-target guarantees remain under concurrency.atomics-v2/tooling.atomics-v2 and MD-095, and backend consumption/lowering remains under lowering.atomics-v2.
