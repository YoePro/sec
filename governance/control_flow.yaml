    summary: >-
      Tracks revision-2.0 exhaustive structural and variant matching. The AST,
      parser, Sema, ownership analysis, and current Semantic IR/MLIR path cover
      statement and expression matches, Result, Option, unions, ordinary and
      open bit-backed enums, guards, whole-payload copy/move/borrow behavior,
      coverage, source-order CFG, and continuing-arm availability merging.
      Compiler-known empty, shallow field patterns, guarded move commit,
      contextual value-producing arm blocks, complete statement discard rules,
      LSP ownership presentation, and non-enum lowering remain incomplete.
    rules:
