    implemented:
      - "nominal-core representation/lowering audit (2026-10-09): source fixtures on 32/64-bit plans distinguish supported named scalars, generic structs/unions, Result, Option, error enums and anonymous fixed arrays in Semantic IR/Sec MLIR from unavailable Task, Thread, interface, register, any, temporal, quantity and nominal Result/array-wrapper representations. Supported source identities survive verification and maintained emission; unavailable representations return structured unsupported-lowering diagnostics with source locations rather than changing source validity."
      - "representation audit fixes (2026-10-09): named scalar lowering uses the resolved declaration base and retains concrete generic arguments; recursive argument identity distinguishes nested specializations and excludes inherited carrier parameters from nongeneric declarations. Verification checks all type-argument references. Legacy MLIR rejects unavailable value signatures instead of emitting void, legacy LLVM rejects general Result instead of keeping only its success carrier (the existing analyzed string-result implementation remains separate), and raw/analyzed legacy APIs plus Semantic IR reject unresolved quantity erasure before publishing output. Identity helpers and audit fixtures/tests live in focused files and a dedicated test subdirectory."
      - "nominal identity, assignability and explicit conversion relation matrix audit (2026-10-09): typed values retain declared identity at initialization, mutation, calls and returns, including named bool/string/char/rune, array and callable wrappers; contextual literals remain separately shapeable. The source matrix covers 38 scalar identities on 32/64-bit plans at all analysis depths plus generic arguments, fixed representations, array extents, borrowed reference modes, callable capabilities/signatures/variadic shape, enum/union/register, collection/shape/rank, Result/Option/Task/Thread, temporal, raw-pointer and any/error boundaries."
      - "audit fixes (2026-10-09): unrelated structs, enums, unions and registers cannot gain an explicit conversion from equal carriers; wrapper conversions follow resolved declaration ancestry with exact generic/constant arguments. Dependency ordering resolves generic templates before wrappers, fixed base arguments survive nongeneric references and substitution, nominal identity survives cache keys and source display, compiler-known results retain trusted core refinements, and dynamic-array references match canonical borrowed slices while preserving original provenance. Shared compatibility logic is extracted from analyzer.go; the source matrix and fixtures have dedicated child directories."
      - "legacy LLVM character literals (2026-10-09, MD-043 §§2–3): analyzed emission snapshots the exact AST character types from Sema; rune literals use i32 even for ASCII/Latin-1 and explicit char contexts use i8. Returns, inferred storage, arguments, named types and match result storage share these facts; raw APIs and stale/missing facts fail explicitly without partial output, and malformed decoded scalars cannot be truncated. Cohesive character lowering is extracted from expressions.go, with tests in a dedicated child directory; Clang compiles both scalar plans and executes the amd64 fixture."
      - "LSP active target/variant switching and distinct-plan per-variant diagnostics are complete under frontend.target-sized-integer-semantics (2026-10-08); target comparison views remain owned by tooling.lsp-multi-target-diagnostics"
      - "legacy LLVM platform-float rejection (2026-10-08, MD-014): all generator entry points reject plain float in signatures, conversions, aliases, nested types, fields and defaults before emission because legacy floating-point lowering is unsupported; inferred binary-float family literals are rejected with structured unsupported-lowering source context, including integer-shaped g literals; plain float is no longer mapped to double by spelling, and explicit float32/float64 signatures retain their fixed widths on 32/64-bit triples"
      - "emit-llvm and build --pipeline llvm preserve existing outputs on rejected platform floats; build diagnostics finish only after backend success or failure, so the rejection is not hidden by an earlier empty JSON success summary; the build driver now has its own focused file"
      - immutable-by-default let declarations with inferred or explicit types
