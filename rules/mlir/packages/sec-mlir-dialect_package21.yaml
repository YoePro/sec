passes:
- --sec-verify-decimal-values
- --sec-verify-decimal-guards
- --sec-verify-decimal-conversions
- --sec-lower-decimal-core
prohibited:
- binary float decimal arithmetic
- silent loss of precision
- decimal128 API beyond the MD-068 mirror of decimal
- scale policy other than MD-066
- decimal error type other than core::ArithmeticError (MD-067)
- host int64 range as decimal128 limit
- hidden allocation
- mandatory runtime
- LLVM semantic guessing
tests:
- exact literal parsing
- i64 and i128 coefficient bounds
- scale public int32 getter and try set (MD-066)
- checked arithmetic
- terminating/nonterminating quotient (rounded nonterminating quotient succeeds, MD-066 § 5)
- truncation remainder
- all rounding modes
- exact conversions across active integer widths
- 32-bit/64-bit float conversion
- guard verifier negatives
- go test ./...
- check-sec-mlir
- legacy regression
governance:
  write_fragment: only under existing governance conventions and without duplicate IDs
  do_not_claim_implemented: true
future_package: determine after updated October backlog review
