      - preserve all existing multiline call boundaries and their required trailing comma
      - preserve formatter idempotence and expose the behavior through the shared LSP formatter
      - leave comment-bearing call boundaries and unproven syntax unchanged; independent comment-free child groups may receive canonical spacing from CST roles
    verification:
      - command: go test ./internal/cst ./internal/formatter ./cmd/compiler ./cmd/lsp -run 'CSTDelimiterSpacing|SingleLineDelimiterRoles|FormatSourceNormalizesSingleLine|FormatNormalizesSameLine|FormatNormalizesSingleLine' -count=1
