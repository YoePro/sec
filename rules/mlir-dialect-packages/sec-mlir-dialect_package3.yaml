  - internal/sema/semantic_facts_test.go
  - testdata/semantic_ir/mutable_scalar.sec
  - testdata/semantic_ir/mutable_from_parameter.sec
  - testdata/semantic_ir/direct_call.sec
  - testdata/semantic_ir/overload_call.sec
  - testdata/semantic_ir/call_argument_order.sec
  - testdata/semantic_ir/void_call.sec
  - testdata/semantic_ir/foreign_call.sec
  - testdata/semantic_ir/if_without_else.sec
  - testdata/semantic_ir/if_else.sec
  - testdata/semantic_ir/if_all_return.sec
  - testdata/semantic_ir/nested_if.sec
  - testdata/semantic_ir/mutable_across_if.sec
  - testdata/semantic_ir/unsupported_uninitialized_mutable.sec
  - testdata/semantic_ir/unsupported_nonvoid_discard.sec
  - testdata/semantic_ir/unsupported_method_call.sec
  - testdata/semantic_ir/unsupported_reference_call.sec
  - testdata/semantic_ir/unsupported_string_call.sec
  files_modified:
  - internal/ast/ast.go
  - internal/sema/analyzer.go
  - internal/ir/semantic/builder.go
  - internal/ir/semantic/verifier.go
  - internal/ir/semantic/printer.go
  supported_storage_types: trivial scalar and compatible contract-free/unit-free named scalar types except string
  supported_call_types: trivial scalar and compatible named scalar arguments, plus void returns
  unsupported_constructs:
  - uninitialized mutable source declarations
  - non-trivial storage and transfer
  - standalone non-void calls
  - method calls
  - reference and string by-value calls
  - arithmetic expressions and conditions
  - loops, switch, match, try, cleanup, aggregates, allocation, MMIO, and concurrency
  test_commands:
  - go test ./internal/ir/semantic ./internal/sema ./cmd/compiler
  - go test ./...
  - cmake --build build/sec-mlir --target check-sec-mlir
  results:
    semantic_ir_unit_tests: pass
    sema_fact_tests: pass
    compiler_cli_tests: pass
    supported_source_fixtures: pass
    unsupported_exit_code_4: pass
    backend_tool_free_cli: pass
    full_go_regression: pass
    package_1_lit_regression: pass_11_of_11
  deviations:
  - Sema default synthesis is marked explicitly on the AST so Semantic IR can distinguish omitted source initialization without re-analysis.
  - Reference-typed function signatures currently fail at the Semantic IR type boundary before reference-call action lowering; reference IR remains intentionally deferred.
  package_4_design_issues:
  - Map Semantic IR TypeID identity to Sec dialect named types without consulting AST or Sema.
  - Define the minimum Sec operations for storage, calls, return, branch, and conditional branch before implementing the bridge.
  - Preserve direct versus foreign call identity and source locations through the import.
