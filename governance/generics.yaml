  - id: compiler.generic-ownership-specialization
    area: generic-specialization-ownership
    status: implemented
    implementation_phase: complete
    integrated: "2026-11-16"
    summary: >-
      Split out of the P17 closure (owner decision 2026-11-16) together with the
      matching compiler.monomorphization and compiler.generics-lowering lines: a
      concrete specialization whose generic argument needs ownership (not
      trivially copyable or destructible) resolves its copy/move, transfer,
      destruction, cleanup, defer, discard and replacement facts for the
      substituted type, so Semantic IR lowers it instead of rejecting the
      argument by name. P1-P17 close when this item is implemented.
    rules:
      - rules/compiler/monomorphization.md
      - rules/compiler/generics_lowering.md
      - rules/declarations/generics.md
      - rules/memory/copy_move.md
      - rules/memory/destruction.md
