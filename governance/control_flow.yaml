    replaces: rules/control-flow/flowcontrol_for.txt
    summary: >-
      Tracks revision-2.1 infinite, finite-range, and compiler-known iterable
      loops. The established parser and Sema cover plain/discard bindings,
      sequential index/value and map key/value arity, iterable inference,
      finite range validation, immutable lexical bindings, loop-control flow,
      zero/non-continuing path analysis, and explicit compiler-known
      Iterator[T] conformance with a Sema-owned static Next plan. LLVM lowers infinite and integer
