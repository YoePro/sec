      - break analysis records state in the nearest active loop break frame
      - direct break from an infinite for creates a continuing post-loop path
      - direct break from while true creates a continuing post-loop path
      - break inside switch nested in a loop semantically targets the surrounding loop
      - infinite for with no syntactically discovered break is classified non-continuing
      - while true with no syntactically discovered break is classified non-continuing
      - outer-loop break search stops at nested for and while boundaries
