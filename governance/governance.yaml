      - cmd/yamlstatus/rulebook_page.css
      - cmd/yamlstatus/rulebook_workspace.go
      - cmd/yamlstatus/books.go
      - cmd/yamlstatus/books_inventory.go
      - cmd/yamlstatus/books_headings.go
      - cmd/yamlstatus/books_content.go
      - cmd/yamlstatus/books_site.go
      - cmd/yamlstatus/books_validate.go
      - cmd/yamlstatus/books_output.go
      - cmd/yamlstatus/rulebook_index.html
      - cmd/yamlstatus/cli.go
      - cmd/yamlstatus/edit.go
