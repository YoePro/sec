      - solve recursive and mutually recursive call-graph SCC summaries by deterministic monotone fixed point without treating ordinary recursion itself as concurrency
      - add bounded Place/index/range widening so large arrays and dynamic collections do not require one analysis node per runtime index
      - prove disjoint concurrent collection partitions and aggregate fields race-free when canonical Place/range/borrowing facts establish disjoint storage
      - avoid treating distinct union payload projections as disjoint unless canonical layout and active-variant facts justify the proof
      - integrate MMIO, volatile, and target-defined memory spaces through canonical memory-space and CompilationPlan semantics rather than ordinary race assumptions
      - consume FFI contracts for foreign reads, writes, retention, publication, callback execution context, asynchronous access, completion ordering, and synchronization without inferring behavior from names
      - integrate ISR/thread access pairing with canonical preemption, interrupt masking, priority, and nesting facts while leaving ISR-specific policy to ISR analysis
      - add bounded race candidate indexing/grouping by Place root or alias class, projection/range class, access kind, execution context, and synchronization class
      - support summary-level candidate pairing before event-level expansion so large programs do not require naive global O(n^2) access comparison
      - require a sound reachable unsafe witness before classifying a candidate as ProvenRace and preserve Unknown when only possible aliasing or concurrency is established
      - add scoped reusable RaceFreeProof facts for disjoint storage, exclusive ownership, non-overlapping execution, read-only sharing, mutual exclusion, happens-before ordering, and canonical atomic safety
      - retain deterministic representative access pairs, cause paths, overlap reasons, concurrency reasons, and missing-ordering explanations
      - group equivalent abstract race occurrences to avoid diagnostic explosion while preserving distinct Place/context root causes
      - provide LSP diagnostics with primary and related source locations so programmers can navigate between conflicting accesses
      - ensure race diagnostics explain the missing safety relationship without prescribing a mutex or other architectural synchronization strategy as an automatic universal fix
      - offer automatic race fixes only when a canonical transformation is proven semantically safe; prioritize explanation, navigation, and cause paths otherwise
      - integrate Interactive, Standard, and Deep analysis budgets without introducing a separate global Intermediate analysis mode
      - support progressive LSP refinement from fast Interactive results through Standard-equivalent results and optional Deep precision
      - represent Pending tooling state separately from Unknown, ProvenRace, and ProvenRaceFree and invalidate stale positive proofs immediately when dependencies change
      - expose ProvenRace and required race-freedom failures as NeedToKnow LSP diagnostics while keeping positive proof explanations and detailed concurrency facts configurable OptionalInsight
      - watch project analysis configuration and refresh affected summaries, findings, diagnostics, and optional insight without requiring an LSP restart
      - add dependency-driven incremental invalidation for body, callee summary, callable target, execution context, ownership, escape/publication, Place/range, synchronization, FFI, ISR/platform, CompilationPlan, and schema changes
      - stop unnecessary transitive invalidation when a reanalyzed function produces an exported data-race summary semantically equivalent to the previous summary
      - add versioned separate-compilation summaries carrying symbolic accesses, publication, execution effects, must-held synchronization, callback behavior, and localized uncertainty
      - introduce CompilationPlan dependence only where atomic, runtime, ISR/preemption, foreign, or memory-space behavior actually differs
      - integrate data-race analysis into default sec analyse all-analysis behavior and support explicit data-race-only analysis selection
      - add deterministic grouping and representative-cause selection independent of declaration order, worklist order, cache order, or parallel compiler scheduling
      - add required proven-race, race-free, Unknown, failure-to-prove, synchronization, publication/join, Place/provenance, ownership, callable, FFI, ISR, incremental-LSP, performance, and false-positive regression tests
      - update implementation-status verification commands when the first conforming vertical slice is integrated

