      - comparison chaining rejection
      - short-circuit exact-once side effects
      - signed and unsigned integer division
      - signed and unsigned ordered comparison
      - signed and unsigned range membership
      - dynamic invalid shift-count failure
      - signed-left-shift dynamic overflow failure
      - float NaN equality and ordering matrix
      - char and rune equality and ordering
      - exact string equality
      - string prefix ordering
      - Unicode-scalar string ordering
      - fixed-array membership first-match short-circuit
      - slice membership first-match short-circuit
      - all nine direct string-concatenation operand pairs
      - non-text concat rejection with S1022
      - runtime concat evaluation order and one maximal allocation plan
      - transactional failed string += leaves destination unchanged
      - struct and fixed-array equality short-circuit
      - unsupported equality and ordering categories rejected
      - reserved ? receives focused Sec 0.1 diagnostic
      - backend parity or explicit unsupported-lowering diagnostics
    verification:
      - command: go test ./internal/sema ./internal/ir/semantic -count=1 && go run ./cmd/compiler emit-ir testdata/ir/test_folded_string_concat.sec
        result: passed on 2026-10-05 with one decoded const.string and no intermediate concat operations; SEC_MLIR_BIN=$PWD/build/sec-mlir/bin emit-sec-mlir also verified one sec.const.string
      - command: go vet ./internal/codegen/mlir ./cmd/compiler
