      - "types.default-values-v2.numeric-zero, .bool-false, .string-empty, .rune-zero, .named-explicit, .enum, .union, .struct, .fixed-array, .mutable-declaration, .immutable-declaration, .no-universal-default: confirmed implemented as recorded below"
