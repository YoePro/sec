    summary: >-
      Canonical Sec 0.1 ordinary in-process Channel[T] model: exact endpoint and
      result types, fallible allocation-only construction, bounded
      FIFO/rendezvous storage, sender sharing/identity, blocking and
      non-blocking send/receive, revocable messages, expiration, statistics,
      close/discard/drain lifecycle, select/cancellation commit semantics,
      ISR-safe TrySend capability, analysis, Semantic IR, lowering, tooling and
      IPC separation.
