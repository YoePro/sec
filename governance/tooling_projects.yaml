      - internal/sema/project_root_modules.go
      - cmd/compiler/module_sources.go
      - cmd/lsp/project_root_modules.go
      - internal/diagnostics/diagnostics.go
    tests:
      - cmd/compiler/main_test.go
      - internal/project/identity_test.go
      - cmd/compiler/init_identity_test.go
      - internal/project/manifest_test.go
      - cmd/compiler/build_entry_test.go
      - testdata/projects/model/sec.toml
      - internal/project/root_module_test.go
      - internal/sema/project_root_modules_test.go
      - cmd/compiler/project_root_modules_test.go
      - cmd/lsp/project_root_modules_test.go
      - testdata/projects/root_module/library.sec
      - testdata/projects/root_module/mismatched_module.sec
    implemented:
      - "`sec init` writes `[project].name` and a newly generated UUIDv4 `[project].uuid` once and never regenerates it for an existing manifest (§ 37, § 53(6))"
      - conformance tests for UUID stability across repeated init, rename without UUID change, and invalid UUID rejection (§ 50(1))
      - parse and validate `[project]`, rejecting a nil or malformed UUID (§ 7, § 48)
      - ParseManifestIdentity validates exactly one [project] table, required non-empty name and canonical non-nil RFC 9562 UUID, duplicate fields, typed optional module and single-identifier ModuleName. Name whitespace is retained with a located warning; all defined ordinary UUID versions and special Max are supported. Single-line basic/literal strings are read; unsupported multiline strings receive explicit reader-capability diagnostics and their contents are skipped. Init validates existing and generated identities; discovered-project CLI/LSP diagnostic integration remains in tooling.project-discovery-and-boundary.
      - make the resolved ProjectUUID, ProjectName, ProjectRoot, and ProjectVersion facts available without reparsing strings (§ 49(1)–(2))
      - internal/project Manifest resolves ProjectUUID, ProjectName, absolute clean ProjectRoot and structured ProjectVersion from one validated source snapshot. Facts and identity warnings are copied on access; original text is retained for precise editing, and accessors perform no I/O or reparsing. Rename and directory moves change only the appropriate name/root facts and preserve UUID; explicit reload sees new values while older snapshots remain stable. Init consumes the shared loader; build entry selection uses its root/Target facts for valid manifests. Legacy entry-kind fallback and complete discovered-manifest CLI/LSP diagnostics remain separate work.
      - "`[project].module` root ModuleName override (§ 53(8))"
      - Manifest.RootModuleName resolves the optional root-library override or the complete ProjectName when it is a valid ModuleName; other human names require an override only when root source exists. Root command/firmware Targets use main; a simultaneously different root library name is rejected (§14). Shared Sema validation emits registered mandatory S1148 on the exact module-name token for mismatches or explicitly malformed/duplicate overrides. CLI checks selected roots and otherwise omitted mismatched siblings before analysis; LSP consumes the same checker and unsaved manifest overlays. Nested ordinary modules are unaffected; general invalid-manifest CLI/LSP diagnostics remain separate work.
      - Unsupported multiline identity strings now name their owning project field in reader-capability errors, allowing malformed root overrides to be diagnosed without attributing unrelated identity/version failures to root module naming.
    remaining:
      - make module resolution consume ProjectUUID/import-root identity rather than ProjectName (§ 49(4), rules/projects/modules.md)
    revised: "2026-10-13"
    verification:
      - command: go vet ./...
