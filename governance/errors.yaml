    implemented:
      - "a try assignment without a fallible target uses S1096 errors.try-assignment-without-fallible-target with help naming the fallible target forms"
      - "invalid try handler patterns use S1095 errors.invalid-try-handler-pattern with help naming the valid Err forms or the variants of the protected error type"
      - "resolved try handlers record BindingCopies (§20): a named payload binding copies a copyable error payload and otherwise takes ownership by move; try hover shows copies or moves payload per handler"
      - "stable try propagation diagnostics: every bodyless try that cannot propagate (Result, Option, arithmetic, bounds, and failure-set forms) uses S1093 errors.try-propagation-incompatible, and partial handlers that leave unpropagatable failures use S1094 errors.try-residual-unpropagatable, both with mentor help"
      - "missing-try mentor diagnostics: when a Result or Option carrier is used as an initializer, return value, call argument, or arithmetic operand where its success type fits, the diagnostic explains that try is missing, shows `try expr` for the exact expression, and names how the error or None is propagated or handled"
      - "result-projection-discardability: Result.Ok()/Err() may forget a non-discardable alternate payload when a dominating, unmutated condition on an immutable Result binding proves that state unreachable (result.ErrRef is None or result.OkRef is not None for Ok(), and the mirrored tests for Err()); otherwise the conservative S1006 rejection remains"
      - "errorhandling-lsp-v2 hover: try hover consumes ResolvedTry and ResolvedTryPlan facts for Result, Option, arithmetic, bounds, and failure-set try; it lists every failure source with its kind and error, the failure-set members without inventing a common type, each handler in source order with pattern, guard, binding type, and flow, coverage and residual propagation target, and states when a concrete error widens into the open error root while keeping its identity"
      - "errorhandling-formatter-v2: a golden formatter test covers error enum and union markers, representation enums, fallible setter contracts, direct try handlers with where guards and block recovery values, Option None handlers, borrowed and consuming projections, fallible assignment with and without handlers, and return try; output is canonical, idempotent, and never inserts or removes a semantic try or match"
      - "§22 handler failure boundary: a try in a handler body or guard is outside the outer try's protected set and propagates or fails on its own; every bodyless propagation diagnostic raised inside a handler or guard explains that the outer handlers do not catch it, and lambdas inside handlers reset that context"
      - "open-error discardability: Err(_) in try and match, explicit discard, and consuming Result projections treat the open error root as non-discardable when any declared error type of the analyzed program carries a non-discardable obligation, naming those types (\"error, which may carry LaunchFailure\"); programs without such types keep discarding error freely"
      - "§9/§11 failure sets: try converts every language-defined check in its protected subtree (runtime_checks.md \"What try converts\"), including checks in arguments of a protected call, stopping at nested try, lambdas, and match. Checked arithmetic (ArithmeticError), runtime-checked indexing of fixed arrays, dynamic arrays, slices, and lists (IndexError), and runtime conversion into a constrained named type (ContractError) are failure points; the ordered set is published as ResolvedTry.Failures and ResolvedTryPlan.Failures with kinds failure-set-propagation and handled-failure-set, and no public error union is inferred"
      - "§12.1/§16 failure-set propagation: naked try requires every member to fit the enclosing Result channel and names the source operation of each member that does not; partial handlers propagate each unhandled member separately with the existing mentor residual diagnostic"
      - "§11.1 heterogeneous handlers: Err(_) handles every member and checks each member's discardability; Err(name) is rejected with S1091 errors.heterogeneous-try-error-binding unless the set already shares an explicitly declared channel (a Result[T, error] carrier); narrowing patterns must name a member of the set; a try over Option that also protects an error-producing check is rejected because absence and errors use different channels"
      - "try is accepted in every frontend expression position where its success type is valid: multiple call arguments, if/while/switch headers, aggregate field initializers, array elements, nested and parenthesized operands, logical operands, and unary operands. A try in a control header is bodyless because the following brace belongs to the control construct, while a handled try inside a header call argument keeps its handlers; a non-bool bodyless try condition reports \"try expression in if/while condition must produce bool, got T\" (flowcontrol_if.md § 11, flowcontrol_while.md § 7)"
      - "Result[T, E], Ok(...), Err(...), ordinary Result propagation, and local Result handlers have substantial frontend and Semantic IR support."
      - "checked arithmetic already participates in language-defined try semantics and binds try to the complete following arithmetic expression."
      - "current Sema exposes immutable resolved try facts for ordinary Result propagation, handled Result, and checked arithmetic propagation."
      - "current local try-handler lowering preserves source order and has an explicit resolved handler plan through Semantic IR and Sec MLIR."
      - "parser and Sema accept Err(_) in Result match arms and try handlers."
      - "named try and match error bindings may be explicitly discarded in the current frontend; tests exercise Err(error) with discard error successfully."
      - "Result is compiler-known must-use for standalone-call validation and explicit discard is governed separately by recursive discardability."
      - "try is already accepted in if conditions when its successful value is bool."
      - "fallible property assignment requiring try is already represented in the frontend, including local try-assignment handlers."
      - "property parser/Sema currently support try set accessors and interface fallible-setter requirements, but the setter error type is currently declared or inferred under the pre-v2 model."
      - "current lifecycle rules already provide explicitly typed fallible init and try new semantics; revision 2 only references those rules."
      - "match revision 2 already defines exhaustive matching, Err(_) acknowledgement, where guards, ownership-aware bindings, and contextual final-expression arm values."
      - "runtime-check rules already define full-expression try scope, left-to-right evaluation, first failure, and propagation by error assignability."
      - "current formatter supports attached try-handler blocks and delimiter handoff for multiline operands."
      - "current LSP implementation-status work already plans compiler-owned try hover facts rather than reconstructing try semantics in the editor."
      - "migrated the canonical rulebook from rules/errors/errorhandling.txt to revision-2 rules/errors/errorhandling.md and updated active rule references"
      - "all fourteen revision-2 correction documents have been applied to their canonical owner rulebooks and archived"
      - "compiler-known lowercase error resolves import-free as the open root of the error-specific assignability relation"
      - "canonical enum Name error declarations and integer/bit-backed enum Name Representation error declarations preserve nominal enum identity while marking the type as a concrete error"
      - "frontend initialization and bodyless Result try compatibility permit one-way marked concrete-error to error widening without implicit narrowing or cross-concrete conversion"
      - "payload-bearing type Name union error declarations preserve the marker and payload AST, retain ordinary union semantics, and become one-way assignable to compiler-known error"
      - "Result[T, E] now rejects non-error failure channels; E must be compiler-known error or a concrete enum/union declared with the error marker"
      - "invalid Result failure channels produce a programmer-facing diagnostic naming the invalid type and the explicit error marker correction"
      - "canonical compiler, stdlib, platform, and test fixtures declare their concrete Result error channels explicitly; raw Linux errno retains its numeric payload in an error union"
      - "direct-result-return: Compatible Result[T,E] expressions may be returned directly as complete Result carriers without unwrapping or reconstruction."
      - "result-option-success-construction: Ok(expr) analyzes expr with the declared Result success type as contextual type, so payload-less None and Some(value) resolve to the exact Option[T] success specialization both directly and inside terminating match branches instead of becoming a nested Result."
      - "option-direct-return: Compatible Option[T] calls, bound values, and readable property expressions, including carriers with move-only payloads, may be returned directly as complete carriers with ordinary terminal ownership transfer. Property lookup refreshes canonical impl metadata for aggregate payload types resolved before impl registration, and a non-reference getter result does not inherit a branch-scoped receiver borrow. Plain T values are not implicitly wrapped in Some, and incompatible Option specializations remain rejected."
      - "option-none-if-tests: Non-binding if option is None and if option is not None conditions lower in the parser to the existing exhaustive typed Option-match representation, preserving compiler analysis and later LSP completion."
      - "try-handler-shadow-diagnostics: Sema rejects duplicate Err variants, Err arms after an unguarded catch-all, and catch-alls after every variant of a closed enum error has been handled. Stable S1045 points to the earlier covering arm or the last arm completing enum coverage; a partially covered enum retains its catch-all."
      - "try-match-wrapper-removal: Parser rejects the obsolete try { match { ... } } handler wrapper with P2012 while retaining inner handlers and subsequent declarations for tooling recovery; direct Err handler syntax and trailing comments parse cleanly."
      - "try-err-discardability: Sema checks recursive discardability of a concrete Result error payload before accepting Err(_); non-discardable task/thread obligations produce S1006 with guidance to bind and resolve the error."
      - "match-err-discardability: Result match Err(_) now performs the same concrete error-payload discardability check; non-discardable task/thread obligations produce S1006 and prevent a resolved match plan."
      - "return-try-result-forwarding: A direct handlerless return try Result expression now validates both the protected Result error channel and its success type against the enclosing Result[T,E], records the dedicated result-return-forwarding Sema fact, and lowers by evaluating the protected carrier exactly once before returning a reconstructed Err(error) or Ok(value). The rule is confined to the direct return boundary: ordinary return value still cannot implicitly convert T to Result[T,E], incompatible success and failure channels retain focused diagnostics, and handled or non-Result try expressions are not silently widened into this rule."
      - "if-some-binding-exception: Parser preserves the sole positive if option is Some(binding) payload form without introducing general if patterns, rejects is not Some(binding) with focused guidance, and retains existing non-binding None tests. Sema requires an Option subject, gives the immutable payload binding true-branch-only scope, records its exact type/variant/copy-or-move action, and merges ownership through ordinary continuing paths. Semantic IR consumes that fact, evaluates the Option subject exactly once, and lowers the maintained copy-trivial payload subset; ownership-sensitive union projection remains at the existing explicit Semantic IR package gate. Formatter coverage preserves the canonical spelling idempotently."
      - "try-success-handler-removal: Sema rejects explicit Ok(...) arms in Result and fallible-assignment try handlers and Some(...) arms in Option try with mandatory S1049 and mentor guidance to remove the arm or use match. ResolvedTryPlan is failure-only, and Semantic IR always routes implicit success directly to the merge with no source success-handler dispatch."
      - "bodyless-try-assignment-v2 frontend: Parser accepts naked try assignment, Sema requires a known fallible target and a compatible enclosing Result error channel, rejects propagation from defer/non-functions/non-Result/incompatible Result channels, and publishes a statement-level propagation or local-handler fact for downstream consumers."
      - "result-consuming-projections frontend: Compiler-known Result.Ok() and Result.Err() return Option[T/E], consume an addressable owned Result, reject borrowed receivers, diagnose later use, and conservatively reject a projection whose forgotten alternate payload carries a non-discardable obligation."
      - "result-borrowed-projections frontend: Compiler-known read-only Result.OkRef and Result.ErrRef properties return Option[ref T/E] without consuming the Result. Sema preserves receiver provenance through the Option, rejects escape from a local Result, accepts borrowed Result receivers, and keeps a shared borrow active so conflicting receiver mutation is diagnosed."
      - "result-err-none-tests: Consuming Result.Ok()/Err() projections compose with the parser's non-binding Option state tests. Sema accepts both projection is None and projection is not None through the ordinary exhaustive typed Option-match path while retaining projection ownership effects."
      - "result-projection-ownership-diagnostics: Use after consuming Result.Ok()/Err() is diagnosed from compiler-owned place state, identifies the consumed value and projection, carries the projection source location as related context, explains that the value is unavailable, and recommends OkRef/ErrRef for non-consuming inspection or ending use of the Result."
      - "try-option-propagation frontend: Naked try over Option[T] resolves Some(T) to T and propagates None only through a compatible enclosing Option[T] return channel. Sema publishes a dedicated resolved Option-propagation fact, rejects Result/Option cross-channel conversion and incompatible Option specializations, and supports ordinary nested expression positions without treating assignment as an expression."
      - "§16 partial handlers: unmatched Result failures propagate through a compatible enclosing Result return; the resolved plan records ResidualPropagates and EnclosingResultType, LSP hover shows the propagation target, and an unpropagatable residual reports a mentor diagnostic naming the unhandled variants and the fix"
      - "§19 where guards: try handlers parse `Pattern where condition => body`, the guard must be bool and sees the pattern binding, and a guarded handler never covers its pattern for reachability or coverage"
      - "§20: a guard that consumes a move-only payload binding before selection is rejected"
      - "§18: reachability and duplicate checks treat guarded handlers as non-covering while an earlier unguarded catch-all or complete variant coverage still makes later handlers unreachable"
      - "§21.1 block recovery values: a handler block may end with a contextual result-position expression, including literals, that must be assignable to the success type; the parser accepts it only as the final statement of a handler block"
      - "§24 fallible setters: try set value ErrorType { ... } and interface try set value ErrorType declare the error contract explicitly; the contract must be error or a concrete error type, is never inferred from the body, and an implementation's contract must be assignable to the interface's"
      - "§24 success model: normal completion and bare return are success, return Err(error) is failure checked against the contract, and return Ok() or any other returned value is rejected"
      - Semantic IR rejects partial plans, guarded handlers, and block-value handlers explicitly as unsupported instead of lowering them with altered semantics
      - "§15/§16 Option try handlers: try over Option[T] accepts None (bare or Option.None) handlers with recovery values, block values, guards, and duplicate detection; an unhandled None propagates only through a compatible Option return; Result patterns on an Option try are rejected without cross-channel conversion; the plan records TryHandlerOptionNone and LSP hover shows local None handling"
      - "§27.2 open error narrowing: try handlers and match arms over Result[T, error] accept Err(ConcreteError.Variant); narrowing never covers the open domain, so match still requires Err(errorValue) or Err(_) with a focused open-domain diagnostic, duplicate and after-fallback narrowing arms are rejected, and plans mark OpenErrorNarrowing or MatchPatternResultErrNarrowed"
      - "§27.1 carrier-family diagnostics: Ok/Err patterns against Option and Some/None patterns against Result explain the correct pattern family instead of reporting unknown variants or binding None as a catch-all name"
      - Semantic IR rejects Option handler plans, open error narrowing in try, and narrowed match arms explicitly as unsupported
      - "MD-008 (rules/corrections/applied/missing-decisions-md001-md009-correction-20261003.md § 9, 2026-10-03): match on a concrete Result[T, ConcreteError] accepts Err(ConcreteError.Variant) for enum error variants (keyed by value class) and payload-less union error variants; the arms take part in closed exhaustiveness, missing variants are listed, Err(error) after full coverage and variant arms after Err(error) are unreachable, payload-carrying union variants are rejected pending MD-029, and plans mark MatchPatternResultErrVariant (Semantic IR rejects it explicitly)"
      - "result-projection construction proof (2026-10-03): an immutable Result binding initialized directly by Ok(...) or Err(...) records Symbol.ResultConstruction, so the matching consuming projection may forget a non-discardable alternate payload without a dominating test; mutable bindings and other initializers keep the conservative S1006 rejection (TestResultProjectionUsesPathSensitiveStateProof)"
    remaining:
      - "error-widening-representation-and-lowering: Preserve concrete error type identity, active variant, payload, ownership state, and destruction obligations through Semantic IR and maintained backends after frontend widening to error. Physical representation remains implementation-defined."
      - "open-error-match-narrowing-lowering: Preserve concrete error identity so open error narrowing in try and match, and concrete-channel Err(ConcreteError.Variant) match arms (MD-008), can be lowered. (Frontend narrowing with open-domain exhaustiveness is implemented.) Previously: Permit error-specific variant narrowing when matching Result[T, error] while keeping error an open domain. Concrete-only Err arms are not exhaustive; Err(errorValue) or Err(_) may cover the remaining open domain. Do not generalize this into arbitrary runtime type-pattern matching."
      - "open-error-discardability-separate-compilation: the open-error rule uses the declared error types of the analyzed program; separately compiled modules need exported error-obligation summaries before the same proof holds across module boundaries."
      - "result-projection-semantic-ir-lowering: Add explicit consuming and borrowed Result projection facts/operations to Semantic IR and maintained lowering, including retained-payload transfer, exactly-once destruction of an active forgotten payload, and borrowed projection provenance."
      - "result-projection-discardability: extend the state proof to match-refined Results and to mutable Results whose state survives until the projection (immutable bindings constructed by Ok(...) or Err(...) are proven since 2026-10-03)."
      - "try-language-defined-short-circuit: remaining try operands are slicing (its error type is not named by runtime_checks.md) and checked scalar narrowing conversions such as try int32(wide) and try rune(codePoint), whose error type and payload await MD-012."
      - "try-option-local-handlers-lowering: Lower try over Option[T] with local None handlers, partial-handler propagation, and recovery values through Semantic IR and maintained backends. (Frontend None handlers, guards, recovery values, and propagation are implemented.) Naked compatible None propagation and Option/Result cross-channel rejection are implemented in the frontend."
      - "try-failure-set-lowering: Semantic IR rejects failure-set try kinds explicitly; lowering must evaluate the ordered failure points with first-failure control flow and per-member propagation or handler dispatch."
      - "try-partial-handlers-lowering: Lower partial handler plans through maintained backends and Option None partial handling through Semantic IR. (Frontend partial Result handling is implemented; Semantic IR lowers partial Result plans with residual propagation via the residual handler kind and residual-propagates marker, rejecting error widening; Sec MLIR emission rejects them pending MD-031.) Previously: Change local try handlers from the old exhaustive-handler model to partial handling: locally unmatched Result failures propagate implicitly when assignable, and unmatched Option None propagates only through a compatible Option return. match remains exhaustive."
      - "try-handler-order-reachability: reachability for payload patterns of union errors is blocked on MD-029 (the ErrPattern production and whether Err(Union.Variant(binding)) is a try/match pattern); the parser and Sema accept only Err(_), Err(name), and Err(Enum.Variant) today."
      - "try-handler-where-guards-lowering: Lower guarded handlers through maintained backends. (Frontend guards and guard-consumption rejection are implemented; Semantic IR lowers guarded handlers with guard evaluation and guard-false continuation, marked guarded; Sec MLIR emission rejects them pending MD-031.) Previously: Support where guards on try handlers using the same pattern/guard ownership discipline as match. Guard false continues to later handlers; prospective move-only payload ownership must not commit until pattern and guard select the arm."
      - "try-recovery-values-lowering: Lower block-final recovery values through maintained backends. (Frontend block-final values are implemented; Semantic IR lowers block-final handler values into the merge.) Previously: In value position, every handled path that continues must produce a value assignable to the try success type. Handler block final expressions are contextual result-position values; terminating paths need no recovery value and void success handlers may complete normally."
      - "try-expression-positions-lowering: Semantic IR and backends must lower try in every frontend-accepted position (call arguments, if/while/switch headers, field initializers, array elements, nested, logical, and unary operands); handlers in control headers are not defined by the rulebooks and are not parsed there."
      - "errorhandling-semantic-ir-v2: Extend resolved try/result facts for partial handlers, implicit unmatched propagation, Option alternate paths, error widening/narrowing identity, consuming and borrowed projections, recovery-value merges, guarded ownership commit, and nested failure boundaries. Backends must not reconstruct these semantics from syntax or unused SSA. Direct Result return-try forwarding already has a dedicated resolved fact and canonical Semantic IR lowering."
    required_tests:
      - "error is compiler-known and import-free"
      - "enum ErrorType error declaration"
      - "explicit-underlying enum error declaration"
      - "type DetailedError union error declaration"
      - "concrete error implicitly widens to error without losing identity or payload"
      - "error does not implicitly narrow and concrete error families do not cross-convert"
      - "Result[T, concrete-error] and Result[T, error] accepted; Result[T, non-error] rejected"
      - ".Ok() and .Err() consume an owned Result and transfer the retained payload without hidden clone"
      - "use after .Ok() or .Err() is rejected with the consuming source location and mentor help"
      - "non-retained Result payload is destroyed exactly once and non-discardable alternate state blocks unsafe consuming projection"
      - "OkRef and ErrRef borrow without consuming and cannot outlive the Result"
      - "try works in let initializers, call arguments, bool conditions, aggregate fields, parenthesized expressions, and multiple arguments"
      - "assignment remains non-expression inside if"
      - "try covers language-defined checked arithmetic, indexing, constrained conversion, fallible new, and fallible assignment"
      - "try Option unwraps Some(T), locally handles None, and propagates None only through compatible Option return"
      - "Some handler inside Option try and Ok handler inside Result try are rejected"
      - "Result patterns against Option and Option patterns against Result receive mentor diagnostics"
      - "no implicit Option-to-Result or Result-to-Option propagation"
      - "Err(_) and Err(named) accepted in try handlers"
      - "Err(_) rejects concrete error channels with non-discardable task/thread obligations"
      - "Result match Err(_) rejects concrete error channels with non-discardable task/thread obligations"
      - "legacy try { match { ... } } wrapper rejected"
      - "handlers execute top-to-bottom and first matching handler wins"
      - "provably unreachable handlers, including after unguarded Err(_), are compile errors"
      - "where guard false continues to later handlers and cannot prematurely consume a prospective move-only binding"
      - "partial handlers propagate unmatched compatible failures and reject unmatched failures that cannot propagate"
      - "Err(_) handles heterogeneous compiler failure sets; heterogeneous Err(named) without one declared binding type is rejected"
      - "handler expression or final block expression may provide success-type recovery value"
      - "terminating handlers need no recovery value and void success handlers may complete normally"
      - "failure produced by guard or handler body is outside the outer protected try; nested try handles fallible recovery"
      - "naked try assignment propagates; fallible assignment without try is rejected"
      - "try set value ErrorType parses; missing ErrorType is rejected"
      - "try setter normal completion and bare return succeed; return Err fails; return Ok is rejected"
      - "fallible getter syntax is rejected in Sec 0.1"
      - "interface fallible setter exposes and enforces the same declared error type"
      - "return try Result forwards success as Ok and propagates compatible failure without general T-to-Result conversion"
      - "Result[T,error] can match a concrete error variant while preserving payload; open error domain still requires a fallback for exhaustiveness"
      - "if option is Some(value) binds only on the positive true path; is not Some(value) binding is rejected"
      - "if result.Err() is not None is accepted"
      - "LSP hover exposes try success/alternate facts, concrete and widened error identity, and consuming versus borrowed projections"
      - "compiler and LSP diagnostics share resolved ownership facts and use mentor-style explanations"
      - "a compatible Result[T,E] expression may be returned directly without unwrapping or reconstruction"
      - "a compatible Option[T] expression may be returned directly without unwrapping or reconstruction"
      - "a bound compatible Result[T,E] may be returned directly with ordinary terminal ownership transfer"
      - "a bound compatible Option[T] may be returned directly with ordinary terminal ownership transfer"
      - "a compatible Option[T] property read may be returned directly, including through a ref-bound union payload"
      - "a plain T return from Result[T,E] remains invalid without explicit Ok(...)"
      - "a plain T return from Option[T] remains invalid without explicit Some(...)"
      - "an incompatible Result carrier is rejected with expected and actual Result types"
      - "an incompatible Option carrier is rejected with expected and actual Option types"

