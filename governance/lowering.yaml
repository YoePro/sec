  - id: lowering.sec-mlir-package21
    package: SEC-MLIR-P21
    name: Exact Decimal Semantic Operations
    area: semantic-ir-sec-mlir-and-lowering
    status: planned
    integrated: "2026-10-16"
    revised: "2026-10-28"
    summary: >-
      P21 normative package documents are installed; its complete executable
      decimal pipeline is not accepted. MD-066/067/068 settled D1/D2/D3 on
      2026-10-28: signed public scale and fallible exact setter, operator scale
      and division policy, core ArithmeticError mapping and decimal128's
      mirrored public API. Only normative blocks are released. Core/API,
      frontend/CTE, Semantic IR, checked error CFG, schema-17 verification and
      physical lowering remain implementation work, in the correction's numbered
      order. Existing earlier-schema decimal constants and Claude's ongoing
      Scale migration do not imply P21 completion. P20/schema-16 prerequisites
      remain; high-level schema 11/12 inspection is not an authorization to emit
      schema 17 or to skip P15-P20 dependencies.
    predecessors:
      - SEC-MLIR-P20 (schema 16, not implemented)
    rules:
      - rules/corrections/md066-md067-md068-decimal-correction-20261028.md
      - rules/mlir/packages/sec-mlir-dialect_package21.md
      - rules/mlir/packages/sec-mlir-dialect_package21.yaml
      - rules/mlir/normative-sync/sec_decimal_numeric_sync_package21.md
      - rules/mlir/normative-sync/sec_p20_october_compatibility_package21.md
      - rules/mlir/semantic-ir/sec_semantic_ir_decimal_package21.md
      - rules/mlir/dialect-versions/sec_mlir_dialect_v17.md
      - rules/mlir/lowering-versions/sec_mlir_lowering_v17.md
      - rules/types/types.md
      - rules/foundations/operators.md
      - rules/memory/layout.md
      - rules/library/core-library.md
      - rules/compiler/compiler_known_members.md
      - rules/compiler/semantic_ir.md
      - rules/errors/errorhandling.md
      - rules/types/units.md
    known_holes:
      - "fixed 2026-10-28 (MD-066 § 3(7), P20 §§ 11-19): well-formed unsuffixed decimal literals beyond host float64 parse and retain exact coefficients/scales through declared/inferred bindings into Semantic IR (1e400, 1.2500e400, 1e-400). Sema validates binary literals from exact source after final context/overload shaping at the selected float32/float64 width; mandatory S1175 carries source span and help. Unit-bearing literals publish their resolved carrier width. Regression matrix covers both target plans, signs, integer-form g, arguments, operators, comparisons, arrays, fields, quantities, selected overloads, subnormals and underflow; CLI check verifies acceptance/rejection without backend tools (TestResolvedFloatLiteralRanges, TestUnsuffixedDecimalBeyondBinaryRange, TestCheckFloatLiteralRangeBoundary). This does not close the broader bounded exponent audit, operator lowering or schema-17 gates."
      - "Historical 2026-10-16/MD-082 Scale baseline: decimal Scale became an instance property with legacy scale spelling, then typed uint8 and readonly; decimal128 lacked the member. Superseded normatively by MD-066/MD-068 on 2026-10-28: both Scale properties are int32 with a fallible exact try setter reporting PrecisionError."
      - "fixed 2026-10-28 (MD-066 §§ 2(2)-2(5), Sema): CKM-DECIMAL-SCALE is int32 and decimal128 has its own CKM-DECIMAL128-SCALE; `try value.Scale = s` requires try and a mutable unborrowed place and propagates PrecisionError (core fallback type); Semantic IR names the setter and fails closed (TestDecimalScaleIsAnInt32ValueProperty, TestDecimalScaleSetterIsFallible, TestDecimalScaleAccessFailsClosed)"
      - "fixed 2026-10-28 (MD-066 §§ 6(1), 6(4)-6(5)): a decimal / or % (also /= and %=) whose divisor Sema proves zero is a compile-time error S1024/S1025 even under try; proofs cover decimal/integer literals, signs, immutable decimal bindings and exact +, -, * of them, while parameters and mutable bindings keep the runtime path (TestDecimalProvablyZeroDivisor, TestDecimalProvablyZeroDivisorCompound)"
      - "fixed 2026-10-28 (MD-067 §§ 7(1), 7(6), 7(9), 12(7)): ArithmeticError has exactly five variants (ScaleOverflow, PrecisionExhausted appended) in the Sema builtin and a new exact trusted core declaration in sec/core/error.sec that keeps the builtin identity; exhaustive handlers need all five or Err(_), Overflow is no supervariant; the Semantic IR and sec.core_error.is_variant verifiers accept exactly the five (schema < 7 legacy exhaustiveness unchanged) (TestArithmeticErrorHasFiveVariants, package10/try-plan/failure-set tests, lit md067-arithmetic-error-variants.mlir, invalid-md067-arithmetic-error-variant.mlir)"
      - "fixed 2026-10-28 (MD-066 §§ 2(2), 3(5), 3(7)): decimal literals keep the signed int32 scale their spelling implies (1e3m scale -3, 1.20m scale 2) through shared constant.DecimalLiteral/FitDecimal used by Sema and Semantic IR; a too-wide coefficient moves only to the closest exact coarser scale, the asymmetric signed coefficient domain applies, an unrepresentable literal gets a specific diagnostic, `m` literals beyond the float64 range parse, DecimalConstant.Scale is int32 and the sec.const.decimal verifier accepts negative scales (TestDecimalLiteralValueUsesLexeme, TestDecimalLiteralFitsTargetWidth, TestDecimalLiteralWidthDiagnostic, TestDecimalLiteralConstantsKeepSpelledScale, lit md066-decimal-signed-scale.mlir)"
      - "fixed 2026-10-16 (was a known hole): decimal literal facts (internal/sema DecimalValue) carry an exact arbitrary-precision coefficient, so decimal128 literals beyond int64 are represented exactly (P21 sync § 8); a literal initializes decimal only if its coefficient fits i64 and decimal128 only if it fits i128 (layout.md components); decimal range checks compare exact values, which also fixes a wrong descending-range error for ranges such as 9.95..10.0 whose raw coefficients compared 995 > 100 (TestDecimalLiteralValueUsesLexeme, TestDecimalLiteralsAreExactAndWidthChecked)"
      - "corrected by P22 (rules/mlir/normative-sync/sec_p20_p21_conversion_compatibility_package22.md): P20/P21 conversions must not introduce NumericConversionError; MD-012 already settled the canonical `ConversionError` (OutOfRange, InvalidScalar, PrecisionLoss, ScaleOverflow, NonFinite, Contract(ContractError)) declared in sec/core/error.sec (verified 2026-10-16); P21's NumericConversionError references map to ConversionError"
      - "P21 compatibility audit § 2: P20 assumes binary64 `float`, superseded by MD-014 (target-sized float: f32 on 32-bit, f64 on 64-bit); P20 plans and tests must follow MD-014 before P21 conversions"
    notes:
      - "2026-10-28: the existing SEC-MLIR-P21-D1/D2/D3 entries in sec-mlir-dialect_package21.yaml are already decided and reference the accepted correction. Governance follows those same gates; no parallel IDs or blanket implementation acceptance are added."
      - "verified 2026-10-16: the package's claim that sec/core/decimal.sec declares `ToString() string` is stale; it already returns Result[string, StringError] (body is a TODO stub)"
    remaining:
      - "stage 1 remainder: ConversionError mapping per the P22 compatibility note and P20 MD-014 target-sized float width in decimal/float conversion plans"
      - "MD-066 §§ 3-4 operator result scale: immutable ResolvedDecimalOperatorPlan with preferred scale (max/sum), nearest exact legal scale, exact zero scale clamping, exact remainder via truncated quotient and scale-independent comparison"
      - "MD-066 § 5 rounded decimal division: nearest-even at the finest admissible int32 scale keeping the whole-number part, carry fallback, underflow-to-zero classification; a rounded quotient is a success"
      - "MD-066 §§ 6(2)-6(3) runtime decimal checks: decimal arithmetic is not yet a checked runtime operation in Sema (no RuntimeCheck/panic effect, so `try x / y` on decimals is rejected); a runtime zero divisor must panic with DivisionByZero, or yield ArithmeticError.DivisionByZero under try"
      - "MD-067 §§ 7(3)-7(5) decimal failure classification: most-specific ScaleOverflow/PrecisionExhausted/Overflow selection by mathematical cause in decimal operator plans, and the decimal failure-reason to ArithmeticError variant mapping (needs the decimal operator plans above; integer operations never produce the decimal variants)"
      - MD-066 § 2(4) Scale getter and transactional try-set lowering (exact rescale or PrecisionError with the receiver unchanged); Semantic IR currently rejects both
      - "MD-066/MD-068 §§ 8-10 core members for decimal and decimal128: IsInteger/IsZero/IsPositive/IsNegative/Sign properties, RoundTo(scale[, mode]), Rescale, Normalize, Floor/Ceiling/Truncate/Round, ToInt*/ToFloat*, ToString R/G/F/N/E with separators; add sec/core/decimal128.sec and registry entries"
      - "stages 6-9: schema-17 dialect types/ops/verifiers, physical decimal lowering and verifiers, DEC-01..DEC-22 differential target matrix (32/64-bit), retaining predecessor/schema and capability rejection"
    verification:
      - command: go run ./cmd/yamlstatus check
