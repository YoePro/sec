      - P16-11 and P16-15..P16-19 endpoint evaluation/normalization, resolved slice index plans, broader defensive query coverage, origin propagation, effects and Sema source tests; P16-10, P16-12, P16-13 and P16-14 are implemented
      - P16-20..P16-37 Semantic IR slice types/operations, verifier and source lowering
      - P16-38..P16-45 schema 12, slice operations, --sec-verify-slice-guards and emitter
      - P16-46..P16-58 predecessor integration, determinism, acceptance and report
    deferred:
