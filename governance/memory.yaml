    required_tests:
      - completion includes canonical RawPtr members
      - unsafe members are clearly marked
      - known-null diagnostic explains that unsafe does not legalize null dereference
      - formatter preserves RawPtr[T] and member spellings
      - compiler and LSP agree on raw-pointer validity diagnostics
