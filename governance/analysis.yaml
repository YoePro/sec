    implemented:
      - canonical idiom suggestions are a shared value-only action contract distinguishing range membership with in and half-open traversal with ..<; publication prefers supported canonical replacements over explanation-only actions without changing confidence, severity, validity, analysis depth or automatic-fix proof requirements, and suppressed findings carry no preferred idiom
      - interval membership, inclusive-length endpoint, fragile inclusive Len-1 and omitted-last-element producers publish their canonical suggestions through the same preference gate; omitted-last-element suggestions now include the complete half-open replacement, while behavior-changing intent edits remain SuggestedEdit and certified equivalent rewrites remain ProvenFix
      - sec analyse and sec analyse --all show canonical idiom identity and actual replacement text; real-source regressions cover both canonical constructs, already-canonical negative cases, getter suppression, valid rewritten declarations, every analysis depth with unchanged rule gating, detached deterministic action metadata, proof downgrades and successful CLI exit without a strict language mode
      - a real-source false-positive corpus covers successor/predecessor neighbors, explicit first sentinels and manual prefixes, separately handled final elements, equal-length parallel collections, fixed-ring modulo indexes, capacity bookkeeping and proven live capacity traversal, protocol-defined ranges, explicit fixed extents and byte-buffer/raw-capacity FFI calls without guessing pointer/extent contracts from names
      - sixteen intentional cases and eleven nearby positive controls run at Interactive, Standard and Deep with complete coverage, rule-depth-aware detector checks, required suppressing evidence, source-case existence checks and deterministic reanalysis; absent FFI metadata is only negative heuristic coverage, not implemented foreign-contract analysis
      - final-element nonempty evidence survives one immediately following canonical shortened zero-based traversal that only reads/discards scalar elements of the same resolved collection; exact collection identity, pure resolved receivers and the preceding empty-exit guard are required, while calls, writes, borrows, nested execution and cleanup-bearing values remain unsupported stability boundaries
      - all current automatic fix families (bool literal equality/conversion, constant interval membership and guarded inclusive Len-1 traversal) publish value-only PitfallFixSafety evidence covering evaluation order/count, effects, panic/error behavior, ownership/move, borrowing and control flow; the common publication gate downgrades missing, incomplete, mismatched or unsupported-family certificates to SuggestedEdit, independently of finding confidence
      - canonical property access and stored-field plans exclude qualified and unqualified getters, unresolved reads, addressed/volatile storage and register fields from repeated-read elimination; a nonempty entry proof authorizes the Len-1 automatic fix only when start and Len receiver evaluation cannot invalidate it, otherwise equivalence remains unproven with a SuggestedEdit and contrary evidence
      - source regressions verify each emitted automatic replacement remains valid in its original declaration context, bool truth/effect order/count/short-circuit/failure traces and explicit consuming-call moves are preserved, interval endpoints and named bounds retain truth, and guarded range endpoints retain ascending unit-step iteration counts including empty traversal and maximum representable bounds; invalid bool/integer intent retains its owning error and no safety certificate at every analysis depth
      - inclusive-length endpoint reachability follows nested if/else paths and joins, negated and compound boolean guards, reversed resolved binding/Len comparisons, short-circuit RHS evaluation, asserts, panic, checked unreachable and branch-local break/continue/return; each access retains its own endpoint reachability, guards do not retroactively protect their own accesses, nested loop exits do not terminate the outer continuation, deferred/lambda bodies are separate execution domains, and Sema-proven dead if paths produce no endpoint finding
      - saved endpoint/live Len equality is withheld when collection replacement, structural mutation, mutable call authority or unknown calls may invalidate it across iterations; unsupported changed-length and non-unit-stride accesses mark the rule evaluation Incomplete/NotEvaluated instead of asserting invalidity or inventing a suppression, including growth that can make the old endpoint valid, while element writes retain the narrower structural-stability fact and supported half-open edits remain SuggestedEdit
      - deterministic depth-specific pitfall syntax-search budgets admit complete function/accessor bodies or module statements before contextual rule evaluation; Interactive allows 4096 AST records and nesting 64, Standard 32768/128, and Deep 262144/256, with compiler API overrides through SetPitfallBudget and no new source or CLI syntax
      - immutable Coverage metadata exposes search limits, inspected AST records and skipped units; enabled rule evaluations carry Incomplete coverage after any skipped unit and never claim NoFinding for a partial search, while findings and suppressions from completely admitted units remain available; sec analyse explains incomplete coverage without introducing a validity error
      - canonical structured PitfallFinding model with stable rule identity, family, classification, confidence, subject, evidence for and against, suppression, owning-rule linkage, suggested actions, and analysis state
      - canonical defensive rule registry with required semantic facts, minimum Interactive/Standard/Deep analysis depth, and default confidence
      - distinct Finding, NoFinding, Suppressed, NotEvaluated, and Pending states plus per-rule evaluation counts
      - immutable deterministic Analyzer snapshot API for findings, suppressed results, evaluations, evidence, suppressions, and actions
      - direct index-at-Len detection correlated through resolved binding identity and Sema-owned compiler-known Len facts
      - inclusive range endpoint detection when the same resolved loop binding indexes the same collection that supplies Len
      - suppression of the inclusive endpoint finding when a preceding semantically matched equality or ordered endpoint guard exits before the indexed access
      - endpoint-exit proof also recognizes an else-branch break or return for matched strict-less-than or not-equal conditions, and applies only to statements after the guard
      - matched endpoint guards using continue also suppress only later indexed accesses in the current iteration; an index inside the guard and conditional continues remain findings
      - ProvenInvalid and Proven classification linked to the owning bounds rule without emitting a duplicate pitfall diagnostic
      - half-open ranges, different bound/index collection identities, and guarded inclusive endpoints covered as negative or suppression cases
      - boolean-intent rule correlating resolved bool operand types, exact 0/1 constants, equality operators, and redundant outer bool conversions
      - truth-table simplification for == and != with 0, 1, true, and false in either operand order
      - one-bit register-field comparison diagnostics retain the owning bool/int type error while supplying the intended direct or negated bool replacement
      - coalescing of outer bool conversion and inner literal comparison into one structured finding and one non-overlapping action
      - ProvenFix actions for valid true/false simplifications and SuggestedEdit actions for invalid but unambiguous bool/0-or-1 intent
      - negative coverage preventing boolean-intent inference from integers other than 0 and 1
      - API-usage finding for self.Method(self) when Sema resolves an instance method and self is both its implicit receiver and a direct explicit argument; ordinary functions, static methods, other receivers, unresolved calls, and indirect self expressions remain excluded
      - pitfall suppression coverage derives its evaluation-count expectation from the canonical rule registry, so adding an unrelated registered rule does not break the guarded inclusive-endpoint regression test
      - ineffective <= Len acceptance and > Len rejection guards correlate the same resolved index binding, compiler-known Len receiver, and indexed collection; reversed operands are normalized while strict-safe guards, wrong collections, and wrong bindings remain negative cases
      - upper i+1 and lower i-1 neighbor checks cover the canonical zero-based half-open 0..<Len domain using resolved loop-binding and collection identity, compiler-known Len, normalized 1+i, and Sema constant facts; shortened upper domains, predecessor traversal starting at one, guarded access, and identity mismatches are excluded
      - final-element Len - 1 access is correlated through compiler-known Len and resolved collection identity; adjacent Len == 0 or compiler-known IsEmpty exits and direct Len > 0, 0 < Len, Len != 0, negated IsEmpty, or complementary equality/IsEmpty branch facts supply explicit non-empty suppression evidence, while missing, expired, non-exiting, and wrong-collection proofs remain findings
      - high-confidence skipped-first-element analysis recognizes canonical uint(1)..<collection.Len traversal with direct induction-variable indexing of that same resolved collection; predecessor access and dominating same-block handling of collection[0] produce structured suppressed results, while conditional or wrong-collection handling does not suppress
      - "`sec analyse` and `sec analyse --all` run pitfall analysis by default at Deep depth and present the structured findings, suppressed findings with reasons, evidence, proven-fix versus suggested-edit actions, and not-evaluated rules; ProvenInvalid findings remain errors (exit code 3) and are never downgraded, while LikelyMistake and SuspiciousIntent findings are advisory"
      - interval-condition rules pitfall.range.tautological-interval and pitfall.range.impossible-interval (Interactive, LikelyMistake, proven) normalize `&&`/`||` pairs of ordered comparisons of one resolved integer binding or field chain against integer literals, in either operand order, into closed half-lines and prove coverage of every integer (L <= U + 1) or emptiness (L > U); floating-point subjects are excluded because NaN breaks the total order, and only literal bounds are used so no proof depends on scope-transient binding values
      - an inclusive tautology such as `value >= 0 || value <= 10` carries a SuggestedEdit to canonical `value in 0..10` rather than an operator swap
      - pitfall.range.membership-idiom (Deep, SuspiciousIntent, proven) offers a ProvenFix from a non-empty literal `x >= a && x <= b` or `x >= a && x < b` to `x in a..b` or `x in a..<b`; a property subject that may run a getter is retained as a suppressed result with evidence because collapsing two evaluations into one is not proven semantics-preserving
      - interval-condition proofs accept named compile-time constants as bounds; Sema records the value of each non-literal comparison operand that is an immutable, non-transient constant in the operand's own scope (comparisonConstantOperands), so sibling scopes reusing a name are resolved correctly, mutable or transient bindings are never bounds, comparisons of two constants stay with the unreachable-code rules, and membership rewrites keep the written names (`value in FLOOR..LIMIT`); the meaningless-comparison rule reads the same scope-correct fact instead of a post-hoc name lookup
      - interval-condition proofs cover char subjects ordered by their one-byte value (bounds are ASCII character literals or values 0..255; a non-ASCII character literal names no single byte and yields no proof, see missing-decisions.yaml MD-043) and rune subjects ordered by Unicode scalar value, with character-literal and t/r-suffixed bounds and `in` rewrites such as `letter in 'a'..'z'`; enums have no ordered comparison in Sec 0.1 (rules/foundations/operators.md "Enum equality"), so no enum interval exists to prove
      - interval-condition proofs flatten `&&`/`||` chains of any length, group comparisons by resolved subject, and decide a conjunction by its tightest bounds and a disjunction by its loosest bounds while unrelated operands are ignored; each chain is reported once, and whole-condition membership rewrites are offered only when the chain is exactly the one bound pair
      - constrained-type domains need no separate interval proof, as shown by a proof plus a regression test: Sema rejects every constant bound outside the subject's domain [min, max], so an empty conjunction would need L = max+1 <= U and a covering disjunction would need U = max with L > max+1, and neither is expressible; TestPitfallIntervalDomainBoundsAreRejectedBySema guards that premise
      - path-sensitive strict index guards (`index < X.Len` or `X.Len > index` conjuncts of if and while conditions, and the binding of a half-open `start..<X.Len` for loop) are tracked as an active guard stack through the pitfall walk
      - pitfall.control-flow.wrong-guard-subject (Interactive, LikelyMistake, High) reports a straight-line `Y[b]` access in a strict-guarded block when no access in that block uses the guarded pair and no guard on the path covers `Y[b]`, the copy/paste shape `if leftIndex < left.Len { right[rightIndex] }`; blocks that use the guarded pair, conjunctions covering the access, enclosing if/while/loop guards, `<=` guards (owned by the ineffective-guard rule), and accesses inside nested control flow stay silent
      - pitfall.control-flow.check-without-transfer (Interactive, LikelyMistake, High) reports `if index >= X.Len { ... }` (or a strict `>` rejection, either operand order) whose branch neither leaves the path (break, continue, return, panic, checked unreachable) nor may re-establish the index (assignment at any depth, compound or `++`/`--`, or `ref mut` passing), directly followed by `X[index]`; no control transfer is suggested because the intended one cannot be inferred
      - "pitfall.iteration.structural-mutation-in-indexed-loop (Interactive, family iteration-and-mutation, 2026-10-03) correlates a forward `start..<X.Len` / `start..X.Len` for loop without step, whose end is evaluated once, with compiler-known StructuralMutation calls on the same resolved collection anywhere in the body; Clear() followed on the same straight-line path by `X[binding]` is ProvenInvalid (proven), RemoveAt/Remove/Clear/Insert while the loop indexes X by its binding or passes the binding to the mutation is LikelyMistake (high) with a SuggestedEdit to traverse in reverse or use an index-advancing while loop, and a mutation directly followed by return or by break of this loop (not of a nested loop), an Append beyond the once-evaluated range, or a loop that never addresses X by its binding (draining) is retained as a suppressed result with its reason. Tests: internal/sema/pitfall_indexed_mutation_test.go"
      - "pitfall.bounds.capacity-as-length (Interactive, LikelyMistake, high, 2026-10-04) reports a `start..<X.Capacity` / `start..X.Capacity` loop that indexes the same resolved collection with its binding, with a SuggestedEdit replacing Capacity by Len; a proven `X.Len == X.Capacity` (either order, also as an `&&` conjunct) from a preceding assert in the same block or an enclosing if condition suppresses it unless the collection is structurally mutated after the proof or inside the loop. A direct `X[X.Capacity]` is ProvenInvalid (Len never exceeds Capacity) and a direct `X[X.Capacity - k]` with a positive constant k is a high-confidence LikelyMistake suppressed by the same proof. Tests: internal/sema/pitfall_capacity_length_test.go"
      - "pitfall.collection.wrong-bound-source (Interactive, LikelyMistake, high, family collection-relations, 2026-10-04) reports a `start..<left.Len` loop whose binding indexes only a different resolved collection while `left` is otherwise unused in the body, with a SuggestedEdit to the indexed collection's Len; a proven `right.Len >= left.Len`, `>`, or equality (either operand order, && conjuncts, || disjuncts of a false guard) from a preceding assert, a preceding exit guard, or an enclosing if condition suppresses it unless either collection is structurally mutated after the proof or the indexed one inside the loop; parallel traversals are left to bounds. Code: internal/sema/pitfall_wrong_bound_source.go. Tests: internal/sema/pitfall_wrong_bound_source_test.go"
      - "pitfall.range.meaningless-comparison (Deep, SuspiciousIntent, proven, 2026-10-04) reports a comparison (<, <=, >, >=, ==, !=, either operand order) of a non-constant integer value with an integer literal whose result the value's type range narrowed by range contracts decides, with evidence naming the range and the constant result; path facts are excluded, and the S3001 relational path proof ignores conditions the type range alone decides so the two never overlap. Code: internal/sema/pitfall_meaningless_comparison.go. Tests: internal/sema/pitfall_meaningless_comparison_test.go"
      - "pitfall.range.omitted-last-element (Standard, LikelyMistake, high, 2026-10-04) reports a zero-based `0..<X.Len - 1` loop without step that indexes X with its binding; a successor access `X[i + 1]` (pairwise traversal) or a separate `X[X.Len - 1]` access in another straight-line statement of the same block suppresses it. pitfall.range.fragile-inclusive-length (Interactive, 2026-10-04) reports `start..X.Len - 1`: with a non-empty proof on entry to the loop (inherited branch proof or a directly preceding empty-collection exit guard) it is SuspiciousIntent, proven, with a ProvenFix to `start..<X.Len`; without one it is a high-confidence LikelyMistake because Len - 1 underflows for an empty collection, with a SuggestedEdit to the same form. walkBlock now exposes the entry non-empty proof to loop inspections, not only to straight-line statements. Tests: internal/sema/pitfall_length_endpoint_test.go"
