    tests:
      - internal/parser/parser_test.go
      - internal/sema/analyzer_test.go
      - internal/sema/ffi_generic_extern_test.go
      - internal/diagnostics/diagnostics_test.go
      - cmd/lsp/ffi_generic_extern_test.go
      - internal/codegen/llvm/generator_test.go
      - internal/codegen/mlir/generator_test.go
      - testdata/ir/test_ffi_link_name.sec
      - internal/parser/foreign_types_test.go
      - internal/sema/foreign_c_types_test.go
      - internal/layout/c_abi_test.go
      - internal/formatter/declaration_forms_test.go
      - cmd/compiler/analyse_test.go
      - internal/sema/ffi_legality_test.go
      - internal/sema/null_sentinel_test.go
    implemented:
      - bodyless extern C, system, and Sec function declaration parsing and AST retention
      - parser and defensive Sema rejection of body-bearing extern declarations
      - Linux inline-assembly syscall implementations migrated from body-bearing extern to ordinary unsafe Sec functions
      - rejection of unknown extern calling-convention strings during semantic registration
      - ordinary extern calls permitted without an unsafe context solely for foreignness
      - unsafe extern declarations preserved in Sema and calls rejected outside an explicit unsafe context
      - call-bounded non-null ref and ref mut extern parameters accepted by position-specific FFI validation
      - raw foreign ref and ref mut returns remain rejected as non-ABI-compatible
      - RawPtr and fixed-width integer and floating scalar gating for current extern signatures
      - direct Sec string and other obviously non-ABI-compatible signature types rejected
      - explicit @link_name parsing, AST and semantic retention, linked backend symbol selection, and duplicate-symbol validation
      - foreign call kind, ABI, symbol, and unsafe declaration provenance retained through existing Semantic IR
      - fixed-width scalar and RawPtr lowering through maintained LLVM and legacy MLIR paths
      - Sema rejects unresolved generic extern declarations before callable registration with mandatory S1041, preserves later concrete extern declarations, and reports the generic parameter source location
      - "the parser recognizes C::name and c::namespace::name in type and conversion position from two adjacent colon tokens (MD-020), keeps the whole qualification as one name token with retained separators, reports malformed qualifications as P2021 parser.malformed-foreign-qualification, and reports the not-yet-implemented C::fn, C::flex, and C::callback forms as P2022 parser.unsupported-foreign-form; fields or locals named c or C keep their meaning"
      - "every registered target carries a validated C ABI model in its CompilationPlan (LP64 SysV/Darwin/BSD, LLP64 Windows, ILP32 AAPCS and RISC-V): integer widths, plain char signedness, bool storage, and long double format (x87 extended, binary128, or binary64), checked for coherence with the target pointer width"
      - "Sema registers all fifteen C:: fundamental scalars from the active model as distinct types: no implicit initialization between C:: types and Sec scalars or between different C:: types (C::bool included), explicit conversions in both directions, and representable integer, floating, and boolean literal shaping with per-target range checks (MD-022)"
      - "an unknown C:: name uses S1076 ffi.unknown-c-fundamental-type, a target or analyzer without a C ABI model uses S1077 ffi.c-abi-model-unavailable, and c:: names use S1078 ffi.unresolved-c-binding-type until a binding environment exists (MD-021)"
      - "a parser-confirmed CST role keeps foreign-qualified names contiguous in the formatter"
      - "extern \"C\" and extern \"system\" signatures are validated per position through one legality classifier: C:: scalars (now including C::bool), fixed-width Sec scalars, RawPtr[T], integer-backed enums, void returns, and ref/ref mut parameters with foreign-representable referents (including fixed arrays) are legal; Sec bool/char/rune, string, decimal, owning dynamic arrays, slices, fixed arrays by value, Option, Result, native collections, ordinary structs and tagged unions, callable values, interfaces, any, string-backed enums, and reference returns are rejected with S1079 ffi.illegal-foreign-type naming the declaration, position, type, ABI, reason, and corrective help; return-type errors point at the written return type; the Sec ABI keeps its ordinary gate. Target-sized int/uint, 128/256-bit integers, and integer-backed Sec enums keep their earlier acceptance pending MD-023"
      - "the null sentinel is unsafe-only and has no standalone type: inside unsafe it takes its RawPtr[T] type from an annotation, assignment, return, or an argument position on which every candidate callable agrees, and otherwise reports S1081 ffi.null-without-raw-pointer-context; outside unsafe it reports S1080 ffi.null-outside-unsafe; `== null` and `!= null` report S1082 ffi.null-equality in every context; `raw is null` parses as a dedicated NullTestExpression in if/while conditions, requires unsafe and a RawPtr[T] subject (S1083 ffi.null-test-requires-raw-pointer), and yields bool; `is not null` is rejected; a visible binding named null shadows the contextual sentinel (MD-024); Semantic IR and LLVM reject the node explicitly until lowering"
    remaining:
      - "resolve c:: binding types through the target/library binding environment once it is defined (MD-021); C:: fundamentals and c:: parsing are implemented"
      - "make possibly-narrowing C/Sec scalar conversions fallible (try) together with the general checked-conversion contract (MD-012); give the LSP the project CompilationPlan target so C:: types resolve in the editor instead of reporting S1077"
      - "add target-specific calling-convention availability and ABI-model-dependent classification (aggregate, variadic, and function-pointer forms) before backend lowering; per-position type legality is implemented (S1079) apart from the MD-023 scalar and enum questions"
      - "record is null branch refinement as a non-null proof fact for raw-to-safe conversion once that conversion exists; resolve the null lexical status, safe null-test spelling, and negated form (MD-024)"
      - parse and validate complete and incomplete extern C structs with ABI layout and no implicit Defaultable construction
      - implement untagged extern C unions with ABI layout and foreign-unsafe member-access facts
      - implement open extern C enums with ABI-selected representation and unknown-value handling
      - parse, lay out, range-check, and lower C bitfields including unnamed and zero-width rules and non-addressability
      - implement final-field-only descriptor-free C::flex flexible-array members
      - validate foreign references as non-retained call-bounded borrows and connect them to borrow, lifetime, escape, and effect analyses
      - add C::fn foreign function-pointer types, nullable-call proof, ABI classification, and lowering distinct from native callable types
      - implement C::callback for exact environment-free reusable callables and reject capturing, mut fn, and consuming callables
      - implement final bare C varargs only for unsafe extern C and C::fn, including default promotions and target classification
      - keep C varargs distinct from native typed variadics, Sec spread, ref parameters, and native pack representation
      - add explicit string encoding, termination, embedded-zero, buffer length, and incoming foreign-text wrapper support without hidden string ABI conversion
      - model foreign resources through nominal Sec owners, explicit retain/clone, transfer-on-success, and fallible-close contracts
      - keep raw foreign status/null/error protocols distinct from Result and Option until wrappers normalize them
      - reject unwind and non-local transfer across active FFI and callback boundaries
      - preserve trusted extern effect-contract provenance and treat unspecified foreign effects conservatively
      - resolve libraries, objects, frameworks, import libraries, and search paths through package/build CompilationPlan metadata
      - preserve foreign data kind, ABI identity, bitfield/flex metadata, function pointers, callback adaptation, varargs, effects, and dependencies in Semantic IR and Sec MLIR
      - add the complete parser, Sema, borrow, lifetime, ownership, effects, layout, formatter, LSP, target, Semantic IR, MLIR, LLVM, and diagnostic regression matrix required by ffi.md
    excluded:
      - C or C++ header parsing, preprocessing, typedef syntax, macros, and static-inline import
      - general named Sec-to-C symbol export
      - capturing closure adaptation to C callbacks
      - automatic slice decomposition and implicit Sec string to C string conversion
      - per-function @library annotations
      - foreign unwind across Sec frames
