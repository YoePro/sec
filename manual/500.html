<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>500 - Serverfel</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Arial Black', Arial, sans-serif;
  }

  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at 50% 100%, #3d0a0a 0%, #1a0505 50%, #0a0202 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* ===== GLÖD NERSTÅ FRÅN ELDEN ===== */
  .glow {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 140%;
    height: 60%;
    background: radial-gradient(ellipse at 50% 100%, rgba(255, 80, 0, 0.35) 0%, rgba(255, 40, 0, 0.15) 40%, transparent 70%);
    animation: glowPulse 2s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { opacity: 0.7; }
    50%      { opacity: 1; }
  }

  /* ===== BASEN / ASKAN ===== */
  .embers-base {
    position: absolute;
    bottom: -40px;
    left: -10%;
    width: 120%;
    height: 80px;
    background:
      radial-gradient(ellipse 8% 60% at 20% 100%, #2b0d0d 99%, transparent),
      radial-gradient(ellipse 10% 80% at 45% 100%, #3d1212 99%, transparent),
      radial-gradient(ellipse 8% 55% at 70% 100%, #2b0d0d 99%, transparent),
      radial-gradient(ellipse 12% 70% at 90% 100%, #3d1212 99%, transparent);
    z-index: 5;
  }

  /* ===== FLAMMOR ===== */
  /* Varje flamme är en div som formges med border-radius + rotation,
     och animeras i höjd/skalning/krökning för dansande eld */
  .fire {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 100%;
    height: 70%;
    transform: translateX(-50%);
    pointer-events: none;
  }

  .flame {
    position: absolute;
    bottom: 0;
    border-radius: 50% 50% 20% 20%;
    transform-origin: bottom center;
    filter: blur(14px);
  }

  /* Yttre röda lågor – breda och stora */
  .flame-outer {
    width: 130px;
    height: 340px;
    background: linear-gradient(180deg, transparent 0%, #8b0000 30%, #e30b0b 70%, #ff4500 100%);
    animation: flameDance1 1.3s ease-in-out infinite alternate;
  }
  .flame-outer:nth-child(1) { left: 32%; animation-duration: 1.1s; animation-delay: 0s; }
  .flame-outer:nth-child(2) { left: 42%; animation-duration: 1.4s; animation-delay: 0.3s; height: 380px; }
  .flame-outer:nth-child(3) { left: 52%; animation-duration: 1.0s; animation-delay: 0.6s; }
  .flame-outer:nth-child(4) { left: 62%; animation-duration: 1.25s; animation-delay: 0.15s; height: 360px; }
  .flame-outer:nth-child(5) { left: 22%; animation-duration: 1.35s; animation-delay: 0.45s; height: 300px; }
  .flame-outer:nth-child(6) { left: 72%; animation-duration: 1.15s; animation-delay: 0.25s; height: 310px; }

  /* Mellanlager – orange */
  .flame-mid {
    width: 90px;
    height: 250px;
    background: linear-gradient(180deg, transparent 0%, #ff4500 40%, #ff6b00 75%, #ff8c00 100%);
    animation: flameDance2 0.9s ease-in-out infinite alternate;
  }
  .flame-mid:nth-child(7)  { left: 38%; animation-duration: 0.8s;  animation-delay: 0.1s; }
  .flame-mid:nth-child(8)  { left: 48%; animation-duration: 1.0s;  animation-delay: 0.35s; height: 280px; }
  .flame-mid:nth-child(9)  { left: 58%; animation-duration: 0.7s;  animation-delay: 0.5s; }
  .flame-mid:nth-child(10) { left: 68%; animation-duration: 0.95s; animation-delay: 0.2s; height: 260px; }

  /* Innersta – gula vita heta kärnor */
  .flame-core {
    width: 55px;
    height: 160px;
    background: linear-gradient(180deg, transparent 0%, #ff8c00 40%, #ffd700 75%, #fff5cc 100%);
    filter: blur(8px);
    animation: flameDance3 0.6s ease-in-out infinite alternate;
  }
  .flame-core:nth-child(11) { left: 42%; animation-duration: 0.5s; animation-delay: 0.05s; }
  .flame-core:nth-child(12) { left: 52%; animation-duration: 0.65s; animation-delay: 0.25s; height: 180px; }
  .flame-core:nth-child(13) { left: 62%; animation-duration: 0.55s; animation-delay: 0.4s; }

  /* Dansande flammor: krympa, växa, böja åt sidan */
  @keyframes flameDance1 {
    0%   { transform: scaleX(1) scaleY(1) rotate(-3deg) translateX(0); }
    33%  { transform: scaleX(0.85) scaleY(1.15) rotate(4deg) translateX(-8px); }
    66%  { transform: scaleX(1.1) scaleY(0.9) rotate(-5deg) translateX(6px); }
    100% { transform: scaleX(0.9) scaleY(1.08) rotate(3deg) translateX(-4px); }
  }

  @keyframes flameDance2 {
    0%   { transform: scaleX(0.95) scaleY(1.1) rotate(5deg) translateX(5px); }
    50%  { transform: scaleX(1.15) scaleY(0.85) rotate(-4deg) translateX(-7px); }
    100% { transform: scaleX(0.85) scaleY(1.2) rotate(2deg) translateX(4px); }
  }

  @keyframes flameDance3 {
    0%   { transform: scaleX(1) scaleY(1.25) rotate(-6deg); }
    100% { transform: scaleX(0.8) scaleY(0.9) rotate(7deg); }
  }

  /* ===== GNISTOR ===== */
  .spark {
    position: absolute;
    bottom: 10%;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #ffb347;
    box-shadow: 0 0 8px 2px rgba(255, 150, 0, 0.8);
    animation: sparkRise linear infinite;
    opacity: 0;
  }

  .spark:nth-child(1)  { left: 40%; animation-duration: 2.2s; animation-delay: 0s; }
  .spark:nth-child(2)  { left: 48%; animation-duration: 1.8s; animation-delay: 0.4s; background: #ff6b35; }
  .spark:nth-child(3)  { left: 55%; animation-duration: 2.5s; animation-delay: 0.9s; }
  .spark:nth-child(4)  { left: 62%; animation-duration: 1.6s; animation-delay: 0.2s; background: #ffd700; }
  .spark:nth-child(5)  { left: 45%; animation-duration: 2.0s; animation-delay: 1.1s; }
  .spark:nth-child(6)  { left: 58%; animation-duration: 1.7s; animation-delay: 0.6s; background: #ff4500; }
  .spark:nth-child(7)  { left: 35%; animation-duration: 2.4s; animation-delay: 1.4s; }
  .spark:nth-child(8)  { left: 66%; animation-duration: 1.9s; animation-delay: 0.8s; background: #ffd700; }

  @keyframes sparkRise {
    0%   { transform: translate(0, 0) scale(1); opacity: 0; }
    10%  { opacity: 1; }
    50%  { transform: translate(-30px, -45vh) scale(0.8); opacity: 0.8; }
    100% { transform: translate(25px, -80vh) scale(0.3); opacity: 0; }
  }

  /* ===== TEXT ===== */
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    margin-bottom: 20%;
    animation: heatShiver 1.5s ease-in-out infinite;
  }

  .content h1 {
    font-size: clamp(5rem, 20vw, 12rem);
    line-height: 1;
    background: linear-gradient(180deg, #fff5cc 0%, #ffd700 30%, #ff4500 65%, #b30000 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 30px rgba(255, 69, 0, 0.8))
            drop-shadow(0 0 60px rgba(227, 11, 11, 0.5));
    /* Liten "trevibrerande" skakning som från het metall */
  }

  .content p {
    font-size: clamp(1rem, 4vw, 2rem);
    letter-spacing: 0.5em;
    margin-top: 1rem;
    color: #ff9a76;
    text-shadow: 0 0 15px rgba(255, 69, 0, 0.6);
  }

  .content a {
    display: inline-block;
    margin-top: 2.5rem;
    padding: 14px 36px;
    font-size: 1rem;
    font-weight: bold;
    letter-spacing: 0.15em;
    color: #0a0202;
    text-decoration: none;
    background: linear-gradient(90deg, #ffd700, #ff4500, #e30b0b);
    background-size: 200% 100%;
    border-radius: 50px;
    animation: buttonFire 2s linear infinite;
    transition: transform 0.2s;
  }

  @keyframes buttonFire {
    0%   { background-position: 0% 0; box-shadow: 0 0 20px rgba(255, 69, 0, 0.5); }
    50%  { background-position: 100% 0; box-shadow: 0 0 40px rgba(255, 215, 0, 0.8); }
    100% { background-position: 0% 0; box-shadow: 0 0 20px rgba(255, 69, 0, 0.5); }
  }

  .content a:hover {
    transform: scale(1.1) rotate(-2deg);
  }

  /* Skakning som het glas/metall – snabb och liten */
  @keyframes heatShiver {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(1px, -2px); }
    50%  { transform: translate(-2px, 1px); }
    75%  { transform: translate(2px, 2px); }
    100% { transform: translate(0, 0); }
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="glow"></div>
    <div class="embers-base"></div>

    <div class="fire">
      <!-- Yttre röda lågor -->
      <div class="flame flame-outer"></div>
      <div class="flame flame-outer"></div>
      <div class="flame flame-outer"></div>
      <div class="flame flame-outer"></div>
      <div class="flame flame-outer"></div>
      <div class="flame flame-outer"></div>
      <!-- Mellanlager orange -->
      <div class="flame flame-mid"></div>
      <div class="flame flame-mid"></div>
      <div class="flame flame-mid"></div>
      <div class="flame flame-mid"></div>
      <!-- Inre heta kärnor -->
      <div class="flame flame-core"></div>
      <div class="flame flame-core"></div>
      <div class="flame flame-core"></div>
      <!-- Gnistor -->
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
    </div>

    <div class="content">
      <h1>500</h1>
      <p>Internal Server Error</p>
      <a href="/">BACK TO HOMEPAGE</a>
    </div>
  </div>
</body>
</html>
