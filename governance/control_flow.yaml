      - plain element bindings whose yielded type is move-only or non-copyable are rejected with ref guidance instead of silently moving or borrowing
      - float and decimal range iteration requires an explicit step, and an unsigned range rejects a compile-time negative step
      - for statement analysis lives in internal/sema/analyzer_for.go with per-function rulebook traceability
      - while a loop iterates reusable dynamic-array, list, map, or set storage, a compiler-known structural operation (selected by the registry StructuralMutation contract, never by name) or an assignment on the iterated collection or any storage enclosing it is rejected with mandatory S1075 for.structural-mutation-during-iteration, the operation, both Places, help, and the loop location; element assignment, mutation inside one element or through a ref mut binding, sibling storage, ranges, and code after the loop remain valid
      - "generic iterator parameters (2026-10-10): a for loop over a generic parameter constrained by Iterator[T], by value (fn F[I: Iterator[T]](values: I)) or as ref mut I, takes its element type and Next requirement from the constraint without an interface value or dispatch; each specialization resolves the concrete Next statically, a ref mut I parameter infers I from an owned mutable argument through the implicit call-site borrow (borrowing.md §15.2), and lowering readiness reports such template loops as Unproven (per-specialization lowering) instead of Invalid"
      - "loop-binding borrows (2026-10-29, flowcontrol_for.md §§6-7; borrowing.md §§8.1(11), 14.5(2), 18(4)): every ref and ref mut loop binding holds a shared or exclusive borrow of the iterable Place, so reads, assignments and borrow creation that conflict with the live binding inside the body are rejected through the canonical S1160-S1162 diagnostics naming the binding as holder. The borrow is iteration-local: holder liveness ends it after the binding's last required use (a binding is fresh per iteration, and a later loop reusing the name is not a use), and the loop clears it at the iteration boundary and on every break and continue edge. The rulebook's iteration-local end points replace the earlier whole-body wording of this item; structural mutation keeps its dedicated S1075 check, and iteration dependency facts publish the binding borrow once in the iteration-binding phase (TestForBindingBorrowsIterable, TestIteratorStorageAndBorrowDependencies)"
      - "binding-position modes (verified 2026-10-29, flowcontrol_for.md §§9, 14, 20, 21): the sequential two-binding index is an ordinary int (or discard) and rejects reference modes; map iteration accepts plain, ref and ref mut values with mutable authority, shared or plain keys, and rejects ref mut keys and ref mut through a shared map; set iteration accepts plain-copy and shared-reference elements and rejects ref mut; discard bindings introduce no copy or move requirement, so move-only elements may be discarded (TestForBindingPositionModes, TestForBindingModeDiagnostics)"
    remaining:
      - "MD-117 heterogeneous iteration: produce concrete per-position expansion plans for ordinary for, for ref and for ref mut with statically typed indexes/Len; reject by-value iteration of move-only elements and runtime heterogeneous indexing, preserve empty iteration, break/continue/return/defer/try/panic and executed side effects without a for static keyword (flowcontrol_for.md §13A; correction §5)."
      - carry Arena generation through the shared loop-header and backedge fixed-point analysis, including continue edges and replay
      - normalize loop-header whitespace in the formatter (the formatter currently preserves intra-line spacing in every for header) and expose binding modes through compiler-owned LSP facts beyond the resolved reference type
      - "lower explicit for range steps (Known hole, verified 2026-10-17): Semantic IR rejects `step` as 'for range with an explicit step'"
      - require explicit compatible negative steps for descending iteration without synthesizing signed conversion for unsigned ranges
      - complete float and decimal range lowering with resolved-type arithmetic and stable source-visible endpoint behavior
      - lower dynamic arrays, lists, slices, strings, maps, sets, and vectors through Semantic IR and the compilation track
      - extend structural-stability checking to user-defined operations and calls that receive mutable authority over the iterated collection (requires interprocedural structural-mutation summaries) and to collections reached through Iterator[T] sources
      - lower compiler-known Iterator[T] loops through Semantic IR and the compilation track as repeated statically resolved Next calls with Some/None control flow and cleanup
      - expose Iterator[T], resolved element type, and selected Next operation in dedicated LSP hover and completion contexts beyond ordinary shared Sema diagnostics
      - complete iterator ownership and cleanup validation for move-only yielded T, break, continue, return, and error exits
