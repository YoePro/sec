    implemented:
      - "Sema: ResolvedFloat* operator kinds for unary +/-, + - * / % and == != < <= > >= over one built-in float type, float compound assignment, and context shaping of untyped literals beside a float operand, in a float context (let/return/argument) and through a sign prefix; fixed in passing: float64 + 2.0 and decimal % decimal no longer type silently as invalid, and decimal mixed with another numeric family is diagnosed"
      - "Semantic IR: const.float carries FloatConstant bits/format rounded once from the exact source value (no binary64 intermediate for binary32, overflow rejected, underflow to signed zero/subnormal); float.neg, float.binary {add,sub,mul,div,rem}, float.compare; unary plus is the SSA identity; `-literal` is literal shaping followed by float.neg (P20 § 17)"
      - "Sec dialect (schema 11, early): sec.const.float {bits}, sec.float.neg, sec.float.binary, sec.float.cmp with verifiers; scalar layout resolves plain !sec.float to f32 on 32-bit and f64 on 64-bit plans (MD-014)"
      - "native track: sec-lower-floats lowers constants from canonical bits (no lexeme reparse), arithmetic to arith addf/subf/mulf/divf without fastmath and exact integer/CF significand reduction for truncation remainder (2026-10-26: removes the undeclared fmod/fmodf dependency) and comparisons to cmpf oeq/une/olt/ole/ogt/oge; registered in sec-check-lowering-support"
      - "build: LLVM IR is compiled to an object by the llc of the same LLVM build as mlir-translate (textual IR is version-specific; system clang 21 rejected the newer float constant syntax) and clang only links the object (user decision 2026-10-18)"
      - "core members (2026-10-26; owner decided PascalCase spellings, core-library.md §§ 7.1/8.1/9.1): Sema resolves T.Min/Max/Epsilon/Infinity/NegativeInfinity/NaN and Abs, Min, Max, Clamp (Result[T, RangeError]), IsFinite/IsInfinite/IsNaN/IsNormal/IsSubnormal, Floor/Ceiling/Truncate/Round as CKM-FLOAT-* members with arity and same-type checks; integer T.Min/Max/Bits are exact const.int"
      - "Semantic IR and Sec dialect (schema 11, early): float.abs/minimum/maximum/classify/round/property and float.clamp-checked (value, failed; the value consumed only on success, verified with the checked-conversion candidate rule) building Err(RangeError.InvalidRange) or Ok"
      - "native track: sec-lower-floats lowers them with Arith only (no runtime library or libm call): abs/classify through bitcast and field masks (§ 78), minimum/maximum to minimumf/maximumf (§ 36), rounding through a |x| < 2^p guarded conversion keeping signed zero/NaN/infinity, properties to exact APFloat constants, Clamp via cmpf uno/ogt and minimumf/maximumf; SquareRoot stays deferred (no MathError, § 37)"
      - "P20-22 (2026-10-26): sec-verify-float-semantics validates registered float operation formats, constant bits, predicates, remainder/classification/round/property kinds and Clamp types; rejects explicit non-nearest-even, fast-math, contraction and denormal weakening policies at module/function/operation scope; requires Clamp candidates to stay on their guarded success edge. sec-lower-floats invokes the same verifier before erasing Sec operations. Historical lexeme-only constants still round-trip outside this P20 boundary; no schema-16 acceptance claim."
      - "P20-11 (2026-10-26): Sema publishes value-only ResolvedFloatOperation snapshots for all primitive unary, binary, comparison and compound operators; facts retain common source identity, selected format and plan width, source operator, canonical NaN-aware predicate, nearest-even/no-fast-math/no-contraction/subnormal-preserving policies and truncation remainder. Read-only expression and assignment queries cannot alias stored facts; planless platform float explicitly retains unknown format rather than borrowing the host width."
      - "P20-28 (2026-10-26): one native support classifier admits all eleven represented float operation families, including core members and Clamp. Entry rejects lexeme-only float constants before conversion and reports unsupported Sec operations with the unsupported-lowering category; regression tests retain decimal/decimal128 and unimplemented float conversion boundaries. The native driver selects only sec-lower-to-llvm (MD-101); no alternate backend or fallback was introduced."
      - "P20-10 and P20-29 (2026-10-26): audited literal lexing/parsing/source preservation; Sema shapes g literals, signs and unsuffixed integer forms in float contexts and after call overload selection, refreshes sign operator facts after width shaping and rejects explicit i/u/m family changes. Shared constant.FloatLiteralBits rounds exact source directly at binary32/binary64 for both CTE and Semantic IR; CTE preserves signed zero through negation and rechecking. Source-backed 63-case matrix uses independent rational oracles on selected 32/64-bit plans, with spelling/location checks, decimal and integer-form double-rounding witnesses, subnormal/underflow/overflow and rejecting family fixtures. Native float_literals executes direct-width rounding and signed-zero cases. Full CTE arithmetic/core/conversion folding remains independently owned by P20-19."
      - "P20-30 (2026-10-26): full arithmetic/comparison source matrix for float32/float64/plain float verifies through Semantic IR and emission on both 32/64-bit plans and executes with runtime operands natively on the hosted 64-bit target. Covers all arithmetic/predicates, unary signs, NaN in both operand orders, signed zero, infinity, overflow and gradual underflow. Nonconstant remainder exposed an undeclared fmod/fmodf dependency; exact bounded significand reduction in integer/CF removes it, with 584 bitwise edge/random native comparisons against an independent oracle and no math library."
      - "P20-25 (2026-10-26): core operation lowering audited and executed for all primitive float types, including properties, Abs, NaN-propagating Min/Max, classification and guarded rounding over signed zeros, half ties, subnormals, finite extremes, infinities and NaN. Forty-five additional dialect-native Clamp cases verify candidate/failure edges, NaN bounds/input, inverted/equal/infinite bounds and zero sign without linking a math library. This completes the operation lowering point; public Result/union physical materialization and P20-27 target capabilities remain independently gated."
