    implemented:
      - canonical assert statement AST and parsing support both Sec 0.1 forms, including optional comma plus string-literal metadata
      - parser emits focused diagnostics for missing message comma, dynamic message forms, and non-canonical function-like spelling
      - semantic analysis requires the assertion condition to have exact bool type without truthiness conversion
      - focused parser and semantic tests cover accepted forms and the locked syntax/type diagnostics
      - reachable assertions with unproven conditions record a direct MayPanic assertion effect; literal true and statically unreachable branches contribute no assertion effect
      - literal-false assertions are non-returning frontend control-flow paths, satisfy non-void return-path checks, and make following statements unreachable; unproven assertions may continue
      - panic is a hard lexer keyword and the parser retains canonical panic string-literal statements in a dedicated AST node
      - explicit panic is non-returning in frontend control-flow analysis and records a direct may-panic-explicit effect for @noPanic verification
      - the shared formatter preserves canonical panic statement spacing idempotently
      - checked unreachable is recognized in its canonical payload-free statement context with a dedicated AST node while remaining an ordinary identifier outside that context, matching the canonical keyword inventory; formatter coverage is idempotent
      - reachable checked unreachable terminates the block, satisfies non-void return-path analysis, and records a direct may-panic-unreachable effect; statically unreachable occurrences contribute no effect
      - compiler-known nominal PanicID has the fixed uint32 representation, and compiler-known PanicInfo exposes exactly ID, File, Line, Column, and Function through one canonical Sema type also used by TaskOutcome.Panicked and LSP member completion
      - every semantically valid assertion publishes a read-only resolved fact with the stable AssertionFailed category, condition, optional static message, exact file/line/column/function provenance, and current proof state; querying unknown syntax does not synthesize facts
