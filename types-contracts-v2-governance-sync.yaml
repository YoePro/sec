schema_version: 1
area: types
purpose: 'Governance synchronization fragment for the normative contract semantics defined by rules/types/contracts.md
  revision 2.0. Entries use stable IDs so implementation status can be consumed mechanically and merged
  into the canonical governance ledger.

  '
source_rulebook:
  path: rules/types/contracts.md
  revision: '2.0'
verification:
  reviewed: 2026-09-25
  code_evidence:
  - internal/parser/parser.go
  - internal/sema/contracts.go
  - internal/sema/analyzer_test.go
  note: 'Statuses are based on the repository code audit that inspected these source files directly. Later
    project reviews contain no identified contract-specific implementation change that supersedes those
    findings. A live fetch of current GitHub main was not available during this final recheck, so no newer
    code is claimed without evidence.

    '
integrations:
- id: types.contracts-v2
  status: partial
  summary: 'Sec 0.1 named-type contracts are implemented in part. Core numeric and collection-oriented
    forms exist, but several normative string contracts, full membership semantics, contract-location
    restrictions, and complete conjunction/satisfiability analysis remain incomplete.

    '
  rules:
  - rules/types/contracts.md
  implemented:
  - Named types can carry contract metadata used by semantic analysis.
  - Multiple contract forms may be attached to one named type.
  evidence:
    source:
    - internal/parser/parser.go
    - internal/sema/contracts.go
    tests:
    - internal/sema/analyzer_test.go
  remaining:
  - Contract syntax is not consistently restricted to the normative declaration locations.
  - Membership and complete contract-set consistency do not yet cover the full normative semantics.
  - regex
  - minLen
  - maxLen
  - exactLen
  identified_bugs: []
  bug_refs:
  - types.contracts-v2.bug.inline-contract-acceptance
  - types.contracts-v2.bug.membership-domain-too-narrow
  - types.contracts-v2.bug.repeated-range-overwrite
  - types.contracts-v2.bug.repeated-multipleof-overwrite
- id: types.contracts-v2.location
  status: partial
  summary: 'Contracts are normative constraints of named types; variable and field declarations must not
    create independent inline contract semantics.

    '
  rules:
  - rules/types/contracts.md
  implemented:
  - Named-type contract declarations are represented and analyzed.
  evidence:
    source:
    - internal/parser/parser.go
    - internal/sema/contracts.go
    tests: []
  remaining:
  - Parser/Sema paths historically accepted parts of variable- or field-level contract syntax that the
    v2 rulebook does not define.
  - Consistent rejection of every non-named-type inline contract form.
  identified_bugs:
  - id: types.contracts-v2.bug.inline-contract-acceptance
    severity: medium
    description: Parser/Sema paths accept parts of contract syntax on variables or fields even though
      contracts in the revision-2.0 rulebook belong to named types.
    expected: Contract syntax outside the normative named-type declaration locations must be rejected
      consistently.
    actual: Some non-named-type declaration paths accept contract syntax or preserve contract-like semantics
      instead of issuing a diagnostic.
    affected_components:
    - internal/parser/parser.go
    - internal/sema/contracts.go
    fix_guidance:
    - Centralize validation of legal contract attachment locations.
    - Reject variable-level and field-level inline contract forms during parsing or Sema.
    - Ensure no AST/Sema fallback path silently preserves such contracts.
    regression_tests:
    - Reject contract syntax on a local variable declaration.
    - Reject contract syntax on a struct field declaration.
    - Continue accepting the same contract on a named type declaration.
- id: types.contracts-v2.range
  status: implemented
  summary: 'Range contracts are parsed and represented semantically, including bounded forms used by named
    numeric types.

    '
  rules:
  - rules/types/contracts.md
  implemented:
  - Parser support for range contracts.
  - Semantic representation through RangeContract.
  - Compile-time checking of known values against range constraints.
  evidence:
    source:
    - internal/parser/parser.go
    - internal/sema/contracts.go
    tests:
    - internal/sema/analyzer_test.go
  remaining: []
  identified_bugs: []
- id: types.contracts-v2.membership
  status: partial
  summary: 'The in [...] membership contract exists, but the accepted compile-time member domain is narrower
    than the rulebook''s semantic-equality model.

    '
  rules:
  - rules/types/contracts.md
  implemented:
  - Parser support for in [...] contract syntax.
  - Semantic checking for the currently supported constant member forms.
  evidence:
    source:
    - internal/parser/parser.go
    - internal/sema/contracts.go
    tests:
    - internal/sema/analyzer_test.go
  remaining:
  - Membership values are limited to a narrower primitive/scalar/enum constant domain than required by
    the normative rule.
  - Full compile-time membership values wherever the rulebook permits semantic equality.
  identified_bugs:
  - id: types.contracts-v2.bug.membership-domain-too-narrow
    severity: medium
    description: The implemented in [...] contract accepts a narrower compile-time member domain than
      the normative semantic-equality rule permits.
    expected: Every compile-time value permitted by the rulebook and having the required semantic equality
      must be valid as a membership element.
    actual: Membership handling is restricted to a smaller primitive/scalar/enum constant subset, causing
      some normatively valid membership contracts to be rejected.
    affected_components:
    - internal/parser/parser.go
    - internal/sema/contracts.go
    fix_guidance:
    - Reuse the compiler's canonical compile-time value representation.
    - Validate membership elements through semantic equality rather than a hard-coded primitive subset.
    - Preserve exact type identity when comparing membership elements.
    regression_tests:
    - Accept all currently supported primitive membership elements.
    - Accept additional compile-time values allowed by the rulebook.
    - Reject membership elements without valid semantic equality.
