      - internal/sema/analyzer.go
      - cmd/lsp/main.go
    tests:
      - internal/sema/analyzer_test.go
      - internal/sema/analyzer_closure_test.go
      - internal/sema/allocation_test.go
      - cmd/lsp/main_test.go
    implemented:
      - parser and Sema support for spawn and await with recorded task, thread, and process execution kinds
      - immutable compiler-owned graph snapshots from each completed Sema analysis
      - deterministic callable and call-site identities within one analyzed source snapshot
      - validated synchronous direct, static-method, and foreign-direct call sites
      - exact selected-overload and resolved-method targets
      - incoming and outgoing call-site queries with source locations
      - valid module-main program-entry root discovery
      - whole-graph root reachability with literal true and false branch pruning
      - Tarjan same-stack strongly connected components and direct or mutual recursion classification
      - task-spawn and thread-start execution relations on the resolved outer spawn call
      - synchronous classification of argument calls evaluated before spawning
      - derived task-entry and thread-entry roots only for reachable spawn sites
      - exclusion of task and thread spawn edges from same-stack recursion
      - standard LSP prepare, incoming, and outgoing call hierarchy
      - preserved dispatch and execution metadata in LSP call-hierarchy items
      - LSP hover summaries for callers, callees, roots, recursion, and spawn edges
      - source-ordered direct Arena create, allocate, reset, and release event sites
      - synchronous Arena MayAllocate propagation and shortest callable cause paths
      - exclusion of spawned-body allocation from the spawner synchronous summary
      - concrete call-graph nodes for valid capturing and non-capturing lambda bodies
      - exact closed function-value and closure call sites sourced from canonical callable target sets
      - function-value calls inside lambdas are attributed to the lambda callable rather than the enclosing declaration
      - unknown function-value parameters create no unsound empty-target graph edge while open callable contracts remain unavailable
    verification:
      - command: go test ./internal/sema -run 'TestLambdaCapturePreservesCallableDependencies|TestEscapeAnalysisRecordsCaptureWithoutLambdaReturnLeakage|TestCallGraph' -count=1
        result: passed; exact indirect targets, distinct lambda callers, capture-creation ownership, and existing call-graph behavior are covered
      - command: go test ./...
        result: passed
      - command: go vet ./...
        result: passed
      - command: validate implementation-status.yaml
        result: passed
    remaining:
