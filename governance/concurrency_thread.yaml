    summary: >-
      Canonical Sec 0.1 physical thread model with exact ThreadConfig,
      ThreadSetting, ThreadStorage, priority/affinity/start semantics, exact
      thread status and terminal metadata, CamelCase Thread[T] API, selectable
      join, observer boundaries, cooperative cancellation, target-resolved
      ThreadPlatform, ownership/lifetime requirements, analysis, IR, lowering,
      tooling and governance.
