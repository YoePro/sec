- unknown storage class rejected
- direct call valid
- direct to extern rejected
- foreign call valid
- foreign to non-extern rejected
- call arity mismatch rejected
- call argument mismatch rejected
- call result mismatch rejected
- argument action count mismatch rejected
- unknown action rejected
- standard func/cf CFG accepted
- no allow-unregistered required
