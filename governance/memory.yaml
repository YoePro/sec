      - LSP completion and hover expose VolatileRead and VolatileWrite unsafe and effect identity
    remaining:
      - expose Read, Write and every canonical member consistently from one compiler-known registry
      - show unsafe requirement and caller obligations in hover and signature help
      - show known address-space, nullability, range, alignment and lifetime facts where useful
      - produce mentor diagnostics distinguishing missing unsafe from compiler-proven invalid operations
      - format canonical raw-pointer operations without inventing C-style syntax
      - add conversion formatting only after canonical conversion spelling is locked
