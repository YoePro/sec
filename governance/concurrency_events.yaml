  normative:
  - Instance event storage belongs to the declaring owner type and impl exposure cannot add instance
    storage.
  - The Sec 0.1 bodyless exposure syntax is event Name using existingStorage; event policy blocks
    are invalid.
  - Event[T] has default fixed subscription capacity four; Event[T,N] and EventStorage[T,N] require
    valid compile-time capacity.
  - Default event dispatch is synchronous, ordered by subscription, non-allocating and non-implicitly-thread-safe.
  - Publication is restricted to the declaring owner impl; ordinary external visibility grants subscription,
    not publication.
  - Subscribe returns exactly EventSubscribeResult with Subscribed(Subscription) and Full.
  - Subscription is move-only and consuming Close or deterministic destruction unregisters its one
    registration.
  - Event-bearing storage, subscription lifetime, callback captures and relocation remain subject
    to canonical ownership and borrow rules.
  - Default events are not arbitrary ISR-safe notifications, channels, completion primitives or implicit
    asynchronous dispatch.
  - A publication borrows T and handlers receive ref T, with no implicit copy, move or per-subscriber
    clone, including for move-only payloads.
  - Capturing callable environments remain externally owned and are retained by explicit ref or ref
    mut with stable storage and valid lifetimes; no hidden event allocation/capture copy.
  - Handlers must be reusable; immutable callable capability fn and exclusive mutable callable capability
    inferred by the compiler are accepted, but consuming callable capability is not.
  - The owner and retained callable storage cannot move or be destroyed while a dependent Subscription
    or callback invocation remains live.
  - Subscription pins the event owner against relocation and destruction without constituting a whole-owner
    shared borrow; owner-authorized publication and safe mutation of unrelated publisher fields remain
    legal under ordinary access and race rules.
  - Mutable callback reentrancy violating exclusivity is rejected statically when provable, otherwise
    causes panic; Publish remains void.
  - Unregistration is immediate logically, while active invocations preserve callable storage and
    physical slot occupancy through final use.
  - Each Publish fixes subscription eligibility at its start; later registrations can join only later
    or nested publications and removed registrations are skipped.
  implemented:
  - Parser recognizes Event[T] and compile-time-capacity Event[T,N] and EventStorage[T,N] type forms.
  - Parser handles short-form instance fields, bodyless impl event Name using storage and interface
    event requirements.
  - Parser rejects impl event policy bodies according to grammar.md §31.
  - Compiler-known Event, EventStorage, Subscription and EventSubscribeResult type identities exist
    in internal/sema/types.go.
  - Compiler-known EventSubscribeResult has Subscribed(Subscription) and Full union variants.
  - Frontend validates positive compile-time event capacity, event member registration and owner-backed
    event exposure on supported source paths.
  - Frontend validates owner-only Publish and the Publish payload type; the earlier by-value fn(T) void
    handler typing was replaced on 2026-11-17 by the borrowed contract (entry below).
  - Frontend recognizes consuming Subscription.Close() as a void operation.
  - Copy classification treats compiler-known Event/EventStorage as noncopyable; core-owned Subscription
    requires deterministic destruction.
  - "Integrated independent normative event corrections and registered their governance owner on 2026-11-13: all 36 chapters and 105 existing paragraph IDs preserved, 27 paragraphs added. Events §§10–11 retain their existing text pending the owner's separate MD-134 fix; full revision 2.0 remains pending. This records documentation synchronization only."
  - "Applied events correction revision 1.1 to events.md on 2026-11-17 (owner decision MD-134 of 2026-11-13). The 25 remaining replacement and added paragraphs are in place: §§ 6(4)-(8), 7(5)-(6), 10(1)-(4), 11(1)-(4), 13(5)-(6), 14(5)-(6), 20(3), 21(4), 29(3), 30(2), 31(2) and 34(2), plus the § 3(1) payload sentence. Revision 2.0 metadata is set. All 140 paragraph IDs occur once and in order, and every one of the correction's 69 normative paragraphs is present verbatim. MD-134 was removed from missing-decisions.yaml. This is rulebook synchronization only; the frontend still checks the obsolete fn(T) void handler (first remaining item)."
  - "Borrowed handler contract, frontend (2026-11-17; events.md §§ 6(4), 6(7), 10(1)-(4), 11(1)-(4)). Publish borrows its payload: an owned T or temporary is never moved, and a ref T holder is passed. The handler type is fn(ref T) void. A stateless named function or capture-free lambda is passed by value. A capturing callable must be passed as `ref handler`, or `ref mut handler` when its inferred capability mutates its environment. Inline or by-value capturing handlers, a shared ref to a mutating handler, consuming callables and by-value fn(T) handlers are rejected (internal/sema/event_handlers.go; TestEventHandlerBorrowedContract). Semantic IR has no event representation yet; its own remaining item tracks that. Live-subscription lifetime of the retained storage is tracked separately."
  - "Existing event frontend, tests and fixtures moved from the obsolete fn(T) void handler to fn(ref T) void (2026-11-17): eventHandlerType, testdata/event_valid.sec (capturing handler via ref, stateless lambda, ref T republish, borrowed local publish), testdata/event_invalid.sec and TestEventDeclarationPublishAndSubscribe."
  remaining:
  - Implement actual fixed-capacity per-instance subscriber storage without default hidden allocation
    or copying capturing closure environments.
  - Implement synchronous subscription-order publication with per-invocation eligibility, dynamic
    exclusive-handler invocation guards and panic cleanup.
  - Enforce event-owner pinning while subscriptions are live, stable external callable storage and
    active-callback retention, including after Subscription movement and destruction.
  - Model subscription event-owner non-relocation as a distinct compiler-known dependency, not a retained
    whole-owner shared borrow; preserve legal owner-authorized publication and unrelated field mutations
    without weakening ordinary borrow checks.
  - Implement handler capture lifetime/escape, resource cleanup and cross-execution transferability
    proof for event subscription.
  - Implement immediate logical unregister, skip-before-turn, nested-registration visibility and delayed
    physical slot reclamation while any callback is active.
  - Enforce complete fixed-capacity Full behavior including reserved closing/in-flight slots; no retained
    callback borrow or registration on failure.
  - Enforce default no-concurrent-access policy and coordinate permitted external synchronization
    with data-race and memory-model analysis.
  - Enforce default ISR publication rejection with appropriate interrupt-context proofs.
  - Complete event interface typed-value observation, conformance and visibility checks across source/IR/LSP.
  - Publish event semantic facts, synchronous callback effects and lifecycle transfer into canonical
    Semantic IR.
  - Implement target-valid runtime lowering, link/runtime support and deterministic event storage
    cleanup without inventing unsupported API policies.
  required_tests:
  - Short-form Event[T] and Event[T,N] default/explicit capacity valid syntax; invalid or nonconstant
    capacities rejected.
  - EventStorage[T,N] requires explicit capacity, and impl event exposure references compatible existing
    storage.
  - An impl event body/policy block is rejected as syntax in Sec 0.1.
  - Owner Publish is accepted; external Publish and interface-view Publish are rejected.
  - Subscribe returns exactly EventSubscribeResult; Full creates no Subscription.
  - Consuming Subscription.Close and deterministic destruction unregister exactly once; second Close
    or invalid copy rejected.
  - Capturing handlers are externally owned, require explicit retained ref/ref mut with stable lifetime,
    are never copied by event registration, and cannot outlive captured storage.
  - Event owners cannot relocate while subscriptions are active, even through aggregate/container
    moves; callable storage is similarly stable while retained.
  - Synchronous borrowed-payload subscription-order delivery fixes per-Publish eligibility; nested
    publication sees later registrations, removes-before-turn skip, and in-flight closure defers reclamation.
  - Statically provable overlapping mutable handler invocation is rejected; a dynamic exclusive reentrancy
    conflict panics; cleanup releases active invocation guards once.
  - Unsynchronized concurrent event access and ordinary ISR publication are rejected.
  - Interface observation does not grant publication authority or create hidden storage.
  - No silent dynamic allocation, asynchronous dispatch or invented public policy block is emitted.
  - Semantic IR retains event ownership, subscriptions and dispatch facts; unsupported target lowering
    fails closed.
  - Move-only T is published and delivered through ref T without copy/move; test temporary call-lifetime
    borrowing, rejected dangling retained callable references, and no implicit mut fn implementation
    syntax.
  - A live subscription forbids owner relocation or destruction, but permits owner-authorized Publish
    and independent unrelated-field updates when ordinary borrowing and concurrency permit them; invalid
    mutation through an ordinary ref still fails.
  - Stateless named functions and capture-free lambdas can subscribe without external capture storage;
    capturing closures require explicit retained ref/ref mut with sufficiently long storage lifetime.
  governance_reconciliation:
  - Existing governance/declarations.yaml owns general impl/interface/member coherence and should
    retain its existing integration IDs.
  - Existing governance/lifetime.yaml owns general borrow, escape and deterministic destruction proof;
    it should not lose coverage.
  - Existing governance/parser.yaml owns general grammar recovery and event-form parser fixtures.
  - Existing governance/concurrency_model.yaml owns umbrella execution/scheduling semantics, not event-specific
    implementation tracking.
  - Proposed events fragment owns implementation evidence and remaining work extracted from events.md
    revision 1 §33; do not retain that mutable inventory in the normative rulebook.
  - Event-specific public API is currently partially modeled; no event subscriber runtime or dispatch
    implementation is claimed.
