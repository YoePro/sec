        result: "Passed 2026-10-30: full parser 129.260s, Sema 17.851s, CST 0.008s, formatter 0.900s, Semantic IR 3.738s and nominal 0.132s; targeted LSP/CLI race 24.385s/13.241s; vet passed. Before the repair the enum type had generic type highlighting and the enum document-symbol range excluded all child members. frontend.enums remaining 12 to 11; observed global Remaining 2375 to 2374. String enum IR/backend/runtime is not claimed by these frontend tests."
