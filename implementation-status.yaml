    remaining:
      - add canonical semantic memory-access events carrying Place/provenance, access kind, execution context, atomicity, and source location
      - consume canonical Place/provenance rather than coarse variable identity so fields, constant indices, dynamic indices, slices, and disjoint backing ranges retain precision
      - add storage-overlap classification that distinguishes Disjoint, Overlap, and MayOverlap without treating lost alias precision as a proven race
      - add finite execution-context abstractions for threads, tasks, repeated spawn sites, foreign callbacks, ISR execution, platform execution, and unknown contexts
      - represent whether one creation-site context class may have multiple overlapping runtime instances so a task body can race with another instance of itself
      - consume canonical program-order, publication, synchronization, completion/join, atomic, platform, and foreign happens-before facts from the concurrency memory model
      - distinguish ProvenRace, scoped ProvenRaceFree, and Unknown results throughout analysis and diagnostics
      - preserve structural Unknown reasons such as alias, concurrency, synchronization, foreign, callable, atomic, platform-preemption, and precision-widening uncertainty
      - distinguish a proven race from failure to prove a positive race-freedom requirement imposed by language, runtime, target, project, or CompilationPlan policy
      - consume canonical borrow exclusivity and ownership-transfer facts as positive evidence that conflicting concurrent accesses cannot coexist
      - consume escape and publication facts so retained or published storage can become reachable from additional execution contexts without treating publication itself as permanent race protection
      - add symbolic function summaries for parameter, receiver, captured, static, thread-local, foreign, and unknown Place roots
      - preserve field, index, slice, and other Place projections in exported summaries to the precision supported by Place analysis
      - add may-read and may-write summary domains and keep them distinct from must-properties used for positive synchronization proofs
      - track definitely-held synchronization identity at each relevant access and use intersection rather than union for must-held facts across control-flow joins
      - preserve canonical lock identity and synchronization-guard/token relationships across function boundaries without inferring protection from naming conventions
      - instantiate symbolic callee memory, lock, publication, and execution summaries at caller Places using canonical provenance
      - keep ordinary synchronous calls in the caller execution context unless canonical semantics state otherwise
      - model spawn, thread, task, foreign-callback, ISR, and runtime execution effects according to their canonical semantics
      - consume canonical join/completion relationships so worker completion can establish ordering before subsequent accesses
      - support execution-context overlap intervals sufficiently to avoid treating a completed joined task as concurrent with all later continuation code
      - consume closed callable target sets from closure/callable-flow analysis and conservatively join race-relevant summaries over all possible targets
      - consume open callable memory, retention, publication, spawn, synchronization, and concurrency contracts and widen only missing dimensions
      - solve recursive and mutually recursive call-graph SCC summaries by deterministic monotone fixed point without treating ordinary recursion itself as concurrency
      - add bounded Place/index/range widening so large arrays and dynamic collections do not require one analysis node per runtime index
      - prove disjoint concurrent collection partitions and aggregate fields race-free when canonical Place/range/borrowing facts establish disjoint storage
      - avoid treating distinct union payload projections as disjoint unless canonical layout and active-variant facts justify the proof
      - integrate MMIO, volatile, and target-defined memory spaces through canonical memory-space and CompilationPlan semantics rather than ordinary race assumptions
      - consume FFI contracts for foreign reads, writes, retention, publication, callback execution context, asynchronous access, completion ordering, and synchronization without inferring behavior from names
      - integrate ISR/thread access pairing with canonical preemption, interrupt masking, priority, and nesting facts while leaving ISR-specific policy to ISR analysis
      - add bounded race candidate indexing/grouping by Place root or alias class, projection/range class, access kind, execution context, and synchronization class
      - support summary-level candidate pairing before event-level expansion so large programs do not require naive global O(n^2) access comparison
      - require a sound reachable unsafe witness before classifying a candidate as ProvenRace and preserve Unknown when only possible aliasing or concurrency is established
      - add scoped reusable RaceFreeProof facts for disjoint storage, exclusive ownership, non-overlapping execution, read-only sharing, mutual exclusion, happens-before ordering, and canonical atomic safety
      - retain deterministic representative access pairs, cause paths, overlap reasons, concurrency reasons, and missing-ordering explanations
      - group equivalent abstract race occurrences to avoid diagnostic explosion while preserving distinct Place/context root causes
      - provide LSP diagnostics with primary and related source locations so programmers can navigate between conflicting accesses
