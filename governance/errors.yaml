  - id: frontend.bodyless-try-assignment
    area: frontend-analysis
    status: partial
    integrated: "2026-08-11"
    revised: "2026-09-23"
    summary: >-
      Accepts handlerless fallible assignment as ordinary implicit Result
      failure propagation. Sema resolves the target error contract, applies
      revision-2 assignability to the enclosing Result error channel, rejects
      invalid propagation boundaries, and records compiler-owned statement
      facts for both propagation and local handlers. Semantic IR and ownership
      edge consumption remain explicit follow-up work.
    rules:
      - rules/foundations/grammar.md
      - rules/errors/errorhandling.md
      - rules/compiler/semantic_ir.md
      - rules/memory/ownership.md
    related_integrations:
      - frontend.errorhandling-v2
      - frontend.properties
    code:
      - internal/ast/ast.go
      - internal/parser/parser.go
      - internal/sema/analyzer.go
      - internal/sema/analyzer_try_assignment.go
      - internal/sema/semantic_facts.go
    tests:
      - internal/parser/parser_test.go
      - internal/sema/analyzer_try_assignment_test.go
      - internal/sema/analyzer_test.go
    implemented:
      - parser accepts try Assignment with or without an attached handler block and retains the following statement boundary
      - naked assignment requires a compiler-resolved fallible target error type
      - naked assignment propagates only from a function through an enclosing Result whose error channel accepts the target error
      - concrete marked errors may widen one-way to compiler-known error under the revision-2 compatibility rule
      - plain returns, incompatible concrete error channels, propagation outside functions, and propagation from defer are rejected with focused diagnostics
      - no Option/Result conversion is introduced by naked assignment
      - Sema publishes immutable ResolvedTryAssignment facts for propagation and local-handler plans
      - statement-specific analysis was extracted from the oversized analyzer.go into analyzer_try_assignment.go
    remaining:
      - consume ResolvedTryAssignment in Semantic IR and model the failure edge as an early Err return
      - carry cleanup and defer execution over the propagation edge
      - verify borrow-state and definite-initialization joins consume the resolved success/failure edges without reconstructing syntax
      - extend LSP hover and control-flow presentation to consume the resolved assignment fact
    verification:
      - command: go test ./internal/parser ./internal/sema -run 'TryAssignment' -count=1
        result: passed; parser, compatible propagation, concrete-to-open error widening, invalid channels, local handlers, and immutable fact queries are covered
      - command: go test ./... -count=1
        result: passed across all packages on 2026-09-24 after the register-driven pitfall suppression-test fix

