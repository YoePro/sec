fragment:
  id: cancellation-v2
  merge_target: implementation-status.yaml
  generated_for_rulebook: rules/concurrency/cancellation.md
  repository_baseline: 0f5027d
  document_revision: "2.0"
  sec_language_version: "0.1"
  generated_at: "2026-09-06"
  purpose: >
    Synchronize cooperative task/thread cancellation, Task.Current/Thread.Current
    cancellation observation, inferred cancellable-execution effects, commit
    semantics, Context/ContextSource ownership and first-wins terminal causes,
    tooling, Semantic IR, lowering and target capability.
  codex_instructions:
    - Reconcile with existing implementation-status entries; preserve stronger/newer evidence.
    - Use canonical public CamelCase CancelRequested and RequestCancel spellings.
    - Keep Task and Thread cancellation identities distinct while preserving symmetric API naming.
    - Add/complete real source-visible compiler-known TaskContext and ThreadContext cancellation extensions.
    - Implement Task.Current() -> TaskContext and Thread.Current() -> ThreadContext with their distinct semantic requirements.
    - Infer a callable effect requiring current cancellable execution from `cancel` and transitively from calls; do not require an @cancellable source annotation.
    - Preserve the inferred effect through callable/function values and indirect calls.
    - Reject calls requiring cancellable execution where no suitable Task/Thread execution context exists.
    - Keep bare cancel targeting the current logical Task when one exists, otherwise the current explicit cancellable Thread.
    - Keep cancel invalid inside defer.
    - Implement cancellation-point exactly-one commit semantics.
    - Treat current-execution cancellation as terminal control flow, not a returned generic cancellation error.
    - Keep supplied Context cancellation/deadline as operation-local ContextError, distinct from terminal execution cancellation.
    - Context and ContextSource are @noCopy.
    - Context has no Cancel(); ContextSource owns cancellation authority.
    - ContextSource.Context is ref Context and cannot be moved out.
    - Context.Error is Option[ContextError].
    - Context terminal cause is first-wins and immutable.
    - ContextSource destruction ends child lifetime/resources and is not implicit cancellation.
    - Use existing duration as the canonical relative timeout type and Instant as monotonic deadline point.
    - Do not hard-code the legacy cancellation Semantic IR opcode list into the language rulebook.
    - Keep process termination/cancellation APIs outside this task/thread cancellation rewrite.

