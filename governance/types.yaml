schema_version: 1
area: types
purpose: Type system, type contracts, units, and built-in type semantics.
integrations:
  - id: frontend.units-v2
    area: frontend-analysis-tooling-and-semantic-ir
    status: partial
    integrated: "2026-08-18"
    audited: "2026-08-27"
    revised: "2026-10-06"
    document_revision: "2.0"
    repository_baseline: "20b3606"
    replaces: rules/types/units.txt
    summary: >-
      Tracks the carrier-independent quantity model, structural unit expressions,
      category policy, Kind and transform metadata, conversion exactness, and
      compiler-owned tooling facts defined by units revision 2.0. The frontend now
      retains a structural unit AST and resolved quantity descriptor, applies Kind,
      point, logarithmic, exact fixed-conversion, currency, factor-conversion, and
      structural-result rules, proves implicit fixed conversions exact by decimal
      representation or by compiler-proven integer value ranges, records each
      conversion plan, and exposes the facts through hover and formatting;
      specialized transform conversion, binary-floating and rounding-policy
      conversion, standard-library migration, and Semantic IR propagation remain
      partial.
    rules:
      - rules/types/units.md
      - rules/foundations/grammar.md
      - rules/types/types.md
      - rules/foundations/operators.md
      - rules/compiler/semantic_ir.md
      - rules/tooling/lsp.md
      - rules/tooling/diagnostics.md
      - rules/tooling/formatter.md
    code:
      - internal/ast/ast.go
      - internal/parser/parser.go
      - internal/sema/types.go
      - internal/sema/units.go
      - internal/sema/unit_conversion_plan.go
      - internal/sema/analyzer.go
      - internal/cst/roles.go
      - internal/formatter/formatter.go
      - internal/formatter/cst_spacing.go
      - cmd/lsp/main.go
    tests:
      - internal/parser/parser_test.go
      - internal/cst/roles_test.go
      - internal/sema/analyzer_test.go
      - internal/sema/unit_conversion_plan_test.go
      - internal/formatter/formatter_test.go
      - testdata/units_valid.sec
      - testdata/units_advanced_valid.sec
      - testdata/units_invalid.sec
    implemented:
      - unit declarations support an omitted decimal default carrier or an explicit plain compiler-known numeric scalar default
      - unit identity is retained separately from the selected numeric carrier on resolved numeric types
      - named unit-only types use the declaration default carrier while compound structural unit-only types default to decimal
      - physical, currency, information, ratio, and other categories parse and resolve; omitted category defaults to other
      - ratio defaults to dimensionless, information defaults to information^1, and currency and other declarations receive identity-derived axes
      - compiler-known unit-name collisions including bit, byte, and intrinsic type constructors are rejected
      - structural unit expressions validate named factors, identity 1, multiplication, division, non-zero signed integer exponents, and grouping
      - structural dimensions normalize exponent addition, subtraction, multiplication, and cancellation without rewriting source spelling
      - type references retain a first-class unit-expression AST with exact source spelling, grouping, factor order, and explicit named-versus-structural identity
      - resolved Type quantity facts retain source factors, normalized factors, category provenance, Kind, exact scale and offset, transform, origin, point role, and conversion exactness
      - Dimension metadata validates canonical ^ exponents, duplicate axes, zero exponents, and order-independent normalized dimensions
      - LongName, Symbol, BaseUnit, Status, Dimension, Kind, Scale, System, Transform, Offset, Origin, LogBase, LogFactor, and Reference metadata parse and are stored
      - Scale, Offset, LogBase, and LogFactor use exact rational constant evaluation; Scale must be positive and non-zero and logarithmic base/factor constraints are checked
      - Transform defaults to linear; affine and logarithmic declarations validate their required metadata sets and logarithmic values cannot fall through to ordinary arithmetic
      - addition, subtraction, remainder, comparison, multiplication, and division validate normalized dimension, known or unknown Kind policy, transform, origin, point/difference role, and carrier compatibility
      - point algebra implements P-P to anonymous linear difference, P+D and P-D to P, difference arithmetic, and rejects P+P and point multiplication or division
      - multiplication and division retain anonymous structural identity, source factor order, category provenance, and compatible ratio Kind instead of selecting a named type by dimension
      - valid anonymous derived currency expressions produce warning-class diagnostics instead of being rejected
      - two-argument TargetUnit(source, factor) conversions validate the normalized linear factor dimension without inventing the runtime factor value
      - implicit fixed conversion requires compatible Kind, role, origin, transform, and exact carrier representation; numeric carrier casts preserve the unit descriptor
      - direct named use of deprecated and obsolete units produces compiler-owned warnings
      - explicit conversion functions validate normalized dimensions and act as explicit linear cross-identity or cross-Kind boundaries
      - LSP hover presents compiler-owned identity, source expression, Kind, categories, transform, point role, origin, and exact scale facts
      - "LSP derivation view (2026-10-03): Analyzer.UnitDerivationOf exposes each normalized unit factor with its declared dimension and scale, the canonical resulting dimension, and the exact combined scale from Sema's unit definitions, and binding/type hover presents it as a dimension derivation (TestHoverShowsUnitDimensionDerivation)"
      - "safe unit-conversion code action (2026-10-03): when a value of another named unit of the same quantity is rejected, Sema proves the explicit conversion Target(value) (equal dimension, role, origin, non-logarithmic across identities, no currency, unchanged carrier, binding or field-chain value), adds help naming it, and records a UnitConversionSuggestion; the LSP quick fix applies exactly that replacement and never invents a factor, exchange rate, or rounding policy (TestUnitConversionCodeActionAppliesProvenConversion)"
      - "value-aware fixed conversion planning (2026-10-06): Sema records a UnitConversionPlan (source and target semantics, unchanged carrier, exact factor and offset, proof) for every implicit fixed conversion between unit coordinates at storage, assignment, return, field, element, call-argument (after overload selection), arithmetic, and comparison boundaries, exposed by Analyzer.UnitConversionPlanOf; decimal carriers are proven by finite-decimal factor and offset, and bounded integer carriers by the operand's compiler-proven value interval (constants, type ranges narrowed by range contracts and dominating comparisons) scaled into the carrier's admitted range, with a non-integral factor proven only for a single known value it divides (TestUnitConversionPlanProvesIntegerValueRanges)"
      - "overflow and truncation are never hidden: unproven integer conversions are rejected and the explicit-conversion help names the failing value range, the single known value, or the non-dividing factor (TestUnitConversionPlanRejectsUnprovenIntegerConversions)"
      - "a comparison takes the exact conversion path in either direction because it has no result unit; arithmetic converts the right operand into the left operand's unit"
      - "a unit annotation no longer makes a carrier change valid (2026-10-06): initialization and unit arithmetic/comparison require the same compiler-known numeric carrier (int64<m> to int8<m>, int8<m> to int32<m>, int64<m> to int<m>, float32<m> to float64<m>, and mixed-width operands were previously accepted although the plain carriers reject them); unit arithmetic results keep their carrier name instead of the bare Kind (TestUnitQuantitiesKeepPlainCarrierRules)"
      - formatter compacts structural unit operators while preserving named factors, grouping, and source factor order
      - formatter canonicalizes accepted legacy case and underscore variants of unit metadata names to PascalCase from parser-scoped CST roles and exact byte spans only inside parsed unit impl blocks, leaves ordinary impl members untouched, and is idempotent
      - revision-2 corrections were consumed into grammar, types, operators, Semantic IR, LSP, diagnostics, and formatter rulebooks
    remaining:
      - migrate safety-relevant standard-library Kind metadata, especially frequency versus rotational frequency and energy versus torque
      - validate affine and logarithmic Reference compatibility and implement their specialized explicit conversion plans
      - value-aware fixed conversion planning for binary-floating carriers (requires floating value-range facts; floating carriers keep the identity-coordinate policy)
      - explicit rounding policy integration for inexact unit conversions; the rounding modes, source spelling, and checked-policy error type are undecided (MD-047)
      - observed value type and write representability of `bit[N]<unit>` register fields; writes of unbounded unit values are still accepted pending MD-046
      - preserve carrier, identity, factors, category provenance, Kind, transform, point role, and conversion plan in Semantic IR
      - extend unit code actions to declared conversion functions, in-scope factor-provided conversions, exact carrier changes, and the import action for units not yet imported
      - complete Semantic IR, MLIR, runtime, standard-library, and end-to-end unit coverage
      - keep unit-polymorphic generic parameters reserved for a future language revision
    required_tests:
      - one named unit works with decimal, float, signed integer, and unsigned integer carriers where numeric rules permit
      - compound unit-only expressions default to decimal and explicit carriers remain explicit
      - ratio, information, currency, and other omitted Dimension defaults resolve correctly; physical synthesizes no Dimension
      - bit, byte, and other compiler-known unit declaration names are rejected
      - structural multiplication, division, signed exponents, grouping, and identity normalize correctly
      - named dimensionless ratios retain nominal identity
      - named and structural compatible units remain distinct and ambiguous named results are not invented
      - equal known Kind permits and differing known Kind blocks implicit compatibility
      - invalid and incomplete linear, affine, and logarithmic metadata is rejected
      - point and difference arithmetic follows the complete affine-space matrix
      - logarithmic values reject ordinary linear arithmetic
      - currency-derived structural expressions remain valid and produce warnings
      - factor-provided conversions validate target/source factor algebra
      - implicit fixed conversion never hides precision loss
      - Semantic IR and LSP retain the complete compiler-resolved unit facts
      - formatter preserves named identity, structural identity, grouping, and source factor order
    verification:
      - command: go test ./internal/parser -run Unit -count=1
        result: passed
      - command: go test ./internal/sema -run 'Test.*Unit|TestUnitsV2|TestStructuralUnit|FunctionOverloadsIncludeNumericKindAndUnits' -count=1
        result: passed
      - command: go test ./internal/sema -run 'UnitConversionPlan|UnitQuantitiesKeepPlainCarrierRules' -count=1
        result: passed on 2026-10-06 with integer value-range, constant, division, operand, argument, and comparison plans, rejected unproven conversions with explaining help, and plain carrier rules for unit quantities
      - command: go test ./internal/formatter -run UnitExpression -count=1
        result: passed
      - command: go test ./cmd/lsp -run UnitQuantityFacts -count=1
        result: passed
      - command: go test ./internal/formatter -run FormatCanonicalizesUnitMetadataNames -count=1
        result: passed on 2026-09-21 with parsed unit-impl scoping, complete metadata-name canonicalization, ordinary-impl preservation, and idempotence
      - command: go test ./internal/cst ./internal/formatter -run 'ApplyProgramRolesScopesUnitMetadataNames|FormatCanonicalizesUnitMetadataNames' -count=1
        result: passed on 2026-09-25 with parser-owned CST role scoping, exact-span canonicalization, ordinary-impl preservation, and idempotence
  - id: frontend.default-values
    area: frontend-and-lowering
    status: partial
    integrated: "2026-08-11"
    audited: "2026-08-18"
    revised: "2026-10-02"
    summary: >-
      Tracks the compiler-owned, allocation-free default resolver required by
      default_values.md and its synchronized type, contract, aggregate, and
      collection rules. Parser and Sema materialize primitive, constrained,
      struct, fixed-array, and empty owning dynamic-array defaults without a
      runtime; list defaults, Semantic IR, cleanup, and end-to-end verifier
      coverage remain incomplete.
    rules:
      - rules/types/default_values.md
      - rules/types/types.md
      - rules/types/contracts.md
      - rules/declarations/struct.md
      - rules/collections/collections.md
      - rules/collections/shaped-types.md
      - rules/foundations/grammar.md
      - rules/tooling/diagnostics.md
      - rules/tooling/lsp.md
      - rules/tooling/formatter.md
      - rules/corrections/applied/temporal-now-correction-20260928.md
    code:
      - internal/ast/ast.go
      - internal/parser/parser.go
      - internal/sema/contracts.go
      - internal/sema/defaults.go
      - internal/sema/default_diagnostics.go
      - internal/sema/collection_literals.go
      - internal/sema/float_defaults.go
      - internal/parser/expression.go
      - internal/sema/analyzer.go
      - internal/diagnostics/diagnostics.go
      - internal/codegen/mlir/generator.go
      - cmd/lsp/main.go
    tests:
      - internal/parser/parser_test.go
      - internal/sema/defaults_test.go
      - internal/sema/default_diagnostics_test.go
      - internal/sema/collection_literal_test.go
      - internal/sema/default_fixtures_test.go
      - testdata/defaults/
      - internal/parser/collection_literal_test.go
      - internal/diagnostics/diagnostics_test.go
      - testdata/sema/default_diagnostics_invalid.sec
      - internal/codegen/mlir/generator_test.go
      - cmd/lsp/main_test.go
      - cmd/lsp/contract_diagnostic_test.go
    implemented:
      - one compiler-owned DefaultValueOf and IsDefaultable resolver shared by Sema, mutable declarations, omitted struct fields, fixed arrays, and LSP default display
      - allocation-free primitive defaults for bool, string, char, rune, integer, unsigned, binary-float, and exact-decimal families
      - inherited named-type defaults validated against every represented contract
      - exact integer nearest-to-zero range defaults with inclusive and exclusive bounds, multipleOf, even, odd, and ambiguous-tie handling
      - exact inclusive-decimal nearest-to-zero range defaults without binary-float conversion
      - source-ordered in-list defaults with duplicate detection, base-type compatibility, and S1011 cross-contract validation
      - duplicate in-contract values use mandatory S1053 types.duplicate-in-contract-value with a focused range, the first occurrence as a related location, actionable help, and unchanged identity through LSP
      - empty in-contract lists are retained by parser recovery and rejected by Sema with mandatory S1054 types.empty-in-contract, a focused range, actionable help, and unchanged identity through LSP
      - explicit type-default parsing and AST retention of the default token, expression, and source range
      - constant folding for the supported primitive expression subset and S1008 invalid-explicit-default validation
      - recursive struct defaultability and complete synthesis of omitted defaultable stored fields
      - fixed-array defaultability including zero-length arrays and recursive element construction
      - mutable T[] declarations may omit their initializer and synthesize an allocation-free empty owning array independently of element defaultability
      - mutable typed declaration synthesis marked by AST SynthesizedDefault and S1009 rejection for non-defaultable types
      - immutable declarations without initializers are rejected consistently by parser and Sema with mandatory S1047 variables.immutable-requires-initializer, and LSP preserves its identity, severity, focused name range, and help text
      - S1010 rejection of omitted non-defaultable struct fields
      - safe references and slices remain non-defaultable and no origin-free safe slice is synthesized
      - unions, Result, Option, functions, interfaces, and intrinsic resource types remain non-defaultable unless an owning rule defines a semantic default
      - date, time, datetime, and duration are explicitly non-defaultable; default initialization never performs a wall-clock read
      - LSP hover and completion display resolved default value and source from the Sema-owned resolver
      - LSP hover abbreviates large fixed-array defaults as a bounded preview such as [0, ...] without materializing or rendering every element
      - legacy MLIR materialization of complete struct and constrained scalar defaults without runtime calls or undefined fields
      - explicit type defaults are classified in rulebook order: a non-constant default keeps S1008 types.invalid-explicit-default, a default outside the base type keeps mandatory S1060 types.default-not-representable, and a representable default failing a contract keeps mandatory S1059 types.default-violates-contract whose help names the first violated contract in source order
      - storage sites needing an implicit default distinguish an ambiguous nearest-to-zero tie with mandatory S1061 types.ambiguous-implicit-default naming both equally near values and requesting an explicit default; the type itself stays legal
      - omitted struct fields whose type has an invalid explicit default report mandatory S1063 struct.invalid-defaulted-field instead of the generic S1010
      - omitted union payload fields without a default report mandatory S1062 types.no-default-value, or S1061 when the cause is an ambiguous tie
      - list[T] {} and list[T, Capacity] {} parse as a dedicated ast.CollectionLiteral (not a struct literal), including the capacity constant in expression position; elements inside the braces get one focused parser diagnostic and an invalid retained literal
      - Sema types empty list literals as their list type, rejects zero capacity and capacity mismatches, and resolves list[T] and list[T, Capacity] as defaultable (CollectionDefault) independently of element defaultability, for mutable declarations, omitted struct fields, and nested aggregates; the default displays as `list[T] {}`
      - module-local element types inside collection literals are qualified for multi-module analysis in the CLI and LSP; the formatter writes the canonical `list[T] {}` spacing; Semantic IR and the legacy backends reject list values explicitly
      - the rulebook fixture suite testdata/defaults/default_{values,ranges,in_contract,structs,lists,arrays}_{valid,invalid}.sec covers primitive, range, in-list, struct, list, and array defaults and their failure diagnostics, and pins the resolved default values
      - float32 and float64 range-derived defaults select the exact nearest representable valid value: the smallest binary value at or above a positive lower bound, or the largest at or below (strictly below when exclusive) a negative upper bound; ties have no implicit default, and named types inherit the width
      - named array and slice types are presented by their nominal name in diagnostics instead of their structural shape
      - inherited membership values are revalidated against every newly added derived contract and reported with S1011 instead of being filtered (TestInheritedMembershipRevalidatedAgainstDerivedContracts)
      - 'omitted owning dynamic-array fields, including inside omitted nested struct fields, receive typed empty defaults: materialized default expressions record their canonical DefaultValueOf types, and contextually typed array literals (including explicit `[]` field values) record their type, so provenance analysis no longer re-infers a context-free empty literal (previously failed with "cannot infer element type of empty array literal")'
      - "MD-011 (rules/corrections/applied/missing-decisions-md010-md014-correction-20261003.md § 3, 2026-10-03): the explicit default is an ordinary Expression evaluated in a SemanticCompileTimeRequiredContext through Analyzer.semanticCompileTimeConstant, which reads literals and operators, immutable module bindings through the shared compile-time integer evaluator, and immutable bindings of other primitive constants; a compile-time-established default is validated against representability and every contract, including argumentless contracts"
      - "MD-014 (rules/corrections/applied/missing-decisions-md010-md014-correction-20261003.md § 6, 2026-10-03): plain float carries the platform width (FloatBits from ResolvedScalarPlan.PointerWidthBits, 64 by default), so range-constrained plain float derives its nearest-valid default like float32/float64 and the former no-default fallback is removed (testdata/defaults fixtures moved accordingly)"
    remaining:
      - represent explicit, mutable, omitted-field, aggregate, array-element, range-derived, membership-derived, and empty-collection initialization origins in Semantic IR
      - lower synthesized mutable, struct, fixed-array, owning dynamic-array, and list defaults through the maintained Semantic IR and Sec MLIR pipelines
      - track partial aggregate, array, and collection construction cleanup for nontrivial elements and failure paths
      - add a verifier proving all readable struct fields and fixed-array elements are initialized, constrained defaults are valid, empty owning descriptors are complete, and no safe slice is fabricated without provenance
      - implement exact successors for exclusive decimal upper bounds
      - execute calls and property getters in explicit defaults once the canonical semantic CTE executor exists (currently S1101 compile-time.execution-unavailable), while rejecting I/O, volatile, FFI, and fallible runtime operations and keeping static materializability separate from transient evaluator allocation
      - add stable diagnostic IDs for types.default-cycle (no default cycle can currently form because S1055 rejects by-value recursive layouts) and backend.default-left-undefined (lowering)
      - add related-location metadata for membership failures, range ambiguity and representability failures, explicit defaults, omitted fields, and missing initializers
      - verify formatter preservation and LSP presentation for every explicit and derived default form
      - add LSP code actions that explicitly expand omitted defaults or declare an explicit type default without changing ordinary formatting
      - verify maintained LLVM and Sec MLIR backends in addition to the legacy MLIR generator
    verification:
      - command: go test ./internal/sema -run 'TestDefaultValueFixtureSuite' -count=1
        result: passed on 2026-10-02 for 12 fixtures
      - command: go test ./internal/parser ./internal/sema ./internal/formatter -run 'Test(ParseEmptyListCollectionLiterals|ParseNonEmptyListLiteralRecovers|EmptyListLiteralsAndListDefaults|EmptyListLiteralCapacityChecks|FormatEmptyListLiterals)' -count=1
        result: passed on 2026-10-02
      - command: go test ./internal/sema ./internal/diagnostics -run 'Test(DefaultDiagnosticsUseStableIdentities|UnionPayloadWithoutDefaultUsesNoDefaultValue|ExplicitDefaultNamesFirstViolatedContract|InvalidExplicit|ExplicitDefaultMustBelongToMembership|DefaultAndContractDiagnosticsAreRegistered)' -count=1
        result: passed on 2026-10-02 with S1059-S1063 identities, ordered explicit-default classification, ambiguous-tie explanations, and registry entries
      - command: go test ./internal/diagnostics ./internal/sema ./cmd/lsp -run 'Test(RegistryIsValid|KnownDiagnosticSeverities|DuplicateContractMembershipValue)' -count=1
        result: passed on 2026-09-30 with S1053 registry identity, Sema help and related-location metadata, and LSP transport
      - command: go test ./internal/parser ./internal/diagnostics ./internal/sema ./cmd/lsp -run 'Test(RegistryIsValid|KnownDiagnosticSeverities|ParseRetainsEmptyMembershipContract|EmptyContractMembership)' -count=1
        result: passed on 2026-09-30 with empty-list AST retention plus S1054 Sema and LSP identity
      - command: "go test ./internal/sema -run 'TestOmittedDynamicArrayFieldsUseTypedEmptyDefaults' -count=1"
        result: passed on 2026-10-02 with omitted, explicit-empty, nested-omitted, nested-explicit, and reassigned struct literals carrying int[] and list[string] fields
  - id: frontend.types-core
    area: frontend-and-lowering
    status: partial
    integrated: "2026-08-09"
    audited: "2026-08-12"
    revised: "2026-10-02"
    summary: >-
