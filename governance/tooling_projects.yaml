  - id: tooling.project-version-model
    area: tooling-projects
    status: partial
    integrated: "2026-10-04"
    revised: "2026-10-13"
    summary: >-
      Revision 2.0 structured project version: `[version]` with major, minor,
      revision, build, optional userdefined, and format; rendering through the
      five recognized placeholders; and per-Target version overrides (§ 8–§ 12,
      § 31).
    rules:
      - rules/projects/projects.md
    code:
      - internal/project/version.go
      - internal/project/version_forms.go
      - cmd/compiler/init.go
      - internal/project/manifest.go
      - cmd/compiler/init_manifest.go
      - cmd/compiler/build_entry.go
      - internal/project/manifest_edit.go
      - internal/project/version_diagnostics.go
      - internal/sema/project_version_diagnostics.go
      - internal/diagnostics/diagnostics.go
      - cmd/compiler/project_version_diagnostics.go
      - cmd/compiler/analysis_pipeline.go
      - cmd/compiler/test_command.go
      - cmd/lsp/project_version_diagnostics.go
      - cmd/lsp/diagnostics_batch.go
      - cmd/lsp/analysis_dependencies.go
    tests:
      - internal/project/version_test.go
      - internal/project/version_forms_test.go
      - internal/project/manifest_test.go
      - testdata/projects/model/sec.toml
      - internal/project/manifest_edit_test.go
      - internal/project/version_diagnostics_test.go
      - cmd/compiler/project_version_diagnostics_test.go
      - cmd/lsp/project_version_diagnostics_test.go
      - cmd/lsp/allocation_parity_test.go
    implemented:
      - internal/project ParseManifestVersions reads exactly one `[version]` table and every `[target.<name>.version]` table into structured fields, requiring major, minor, revision, build, and format and rejecting duplicates, unknown fields, and non-decimal, negative, leading-zero, or out-of-range VersionNumbers outside 0..9223372036854775807 (§ 8(1)–(3))
      - optional userdefined must match `[A-Za-z0-9][A-Za-z0-9._-]*`; an empty Project value is rejected, and an empty Target value clears the inherited component (§ 9(3), § 11(7)–(8))
      - Version.Render replaces exactly `[major]`, `[minor]`, `[revision]`, `[build]`, and `[userdefined]` from the parsed fields with unpadded base-10 numbers and verbatim userdefined, keeps every other character literal, and rejects unknown bracketed identifiers, a format that references a missing userdefined component, and an empty result (§ 10, § 49(3))
      - Version.Resolve applies a Target override field by field, and validation reports a Target whose cleared userdefined leaves an inherited format referencing `[userdefined]` (§ 11(4)–(9)); the § 8(10)–(11) and § 11(10)–(11) examples render as specified
      - "`sec init` validates the version model of the manifest it generates before writing it (§ 37(1))"
      - The version manifest reader explicitly rejects unsupported hexadecimal, octal and binary TOML integers with their form named and a decimal VersionNumber alternative. Multiline basic/literal strings are rejected with a single-line alternative and source line; recovery skips their contents, including escaped delimiters, so string text cannot become phantom version fields or Target tables. This is a reader capability restriction, not a language prohibition.
      - make the resolved ProjectVersion available as a Project fact to builds and tooling (§ 49(1)–(2))
      - ProjectVersion is available as a structured value in Manifest.Facts; declared Target versions are resolved once through existing inheritance/override rules and returned as value copies by TargetVersion. Unknown Target names have no version. Invalid identity/version input publishes no resolved project, located failures are retained with deterministic ordering, and explicit reload refreshes facts without mutating prior snapshots (§§8,11,49). Build-time version display is supplied by tooling.project-build-numbering; source-level build metadata remains unimplemented.
      - Version reading now skips multiline values in unowned sections as well, so permitted parameter text containing apparent version or Target-version headers cannot forge resolved version facts; complete TOML syntax parsing likewise separates real Target declarations from string contents.
      - Build-time rendered versions now come from the final automatic or explicit component in tooling.project-build-numbering. CLI success output follows commit, and retained LLVM artifacts include the same rendered value. The combined remaining item stays open for the separately owned source-level build-metadata API of §32.
      - validate `[version]` of discovered manifests in the compiler and the LSP, with registered diagnostics and source ranges in sec.toml (§ 48)
      - Shared version-snapshot validation emits registered mandatory S1150 (projects.invalid-version) with deterministic ordering and Unicode-scalar source spans in sec.toml. Required fields, duplicate/malformed TOML, numeric bounds, placeholder errors and Target inheritance are diagnosed independently of unrelated identity errors; reader-capability errors remain explicit. CLI sema/analyse/emission/build, named builds, init and test validate governing manifests before semantic compilation or writes, deduplicating manifests across sources. The analysis pipeline was extracted from main.go into a cohesive sibling file.
      - LSP distinguishes manifest TOML from Sec source, diagnoses open or discovered ancestor manifests on their own URI and consumes unsaved overlays. Manifest dependencies invalidate source batches on document/configuration changes, obsolete jobs are discarded and stale errors clear on correction, overlay close or deletion. Protocol spans use the same shared compiler renderer; cross-target Sec parsing is skipped for manifest documents. Allocation consumer-parity fixtures now declare the required version table so they retain their intended analysis coverage.
    remaining:
      - rendered version during a build (§ 31) and build metadata (§ 32)
