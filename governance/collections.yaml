schema_version: 1
area: collections
purpose: Collection APIs, shaped values, and iteration semantics.
integrations:
  - id: frontend.dynamic-array-semantic-identity
    area: frontend-collections-and-ownership
    status: implemented
    audited: "2026-08-20"
    repository_baseline: c515862
    document_revision: "1"
    document_created: "2026-08-11"
    document_last_updated: "2026-08-11"
    summary: >-
      Owning T[] and fixed T[N] share the Sema ArrayType representation, with
      ArrayLength=-1 as a robust dynamic-owner category. Core frontend traits
      preserve that distinction: T[] is always MoveOnly and non-trivially
      destructible, is excluded from ordinary fixed-array equality, and is not
      implicitly initialization-compatible with T[N].
    rules:
      - rules/collections/collections.md
      - rules/memory/copy_move.md
      - rules/memory/ownership.md
      - rules/memory/destruction.md
      - rules/compiler/semantic_ir.md
    code:
      - internal/sema/types.go
      - internal/sema/analyzer.go
    implemented:
      - canonical parser syntax for fixed T[N] and owning T[]
      - type resolver retains fixed array length N
      - type resolver uses a dedicated dynamic-array length sentinel for T[]
      - omitted mutable T[] initialization has the canonical empty-owner path
      - fixed-array copy classification derives from element classification
      - fixed-array elementwise equality infrastructure exists
      - dynamic-array compiler-known public member signatures are independently registered
      - every owning T[] is MoveOnly independently of element type
      - every owning T[] is non-trivially destructible independently of element type
      - ordinary fixed-array equality excludes owning T[]
      - implicit initialization preserves fixed-array versus dynamic-owner identity
      - explicit owner-to-slice borrowing remains separate from owner conversion
    remaining:
      - audit every ArrayType consumer across Sema, Semantic IR, formatter, LSP, lowering, ABI, FFI, layout, ownership, equality, and destruction
    bug_reference:
      - correction26.md
    governance_reconciliation:
      - Keep frontend.collections partial, but add an explicit dynamic-array semantic-identity gap. Parser/type spelling recognition exists; core semantic traits do not yet preserve fixed-array versus owning T[] identity reliably.
      - Narrow frontend.copy-move implemented wording for recursive "array" classification. Fixed-array classification is implemented, while owning T[] classification is incorrect until it is unconditionally MoveOnly.
      - Keep frontend.dynamic-array-public-api member availability/signatures as implemented within its current scope; this correction concerns owner value semantics.
      - Keep the allocation-free empty mutable T[] default as implemented; the resulting owner's copy/destruction/equality traits are the defect.
    traceability:
      policy_source: correction25.md
      touched_functions_should_reference:
        - rules/collections/collections.md §5 fixed arrays
        - rules/collections/collections.md §6 owning dynamic arrays
        - rules/collections/collections.md §10 equality
        - rules/collections/collections.md §11 parameters and return values
        - rules/collections/collections.md §12 destruction
        - relevant copy_move, ownership, and destruction rules
      functions:
        - collection type resolution for T[N] and T[]
        - copyClassificationOf
        - triviallyDestructible
        - equalityComparable
        - canCompareEquality
        - sameComparableArrayType
        - canInitialize
    required_tests:
      - int[] copy classification is MoveOnly
      - copyable-struct[] copy classification is MoveOnly
      - fixed copyable array retains element-derived copyability
      - int[] is non-trivially destructible
      - fixed trivial int[N] remains trivially destructible
      - int[] ordinary equality is rejected
      - fixed int[N] equality remains valid
      - T[N] cannot implicitly initialize T[]
      - T[] cannot implicitly initialize T[N]
      - by-value T[] transfer consumes the owner
      - explicit slices remain borrowed and distinct
      - Semantic IR preserves fixed versus dynamic owner identity

  - id: frontend.shaped-static-extent-product
    area: frontend-shaped-types
    status: partial
    audited: "2026-08-20"
    repository_baseline: c515862
    rulebook_generation: v2
    document_revision: "2.0"
    document_created: "2026-08-13"
    document_last_updated: "2026-08-13"
    summary: Sema validates static vector/matrix/tensor dimensions and computes their canonical element-count product with arbitrary-precision arithmetic. Zero extents short-circuit the product, and the retained count must fit the selected target uint representation. Downstream consumers do not yet all reuse this canonical fact.
    rules:
      - rules/collections/shaped-types.md
      - rules/types/types.md
      - rules/memory/layout.md
      - rules/compiler/semantic_ir.md
    code:
      - internal/sema/analyzer.go
      - internal/sema/types.go
      - internal/sema/shaped_algebra.go
    tests:
      - internal/sema/analyzer_test.go
    implemented:
      - vector static arity validation
      - matrix static arity validation
      - variadic static tensor dimension arity validation
      - individual shaped const arguments must be compile-time integers
      - individual shaped const arguments must fit int64
      - individual shaped dimensions must be non-negative
      - zero dimensions are currently accepted syntactically and semantically
      - static extent products use arbitrary-precision arithmetic
      - zero extents produce a canonical zero element count without intermediate overflow
      - static element count is checked against the selected target uint representation
      - the canonical static element count is retained on the resolved Sema type
    partial:
      - layout, Semantic IR, and lowering do not yet uniformly consume the retained static element-count fact
    remaining:
      - reuse that fact for Len, SizeOf, dense strides, storage eligibility, Semantic IR, and lowering
    bug_reference:
      - correction27.md
    verification:
      - command: go test ./internal/sema -run 'TestShapedMultiply|TestStaticShapedExtent' -count=1
        result: Passed on 2026-10-16 after extracting canonical static extent validation into shaped_algebra.go and using it for derived x result shapes; broader Len/SizeOf/stride/layout/lowering reuse remains open.

  - id: frontend.shaped-contextual-x
    area: frontend-shaped-algebra
    status: partial
    audited: "2026-08-20"
    repository_baseline: c515862
    rulebook_generation: v2
    document_revision: "2.0"
    summary: Parser and Sema implement static contextual matrix x algebra and publish detached canonical operator facts for Semantic IR/lowering consumers. Scalar product and compatible accumulation determine the result element; derived shape counts are checked against target uint. Runtime-shaped x with ShapeError and executable shaped IR/lowering remain separate work.
    rules:
      - rules/collections/shaped-types.md
      - rules/foundations/operators.md
      - rules/types/units.md
    code:
      - internal/parser/expression.go
      - internal/sema/analyzer.go
      - internal/sema/analyzer_inference.go
      - internal/sema/shaped_algebra.go
      - internal/sema/shaped_algebra_facts.go
    tests:
      - internal/sema/analyzer_test.go
      - internal/sema/shaped_algebra_facts_test.go
      - internal/ir/semantic/shaped_algebra_facts_test.go
      - cmd/compiler/shaped_algebra_test.go
      - cmd/lsp/shaped_algebra_test.go
      - testdata/sema/shaped_multiply_facts_valid.sec
      - testdata/sema/shaped_multiply_facts_invalid.sec
      - testdata/sema/shaped_multiply_target_extent.sec
    implemented:
      - contextual identifier x recognized as infix operator only when followed by an expression
      - x uses PRODUCT precedence
      - x is left-associative through Pratt parser behavior
      - Sema dispatches x to shaped matrix multiplication analysis
      - static matrix by matrix inner-dimension validation
      - static matrix by vector length validation
      - static matrix by matrix result shape
      - static matrix by vector result shape
      - result element type derived from ordinary scalar multiplication
      - product-term accumulation validated through ordinary scalar addition semantics
      - focused Sema tests exercise the active subset
      - "Canonical static x plans (2026-10-16): ResolvedShapedMultiplyOf publishes the matrix/matrix or matrix/vector kind, operand/result shape and exact retained counts, scalar product/accumulator type surfaces, contraction extents, proven shape check and source location. Queries return detached numeric/unit/shape facts without inference, diagnostics or identity allocation; invalid algebra and overflowing derived result shapes publish no plan. Result counts are recomputed through the canonical target-uint validator instead of inheriting an operand count. Main inference and static extent validation are extracted from the oversized analyzer files. Sema all-depth/reanalysis and 32/64 checks, external Semantic IR query consumption, CLI and unsaved LSP diagnostics are verified; runtime-shaped x and executable shaped IR/lowering are not implemented by these facts."
    partial:
      - runtime shaped x and ShapeError behavior remain absent
    remaining:
      - implement runtime-shaped x with ShapeError and try where required
    bug_reference:
      - correction27.md
    governance_reconciliation:
      - "Move contextual x from a wholly-remaining description to an explicit partial implementation: parser, precedence, static matrix/matrix and matrix/vector Sema, shape checks, and tests already exist."
      - Record the active same-element restriction/result-type shortcut as incorrect relative to shaped-types v2.
      - Keep runtime ShapeError, complete scalar algebra, Semantic IR, and lowering work as remaining.
    revised: "2026-10-16"
    verification:
      - command: go test ./internal/sema ./internal/ir/... ./cmd/compiler -count=1
        result: "Passed on 2026-10-16: full main Sema, Semantic IR and compiler suites after static shaped multiplication facts and canonical derived-result validation."
      - command: go vet ./internal/sema ./internal/ir/... ./cmd/compiler ./cmd/lsp
        result: Passed on 2026-10-16.
      - command: go test ./internal/sema ./internal/ir/semantic ./cmd/compiler ./cmd/lsp -race -run 'TestShapedMultiply|TestContextualMatrixMultiply|TestStaticShapedExtent' -count=1
        result: "Passed on 2026-10-16: static matrix/matrix and matrix/vector plans, exact result counts, zero extents, 32/64 derived-result overflow, detached read-only queries, all depths, analyzer reuse, external Semantic IR consumption and actual CLI/unsaved LSP diagnostics."

  - id: frontend.shaped-types
    area: frontend-and-lowering
    status: partial
    integrated: "2026-08-11"
    revised: "2026-10-05"
    summary: >-
      Tracks vector, matrix, tensor, tensor_view, Shape, Strides, TensorLayout,
      and MemorySpace independently from ordinary collections. The canonical
      shaped rulebook now also specifies runtime-shaped owning tensors,
      compiler-known shaped properties, affine view slicing and step semantics,
      explicit broadcasting, ownership-preserving reshape operations, structured
      storage requests and transfers, vector algebra, matrix multiplication, and
      general tensor contraction.
    rules:
      - rules/collections/shaped-types.md
    code:
      - internal/parser/parser.go
      - internal/sema/analyzer.go
      - internal/sema/shaped_runtime.go
      - internal/sema/compiler_known_members.go
    tests:
      - internal/parser/runtime_shaped_tensor_test.go
      - internal/sema/runtime_shaped_tensor_test.go
      - internal/sema/compiler_known_members_test.go
    implemented:
      - parser and AST accept mixed type/value generic arguments used by shaped types
      - Sema recognizes vector, matrix, tensor, and tensor_view identities and validates basic arity and dimensions
      - loader-proven core sources may attach additive impl helpers to all shaped families and their Shape, Strides, TensorLayout, and MemorySpace support identities without redefining compiler-owned intrinsic semantics
      - rank-one vector values participate in iterable type inference
      - contextual x parsing, multiplicative precedence, and static matrix/matrix and matrix/vector Sema with inner-dimension checks; scalar result algebra is partial
      - the shared compiler-known member registry exposes read-only Rank, Shape, and Len properties for statically shaped vector, matrix, and tensor values and their type-level inventory; Shape has the exact Shape[Rank] result and retains ordered static extents for tooling; tensor_view exposes only its type-known Rank
      - Sema, LSP completion, and hover consume those same shaped Rank/Shape/Len entries, including useful compile-time rank, ordered-extents, and total-element-count facts
      - statically shaped vector, matrix, and tensor values expose instance Strides with the exact Strides[Rank] result and arbitrary-precision canonical dense row-major element-stride facts shared by Sema and LSP
      - canonical dense owning vector, matrix, and tensor values expose instance IsContiguous as a compiler-known bool fact fixed to true; Sema and LSP consume the shared registry entry and no type-level property is invented
      - parser and Sema recognize owning runtime-shaped tensor[T, Shape[Rank]] as a distinct tensor identity, retain its compile-time rank, reject mixed runtime/static extent forms, and do not conflate it with tensor_view or invent a static element count
      - "MD-016 part 1 frontend (2026-10-18; shaped-types.md §§ 4.1, 6.0, 7.1, 15.3, 29.3): positional literals Shape[N] { ... }, Strides[N] { ... }, Axes[N] { ... }, AxisList[N] { ... } parse (synthetic never-public component names) and check arity, exact component types (uint; int for Strides) and the static Axes permutation / AxisList uniqueness invariant with S1173 collections.shaped-metadata-literal; get-only .Rank/.Count; read-only uint-indexed reads with constant bounds checks and S1173 on writes; infallible new Shape/Strides and ShapeError-fallible new Axes/AxisList requiring try; TensorLayout[Rank] is a rank-specific enum with exactly DenseRowMajor/DenseColumnMajor/Strided and exhaustive switch coverage; ShapeError is the core error enum in sec/core/error.sec (user decisions 2026-10-18: error marker, core owner). Test: TestShapedMetadataSurface with testdata/sema/shaped_metadata_{valid,invalid}.sec"
    remaining:
      - "MD-016 shaped closure (applied 2026-10-21): implement ShapedStorageRequest[Rank] and MemorySpace.Ordinary, the vector/matrix/tensor init overload families selected by new (default and consuming T[] algorithms, Arena borrowed, ShapeError.InitError for storage failure), static consuming ToShape, Materialize/TransferTo/Relayout with StorageError and a duplication requirement, physical IsContiguous, rank-zero value rejection, reverse-logical destruction and empty-reduction identities. Done: core StorageError enum, ShapeError error union with InitError(StorageError) and InvalidStep removed, core StorageRequest (TestShapedClosureErrorAndRequestDeclarations)."
      - "MD-016 part 1 remaining (verified 2026-10-18): Semantic IR has no representation of shaped metadata (emit-ir stops at 'type Shape'), so §10.2 facts and lowering are open; LSP hover/signature help/go-to-definition do not yet show the exact declarations, structured comments or the Axes/AxisList construction error (§§10.3–10.4); Permute/Contract consumption checks (§§11.4–11.5), runtime ShapeError behavior (§11.7) and differential tests (§11.8) are not implemented; the formatter keeps but does not insert the space in `Shape[3]{ ... }`"
      - implement runtime Shape, Len, Strides, and IsContiguous where required, plus Layout, MemorySpace, Ptr, and shaped instance SizeOf member semantics
      - implement ShapedStorageRequest composition with StorageRequest and explicit Create request validation
      - implement Reshape as borrowed zero-copy view formation with runtime ShapeError checking where required
      - implement ToShape as consuming zero-copy ownership-preserving shape reinterpretation
      - implement Materialize as fallible new owning backing from tensor_view
      - implement explicit TransferTo and Relayout storage-producing semantics without implicit cross-space transfer
      - implement Axes and AxisList compiler-known identities and validation
      - implement Permute and rank-two Transpose as zero-copy view transformations
      - implement multidimensional shaped slicing with exactly one selector per axis and scalar/range rank reduction rules
      - implement step on shaped range selectors including negative step reversal and zero-step rejection
      - implement right-aligned explicit BroadcastTo with zero-stride aliasing and shared-only expanded views
      - implement elementwise shaped + - * / with no implicit shaped broadcasting
      - complete contextual x scalar product/result algebra, accumulation proof, Semantic IR, lowering, and runtime ShapeError checking; static matrix/matrix and matrix/vector Sema already exists partially
      - implement Dot, Outer, Magnitude, Normalize Option semantics, and extent-three Cross
      - implement explicit Contract with AxisList pairs and canonical result-axis ordering
      - preserve no-allocation semantics for logical shaped arithmetic and view transformations
      - integrate shaped runtime checks with ShapeError, IndexError, RangeError, and StorageError
      - integrate shaped Place/view overlap, borrow, lifetime, escape, and destruction semantics
      - synchronize shaped operations and invariants with the canonical rules/mlir dialect and lowering documents
      - add formatter, LSP hover/completion, diagnostic, valid/invalid, analysis, and end-to-end shaped test coverage
    verification:
      - command: go test ./internal/sema -run CompilerKnownStaticShapedFacts -count=1
        result: passed on 2026-09-28 with exact Shape[Rank] results and ordered static extents
      - command: go test ./cmd/lsp -run ShapedRankShapeAndLenCompletionAndHover -count=1
        result: passed on 2026-09-28 with registry-backed Shape completion and hover
      - command: go test ./cmd/lsp -run ShapedStridesCompletionAndHover -count=1
        result: passed on 2026-09-28 with exact Strides[Rank] completion, hover, and canonical row-major facts
      - command: go test ./cmd/lsp -run ShapedIsContiguousCompletionAndHover -count=1
        result: passed on 2026-09-28 with registry-backed bool completion, hover, and compile-time true documentation
      - command: go test ./internal/parser ./internal/sema
        result: passed on 2026-10-05 with runtime-shaped owning tensor parsing, exact tensor[T, Shape[Rank]] identity, compiler-known Rank, owner/view distinction, and mixed-form rejection

