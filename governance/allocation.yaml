    implemented:
      - "ResolveAllocationCapabilities and ResolvedScalarPlan.AllocationCapabilities expose canonical allocation-profile facts shared by Sema and tooling: availability is separate from activation, hosted has a compiler-managed Arena context, embedded-arena has a fixed/program/platform-supplied Arena context, and noalloc disables dynamic allocation without claiming the physical allocator is unsupported"
      - unknown/absent/derived/unmapped allocation profiles preserve unknown capabilities and provider rather than inferring support from OS, architecture, scalar width or target-family spelling; fixed/provided Arena context is positively identified only where specified, and capacity, allocator growth, ISR legality and layout guarantees remain separate proof obligations
      - Sema materialization consumes the canonical facts, keeping ordinary static/copy/borrow/folded operations legal under disabled or unresolved allocation; explicit incomplete/unknown profile inputs cannot inherit the unbound hosted analysis default; S1098 distinguishes known unavailable context from unresolved allocation capabilities
      - "LSP resolves allocation profiles independently of scalar width: same-profile variants retain common facts without guessing width, mixed/invalid variants remain unresolved, standalone sources use registered host facts, and unsaved explicit targets still override the manifest without borrowing capabilities from unrelated dependencies"
      - canonical profiles, disabled-but-supported and enabled-but-unsupported combinations, zero/unknown facts, all analysis depths, profile reanalysis, static operations, mixed/common variants, standalone and unknown explicit targets and real compiler/analyse/LSP parity are verified
      - fixed-address/register views remain non-owning physical storage without an Arena domain; canonical RawPtr.VolatileRead/VolatileWrite contracts prove allocation freedom independently from volatile effects, including transitive wrappers at all analysis depths and allocation profiles
      - raw-pointer cleanup never inherits pointee destruction or allocation; invalid unsafe access retains unknown coverage, similarly named user methods retain actual Arena effects, and foreign mapping without a trusted contract stays unknown; real compiler/analyse/LSP parity covers fixed storage, volatile access, mixed Arena allocation and opaque mapping
