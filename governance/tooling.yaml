      - CST formatting preserves discard, defer, free and explicit moves in declarations, assignments, consuming parameters, calls, payloads, captures and returns. Consuming parameter and capture markers attach to their binding; both vertical styles retain redundant discard, comments and literals without inserting or removing cleanup operations. CLI and LSP use the same formatter.
      - Destruction/use-after-move diagnostics expose named navigation links to move, discard, consuming call, Result projection, release or represented return origins and the source ownership declaration. Loop/conditional/mixed-path witnesses retain uncertainty rather than claiming one operation occurred on every path; unavailable source locations produce no fabricated links.
    remaining:
      - mentor diagnostics must explain which value is affected, where ownership/destruction responsibility originated, what earlier move/discard/replacement changed it, and how to fix the source safely
      - diagnose conditional cleanup requiring forbidden runtime bookkeeping and suggest static restructuring or explicit discard convergence
      - optionally surface the configured low-priority redundancy advisory for a statically redundant discard without changing semantic validity
      - surface destruction classification, custom free, cleanup owner, pending deferred use, partial/conditional state, allocator/release authority, and expected terminal action in hover/analysis where useful
      - update stale rulebook paths from destruction.md to destruction.md opportunistically without creating fake normative corrections
      - support compiler source comments/traceability references to stable destruction § clauses
    required_tests:
      - use-after-destruction/move diagnostic links to earlier terminal ownership action
      - custom-free partial-move diagnostic identifies free and suggests moving whole value or redesigning ownership
      - conditional-destruction policy diagnostic explains differing paths and suggests discard convergence when valid
      - already unavailable discard remains valid under every advisory severity policy
      - LSP hover can show non-trivial destruction and cleanup owner without implying null/Option semantics
      - formatter round-trips free, defer, discard, and ownership move syntax without semantic change
