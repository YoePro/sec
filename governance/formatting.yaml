  - id: tooling.formatter-declaration-comment-alignment
    area: tooling
    status: implemented
    integrated: "2026-08-27"
    revised: "2026-09-13"
    summary: >-
      Aligns trailing line comments within local nominal-declaration groups and
      exposes the shared behavior through both LSP formatting and the initial
      in-place sec fmt command.
    rules:
      - rules/tooling/formatter.md
    code:
      - internal/formatter/formatter.go
      - cmd/compiler/main.go
      - cmd/lsp/main.go
    tests:
      - internal/formatter/formatter_test.go
      - cmd/compiler/main_test.go
      - cmd/lsp/main_test.go
    implemented:
      - align trailing comments in consecutive struct, enum, register, union, and equivalent nominal declaration items to one visual column
      - place the aligned comment column at least four spaces after the widest code item in its local group
      - end groups at blank lines, standalone or documentation comments, multiline items, and nested block boundaries
      - ignore comment-like text inside quoted strings, character literals, and struct tags while locating trailing line comments
      - preserve LF or CRLF, comment text, indentation, and formatter idempotence through the shared formatter package
      - provide in-place sec fmt formatting for one or more explicit source files with atomic replacement and permission preservation
      - expose identical output through LSP document formatting without editor-side alignment logic
    remaining:
      - extend the generic alignment engine to typed declaration groups, struct field/type/tag columns, and compatible non-nominal declaration groups
      - complete sec fmt range, on-type, and minimal-edit modes; recursive directory and project selection is blocked on MD-037; check, stdin, and fix modes are implemented
      - migrate the remaining trimmed-line indentation and alignment decisions to the parser-owned lossless comment/trivia attachments now returned by the shared formatter
    verification:
      - command: go test ./internal/formatter ./cmd/compiler ./cmd/lsp -run 'TrailingComment|AlignsDeclaration|RunFmtCommand' -count=1
        result: passed
  - id: tooling.formatter-check-explicit-files
    area: tooling
    status: implemented
    integrated: "2026-09-09"
    summary: >-
      Adds sec fmt --check for explicit source files using the same formatter
      as in-place formatting and LSP document formatting.
    rules:
      - rules/tooling/formatter.md
    code:
      - cmd/compiler/main.go
    tests:
      - cmd/compiler/fmt_check_test.go
      - testdata/formatter/check_canonical.sec
      - testdata/formatter/check_noncanonical.sec
    implemented:
      - return exit code 0 silently when every selected file matches the current shared formatter output
      - report all noncanonical files with format.noncanonical-source and exit code 1 without labeling differences as language errors
      - preserve file bytes, line endings, identity, permissions, and modification times in check mode
      - accept --check before or after file paths and -- to terminate option parsing
      - reject unsupported options before formatting any files and return exit code 1 for input errors
      - verify that ordinary in-place formatting makes a subsequent check pass
      - report byte-preserved lexically malformed or delimiter-incomplete files with format.malformed-source instead of falsely accepting unchanged uncertain source as canonical
    remaining:
      - directory and project selection and --fix remain outside this explicit-file integration; --stdin is tracked by tooling.formatter-stdin
      - canonical-style coverage remains limited to the current shared formatter implementation
    verification:
      - command: go test ./cmd/compiler ./internal/formatter -count=1
        result: passed, including subprocess checks of real CLI exit codes and diagnostics
  - id: tooling.formatter-stdin
    area: tooling
    status: implemented
    integrated: "2026-09-09"
    summary: >-
      Adds sec fmt --stdin using the shared formatter, emitting formatted source
      with LF line endings on standard output.
    rules:
      - rules/tooling/formatter.md
    code:
      - cmd/compiler/main.go
    tests:
      - cmd/compiler/fmt_stdin_test.go
      - cmd/compiler/fmt_check_test.go
      - testdata/formatter/check_canonical.sec
      - testdata/formatter/check_noncanonical.sec
    implemented:
      - format standard input without requiring or modifying source files
      - normalize LF, CRLF, CR, and mixed input line endings to LF
      - preserve empty input and produce idempotent output through the shared formatter
      - propagate read errors, write errors, and short writes; CLI failures exit with code 1 and diagnostics on standard error
      - reject combinations with --check or file paths and reject unsupported options before processing input
      - verify CLI standard output and standard error separately through subprocess tests
    remaining:
      - canonical-style coverage remains limited to the current shared formatter implementation
    verification:
      - command: go test ./cmd/compiler ./internal/formatter -count=1
        result: passed, including stdin CLI and I/O failure tests
  - id: tooling.formatter-v2
    area: tooling
    status: partial
    integrated: "2026-09-23"
    revised: "2026-10-03"
    document_revision: "2.0"
    repository_baseline: main-reviewed-2026-09-23
    summary: >-
      Tracks conformance of the shared Sec formatter to formatter revision 2.0.
      The repository has a usable but primarily bespoke, line-oriented CLI/LSP
      formatter plus a lexical CST foundation that is not yet its primary
      engine. The formatter must migrate to a CST-driven architecture while
      preserving existing behavior, then complete the configured,
      grammar-aware formatting and correction contract.
    rules:
      - rules/tooling/formatter.md
      - rules/foundations/lexical_structure.md
      - rules/compiler/parser_recovery.md
      - rules/tooling/lsp.md
      - rules/tooling/testing.md
    related_integrations:
      - tooling.cst-lexical-foundation
      - tooling.formatter-delimiter-handoff
      - tooling.formatter-single-line-call-spacing
      - tooling.formatter-single-line-delimiter-spacing
      - tooling.formatter-declaration-comment-alignment
      - tooling.formatter-check-explicit-files
      - tooling.formatter-stdin
    code:
      - internal/ast/ast.go
      - internal/parser/parser.go
      - internal/parser/expression.go
      - internal/cst/document.go
      - internal/cst/groups.go
      - internal/cst/roles.go
      - internal/formatter/formatter.go
      - internal/formatter/cst_spacing.go
      - internal/formatter/corrections.go
      - internal/formatter/block_comments.go
      - internal/formatter/line_comments.go
      - internal/formatter/struct_field_alignment.go
      - internal/formatter/parameter_alignment.go
      - internal/formatter/enum_value_alignment.go
      - cmd/compiler/main.go
      - cmd/lsp/main.go
    tests:
      - internal/cst/document_test.go
      - internal/cst/groups_test.go
      - internal/cst/roles_test.go
      - internal/formatter/formatter_test.go
      - cmd/compiler/main_test.go
      - cmd/compiler/fmt_check_test.go
      - cmd/compiler/fmt_stdin_test.go
      - cmd/lsp/main_test.go
    implemented:
      - >-
        One shared formatter implementation serves sec fmt and LSP document
        formatting; LSP does not maintain an independent formatting grammar.
      - >-
        The lexer-backed CST foundation preserves source-ordered tokens,
        trivia, invalid tokens, byte ranges, delimiter groups, incomplete
        groups, and exact source round trips for its implemented lexical scope.
      - >-
        Current canonical slices cover structural indentation, selected
        delimiter and call spacing, multiline try-handler handoff, top-level
        test declarations, ownership spellings, registers, units, assertions,
        panic, matches, and local declaration-comment alignment.
      - >-
        sec fmt supports explicit in-place files, --check for explicit files,
        and --stdin; these paths reuse the shared formatter and have focused
        idempotence and CLI/LSP behavior tests.
      - >-
        The foreign `func` declaration correction is now gated behind the
        formatter's explicit fix option; ordinary CLI/LSP formatting preserves
        that token. Other selected historical rewrites such as statement i++
        still predate the revision-2.0 correction boundary and remain to be
        separated.
      - >-
        Redundant directly nested parentheses now use complete CST delimiter
        parentage in the opt-in correction layer. The inner pair is removed
        only when it is the outer pair's sole non-trivia content, so `(())`
        becomes `()` and `Call((value))` becomes `Call(value)` without removing
        call delimiters; ordinary formatting and comment-separated groups are
        preserved.
      - >-
        Parser-confirmed `if`, `while`, and `switch` nodes now retain complete
        outer condition-parenthesis tokens and project them into a dedicated
        CST correction role. With fixes enabled, `if (ready)` becomes
        `if ready`; parentheses that group only part of a larger condition,
        failed headers, and ordinary formatting remain unchanged.
      - >-
        The first CST-driven language-surface slice projects parser-owned
        generic-constraint conjunction roles onto exact concrete tokens and
        formats their horizontal trivia from CST byte spans while preserving
        ordinary bitwise operators and uncertain recovered syntax.
      - >-
        Contextual matrix-multiplication x now uses the same parser-owned CST
        role and spacing pass, replacing its formatter-local AST reflection and
        physical-line rewrite while preserving ordinary x identifiers.
      - >-
        Parser-confirmed statement-only ++ and -- aliases now use a CST role in
        the same shared pass, replacing their formatter-local AST reflection
        and physical-line rewrite while invalid expression uses remain
        untouched; correction configuration remains separately incomplete.
      - >-
        Unit metadata names now use parser-scoped CST roles and exact concrete
        byte spans in the shared pass, replacing a separate formatter parse and
        rune-column rewrite while same-spelled ordinary impl members remain
        untouched.
      - >-
        Valid top-level test declaration names now use parser-scoped CST roles
        and exact string-token spans in the shared pass, replacing a per-line
        lexer while preserving test-name bytes and ordinary test identifiers,
        calls, and strings.
      - >-
        Ownership availability if blocks now use parser-scoped CST roles on
        their exact opening braces, replacing blind line-text substitutions
        while ordinary available, is, and not identifiers and conditions remain
        outside the formatting role.
      - >-
        Parser-confirmed structural unit expressions now project their
        multiplication, division, exponent, and real grouping-delimiter tokens
        into CST roles. Compact unit spacing uses those exact spans, replacing
        the formatter's angle-bracket line scanner while ordinary comparison
        and arithmetic tokens remain outside the role.
      - >-
        Function, lambda, and initializer parameter lists now retain their
        exact opening token as a parser fact and project it into a CST role.
        Callable spacing no longer uses the formatter's separate signature-line
        scanners, while ordinary call parentheses remain outside the role.
      - >-
        Grouped let and typed declarations now project only their
        parser-confirmed declarator commas into CST roles. Separator spacing is
        normalized from exact token spans, replacing the grouped-let line
        scanner while commas nested in initializer expressions remain ordinary
        expression syntax.
      - >-
        Match patterns now project parser-owned payload and field delimiters,
        explicit field-binding colons, where guards, and match/try arrows onto
        exact CST tokens. The shared spacing pass replaces the former
        match-arm line scanner, remains idempotent, and does not claim arrows
        from invalid arms retained through parser recovery.
      - >-
        Parser-confirmed match patterns now also project their closing payload
        and shallow-field delimiters and commas between shallow fields. The CST
        pass emits compact `Some(value)` payloads and canonical
        `Point { X: x, Y: y }` spacing while invalid recovered patterns remain
        outside these roles.
      - >-
        Valid switch case and default headers now retain their terminating
        colon as a parser fact and project it, together with commas between
        case alternatives, onto exact CST tokens. The shared spacing pass
        emits `case 1, 2:` punctuation without assigning formatting roles to
        incomplete clauses retained through parser recovery.
      - >-
        Standalone multiline block comments and documentation comments now use
        lossless CST comment-token spans to produce the §12 aligned-star form,
        retain surrounding indentation and paragraph boundaries, and keep
        comment-contained delimiters from changing executable indentation.
        Single-line and inline block comments remain unchanged; nested
        multiline normalization remains outside this first slice.
      - >-
        Block comments whose opener is indented further than their body
        (2026-10-01) take their layout indentation from the smaller of the
        opener indentation and the least-indented plain content line. Lines
        already in aligned-star form always keep only the text after their
        star, so a shifted opener no longer repeats `*` on the following lines
        or misclassifies ordinary lines as preformatted.
      - >-
        Lexer-owned line comments now receive the canonical §12 delimiter
        margin: non-empty comments use `// text`, empty comments use `//`, and
        internal prose spacing is not reflowed. Comment-like text inside
        strings, raw strings, and block comments remains untouched; `///`
        follows its Sec 0.1 status as an ordinary line comment.
      - >-
        Ordinary formatting now preserves complete source bytes when the
        lossless CST proves lexical errors, unmatched real closers, or
        incomplete real delimiter groups. The shared result exposes this state
        so sec fmt --check reports format.malformed-source rather than treating
        unchanged uncertain input as canonical; LSP returns the same bytes.
      - >-
        Parser-attached argument-free attributes now project their final token
        and declaration start into CST roles. Ordinary formatting puts
        `@noCopy` and `@noPanic` on their own immediately attached lines,
        preserves method indentation, and removes the former `@noCopy`
        name-specific trimmed-line rewrite.
      - >-
        Complete parser-valid function, method, initializer, and lambda
        parameter lists now project their matching closing delimiter into the
        CST. Multiline lists receive the required trailing comma while
        single-line and recovered invalid lists remain outside this rewrite.
      - >-
        Complete parser-valid explicit lambda capture lists now retain their
        opening delimiter and project the matching pair into CST roles.
        Multiline capture lists receive the required trailing comma while
        single-line capture syntax and ordinary parenthesized expressions
        remain unchanged.
      - >-
        Parser-confirmed executable blocks now project their real opening and
        closing braces into CST roles. One-line function, control-flow, defer,
        and other executable bodies expand recursively to canonical multiline
        layout, including empty bodies, while aggregate literals and compact
        empty structural declarations remain distinct and unchanged.
      - >-
        Parser-confirmed range expressions, slice ranges, and contextual
        for-range step keywords now retain their exact tokens as CST roles.
        The shared spacing pass emits compact `start..end` and `start..<end`
        operators plus one-space `step`, while ordinary identifiers named
        `step` remain unchanged.
      - >-
        Complete parser-confirmed struct fields now project their colon,
        declared-type start, and optional raw tag as CST alignment anchors.
        Contiguous homogeneous groups align the primary type column and then
        the secondary tag column under §9; comments and blank lines split
        groups, and a column requiring more than the default sixteen spaces
        of padding is dropped without discarding an already valid primary
        column.
      - >-
        Complete explicit enum initializers now retain their exact assignment
        token and project canonical equals anchors into the CST. Contiguous
        homogeneous groups align under §15.4 with one-space initializer
        padding, while comments, blank lines, implicit members, legacy colon
        spellings, declaration boundaries, and the maximum-padding limit
        prevent inappropriate alignment.
      - >-
        Complete callable parameters now project their declaration colon and
        first concrete type token into CST roles. Compatible contiguous
        multiline function, method, initializer, and lambda parameter groups
        align their type column under §16(3), including variadic spread starts,
        while blank lines and the maximum-padding limit produce deterministic
        local fallback and single-line parameter lists remain compact.
      - >-
        Complete generic type references now retain their exact argument-list
        brackets as parser-owned CST roles. Deliberately multiline lists gain
        the required trailing comma under §15(7), while single-line generic
        lists, sequence types, expression indexing, and recovered incomplete
        syntax remain outside this rewrite.
      - "line endings: well-formed CRLF, bare-CR, and mixed input is written with LF in the shared formatter core, so CLI file, stdin, and LSP formatting agree (rules/foundations/lexical_structure.md §2; detail in frontend.lexical-structure)"
      - "idempotence (fixed 2026-10-03): open-start and open-end range patterns (`case ..<0:`, `case 101..:`) carry dedicated CST roles that compact only the bounded side, and a parser-confirmed `case` keyword with alternatives is a spaced keyword, so `case ..<0` no longer collapses to `case..<0` and loses its case-label indentation on the next pass; every non-invalid repository .sec file now formats idempotently"
      - "§ 4 configuration (2026-10-03): formatter.Options carries indentation_width (2, 4, or 6; default 4), vertical_style (structured or compact), and language_corrections (Fix); ValidateOptions rejects values outside the format_version = 1 domains, DefaultOptions returns the § 4(5) defaults, indentation and executable-block expansion use the configured width, the maximum alignment padding is four indentation widths (§ 4(14)) for struct, enum, parameter, and named-type alignment, and compact style drops the optional blank line between import classes (§ 13(9)); reading the project configuration is blocked on MD-036"
      - "§ 11(2), § 17(2) (2026-10-03): multiline call, Ok/Err/new argument lists, array literals, and comma-using struct literals gain the trailing comma when their closing delimiter stands on its own line; hugging forms such as Append(Value { ... }) and comma-free line-layout struct literals (§ 11(7)) are left unchanged; the parser now treats comments inside argument lists, array literals, and parameter lists as trivia so trailing comments no longer cause parse errors"
      - "§ 9(13)–(15) (2026-10-03): a let or assignment value whose same-level infix chain already has one operand per line is laid out with the value on the next line, one stable operand column two spaces past the continuation indentation, and right-aligned leading operators; trailing-operator layouts become leading; values with comments, shared operand lines, or multiline operands are unchanged"
      - "§ 17(6)–(7) (2026-10-03): a let or assignment value that is an already multiline member or call chain is laid out with the receiver on the continuation line and every segment on its own leading-dot line one level deeper; trailing dots become leading dots; chains with a multiline segment, a blank line, or comments are unchanged"
      - "§ 15(1) (2026-10-03): non-empty single-line struct, enum, union, register, interface, and impl blocks become multiline; comma-separated blocks put each item on its own line with the trailing comma, empty blocks stay compact (§ 8(7)), and blocks with comments are unchanged"
      - "§ 16(14) (2026-10-03): consecutive argument-free attributes receive the same line-break role as the final attribute; the parser currently accepts only one attribute per function, so the rule has no valid multi-attribute input yet"
      - "§ 6(4) single-line parameters (fixed 2026-10-03): parameters of a single-line callable parameter list (functions, methods, interface requirements, extern declarations, lambdas) get exactly one space between colon and type; previously only multiline lists were touched, so `source:      ref mut Reader` was preserved (TestFormatNormalizesSingleLineParameterSpacing)"
      - "MD-013 (rules/corrections/applied/missing-decisions-md010-md014-correction-20261003.md § 5, 2026-10-03): register fields, including reserved `_` fields, carry the shared StructFieldColon/StructFieldTypeStart CST anchors (for `bit`, `bit[N]`, and named field types) and align through the same structural field engine as struct fields; a trailing comment no longer ends a field alignment group, while blank lines and standalone comments still do; trailing comments occupy the next structural column one standard space (structuralColumnSpacing) after the widest code cell instead of a hard-coded four-space gutter; every repository .sec file remains idempotent"
      - "literal preservation (fixed 2026-10-03, § 29): the line-oriented delimiter, call, split, assertion, trailing-comment, and indentation scanners skip string, raw-string, character, and interpolated-string literals by exact lexer token spans (internal/formatter/literal_spans.go) instead of a private quote toggle, so braces and quotes inside nested interpolation expressions no longer rewrite literal text (`{value}` to `{ value }`) or drop the indentation of every following line"
    remaining:
      - "formatter-switch-case-label-column: blocked on MD-032 — whether switch case/default labels align with `switch` as in the § 18(7) example or stay indented one level as the formatter and its tests do today."
      - formatter-header-token-spacing: header spacing is normalized since 2026-10-02 for named types, contracts, function and extern headers, function-type returns, ref/ref mut, type-first declarations, enum, unit, interface, impl, and single imports (frontend.types-core); since 2026-10-03 the discard, assert, panic, and contextual detach statement keywords (with a trailing detach discard spaced before) are parser-confirmed spaced keywords as well; operand-free keywords such as cancel, break, and continue need no spacing role.
