package:
  id: SEC-MLIR-P11
  name: Enum and Union Semantic Value Representation
  repository: https://github.com/YoePro/sec
  branch: main
  repository_sync_commit: 152c772
  repository_sync_date: '2026-08-09'
  semantic_ir_version_before: 1
  semantic_ir_version_after: 1
  sec_mlir_schema_before: 6
  sec_mlir_schema_after: 7
  lowering_spec_before: 6
  lowering_spec_after: 7
  goal: Add canonical high-level enum/union value representation without physical
    union layout or hidden ownership semantics.
  next_package: Enum and Union Match CFG
normative_updates:
- repository_path: rules/semantic_ir.txt
  supplied_file: sec_semantic_ir_enum_union_package11.md
  kind: normative amendment
- repository_path: rules/sec_mlir_dialect.md
  supplied_file: sec_mlir_dialect_package11.md
  schema_version: 7
- repository_path: rules/sec_mlir_lowering.md
  supplied_file: sec_mlir_lowering_package11.md
  version: 7
wide_builtin_invariant:
  active:
  - int128
  - int256
  - uint128
  - uint256
  - decimal128
  enum_underlyings:
  - int128
  - int256
  - uint128
  - uint256
  union_payloads_may_use_wide_types: true
  forbidden_status:
  - future
  - planned
  - reserved
  - placeholder
  - not yet active
enum:
  semantic_identity: distinct named type
  default_underlying: int, target-sized by CompilationPlan
  underlying_must_be_integer: true
  bit_backed_widths:
  - 1
  - 256
  case_order: declaration order
  case_id: stable declaration identity distinct from numeric value
  numeric_storage: arbitrary precision
  aliases_allowed: true
  alias_runtime_equality: numeric enum value
  converted_value_may_have_no_declared_case: true
  semantic_ir_ops:
  - EnumConstantOp
  - EnumFromIntegerOp
  - EnumToIntegerOp
  - EnumCompareOp
  compare_predicates:
  - eq
  - ne
  ordering: false
  arithmetic: false
union:
  semantic_identity: distinct named type
  variant_index: stable zero-based declaration-order compiler metadata
  variant_index_source_integer: false
  variant_kinds:
  - empty
  - single
  - fields
  generic_runtime_values: concrete substituted instances only
  semantic_ir_ops:
  - UnionConstructOp
  - UnionIsVariantOp
  - UnionUnwrapPayloadOp
  - UnionUnwrapFieldOp
  payload_action_p11: copy-trivial
  nontrivial_payload_value_ops: UnsupportedFeatureError
  type_definition_can_describe_nontrivial_payloads: true
  physical_layout: deferred
  equality_lowering: deferred
semantic_ir:
  version_bump: false
  new_defs:
  - EnumDefinition
  - EnumCase
  - UnionDefinition
  - UnionVariantDefinition
  - UnionPayloadField
  new_ids:
  - EnumCaseID
  - UnionVariantIndex
  preserve:
  - TypeID
  - SymbolID
  - qualified identity
  - source locations
  - copy classification
  - trivial destruction
  - optional LayoutRef
  printer: deterministic declaration order
dialect:
  schema_version: 7
  new_attrs:
  - EnumCaseAttr
  - UnionFieldAttr
  - UnionVariantAttr
  new_types:
  - '!sec.enum'
  - '!sec.union'
  new_ops:
  - sec.enum.constant
  - sec.enum.from_integer
  - sec.enum.to_integer
  - sec.enum.cmp
  - sec.union.construct
  - sec.union.is_variant
  - sec.union.unwrap_payload
  - sec.union.unwrap_field
  new_verifier: --sec-verify-union-guards
  physical_union_layout: false
arithmetic_error_migration:
  old_schema6: '!sec.core_error<"core::ArithmeticError">'
  new_schema7: ordinary !sec.enum ArithmeticError
  old_variant_test: sec.core_error.is_variant
  new_specific_handler: sec.enum.constant + sec.enum.cmp eq
  legacy_schema6_parse: true
  new_emitter_uses_core_error_type: false
result_option:
  result: '!sec.result<T,E> retained as specialized high-level semantic view'
  result_physical_representation: must eventually obey canonical Result union semantics
  option: may use concrete !sec.union Some/None representation
package6_compatibility:
  resolve_enum_underlying_one_level: true
  preserve_enum_wrapper: true
  default_int_32_or_64_by_plan: true
package8_compatibility:
  recurse_into_enum: false
  recurse_into_union: false
  signless_normalization_deferred: true
package10_compatibility:
  generalize_enum_error_handlers: true
  supported_error_kind_after_p11: fieldless enum with canonical !sec.enum
  specific_handler_lowering: enum constant + enum eq
  catch_all: bind complete enum value
  user_union_try_handler_extension: deferred
ownership_boundary:
  construction_projection_requires: CopyClassificationOf == CopyTrivial
  move_only: unsupported in P11 value path
  semantic_copy: unsupported in P11 value path
  conditional_copy: unsupported in P11 value path
  nontrivial_destruction: unsupported in P11 value path
  must_not_hide_transfer: true
tests:
  enum:
  - aliases
  - arbitrary precision
  - int128 underlying
  - uint256 underlying
  - bit1
  - bit256
  - from integer
  - to integer
  - eq/ne
  - nested enum
  - target-sized default underlying 32/64
  union:
  - empty variants
  - single int32
  - single int128
  - single enum
  - mixed variants
  - struct-like trivial fields
  - Option[int32]
  - Option[int128]
  - nested union
  - invalid variant index
  - nontrivial payload rejected
  union_guard:
  - canonical accepted
  - unguarded projection rejected
  - wrong branch rejected
  - wrong variant rejected
  - different union rejected
  - wrong projection kind rejected
  - unknown field rejected
  p10:
  - ArithmeticError ordinary enum
  - user enum error specific handler
  - enum error catch-all
  - Result[int128, enum-error]
  - Result[uint256, enum-error]
  - no new core_error in schema7 output
  regression:
  - schema6 parse
  - check-sec-mlir
  - go test ./...
  - legacy paths
acceptance:
- baseline 152c772 or newer documented
- previous regressions green
- wide builtins remain active
- Semantic IR amendment applied
- schema v7 installed
- lowering v7 installed
- enum definitions/cases implemented
- enum arbitrary precision
- aliases supported
- enum conversions represented
- enum eq/ne represented
- target-sized default enum
- bit-backed enum through 256
- union definitions/variants implemented
- stable union indices
- generic concrete unions
- trivial union construction/projection
- union guard verifier
- nontrivial transfer rejected
- enum/union MLIR attrs/types/ops implemented
- ArithmeticError migrated to enum
- P10 enum handlers generalized
- Result enum errors work
- no general match CFG
- no physical union layout
- no union equality lowering
- no LLVM dialect
- check-sec-mlir passes
- go test ./... passes
- legacy paths operational
package12:
  name: Enum and Union Match CFG
  scope:
  - resolved MatchPlan
  - subject evaluated once
  - source-order arms
  - first match
  - enum constant patterns
  - union variant patterns
  - payload binding
  - catch-all
  - guards
  - exhaustiveness mapping
  - match statement
  - match expression SSA merge
  - Result/Option integration
  still_deferred:
  - physical union layout
  - ownership-sensitive payload moves
  - LLVM
