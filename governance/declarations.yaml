      - substantial member conflict checking across fields, properties, methods, events, and nested types
      - function, method, property, and impl declaration surfaces are substantially registered before body analysis
      - ordinary nested lexical scopes inherit visible value symbols, so a subset of local and loop-binding shadowing is rejected
      - duplicate generic parameter names are rejected
      - generic type-parameter names require an uppercase initial after visibility prefixes, including Unicode uppercase letters
      - generic type parameters cannot shadow source-defined types from the same module, including forward declarations and nested type parameters; S1039 points to both declarations
      - function and method parameters cannot shadow source-defined types in the same module, including forward declarations; mandatory S1040 points to the parameter and the hidden type declaration
