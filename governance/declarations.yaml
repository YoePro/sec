  - id: frontend.function-overload-backend-identity
    area: frontend-semantic-ir-and-lowering
    status: partial
    audited: '2026-08-19'
    repository_baseline: c515862
    document_revision: '2.0'
    document_created: '2026-08-14'
    document_last_updated: '2026-08-14'
    summary: Supplements frontend.functions-v2 with the missing backend identity status for ordinary overloads. Sema
      resolves overloads by parameter signature and records the exact selected callable, but the legacy direct LLVM
      generator stores only one declaration per source function name and emits ordinary overload declarations under
      the same unmangled LLVM symbol. The legacy AST-to-LLVM-dialect MLIR generator distinguishes overloads only by
      arity and explicitly rejects same-arity overloads. End-to-end lowering therefore does not yet preserve the canonical
      Sema-selected overload identity for overloads distinguished by parameter type.
    rules:
    - rules/declarations/functions.md
    - rules/declarations/generics.md
    - rules/compiler/semantic_ir.md
    - rules/mlir/sec_mlir_lowering.md
    code:
    - internal/sema/analyzer.go
    - internal/sema/semantic_facts.go
    - internal/codegen/llvm/generator.go
    - internal/codegen/llvm/functions.go
    - internal/codegen/llvm/expressions.go
    - internal/codegen/mlir/generator.go
    - internal/ir/semantic
    - internal/lowering/secmlir
    tests:
    - internal/sema/analyzer_test.go
    - internal/codegen/llvm/generator_test.go
    - internal/codegen/mlir/generator_test.go
    - internal/ir/semantic
    - internal/lowering/secmlir
    implemented:
    - ordinary overload groups are registered in Sema by source name
    - overload identity excludes return type
    - overloads differing only by ordinary versus forced-consuming parameter mode are rejected
    - exact parameter matches are preferred over matches requiring conversion
    - ambiguous equally ranked Sema candidates are rejected
    - the exact selected ordinary callable is retained in resolved Sema call facts
    - legacy MLIR provides deterministic arity-based symbols when overloads differ in arity
    - legacy MLIR explicitly rejects same-name same-arity overload groups rather than guessing a parameter-type overload
    partial:
    - direct LLVM stores functions in map[string]*ast.FunctionDeclaration, so later declarations replace earlier declarations
      in the name lookup used by code generation and function-value materialization
    - direct LLVM llvmFunctionSymbol() returns the ordinary source function name for every non-extern overload, so
      distinct ordinary overload definitions do not receive distinct backend symbols
    - legacy AST-to-LLVM-dialect MLIR mangles overloads only by parameter count and rejects overloads that share the
      same arity even when Sema has resolved them unambiguously by parameter type
    - legacy MLIR resolveFunction() performs backend call lookup by source name and arity instead of consuming the
      exact callable selected by Sema
    - backend symbol identity is therefore not yet a preserved consequence of canonical parameter-signature overload
      identity
    remaining:
    - preserve the exact Sema-selected callable identity in Semantic IR call facts
    - assign deterministic backend symbols to ordinary overloads using canonical semantic signature identity rather
      than source name or arity alone
    - ensure symbol identity includes parameter types and all signature dimensions that participate in callable identity,
      while excluding return type and non-discriminating ownership mode exactly as required by the rulebooks
    - make direct LLVM retain overload groups or consume resolved callable facts rather than overwriting declarations
      by source name
    - prevent direct LLVM from emitting multiple distinct overload definitions under one ordinary source symbol
    - make legacy MLIR consume the resolved overload identity instead of re-resolving calls by arity
    - support same-arity parameter-type overloads through every maintained backend or reject the backend path with
      an explicit unsupported-lowering diagnostic before producing IR
    - preserve deterministic overload symbols across source order, modules, generic specialization, and repeated builds
    - add end-to-end tests where two overloads have the same name and arity but different parameter types and both
      are called
    - add tests proving overload symbols cannot collide when physical lowered parameter types happen to coincide but
      semantic overload identity remains distinct where the ABI permits the distinction
    - integrate native variadic overload identity later without conflating it with C/foreign varargs
    governance_reconciliation:
    - frontend.functions-v2 already records the broad remaining work to represent calls in Semantic IR and lower calls
      through Sec MLIR/LLVM. This supplement makes the specifically missing ordinary-overload symbol and selected-callable
      identity problem explicit.
    - Do not downgrade Sema ordinary-overload resolution. The frontend already resolves same-arity overloads by semantic
      parameter types.
    - 'Do not classify the legacy MLIR same-arity error itself as a semantic compiler bug: that backend explicitly
      reports the unsupported case. The missing implementation is preservation/lowering of the already resolved callable.'
    - The direct LLVM path requires special care because it does not provide the same explicit same-arity-overload
      guard and uses one source symbol for every ordinary overload.
    required_tests:
    - same-name different-arity overloads lower to distinct deterministic symbols
    - same-name same-arity different-parameter-type overloads both lower and call the Sema-selected targets
    - source declaration order does not change backend overload symbols
    - return type never contributes to overload symbol identity because such source overloads are already invalid
    - forced-consuming versus ordinary mode does not create a distinct overload symbol because such source overload
      pairs are already invalid
    - direct LLVM never silently overwrites overload lookup by source name
    - direct LLVM never emits distinct overload definitions under the same backend symbol
    - legacy MLIR no longer re-resolves a Sema-resolved call by arity
    - unsupported backend paths fail before publishing invalid or ambiguous IR
