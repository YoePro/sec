  - id: sema.parameter-usage-analysis
    area: frontend-analysis
    status: partial
    integrated: "2026-08-08"
    revised: "2026-10-02"
    summary: >-
      Implements immutable post-Sema ParameterDemand summaries from resolved
      bindings, canonical Places, calls, escape facts, and interprocedural fixed
      points. A2001 large-value advice now runs only after exact demand proves a
      shared borrow preserves every modeled critical capability; size remains
      recommendation cost evidence rather than semantic proof. Compiler-owned
      if-flow facts exclude branches that Sema proved never execute.
    rules:
