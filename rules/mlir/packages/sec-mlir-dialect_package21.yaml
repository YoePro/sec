locked_facts:
  active_types:
  - decimal
  - decimal128
  - int128
  - int256
  - uint128
  - uint256
  representations:
    decimal:
    - i64
    - i32
    decimal128:
    - i128
    - i32
  source_literals: unsuffixed fractions default decimal; m selects decimal family; exact lexeme
  operators: checked exact decimal; no binary floating intermediate; remainder truncation
  rounding_mode:
  - NearestEven
  - NearestAwayFromZero
  - TowardZero
  - AwayFromZero
  - Ceil
  - Floor
  implicit_rounding: false  # except decimal division (MD-066 § 5): nearest-even at the finest admissible scale
  core_decimal_scale_type: int32  # MD-066 (2026-10-28); getter and try set PrecisionError
  precision_error:
  - PrecisionLoss
  - ScaleOverflow
  - PrecisionExhausted
  numeric_conversion_error_p20:
  - OutOfRange
  - PrecisionLoss
  - NotFinite
normative_decision_gates:
- id: SEC-MLIR-P21-D1
  area: arithmetic result scale/canonicalization and public scale domain
  status: decided 2026-10-28 (MD-066); normative block released; implementation pending
  decision: rules/corrections/applied/md066-md067-md068-decimal-correction-20261028.md §§ 2-6, 8
  summary: int32 public scale with fallible exact setter; preferred scale with nearest exact fallback; division alone rounds (nearest-even, finest admissible scale); provably zero decimal divisor is a compile-time error
  blocks:
  - operator scale-sensitive lowering
  - RoundTo/Rescale policy
  - public scale validation
- id: SEC-MLIR-P21-D2
  area: single exact decimal arithmetic operator error type/priority
  status: decided 2026-10-28 (MD-067); normative block released; implementation pending
  decision: rules/corrections/applied/md066-md067-md068-decimal-correction-20261028.md § 7
  summary: no DecimalArithmeticError (recommendation rejected); core::ArithmeticError gains ScaleOverflow and PrecisionExhausted; most specific applicable variant by mathematical cause
  blocks:
  - operator error CFG/try implementation
- id: SEC-MLIR-P21-D3
  area: complete decimal128 public core member surface
  status: decided 2026-10-28 (MD-068); normative block released; implementation pending
  decision: rules/corrections/applied/md066-md067-md068-decimal-correction-20261028.md § 9
  summary: decimal128 mirrors the complete decimal member family (core-library.md § 10.4)
  blocks:
  - decimal128 method registry and public declaration generation
observed_implementation_bugs:
- id: SEC-MLIR-P21-B1
  severity: high
  description: internal/sema/constants.go decimalLiteralValue limits coefficient to int64, loses
    decimal128 range.
- id: SEC-MLIR-P21-B2
  severity: medium
  description: internal/sema/compiler_known_members.go registers Decimal Scale as int; rulebook requires
    int32 with a fallible setter (MD-066, 2026-10-28; formerly uint8).
- id: SEC-MLIR-P21-B3
  severity: medium
  description: sec/core/decimal.sec ToString() string stub conflicts with Result[string,StringError]
    contract.
- id: SEC-MLIR-P21-B4
  severity: high
  description: P20 assumes plain float is always binary64; Oct 3 MD-014 makes plain float target-sized.
- id: SEC-MLIR-P21-B5
  severity: medium
  description: sec/core/error.sec does not show P20 NumericConversionError declaration in reviewed
    main source.
semantic_ir_ops:
- DecimalConstOp
- DecimalUnaryOp
- DecimalBinaryCheckedOp
- DecimalCompareOp
- DecimalScaleOp
- DecimalCoreOp
- DecimalRoundToCheckedOp
- DecimalRescaleCheckedOp
- DecimalConvertExactOp
- DecimalConvertCheckedOp
- DecimalErrorFromReasonOp
dialect_delta:
- sec.decimal.constant
- sec.decimal.unary
- sec.decimal.binary_checked
- sec.decimal.cmp
- sec.decimal.scale
- sec.decimal.core
- sec.decimal.round_to_checked
- sec.decimal.rescale_checked
