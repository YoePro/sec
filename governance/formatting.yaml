schema_version: 1
area: formatting
purpose: Source formatting, formatting fixes, and formatter behavior.
integrations:
  - id: tooling.cst-lexical-foundation
    area: tooling
    status: partial
    integrated: "2026-09-16"
    revised: "2026-09-25"
    summary: >-
      Introduces a lexer-backed, byte-lossless concrete-syntax foundation and
      lexical delimiter hierarchy. The formatter remains primarily a bespoke
      trimmed-line transformation pipeline, but selected grammar-aware slices
      now use parser-owned roles projected onto exact CST tokens.
    rules:
      - rules/tooling/formatter.md
      - rules/foundations/lexical_structure.md
      - rules/compiler/parser_recovery.md
    code:
      - internal/ast/ast.go
      - internal/parser/parser.go
      - internal/parser/expression.go
      - internal/cst/document.go
      - internal/cst/groups.go
      - internal/cst/roles.go
      - internal/formatter/formatter.go
      - internal/formatter/cst_spacing.go
      - internal/formatter/corrections.go
      - internal/formatter/block_comments.go
      - internal/formatter/line_comments.go
    tests:
      - internal/cst/document_test.go
      - internal/cst/groups_test.go
      - internal/cst/roles_test.go
      - internal/formatter/formatter_test.go
      - testdata/cst/groups_valid.sec
      - testdata/cst/groups_invalid.sec
    implemented:
      - retain source-ordered lexer tokens, comments, whitespace, invalid tokens, lexical diagnostics, original byte ranges, and an initial BOM without changing original source bytes
      - preserve exact round trips over Unicode, CRLF, nested comments, interpolated and raw strings, and invalid UTF-8 bytes
      - use lexer-owned comment tokens for trailing-comment boundary detection during formatter alignment
      - retain the previous conservative scanner for malformed single-line source until structural recovery is available
      - derive nested parenthesized, bracketed, and braced delimiter groups from real lexer tokens, retaining incomplete groups and unmatched closers without synthetic recovery
      - conservatively classify documents with lexer diagnostics, unmatched real closers, or incomplete real delimiter groups as uncertain and preserve their complete source bytes during ordinary formatting
      - project parser-owned generic-constraint conjunction roles onto exact CST tokens and use their byte spans for canonical formatter spacing without rewriting ordinary bitwise-and expressions or recovered missing constraints
      - project parser-owned contextual matrix-operator roles onto exact CST tokens and share one CST spacing pass with generic constraints, replacing the formatter's former standalone AST-reflection and line/column rewrite
      - project parser-confirmed statement-only increment and decrement aliases onto exact CST tokens and rewrite them in the shared CST pass, replacing a second formatter-local AST reflection and line/column rewrite while preserving invalid expression uses
      - project unit-metadata declaration roles only inside impl blocks targeting parsed unit declarations and canonicalize their names from exact CST byte spans, replacing a separate parser run and rune-column rewrite while preserving ordinary impl members
      - project valid top-level test-name string roles onto exact CST tokens and normalize only their horizontal header trivia, replacing the formatter's per-line lexer while preserving exact string spelling and ordinary identifiers, calls, and strings
      - project opening-block roles from parser-owned ownership AvailabilityExpression if conditions and normalize only that concrete brace boundary, replacing blind line-text substitutions while preserving ordinary available/is/not identifiers and conditions
      - project operators and real grouping delimiters from parser-owned structural unit expressions onto exact CST tokens and compact only their horizontal trivia, replacing the formatter's angle-bracket line heuristic while preserving ordinary comparisons and arithmetic
      - retain the exact parameter-list opener on parsed function, lambda, and initializer nodes, project it into a CST role, and remove only its preceding horizontal trivia instead of scanning signature lines
      - project parser-confirmed commas between grouped let and typed declarators into CST roles and normalize only their horizontal separator trivia, replacing the formatter's grouped-let line scanner while leaving expression commas untouched
      - project parser-owned match payload and field delimiters, explicit field-binding colons, where guards, and match/try arrows onto exact CST tokens, replacing the formatter's match-arm line scanner while leaving recovered invalid arrows untouched
      - complete parser-owned match-pattern punctuation with CST roles for closing payload and field delimiters plus shallow-field commas, enforcing compact payload bindings and canonical single-line field padding without touching invalid recovered patterns
      - project separators and terminating colons from valid parser-owned switch case/default headers onto exact CST tokens and canonicalize their horizontal punctuation spacing without claiming recovered invalid clauses
      - use complete parent-child CST delimiter groups for the opt-in redundant nested-parentheses correction, removing the inner pair only when it is the outer pair's sole non-trivia content and preserving intervening comments
      - retain complete outer condition-parenthesis tokens on parsed if, while, and switch nodes and project them into an opt-in correction role only when they own the whole condition or subject and the following body is valid
      - format standalone multiline block and documentation comment tokens from the lossless CST into aligned-star form while retaining single-line and inline forms and shielding comment-owned delimiters from structural indentation
      - normalize the post-delimiter margin of lexer-owned line-comment tokens to `// text` or canonical empty `//` without reflowing comment prose or touching comment-like text in literals and block comments
    remaining:
      - add grammar-aware CST nodes and stable parser-owned source ranges above the new lexical delimiter hierarchy without duplicating AST semantics
      - attach parser missing-token and skipped-token recovery nodes to the concrete syntax model
      - replace the bespoke trimmed-line formatter pipeline with a CST-driven formatter whose structure, trivia ownership, safe regions, indentation, alignment, and comment placement decisions originate in internal/cst
      - migrate existing parser/AST/lexer-assisted formatter special cases onto grammar-aware CST roles instead of growing parallel source-analysis paths
      - support incremental and minimal-edit syntax-tree formatting
    verification:
      - command: go test ./internal/cst ./internal/formatter -count=1
        result: passed
  - id: tooling.formatter-delimiter-handoff
    area: tooling
    status: implemented
    integrated: "2026-08-12"
    summary: >-
      Preserves indentation when one continuation line closes a multiline call
      and aggregate literal while opening an attached try-handler block.
    rules:
      - rules/tooling/formatter.md
      - rules/foundations/grammar.md
      - rules/errors/errorhandling.md
    code:
      - internal/formatter/formatter.go
    tests:
      - internal/formatter/formatter_test.go
      - cmd/lsp/main_test.go
    implemented:
      - recognize closing-heavy delimiter handoff lines such as `}) {` without discarding the newly opened handler indentation level
      - indent try-handler arms beneath the attached handler block and restore the enclosing statement and function indentation after its closing brace
      - ignore interpolated-string braces while determining the last structural delimiter on the continuation line
      - verify formatting idempotence for a multiline typed struct literal passed to a fallible method under try
    verification:
      - command: go test ./internal/formatter -run TestFormatTryHandlerAfterStructLiteralCallArgument -v
        result: passed
      - command: go test ./cmd/lsp -run 'Format|Formatting' -v
        result: passed
  - id: tooling.formatter-single-line-call-spacing
    area: tooling
    status: implemented
    integrated: "2026-08-24"
    summary: >-
      Normalizes whitespace and trailing commas in calls already written on one
      physical line while preserving intentional multiline call layout.
    rules:
      - rules/tooling/formatter.md
    code:
      - internal/formatter/formatter.go
    tests:
      - internal/formatter/formatter_test.go
      - cmd/lsp/main_test.go
    implemented:
      - join single-line call arguments with one space after commas
      - remove a trailing argument comma only from single-line calls
      - preserve all existing multiline call boundaries and their required trailing comma
      - leave comment-bearing and incomplete single-line syntax unchanged
      - preserve formatter idempotence and expose the behavior through the shared LSP formatter
    verification:
      - command: go test ./internal/formatter ./cmd/lsp -run 'Format|Formatting' -count=1
        result: passed
  - id: tooling.formatter-single-line-delimiter-spacing
    area: tooling
    status: implemented
    integrated: "2026-09-03"
    summary: >-
      Normalizes boundary trivia inside balanced parentheses, brackets, and
      braces that stay on one physical line while preserving intentional
      multiline delimiter layout for the future lossless CST formatter.
    rules:
      - rules/tooling/formatter.md
    code:
      - internal/formatter/formatter.go
    tests:
      - internal/formatter/formatter_test.go
      - cmd/lsp/main_test.go
    implemented:
      - remove inner boundary padding from same-line parenthesized and bracketed groups
      - normalize top-level comma spacing and remove trailing commas in same-line parenthesized and bracketed groups
      - retain one inner space for non-empty same-line braced groups and compact whitespace-only groups to `{}`
      - preserve quoted contents, comment-bearing lines, incomplete syntax, and every multiline delimiter boundary
      - expose identical behavior through sec fmt and the shared LSP formatter
    verification:
      - command: go test ./internal/formatter ./cmd/lsp -run 'Delimiter|SameLineMatchBlock' -count=1
        result: passed
  - id: tooling.formatter-declaration-comment-alignment
    area: tooling
    status: implemented
    integrated: "2026-08-27"
    revised: "2026-09-13"
    summary: >-
      Aligns trailing line comments within local nominal-declaration groups and
      exposes the shared behavior through both LSP formatting and the initial
      in-place sec fmt command.
    rules:
      - rules/tooling/formatter.md
    code:
      - internal/formatter/formatter.go
      - cmd/compiler/main.go
      - cmd/lsp/main.go
    tests:
      - internal/formatter/formatter_test.go
      - cmd/compiler/main_test.go
      - cmd/lsp/main_test.go
    implemented:
      - align trailing comments in consecutive struct, enum, register, union, and equivalent nominal declaration items to one visual column
      - place the aligned comment column at least four spaces after the widest code item in its local group
      - end groups at blank lines, standalone or documentation comments, multiline items, and nested block boundaries
      - ignore comment-like text inside quoted strings, character literals, and struct tags while locating trailing line comments
      - preserve LF or CRLF, comment text, indentation, and formatter idempotence through the shared formatter package
      - provide in-place sec fmt formatting for one or more explicit source files with atomic replacement and permission preservation
      - expose identical output through LSP document formatting without editor-side alignment logic
    remaining:
      - extend the generic alignment engine to typed declaration groups, struct field/type/tag columns, and compatible non-nominal declaration groups
      - complete sec fmt recursive project, range, on-type, minimal-edit, and fix modes; check and stdin modes are tracked by tooling.formatter-check-explicit-files and tooling.formatter-stdin
      - migrate the remaining trimmed-line indentation and alignment decisions to the parser-owned lossless comment/trivia attachments now returned by the shared formatter
    verification:
      - command: go test ./internal/formatter ./cmd/compiler ./cmd/lsp -run 'TrailingComment|AlignsDeclaration|RunFmtCommand' -count=1
        result: passed
  - id: tooling.formatter-check-explicit-files
    area: tooling
    status: implemented
    integrated: "2026-09-09"
    summary: >-
      Adds sec fmt --check for explicit source files using the same formatter
      as in-place formatting and LSP document formatting.
    rules:
      - rules/tooling/formatter.md
    code:
      - cmd/compiler/main.go
    tests:
      - cmd/compiler/fmt_check_test.go
      - testdata/formatter/check_canonical.sec
      - testdata/formatter/check_noncanonical.sec
    implemented:
      - return exit code 0 silently when every selected file matches the current shared formatter output
      - report all noncanonical files with format.noncanonical-source and exit code 1 without labeling differences as language errors
      - preserve file bytes, line endings, identity, permissions, and modification times in check mode
      - accept --check before or after file paths and -- to terminate option parsing
      - reject unsupported options before formatting any files and return exit code 1 for input errors
      - verify that ordinary in-place formatting makes a subsequent check pass
      - report byte-preserved lexically malformed or delimiter-incomplete files with format.malformed-source instead of falsely accepting unchanged uncertain source as canonical
    remaining:
      - directory and project selection and --fix remain outside this explicit-file integration; --stdin is tracked by tooling.formatter-stdin
      - canonical-style coverage remains limited to the current shared formatter implementation
    verification:
      - command: go test ./cmd/compiler ./internal/formatter -count=1
        result: passed, including subprocess checks of real CLI exit codes and diagnostics
  - id: tooling.formatter-stdin
    area: tooling
    status: implemented
    integrated: "2026-09-09"
    summary: >-
      Adds sec fmt --stdin using the shared formatter, emitting formatted source
      with LF line endings on standard output.
    rules:
      - rules/tooling/formatter.md
    code:
      - cmd/compiler/main.go
    tests:
      - cmd/compiler/fmt_stdin_test.go
      - cmd/compiler/fmt_check_test.go
      - testdata/formatter/check_canonical.sec
      - testdata/formatter/check_noncanonical.sec
    implemented:
      - format standard input without requiring or modifying source files
      - normalize LF, CRLF, CR, and mixed input line endings to LF
      - preserve empty input and produce idempotent output through the shared formatter
      - propagate read errors, write errors, and short writes; CLI failures exit with code 1 and diagnostics on standard error
      - reject combinations with --check or file paths and reject unsupported options before processing input
      - verify CLI standard output and standard error separately through subprocess tests
    remaining:
      - canonical-style coverage remains limited to the current shared formatter implementation
    verification:
      - command: go test ./cmd/compiler ./internal/formatter -count=1
        result: passed, including stdin CLI and I/O failure tests
  - id: tooling.formatter-v2
    area: tooling
    status: partial
    integrated: "2026-09-23"
    revised: "2026-09-25"
    document_revision: "2.0"
    repository_baseline: main-reviewed-2026-09-23
    summary: >-
      Tracks conformance of the shared Sec formatter to formatter revision 2.0.
      The repository has a usable but primarily bespoke, line-oriented CLI/LSP
      formatter plus a lexical CST foundation that is not yet its primary
      engine. The formatter must migrate to a CST-driven architecture while
      preserving existing behavior, then complete the configured,
      grammar-aware formatting and correction contract.
    rules:
      - rules/tooling/formatter.md
      - rules/foundations/lexical_structure.md
      - rules/compiler/parser_recovery.md
      - rules/tooling/lsp.md
      - rules/tooling/testing.md
    related_integrations:
      - tooling.cst-lexical-foundation
      - tooling.formatter-delimiter-handoff
      - tooling.formatter-single-line-call-spacing
      - tooling.formatter-single-line-delimiter-spacing
      - tooling.formatter-declaration-comment-alignment
      - tooling.formatter-check-explicit-files
      - tooling.formatter-stdin
    code:
      - internal/ast/ast.go
      - internal/parser/parser.go
      - internal/parser/expression.go
      - internal/cst/document.go
      - internal/cst/groups.go
      - internal/cst/roles.go
      - internal/formatter/formatter.go
      - internal/formatter/cst_spacing.go
      - internal/formatter/corrections.go
      - internal/formatter/block_comments.go
      - internal/formatter/line_comments.go
      - cmd/compiler/main.go
      - cmd/lsp/main.go
    tests:
      - internal/cst/document_test.go
      - internal/cst/groups_test.go
      - internal/cst/roles_test.go
      - internal/formatter/formatter_test.go
      - cmd/compiler/main_test.go
      - cmd/compiler/fmt_check_test.go
      - cmd/compiler/fmt_stdin_test.go
      - cmd/lsp/main_test.go
    implemented:
      - >-
        One shared formatter implementation serves sec fmt and LSP document
        formatting; LSP does not maintain an independent formatting grammar.
      - >-
        The lexer-backed CST foundation preserves source-ordered tokens,
        trivia, invalid tokens, byte ranges, delimiter groups, incomplete
        groups, and exact source round trips for its implemented lexical scope.
      - >-
        Current canonical slices cover structural indentation, selected
        delimiter and call spacing, multiline try-handler handoff, top-level
        test declarations, ownership spellings, registers, units, assertions,
        panic, matches, and local declaration-comment alignment.
      - >-
        sec fmt supports explicit in-place files, --check for explicit files,
        and --stdin; these paths reuse the shared formatter and have focused
        idempotence and CLI/LSP behavior tests.
      - >-
        The foreign `func` declaration correction is now gated behind the
        formatter's explicit fix option; ordinary CLI/LSP formatting preserves
        that token. Other selected historical rewrites such as statement i++
        still predate the revision-2.0 correction boundary and remain to be
        separated.
      - >-
        Redundant directly nested parentheses now use complete CST delimiter
        parentage in the opt-in correction layer. The inner pair is removed
        only when it is the outer pair's sole non-trivia content, so `(())`
        becomes `()` and `Call((value))` becomes `Call(value)` without removing
        call delimiters; ordinary formatting and comment-separated groups are
        preserved.
      - >-
        Parser-confirmed `if`, `while`, and `switch` nodes now retain complete
        outer condition-parenthesis tokens and project them into a dedicated
        CST correction role. With fixes enabled, `if (ready)` becomes
        `if ready`; parentheses that group only part of a larger condition,
        failed headers, and ordinary formatting remain unchanged.
      - >-
        The first CST-driven language-surface slice projects parser-owned
        generic-constraint conjunction roles onto exact concrete tokens and
        formats their horizontal trivia from CST byte spans while preserving
        ordinary bitwise operators and uncertain recovered syntax.
      - >-
        Contextual matrix-multiplication x now uses the same parser-owned CST
        role and spacing pass, replacing its formatter-local AST reflection and
        physical-line rewrite while preserving ordinary x identifiers.
      - >-
        Parser-confirmed statement-only ++ and -- aliases now use a CST role in
        the same shared pass, replacing their formatter-local AST reflection
        and physical-line rewrite while invalid expression uses remain
        untouched; correction configuration remains separately incomplete.
      - >-
        Unit metadata names now use parser-scoped CST roles and exact concrete
        byte spans in the shared pass, replacing a separate formatter parse and
        rune-column rewrite while same-spelled ordinary impl members remain
        untouched.
      - >-
        Valid top-level test declaration names now use parser-scoped CST roles
        and exact string-token spans in the shared pass, replacing a per-line
        lexer while preserving test-name bytes and ordinary test identifiers,
        calls, and strings.
      - >-
        Ownership availability if blocks now use parser-scoped CST roles on
        their exact opening braces, replacing blind line-text substitutions
        while ordinary available, is, and not identifiers and conditions remain
        outside the formatting role.
      - >-
        Parser-confirmed structural unit expressions now project their
        multiplication, division, exponent, and real grouping-delimiter tokens
        into CST roles. Compact unit spacing uses those exact spans, replacing
        the formatter's angle-bracket line scanner while ordinary comparison
        and arithmetic tokens remain outside the role.
      - >-
        Function, lambda, and initializer parameter lists now retain their
        exact opening token as a parser fact and project it into a CST role.
        Callable spacing no longer uses the formatter's separate signature-line
        scanners, while ordinary call parentheses remain outside the role.
      - >-
        Grouped let and typed declarations now project only their
        parser-confirmed declarator commas into CST roles. Separator spacing is
        normalized from exact token spans, replacing the grouped-let line
        scanner while commas nested in initializer expressions remain ordinary
        expression syntax.
      - >-
        Match patterns now project parser-owned payload and field delimiters,
        explicit field-binding colons, where guards, and match/try arrows onto
        exact CST tokens. The shared spacing pass replaces the former
        match-arm line scanner, remains idempotent, and does not claim arrows
        from invalid arms retained through parser recovery.
      - >-
        Parser-confirmed match patterns now also project their closing payload
        and shallow-field delimiters and commas between shallow fields. The CST
        pass emits compact `Some(value)` payloads and canonical
        `Point { X: x, Y: y }` spacing while invalid recovered patterns remain
        outside these roles.
      - >-
        Valid switch case and default headers now retain their terminating
        colon as a parser fact and project it, together with commas between
        case alternatives, onto exact CST tokens. The shared spacing pass
        emits `case 1, 2:` punctuation without assigning formatting roles to
        incomplete clauses retained through parser recovery.
      - >-
        Standalone multiline block comments and documentation comments now use
        lossless CST comment-token spans to produce the §12 aligned-star form,
        retain surrounding indentation and paragraph boundaries, and keep
        comment-contained delimiters from changing executable indentation.
        Single-line and inline block comments remain unchanged; nested
        multiline normalization remains outside this first slice.
      - >-
        Lexer-owned line comments now receive the canonical §12 delimiter
        margin: non-empty comments use `// text`, empty comments use `//`, and
        internal prose spacing is not reflowed. Comment-like text inside
        strings, raw strings, and block comments remains untouched; `///`
        follows its Sec 0.1 status as an ordinary line comment.
      - >-
        Ordinary formatting now preserves complete source bytes when the
        lossless CST proves lexical errors, unmatched real closers, or
        incomplete real delimiter groups. The shared result exposes this state
        so sec fmt --check reports format.malformed-source rather than treating
        unchanged uncertain input as canonical; LSP returns the same bytes.
    remaining:
      - >-
        formatter-cst-engine-migration: Replace the current bespoke,
        trimmed-line transformation pipeline with internal/cst as the primary
        formatter source model and decision engine. Existing behavior must move
        incrementally behind CST-owned grammatical roles and trivia rather than
        accumulating new line scanners or parallel parser/lexer rescans.
      - >-
        formatter-lossless-syntax: Complete parser-owned lossless and
        error-tolerant syntax, recovery-node attachment, trivia ownership, and
        exact malformed-region preservation required by § 5 and § 25.
      - >-
        formatter-canonical-layout: Replace remaining trimmed-line heuristics
        with structural formatting and implement the complete § 3 and
        § 6–§ 12 canonical layout contract.
      - >-
        formatter-project-configuration: Implement project-owned
        format_version = 1 configuration, structured/compact vertical style,
        indentation widths, fixed/adaptive width, and alignment limits from § 4.
      - >-
        formatter-imports-and-file-layout: Implement canonical import gathering,
        classification, comment attachment, sorting, grouping, and top-level
        file layout from § 13–§ 14 without reordering ordinary declarations.
      - >-
        formatter-language-surface: Complete canonical formatting and focused
        conformance coverage for every current Sec construct in § 15–§ 24.
      - >-
        formatter-language-corrections: Continue separating historical rewrite
        behavior from ordinary formatting, replace the remaining line-oriented
        recognizers with a grammar-aware correction engine, expose canonical
        project configuration, and complete the § 26–§ 27 catalogue.
      - >-
        formatter-cli-lsp-unification: Add project configuration, effective
        width, format-on-save, range/on-type/minimal-edit, recursive project,
        and exact-output equivalence behavior required by § 28.
      - >-
        formatter-invariants-and-tests: Enforce every § 29 and § 31 invariant
        and complete the § 30 golden, second-pass, round-trip, malformed-source,
        width-boundary, configuration-matrix, correction, and CLI/LSP suites.

    obligations:
      - id: formatter-lossless-syntax
        status: partial
        rules:
          - "§ 5(1)"
          - "§ 5(2)"
          - "§ 5(3)"
          - "§ 5(4)"
          - "§ 5(5)"
          - "§ 5(6)"
          - "§ 5(8)"
          - "§ 25(1)"
          - "§ 25(2)"
          - "§ 25(3)"
          - "§ 25(4)"
          - "§ 25(5)"
          - "§ 25(6)"
          - "§ 25(7)"
        requirement: >-
          Provide one shared lexer/parser syntax authority that produces the
          lossless, error-tolerant CST used by the formatter.
          Preserve exact token lexemes, whitespace trivia, comments,
          source-sensitive string text, exact source ranges, and explicit
          uncertain/error regions. AST and CST may be parallel products of the
          same parser logic; no formatter-only grammar is permitted.
        acceptance:
          - Reconstruct all formatter-owned and formatter-preserved source bytes.
          - Format valid syntax surrounding an uncertain region without altering the uncertain region.
          - Preserve every uncertain/error region byte-for-byte.
          - Never synthesize missing source tokens as an ordinary formatting action.
          - Keep ordinary formatting independent of semantic analysis.

      - id: formatter-cst-engine-migration
        status: partial
        rules:
          - "§ 5(1)"
          - "§ 5(2)"
          - "§ 5(3)"
          - "§ 5(4)"
          - "§ 5(5)"
          - "§ 25(1)"
          - "§ 25(2)"
          - "§ 25(3)"
          - "§ 25(5)"
          - "§ 25(7)"
        requirement: >-
          Migrate the shared formatter from its current bespoke, line-oriented
          implementation to a CST-based engine. internal/cst is the primary
          source of grammatical structure, exact tokens, trivia ownership,
          safe formatting regions, and preservation boundaries. The AST may
          remain a parallel compiler product, but it is not the formatter's
          source of truth and must not compensate for missing CST structure
          through an expanding collection of formatter-specific rescans.
        acceptance:
          - The formatter entry point builds or receives one lossless, error-tolerant CST and formats from that representation.
          - Structural indentation, spacing, wrapping, alignment, and comment placement decisions use CST nodes and owned trivia rather than trimmed physical lines.
          - Existing line scanners and parser/lexer-assisted special cases are removed as their CST replacements become available.
          - New language-surface formatting is implemented by extending shared CST/parser roles, not by adding a formatter-only grammar.
          - CLI and LSP continue to use the same formatter and retain byte-identical output throughout the migration.
          - Focused migration tests preserve idempotence, valid syntax meaning, exact literals/comments, and malformed-region bytes.

      - id: formatter-canonical-layout
        status: partial
        rules:
          - "§ 3(1)"
          - "§ 3(2)"
          - "§ 3(5)"
          - "§ 3(6)"
          - "§ 3(7)"
          - "§ 6"
          - "§ 7"
          - "§ 8"
          - "§ 9"
          - "§ 10"
          - "§ 11"
          - "§ 12"
        requirement: >-
          Implement the canonical revision-2.0 layout engine, including
          idempotence, clean single-line/multiline preservation, structured
          indentation, vertical style, executable-block layout, structural
          alignment, preferred-width behavior, delimiter/trailing-comma rules,
          and comment formatting.
        acceptance:
          - Canonical output is idempotent.
          - Mixed or half-formatted layouts normalize deterministically.
          - Clean permitted multiline layouts are not collapsed merely because width increases.
          - Width breaks syntax rather than literal data.
          - Alignment padding respects the configured maximum.

      - id: formatter-project-configuration
        status: planned
        rules:
          - "§ 4(1)"
          - "§ 4(2)"
          - "§ 4(3)"
          - "§ 4(4)"
          - "§ 4(5)"
          - "§ 4(8)"
          - "§ 4(9)"
          - "§ 4(10)"
          - "§ 4(11)"
          - "§ 4(12)"
          - "§ 4(14)"
          - "§ 4(15)"
          - "§ 4(16)"
          - "§ 4(17)"
        requirement: >-
          Implement project-owned formatter configuration and the
          `format_version` contract. The initial style version is 1. Support
          structured/compact vertical style, indentation widths 2/4/6, fixed
          width, adaptive width clamped to 80..200 with fallback 120, and the
          normative alignment-padding rule. Language Corrections remain
          disabled by default.
        acceptance:
          - Existing `format_version = 1` output does not intentionally drift between formatter implementation releases.
          - Personal editor preferences do not silently change canonical project source bytes.
          - Fixed and adaptive width modes produce deterministic output for a known effective width.

      - id: formatter-imports-and-file-layout
        status: planned
        rules:
          - "§ 13"
          - "§ 14"
          - "§ 29(7)"
        requirement: >-
