  sec_version: '0.1'
  repository: https://github.com/YoePro/sec
  branch: main
  review_date: '2026-10-16'
  sha: unverified-current-main; implementer records git rev-parse HEAD
  semantic_ir_version: 1 (no bump)
  dialect_schema_predecessor: 19
  dialect_schema_target: 20
  lowering_spec_target: 20
  prerequisite_states:
    P1-P14: implemented (user-confirmed)
    P15: implementation in progress (last user report)
    P16-P17: corrected plans (last user report)
