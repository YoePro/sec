rulebook: rules/memory/transferability.md
document_revision: '2.0'
status_kind: delta-only
reviewed_date: '2026-09-02'
repository_baseline:
  commit: 814a584
  note: latest publicly verifiable main commit at generation time; user reported a newer commit that had not yet appeared
    in the GitHub commit index
baseline_confirmed:
- The existing transferability.md already defines task, physical-thread, process, interrupt and foreign-callback boundaries.
- The existing rulebook already treats transferability as recursively derived over the complete value graph and names TaskTransferable,
  ThreadTransferable, ProcessTransferable, ISRTransferable and ThreadSafeShared as compiler semantic capabilities rather than
  necessarily user-written interfaces.
- The existing rulebook already separates exclusive ownership transfer from simultaneous sharing, forbids ordinary MutexGuard
  transfer, makes thread-local references thread-bound, derives closure transferability from captures, and treats RawPtr/FFI
  handles conservatively.
- The existing rulebook already requires explicit process adapters and ISR-safe handoff mechanisms.
- The existing final synchronization list contains stale paths such as borrowing.txt, raw_pointers.txt, destruction.txt and
  concurrency_memory_model.txt; v2 removes the stale synchronization checklist and references canonical rulebook ownership
  instead.
normative_changes_in_v2:
- clarifies that transferability is a proof for a specific value, boundary and execution policy rather than one universal
  property of a nominal type
- separates exclusive transfer from ThreadSafeShared shareability throughout the rulebook
- makes task migration/pinning an explicit input to transferability so thread-bound state cannot silently cross migration-capable
  await/scheduling points
- makes ProcessTransferable explicitly adapter/representation dependent instead of implying raw in-memory representation transfer
- makes ISRTransferable direction- and operation-sensitive and integrates ownership handoff plus noPanic/noAlloc/noBlock/bounded-work
  requirements
- integrates v2 ownership availability, partial/conditional ownership, borrowing live ranges, lifetime analysis, raw pointers,
  allocation domains and destruction context
- removes stale cross-reference checklist and embeds no implementation status in the normative book
