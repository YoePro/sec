  - id: frontend.type-contracts-v2
    area: frontend-types-analysis-and-lowering
    status: partial
    updated: '2026-09-22'
    audited: '2026-09-22'
    repository_baseline: c515862
    document_revision: inferred 2.0
    document_revision_note: rules/types/contracts.md has no explicit revision metadata. Repository history places
      the canonical rewrite on 2026-08-12 to 2026-08-13, inside the revision-2 rulebook period. Later specialized
      rulebooks take precedence on conflicts.
