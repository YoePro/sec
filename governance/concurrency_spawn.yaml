      - command: go vet -p 4 ./internal/parser ./internal/formatter ./internal/sema ./cmd/compiler ./cmd/lsp
        result: passed on 2026-11-09
      - command: go test -p 4 ./internal/formatter ./internal/sema -count=1
        result: passed on 2026-11-09; formatter 1.749s, Sema 17.716s
      - command: go test -short -p 4 ./internal/parser -count=1
        result: passed on 2026-11-09 (24.154s), including the bounded mutation/recovery corpus; the unrestricted mutation run was manually stopped after 86.841s while actively checking its corpus, with no failure observed before interruption
      - command: go test -p 4 ./internal/parser ./internal/formatter ./internal/sema ./cmd/compiler ./cmd/lsp -run "TestSpawnGrammar|TestSpawnMissing|TestParseSpawn|TestFormatSpawn|TestSpawnBlock" -count=1
        result: passed on 2026-11-09; eight grammar forms, contextual identifiers, missing-operand recovery, formatting golden/idempotence, block capability boundaries and CLI/LSP diagnostic parity
      - command: go run ./cmd/yamlstatus check; go run ./cmd/yamlstatus -paths -file concurrency_spawn.yaml
        result: passed on 2026-11-09 after spawn.md revision 2.0 was applied from spawn-normative-fix-20261109; no compiler tests run
    revised: "2026-11-09"
