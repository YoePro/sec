schema_version: 1
updated: "2026-10-28"
purpose: >-
  Tracks normative decisions that are missing or insufficiently precise and
  therefore constrain implementation. Remove an entry only after the owning
  rulebook records the decision and affected governance has been synchronized.

classification_scale:
  blocking: The named implementation cannot proceed without inventing language semantics.
  constraining: Related work can continue, but conformance or migration behavior cannot be completed consistently.
  localized: The gap blocks a narrow optional feature without destabilizing adjacent language behavior.

decisions:
  - id: MD-010
    area: regular-expressions
    rulebooks:
      - rules/types/contracts.md
      - "dedicated regex rulebook (not yet written)"
    description: >-
      Transferred to a dedicated regex rulebook (rules/corrections/applied/missing-decisions-md010-md014-correction-20261003.md § 2). Regular
      expressions are useful outside type contracts, so Sec needs one regex
      language that the `regex` contract reuses; contracts.md must never define
      a contract-private regex grammar. The dedicated rulebook must decide the
      pattern syntax, escape interpretation over decoded Sec strings, Unicode
      matching semantics and unit, anchoring, whole-value validation versus
      search, character classes and Unicode properties, flags, captures,
      unsupported constructs, complexity guarantees, compiled-pattern
      semantics, invalid-pattern diagnostics, runtime regex APIs,
      search/find/split/replacement behavior, and contract integration. The
      recorded non-normative design directions (Sec-owned dialect,
      decoded-string patterns, whole-value contract validation, Unicode
      scalars, no implicit normalization, non-exponential complexity without
      backreferences, compile-time pattern and default validation, string-only
      application through a named-type chain) are referenced at
      rules/design/regex-design-notes-20261003.md, which is not present in the
      repository. Until the rulebook is accepted, Sema evaluates the pattern
      in a SemanticCompileTimeRequiredContext (MD-011), retains it, and rejects
      every regex contract with S1058.
    classification: constraining
    status: open
  - id: MD-016
    area: compiler-known-declarations
    rulebooks:
      - rules/compiler/compiler_known_members.md
      - rules/library/core-library.md
      - rules/collections/shaped-types.md
      - rules/corrections/applied/compiler-known-fundamentals-cross-rulebook-correction-20260907.md
    description: >-
      Correction § 21 requires every rulebook that names a compiler-known Sec
      type or member only by name, prose shape, or partial pseudodeclaration
      to choose exactly one: (A) a real Sec declaration with its complete
      canonical declaration and owning module, or (B) compiler-semantic only
      with a complete structural contract. § 21(4) explicitly does not invent
      the missing declarations. Each affected rulebook (shaped, storage, and
      compiler-known metadata in particular) needs that A/B decision; the
      implementation registry already classifies member authority (§ 6) but
      cannot choose a declaration form on the rulebooks' behalf.
      Part 1 applied 2026-10-18
      (rules/corrections/applied/md016-shaped-metadata-declarations-correction-20261018.md):
      Shape[Rank], Strides[Rank], TensorLayout[Rank], Axes[Rank],
      AxisList[Count] and the closed nine-variant ShapeError now have exact
      declarations in shaped-types.md §§ 4.1, 6.0, 7.1, 15.3, 29.3 and
      compiler_known_members.md. Shaped portion applied 2026-10-21
      (rules/corrections/applied/md016-shaped-public-surface-closure-20261021.md):
      shaped families, init overloads, static ToShape, MemorySpace identity,
      StorageRequest/ShapedStorageRequest, StorageError and the ShapeError
      error union are decided and in shaped-types.md, storage.md and
      compiler_known_members.md. Still open (closure § 18): the independent
      A/B audit of the non-shaped compiler-known declarations
      (Ptr/SizeOf/Len/IsEmpty/len, ToString and text conversions, numeric
      associated properties, collection members, RawPtr, Arena/allocation
      members, Iterator/Next).
    classification: constraining
    status: open
  - id: MD-018
    area: union-recursion-indirection
    rulebooks:
      - rules/declarations/unions.md
      - rules/memory/layout.md
      - rules/memory/destruction.md
    description: >-
      unions.md §18 shows `next: Box[List[T]]` as recursion "through a valid
      finite indirection", but no rulebook defines `Box`. The only `Box`
      elsewhere (destruction.md § 28) is an ordinary user struct
      `Box[T] struct { value: T }`, which stores T by value; under layout.md
      § 25(5) that makes `List[T]` infinite. The implementation therefore
      treats a source-declared `Box` as by-value and rejects the example, and
      the test fixture testdata/union_valid.sec was changed to the dynamic
      storage boundary `List[T][]`. Decisions needed: whether Sec has a
      compiler-known or library owning heap indirection (`Box[T]` or another
      name), what it is called, which module owns it, and whether the
      unions.md example should use it or an existing boundary.
    classification: constraining
    status: open
  - id: MD-019
    area: explicit-layout-syntax
    rulebooks:
      - rules/memory/layout.md
      - rules/memory/arena.md
      - rules/memory/allocation.md
      - rules/platform/ffi.md
      - rules/analysis/parameter_usage_analysis.md
    description: >-
      layout.md § 4.3 defines explicit layout contracts, § 8(5) rejects
      alignment requests stricter than the target supports, and arena.md
      § 17(5) makes statically impossible alignment a compile-time error. But
      layout.md § 1(12) explicitly does not introduce syntax for packing,
      alignment, offsets, endianness, or explicit representation, and no other
      rulebook defines it. As a result, no source program can request a
      non-native alignment, and the § 8(5), § 4.3(3), and arena § 17(5)
      diagnostics cannot be implemented. Decisions needed: the syntax (an
      attribute, a type contract, or something else) for explicit alignment,
      packing, field offsets, endianness, and representation, and which
      rulebook owns it. Parameter-usage analysis likewise cannot produce
      source-declared alignment, packing, endian or representation blockers
      until these contracts have a normative source form and canonical
      resolved facts; it must preserve currently represented constraints and
      withhold incompatible advice rather than invent annotations.
      The alignment/layout portion of tooling.allocation mentor diagnostics
      in governance/allocation.yaml is blocked by the same missing syntax
      and resolved facts; it cannot be completed by inventing attributes.
      Static capacity and ISR diagnostics have separate implementation
      dependencies in analysis.allocation and sema.isr-analysis.
    classification: blocking
    status: open
  - id: MD-021
    area: c-binding-environment
    rulebooks:
      - rules/platform/ffi.md
      - rules/platform/abi.md
      - rules/platform/target_profiles.md
    description: >-
      PARTLY DECIDED 2026-10-08 by rules/corrections/applied/md020-md021-md023-md024-ffi-c-bindings-null-correction-20261008.md § 3 and integrated into
      rules/platform/ffi.md § 6, rules/platform/target_profiles.md § 11 and
      rules/projects/modules.md § 12: the compiler owns the fundamental c:: family
      and ABI checks; platform bindings (normally sec/platform) supply target C
      binding types, which the CompilationPlan makes available under c:: without
      an import, failing closed with no host fallback; third-party C libraries are
      ordinary imported binding modules with link metadata. STILL OPEN (correction
      § 3.7, § 8.2): the source or metadata serialization of the target-provided
      binding declarations and the mechanism that selects one environment for a
      CompilationPlan; this belongs to the target, platform and build rulebooks and
      must not be invented. Original question:
      ffi.md § 6 says c:: binding types (c::stddef::size_t,
      c::time::time_t, c::stdarg::va_list, c::posix::socklen_t) are
      "supplied by the selected target/library binding environment", and
      § 52 requires Sema to resolve them through that environment. No
      rulebook defines what the environment is, where its declarations live
      (Sec source under sec/platform, compiler-known tables, or package
      metadata), which namespaces and names exist per target, or how a
      library selects or extends them. The parser accepts
      c::namespace::name, and Sema reports S1078
      ffi.unresolved-c-binding-type for every c:: name. Decisions needed:
      the binding environment's form, ownership, per-target contents, and
      selection mechanism.
    classification: blocking
    status: open
  - id: MD-026
    area: stdlib-io-root
    rulebooks:
      - sec/stdlib/io/std-io.md
      - rules/declarations/interfaces.md
      - rules/memory/copy_move.md
      - rules/foundations/language_philosophy.md
    description: >-
      Implementing the root io package from std-io.md leaves five points open.
      (1) The transfer helpers take `ref mut Reader` and `ref mut Writer`, and
      copy_move.md § 21(5) acknowledges borrowed interface references, but no
      rulebook defines converting `ref mut File` (a type that explicitly
      implements Reader) to `ref mut Reader` at a call site, nor how such a
      call dispatches; language_philosophy.md § 10 warns against unexpected
      dynamic dispatch and generics.md forbids runtime generic dispatch. Sema
      rejects the call today, so the helpers type-check but cannot be called
      with concrete types. A generic form such as
      `fn Copy[W: Writer, R: Reader](destination: ref mut W, source: ref mut R)`
      would be statically dispatched instead. (2) WriteAll must detect
      "repeated" zero progress (§§ 7.3, 8.6) but no count is given; the
      implementation reports NoProgress after two consecutive Ok(0) results.
      (3) ReadAll returns Result[byte[], IOError], but IOError has no
      allocation-failure variant; Append failure is currently mapped to
      NativeFailure. (4) Whether the helpers retry on IOError.Interrupted (the
      legacy File API does) is unspecified; they propagate it. (5) How the
      helpers treat a Reader or Writer that violates its contract by returning
      a count larger than the buffer is unspecified. Decisions needed:
      interface-reference conversion and dispatch (or generic signatures), the
      zero-progress count, ReadAll's allocation error, Interrupted retry, and
      contract-violation handling.
    classification: constraining
    status: open
  - id: MD-029
    area: error-patterns
    rulebooks:
      - rules/foundations/grammar.md
      - rules/errors/errorhandling.md
      - rules/control-flow/flowcontrol_match.md
    description: >-
      grammar.md uses `ErrPattern` in TryPattern but never defines it. The
      implementation accepts Err(_), Err(name), and Err(Enum.Variant) (plus
      Err(Concrete.Variant) narrowing on an open error channel). Union error
      types with payload variants, such as `type DetailedError union error {
      OpenError { Path: string } ... }`, therefore cannot be handled per
      variant in try handlers: Err(DetailedError.OpenError(info)) is a nested
      pattern, which match forbids outside open-error narrowing. Decide the
      ErrPattern production, whether payload-variant patterns of union errors
      are allowed in try handlers and match arms, and their binding forms, so
      handler reachability for union payload patterns can be implemented.
      Decided 2026-10-28 (owner; rules/corrections/md029-md042-md102-pattern-
      reachability-some-correction-20261028.md §§ 2-7, 20(1)): try handlers
      and Result match arms share one ErrPattern (grammar.md "Try
      expression"); a concrete union-error variant may bind its single
      payload (Err(FileError.NotFound(info))) or shallow fields
      (Err(FileError.NotFound { Path: path })), one level deep; a bare
      variant matches a payload-bearing variant with a configurable
      Information diagnostic, suppressed only by explicit `{}`/`(_)`; open
      `error` narrowing tests identity, then variant, then payload; the
      contextual Err(.Variant...) form is valid only with one unambiguous
      closed concrete error type and is activated in Sec 0.1.2 (owner choice
      2026-10-28); empty field patterns are formatted `{}`.
      Synchronized: grammar.md, errorhandling.md rev 2.3 §§ 15.3, 20, 27.2b,
      37.5; flowcontrol_match.md rev 2.2 §§ 8, 28; unions.md rev 2.1 § 9.2a;
      diagnostics.md § 24(4e); semantic_ir.md § 71(6); formatter.md
      § 20(11); lsp.md. Implementation pending (baseline 2026-10-28: payload
      and field Err patterns are S1095, bare payload variants S1152,
      Err(.X) a parse error); tracked in governance frontend.errorhandling-v2.
    classification: constraining
    status: decided-implementation-pending

  - id: MD-031
    area: sec-mlir-try-handler-metadata
    rulebooks:
      - rules/errors/errorhandling.md
      - rules/mlir/dialect-versions/sec_mlir_dialect_v16.md
    description: >-
      Semantic IR now lowers guarded try handlers (guard-false continuation)
      and partial handler plans with residual propagation, but the Sec MLIR
      dialect schema only defines the handler kinds ok, err-variant,
      err-catch-all, and merge. Decide how the dialect represents guarded
      handlers and residual propagation (new handler kinds, attributes, or
      explicit CFG), so the emitter can stop rejecting these plans.
      Since 2026-10-12 Semantic IR also lowers try over Option[T] with None
      handlers (handler kind none, distinct from Err handlers per
      errorhandling.md §35); the same decision must cover how the dialect
      represents an Option None handler.
    classification: localized
    status: open

  - id: MD-034
    area: allocation-profile-of-freestanding-targets
    rulebooks:
      - rules/memory/allocation.md
      - rules/platform/platform_model.md
    description: >-
      allocation.md § 22 names the allocation profiles hosted, embedded-arena,
      and noalloc, but the registered bare-metal targets use the target
      profile "freestanding", and no rule maps it to an allocation profile or
      says which allocation context, if any, a freestanding target provides.
      Runtime string materialization (MD-004) and other allocating operations
      therefore treat freestanding targets as providing no positive
      allocation context and are rejected there. Decide the allocation
      profile of freestanding targets, or how a freestanding project selects
      embedded-arena or noalloc. Canonical allocation capability facts now
      preserve freestanding availability, activation and context provider as
      unresolved; S1098 reports this missing positive context without claiming
      the target physically lacks an allocator. Full profile-family resolution
      remains owned by platform.target-profiles.
    classification: constraining
    status: open


  - id: MD-039
    area: compound-string-append-failure-policy
    rulebooks:
      - rules/foundations/operators.md
      - rules/memory/allocation.md
    description: >-
      MD-004 made runtime string concatenation and interpolation fallible
      materializations that require try with StringError, and the 2026-10-03
      decision lets a Result[string, StringError] operand join a `+`
      concatenation under that single try. operators.md "Compound
      concatenation assignment" still shows both `s += part` and
      `try s += part` as an older failure-policy choice, and no correction
      decides whether compound `string +=` must also require try (with
      StringError and transactional rollback), may stay infallible, or may
      accept a fallible text operand. The compiler currently accepts
      `s += part` without try, rejects `try s += part` (S1096), and rejects a
      Result[string, StringError] operand of `+=` with S1022 pointing to
      `s += try value.ToString()`.
    classification: constraining
    status: open

  - id: MD-042
    area: match-arms-excluded-by-known-variant
    rulebooks:
      - rules/control-flow/flowcontrol_match.md
      - rules/declarations/unions.md
      - rules/tooling/diagnostics.md
    description: >-
      flowcontrol_match.md § 5 bases coverage on "proven control-flow state",
      and diagnostics.md § 21(6) makes an arm proven impossible invalid "when
      its owning language rule requires reachability". flowcontrol_match.md
      § 25 only defines arms made unreachable by earlier arms. It is not
      decided whether an arm whose variant a known active variant excludes
      (`let f := Figure.Dot` followed by `match f { Dot => ..., Line(x) => ...
      }`) is (1) an S3001 error, (2) required by exhaustiveness and valid, or
      (3) optional, so that `match f { Dot => ... }` is exhaustive. Options 1
      and 3 also need a rule for the remaining arm set. The compiler
      (2026-10-04) decides `is Variant` if-tests from a known active variant
      but treats match arms by declared coverage only.
      Decided 2026-10-28 (owner; rules/corrections/md029-md042-md102-pattern-
      reachability-some-correction-20261028.md §§ 8-10, 20(2)): option 3 —
      a match is exhaustive over the soundly proven reachable states, so
      `match f { Dot => ... }` is exhaustive; extra correctly typed arms
      excluded only by the proof stay legal with an Information diagnostic
      (new advisory identity, not S3001/S3003); duplicate, covered and
      invalid arms remain errors; mutation, aliases and unknown effects
      invalidate the proof. Declared error type and operation-specific
      failure provenance are distinct (an int division cannot produce
      PrecisionExhausted; a Result[int, ArithmeticError] signature proves
      nothing). Synchronized: flowcontrol_match.md rev 2.2 §§ 5, 25A;
      errorhandling.md § 27.2b; diagnostics.md § 24(4e); semantic_ir.md
      § 71(6); formatter.md § 20(12). Implementation pending; tracked in
      governance frontend.match-v2.
    classification: constraining
    status: decided-implementation-pending

  - id: MD-044
    area: stack-budget-project-contracts
    rulebooks:
      - rules/analysis/stack_analysis.md
      - rules/projects/projects.md
    description: >-
      stack_analysis.md headings "Stack budgets" and "Budget validation"
      define physical Domain, MeasurementLevel and MaximumBytes but explicitly
      do not define configuration syntax. projects.md section 23 defines only
      the analysis lsp_depth setting, with no stack-budget declaration. The
      project-supplied contract producer needs an owning manifest section and
      key syntax, byte-value representation, binding to canonical physical
      stack domains (rather than logical roots), authoritative measurement
      level and profile/target override precedence. The immutable compiler
      budget model and explicit same-domain/same-level comparisons are
      implemented independently; project parsing and activation of hard budget
      policy must wait for this decision instead of accepting invented keys.
    classification: localized
    status: open

  - id: MD-045
    area: callable-and-external-stack-contract-producers
    rulebooks:
      - rules/analysis/stack_analysis.md
      - rules/analysis/call_graph.md
      - rules/analysis/closure_analysis.md
      - rules/platform/ffi.md
    description: >-
      stack_analysis.md headings "Open callable contracts" and "Reentry
      through callable and foreign boundaries" define consumption of verified
      stack bounds and NoReentry-equivalent guarantees but explicitly leave
      source/metadata syntax outside that rulebook. call_graph.md headings
      "Callable contract", "Open callable contract" and "Reentry contracts"
      define the canonical identity and guarantee model without a declaration
      or import spelling for these optional properties. The ordinary source
      and imported-contract producer needs syntax or a metadata schema for
      stack bytes, measurement level, CompilationPlan compatibility and
      no-reentry guarantees, binding to CallableContractID, verification
      obligations and trusted provenance. The stack rulebook heading
      "Foreign, runtime, and platform calls" likewise leaves FFI tooling and
      metadata import outside its scope. External producers need a defined
      metadata schema and trust/verification obligations for whole-call
      contributions (including ABI, cleanup and panic), no-reentry proof and
      canonical call-site/target or runtime-effect binding at an exact level
      and CompilationPlan. Canonical callable and external compiler fact
      consumers and conservative Unknown fallback are implemented independently;
      they do not create new attributes, import keys or trust rules.
    classification: localized
    status: open

  - id: MD-048
    area: unit-transform-conversion-plans
    rulebooks:
      - rules/types/units.md
      - rules/foundations/grammar.md
      - rules/compiler/semantic_ir.md
    description: >-
      Blocks the complete frontend.units-v2 remaining item "validate affine
      and logarithmic Reference compatibility and implement their specialized
      explicit conversion plans". units.md "Affine transform" defines
      canonical = value * Scale + Offset, but "Logarithmic transform" only
      says that a value maps through LogBase, LogFactor and Reference; it does
      not define the forward/inverse formulas or the position of LogFactor.
      Reference must resolve to a compatible compile-time linear quantity,
      yet the only concrete example is the dimensionless scalar 1.
      grammar.md "Unit metadata inside impl" retains TokensUntilLineEnd and
      does not specify the accepted reference-quantity expression forms or
      how a dimensional reference identifies its carrier, unit coordinates,
      normalized value and Kind. Decide the forward/inverse transform,
      admissible reference values and compatibility checks, the numeric
      carriers and exactness/precision policy for logarithms and exponentials,
      and the behavior of invalid domains and unrepresentable results,
      coordinating with MD-047 (rounding, decided 2026-10-13: units.md "Explicit rounding") and MD-012 (checked failure types, decided 2026-10-08 as the core ConversionError).
      The applied units corrections require preservation of transform and
      Reference facts but do not supply these decisions. Current Sema retains
      Reference as source text and rejects conversions between distinct
      logarithmic units with "requires a specialized conversion operation".
      No partial affine-only implementation was made for this combined item.
    classification: blocking
    status: open

  - id: MD-049
    area: decimal-range-default-scale
    rulebooks:
      - rules/types/default_values.md
      - rules/memory/layout.md
      - rules/mlir/dialect-versions/sec_mlir_dialect_v2.md
      - rules/mlir/dialect-versions/sec_mlir_dialect_v3.md
    description: >-
      default_values.md "Floating and decimal ranges" and A.5 require the
      unique nearest exactly representable value of the declared type and
      scale, but source decimal types do not establish the scale used by an
      implicit range-default search. The canonical carriers have signed i32
      scales; schema v2 decimal constants require non-negative scales while
      schema v3 retains the attributes without specifying a source-level
      range-search policy. Decide whether negative scales are valid, whether
      the search ranges over every carrier scale or a declared fixed scale,
      and how an exclusive upper bound of zero selects a nearest negative
      value. An unrestricted scale has no nearest nonzero value; an i32-bounded
      search selects an extreme scale whose exact rational/text materialization
      is impractical. Do not choose endpoint spelling as precision, an arbitrary
      scale cap, or binary-floating nextafter as language semantics. Blocks
      frontend.default-values "implement exact successors for exclusive decimal
      upper bounds"; existing behavior continues to require explicit defaults.
    classification: blocking
    status: open

  - id: MD-052
    area: privileged-core-low-level-function-bodies
    rulebooks:
      - rules/library/core-library.md
      - rules/compiler/compiler_known_members.md
      - rules/foundations/grammar.md
      - rules/corrections/applied/correction-string-slice-helper-20260823.md
    description: >-
      core-library.md sections 1.1, 1.2 and the checked string substring
      boundary permit private privileged-core helpers with direct MLIR/LLVM
      bodies. The applied string-slice correction requires established inline
      MLIR/LLVM syntax, but no rulebook or grammar production defines it.
      Decide the source delimiters and body form, low-level dialect/version
      and backend selection, parameter/result binding and representation ABI,
      target facts and substitutions, verification and diagnostics, and how
      declared ownership, lifetime, effects and unsafe obligations are retained
      across the body. Sec asm is explicitly neither Sec MLIR nor LLVM IR
      (inline_assembly.md sections 4-5) and cannot supply this syntax.
      Blocks core.string-slice-helper's low-level-body syntax definition and
      its lexer, parser, AST, Sema, formatter and applicable backend support,
      and therefore the dependent migration/removal of its compiler-known compatibility path.
      The existing compatibility implementation remains in place; no new
      low-level syntax or semantics is inferred from backend code. The user
      separately scoped ordinary private Sec helpers on 2026-10-09; their
      existing syntax, source-file access checks and frontend tooling are
      implemented and are not blocked by this decision.
    classification: blocking
    status: open

  - id: MD-053
    area: constraint-effect-contracts
    rulebooks:
      - rules/compiler/monomorphization.md
      - rules/declarations/interfaces.md
      - rules/declarations/generics.md
      - rules/foundations/attributes.md
    description: >-
      monomorphization.md § 5.4 and § 12.5 check an explicit effect guarantee
      such as @noAlloc, @noPanic or @noBlock on a generic template against its
      generic contracts and require it for every valid substitution. A method
      called through a constraint has no contract that promises such an effect,
      so the template-level call is unknown and a guaranteed generic template
      that calls any constraint method is always rejected. Neither
      interfaces.md nor attributes.md defines whether an interface requirement
      may carry @noAlloc, @noPanic or @noBlock (the parser rejects attributes
      inside an interface block), whether every conformance must then satisfy
      it, how a conforming method proves it, and how the guarantee combines with
      inherited interfaces and generic arguments. The frontend keeps
      constraint calls unknown for explicit template guarantees; separately,
      concrete specialization effects are tracked as an implementation gap in
      governance/allocation.yaml frontend.allocation.
    classification: constraining
    status: open

  - id: MD-062
    area: unit-metadata-member-value-types
    rulebooks:
      - rules/types/units.md
      - rules/foundations/grammar.md
    description: >-
      MD-040 (2026-10-13) makes `<Unit>.Member` the qualified unit member
      access and shows `<Volt>.Symbol` reading the unit's declared symbol
      metadata. Symbol and LongName are text, so the frontend types them as
      string. No rulebook gives a value type for the other metadata read the
      same way: Kind (an identifier such as electric_potential), Dimension
      (a bracketed exponent list), Scale and Offset (exact rationals),
      System, BaseUnit, Status, Origin, LogBase, LogFactor and Reference.
      Decide whether these are readable as values, their Sec types (for
      example string, a compiler-known Dimension/Kind type, an exact rational
      or decimal), and whether reading them is compile-time constant. Until
      then the frontend rejects `<U>.Kind` and the other non-text metadata
      with an explanatory error instead of inventing a type.
      Decided 2026-10-27 (owner; rules/corrections/md062-unit-metadata-value-
      types-correction-20261027.md): all 16 members (14 fields plus implicit
      Name/Category) are typed compile-time values; six closed core enums
      UnitKind/UnitSystem/UnitOrigin/UnitTransform/UnitCategory/UnitStatus
      (Kind/System/Origin may also be user enums, keeping their nominal type);
      opaque UnitDimension with AxisCount, IsDimensionless, == and !=;
      Scale/Offset/LogBase/LogFactor read as decimal (Scale is the nearest-
      even projection of the exact rational), Reference as decimal or
      decimal<V>; linear Scale may be negative but not zero; legacy bare
      metadata names migrate to the enums. Synchronized: units.md "Unit
      metadata value types" (1)-(11) and the Status/Scale/System/defaults/
      validation/LSP/formatter/IR sections, core-library.md § 27,
      grammar.md (unit metadata), compiler_known_members.md registry,
      operators.md "Unit dimension equality", types.md Units,
      compile_time_evaluation.md § 15(5). Implementation pending under
      frontend.units-v2; MD-048 stays open (MD-066 was decided 2026-10-28).
      Implemented 2026-10-28 in Sema (steps 1-4): sec/core/unit_metadata.sec
      enums with exact core identity; typed <U>.Member reads, defaults and
      diagnostics; legacy migration table; duplicate keys; UnitDimension
      (AxisCount, IsDimensionless, ==, !=) with module-aware axes; non-zero
      negative linear Scale with reversed conversion intervals (negative
      affine Scale rejected pending MD-048).
      Step 5 (2026-10-28): Sema records each read's resolved value
      (ResolvedUnitMetadataReadOf: unit, member, enum case, exact rational,
      decimal projection, dimension); Scale projects to the nearest decimal
      with ties to even, other decimal members must be exact or the read
      fails. Semantic IR folds string/bool/enum/decimal reads, and
      UnitDimension equality/AxisCount/IsDimensionless between direct
      <U>.Dimension reads, to verified constants with unit-metadata
      provenance; they reach schema-11 Sec MLIR and native builds (decimal and
      string constants stop at the existing LLVM-track boundary). LSP hover
      shows type, value, defaults and the exact Scale; <U>. completes readable
      members. Metadata definition/type-definition/reference navigation now
      retains declared/default sources and concrete custom enums through
      imported aliases and live snapshots (2026-10-28); fixed metadata names
      reject rename and properties have no fabricated callable signatures.
      The formatter preserves typed and legacy values; its preservation policy
      is now documented in formatter.md §§ 22(11)-22(13), with contextual
      colon/operator spacing, exact token retention and CLI/LSP conformance
      implemented and verified 2026-10-28. No enum-value rewrite is performed.
      Remaining, fail closed today: (a) DECISION NEEDED - the Sec MLIR dialect
      and Semantic IR have no UnitDimension type, constant or equality
      operation, so a UnitDimension value that escapes folding (local,
      parameter, field, return) is unsupported; § 7(12)/§ 12(8) allow a
      static descriptor or collision-free canonical ID but no dialect version
      specifies the spelling or representation. Proposal for owner review
      (2026-10-28): MD-062-unit-dimension-representation-proposal.md
      (recommends a content-addressed static descriptor; decisions D1-D6).
      (b) <U>.Reference of type
      decimal<V> waits on unit quantity representation in Semantic IR.
      (c) Separate-compilation axis identity (module surfaces/serialization).
    classification: localized
    status: decided-implementation-pending
  - id: MD-066
    area: decimal-operator-result-scale
    rulebooks:
      - rules/types/types.md
      - rules/foundations/operators.md
      - rules/library/core-library.md
      - rules/mlir/normative-sync/sec_decimal_numeric_sync_package21.md
    description: >-
      P21 gate D1, referred to as P21-D1 by the P22 decision index (sec_decimal_numeric_sync_package21.md § 5, package § 13).
      No rulebook fixes the result scale of decimal operators, the exact
      normalization policy, or the valid range of the physical i32 scale
      relative to the public `scale: uint8`. Decide: source-valid scale range
      (recommended 0..255); scale after add/sub/remainder (recommended max of
      the inputs), multiply (recommended sum) and division (recommended the
      smallest representable exact scale at or above the maximum input
      scale); whether exact trailing coefficient zeros may be stripped when
      needed for representability (never rounding); zero's scale (recommended
      preserve the preferred operation scale; a literal zero keeps its
      source scale); and RoundTo/Rescale's final behavior. Blocks
      scale-sensitive operator results, the `.scale` correction beyond its
      type, RoundTo/Rescale and runtime value validation.
      Decided 2026-10-28 (owner; rules/corrections/md066-md067-md068-decimal-
      correction-20261028.md §§ 2-6, 8): public Scale is int32 over its whole
      signed interval (the 0..255/uint8 recommendation is rejected), with an
      infallible getter and a transactional `try set` reporting
      PrecisionError; each operation selects the exact scale closest to its
      preferred scale (add/sub/div/rem: max input scale; mul: the sum) in the
      real asymmetric coefficient domain; exact zero keeps the preferred scale
      clamped to int32; literals keep their source scale; division alone
      rounds an inexact quotient once with nearest-even at the finest
      admissible scale, keeping the whole-number part (1m / 3m is
      0.3333333333333333333, scale 19, a success); a provably zero decimal
      divisor is a compile-time error; Rescale never rounds, RoundTo(scale[,
      mode]) rounds once, Normalize() strips exact trailing zeros.
      Synchronized: types.md "Decimal scale" (rev 2.5); operators.md
      "Decimal arithmetic" (result scale, division, zero divisor, failures),
      "Decimal remainder", tests; core-library.md §§ 10.1, 10.5;
      runtime_checks.md (rev 1.1) arithmetic and division sections;
      semantic_ir.md §§ 58(6)-58(7); units.md MD-062 Scale note; the P21
      package, YAML gate SEC-MLIR-P21-D1, normative sync § 5, Semantic IR
      amendment, dialect/lowering v17 and package21-todo.md. Implementation
      pending (correction § 13(3) steps 3-8); no rounded division yet.
      Partial 2026-10-28: Sema registers Scale as int32 on decimal
      (CKM-DECIMAL-SCALE) and decimal128 (CKM-DECIMAL128-SCALE) with a
      fallible `try set` (PrecisionError, mutable unborrowed place
      required; core PrecisionError fallback type); Semantic IR and the
      MLIR const.decimal verifier accept negative int32 scales; the MD-062
      Scale read projects onto negative scales. Getter/setter lowering fails
      closed. Literal scale done 2026-10-28: literals keep the signed int32
      scale their spelling implies (1e3m scale -3), shared by Sema and
      Semantic IR, moved only to the closest exact legal scale for the
      target width, with a specific diagnostic when none exists; `m`
      literals beyond float64 now parse. Remaining items are tracked in
      governance lowering.sec-mlir-package21 (operator scale plans, rounded
      division, zero-divisor rule, ArithmeticError variants, Scale lowering,
      core members incl. decimal128 source, unsuffixed literals beyond
      float64, schema 17 and physical lowering).
    classification: blocking
    status: decided-implementation-pending
  - id: MD-067
    area: decimal-operator-error-type
    rulebooks:
      - rules/errors/errorhandling.md
      - rules/library/core-library.md
      - rules/foundations/operators.md
      - rules/mlir/normative-sync/sec_decimal_numeric_sync_package21.md
    description: >-
      P21 gate D2, referred to as P21-D2 by the P22 decision index (sec_decimal_numeric_sync_package21.md § 6, package § 14).
      One decimal operator can fail both arithmetically (overflow, division
      by zero) and by precision/scale, but `try` needs one exact error type
      and no rulebook names a combined type. Recommended (requires explicit
      approval): a new core `enum DecimalArithmeticError error { Overflow,
      DivisionByZero, PrecisionLoss, ScaleOverflow, PrecisionExhausted }`
      propagated by fallible naked decimal arithmetic, with the existing
      OverflowError/PrecisionError method contracts unchanged and no
      inferred unions or wrapping, and a deterministic failure priority of
      zero divisor, impossible scale, coefficient overflow, precision loss.
      Decide the type, its variant set and the priority. Also gates the
      schema-17 `!sec.decimal_failure_reason` type and
      `sec.decimal.error_from_reason`.
      Decided 2026-10-28 (owner; md066-md067-md068 correction § 7): no
      DecimalArithmeticError (the recommendation is rejected). Decimal
      operators reuse core::ArithmeticError, which gains exactly
      ScaleOverflow and PrecisionExhausted (five variants, closed fieldless
      enum). The general rule is the most specific applicable error, chosen
      by mathematical cause, not check order; Overflow is not a supervariant.
      A rounded quotient is no failure; PrecisionLoss is not an operator
      error. OverflowError/PrecisionError/RangeError/DivisionByZeroError/
      ConversionError stay distinct. Synchronized: core-library.md § 20.1;
      errorhandling.md § 3.4 (rev 2.2); operators.md "Decimal arithmetic
      failures"; runtime_checks.md; semantic_ir.md § 58(7);
      sec_mlir_lowering.md § 13; dialect v17 § 3; P21 gate SEC-MLIR-P21-D2.
      Implemented 2026-10-28: five-variant enum in the Sema builtin and an
      exact trusted declaration in sec/core/error.sec, exhaustiveness, and
      the Semantic IR/MLIR variant verifiers. Remaining (tracked in
      governance lowering.sec-mlir-package21): most-specific decimal
      classification and the decimal reason-to-variant mapping, which need
      the decimal operator plans.
    classification: blocking
    status: decided-implementation-pending
  - id: MD-068
    area: decimal128-public-members
    rulebooks:
      - rules/library/core-library.md
      - rules/compiler/compiler_known_members.md
      - rules/mlir/normative-sync/sec_decimal_numeric_sync_package21.md
    description: >-
      P21 gate D3, referred to as P21-D3 by the P22 decision index (sec_decimal_numeric_sync_package21.md § 7, package § 15).
      core-library.md § 10 documents the full `decimal` member surface but
      not `decimal128`'s. Recommended: an exact mirrored `impl decimal128`
      set with decimal128 argument/result types, including `scale: uint8`
      (if MD-066 confirms the range), fallible `Abs`, `RoundTo` and
      `Rescale`, with a comment before each public declaration in
      sec/core/decimal128.sec and the compiler-known registry. Decide the
      member set and signatures; until then no decimal128 method may be
      declared or advertised. Ordinary decimal128 operators and conversions
      are not affected.
      Decided 2026-10-28 (owner; md066-md067-md068 correction §§ 9-10):
      decimal and decimal128 share one complete member family: Scale: int32
      (get, try set PrecisionError); properties IsInteger, IsZero,
      IsPositive, IsNegative, Sign; three ToString overloads (R/G/F/N/E,
      explicit separators); Abs, Min, Max, Clamp, Floor, Ceiling, Truncate,
      Round, RoundTo(int32[, RoundingMode]), Rescale(int32), Normalize();
      ToInt/ToInt32/ToInt64/ToInt128 and ToFloat/ToFloat32/ToFloat64, each
      with an optional RoundingMode overload. No As* aliases; Parse() and
      ToUInt* deferred; no IsEven/IsOdd on decimal. Synchronized:
      core-library.md §§ 10.2, 10.4, 10.6, 10.7; compiler_known_members.md
      decimal Scale and "Decimal types"; P21 gate SEC-MLIR-P21-D3.
      Implementation pending (sec/core/decimal128.sec, registry, LSP).
      Separate core finding (correction § 15, not part of this decision):
      int.sec declares IsEven/IsOdd/IsPositive/IsNegative as properties,
      while uint.sec and core-library.md §§ 7-8 use fn IsEven()/IsOdd().
    classification: constraining
    status: decided-implementation-pending
  - id: MD-073
    area: char-array-conversion-outside-char-domain
    rulebooks:
      - rules/types/types.md
      - rules/library/core-library.md
      - rules/compiler/compiler_known_members.md
      - rules/mlir/packages/sec-mlir-dialect_package23.md
    description: >-
      SEC-MLIR-P23 decision P23-D3 (2026-10-16). `char` is numeric 0..255 and
      `rune` a Unicode scalar; compiler_known_members.md describes
      string.ToCharArray() and char-sequence ToString() but leaves scalars
      above 255 open. "Ω" (U+03A9) is valid UTF-8, so this is not MD-050.
      Decide what converting valid text containing scalars above 255 to
      char[] does: (A) fail with an explicit approved Result conversion
      error, preserving every scalar; (B) allow ToCharArray only on strings
      statically proven within the char domain; (C) lossy substitution or
      truncation (conflicts with the preservation philosophy). Also confirm
      that char.ToString() encodes the char as code point U+0000..U+00FF in
      canonical UTF-8 (0xE9 becomes bytes C3 A9) rather than copying the raw
      byte. Package recommendation, not accepted: A, with the exact error
      type synchronized with MD-072 (decided 2026-10-17: Result[..., CollectionError]), and the UTF-8 encoding for
      char.ToString(). Gates general public ToCharArray and non-ASCII char
      sequence conversion; rune array conversion for valid strings and char
      conversion of proven ASCII/≤255 input may proceed. Keep char 0..255.
    classification: constraining
    status: open
  - id: MD-075
    area: webassembly-target-identity-and-profile
    rulebooks:
      - rules/platform/platform_model.md
      - rules/platform/target_profiles.md
      - rules/platform/abi.md
      - rules/memory/allocation.md
    description: >-
      Implementation choice awaiting confirmation (2026-10-16). On request
      the target registry gained WebAssembly targets as `Planned` (parse and
      check only, no emission, linking or running): `unknown-wasm32`
      (LLVM wasm32-unknown-unknown) and `unknown-wasm64` (LLVM
      wasm64-unknown-unknown), profile `freestanding`, little endian, with
      the WebAssembly BasicCABI data models (wasm32 ILP32, wasm64 LP64,
      signed char, IEEE binary128 long double). No rulebook names WebAssembly
      targets. Decide: (1) the Sec target spelling (`unknown-wasm32`,
      `wasm-wasm32`, `browser-wasm32`, ...); (2) which environments are
      targets — embedder-only modules (unknown-unknown), WASI (for example
      wasm32-wasip1/-wasip2, a hosted-like profile with an OS interface), or
      both; (3) the profile and its allocation context (freestanding provides
      none today, MD-034), threads (wasm threads/shared memory) and atomics;
      (4) how imports/exports map to the FFI boundary; (5) whether wasm64
      (memory64) is in scope for Sec 0.1.
    classification: localized
    status: open
  - id: MD-078
    area: ffi-callback-trusted-fact-encoding
    rulebooks:
      - rules/platform/ffi.md
      - rules/memory/unsafe.md
    description: >-
      Follow-up of MD-059 (decided 2026-10-16, correction §§ 6(4), 10(4)).
      `c::callback(UnsafeSecFunction)` is rejected unless an FFI contract form
      represents and validates every caller obligation on every invocation,
      and a safe callback may call unsafe operations only after establishing
      their obligations, partly from trusted foreign contract facts (buffer
      lifetime and extent, allowed callback threads, exclusivity, retention,
      invocation sequencing). No rulebook defines how such callback-specific
      trusted facts are written in a binding and associated with callback
      registration, how they are validated per target/ABI, or how they
      invalidate when the binding changes. Decide that binding-language
      encoding (or that none exists in Sec 0.1, so unsafe callables are never
      adaptable). Related: MD-045 (external callable/stack contract
      producers).
    classification: localized
    status: open
  - id: MD-081
    area: static-initializer-reference-to-static
    rulebooks:
      - rules/declarations/static.md
      - rules/compiler/compile_time_evaluation.md
      - rules/memory/lifetime_analysis.md
    description: >-
      Implementation choice awaiting confirmation (2026-10-16). Requiring an
      explicit `ref` (MD-080) left no way to initialize a static reference:
      the static-initializer validator rejected every `ref` expression as
      runtime work. compile_time_evaluation.md § 36(2) lists "static
      references are legal" among materialization checks and static.md § 5
      lets static lifetime make a reference valid, but no rule states that
      `ref S` / `ref mut S` of a module static S is a compile-time-valid
      static initializer. The validator now accepts a `ref`/`ref mut` whose
      root is a module-level static binding and still rejects borrows of
      anything else. Decide whether such static references are valid
      initializers, whether `ref mut` of a mutable static is allowed there
      (static.md § 5 synchronization requirements), and whether field and
      element sub-Places of a static may be referenced.
    classification: localized
    status: open
  - id: MD-090
    area: stdlib-str-edit-position-unit
    rulebooks:
      - sec/stdlib/str/stdlib_str.md
      - rules/library/core-library.md
    description: >-
      Open decision (2026-10-17, follow-up of MD-071). stdlib_str.md § 11.2
      makes the public edit API of module str (Insert, RemoveRange,
      ReplaceRange) take UTF-8 byte offsets, partly because core search and
      slicing "naturally expose byte offsets". Since MD-071 the core
      IndexOf/LastIndexOf/Slice/GetRune use rune indexes, so a search result
      no longer feeds an edit directly; the edit functions now translate
      validated byte boundaries to rune indexes internally. Decide whether
      the str edit API stays byte-offset based (and how callers obtain byte
      boundaries) or moves to rune indexes (removing NotRuneBoundary).
    classification: localized
    status: open
  - id: MD-095
    area: atomic-capability-requirement-keys
    rulebooks:
      - rules/concurrency/atomics.md
      - rules/platform/target_profiles.md
      - rules/platform/platform_model.md
    description: >-
      Open decision (2026-10-17). atomics.md §§ 37–39 and 48 require Sema to
      look up the selected CompilationPlan's capability for every concrete
      atomic operation and to report a focused capability diagnostic, and
      to reject blocking or non-interrupt-safe emulation where the context
      forbids it. The plan-side model exists (internal/layout
      AtomicRequirement / ResolvedScalarPlan.AtomicCapability, exact-match
      lookup). No rule fixes the three keys a Sema consumer and a target
      producer must agree on, so source integration of "target diagnostics
      for unsupported concrete operation/order combinations", "tooling
      distinguishes semantic invalidity from CompilationPlan capability
      failure" and blocking/ISR capability validation remains blocked.
      Plan-side validation of already-resolved requirements is implemented:
      a supported implementation must prove nonblocking execution when
      NoBlocking or InterruptSafe is required, and must separately prove
      interrupt safety for InterruptSafe. Known incompatible and unknown
      implementation properties are rejected before the capability table
      is frozen. This decides none of the source key or Unknown-capability
      questions below and supplies no capability for a registered target.
      (1) TypeID: the plan model's tests use `core::uint64`, while Sema's
      canonical type identity has the form `module:kind:name[args]`. Decide
      the canonical spelling, including named, enum, RawPtr[T] and generic
      carriers.
      (2) ContextID: tests use free strings (`thread::main`, `isr::timer`,
      `test::ordinary`), while target_profiles.md § 19 defines only the
      compiler-known contexts Ordinary, Task, Thread, Interrupt, Startup and
      Shutdown and forbids arbitrary string-named contexts. Decide whether
      the key is that context name alone (with NoBlocking/InterruptSafe from
      @noBlock/@isr/@interruptSafe) or a per-root identity such as the
      interrupt vector or task.
      (3) SizeBytes/AlignmentBytes: no API gives the concrete size and
      alignment of T per plan. Decide which layout authority supplies them
      (the scalar plan, P24 layout plans) and what an unresolved size means.
      Also decide what Sema does with an Unknown capability fact: real
      registered targets currently declare none, so treating Unknown as
      failure would reject every atomic program, while § 39(2) requires the
      plan to prove an ISR use. Suggested direction (not accepted): Sema's
      canonical type identity, the § 19 context name plus the
      NoBlocking/InterruptSafe flags, sizes from the resolved scalar plan,
      Unknown deferred to lowering except in interrupt contexts.
    classification: blocking
    status: open


  - id: MD-101
    area: single-compilation-track-sec-mlir-to-llvm
    rulebooks:
      - rules/compiler/compiler_pipeline.md
      - rules/compiler/initialization.md
      - rules/errors/panic.md
      - rules/mlir/sec_mlir_lowering.md
    description: >-
      User decisions 2026-10-17: there is one compilation track, Semantic IR
      -> Sec dialect (where Sec semantics need it) -> standard MLIR (where it
      suffices) -> LLVM dialect -> LLVM IR -> clang; the legacy direct LLVM
      and AST-to-LLVM-dialect paths (internal/codegen/llvm, /mlir,
      /readiness) and `sec build --pipeline` are removed now, accepting that
      constructs outside the track stop building until the track covers them.
      No numbered SEC-MLIR package owns LLVM finalization (P24/P25 exclude
      it), so the track is an interim basic path that later packages widen.
      Implementation choices awaiting confirmation:
      (1) the minimal hosted panic endpoint for every deterministic Sec
      failure (fail.arithmetic, fail.bounds, fail.reference_generation,
      synthesized unreachable) is llvm.intr.trap + unreachable, with no
      panic message or policy hook yet (panic.md § 8.1(3), § 12(2));
      (2) arithmetic failure reasons are i8 codes none=0, overflow=1,
      division-by-zero=2, invalid-shift=3, kept for a later reporting stage;
      (3) the hosted startup adapter is a generated C `main` returning the
      Sec `int` status truncated/sign-extended to the target C int
      (initialization.md § 23 leaves the physical mapping open);
      (4) the command entry is identified as "<entry module>::main()";
      (5) internal Sec functions use the default func-to-llvm calling
      convention and keep their sec_fn_N symbols (no ABI package yet, P25);
      (6) the emitter admits Semantic IR up to package level 14 (was 12),
      which brings while loops, compound assignment and &&/||/! into the
      track;
      (7) two gates bound the track: sec-check-lowering-support (entry; an
      explicit set of lowered Sec operations) and sec-finalize-for-llvm
      (no Sec operation, type or sec.* attribute reaches LLVM conversion);
      their capability errors surface as [unsupported-lowering];
      (8) emit-mlir now prints the track's LLVM dialect and lost --verify
      (always verified); emit-llvm gained --mlir-bin;
      (9) mlir-translate is looked up in --mlir-bin/SEC_MLIR_BIN, then the
      default LLVM/MLIR build directory, then PATH.
      Known holes (verified 2026-10-17), capabilities the removed paths had
      or that the track lacks: Semantic IR P14 rejects for, switch, floating
      operations, rune comparison, explicit conversions such as int(x),
      extern calls and inline asm; the LLVM track rejects structs, arrays,
      enum conversions and bit-backed enums, unions and union matches,
      Result/Option, references, strings and statics. Ordinary integer enum
      constants, equality, match CFG, storage and direct calls now reach
      binaries through the dedicated sec-lower-integer-enums representation
      stage (2026-10-17; lowering.integer-enum-representation); this does not
      resolve the open startup, panic-policy or ABI choices above.
    classification: architectural
    status: open
  - id: MD-102
    area: contextual-some-call-arguments
    rulebooks:
      - rules/types/types.md
      - rules/declarations/functions.md
    description: >-
      Found 2026-10-17 (user report: Some(next) as a call argument failed
      with S1157 "unknown function or type Some"). types.md "Contextual None
      and empty-literal arguments" (MD-027) names only None and []; it says
      nothing about Some(x) in argument position, and no rule defines a
      standalone type for Some(x). Implementation choice awaiting
      confirmation: a bare one-argument Some(...) is a contextual Option
      argument exactly like None: deferred, accepted only by Option[T]
      parameters, typed from the single selected overload (the payload is
      then checked against T). Open questions: (1) should the payload's own
      type eliminate overloads, so Store(Some(1)) picks Option[int] over
      Option[string] instead of being ambiguous (S1147)? (2) should Some(x)
      supply Option[typeof x] for generic inference, so Unwrap(Some(1), 0)
      infers T = int instead of "cannot infer generic arguments" (None
      cannot)? (3) should Some(x) have a standalone type anywhere else
      (let v := Some(3))? (4) None() is now explained under S1157 ("None is
      not a function and takes no arguments"); confirm the wording/ID. Also
      fixed: a contextual None/Some/[]/null passed to a parameter outside its
      family was accepted silently and is now reported.
      Decided 2026-10-28 (owner; rules/corrections/md029-md042-md102-pattern-
      reachability-some-correction-20261028.md §§ 11-14, 20(3)): (1) yes,
      the payload eliminates overloads like an ordinary argument, with
      ordinary literal ranking and no Some-specific precedence; (2) yes,
      Some(x) supplies T for Option[T] and must agree with every other
      inference source; (3) yes, Some(x) with an independently inferable
      payload has type Option[T] (let v := Some(3) is Option[int]); None
      and uncontextualized Some(None) still need an expected type; a
      visible user callable named Some wins by ordinary lookup; (4) None()
      stays under S1157 with the current wording. Synchronized: types.md
      rev 2.6, functions.md § 20, generics.md § 18.1, diagnostics.md
      § 24(4f), semantic_ir.md § 71(6), lsp.md. Implementation pending
      (baseline 2026-10-28: `let n := Some(42)` is S1157, Store(Some(42))
      is S1147, Unwrap(Some(42), 0) cannot infer); tracked in governance
      frontend.types-core.
      Partial 2026-10-28: Sema implements questions (1)-(3)
      (internal/sema/some_inference.go): payload-based overload
      elimination, Option[T] generic inference from a Some payload, and
      the standalone Option[T] type. Remaining: ownership/lifetime tests,
      recording the selected Option[T] for IR/LSP hover, and the
      cross-feature regression (frontend.types-core
      md102-some-ownership-and-facts).
    classification: localized
    status: decided-implementation-pending
  - id: MD-103
    area: semantic-ir-for-and-switch-lowering
    rulebooks:
      - rules/compiler/semantic_ir.md
      - rules/control-flow/flowcontrol_for.md
      - rules/control-flow/flowcontrol_switch.md
    description: >-
      Implementation choices awaiting confirmation (2026-10-17), made while
      lowering `for` and `switch` into the single compilation track.
      (1) Loop kinds: semantic_ir.md § 65(2) asks to distinguish infinite
      and numeric range iteration; Semantic IR spells them LoopForInfinite
      "for-infinite" and LoopForRange "for-range" next to "while".
      (2) Range progression: a range loop keeps its state in two
      compiler-generated mutable storages named "<binding>.cursor" and
      "<binding>.more" (a discard binding uses "_"); the body entry yields
      the cursor and advances it before user code, so `continue` returns
      to the condition; the increment is a checked add whose failure edge
      is provably dead (value < end) rather than an unchecked add, because
      Semantic IR has no unchecked integer add.
      (3) Not lowered yet (Known hole): explicit `step`, float/decimal
      ranges, collections, strings, Iterator[T], ref/ref mut bindings, ranges
      over named numeric types; switch subjects of enum, bool, string and
      named types.
      (4) switch: § 68(2) permits explicit comparisons/branches, so no
      semantic switch operation exists; a two-sided range alternative
      evaluates both bounds, in order, before its tests; a switch Sema proves
      to have no unmatched path and no default ends its failed-test path in a
      synthesized unreachable "switch-unmatched-excluded-by-sema".
      (5) Bug fixed on the way: an untyped literal operand of a compound
      assignment (`count += 1` on uint) was recorded with type int, giving a
      mixed-type operation that Semantic IR rejected; it now takes the
      target's type by context.
    classification: localized
    status: open
  - id: MD-106
    area: stdlib-str-iterator-parameter-ownership
    rulebooks:
      - sec/stdlib/str/stdlib_str.md
      - rules/declarations/interfaces.md
      - rules/control-flow/flowcontrol_for.md
    description: >-
      Opened 2026-10-18 when syncing the MD-057 correction, which locks the
      two legal iterator parameter forms (a named generic parameter
      [I: Iterator[T]](values: I), statically dispatched, or a borrowed view
      ref mut Iterator[T], runtime dispatched) but explicitly leaves to the
      library whether an operation owns/consumes or borrows its iterator
      (correction §§ 5.2, 6.5). stdlib_str.md §§ 10.2, 13.2 and 13.6 were
      synced to the explicit generic form already implemented in
      join.sec/collect.sec (Join, Concat, AppendJoin, FromRunes take the
      iterator by value as I). Decide per operation whether that ownership
      is intended, or whether Join/Concat/FromRunes/AppendJoin should borrow
      through ref mut Iterator[T] (or offer both overloads).
    classification: localized
    status: open
  - id: MD-107
    area: by-value-interface-parameters
    rulebooks:
      - rules/declarations/interfaces.md
      - rules/memory/ownership.md
    description: >-
      Found 2026-10-18 while implementing MD-057. Sema accepts a parameter of
      an ordinary interface type written by value (fn F(handler: Handler),
      used throughout sec/stdlib/net/http, and by existing Sema tests such as
      an owned `value: Resource` passed to a consuming interface method), but
      no rule defines an owned interface value: interfaces.md § 7.1 (MD-057)
      says borrowed views do not create a generally owned, unsized, by-value
      interface object, and the correction (§ 5.4) leaves first-class
      interface values outside its scope. Only Iterator[T] by value is now
      rejected (S1172, correction § 8.9). Decide whether a by-value
      interface parameter is invalid (and the stdlib/tests must move to
      ref/ref mut views or named generics), an implicit generic, or a new
      owned interface value with defined ownership, layout and dispatch.
    classification: localized
    status: open
  - id: MD-108
    area: borrowed-interface-view-representation
    rulebooks:
      - rules/declarations/interfaces.md
      - rules/compiler/semantic_ir.md
      - rules/mlir/sec_mlir_lowering.md
    description: >-
      Open 2026-10-18. MD-057 requires runtime dispatch through borrowed
      interface views without heap allocation and leaves the representation
      implementation-defined ("such as a data reference and dispatch
      table"), and requires Semantic IR to distinguish a view and its
      interface method call from a statically resolved call, preserving
      interface identity, generic arguments, borrow authority and witness.
      No package owns this lowering (P25 owns callable ABI classification;
      P24 physical layout). Decide: the view representation (fat
      reference = data pointer + per-(type, interface) dispatch table, or
      another form), table layout and member order (declaration order of
      the interface including inherited requirements?), where tables are
      emitted (per conformance, in the module of the impl?), the Semantic IR
      operations (view creation from a concrete reference, interface method
      call through a view, Next dispatch in for), the Sec MLIR dialect
      surface, and which package owns it.
    classification: architectural
    status: open
  - id: MD-109
    area: stdlib-byte-to-string-materialization-path
    rulebooks:
      - rules/library/core-library.md
      - rules/compiler/compiler_known_members.md
      - sec/stdlib/str/stdlib_str.md
      - rules/corrections/md109-core-string-materialization-correction.md
    description: >-
      Open for complete application. Owner supplied the core-owned string
      materialization correction on 2026-10-25: public static
      string.FromByteArray(data: ref byte[]) and
      string.FromRuneArray(data: ref rune[]) return Result[string, StringError],
      borrow inputs and produce independent immutable strings; core is
      allocation-averse rather than allocation-forbidden. MD-091 byte-array
      ToString remains a type summary and the private CKF-STRING-FROM-UTF8
      remains loader-proven-core-only. Phase 1 inventory and phase 2 static
      source/registry/API/LSP checks are implemented. Core byte forwarding
      uses the actual _stringFromUtf8 signature; the existing canonical
      rune-sequence encoder is retained, not replaced by an empty stub.
      Phase 3 is blocked on missing P23 string materialization and P18/P19
      allocation/storage prerequisites (P23 sections 35-37): source checks
      pass, but both materializers fail emit-mlir with a named P23
      unsupported-lowering diagnostic and no output. No allocator or hidden
      heap was invented. Executable UTF-8/rune conformance, allocation-failure
      and independent-result lifetime/cleanup tests remain unavailable.
      Per the supplied phase order, stdlib collect/Builder/io/url migration,
      canonical rulebook reconciliation and final closure remain pending;
      str.FromByteArray and Builder.Finish still contain MD-109 panics.
      Do not remove this entry or archive the correction as applied until
      those required implementation and verification gates pass. No new
      language decision is requested for the already chosen public route.
    classification: architectural
    status: open
  - id: MD-110
    area: register-integer-conversion-ir-vocabulary
    rulebooks:
      - rules/declarations/registers.md
      - rules/compiler/semantic_ir.md
      - rules/mlir/sec_mlir_dialect.md
    description: >-
      Open 2026-10-23 (raised while implementing MD-077 § 18(3)). registers.md
      § 12 admits explicit integer-to-register conversion (`Packet(raw)`,
      checked `try Packet12(raw)` when the source may exceed the width,
      compile-time rejection of a known out-of-range constant), but the
      canonical MD-077 vocabulary (semantic_ir.md § 21(5), dialect v11.41.1)
      lists only register.value.extract/update and the hardware family. No
      Semantic IR or Sec MLIR operation therefore creates a detached register
      value from bits, and none turns one back into its integer bit pattern
      (needed for protocol serialization). Until decided, Semantic IR rejects
      the conversion fail-closed; detached values reach IR only as
      parameters, returns and copies. Decide: the operation names (for
      example register.value.from-bits / register.value.to-bits and
      sec.register.from_bits / sec.register.to_bits), whether the checked
      form is one op with a failure edge or a range guard plus an exact op
      (as numeric.convert-exact), the source integer types admitted, whether
      register-to-integer conversion exists in source at all, and the schema
      admission (v11.41.x early admission or later).
      Decided 2026-10-25 (rules/corrections/MD-110-register-bit-pattern-conversion-ir-20261025.md):
      bit-pattern representability fit, IntegerType(register) with W >= N,
      register.value.fits-bits/from-bits/to-bits and
      sec.register.fits_bits/from_bits/to_bits (v11.41.2). Normative owners
      synchronized 2026-10-26 (registers.md § 12/§ 12.3, types.md,
      semantic_ir.md §§ 21(6)/59(5), sec_mlir_dialect.md v11.41.2 and the v11
      snapshot, P15 note). Kept open per the correction's § 12(6) until Sema,
      Semantic IR and MLIR implementation pass their acceptance checks; the
      former MLIR from_bits table dependency is satisfied by the 2026-10-28
      MD-114 implementation described below.
      Progress 2026-10-26: Sema (fit rule, constant rejection, proof basis,
      W >= N) and Semantic IR (the three ops, local verifier, dominance-checked
      proofs) implemented and tested; checked (guarded) conversions stay
      fail-closed until try lowering, as checked integer conversions. Open gap
      for the owner: § 4(2) makes T(bit[N](x)) exact, but § 8(4) lists no
      matching MLIR proof basis; Semantic IR records it as proof=bit-extraction
      and the MLIR spelling needs a decision.
      Progress 2026-10-28 (MD-114): canonical register table and detached
      field operations are implemented, along with native/Go constant and
      source-domain from_bits and signed/unsigned to_bits using that table.
      Newly verified textual gap: MD-110 § 8(2) / dialect v11.41.2 require
      a canonical destination-register type-identity attribute for fits_bits,
      but give neither its exact key nor TypeAttr-versus-string representation.
      sec.register_type_id in v11.41.1 is hardware metadata, not an approved
      spelling for this pure predicate. Specify that attribute before adding
      fits_bits/guarded emission; no syntax is invented. This is tracked here
      rather than creating a duplicate decision. Both remaining conversion
      transports fail closed without output.
    classification: constraining
    status: decided-implementation-pending
  - id: MD-111
    area: hardware-endpoint-fact-source
    rulebooks:
      - rules/platform/platform_model.md
      - rules/platform/fixed-address-bindings.md
      - rules/platform/hardware-register-access.md
      - rules/compiler/semantic_ir.md
    description: >-
      Open 2026-10-23 (raised while implementing MD-077 § 18(3)-(4)).
      register.hw.bind/observe/request_write/commit need resolved resource,
      endpoint and verified physical-plan facts (MD-077 § 10(2), § 19(8):
      endpoint kind, legal read/write widths, alignment, read/write
      footprints, collateral effects, aliases, atomicity, ordering and
      completion, access context, fault model). fixed-address-bindings.md § 8
      requires every @address binding to resolve against a canonical region
      or endpoint from the CompilationPlan, MemoryEnvironment or DeviceModel,
      and hardware-register-access.md § 32 lists these as canonical facts,
      but platform_model.md §§ 5, 10 describe DeviceModel and
      MemoryEnvironment only conceptually. No rulebook fixes their concrete
      source (target definition, project manifest section, device file or
      knowledge pack), schema, identity scheme or validation, and the
      compiler has no such model. Without it no verified operation plan can
      exist, so every hardware operation can only fail closed, and @address
      region validation (fixed-address-bindings.md § 8) cannot be performed.
      Decide: where endpoint/region facts come from and their format; the
      canonical HardwareResourceID / HardwareEndpointID / plan-ID scheme;
      the minimum fact set a MemoryMapped endpoint needs for a first
      verified plan; and how a numeric @address maps to a resource when no
      device description names it (reject, or a target-default linear MMIO
      region). The same facts decide the MD-077 § 12 binding category: Sec 0.1
      admits @address only for register types (fixed-address-bindings.md
      § 12), so whether such a binding is "ordinary addressed storage"
      (reference-compatible RAM, a P15 Place root) or a hardware register
      (HardwareInstance[T]) depends on the region's memory kind. Until
      decided, Sema types every @address binding as a hardware register, and
      the ordinary-addressed-storage branch of P15-42/42a is unreachable.
    classification: blocking
    status: open
  - id: MD-112
    area: hardware-special-write-non-trigger-values
    rulebooks:
      - rules/declarations/registers.md
      - rules/platform/hardware-register-access.md
    description: >-
      Open 2026-10-23 (raised while implementing MD-077 § 18(4)).
      registers.md § 11.3 and hardware-register-access.md §§ 4.4-4.9 define
      only the trigger value of the write-one/write-zero clear/set/toggle
      family, and MD-077 § 7(3) defers non-trigger semantics to those books,
      which do not define them. For a hardware-bound field it is undecided
      what a non-trigger constant (`self.Pending = false` on write-one-clear)
      or a runtime value (`self.Pending = flag`) requests. Until decided,
      Sema rejects both in hardware context and accepts only the trigger
      constant. Software (detached) registers are unaffected: there the field
      is ordinary bits (owner decision 2026-10-23, registers.md § 11.7).
      The trigger value of a multi-bit write-one/write-zero field
      (`Events: bit[4] write-one-clear`, where each written one usually
      clears its bit) is not defined either, so every write to such a field
      is rejected on hardware for now. Decide: whether a non-trigger constant
      is an error, a no-op request or something else; whether a runtime value
      is an error or a conditional action (with the branch made explicit in
      Semantic IR); and the per-bit trigger meaning of multi-bit fields.
    classification: localized
    status: open
  - id: MD-113
    area: hardware-shadow-knowledge-across-calls
    rulebooks:
      - rules/platform/hardware-register-access.md
      - rules/declarations/registers.md
    description: >-
      Open 2026-10-23 (raised while implementing MD-077 § 18(4)).
      hardware-register-access.md §§ 9.7-9.8 allow a shadow field to be read
      as a shadowed value only when its observed or intended state is known
      on the executing path; the compiler performs definite-shadow-state
      analysis "where possible" and may keep a runtime known mask when the
      state is path-dependent. Shadow state belongs to the instance and
      outlives a member call, so a getter such as `get Mode { return
      self.Mode }` on a shadow field cannot be proven known inside the
      member alone. The books do not say (1) whether the analysis is
      intra-member only (making such getters invalid unless the member first
      calls Read() or writes the field), interprocedural over the impl
      members, or runtime-checked with a known mask; (2) what a read does
      when the runtime mask says Unknown (§ 9.15 forbids an automatic
      refresh, so a fault, a compile-time rejection or a Result are the
      candidates); (3) whether a pending write intent makes the field Known
      for a following read (intended state) before Write(); and (4) the
      Unknown/Known state of every shadow field when the instance is bound
      (§ 9.8 forbids a fabricated initial value). Until decided, Sema
      resolves shadow fields' logical requests with their policy but does
      not check knowledge, and Semantic IR fails closed for hardware.
    classification: constraining
    status: open
  - id: MD-114
    area: sec-mlir-register-value-text-contract
    rulebooks:
      - rules/mlir/sec_mlir_dialect.md
      - rules/mlir/dialect-versions/sec_mlir_dialect_v11.md
    description: >-
      Open 2026-10-23 (raised by the MD-077 dialect work in mlir/). Dialect
      v11.41.1 fixes the names !sec.register<"m::T">, sec.register.extract /
      sec.register.update and requires a module-level register-definition
      table and a sec.field_path, but it does not spell the table, its
      records or the path, so neither the C++ verifier nor the Go emitter can
      be written without inventing normative text. Proposal for the detached
      value operations only (hardware records wait for MD-111): module
      attribute `sec.registers = [#sec.register_def<identity = "m::T",
      width = 32, order = "msb-first", byte_order = "big-endian" | absent,
      fields = [#sec.register_field<ordinal = 0, name = "Flag", offset = 31,
      width = 1, type = i1, access = "read-write", shadow = false,
      unit = absent, reserved = false>, ...]>]`, ordered by first use like the
      Semantic IR table; operation attribute `sec.field_path = [i32 ordinal,
      ...]` from the operand's register to the field (one step per nested
      register); sec.register.update additionally carries `sec.write_proof =
      #sec.register_write_proof<"typed" | "constant" | "interval", low, high>`
      mirroring Semantic IR. Decide: accept, amend or replace this text, so
      that it can be installed in v11.41.1 and its snapshot together.
      Decided 2026-10-27 (owner; rules/corrections/MD-114-canonical-
      register-value-mlir-contract-correction.md): the proposal is accepted
      with typed attributes; write proof keys are basis/low/high with
      arbitrary-precision decimal bounds, and MD-110 conversions resolve
      width through the same table. Rulebooks synchronized 2026-10-27
      (sec_mlir_dialect.md v11.41.1a and v11.41 table, v11 dialect and
      lowering snapshots, sec_mlir_lowering.md v11.30, semantic_ir.md
      § 21(7), package15 amendment, P15-42 note). The MD-110 `bit-extraction`
      MLIR basis stays with MD-110. Progress 2026-10-28: typed registry/field/proof attributes, layout/type/path
      verification, pure extract/update operations and Go emission now pass
      source/native tests through P5/P6/P8 in schemas 11/12 on both plans.
      Constant/source-domain from_bits and signed/unsigned to_bits share the
      registry. The complete conformance gate remains pending on the MD-110
      fits_bits destination-attribute spelling and bit-extraction proof
      transport; hardware endpoints remain MD-111. Unrepresented quantity
      carriers and additional arithmetic/CFG numeric-write evidence are
      explicitly rejected before emission under correction §§ 3(8), 7(8).
      The normative MD-114 decision is settled; no new design choices are
      requested here and P15 is not promoted.
    classification: localized
    status: decided-implementation-pending

  - id: MD-117
    area: stdlib-formatting-heterogeneous-argument-model
    rulebooks:
      - rules/library/stdlib.md
      - rules/library/core-library.md
      - rules/declarations/functions.md
      - rules/declarations/spread.md
      - rules/declarations/interfaces.md
      - rules/types/types.md
      - rules/compiler/semantic_ir.md
      - rules/compiler/monomorphization.md
      - rules/platform/ffi.md
    description: >-
      Opened 2026-10-26 while investigating the desired native call
      `fmt.Printf("str", strVal, intVal, boolVal)`. No such public API exists:
      sec/stdlib/fmt/fmt.sec currently exports only Println(value: string).
      The similarly intended log stubs use bare `args...`, which is invalid
      Sec syntax; `go run ./cmd/compiler sema sec/stdlib/log/log.sec` reports
      sixteen parse errors because a native variadic parameter must be written
      `name: ...T`. Under functions.md §§28-38, every captured native variadic
      argument must satisfy the one element type T, so `...T` cannot directly
      carry a string, integer and bool as one heterogeneous pack.

      Core-library.md §15 deliberately leaves a higher-level strongly typed
      formatting API and its format grammar for later. Decide its public
      `fmt` surface (including the spelling and result/error contract of
      text materialization versus output), the literal-format validation and
      runtime-invalid-format behavior, and the closed argument model. In
      particular decide whether formatting uses an explicit nominal/tagged
      FormatArg carrier with explicit conversions, a narrowly specified
      compiler-known format-argument pack, or another statically typed
      mechanism. The decision must define per-argument evaluation order,
      ownership/borrowing and cleanup, allocation and StringError/IO-error
      behavior, supported builtin and user-defined formatting participation,
      spread behavior, Semantic IR facts, lowering, diagnostics and tooling.

      Do not solve this by making native `...T` untyped, by introducing an
      implicit `any` conversion, or by relying on generic type erasure or
      implicit boxing: those conflict with the current typed-variadic and
      monomorphization contracts. C Printf is a separate unsafe foreign
      variadic call: it requires C-ABI-representable and promoted arguments,
      an explicit foreign text representation, and never supplies the native
      `fmt.Printf` contract. The primary future governance owner is
      governance/stdlib.yaml; types, sema, lowering and ffi are affected only
      through the chosen design rather than as duplicate owners.

      Language mechanism decided 2026-10-26
      (rules/corrections/md117-heterogeneous-variadic-type-packs-correction.md):
      heterogeneous native variadic type packs `[...Types]` with
      `...Types` / `...ref Types` / `...ref mut Types`, statically known
      heterogeneous arity, ordinary `for` iteration with unchanged binding
      modes, non-consuming `values...` plus whole-pack consuming
      `<-values...`, caller-origin reference return under the ordinary
      provenance model, ordered-type-sequence specialization identity and
      Semantic IR facts; no `fmt`-specific language rule. Rulebooks
      synchronized 2026-10-27 (functions.md § 33 example and § 38A,
      generics.md §§ 16/16A/31, spread.md § 4.4, flowcontrol_for.md § 13A,
      references.md § 9(11), borrowing.md § 15.5, lifetime_analysis.md
      § 14.1(4), copy_move.md § 8.3(5), semantic_ir.md § 27A,
      monomorphization.md § 9.1, generics_lowering.md §§ 3/7, stdlib.md fmt,
      core-library.md § 15, ffi.md § 26; package25 § 22 amendment and
      P25-27a). Kept open per the correction's § 14(7) until governance and
      the parser/Sema/IR/lowering/tooling implementation pass their tests.
      The public fmt API and format contract moved to MD-118; the
      dereference spelling of pack-carried references to MD-119.
      Governance synchronized 2026-10-28 under stdlib.fmt (originating
      dependency), existing generics/functions/spread/for-loop/ownership/
      lifetime/Semantic IR/ABI owners and frontend.ffi-v2. Feature-specific
      parser and Sema work stays with frontend.generics-v2 and
      frontend.functions-v2 rather than duplicate parser/sema integration IDs.
      A fresh parser probe still rejects [...Types]; implementation remains
      pending and neither MD-118 nor MD-119 is resolved.
    classification: architectural
    status: decided-implementation-pending

  - id: MD-118
    area: stdlib-fmt-public-api
    rulebooks:
      - rules/library/stdlib.md
      - rules/library/core-library.md
    description: >-
      Split from MD-117 on 2026-10-27 (MD-117 correction §§ 1(5), 14(7)). The
      language now supplies heterogeneous native variadic type packs
      (functions.md § 38A), so a statically typed `fmt.Printf("…", s, i, b)`
      can be written as an ordinary generic function. Decide the public `fmt`
      surface: function names and signatures (output versus text
      materialization), the format grammar, literal-format validation and
      runtime-invalid-format behavior, the result/error contract
      (StringError, IO errors), output destinations, allocation and
      materialization, and which builtin and user-defined types participate
      through which existing operation (for example ToString) — without any
      `fmt`-specific language rule, implicit `any`, boxing or structural
      FormatArg interface. Governance owner: governance/stdlib.yaml.
    classification: constraining
    status: open

  - id: MD-119
    area: pack-carried-reference-dereference-spelling
    rulebooks:
      - rules/memory/references.md
      - rules/declarations/functions.md
    description: >-
      Split from MD-117 on 2026-10-27 (MD-117 correction § 8(6)). MD-117
      decides which caller-origin references carried by a `...ref Types` /
      `...ref mut Types` pack may be returned or forwarded, but explicitly not
      how the access is spelled: `value`, `*value` or another form. Decide the
      dereference expression rule for pack elements (and whether it differs
      from ordinary reference parameters) in the references/expressions
      rulebook, without changing the MD-117 provenance decision.
    classification: localized
    status: open
