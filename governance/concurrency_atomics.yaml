schema_version: 1
area: concurrency-atomics
purpose: Atomic operations and concurrency memory ordering.
integrations:
  - id: concurrency.atomics-v2
    area: atomic-language-surface
    rulebook: rules/concurrency/atomics.md
    status: partial
    normative:
      - Atomic[T] is a compiler-known nominal generic atomic-storage type.
      - Atomic eligibility is semantic and separate from concrete CompilationPlan capability.
      - The v0.1 compatible set is bool, primitive signed/unsigned integers, RawPtr[T], integer-backed enums, and compatible named types.
      - float/float32/float64, decimal/decimal128, arbitrary structs/unions/collections and other composites are not atomic-compatible in v0.1.
      - All public atomic methods use CamelCase.
      - MemoryOrder is exactly Relaxed, Acquire, Release, AcqRel, SeqCst.
      - CompareExchangeResult[T] is exactly Exchanged | NotExchanged(T).
      - CompareExchange mismatch is normal control flow, not an error.
      - CompareExchange failure orders are Relaxed/Acquire/SeqCst only.
      - Failure ordering is not required to be weaker than success ordering.
      - SeqCst is the default for ordinary atomic object operations.
      - "atomic.Fence(order: MemoryOrder) exists in v0.1, has no default, and rejects Relaxed."
      - Explicit MemoryOrder arguments are SemanticCompileTimeRequiredContext values; runtime-dependent orders are rejected, while omitted ordinary operation orders remain SeqCst.
    remaining:
      - Implement atomic.Fence lowering below Semantic IR (Sec MLIR has no fence operation yet; name resolution, Sema and the Semantic IR atomic.fence operation exist since 2026-10-17); record the fence as an ordering effect in call-graph/effect summaries.
      - "Add target diagnostics for unsupported concrete operation/order combinations, including Sema's resolved execution-context requirement production and integration with plan-side nonblocking/ISR validation (blocked on MD-095: requirement key conventions)."
    required_tests:
      - id: memory-order-core-enum
        expectation: Core exposes exactly Relaxed, Acquire, Release, AcqRel, SeqCst and LSP hover shows the declaration.
      - id: compare-exchange-result-core-enum
        expectation: Core exposes generic Exchanged and NotExchanged(T); LSP and Sema recognize payload typing.
      - id: atomic-public-naming
        expectation: Load/Store/Swap/CompareExchange/FetchAdd/FetchSub/FetchAnd/FetchOr/FetchXor are canonical; lowercase alternates are rejected/not offered.
      - id: atomic-type-eligibility
        expectation: Conservative v0.1 eligible set is enforced independently of target bit width.
      - id: atomic-float-reject
        expectation: Atomic[float64] is rejected as a language type in v0.1 even if target representation could be atomic.
      - id: atomic-decimal-reject
        expectation: Atomic[decimal] is rejected as a language type in v0.1.
      - id: atomic-struct-reject
        expectation: Arbitrary struct does not become atomic-compatible from matching machine width.
      - id: atomic-target-separation
        expectation: Semantically valid Atomic[uint64] can still produce target operation capability failure without being reclassified as an invalid type.
      - id: compare-exchange-failure-orders
        expectation: Relaxed/Acquire/SeqCst accepted; Release/AcqRel rejected.
      - id: compare-exchange-independent-orders
        expectation: Valid failure order is not rejected merely for being stronger than success order.
      - id: atomic-fence
        expectation: atomic.Fence requires explicit Acquire/Release/AcqRel/SeqCst and rejects Relaxed.
      - Explicit order arguments must be compile-time-established MemoryOrder values; runtime parameters and mutable or runtime-derived aliases are rejected, and unavailable semantic CTE call execution is diagnosed distinctly.
    corrections_applied:
      - rules/corrections/applied/atomics-memory-model-v2-cross-rulebook-correction-20260907.md
      - rules/corrections/applied/atomic-orders-compile-time-correction-20261017.md
    implemented:
      - canonical MemoryOrder is a real core enum with exactly Relaxed, Acquire, Release, AcqRel and SeqCst; standalone semantic registration and the trusted source declaration share its reserved nominal identity, and LSP presents the closed declaration, variant documentation and source navigation
      - atomic member lookup uses Load, Store, Swap, CompareExchange, FetchAdd, FetchSub, FetchAnd, FetchOr and FetchXor; lowercase alternatives are rejected, and the shared compiler member catalog supplies the canonical names to hover and completion
      - "Atomic element eligibility is target-independent: bool, signed and unsigned integer carriers including target-sized and wide integers, RawPtr, integer-backed enums and compatible named carriers pass semantic checking on 32-bit and 64-bit plans; floats, decimals, strings, string-backed enums and composites remain invalid; this does not claim native, lock-free or emulated operation support"
      - "One canonical per-T applicability check governs Sema and compiler member facts: eligible carriers expose Load, Store, Swap and CompareExchange; unconstrained integer carriers also expose all five fetch operations, while bool, raw pointers, integer enums and constrained named integers (including inherited constraints) reject fetch operations and omit them from completion; nominal result types and shared-reference receivers are preserved independently of target width, and the non-generic methods reject method type arguments"
      - The shared exact MemoryOrder matrix validates every explicit order on Atomic object methods before lowering and supplies operation-specific hover documentation; Load and Store reject their invalid rows, all RMW success orders are allowed, CompareExchange failure is independently Relaxed/Acquire/SeqCst with no relative-strength restriction, and omitted orders remain SeqCst. Explicit orders must be compile-time-established canonical MemoryOrder values, including immutable aliases; runtime-dependent values are rejected with S1170 and unavailable semantic CTE execution remains S1101. The shared fence row is defined and tested; the separately listed fence source/IR/lowering pipeline is not claimed implemented.
      - Atomic[T] has one compiler-owned nominal core identity with opaque storage and exactly one contained type. Canonical constructor inference preserves that identity, uses a contextual T for literals and enforces ordinary nominal/range contracts; source struct fabrication, wrong arity, type redeclaration and untrusted impl replacement are rejected, including module-core spoofing. Compiler-owned AtomicTypeFacts and resolved type/constructor positions supply the same exact per-T public signatures to type-use, binding and constructor hover; template hover explicitly documents integer-only availability, and all nine public methods retain canonical synthetic navigation. This completes the compiler/LSP API identity surface without claiming CompareExchangeResult payloads, atomic IR, lowering or target capability.
      - "CompareExchange success/failure typing and observed-value transfer (governance sync 2026-10-17): implemented by the ResolvedCompareExchangeOf path facts recorded in frontend.atomics-v2 — CompareExchangeResult[T] result, Exchanged as RMW success, NotExchanged(T) carrying the value observed by the same operation, independent success/failure orders (TestCompareExchangePaths, TestCompareExchangeResultSurface); the stale remaining entry is closed"
      - "documentation and tooling synchronized (2026-10-17): `atomic.` completes the core namespace function Fence (a local value named atomic keeps member completion), MemoryOrder completion inside atomic.Fence(...) offers only Acquire, Release, AcqRel and SeqCst, fence hover and synthetic navigation present the canonical surface, and the formatter is idempotent on every atomic fixture, keeps CamelCase operations, explicit orders and fence calls and never inserts an omitted SeqCst (TestAtomicFenceCompletion, TestAtomicFenceHoverAndNavigation, TestAtomicSourceFormatting); the rulebook status row names the implemented surface"
      - "atomic.Fence (2026-10-17): calls of atomic.Fence resolve in the core atomic namespace (a local value named atomic keeps ordinary method lookup); exactly one explicit MemoryOrder argument is required (no default), established as a compile-time AtomicMemoryOrderArgument through the shared order evaluation, and checked against the shared Fence row Acquire/Release/AcqRel/SeqCst; Relaxed, a missing order, a runtime-dependent order and a non-MemoryOrder argument are rejected (S1171/S1170) with the canonical message `MemoryOrder.Relaxed is not valid for atomic.Fence`; the call is void and Sema retains its order (AtomicFenceOrderOf) for later IR (internal/sema/atomic_fence.go; TestAtomicFenceSurface)"
      - The canonical generic CompareExchangeResult[T] enum is a real trusted core declaration with exactly Exchanged and NotExchanged(T), preserving nominal core identity and source provenance. Parser/AST retain its one associated payload without extending ordinary enum syntax; Sema validates the exact declaration, one type argument, normal non-error status, exact nominal payload construction/binding and exhaustive matching. Atomic calls and member metadata return this same closed enum rather than a struct stub. Existing tagged-value Semantic IR preserves both construction variants and payload extraction; legacy LLVM retains its explicit unsupported-sum-representation diagnostic. Exchanged is the enum default. Formatter round trips retain the source shape; LSP exposes enum/variant documentation, concrete payload hover, closed completion, canonical type/variant navigation and correct local payload-binding navigation.
