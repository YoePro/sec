- id: types.contracts-v2.conjunction
  status: partial
  summary: 'All contracts on a named type are normative conjunctions, but the current consistency analysis
    does not reason over every repeated constraint.

    '
  rules:
  - rules/types/contracts.md
  implemented:
  - checkContractSetConsistency performs cross-contract consistency checks for supported cases.
  - Existing tests cover at least a single range combined with a single multipleOf constraint.
  evidence:
    source:
    - internal/sema/contracts.go
    tests:
    - internal/sema/analyzer_test.go
  remaining:
  - Repeated RangeContract values are not all retained when consistency is evaluated.
  - Repeated MultipleOfContract values are not all retained and combined when consistency is evaluated.
  - Complete conjunction reasoning for all repeated constraints.
  identified_bugs:
  - id: types.contracts-v2.bug.repeated-range-overwrite
    severity: high
    description: checkContractSetConsistency() retains only one RangeContract while scanning the contract
      set, so earlier repeated range constraints can be lost.
    expected: All range constraints on a named type are conjunctive and must participate in satisfiability
      analysis.
    actual: A later range replaces the previously remembered range in consistency analysis, allowing contradictions
      between repeated ranges to escape detection.
    affected_components:
    - internal/sema/contracts.go
    - checkContractSetConsistency()
    fix_guidance:
    - Accumulate/intersect all range constraints rather than storing only the last one.
    - Track inclusive/exclusive and open bounds when calculating the effective interval.
    - Diagnose an empty effective interval as an unsatisfiable contract set.
    regression_tests:
    - Accept two compatible range constraints.
    - Reject two disjoint range constraints.
    - Reject contradictions involving open/exclusive bounds.
    - Verify declaration order does not change the result.
  - id: types.contracts-v2.bug.repeated-multipleof-overwrite
    severity: high
    description: checkContractSetConsistency() retains only one MultipleOfContract while scanning the
      contract set, so repeated divisibility constraints are not fully combined.
    expected: All multipleOf constraints are conjunctive and the effective divisibility requirement must
      be considered together with ranges and other contracts.
    actual: A later multipleOf value replaces the earlier remembered value, so the analyzer can miss contract
      sets whose combined divisibility requirements are impossible inside the permitted value domain.
    affected_components:
    - internal/sema/contracts.go
    - checkContractSetConsistency()
    fix_guidance:
    - Combine repeated multipleOf requirements instead of replacing earlier values.
    - For integral domains, derive an effective requirement using checked LCM-style reasoning where valid.
    - Combine the effective divisibility requirement with range/membership constraints during satisfiability
      analysis.
    - Avoid overflow in any compile-time arithmetic used by the consistency checker.
    regression_tests:
    - Accept compatible repeated multipleOf constraints.
    - Reject a bounded contract set with no value satisfying all multipleOf constraints.
    - Verify declaration order does not change the result.
    - Exercise overflow-safe handling of large divisors.
- id: types.contracts-v2.unsatisfiable
  status: partial
  summary: 'Provably unsatisfiable contract sets must be rejected, but current analysis can miss contradictions
    when several constraints of the same category are present.

    '
  rules:
  - rules/types/contracts.md
  implemented:
  - Some statically provable contradictions are diagnosed.
  evidence:
    source:
    - internal/sema/contracts.go
    tests:
    - internal/sema/analyzer_test.go
  remaining:
  - Contradictory repeated ranges can escape because only one range is retained by the consistency check.
  - Combined multipleOf constraints can escape because the check does not compute the effective combined
    divisibility requirement.
  - General rejection of every contract set that the compiler can prove unsatisfiable.
  - Resolve identified bugs types.contracts-v2.bug.repeated-range-overwrite and types.contracts-v2.bug.repeated-multipleof-overwrite.
  identified_bugs: []
  bug_refs:
  - types.contracts-v2.bug.repeated-range-overwrite
  - types.contracts-v2.bug.repeated-multipleof-overwrite
