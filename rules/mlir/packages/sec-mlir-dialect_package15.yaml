package:
  id: SEC-MLIR-P15
  name: Safe Place and Direct Reference Semantic Core
  repository: https://github.com/YoePro/sec
  branch: main
  repository_sync_commit: 152c772
  repository_sync_date: '2026-08-09'
  local_predecessors:
  - SEC-MLIR-P13
  - SEC-MLIR-P14
  semantic_ir_version_before: 1
  semantic_ir_version_after: 1
  sec_mlir_schema_before: 10
  sec_mlir_schema_after: 11
  lowering_spec_before: 10
  lowering_spec_after: 11
  goal: Canonical places and direct safe references with provenance, borrowing and
    epoch dependencies, without physical pointer/reference layout.
  next_package: Slice Semantic Value Representation
normative_updates:
- repository_paths:
  - rules/memory/references.txt
  - rules/errors/runtime_checks.md
  - rules/memory/reference_model.md
  - rules/errors/panic.md
  supplied_file: sec_reference_sync_package15.md
- repository_path: rules/compiler/semantic_ir.txt
  supplied_file: sec_semantic_ir_place_reference_package15.md
- repository_path: rules/mlir/sec_mlir_dialect.md
  supplied_file: sec_mlir_dialect_package15.md
  schema_version: 11
- repository_path: rules/mlir/sec_mlir_lowering.md
  supplied_file: sec_mlir_lowering_package15.md
  version: 11
rule_sync:
  reference_validity: static proof or dynamic validation; not compile-time-only
  ordinary_stale_direct_reference: panic/target trap safety failure
  ordinary_stale_panic_id: panic.invalid-reference-generation
  ordinary_direct_reference_try_error: false
  stable_weak_handle_resolution: future fallible Option/Result
  default_logical_epoch_bits: 64
  epoch_width_runtime_selected: false
place_model:
  reuse_existing_sema_place: true
  new_ids:
  - PlaceRootID
  - StorageIdentityID
  - InvalidationDomainID
  - EpochDependencyID
  - BorrowID
  - LifetimeID
  - AddressSpaceID
  root_identity: stable compiler identity, not source name
  constant_index: arbitrary precision
  dynamic_index: symbolic/resolved identity
  relationships:
  - same
  - disjoint
  - contains
  - contained-by
  - potentially-overlapping
  - unknown
  projections_p15:
  - field
  - constant-index
  - dynamic-index
  - union-payload
  - dereference
  finite_origin_sets: true
  runtime_origin_tag: false
reference_model:
  implemented_kinds:
  - shared-direct
  - mutable-direct
  source_types:
  - ref T
  - ref mut T
  shared_copy_classification: CopyTrivial
  mutable_copy_classification: MoveOnly
  safe_non_null: true
  owns_referent: false
  validity_policies:
  - proven
  - dynamic-epoch
  generation_is_complete_safety: false
  reference_facts:
  - origin places
  - storage identities
  - address space
  - borrow ID
  - lifetime ID
  - authority
  - epoch dependency
  - relocation class
  - provenance
epoch_policy:
  default_logical_bits: 64
  independent_of_pointer_width: true
  shorter_width: compile-time only with proof/exhaustion strategy
  runtime_width_selection: false
  physical_epoch_field_required: false
  generation_wrap_allowed: false
sema:
  queries:
  - ResolvedPlaceOf(ast.Expression)
  - ResolvedReferencePlanOf(reference/reborrow AST node)
  - ResolvedReferenceUsePlan or equivalent
  queries_read_only: true
  builder_must_not_rerun_borrow_checker: true
  place_relationship_shared_by:
  - borrowing
  - copy/move
  - lifetime
  - destruction
  - future data-race analysis
semantic_ir:
  version_bump: false
  new_types_or_facts:
  - PlaceID/PlaceRootID
  - ReferenceFacts
  - StorageIdentity
  - InvalidationDomain
  - EpochDependency
  - BorrowID
  - LifetimeID
  place_ops:
  - PlaceValueRootOp
  - PlaceStorageRootOp
  - PlaceFieldOp
  - PlaceArrayIndexInBoundsOp
  - PlaceArrayElementOp
  - PlaceUnionPayloadOp
  - ReferenceDerefPlaceOp
  - PlaceReadOp
  - PlaceWriteOp
  reference_ops:
  - ReferenceBorrowSharedOp
  - ReferenceBorrowMutableOp
  - ReferenceCopySharedOp
  - ReferenceMoveOp
  - ReferenceReborrowSharedOp
  - ReferenceReborrowMutableOp
  - ReferenceIsValidOp
  - ReferenceCompareOp
  - ReferenceEndBorrowOp
  - ReferenceGenerationFailureOp
  physical_representation: false
dialect:
  schema_version: 11
  types:
  - '!sec.place<T,"ro">'
  - '!sec.place<T,"rw">'
  - '!sec.ref<T>'
  - '!sec.ref_mut<T>'
  place_ops:
  - sec.place.value
  - sec.place.storage
  - sec.place.field
  - sec.place.array_index_in_bounds
  - sec.place.array_element
  - sec.place.union_payload
  - sec.place.deref
  - sec.place.read
  - sec.place.write
  reference_ops:
  - sec.ref.borrow_shared
  - sec.ref.borrow_mut
  - sec.ref.copy_shared
  - sec.ref.move
  - sec.ref.reborrow_shared
  - sec.ref.reborrow_mut
  - sec.ref.is_valid
  - sec.ref.compare
  - sec.ref.end_borrow
  - sec.fail.reference_generation
  verifiers:
  - --sec-verify-places
  - --sec-verify-reference-guards
  - --sec-verify-borrow-semantics
  physical_reference_layout: false
validity_flow:
  proven: no required runtime validation
  dynamic:
  - sec.ref.is_valid
  - cf.cond_br
  - false -> sec.fail.reference_generation
  - true -> reference use
  panic_id: panic.invalid-reference-generation
  result_error: false
ownership_boundary:
  whole_value_read: CopyTrivial only
  write_replacement: CopyTrivial + TriviallyDestructible only
  ref_mut_copy: false
  ref_mut_move: true
  shared_copy: true
  referent_ownership_transfer: false
compatibility:
  p5: address-taken/reference-dependent storage remains high-level
  p6: scalar target resolution may recurse through referent type while preserving
    wrappers
  p8: signless normalization does not recurse through place/ref wrappers
  p11: union payload place uses active variant proof
  p12: ref/ref-mut match payload bindings enabled for supported payload places
  p13: struct field borrowing uses semantic field places
  p14: fixed-array element borrowing reuses bounds/index plans and arbitrary precision
deferred:
- slices
- stable handles
- weak handles
- slot-table resolution
- RawPtr-to-ref
- ref-to-RawPtr FFI conversion
- physical pinning
- physical epoch storage
- allocation/arena/collection epoch transition lowering
- concurrent invalidation protocol
- non-trivial reference reads/writes
- physical pointer/reference ABI
- LLVM
tests:
  place:
  - stable root identity
  - arbitrary precision constant indexes
  - field disjointness
  - constant array index disjointness
  - dynamic index overlap
  - alternative origin sets
  - union/deref projections
  reference:
  - shared borrow
  - mutable borrow
  - shared copy
  - mutable copy rejected
  - mutable move
  - shared reborrow
  - mutable reborrow
  - authority narrowing
  - return origin
  - borrow end
  epoch:
  - proven local
  - dynamic epoch
  - 64-bit default on 32-bit
  - 64-bit default on 64-bit
  - short width proof gate
  guard:
  - proven no guard
  - dynamic correct guard
  - wrong reference guard rejected
  - false path deref rejected
  - failure endpoint required
  integration:
  - struct field ref
  - distinct mutable struct fields
  - fixed-array constant element ref
  - fixed-array dynamic element ref
  - match payload ref
  - ref parameter
  - ref mut parameter
  - returned input ref
  regression:
  - check-sec-mlir
  - go test ./...
  - legacy paths
acceptance:
- reference sync applied
- semantic amendment applied
- schema v11
- lowering v11
- stable place roots
- arbitrary precision place indexes
- canonical place relationships
- storage/invalidation/epoch identities
- read-only place/reference plans
- ReferenceFacts
- proven/dynamic validity
- 64-bit logical epoch default
- shared copy/mutable move
- place/ref Semantic IR ops
- place/ref MLIR ops
- three verifiers
- P5 address-taken guard
- P13 field borrow
- P14 array element borrow
- P12 match borrow
- ordinary stale ref panic semantics
- no direct-ref Result error
- no slices/handles/raw collapse
- no physical reference layout
- no mandatory runtime
- check-sec-mlir
- go test ./...
package16:
  name: Slice Semantic Value Representation
  scope:
  - ref T[]
  - mutable slice form
  - slice origin/reference facts
  - array-to-slice borrow
  - subslice narrowing
  - empty slice
  - slice index place
  - bounds/range checks
  - IndexError/RangeError flow
  - slice len
  - high-level slice type/ops
  deferred:
  - dynamic owning T[]
  - physical pointer+length descriptor
  - stable/weak handles
  - LLVM
