      - "visible-declaration shadowing (2026-10-04): one lookup of the unqualified visible scope (the current module's first top-level declaration per name from the module namespace pass, accessible always-available core declarations, and uppercase compiler-known types such as Event; units excluded; declarations of imported modules count only qualified, rule §17) now drives parameters, setter value parameters, generic parameters, and locals. Parameters report S1104 names.parameter-shadows-declaration for visible generic parameters, functions, and module variables and S1040 for types; generic parameters report S1105 names.generic-parameter-shadows-declaration or S1039; locals keep S1057. Every diagnostic points at the hidden declaration when it has a source location. Lowercase always-available type spellings (error, duration, ...) stay usable as bindings, as in `Err(error)`. LSP rename inherits the rules through its re-analysis safety check. Tests: internal/sema/shadowing_visible_declarations_test.go"
