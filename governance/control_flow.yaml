      - complete the revision-2.0 parser, Sema, ownership, borrowing, flow, cleanup, formatter, diagnostics, LSP, Semantic IR, and backend regression matrix
      - "MD-057 borrowed iterator views (flowcontrol_for.md § 37.1). Sema implemented 2026-10-18: `for value in values` over `values: ref mut Iterator[T]` yields T with a ResolvedForIteration whose Source is borrowed-interface-view, records the Next call as an interface graph call, and rejects a shared ref Iterator[T] source. Known hole (verified 2026-10-18): Semantic IR/lowering of runtime Next dispatch is not implemented; readiness reports it as Unproven with the reason naming the missing view representation (MD-108)"
    excluded:
