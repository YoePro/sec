    implemented:
      - AST represents MatchExpression, MatchStatement, and MatchArm
      - parser supports match in statement and expression positions
      - parser supports expression, return, and block arm bodies
      - parser supports underscore catch-all and payload-discard spelling such as Ok underscore
      - parser supports return match and where guards
      - Sema requires bool guards and guarded arms do not independently exhaust their pattern
      - direct equality guards over a whole closed-enum payload jointly cover their outer variant once every underlying enum value class is covered
      - Sema supports Result Ok and Err matching with payload bindings
      - Sema supports Option Some and None matching
      - qualified payload-less generic union patterns such as Option.None resolve through the concrete match subject type
      - Sema supports named union variants with positional payload bindings
      - explicit whole-payload ref and ref mut bindings work for reusable union and Result subjects
      - branch-scoped payload borrows use active-variant Places and enforce overlap and escape restrictions
      - ordinary enum variant matching is supported
      - enum aliases normalize to integer/string underlying value classes for coverage
      - open bit-backed enum exhaustiveness uses the complete representable domain
      - Result and enum exhaustiveness are checked
      - duplicate and unreachable match arms are diagnosed in implemented cases
      - MatchArm stores a closed MatchPattern AST instead of an arbitrary expression pattern
      - parser accepts only catch-all, compiler-known empty, variant, one whole-payload binding, and shallow named-field patterns
      - parser rejects boolean, literal, range, alternative, nested, and arbitrary expression patterns, with focused guidance for boolean, literal, range, and nested cases and arm-level recovery
      - parser diagnoses empty variant-pattern parentheses generically and explains the bare payload-less form versus the required single payload binding, including for Option None and user-defined unions
      - formatter normalizes only structurally proven canonical match patterns and leaves invalid expression-like patterns unchanged
      - empty zero-arm matches are rejected
      - catch-all hiding Result Err is rejected in implemented error-sensitive cases
      - expression matches infer a common branch type
      - exhaustive expression matches whose reachable arms all return or otherwise terminate resolve to never, require no arm result value, and retain terminating flow in ResolvedMatchPlan
      - move-only whole payloads move from reusable owned union subjects
      - copyable whole payloads copy and temporary payloads forward
      - statement and expression match ownership availability is merged and may invalidate the whole subject
      - union rules normatively define shallow named-field destructuring, rename, field borrows, and compiler-known empty
      - Semantic IR records Sema-resolved match plans and explicit source-order enum, union, Result, and Option CFG
      - implemented match CFG evaluates the subject once and preserves guard-false continuation
      - copy-trivial whole payload bindings and discard lower after successful union, Option, or Result discrimination
      - expression matches use typed SSA merge values and statement matches use zero-argument continuation or all-terminating control flow
      - canonical revision-2 match grammar and contextual arm-block semantics are documented
      - ownership.md now specifies whole-payload actions, borrowed-subject restrictions, guarded move commit, field copy-only behavior, and post-match merging
      - unions.md now explicitly restricts shallow by-value fields to implicitly copyable types
      - semantic_ir.md now specifies complete resolved match binding actions, guarded commit ordering, arm results, discard, and availability facts
      - lsp.md now requires compiler-owned match binding, guarded move, availability, coverage, hover, hint, completion, and refactoring facts
      - implementation status was removed from the normative match rulebook and migrated here
      - parser and Sema accept Err(_) as an exhaustive Result error-payload discard in match arms and try handlers
      - Sema rejects direct bool match subjects once at the subject with focused guidance to use if and else; LSP reports the same shared diagnostic
    remaining:
      - implement compiler-known empty union patterns and include reachable empty state in definite-assignment, coverage, Semantic IR, MLIR, diagnostics, and LSP facts without treating moved-from as empty
      - complete ownership, destruction, Semantic IR, lowering, and LSP facts for discarded Err payloads beyond the represented frontend subset
      - derive statement-match termination from ResolvedMatchPlan so exhaustive Option, union, enum-alias, open-bit-enum, and nested matches agree with return and reachability analysis
      - implement shallow named-field union destructuring with partial binding, rename, ref and ref mut modes
      - enforce copy-only shallow by-value fields and reject move-only fields without hidden partial moves
      - make every whole-payload plain binding action explicitly resolve to copy, legal move, or temporary forwarding without silent borrow or clone
      - reject move-only payload transfer from ref and ref mut subjects unless an explicit permitted pattern borrow is used
      - delay guarded move-only binding commitment until guard success and retain ownership on the guard-false continuation
      - reject consuming use of a prospective move-only payload binding inside its guard
      - retain precise Moved, PartiallyAvailable, and ConditionallyAvailable states and provenance across every continuing arm
      - apply ordinary discardability and must-use rules to statement-match arm results rather than erasing produced values
      - implement contextual final-expression values for block arms in expression-match result position on every continuing path
      - establish move-only arm-result ownership before arm-scope cleanup
      - expose compiler-resolved binding action, prospective guarded move, commit location, post-match availability, and coverage through LSP hover, diagnostics, hints, completion, and refactoring
      - extend ResolvedMatchPlan and CFG binding actions beyond none, discard, and copy-trivial to Move, SharedBorrow, MutableBorrow, TemporaryForward, field bindings, guard-success commit, and ownership merges
      - extend explicit source-order CFG with reachable compiler-known empty state once frontend initialization-state facts exist
      - extend statement-match continuation with non-trivial ownership, cleanup, and discard effects
      - complete parser, Sema, ownership, borrowing, formatter, diagnostics, LSP, Semantic IR, MLIR, LLVM, and end-to-end coverage
    required_tests:
      - match subject expression evaluates exactly once
      - source arm order is preserved
      - guard evaluates only after matching pattern
      - guard false continues to later arm
      - guarded arm alone does not exhaust its variant
      - empty match is rejected
      - direct bool match is rejected
      - general literal match pattern is rejected
      - range match pattern is rejected
      - ordinary enum match uses unique underlying value classes for coverage
      - ordinary enum aliases are duplicate or unreachable by normalized value class
      - open bit-backed enum requires coverage of complete bit domain or catch-all
      - Result match requires explicit Err handling
      - Err underscore is accepted as explicit error-payload discard
      - named Err payload plus explicit discard is accepted when discardable
      - Option Some and None exhaustiveness
      - empty payload parentheses in Option and user-defined union match patterns receive focused variant guidance
      - reachable union empty state participates in exhaustiveness
      - proven initialized union does not require empty arm
      - underscore covers reachable empty state
      - moved-from union is not treated as empty
      - whole payload plain binding copies copyable payload
      - whole payload plain binding moves move-only payload from reusable owned subject
      - whole payload temporary is forwarded without reusable moved-from binding
      - shared borrowed subject cannot move move-only payload
      - mutable borrowed subject cannot move move-only payload
      - whole payload ref binding is branch-scoped
      - whole payload ref-mut binding requires mutable authority
      - shallow named-field destructuring supports partial binding
      - shallow named-field destructuring supports rename
      - shallow field ref and ref-mut binding follow borrow rules
      - move-only shallow field by-value binding is rejected
      - guarded move-only whole-payload binding does not move on pattern success alone
      - guard false preserves subject ownership except actual guard side effects
      - consuming use of prospective move-only guard binding is rejected
      - guard true commits move before arm body consuming use
      - post-match ownership merge rejects use after Available plus Moved paths
      - terminating moved arm does not poison a non-existent post-match path
      - statement match ordinary discardable call result follows discard rules
      - statement match must-use arm result cannot be implicitly discarded
      - expression match single-expression arms produce common type
      - expression match block final expression produces arm value
      - expression match block terminating subpath need not produce value
      - expression match block continuing void final expression is rejected
      - move-only final arm expression transfers ownership to match result before cleanup
      - duplicate unguarded patterns are rejected
      - arm after unguarded catch-all is rejected
      - guarded arm after same unguarded variant is rejected as unreachable
      - pattern alternatives remain rejected
      - nested recursive destructuring remains rejected
      - ordinary struct-subject destructuring remains rejected
      - LSP hover exposes copy, move, ref, and ref-mut match binding mode from compiler facts
      - LSP distinguishes prospective guarded move from committed move
      - LSP publishes compiler use-after-match-move diagnostics with related move arm
