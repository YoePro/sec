    remaining: []
    implemented:
      - "MLG-1 (2026-11-16; generics.md sections 5.6, 8-9, 30): instance and static method generic declarations use the existing nested generic-scope registration/body path instead of an unconditional unsupported-method gate. The owner parameters remain visible with their declared constraints; method parameters retain their separate ordered header, constraints and declaration identities. Name collisions with enclosing generic parameters and duplicates are diagnosed; method parameters do not leak to sibling methods or module declarations. Source tests verify registered signatures, generic type arguments, owner/method constraint separation, definition links, static versus instance category and scope restoration on all analysis depths and 32/64-bit plans. Removed only the obsolete unsupported-method expectations from existing invalid-fixture tests. Complete body-validity, call inference/overloads, conformance, specialization identity and IR lowering remain MLG-2 through MLG-7."
      - "MLG-2 verified and closed (2026-11-16; generics.md sections 9, 12-15, 33; monomorphization.md sections 5.1-5.3): the existing template body checker, enabled for ordinary generic methods by MLG-1, validates unused instance/static methods under the separate declared owner and method constraints. Constraint conjunctions, owner-dependent generic interface results, forwarding with explicit transfer and mutable-reference requirements retain their ordinary rules. New source regressions prove eight calls resolve to their template constraint receiver, reject unconstrained/undeclared members and unsupported generic arithmetic, prevent owner guarantees from leaking to method parameters, and reject mutation through a shared reference. A nongeneric owner method remains invalid when demanded twice with a concrete type that has the undeclared member; the template error is emitted once, and both concrete call targets are independently verified. All three analysis depths and 32/64-bit plans are covered. No new body engine or concrete duck typing was introduced; implementation traceability was clarified. Call-inference completeness, overloads, conformance, identity, lowering and tooling remain MLG-3 through MLG-8."
      - "MLG-3 (2026-11-16; generics.md sections 9, 18, 20, 25): method calls bind the owner environment before method argument inference. Explicit arguments address only the method parameter list; positional prefixes infer the rest from arguments and permitted result context. Parser member-owner arguments remain separate from call arguments, including Box[int].Method[bool](...), without losing the indexed-value alternative. Static owner resolution, instance/category checks, constrained arguments and owner-aware local signature cache keys prevent owner/method confusion and cross-owner reuse. Existing pack inference remains in its own path; generic union constructors and collection WithCapacity consume the preserving owner representation. Compiler-known/raw-pointer probes leave type owners to type lookup instead of reporting undefined variables. Thirteen positive source calls cover generic/nongeneric owners, static/instance/indexed receivers, full/partial/inferred arguments, expected results and repeated method arguments under different owners at every depth on 32/64-bit plans. Eight invalid calls cover fixed-owner mismatch, explicit mismatch/arity, unresolved types, constraints, owner arity and receiver category. Parser recovery handles a missing member without panic; full mutation tests pass. Canonical specialization identity and executable method lowering remain MLG-6/7."
      - "MLG-4 (2026-11-16; functions.md sections 19-20; generics.md sections 9, 18, 20, 29-30): competing method templates use the existing two-stage generic overload resolver. Explicit method prefixes and input arguments establish candidate substitutions while preserving fixed owner bindings; known constraint failures eliminate candidates. Ordinary input ranks and fixed-versus-variadic preference choose a unique declaration before expected-result context may complete unresolved arguments. Expected return types cannot disambiguate candidates or select a worse input match; no generic-versus-nongeneric preference is invented. Method-local generic names are compared by position in complete input signatures, including nested callable types, so renaming a parameter cannot introduce a return-only overload. Signature comparison was extracted from analyzer.go into a focused sibling. Source regressions cover eight selected instance/static methods, constraint success/failure, fixed arity, result-only completion, three ambiguities, an input-selected result mismatch and two duplicate declarations at all analysis depths on 32/64-bit plans. Full Sema and vet pass; canonical method specialization identity and lowering remain MLG-6/7."
      - "MLG-5 (2026-11-16; generics.md sections 8-10, 14, 22; interfaces.md sections 4-6, 9, 12): explicit interface witnesses must have finite signatures without method-local generic parameters. Ordinary and constrained instance/static templates cannot satisfy a nongeneric requirement by dropping unused parameters; shared signature checking also excludes such templates from interface call-graph targets. Invalid conformance is diagnosed at the method with the requirement as a related location, publishes no member witness, and cannot satisfy a generic constraint. Generic impl implements clauses resolve in the owner's scope. Concrete owner arguments bind ordinary method signatures before comparison; substitution preserves the methods and inherited interface facts of generic interfaces, including different interface/owner parameter names. Generic helpers remain callable alongside ordinary conformance methods. Source matrices check valid generic-owner instance/static witnesses and helpers, three invalid conformance facts and a rejected generic demand at every analysis depth on 32/64-bit plans. The existing rejection of method-level generic interface requirements remains covered. Interface input comparison was extracted from analyzer.go into interface_method_signatures.go. Canonical specialization identity, method lowering and remaining tooling remain MLG-6 through MLG-8."
      - "MLG-6 (2026-11-16; monomorphization.md sections 4, 6-9, 12): canonical InstantiationIdentity facts combine the registered declaration and specialization role with independently ordered owner and callable arguments, including phantom arguments and pack sequences. Complete instances use that identity in the semantic signature cache and call graph; explicit and inferred requests reuse it, while distinct owner substitutions remain distinct even for identical runtime signatures. InstantiationIdentityOf reads complete substitutions without creating demand. InstantiationDemands publishes detached, deterministic current-program call-specialization demand and cause edges, composes forwarded substitutions and groups repeated requests. Calls inside unused generic bodies, including calls with fixed concrete arguments, remain inactive until their enclosing specialization is demanded; speculative cache entries and queries do not activate them. An explicit resource-limit error prevents truncated graphs from masquerading as complete. Ordinary methods of generic owners retain their template effects, and nested generic calls follow the same enclosing-demand rule. Callable-contained generic parameters remain symbolic. Source tests check eleven demands, declaration argument order, independent instance/static and owner-only identities, repeated inferred/explicit calls, nested causes, cache/query isolation, detached publication and analyzer reset on all depths and 32/64-bit plans. A negative fixture preserves noPanic checking for owner-only and method-local specializations. Semantic IR method construction and physical symbol integration remain MLG-7; native method specialization is not claimed."
      - "MLG-7 (2026-11-16; generics_lowering.md sections 2-4 and 7; monomorphization.md sections 4, 6.4, 9.3, 11 and 15.3; semantic_ir.md sections 60-61 and 75): scalar method-local generic templates now build demanded concrete bodies through the existing specialization, receiver and ownership producers instead of the unsupported-own-parameters gate. After composing outer substitutions, methodSpecializationIdentity consumes the canonical Sema key for method-local specialization facts and callable IDs; definitions and direct calls retain distinct phantom-owner and overload identities through the ordinary symbol mapper. The verifier rejects missing or inconsistent canonical method identities. Property accessor templates are identified by their actual AST parameter list so synthesized owner parameters do not become method-local ones. Source fixtures verify generic and nongeneric owners, instance/static methods, explicit/inferred reuse, forwarding, shared/mutable receivers, unused-template omission, owned cleanup/transfer, borrowed returns and overloads. Schema-13 MLIR verifies places, reference guards, cleanup, destruction and ownership on 32/64-bit plans, with eight distinct method symbols stable across widths. Existing generic-function, pack and property specialization behavior remains verified by the full IR/lowering suites. This completes method-level Semantic IR integration; no new physical reference-lowering or whole-program P17 acceptance claim is made."
      - "MLG-8 (2026-11-16; generics.md sections 9, 18-20 and 30; lsp.md section 12): ResolvedMethodTypeArgumentsOf publishes declaration-ordered owner and method bindings from the exact successful Sema-selected call, with detached types and the canonical specialization identity. It performs no overload selection or speculative specialization. Method call hover presents the substituted signature, owner arguments and method arguments independently, covering static, instance, explicit, inferred and constrained calls. Existing exact-definition generic-parameter hover exposes method-local constraints and guaranteed members without confusing them with the impl owner's parameters. Reference hover spelling follows the resolved referent rather than stale template text. Source-backed tests cover seven declaration/call hover cases, independent owner/method environments, immutable publication, unresolved calls and analyzer reset. Focused LSP generic/interface/type-pack hover regressions pass; the LSP does not create a parallel generic inference model."
