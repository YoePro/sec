      arity and explicitly rejects same-arity overloads. End-to-end lowering therefore does not yet preserve the canonical
      Sema-selected overload identity for overloads distinguished by parameter type.
    rules:
    - rules/declarations/functions.md
    - rules/declarations/generics.md
    - rules/compiler/semantic_ir.txt
    - rules/mlir/sec_mlir_lowering.md
