    implemented:
      - "fallible text operands (decision 2026-10-03): string `+` accepts an operand of exactly Result[string, StringError] (isConcatOperand), recorded as a StringConcatFallibleText segment of the maximal StringConcatPlan, so `try \"A\" + value.ToString() + \"B\"` is one runtime plan with one StringError channel; constant text still folds without try, a missing try is S1097, other Result or non-text operands keep S1022, and compound += rejects a fallible operand with focused S1022 help while its failure policy is undecided (MD-039) (TestConcatenationAcceptsFallibleTextOperands)"
      - "MD-004 (rules/corrections/applied/missing-decisions-md001-md009-correction-20261003.md § 5, 2026-10-03): every maximal StringConcatPlan is classified as compile-time folded (constant text only, try-free) or runtime; a runtime plan records the resolved active allocation context (hosted and embedded-arena profiles provide the Arena context, noalloc and unassigned profiles none, MD-034) and its failure type StringError (amended 2026-10-03: allocation failure is StringError.Allocation), publishes an allocation effect, is a try failure point of kind allocation, and is rejected with S1097 without try or S1098 without an allocation context"
      - lexer recognition and longest-match tokenization for the established operator inventory
      - Pratt expression parsing with canonical logical, bitwise, equality, comparison/membership, shift, additive, multiplicative, prefix, call/index, and member precedence
      - contextual matrix-multiply spelling x at multiplicative precedence
      - boolean validation and short-circuit semantics for && and ||
      - numeric arithmetic operand validation in Sema
      - integer-only bitwise and shift validation
      - compile-time invalid shift-count and signed-left-shift-overflow diagnostics
      - rejection of chained comparisons
      - ordered-comparison validation for compatible numeric operands and matching char, rune, and string operands
      - recursive equality-comparability analysis for implemented fixed-array, struct, union, enum, reference, and scalar cases
      - rejection of ordinary equality for unsupported slice, interface, function, and opaque compiler-known categories
      - range membership frontend semantics
      - fixed-array and slice membership Sema validation
      - direct string-concatenation operand matrix for built-in string, char, and rune with S1022 rejection of hidden non-text conversion
      - direct string += frontend operand validation
      - resolved checked-integer operator facts, blocking constant division/remainder-by-zero diagnostics, and non-blocking S1023 potential-overflow warnings with checked runtime semantics retained
      - P7 checked-integer Semantic IR and Sec MLIR foundation
      - "compound assignment (2026-10-05): an integer `+=`, `-=`, `*=`, `/=`, `%=`, `&=`, `|=`, `^=`, `<<=`, or `>>=` (and `++`/`--`) publishes its underlying operator through ResolvedCompoundAssignmentOf, classified by the same resolvedIntegerInfixOperator as the binary expression, and records the same arithmetic panic effect, so @noPanic now rejects `i += 1` as it rejects `i = i + 1` (previously unsound) (TestCompoundAssignmentPublishesItsCheckedOperator)"
      - "boolean operators in Semantic IR (2026-10-05): `&&` and `||` lower from ResolvedLogicalFlow to left-first short-circuit CFG whose short-circuit edge passes the left value to a bool merge parameter and whose right operand is built only on the other edge (proven constant forms build no unused operand); `!` on bool publishes ResolvedBoolNot and lowers to bool.not (TestLogicalOperatorsBuildShortCircuitFlow)"
      - "range membership (2026-10-05): `value in lower..upper`, `..<`, and `not in` publish ResolvedRangeMembership (negation, present bounds, exclusivity, value type), fitting untyped literal bounds take the value's type, and built-in integer membership lowers to Semantic IR with the value evaluated first and bounds left to right once each, an inclusive lower bound, an inclusive or exclusive upper bound, and negation after the test (TestRangeMembershipAndBoolNotPublishResolvedFacts, TestRangeMembershipBuildsBoundComparisons)"
      - "compound assignment Semantic IR (2026-10-05): `local op= value` on an integer mutable local reads the destination once, evaluates the source once, applies the resolved checked operation, and stores once on the success path only (TestCompoundAssignmentBuildsCheckedReadModifyWrite)"
      - P8 signedness-correct integer Arith lowering including signed/unsigned comparison, division, remainder, and shifts
      - P9 typed arithmetic-failure reasons and Result integration
      - stable structured diagnostics S1016, S1017, S1018, S1019, S1021, and S1022
      - direct LLVM CFG short-circuit lowering for && and ||
      - "canonical precedence catalog (2026-10-05): internal/operators owns the complete weak-to-strong precedence, associativity, hard-token, and contextual-spelling matrix; the Pratt parser and formatter multiline infix layout consume that catalog instead of maintaining unrelated tables, including contextual x, in, not in, is, and is not metadata; adjacent parser levels and left associativity are covered directly (TestCanonicalPrecedenceDefinitions, TestTokenAndContextualSpellingsShareCanonicalPrecedence, TestCanonicalAdjacentBinaryPrecedence, TestCanonicalBinaryAssociativity, TestFormatMultilineContextualInfixUsesCanonicalPrecedence)"
      - "compile-time string concatenation materialization (2026-10-05): a fully constant maximal StringConcatPlan retains its exact lexer-decoded FoldedText; Semantic IR consumes the plan as exactly one const.string with no child evaluation, intermediate string, allocation context, failure edge, or try requirement, and the existing Sec-MLIR path emits one sec.const.string (TestCompileTimeStringConcatBuildsOneFoldedConstant; testdata/ir/test_folded_string_concat.sec)"
      - reserved question marks in statement and expression positions produce focused P2012 diagnostics with the canonical Sec 0.1 message, structured unexpected-token metadata, and retained invalid syntax for recovery and tooling
      - "legacy floating operator chain (2026-10-14): float32 and float64 use oeq/une/olt/ole/ogt/oge, preserve signed zero with fneg, and lower % and %= to truncation-based llvm.frem without fast-math; native build materializes libm for Linux/FreeBSD, validates imported struct layouts on consumption, and executable source matrices verify NaN on either side, infinities, divisor signs, signed zero and exact-once left-to-right operands"
    partial:
      - contextual matrix x has parser and fixed-shape Sema support but incomplete Semantic IR, lowering, and tooling integration
      - fixed-array and slice membership are type-checked but Semantic IR and short-circuit backend lowering remain incomplete
      - runtime string concatenation lacks complete allocation-context, panic-versus-AllocationError, noPanic, interpolation-contract, maximal-plan, and lowering semantics
      - string += lacks complete transactional failure and commit semantics
      - aggregate equality lowering and explicit identity/non-comparable metadata remain incomplete
      - string equality and Unicode-scalar lexicographic ordering are not complete across maintained backend paths
      - compound assignment to fields, indexed places, properties, dereferenced references, contract-typed, volatile, and atomic destinations still requires exact-once, checked-failure, contract, ownership, and commit-order lowering; Semantic IR covers integer mutable locals only
      - operator Semantic IR metadata and effect metadata are not complete for all operator families
      - formatter, diagnostics, LSP explanations, and quick fixes are incomplete across the full operator matrix
      - parser recovery around malformed operator expressions is incomplete
      - Semantic IR and Sec MLIR floating comparison/remainder lowering awaits P20 (the removed legacy MLIR path had a NaN predicate and truncation-remainder lowering; MD-101)
      - decimal remainder support is incomplete
    remaining:
      - complete contextual matrix x Semantic IR, lowering, diagnostics, formatter, and LSP behavior
      - "P20 floating operators: complete NaN comparison and truncation-remainder facts in Semantic IR, schema-16 Sec MLIR verification and Arith lowering after the corrected P18/P19 predecessor chain; the current emitter and dialect support schema 10"
      - complete decimal arithmetic/remainder/comparison lowering under the owning decimal rules (planned as SEC-MLIR-P21, `lowering.sec-mlir-package21`; operator scale, core ArithmeticError mapping and decimal128 members are normatively decided by MD-066/067/068 on 2026-10-28; actual implementation and predecessor gates remain, following correction §13(3) numbered steps)
      - lower fixed-array and slice membership as exact-once left-to-right short-circuit search without allocation
      - lower range membership over char, rune, float, decimal, and nominal ordered values (Semantic IR covers built-in integers)
      - implement exact string-content equality and Unicode-scalar lexicographic ordering through Semantic IR and every maintained backend
      - "MD-004 lowering: represent StringConcatPlan with its resolved allocation context, StringError channel, ownership, and lifetime facts in Semantic IR and maintained backends; refine the context lifetime for results that escape a local allocation lifetime, and prove allocation elimination under profiles without dynamic allocation"
      - integrate interpolation formatting contracts and string.Concat with the same concat plan
      - implement transactional fallible string += and only apply in-place reuse after proof
      - complete derived aggregate equality lowering and identity/resource exclusion metadata
      - complete compound-assignment exact-once and failure-before-commit semantics for non-local places, try-selected compound arithmetic, and contract-typed destinations
      - complete resolved operator/effect facts in Semantic IR for every accepted operator
      - complete formatter normalization, operator hover, precedence/result/failure explanations, and safe quick fixes
      - complete the canonical operator regression matrices across frontend, Semantic IR, Sec MLIR, direct LLVM where maintained, and end-to-end execution
    governance_reconciliation:
      - Do not migrate the operators.md statement that complete checked integer arithmetic/lowering is unimplemented as a current blanket status. Newer governance entries for the P7/P8/P9 pipeline supersede that stale embedded status for the implemented builtin-integer Sec MLIR path.
      - Keep feature-specific ownership with frontend.collections, frontend.shaped-types, frontend.types-core, lowering.sec-mlir-checked-integers, lowering.sec-mlir-checked-integer-arith, and lowering.sec-mlir-typed-arithmetic-failure rather than duplicating their detailed implementation matrices here.
      - Builtin bool equality and inequality facts and maintained lowering are complete and owned by frontend.boolean-equality-lowering; the remaining operator-fact and regression matrices concern the other unfinished families.
      - Builtin unary ! through maintained Semantic IR and Sec MLIR is complete and owned by frontend.boolean-negation-lowering; short-circuit logical flow retains its existing package-13 capability boundary.
