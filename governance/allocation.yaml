      - internal/sema/arena_from_buffer_test.go
      - testdata/sema/arena_from_buffer_valid.sec
      - testdata/sema/arena_from_buffer_invalid.sec
    cross_references:
      - analysis.arena-allocation (governance/analysis.yaml) owns the detailed Arena validation, generation, trait, and typed-allocation facts
      - analysis.arena-reset-release-dependency-legality (governance/analysis.yaml)
    implemented:
      - compiler-known Arena type and AllocationError enum in the represented frontend subset
      - recognition for represented Arena constructors/members including New, Alloc, Reset and Release
      - Arena.Alloc[T](count) validation with Result[ref mut T[], AllocationError] typing
      - "Arena.New[T] and Arena.Alloc[T] type requirements: sized/complete T (S1072), canonical infallible default (S1073), trivial destruction (S1074); Arena is move-only and non-trivially destructible by composition (see analysis.arena-allocation)"
      - Reset/Release receiver and arity checks with represented generation mutation
      - initial Arena identity/generation metadata on arena-backed references and slices
      - selected stale-reference rejection after represented Arena.Reset
      - runtime string concatenation and interpolation are allocation operations that require try (S1097) and an allocation context (S1098) and record an allocation site in the call graph (MD-004)
      - "allocation sites with unknown behavior (2026-10-04): a call through an unresolved function value, an interface or constrained-generic method call, and a call to an extern function without a trusted @noAlloc contract record an UnknownAllocation site, kept separate from definite allocation (allocation.md § 24(6))"
      - "@noAlloc verification (2026-10-04): a Sec function or method marked @noAlloc with a synchronous path to a definite allocation, or else to unknown allocation behavior, is mandatory S1108 allocation.no-alloc-violation on the attribute with the call chain, the introducing site as related location, and help per cause; try does not make allocation acceptable; @noAlloc on an extern declaration is a trusted foreign contract (TestNoAllocGuaranteeIsVerifiedTransitively)"
      - ordinary copy, assignment, move initialization and move passing, parameter passing, return, reference and slice-view creation, if/match joins, and discard record no allocation site and satisfy @noAlloc (allocation.md § 4; TestOrdinaryOperationsDoNotAllocate)
      - "Arena.FromBuffer backing is an exclusive mutable-borrow dependency for the whole Arena lifetime (2026-10-09, arena.md § 10, § 45(2)): the backing is a mutable byte array, fixed byte array or byte slice borrowed implicitly at the call (no call-site marker, escape_analysis.md rev 2) or a ref mut byte reference; immutable, temporary and non-byte backing is rejected; reads, writes and a second FromBuffer over the borrowed storage are rejected while the Arena lives; a local move (:<- or <-) carries the borrow to the new owner even when the domain is already known; Release and scope end release it; returning the Arena, returning Arena.FromBuffer(...) and moving the Arena into a consuming call or another owner it cannot follow are rejected because the caller could not see the dependency (TestArenaFromBufferBorrowsBackingForArenaLifetime)"
      - "Arena operations work through ref Arena / ref mut Arena (2026-10-09, arena.md § 68(3)-(4) Fill example): New/Alloc/Reset need ref mut, Release is rejected through a borrowed reference, allocations are rooted in the reference parameter so they may be returned, and Reset through the reference invalidates them; typed Arena allocation and owned/growable construction now produce the canonical compiler-known Result instead of a Result whose name embedded its arguments, which had made Result[ref mut T[], AllocationError] returns of arena.Alloc fail"
    remaining:
      - classify every remaining Sec 0.1 allocation-capable operation in the same effect model (collection growth and WithCapacity, closure environments where canonically allocation-capable, spawn control storage, shaped types, allocating core and stdlib contracts)
      - effective @noAlloc implied by @isr, @interrupt, and @interruptSafe is verified through the implication graph (2026-10-05, frontend.attributes-v2); the implying attributes are still rejected as not implemented until their own ISR semantics exist
      - "@noAlloc coverage of destructors reached from the function, compiler-generated operations, and generic specializations; defer bodies are covered. Audit 2026-10-09: a local whose type has an allocating free is accepted in a @noAlloc function (no destruction edges; needs destruction-point facts), and a @noAlloc caller of a concrete specialization such as GenericCall[Loud] is accepted although the specialization reaches an allocating Loud.Name, because specialization call-graph nodes carry no edges or effects (unsound; monomorphization.md § 12.4-12.5 requires executable specialization nodes). Template-level constraint calls are correctly unknown; constraint-carried effect contracts await MD-053"
      - complete context propagation through functions, methods, lambdas, properties, init, interfaces, generics and indirect calls
      - replace lexical Arena binding identity with stable compiler-owned ArenaDomain identity
      - overflow and alignment checks for safe manual allocation (blocked on the layout service and MD-019)
      - integrate ownership-v2, borrowing-v2, lifetime-analysis-v2, references-v2 and destruction-v2 facts canonically
      - complete failure behavior and only treat allocation as infallible when storage/capacity is proven
      - FFI allocation contracts beyond the trusted @noAlloc fact (ownership, deallocation responsibility, retention; allocation.md § 19)
    required_tests:
      - invalid local-reference escape is rejected rather than heap-promoted
      - closure escape is rejected rather than silently allocated
      - Arena.Alloc count overflow rejected before allocation
      - Arena.Alloc alignment derived from T
      - repeated Arena allocation does not invalidate earlier allocation
    verification:
      - command: go test ./... -count=1
        result: passed on 2026-10-09 after the Arena.FromBuffer backing-borrow and ref Arena work, including TestArenaFromBufferBorrowsBackingForArenaLifetime

  - id: analysis.allocation
