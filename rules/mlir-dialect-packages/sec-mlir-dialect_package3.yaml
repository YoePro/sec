acceptance:
- Package 2 remains green
- StorageID exists and differs from ValueID
- StorageID zero invalid
- storage descriptors and four storage operations implemented
- mutable initialized scalar locals lower through storage
- uninitialized mutable locals explicitly unsupported
- Sema stable binding identity available
- builder does not resolve bindings by spelling
- Sema exact resolved call target available
- Sema resolved call kind available
- DirectCall implemented
- ForeignCall implemented
- call kinds verified against extern status
- supported arguments record copy-trivial
- left-to-right call evaluation preserved
- void statement calls supported
- standalone non-void calls explicitly unsupported
- branch and conditional branch implemented
- block parameters verifiable
- if/else/nested if lower correctly
- no fake merge for fully terminating branches
- SSA dominance verification implemented
- storage declaration/init dominance verified
- printer deterministic
- sec emit-ir supports Package 3 subset
- no MLIR/LLVM backend tools invoked by emit-ir
- go test ./... passes
- legacy codegen tests pass
- no future semantic placeholders added
