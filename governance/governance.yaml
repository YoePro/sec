    tests:
      - cmd/yamlstatus/rulebook_render_test.go
      - cmd/yamlstatus/rulebook_page_test.go
      - cmd/yamlstatus/rulebook_workspace_test.go
      - cmd/yamlstatus/books_test.go
      - cmd/yamlstatus/books_output_test.go
    implemented:
      - "Markdown body renderer (2026-11-19): Goldmark v1.8.7 (MIT) with GFM and final-output bluemonday v1.0.27 (BSD-3-Clause) sanitization. Dedicated rulebook_render.go accepts UTF-8 .md/.txt bytes without filesystem/network access. Tables, nested lists, Unicode, blockquotes, escaped fenced Sec examples/language labels, links/images and safe raw HTML anchors/details/line breaks are covered; executable markup/URLs are removed. Both current .txt MLIR books render as escaped preformatted text. Format/package/security policy is documented in cmd/yamlstatus/RULEBOOK_PUBLICATION.md; representative real books render successfully. Site selection, navigation, links, templates, filesystem output and CLI remain separately open."
      - "HTML presentation (2026-11-19): renderRulebookPage produces a complete deterministic HTML document from source bytes and caller-supplied metadata/navigation, using the sanitized body renderer and escaped html/template fields. Embedded rulebook_page.html and rulebook_page.css provide Sec manual-style header/sidebar/breadcrumb/content/footer, local system-font styling, responsive bounded navigation, scrollable wide code/tables, visible keyboard focus, skip link, current-page markers and optional contents/revision/documentation-status/source fields. Page chrome requires no network resources or JavaScript. Invalid title/navigation URL/body input yields no partial page. Automatic navigation generation, inventory selection, link resolution and site publication remain separately tracked."
      - "Safe rendering and filesystem boundaries (2026-11-19): rulebookWorkspace connects source reads and page rendering to disjoint existing source/output roots pinned with os.Root. Root symlink aliases and nesting in either direction are rejected; decoded portable relative paths reject absolute/URL/drive/backslash/control/percent-escaped traversal forms. Regular-file source reads and root-confined symlinks cannot escape the source tree. Create-only artifact writes beneath the output root reject existing files, leaf symlinks and hard links, preserving sources and unrelated output; failed writes remove their newly created partial artifact. Rendering retains the shared raw-HTML/URL sanitization and metadata escaping, without network fetching, example execution or deployment. Rebuild staging/replacement remains the separate reproducible-output point."
      - "Publication command and canonical inventory (2026-11-19): yamlstatus books accepts --outdir, --indir (checkout root; default current directory), --base-url and read-only --check without changing existing statistics/edit flags. GFM inventory tables select unique Written/Living .md/.txt books and directory-map categories from rules/README.md. Planned/Covered/Deferred/Candidate/repository-sync-pending entries remain explicitly unavailable; artifacts, directories, corrections, package plans and historical/amendment trees are excluded. Missing selected sources, unsafe paths, unknown categories and output collisions fail explicitly."
      - "Book structure/navigation (2026-11-19): source headings and revision metadata produce titles, documentation-status labels, breadcrumbs, per-book contents, a root index and category indexes. Unicode/numbered heading anchors are deterministic, duplicate headings receive suffixes and explicit IDs/named anchors are preserved with collision diagnostics. The first source H1 is represented once in the page header with its anchor; .txt books retain literal bodies with a source-derived title. No compiler-completion claim is derived from documentation metadata."
      - "Book links/resources (2026-11-19): DOM-based rewriting resolves Markdown and raw-HTML book links against source-relative/canonical paths and unambiguous basenames, including HTML destination names, preserving fragments and queries. Unambiguous prose/inline-code book references become links; fenced examples/plain-text bodies remain literal. Missing local books/anchors fail validation; inactive/history/repository-only references become labelled text. Permitted local raster images are read within the source root, copied to collision-checked assets paths and rewritten for relative or explicit deployment prefixes. No external resources are fetched."
      - "Reproducible staged static output (2026-11-19): all sorted artifacts and a versioned SHA-256 ownership manifest are staged in a private sibling directory before whole-directory installation with rollback on installation error. The manifest identifies stale generated files for removal; unrelated regular files and directory permissions are preserved, including file permissions/modification times. Modified generated files, invalid manifests, symlinks and unrelated destination collisions fail without changing the installed site. Per-destination locking rejects overlapping cron publishers. Generated bytes contain no build timestamp or private source-root path; directory-swap availability limits are documented."
      - "Validation workflow and diagnostics (2026-11-19): books --check parses the selected inventory, renders every page in memory and checks final navigation/book/resource targets, Unicode/explicit anchors and collisions without creating output/locks/staging. Generation runs the same validation before publication. Deterministic actionable diagnostics identify portable source/generated paths and unique source-reference line numbers when available; errors return nonzero without replacing the destination. Intentionally unavailable inventory entries are displayed without false missing-source errors."
      - "End-to-end delivery (2026-11-19): CLI/global help, codex.md and RULEBOOK_PUBLICATION.md document local browsing, absolute cron invocation, URL subpaths, check mode, CI artifact generation and manifest-based regeneration. bin/yamlstatus is rebuilt with -trimpath. The real selected corpus publishes 115 books as 131 static files plus the ownership manifest; repeated final-binary runs from another working directory are byte-identical and preserve unrelated files. Complete yamlstatus/race/vet suites and desktop/mobile Firefox inspection pass. No hosting upload, server or crontab installation is performed."
    remaining: []
    required_tests:
      - Renderer fixtures cover the actual rulebook dialect, Unicode, tables, nested lists, fenced Sec examples, raw HTML policy, escaped metadata and unsafe URL schemes.
      - Link/navigation fixtures cover duplicate and Unicode headings, explicit anchors, relative Markdown/HTML links, fragments, images, excluded/missing documents, .txt policy, output collisions and root versus nested deployment paths.
      - Filesystem/output fixtures cover traversal and symlink escapes, overlapping source/output roots, unchanged sources, deterministic rebuilds, stale generated files, preserved unrelated files and failed-build output preservation.
      - CLI and full-corpus checks cover validation-only mode, actionable diagnostics and exit status, portable offline assets, complete canonical inventory selection and unchanged existing statistics -html behavior.
    verification:
      - command: go test ./cmd/yamlstatus -count=1; go test -race ./cmd/yamlstatus -count=1; go vet ./cmd/yamlstatus; go build -trimpath -o bin/yamlstatus ./cmd/yamlstatus; bin/yamlstatus books --check
