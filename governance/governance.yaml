      - "HTML presentation: provide embedded templates and locally packaged styles/assets consistent with the existing Sec manual layout. Make book text, wide tables and code examples readable on desktop and mobile, with accessible semantic headings, keyboard navigation and useful page titles. Generated pages must work without a running Go server or mandatory remote asset requests; reuse shared presentation assets where practical while preserving the existing statistics -html output."
      - "Safe rendering and filesystem boundaries: escape code and metadata, define and enforce a policy for raw HTML and URL schemes, and prevent executable markup or unsafe links from bypassing that policy. Confine source/resource reads and output paths, including symlinks and encoded traversal, to their configured roots; reject source/output overlap and source overwrites. Generation must not fetch remote content, execute examples or upload/deploy the site."
      - "Reproducible static output: produce deterministic portable page/asset paths and ordering, with an explicit reproducible policy for timestamps and source revision. Stage and validate the complete site before replacing generated output; failures must not leave a partially replaced site. Track generator-owned files so rebuilding removes stale generated pages without deleting unrelated files, and leave rulebook sources unchanged."
      - "Build validation and diagnostics: provide a validation-only workflow that checks the selected inventory, rendering, links, anchors, resources and destination collisions without publishing output. Emit deterministic actionable diagnostics with repository-relative source paths and locations where available, distinguish intentionally unavailable inventory entries from broken links, and return a nonzero exit status for errors. Successful generation must run the same validation rather than silently emit broken pages."
      - "End-to-end delivery and documentation: add CLI help and repository usage instructions for local preview, full rulebook generation, deployment under a URL subpath and a reproducible CI artifact/check workflow. Verify the real selected rulebook corpus and document any explicit exclusions. Deliver a static directory ready for separately authorized hosting; preserve all existing yamlstatus commands and the governance HTML report. Close this ID only when the complete publication workflow and required regression coverage pass."
    required_tests:
      - Renderer fixtures cover the actual rulebook dialect, Unicode, tables, nested lists, fenced Sec examples, raw HTML policy, escaped metadata and unsafe URL schemes.
      - Link/navigation fixtures cover duplicate and Unicode headings, explicit anchors, relative Markdown/HTML links, fragments, images, excluded/missing documents, .txt policy, output collisions and root versus nested deployment paths.
      - Filesystem/output fixtures cover traversal and symlink escapes, overlapping source/output roots, unchanged sources, deterministic rebuilds, stale generated files, preserved unrelated files and failed-build output preservation.
      - CLI and full-corpus checks cover validation-only mode, actionable diagnostics and exit status, portable offline assets, complete canonical inventory selection and unchanged existing statistics -html behavior.
