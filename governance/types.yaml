    - internal/sema/analyzer_test.go
    - internal/sema/defaults_test.go
    - internal/codegen/mlir/generator_test.go
    - internal/sema/contract_representability_test.go
    - testdata/contracts/representable_conjunction_valid.sec
    - testdata/contracts/representable_conjunction_invalid.sec
    - testdata/contracts/representable_conjunction_target.sec
    implemented:
    - contracts are represented on named semantic types and inherited contracts are copied into derived named types
    - sequential contract syntax is represented as an ordered ContractList
    - integer range contracts with inclusive and exclusive upper bounds
    - integer odd and even marker contracts
    - integer multipleOf parsing, nonzero-divisor diagnostic, literal validation, and default integration
    - ordered primitive in-list parsing with non-empty-list rejection
    - primitive membership compatibility checking
    - duplicate membership-value rejection
    - membership values are checked against represented sibling contracts
    - notEmpty, unique, and finite marker-contract parsing and basic applicability checks
    - contract applicability diagnostics for currently recognized contract families
    - integer literal and supported explicit-conversion contract checks
    - explicit type defaults are checked against represented contracts
    - range, membership, multipleOf, odd, and even participate in the implemented default resolver
    - string notEmpty participates in primitive default validation
    - float and decimal finite markers participate in represented default validation
    - selected provably inconsistent integer contract sets are rejected
    - all integer ranges are intersected and all nonzero multipleOf divisors combine through exact LCM
    - inherited and local range, divisibility, and parity contracts participate in one satisfiability proof
    - integer consistency intersects the complete contract conjunction with the base type's representable bounds even without an explicit range
    - target-sized int and uint consistency uses the selected scalar plan while fixed-width types retain target-independent bounds
    - exact first-candidate arithmetic proves divisibility and parity consistency without range enumeration or host-width narrowing
    - satisfiable types remain legal even when their implicit default is ambiguous; zero-only and signed-boundary domains are preserved
    - assignment to currently represented constrained storage requires try in implemented paths
    - obsolete variable-level, type-first-storage-level, and ordinary struct-field contracts are rejected by Sema with stable S1050 migration diagnostics and are never applied to storage types
    partial:
    - membership is currently restricted by implementation to primitive/scalar/enum compile-time constants rather
      than the full canonical domain of named values with compile-time semantic equality
    - finite, notEmpty, and unique have parser/applicability representation but not complete runtime validation semantics
    - range bounds are parsed from a narrow numeric-literal form rather than the complete permitted compile-time-constant
      domain
