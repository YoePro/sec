  - id: sema.deadlock-analysis
    area: frontend-analysis-and-lowering
    status: planned
    audited: "2026-08-11"
    summary: >-
      Adds canonical Sec deadlock analysis over synchronization resources and
      execution contexts: flow-sensitive held-resource tracking, symbolic
      acquisition/release and wait summaries, lock-order and generalized wait-for
      graphs, self-deadlock, task/thread completion cycles, callback/reentry,
      FFI/ISR integration, cycle realizability classification, deterministic
      witnesses, and incremental LSP/Deep tooling that distinguishes proven,
      potential, unknown, and failure-to-prove states.
    rules:
      - rules/analysis/deadlock_analysis.md
      - rules/concurrency/concurrency_memory_model.md
      - rules/analysis/data_races.md
      - rules/analysis/call_graph.md
      - rules/compiler/compiler_analysis.md
      - rules/memory/storage.md
      - rules/memory/layout.md
      - rules/memory/lifetime_analysis.md
      - rules/analysis/escape_analysis.md
      - rules/analysis/closure_analysis.md
      - rules/memory/ownership.md
      - rules/memory/borrowing.md
      - rules/memory/copy_move.md
      - rules/memory/destruction.md
      - rules/control-flow/defer.md
      - rules/collections/collections.md
      - rules/analysis/effect_analysis.md
      - rules/platform/ffi.md
      - rules/tooling/lsp.md
      - rules/projects/projects.md
      - rules/concurrency/concurrency.md
    governance_reconciliation:
      - concurrency.md owns common blocking and progress semantics; deadlock_analysis.md owns graph construction, proof strength, classification, and diagnostics.
    remaining:
      - add canonical synchronization-resource identity using Place/provenance and resource semantics rather than resource names
      - preserve Same, Disjoint, MayAlias, and Unknown resource-identity relationships or equivalent canonical precision
      - add flow-sensitive held-resource state distinguishing definitely-held from possibly-held resources
      - integrate canonical acquire, successful acquisition, release, nonblocking/fallible acquisition, guard lifetime, guard move, destruction, defer, cleanup, and error-path semantics
      - distinguish waiting for a blocking resource from successful ownership so wait dependencies and held-resource state are modeled separately
      - add lock-order relationships only when the predecessor resource may still be held at the later acquisition point
      - preserve weaker proof strength for edges derived from PossiblyHeld state rather than silently treating them as definite
      - add symbolic interprocedural deadlock summaries for acquisitions, releases, waits, held-on-return state, required held-on-entry state, execution effects, and localized uncertainty
      - preserve symbolic parameter, receiver, captured, static, allocation-site, and bounded collection resource origins across summaries
      - instantiate callee resource identities at call sites and detect self-aliasing when distinct symbolic parameters resolve to the same non-reentrant runtime resource
      - propagate caller-held resources across callees that acquire additional resources while allowing canonical release or ownership-transfer semantics to remove inherited held state
      - add caller-to-callee acquisition-order propagation so a caller-held external resource can order before a callee internal or static acquisition
      - consume canonical guard/token ownership and lifetime facts so synchronization ownership follows move, destruction, release, and scoped lifetime semantics
      - add deterministic interprocedural fixed points over canonical call-graph SCCs without conflating call-graph recursion SCCs with deadlock dependency SCCs
      - add LockOrderGraph construction as a compact projection of nested acquisition relationships
      - add generalized WaitForGraph construction for execution-to-resource, resource-to-owner/progress-provider, task/thread completion, foreign completion, condition/event, and mixed dependency relationships
      - consume canonical task/thread join and completion semantics so direct, mutual, and mixed completion cycles can participate in deadlock analysis
      - support join-while-holding-resource cases where a joined worker or thread requires the held resource to complete
      - preserve finite execution-context abstractions for threads, tasks, repeated creation sites, callbacks, ISR execution, platform execution, and unknown contexts
      - represent whether one semantic creation-site context class may have multiple overlapping runtime instances so same-body instances can participate in one cycle
      - keep ordinary synchronous calls in the caller execution context while propagating callee resource behavior interprocedurally
      - consume closed callable target sets and open callable contracts for MayBlock, MayAcquire, completion waits, callback execution, and reentry behavior
      - add callback-while-holding-resource propagation so callable targets can contribute lock-order or wait-for edges across indirect calls
      - consume canonical FFI contracts for blocking, foreign resource acquisition, completion waits, callback execution context, synchronous/asynchronous reentry, and foreign synchronization without inferring behavior from names
      - keep unknown foreign waits localized rather than connecting them speculatively to unrelated program resources
      - integrate ISR/preemption relationships so an ISR waiting for a resource held by the preempted context can form a self/cross-context deadlock witness
      - consume canonical interrupt masking, priority, nesting, and exclusion facts to eliminate impossible ISR cycles without moving ISR-specific policy into deadlock analysis
      - consume canonical condition/event progress-provider semantics and model condition waits that release/reacquire a resource according to their actual contract
      - preserve resource-specific reentrancy, capacity, acquisition-count, release, and progress semantics instead of silently treating all synchronization resources as exclusive mutexes
      - add bounded symbolic resource abstractions for dynamic resource collections, including indexed resources and AnyIndex-like widened identities while preserving known roots/projections
      - consume canonical range, index, alias, ownership, and ordering facts so same-resource, proven-disjoint, and sorted dynamic acquisition cases remain distinguishable
      - add dependency-edge evidence carrying source cause, execution context, interprocedural cause path, path-condition summary, and proof strength sufficient for stable cycle diagnostics
      - distinguish ProvenDeadlock, PotentialDeadlock, and Unknown throughout analysis, summaries, diagnostics, and tooling
      - require a sound reachable simultaneously realizable cyclic wait witness before classifying a result as ProvenDeadlock
      - classify meaningful supported cycles with incomplete path, identity, scheduling, capacity, or compatibility proof as PotentialDeadlock rather than ProvenDeadlock
      - keep insufficient dependency information as Unknown rather than fabricating a potential cycle
      - distinguish deadlock findings from failure to prove a positive deadlock-freedom requirement imposed by language, target, runtime, ISR, project, or CompilationPlan policy
      - add path-compatibility reasoning coupled to execution-instance identity so mutually exclusive branches in one instance can still be considered across distinct concurrent instances where permitted
      - consume MayOverlap, CannotOverlap, MayPreempt, MayReenter, completion, and related canonical execution-context facts when deciding cycle realizability
      - add explicit self-deadlock reasoning for non-reentrant resource reacquisition and self-wait dependencies without requiring a second execution context
      - consume guaranteed timeout, cancellation, completion, and other progress facts only when canonical semantics guarantee cycle-breaking progress; merely possible escape must not eliminate a deadlock proof
      - add resource-capacity reasoning sufficient to avoid treating counting or multi-capacity resources as capacity-one locks; preserve PotentialDeadlock or Unknown when capacity precision is insufficient
      - add deterministic cycle detection and SCC condensation over lock-order and generalized wait-for dependency graphs
      - select deterministic representative cycles favoring stronger proof, smaller understandable dependency chains, precise identities, clear source locations, and minimal uncertainty
      - retain compact interprocedural cause paths for every representative cycle edge so diagnostics can navigate through nested calls without dumping the full graph
      - use symbolic path summaries, bounded context sensitivity, SCC condensation, edge aggregation, and widening to avoid exponential path or runtime-instance explosion
      - ensure precision loss may weaken ProvenDeadlock to PotentialDeadlock or Unknown but never strengthen an unsupported result
      - allow increased Deep precision to upgrade PotentialDeadlock to ProvenDeadlock when the missing witness is established or remove it when path/resource/execution incompatibility is proven
      - add scoped positive NoLockOrderCycle or NoDeadlockCycle facts where a partial-order or generalized no-cycle proof is established
      - provide LSP diagnostics with primary and related source locations for acquisitions, waits, completion dependencies, callbacks, and other representative cycle edges
      - present ProvenDeadlock and high-confidence PotentialDeadlock findings as NeedToKnow while keeping positive no-cycle explanations and detailed graph views configurable OptionalInsight
