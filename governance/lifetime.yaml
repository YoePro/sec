    implemented:
      - Recursive CopyClassification/CopyClassificationOf support including trivial, semantic, conditional, move-only, and explicitly non-copyable classes.
      - '@noCopy is already recognized as a type-level copy prohibition in current frontend classification.'
      - Explicit :<- and <- parsing/AST/Sema support for established declaration and assignment forms.
      - Place-sensitive move tracking for roots, nested fields, selected union payloads, static slice intervals, and local alias provenance.
      - Reinitialization of supported moved/discarded Places and field-sensitive aggregate restoration.
      - Initial branch/loop/match/select ownership joins, borrow-conflict checks, defer-retention checks, overlapping self-move rejection, formatter preservation, and LSP move quick fixes.
      - Direct call-site <- markers are parsed and enforced for reusable ordinary move-only and explicit -> arguments; copyable ordinary arguments remain copies, fresh temporaries remain marker-free, and transfer commits only after successful full-call analysis.
      - Terminal return ownership context recursively forwards reusable move-only sources through aggregate, Option, Result, union, nested, and value-producing match construction; explicit <- remains accepted and ordinary calls do not inherit hidden consumption.
      - Non-terminal aggregate and union/Option construction rejects hidden consumption of reusable move-only sources, accepts explicit <-, commits it, and preserves marker-free fresh-temporary forwarding.
      - Closure capture AST and analysis distinguish copy capture(value) from consuming capture(<-value), reject legacy capture(-> value), and make the consumed outer Place unavailable.
      - Ordinary instance methods reject complete-self consumption while eligible independently tracked owned members may be moved with sufficient receiver authority.
      - Result.Ok() and Result.Err() are compiler-known consuming projections with Option[T]/Option[E] result types; successful calls make a reusable owned Result Place unavailable and later use reports the projection location.
      - Consuming Result projections reject borrowed receivers and reject a potentially active non-retained payload carrying a non-discardable obligation.
      - Explicit ownership moves reject addressed volatile/MMIO roots and their projections, while an ordinary read into local inline storage produces a snapshot that follows normal copy/move rules.
    remaining:
      - result-borrowed-projections: implement non-consuming Result.OkRef/ErrRef with shared-borrow lifetime tracking
      - result-projection-state-proof: permit a non-discardable alternate payload only when control-flow proves that Result state unreachable
      - result-projection-semantic-ir-and-lowering: retain the selected payload, destroy the active alternate exactly once, and preserve consumption facts downstream
      - complete Place availability integration including nested/indexed/sliced/opaque alias cases and the ownership-v2 Availability/UnavailableReason model
      - align discard convergence, conditional availability, conditional replacement, and custom-free partial-move prohibition with ownership-v2
      - stable diagnostic IDs and mentor diagnostics for missing <-, implicit consuming construction, use-after-move, move while borrowed, invalid overlap, move from non-owned/fixed storage, and Result projection consumption
