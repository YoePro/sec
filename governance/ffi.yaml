    implemented:
      - bodyless extern C, system, and Sec function declaration parsing and AST retention
      - parser and defensive Sema rejection of body-bearing extern declarations
      - Linux inline-assembly syscall implementations migrated from body-bearing extern to ordinary unsafe Sec functions
      - rejection of unknown extern calling-convention strings during semantic registration
      - ordinary extern calls permitted without an unsafe context solely for foreignness
      - unsafe extern declarations preserved in Sema and calls rejected outside an explicit unsafe context
      - call-bounded non-null ref and ref mut extern parameters accepted by position-specific FFI validation
      - raw foreign ref and ref mut returns remain rejected as non-ABI-compatible
      - RawPtr and fixed-width integer and floating scalar gating for current extern signatures
      - direct Sec string and other obviously non-ABI-compatible signature types rejected
      - explicit @link_name parsing, AST and semantic retention, linked backend symbol selection, and duplicate-symbol validation
      - foreign call kind, ABI, symbol, and unsafe declaration provenance retained through existing Semantic IR
      - Sema rejects unresolved generic extern declarations before callable registration with mandatory S1041, preserves later concrete extern declarations, and reports the generic parameter source location
      - "the parser recognizes C::name and c::namespace::name in type and conversion position from two adjacent colon tokens (MD-020), keeps the whole qualification as one name token with retained separators, reports malformed qualifications as P2021 parser.malformed-foreign-qualification, and reports the not-yet-implemented C::fn, C::flex, and C::callback forms as P2022 parser.unsupported-foreign-form; fields or locals named c or C keep their meaning. MD-020 (decided 2026-10-08) replaces this spelling: see remaining"
      - "every registered target carries a validated C ABI model in its CompilationPlan (LP64 SysV/Darwin/BSD, LLP64 Windows, ILP32 AAPCS and RISC-V): integer widths, plain char signedness, bool storage, and long double format (x87 extended, binary128, or binary64), checked for coherence with the target pointer width"
      - "Sema registers all fifteen C:: fundamental scalars from the active model as distinct types: no implicit initialization between C:: types and Sec scalars or between different C:: types (C::bool included), explicit conversions in both directions, and representable integer, floating, and boolean literal shaping with per-target range checks (MD-022)"
      - "an unknown C:: name uses S1076 ffi.unknown-c-fundamental-type, a target or analyzer without a C ABI model uses S1077 ffi.c-abi-model-unavailable, and c:: names use S1078 ffi.unresolved-c-binding-type until a binding environment exists (MD-021)"
      - a parser-confirmed CST role keeps foreign-qualified names contiguous in the formatter
      - "extern \"C\" and extern \"system\" signatures are validated per position through one legality classifier: C:: scalars (now including C::bool), fixed-width Sec scalars, RawPtr[T], integer-backed enums, void returns, and ref/ref mut parameters with foreign-representable referents (including fixed arrays) are legal; Sec bool/char/rune, string, decimal, owning dynamic arrays, slices, fixed arrays by value, Option, Result, native collections, ordinary structs and tagged unions, callable values, interfaces, any, string-backed enums, and reference returns are rejected with S1079 ffi.illegal-foreign-type naming the declaration, position, type, ABI, reason, and corrective help; return-type errors point at the written return type; the Sec ABI keeps its ordinary gate. Target-sized int/uint, 128/256-bit integers, and integer-backed Sec enums keep their earlier acceptance; MD-023 (decided 2026-10-08) restricts them, see remaining"
      - "the null sentinel is unsafe-only and has no standalone type: inside unsafe it takes its RawPtr[T] type from an annotation, assignment, return, or an argument position on which every candidate callable agrees, and otherwise reports S1081 ffi.null-without-raw-pointer-context; outside unsafe it reports S1080 ffi.null-outside-unsafe; `== null` and `!= null` report S1082 ffi.null-equality in every context; `raw is null` parses as a dedicated NullTestExpression in if/while conditions, requires unsafe and a RawPtr[T] subject (S1083 ffi.null-test-requires-raw-pointer), and yields bool; `is not null` is rejected; a visible binding named null shadows the contextual sentinel; Semantic IR and LLVM reject the node explicitly until lowering. MD-024 (decided 2026-10-08) changes the negated form and the shadowing rule, see remaining"
      - "MD-020 (2026-10-10): lowercase c:: is the only C qualification; the lexer produces :: as one DOUBLE_COLON token with longest-match precedence after :<- and :=, the parser accepts it only when it touches the names on both sides (P2021 for c :: int, c:: int and c::stddef ::size_t; c: :int stays two ordinary colons), one segment names a fundamental type and more segments a binding (Sema distinguishes them: S1076 unknown fundamental, S1078 unresolved binding), C:: is rejected with the focused P2035 parser.removed-uppercase-foreign-qualifier and recovered as c::, c::fn, c::flex and c::callback keep P2022, a binding named c cannot affect foreign lookup, and the compiler, layout model, diagnostics, LSP and tests use c::"
      - "checked c:: scalar conversions (2026-10-10, ffi.md §8, MD-012/MD-022 §2.5, §4.8): an explicit conversion between a c:: scalar and another integer or floating scalar whose target cannot represent the complete source domain (interval or format comparison under the active C ABI model) is a ConversionError failure point of the enclosing try and is rejected without try by S1139 ffi.checked-conversion-requires-try; widening and compile-time constant conversions stay infallible. Outside a project the LSP analyzes for the host target like the CLI, so c:: types resolve in the editor instead of failing with S1077"
      - "MD-024 (2026-10-10): null is a hard keyword (NULL token, reserved for every declaration), is null and is not null are symmetric bool tests accepted in every boolean-expression position inside unsafe with focused outside-unsafe and non-RawPtr diagnostics naming the written test, == null and != null stay rejected, and null in an Option[T] target points at None in its diagnostic"
      - "MD-022 character literals (2026-10-10): a single-quoted literal in a c::char, c::schar or c::uchar target context shapes by its code-point number when the active ABI model's range holds it (no encoding, no first-byte fallback, plain c::char signedness from the ABI model); an unrepresentable literal reports S1138 once, and typed rune values or other c:: targets still need an explicit conversion"
      - "MD-023 partial (2026-10-10): closed Sec enums (integer-backed or not) and int128/uint128/int256/uint256 are rejected in every extern \"C\"/\"system\" position, including as reference referents, because no C ABI model declares foreign enum or wide-integer support (fail closed per §4.5)"
      - "2026-10-10 follow-up: the checked c:: conversion diagnostic is the general S1139 types.checked-conversion-requires-try, and its proofs use path conditions, immutable binding intervals and bitwise masks, so for example c::uchar(value & 0xFF) and a conversion after an early range-check return need no try"
    remaining:
      - "SEC-MLIR-P25 (callable ABI classification and foreign representation boundary, schema/lowering v21) installed 2026-10-16, not implemented: one immutable ABIModel per CompilationPlan, CallABIPlan, Semantic IR callable/foreign ABI intent and v21 sec.abi.* dialect/lowering (rules/mlir/packages/sec-mlir-dialect_package25.md, sec_callable_abi_sync_package25.md, sec_semantic_ir_callable_abi_package25.md, sec_mlir_dialect_v21.md, sec_mlir_lowering_v21.md); depends on P24 resolved layouts; no new P25 decision; gated by MD-019, MD-021, MD-045 and MD-052; applied MD-020, MD-023 and MD-024 are to be implemented, not reopened"
      - "MD-021 (rules/corrections/applied/md020-md021-md023-md024-ffi-c-bindings-null-correction-20261008.md § 3): resolve c:: binding types through the platform C binding environment selected by the CompilationPlan, available without an import, with fail-closed handling of missing, incompatible, ambiguous, stale or untrusted metadata and no host fallback (currently S1078 for every c::namespace::name). The binding-environment serialization and selection format is not yet specified by the target/platform/build rulebooks; that specification must exist before this item can close"
      - add target-specific calling-convention availability and ABI-model-dependent classification (aggregate, variadic, and function-pointer forms) before backend lowering; per-position type legality is implemented (S1079)
      - "MD-023 (rules/corrections/applied/md020-md021-md023-md024-ffi-c-bindings-null-correction-20261008.md § 4): accept target-sized int/uint in a foreign signature only where the selected ABI model proves size, signedness, alignment and argument/return classification for that exact position (currently accepted whenever the target plan resolves their width), accept 128/256-bit integers only once a C ABI model declares explicit support, and accept extern \"C\" enums once they exist; cover Windows and non-Windows ABI profiles"
      - record is null branch refinement as a non-null proof fact for raw-to-safe conversion once that conversion exists; record is not null as the symmetric canonical test
      - parse and validate complete and incomplete extern C structs with ABI layout and no implicit Defaultable construction
      - implement untagged extern C unions with ABI layout and foreign-unsafe member-access facts
      - implement open extern C enums with ABI-selected representation and unknown-value handling
      - parse, lay out, range-check, and lower C bitfields including unnamed and zero-width rules and non-addressability
      - implement final-field-only descriptor-free C::flex flexible-array members
      - validate foreign references as non-retained call-bounded borrows and connect them to borrow, lifetime, escape, and effect analyses
      - add C::fn foreign function-pointer types, nullable-call proof, ABI classification, and lowering distinct from native callable types
      - implement C::callback for exact environment-free reusable callables and reject capturing, mut fn, and consuming callables
      - implement final bare C varargs only for unsafe extern C and C::fn, including default promotions and target classification
      - keep C varargs distinct from native typed variadics, Sec spread, ref parameters, and native pack representation
      - add explicit string encoding, termination, embedded-zero, buffer length, and incoming foreign-text wrapper support without hidden string ABI conversion
      - model foreign resources through nominal Sec owners, explicit retain/clone, transfer-on-success, and fallible-close contracts
      - keep raw foreign status/null/error protocols distinct from Result and Option until wrappers normalize them
      - reject unwind and non-local transfer across active FFI and callback boundaries
      - preserve trusted extern effect-contract provenance and treat unspecified foreign effects conservatively
      - resolve libraries, objects, frameworks, import libraries, and search paths through package/build CompilationPlan metadata
      - preserve foreign data kind, ABI identity, bitfield/flex metadata, function pointers, callback adaptation, varargs, effects, and dependencies in Semantic IR and Sec MLIR
      - add the complete parser, Sema, borrow, lifetime, ownership, effects, layout, formatter, LSP, target, Semantic IR, MLIR, LLVM, and diagnostic regression matrix required by ffi.md
    excluded:
      - C or C++ header parsing, preprocessing, typedef syntax, macros, and static-inline import
      - general named Sec-to-C symbol export
      - capturing closure adaptation to C callbacks
      - automatic slice decomposition and implicit Sec string to C string conversion
      - per-function @library annotations
      - foreign unwind across Sec frames
