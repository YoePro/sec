    semantic_ir_remaining:
      - represent copy versus consume explicitly
      - represent move source Place and destination ownership
      - represent Availability plus recursive partial and conditional masks where lowering needs them
      - preserve UnavailableReason and source provenance for tooling
      - represent pending and committed call-transfer facts or an equivalent resolved ownership plan
      - distinguish replacement from reinitialization
