  - id: frontend.switch-cfg-and-enum-coverage
    area: frontend-control-flow
    status: partial
    audited: '2026-08-20'
    repository_baseline: c515862
    document_revision: '2.0'
    document_created: '2026-08-16'
    document_last_updated: '2026-08-16'
    summary: Supplements frontend.switch-statements-v2 with four related frontend control-flow/coverage defects. Case
      expressions are all inferred through the live analyzer state even though runtime case tests are lazy; skipped
      dynamic cases can therefore commit ownership/resource/arena/borrow/effect state. Case bodies are analyzed independently
      and a body ending in fallthrough is marked non-continuing without routing its resulting state into the next
      case body, so fallthrough ownership/assignment state can be lost. Enum switch coverage records member names
      rather than semantic numeric value classes, allowing numeric aliases to evade duplicate-case detection and distort
      missing-value warnings. Finally, switchCoverageTracker.isExhaustive() recognizes only bool true+false, so a
      fully covered closed enum still gets a synthetic unmatched continuation path and is not recognized by termination/return
      analysis.
    rules:
    - rules/control-flow/flowcontrol_switch.md
    - rules/control-flow/flowcontrol_if.md
    - rules/declarations/enums.md
    - rules/memory/ownership.md
    - rules/memory/borrowing.md
    - rules/compiler/semantic_ir.txt
    code:
    - internal/sema/analyzer.go
    - internal/codegen/mlir/generator.go
    - internal/codegen/llvm/statements.go
    tests:
    - internal/sema/analyzer_test.go
    - internal/sema/copy_move_test.go
    - internal/sema/destruction_test.go
    - internal/codegen/mlir/generator_test.go
    - internal/codegen/llvm/generator_test.go
    - testdata/switch_valid.sec
    - testdata/switch_invalid.sec
    implemented:
    - switch subject expression is inferred once
    - subject and subjectless switch syntax and source order are preserved
    - value, range, relational, and comma-separated alternatives are represented
    - direct fallthrough placement/final/successor validation
    - independent lexical symbol scopes for case bodies
    - compile-time integer/bool/direct-string duplicate checks
    - integer range overlap and value-covered-by-range diagnostics
    - bool true+false coverage removes the unmatched path
    - backend subsets contain ordered/lazy switch control-flow lowering
    - case-test effects follow the source-order unmatched path instead of being committed before every body
    - fallthrough state is merged into the destination body while destination tests remain on the direct-selection path
    - enum case identity and warnings use canonical numeric value classes
    - complete closed-enum coverage removes the unmatched path and participates in return analysis
    partial:
    - comma-separated alternatives retain conservative aggregate frontend state rather than an explicit per-alternative
      resolved CFG edge
    - no durable ResolvedSwitchPlan is published to Semantic IR yet
    remaining:
    - build a canonical path-sensitive resolved switch CFG
    - preserve source-order and comma-alternative short-circuit state
    - keep open bit-backed enum domains open unless the complete bit domain is proven covered
    - make definite assignment, ownership, resources, borrows, termination, call/effect reachability, Semantic IR,
      diagnostics, and lowering consume the same resolved switch plan
    - add focused lazy-case, fallthrough-state, alias, and enum-exhaustiveness regression coverage
    bug_reference:
    - correction24.md
    governance_reconciliation:
    - 'Narrow "exactly-once subject evaluation and ordered lazy case evaluation": subject inference is once and backend
      subsets lower lazily, but frontend runtime-state/effect analysis of case tests is eager.'
    - 'Narrow "independent case scopes and definite-assignment merging over continuing paths" and "termination analysis
      including explicit fallthrough chains": lexical scopes exist, but fallthrough state is not propagated as a CFG
      edge into the destination case.'
    - Keep integer/bool/direct-string duplicate and integer-range coverage as implemented. Add enum alias/value-class
      duplicate coverage as partial.
    - Keep enum non-exhaustiveness warning support only at the current member-name level; semantic value-class coverage
      and complete closed-enum flow proof remain partial.
    - Existing remaining backend, cleanup, unit, diagnostics, formatter, LSP, and loop-control work remains unchanged.
    required_tests:
    - skipped later consuming case call leaves source available
    - skipped later case call does not register reachable effect
    - subjectless comma alternatives short-circuit frontend state
    - move in fallthrough source remains moved after destination continuation
    - destination body merges direct and fallthrough ownership state
    - assignment/resource/arena/borrow state propagates across fallthrough
    - destination tests are skipped on fallthrough edge
    - enum numeric aliases are duplicate switch cases
    - enum warning reasons by unique runtime value class
    - complete closed-enum switch removes unmatched path
    - complete closed-enum all-returning switch satisfies function return analysis
    - open bit-backed declared members alone remain non-exhaustive

