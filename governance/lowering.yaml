      - reproducible real-tool verification through an absolute SEC_MLIR_BIN path with regression coverage rejecting relative paths
      - complete schema-9 struct verifier mismatch matrix for field ordinals, operands, metadata counts, spread results, extraction, and replacement
      - ordered-tag round trips and explicit adjacent schema-8 compatibility coverage
      - nested 32-bit and 64-bit struct scalar resolution with identities, tags, ordinals, executable extract/replace operations, and checked-integer boundaries preserved
      - trivial-core preserves high-level struct storage declare, init, and load operations without memref conversion
      - trusted compiler-core builtin impl acceptance without path-based privilege escalation
      - current compiler-core IsEmpty and IsLetter property resolution
      - locally handled checked Linux errno conversion into the exact LinuxError carrier across file and filesystem syscalls
      - path-complete file and directory cleanup with one unconditional close before result selection
      - static-v2 module storage classification and handler-local move/discard availability state
      - explicit unit declarations in struct, property, and Result fixtures without implicit spelling-based unit authority
      - reference-holder rebind transitions that release replaced borrows transactionally
      - branch-scoped union provenance priority and caller-owned projected-place escape rejection
      - interprocedural parameter reference origins preserved through field and slice projection
      - repository-wide Go and vet acceptance gates restored
      - canonical Semantic IR, dialect, and lowering rulebooks synchronized to Package 13
      - complete Package 13 section-74 struct type matrix, including nested impl identities, generic and wide fields, tags, property exclusion, and optional LayoutRef
      - strict Semantic IR rejection tests for duplicate or non-contiguous struct field identities and duplicate field names
      - ResolvedStructLiteralPlan independence from optional legacy AST default materialization, with default and multiple-spread matrices
      - source-ordered, exactly-once struct evaluation with declaration-ordered construction and the P13 trivial action boundary
      - scalar, wide, nested, parameter, and return-value field reads while property members remain distinct compiler-owned facts
      - explicit and defaulted mutable struct locals with RHS-first, leaf-to-root replacement and one root store
      - stable guarded synthetic union-payload structs with wide fields and explicit non-trivial payload rejection
      - package-tagged parser, Sema, and Semantic IR rejection matrix for non-trivial struct ownership, borrow, property, method, equality, lifecycle, and foreign-ABI paths
      - unsupported Semantic IR builds return no partial module and never substitute placeholder operations
      - successful construction, spread, and field-read paths contain no hidden storage, physical offsets, poison, undef, or LLVM aggregate vocabulary
      - source-to-schema-9 verification on both 32-bit and 64-bit scalar plans with target-sized struct fields resolved to the exact signed and unsigned widths
      - Package 13 section-90 acceptance completed and the mandatory section-91 implementation report recorded
