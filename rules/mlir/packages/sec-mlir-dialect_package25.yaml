governance_policy:
  reuse_existing_ids: true
  do_not_duplicate: true
  preflight_inventory_required: true
existing_gates:
  MD-019: explicit layout source syntax
  MD-021: 'target c:: binding environment source/metadata'
  MD-045: imported external callable/stack/reentry contracts
  MD-052: privileged core body syntax (adjacent)
applied_decisions_not_reopen:
- MD-020
- MD-023
- MD-024
new_decisions: []
source_abi_families:
- Sec
- C
- system
abi_model:
  per_concrete_compilation_plan: true
  model_is_authority: true
  classify_positions:
  - parameter
  - return
  - foreign-vararg
  passing_kinds:
  - Direct
  - Indirect
  - Ignore
  whole_call_resource_assignment: true
  return_first: true
  source_ownership_unchanged: true
  canonical_layout_reused: true
  cold_fallback: true
foreign:
  ordinary_extern_requires_unsafe_call_context: false
  unsafe_extern_requires_unsafe_call_context: true
  c_type_prefix: 'c::'
  c_fn_pointer: c::fn
  callback_adapter: c::callback
  capturing_closure_as_callback: false
  general_c_export: false
  c_varargs_requires_unsafe_extern: true
  no_unwind_across_boundary: true
  native_string_direct_ffi: false
  foreign_borrow_call_bounded: true
semantic_ir:
  retains_semantic_signature: true
  abi_transport_later: true
  preserve:
  - calling convention intent
  - foreign trust/unsafe contract
  - source transfer actions
  - layout refs
  - concrete generic identity
  - callback/vararg legality
  - hidden internal allocation context
dialect:
  planned_schema: 21
  ops:
  - sec.abi.pack_arg
  - sec.abi.unpack_arg
  - sec.abi.prepare_indirect
  - sec.abi.prepare_return
  - sec.abi.pack_return
  - sec.abi.unpack_return
  - sec.abi.call
  - sec.abi.func
  - sec.abi.callback_bridge
  - sec.abi.vararg_promote
  typed_metadata:
  - ABIModelRef
  - CallABIPlanRef
  - ABISignatureRef
  - ABIFingerprint
  verifiers:
  - --sec-verify-call-abi-plans
  - --sec-verify-abi-lowering
  - --sec-verify-ffi-boundaries
  - --sec-verify-abi-compatibility
lowering:
  planned_version: 21
  passes:
  - --sec-resolve-call-abi
  - --sec-lower-call-abi
  llvm_required: false
  sret: true
  hidden_arg_order_model_defined: true
  cross_module_checks: true
