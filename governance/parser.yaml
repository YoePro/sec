schema_version: 1
area: parser
purpose: Grammar consumption, parser recovery, and parse diagnostics.
integrations:
  - id: frontend.parser-recovery-result
    area: frontend
    status: partial
    integrated: "2026-08-07"
    revised: "2026-09-16"
    summary: >-
      Introduces the canonical ParseResult migration path and retains selected
      malformed syntax and parser repairs as structured recovery data.
    rules:
      - rules/compiler/parser_recovery.md
      - rules/foundations/grammar.md
      - rules/foundations/lexical_structure.md
      - rules/tooling/diagnostics.txt
      - rules/tooling/lsp.md
    code:
      - internal/parser/function_stub.go
      - internal/diagnostics/diagnostics.go
      - internal/ast/ast.go
      - internal/parser/parser.go
      - internal/parser/expression.go
      - internal/parser/recovery.go
      - internal/sema/analyzer.go
      - cmd/compiler/main.go
      - cmd/compiler/diagnostic_catalog.go
      - cmd/lsp/main.go
    implemented:
      - complete ordinary function signatures without bodies retain nil-body AST declarations and emit P2019 parser.unimplemented-function on the name; later functions and impl methods survive
      - parser diagnostics carry structured Help exposed in CLI, diagnostic catalog, and LSP; function-stub help suggests an empty body for void, a temporary return for plain builtin values, and a valid declared-type value for other returns
      - legal extern declarations and interface requirements remain exempt from unimplemented-function diagnostics
      - ParseResult containing Program, Diagnostics, Warnings, Recovery, HasErrors, and Fatal
      - compatibility retention of ParseProgram, Errors, Warnings, and Diagnostics
      - structured recovery events for virtual missing-token insertion
      - structured recovery events for skipped statement token ranges
      - InvalidStatement nodes retained at top level and in ordinary statement blocks
      - unterminated ordinary statement blocks retain parsed statements and enclosing function/control-flow nodes at EOF while parser errors still block code generation
      - unterminated switch bodies retain their subject, ordered case/default clauses and clause bodies, including empty switches, while parser errors still block code generation
      - unterminated select bodies retain ordered operation, timeout and default branches, bindings and partial branch bodies at EOF while preserving parser errors
      - unterminated match and try-handler blocks retain their subject/protected expression plus ordered completed or recovered arms/handlers at EOF; enclosing returns, functions, and declarations survive while the EOF diagnostic remains recoverable and blocks code generation
      - select branch parsing consumes and records a skipped token when a malformed header would otherwise retry the same token indefinitely
      - InvalidExpression nodes for missing Pratt prefix parsers
      - invalid TypeReference marking with recovery metadata on parenthesized, reference, function, prefix sequence, qualified-name, unit-only, unit-annotated, and postfix bracket paths; malformed qualified/unit forms retain parsed source facts, while fixed arrays, collection/shaped constructors, Event/EventStorage arguments, and ordinary generic arguments retain the enclosing invalid type plus completed arguments and preserve following declarations
      - expression-owned explicit generic calls retain invalid argument positions, resume at top-level commas or closing brackets without consuming outer delimiters, preserve later valid type arguments, and keep the call plus following statements and declarations
      - lifecycle new expressions retain their committed NewExpression, invalid target TypeReference with recovery metadata, parsed arguments, and following siblings when a recoverable target-type error occurs
      - composite function and prefix-sequence types propagate invalid retained parameter, return, and element references to their outer type; malformed fixed-array length and collection/shaped constant expressions preserve the diagnosed outer shape, completed children, and following declarations
      - InvalidDeclaration nodes for failed declaration-shaped top-level statements
      - InvalidMember nodes and skipped ranges for disallowed impl members
      - InvalidPattern nodes for malformed match arms and try handlers
      - delimiter-aware later-line sibling recovery for match arms and try handlers
      - skipped-range recovery events for impl members, match arms, and try handlers
      - semantic ErrorType propagation for invalid expressions and type references
      - speculative parser rollback removes associated recovery events
      - recovery contexts and numbered episodes on structured diagnostics and recovery events
      - diagnostic deduplication by ID, primary token, and recovery context
      - same-location secondary diagnostic suppression within active recovery episodes
      - speculative rollback reconstruction of deduplication and episode state
      - shared delimiter stack preserving mismatched outer closers
      - delimiter-aware recovery for struct fields, switch/select entries, directives, generic parameters, declaration tails, malformed for headers, attributes, properties, and balanced blocks
      - malformed generic parameter entries recover at top-level commas, list closers, callable/body/implements/default/contract boundaries, retaining completed and later comma-separated parameters plus the enclosing declaration
      - committed function and lambda parameters with an empty type position retain an invalid TypeReference with recovery metadata, resume at comma or closing parenthesis, and preserve later parameters, bodies, enclosing expressions, statements, and declarations
      - ordinary functions and shared interface/extern signature parsing retain an invalid return TypeReference when the mandatory return type is missing; ordinary bodies and later member/declaration siblings remain attached without inferring void
      - interface property requirements retain missing or malformed declared types as invalid TypeReference nodes, recover to a reliable body brace without consuming outer/member boundaries, and preserve accessors plus later interface and top-level siblings
      - interface event requirements retain empty or malformed payload positions as invalid TypeReference nodes, consume a reliable owned closing bracket, and preserve later interface members and top-level declarations
      - committed interface and impl implements lists retain invalid conformance type positions, recover at top-level commas without consuming declaration bodies or contract/default tails, and preserve later valid interface references plus owning declarations
      - enum headers with a missing or malformed explicit underlying representation retain an invalid TypeReference, recover to a reliable body brace, and preserve enum values plus following declarations
      - malformed enum member positions retain source-ordered invalid EnumValue nodes with recovery metadata and synchronize at commas, later-line identifiers, the body close, or EOF without losing later members and declarations
      - register declarations with an empty width retain an InvalidExpression at the width position, consume the owned closing bracket, and preserve register fields plus following declarations
      - register bit fields with an empty width retain the field and an InvalidExpression at the width position, consume the owned closing bracket, and preserve later fields and declarations
      - skipped-range events from each migrated delimiter-aware recovery helper
      - unsupported if expressions in initializer position retain one InvalidExpression and consume their complete if, else-if, and else bodies without losing following statements or impl members
      - LSP diagnostics continue semantic declaration analysis after non-fatal parser recovery and suppress semantic diagnostics whose primary location belongs to a parser recovery range
      - duplicate function and method signatures remain visible after a recovered error in an earlier function body
      - semantic diagnostic occurrences carry explicit primary end line and exclusive end column fields, and LSP ranges use them instead of hardcoded one-character highlights
      - fixed-arity calls with excess arguments focus the first excess argument and retain the complete expression range
      - try handler-brace disambiguation is scoped to the outer try operand in both expression and statement parser paths, so typed struct literals remain valid inside nested call arguments and a following handler block is not misread as a struct literal on the completed call
      - deterministic 100-diagnostic parser cap with one terminal P2015 diagnostic
      - central CLI and LSP parse paths consume ParseResult
      - P2011 mentor diagnostics recognize reversed type declaration order such as type struct Name, type union Name, and type register Name and show the canonical type Name kind form
      - fix-enabled formatting safely rewrites reversed struct and union declarations and register declarations with a proving Name[width] shape while ordinary formatting leaves invalid source unchanged
      - ordinary statement-terminator semicolons emit focused P2012 parser.reserved-syntax diagnostics, retain exact InvalidStatement recovery nodes, and preserve following same-line top-level and block statements; C-style for headers retain their specialized diagnostic
    tests:
      - internal/parser/select_recovery_test.go
      - testdata/parser/unterminated_select_invalid.sec
      - testdata/parser/unterminated_empty_select_invalid.sec
      - testdata/parser/unterminated_select_branch_invalid.sec
      - testdata/parser/select_nonprogress_invalid.sec
      - internal/parser/function_stub_test.go
      - testdata/parser/function_stubs_invalid.sec
      - testdata/parser/bodyless_requirements_valid.sec
      - internal/parser/switch_recovery_test.go
      - testdata/parser/unterminated_switch_invalid.sec
      - testdata/parser/unterminated_empty_switch_invalid.sec
      - internal/parser/parser_test.go
      - testdata/parser/unterminated_function_invalid.sec
      - testdata/parser/unterminated_empty_block_invalid.sec
      - testdata/parser/unterminated_nested_blocks_invalid.sec
      - testdata/parser/unterminated_recovered_block_invalid.sec
      - testdata/parser/semicolon_invalid.sec
      - internal/parser/unterminated_match_try_recovery_test.go
      - testdata/parser/unterminated_match_invalid.sec
      - testdata/parser/unterminated_try_handlers_invalid.sec
      - internal/parser/invalid_postfix_type_recovery_test.go
      - testdata/parser/invalid_postfix_type_references_invalid.sec
      - internal/parser/invalid_base_type_recovery_test.go
      - testdata/parser/invalid_base_type_references_invalid.sec
      - internal/parser/invalid_composite_type_recovery_test.go
      - testdata/parser/invalid_composite_type_references_invalid.sec
      - internal/parser/generic_argument_recovery_test.go
      - testdata/parser/invalid_explicit_generic_arguments_invalid.sec
      - internal/parser/new_expression_recovery_test.go
      - testdata/parser/invalid_new_target_type_invalid.sec
      - internal/parser/generic_parameter_recovery_test.go
      - testdata/parser/malformed_generic_parameters_invalid.sec
      - internal/parser/missing_parameter_type_recovery_test.go
      - testdata/parser/missing_parameter_types_invalid.sec
      - internal/parser/missing_function_return_type_recovery_test.go
      - testdata/parser/missing_function_return_types_invalid.sec
      - internal/parser/interface_property_type_recovery_test.go
      - testdata/parser/invalid_interface_property_types_invalid.sec
      - internal/parser/interface_event_payload_recovery_test.go
      - testdata/parser/invalid_interface_event_payloads_invalid.sec
      - internal/parser/implements_list_recovery_test.go
      - testdata/parser/invalid_implements_entries_invalid.sec
      - internal/parser/enum_underlying_recovery_test.go
      - testdata/parser/invalid_enum_underlying_types_invalid.sec
      - internal/parser/enum_member_recovery_test.go
      - testdata/parser/invalid_enum_member_invalid.sec
      - internal/parser/register_width_recovery_test.go
      - testdata/parser/missing_register_width_invalid.sec
      - internal/parser/register_field_width_recovery_test.go
      - testdata/parser/missing_register_field_width_invalid.sec
    verification:
      - command: emit-mlir with -o - over the four select recovery invalid fixtures
        result: all rejected with parser errors before code generation (exit 2)
      - command: go test ./internal/parser -run 'TestUnterminatedSelect|TestMalformedSelect' -count=1 -timeout=5s
        result: passed; empty, populated and partial-branch selects retain AST contents; malformed headers make progress and retain following declarations
      - command: go test ./internal/parser ./cmd/lsp ./cmd/compiler -run "UnimplementedFunction|BodylessRequirements|DiagnosticCatalog" -count=1
        result: passed; named stub diagnostics, return-sensitive help, declaration retention, legal bodyless exemptions, LSP name ranges, and catalog schema
      - command: go test ./internal/parser -run TestUnterminatedSwitchRetainsClauses -count=1
        result: passed; empty switch and ordered case/default bodies survive EOF with a parser error
      - command: go test ./...
        result: passed
      - command: emit-mlir --verify over testdata/ir
        result: passed
      - command: validate implementation-status.yaml
        result: passed
      - command: go test ./internal/parser -run 'TestParse.*Try.*StructLiteral' -v && go run ./cmd/compiler parse ../bootstrap/internal/lexer/lexer.sec
        result: passed; the bootstrap Diagnostic struct literal in the Append argument parses without treating its brace as a try-handler boundary
      - command: GOMAXPROCS=2 go test ./cmd/lsp -count=1
        result: passed
      - command: GOMAXPROCS=2 go test ./internal/parser -run 'TestInvalidIfInitializerRecoveryPreservesFollowingImplMethods|TestParseResultRetainsRecoveryEventsAndInvalidNodes' -count=1
        result: passed
      - command: go test ./internal/parser -run TestUnterminatedStatementBlocksRetainPartialAST -count=1
        result: passed; empty, populated, nested, and previously recovered unterminated statement blocks retain partial AST nodes and parser errors
      - command: go test ./internal/parser -run TestSemicolonDiagnosticPreservesFollowingStatements -count=1
        result: passed; three P2012 diagnostics retain exact invalid nodes and recovery events while preserving same-line sibling statements and the following function
      - command: go test ./internal/parser -run TestUnterminatedMatchAndTryBlocksRetainPartialChildren -count=1
        result: passed; EOF diagnostics remain recoverable while two ordered match arms or try handlers and their enclosing return/function AST survive
      - command: go test ./internal/parser -run TestInvalidPostfixTypeReferencesAreRetained -count=1
        result: passed; five malformed postfix bracket families retain explicit invalid TypeReference metadata and all following declarations
      - command: go test ./internal/parser -run TestInvalidQualifiedAndUnitTypeReferencesAreRetained -count=1
        result: passed; incomplete qualified names and invalid closed unit expressions retain invalid type nodes, source spelling, and the following declaration
      - command: go test ./internal/parser -run TestInvalidCompositeTypeReferencesPropagateRecovery -count=1
        result: passed; invalid callable children, prefix-sequence elements, array lengths, and shaped constants propagate to retained outer types without losing the next declaration
      - command: go test ./internal/parser -run TestInvalidExplicitGenericArgumentsRetainCallsAndSiblings -count=1
        result: passed; malformed and empty explicit generic argument lists retain invalid type positions, later valid arguments, enclosing calls, and following siblings
      - command: go test ./internal/parser -run TestInvalidNewTargetTypeRetainsConstructionAndSiblings -count=1
        result: passed; a malformed generic construction target retains its invalid type, parsed arguments, enclosing new expression, and following siblings
      - command: go test ./internal/parser -run TestMalformedGenericParametersPreserveLaterParametersAndDeclarations -count=1
        result: passed; malformed entries preserve later comma-separated parameters, and a missing list closer stops before the callable boundary without losing either function body or following declarations
      - command: go test ./internal/parser -run TestMissingParameterTypesRetainParametersAndDeclarations -count=1
        result: passed; missing function and lambda parameter types retain invalid type metadata, later parameters, bodies, enclosing declarations, and the following top-level declaration
      - command: go test ./internal/parser -run TestMissingFunctionReturnTypesRetainFunctionsAndSiblings -count=1
        result: passed; missing mandatory return types retain invalid type metadata on ordinary and interface functions while preserving bodies, member siblings, and following declarations
      - command: go test ./internal/parser -run TestInvalidInterfacePropertyTypesRetainPropertiesAndMembers -count=1
        result: passed; missing and malformed property types retain invalid type metadata, getter requirements, later interface methods, and the following top-level declaration
      - command: go test ./internal/parser -run TestInvalidInterfaceEventPayloadsRetainEventsAndMembers -count=1
        result: passed; empty and malformed event payloads retain invalid type metadata while preserving both later interface methods and the following top-level declaration
      - command: go test ./internal/parser -run TestInvalidImplementsEntriesRetainDeclarationsAndLaterInterfaces -count=1
        result: passed; malformed conformance entries retain invalid type metadata and later valid interfaces without losing interface/impl members or the following declaration
      - command: go test ./internal/parser -run TestInvalidEnumUnderlyingTypesRetainEnumsAndValues -count=1
        result: passed; missing and malformed explicit underlying representations retain invalid type metadata, both enum bodies and values, and the following declaration
      - command: go test ./internal/parser -run TestInvalidEnumMembersRetainLaterMembersAndDeclarations -count=1
        result: passed; a malformed enum member retains invalid recovery metadata and preserves the later member, following enum, and following function
      - command: go test ./internal/parser -run TestMissingRegisterWidthRetainsRegisterFieldsAndDeclarations -count=1
        result: passed; an empty register width retains invalid expression metadata, the complete field body, a later valid register declaration, and the following function
      - command: go test ./internal/parser -run TestMissingRegisterFieldWidthRetainsFieldsAndDeclarations -count=1
        result: passed; an empty bit-field width retains invalid expression metadata, the current and later fields, a later register declaration, and the following function

    remaining:
      - invalid type retention in remaining specialized failure paths beyond explicit generic calls and lifecycle new expressions
      - skipped-range and shared-stack migration for remaining specialized recovery helpers
      - recovery contexts for remaining specialized parsers
      - cross-location causal recovery-episode suppression
      - partial unterminated-construct retention beyond ordinary statement blocks, switch/select bodies, match arms, and try handlers
      - recovery-aware Sema traversal policy for every invalid subtree
      - recovery fuzzing and mutation tests
  - id: frontend.increment-decrement-aliases
    area: frontend-and-tooling
    status: implemented
    integrated: "2026-09-11"
    summary: >-
      Implements statement-only postfix increment and decrement as parser
      aliases for the existing compound-assignment semantics, with canonical
      formatter and LSP token support and no new lowering operation.
    rules:
      - rules/foundations/lexical_structure.md
      - rules/foundations/grammar.md
      - rules/foundations/operators.md
      - rules/tooling/formatter.md
      - rules/tooling/lsp.md
    code:
      - internal/lexer/lexer.go
      - ../bootstrap/internal/lexer/lexer.sec
      - internal/ast/ast.go
      - internal/parser/parser.go
      - internal/formatter/formatter.go
      - internal/lsp/features/semantic_tokens.go
      - cmd/lsp/main.go
      - vscode/syntaxes/sec.tmLanguage.json
    tests:
      - internal/lexer/lexer_test.go
      - internal/parser/parser_test.go
      - internal/sema/analyzer_test.go
      - internal/formatter/formatter_test.go
      - cmd/lsp/main_test.go
      - testdata/lexer/increment_decrement.sec
      - testdata/parser/increment_decrement_valid.sec
      - testdata/parser/increment_decrement_invalid.sec
      - testdata/sema/increment_decrement_invalid.sec
      - testdata/formatter/increment_decrement.sec
    implemented:
      - longest-match INCREMENT and DECREMENT tokens in the Go and bootstrap lexer sources
      - parser normalization to += 1 and -= 1 assignment AST nodes while retaining the original source token
      - same-line, complete-statement enforcement and focused rejection of expression-position aliases
      - existing compound-assignment mutability, typing, contract, ownership, and overflow checks without a parallel semantic path
    verification_notes:
      - parser-confirmed canonical formatter normalization that preserves invalid expression uses
      - LSP semantic operator tokens and TextMate operator recognition
      - no dedicated Semantic IR or lowering operation; canonical compound assignment remains the downstream representation
    verification:
      - command: go test ./internal/lexer ./internal/parser ./internal/sema ./internal/formatter ./cmd/lsp -run 'Increment|Decrement' -count=1
        result: passed
      - command: go run ./cmd/compiler parse ../bootstrap/internal/lexer/lexer.sec
        result: passed

  - id: frontend.grammar-conformance
    area: frontend-parser-ast-sema-and-recovery
    status: partial
    audited: "2026-08-19"
    document_revision: inferred 1.x / pre-v2 consolidated grammar; no explicit revision metadata
    document_baseline:
      review_date: "2026-08-01"
      note: >-
        grammar.md has later point synchronizations, so its current text mixes
        the older reviewed implementation-status snapshot with newer normative
        decisions. Later specialized rulebooks take precedence on conflicts.
    repository_baseline: c515862
    summary: >-
      Tracks cross-cutting grammar conformance and legacy compatibility/recovery
      forms that are still accepted by the parser but are not canonical under
      later Sec 0.1 rulebooks. Feature-specific semantic and lowering status
      remains owned by the corresponding governance entries.
    rules:
      - rules/foundations/grammar.md
      - rules/foundations/lexical_structure.md
      - rules/projects/modules.md
      - rules/declarations/struct.md
      - rules/types/contracts.md
      - rules/collections/collections.md
    code:
      - internal/parser/parser.go
      - internal/ast/ast.go
      - internal/sema/analyzer.go
      - internal/formatter
    tests:
      - internal/parser/parser_test.go
    implemented:
      - canonical postfix fixed-array and owning-dynamic-array type syntax
      - rejection of dotted source module declarations according to modules.md revision 1, superseding stale grammar implementation-status text
      - standalone 'struct Name { ... }' parsing as legacy compatibility syntax
      - prefix '[N]Type' and '[]Type' sequence-type parsing as legacy compatibility syntax
      - '''type Name = ExistingType'' and compact ''='' variant parsing as legacy compatibility syntax'
      - inline field-contract parsing remains available as a legacy parser path
      - substantial parser unit coverage exists for canonical declarations, expressions, control flow, types, recovery, and several legacy forms
    partial:
      - compatibility syntax is not handled through one uniform migration/recovery policy
      - prefix sequence syntax is accepted, while canonical collections.md revision 1 defines postfix T[N] and T[] syntax
      - standalone struct syntax is accepted, while struct.md revision 2.0 defines 'type Name struct' as the canonical declaration
      - inline field and variable contract syntax is still accepted even though the canonical contracts rulebook restricts contracts to named types
      - the continuing language role of compact '=' type/variant syntax is unresolved by a dedicated modern rulebook
      - grammar.md still contains a 2026-08-01 implementation-status snapshot that is partly stale relative to later rulebooks and current governance
    remaining:
      - migrate the remaining grammar implementation-status material into implementation-status.yaml
      - reconcile or remove stale grammar status statements that conflict with later rulebooks, including the old dotted-module claim
      - reconcile stale 'require' contextual-identifier text with the later lexical_structure.md rule that reserves require globally
      - define and enforce one policy for legacy compatibility forms: reject, emit a focused migration diagnostic, or formatter-normalize where the owning rule explicitly permits normalization
      - remove or focused-diagnose obsolete inline field and variable contracts according to contracts.md
      - normalize or focused-diagnose prefix sequence types rather than silently treating them as ordinary canonical source
      - provide focused migration treatment for standalone struct declarations if they remain parser recovery syntax
      - resolve the future of 'type Name = ExistingType' and compact '=' variants against the modern named-type, enum, and union rulebooks
      - create the canonical grammar fixture suite required by grammar.md
      - keep parser recovery tests distinct from accepted canonical-language tests so compatibility syntax cannot silently become canonical
    required_fixtures:
      - grammar_valid.sec
      - grammar_invalid.sec
      - grammar_declarations_valid.sec
      - grammar_declarations_invalid.sec
      - grammar_types_valid.sec
      - grammar_types_invalid.sec
      - grammar_statements_valid.sec
      - grammar_statements_invalid.sec
      - grammar_expressions_valid.sec
      - grammar_expressions_invalid.sec
      - grammar_contextual_valid.sec
      - grammar_contextual_invalid.sec
      - grammar_recovery.sec
    verification_notes:
      - grammar.md explicitly requires the fixture suite above; representative grammar_valid.sec, grammar_invalid.sec, and grammar_recovery.sec are not present under testdata/ at the audited repository baseline.
      - parser_test.go still contains positive tests for standalone struct, compact '=' variants, and inline struct-field contracts, confirming that these legacy paths remain accepted rather than merely recognized for an error diagnostic.
