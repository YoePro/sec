  - id: platform.inline-assembly-v1
    area: platform-inline-assembly
    status: partial
    reviewed: '2026-09-03'
    document_revision: '1.0'
    repository_baseline: 998d8d1
    summary: Tracks Sec 0.1 source-level inline assembly as an explicit unsafe, target-specific machine-operation
      boundary with typed fixed-width operands, RawPtr address operands, explicit clobbers/effects, observable-by-default
      execution, structured control-flow and stack boundaries, compiler-visible symbol dependencies, target/privilege
      validation, syscall and execution-environment transition contracts, Semantic IR/Sec MLIR preservation, LLVM/backend
      materialization, and compiler/LSP diagnostics.
    rules:
    - rules/platform/inline_assembly.md
    - rules/memory/unsafe.md
    - rules/platform/platform_model.md
    - rules/platform/target_profiles.md
    - rules/platform/volatile.md
    - rules/platform/hardware-register-access.md
    - rules/platform/interrupts.md
    - rules/platform/ffi.md
    - rules/memory/memory_model.md
    - rules/memory/raw_pointers.md
    - rules/memory/ownership.md
    - rules/memory/borrowing.md
    - rules/memory/copy_move.md
    - rules/memory/destruction.md
    - rules/analysis/effect_analysis.md
    - rules/analysis/isr_analysis.md
    - rules/analysis/stack_analysis.md
    - rules/compiler/semantic_ir.md
    - rules/compiler/linking.md
    - rules/mlir/sec_mlir.md
    code:
    - internal/parser/parser.go
    - internal/sema/analyzer.go
    - internal/codegen/llvm/statements.go
    - sec/platform/linux/amd64/raw_syscall.sec
    tests:
    - internal/parser/parser_test.go
    - internal/sema/analyzer_test.go
    - internal/codegen/llvm/generator_test.go
    implemented:
    - parser recognizes asm statements and the structured asm block form
    - structured parser retains assembly template plus inputs, outputs, and clobbers
    - Sema classifies asm as requiring an explicit unsafe context
    - Sema visits asm input expressions and creates named output bindings in the current partial model
    - legacy LLVM lowering can emit LLVM inline asm with sideeffect semantics
    - legacy LLVM lowering can construct fixed-register input constraints, one fixed-register output, and explicit
      clobber constraints
    - Linux/amd64 platform syscall source uses structured inline assembly with fixed syscall registers and explicit
      rcx/r11/memory clobbers
    - effect-analysis trust provenance already recognizes facts trusted through an inline assembly declaration
    - unsafe governance already identifies inline assembly as an unsafe trust boundary and requires effect/target
      analyses to remain active
    incorrect_or_partial:
    - current LLVM asm block lowering supports exactly one output and hardcodes the result type to i64
    - current LLVM lowering coerces every asm input to i64, including implicit integer extension/truncation, contrary
      to the exact-width rule
    - current LLVM lowering permits pointer-to-i64 coercion rather than preserving RawPtr as a target-aware raw-address
      operand contract
    - current LLVM lowering supplies rcx and r11 as implicit default clobbers when none are declared; canonical inline
      asm has no architecture-specific hidden default clobber set
    - current Sema requires at least one output for structured asm blocks, while canonical instruction-only/side-effect
      asm must be legal without artificial outputs
    - current Sema derives asm output type from the enclosing function return or defaults to int64 instead of resolving
      an explicit low-level output type contract
    - current source platform syscall functions use target-sized int/uint at the asm boundary and require migration
      to explicit fixed-width machine ABI values
    - current platform syscall source places asm directly in unsafe fn bodies and must be synchronized with unsafe.md's
      rule that unsafe fn bodies are not implicitly unsafe contexts
    - current frontend does not yet model register width/class compatibility, target register identity, target feature
      requirements, privilege, or assembler dialect through CompilationPlan
    - current lowering goes from AST-level asm directly toward LLVM constraint strings rather than preserving a first-class
      complete Semantic IR/Sec MLIR asm contract
    - current model does not yet distinguish precise memory effects, unknown memory, external effects, machine-state
      effects, atomic/order/completion contracts, or stack effects
    - current model does not yet carry compiler-visible global symbol dependencies/relocations for asm
    - current model does not yet enforce object-model directive restrictions or general control-flow/stack boundary
      requirements
    remaining:
    - synchronize grammar, unsafe, effects, platform, FFI, ISR, stack, linking, Semantic IR, MLIR, diagnostics, formatter,
      and LSP references
    - retain target applicability scope in its owning target rulebook; asm must only consume the already resolved
      CompilationPlan
    - define the canonical target assembler dialect per resolved target and reject block-local dialect switching that
      escapes the target contract
    - keep real target assembly, multiple instructions, local labels, and target-approved local directives legal
    - preserve explicit unsafe-context requirement for every inline asm operation, including inside unsafe fn bodies
    - replace current target-sized/int64 asm coercion model with fixed-width direct integer operands and exact logical
      width matching
    - support float32/float64 only for compatible target operand classes
    - support RawPtr[T] as the canonical raw-address operand without silently converting it into an integer semantic
      type
    - reject direct string, bool, rune, user-defined, constrained, enum, aggregate, reference, owned-resource, collection,
      and shaped-type register operands in Sec 0.1
    - reserve future target-defined SIMD/GPU machine operand categories without making Sec vectors/tensors direct
      asm operands
    - resolve fixed registers, register classes, immediates, address/memory operands, and target-defined constraints
      against target knowledge rather than LLVM spelling
    - validate immediate width/range and known operand-form restrictions before final backend emission where practical
    - resolve output types independently from physical register width and make outputs available only after normal
      asm completion
    - support same physical register as input and output without conflating Sec value identity or implying in-place
      mutation
    - remove implicit architecture-specific default clobbers and require every destroyed undeclared machine resource
      to be represented explicitly
    - support target machine resources beyond general registers where the target contract defines them
    - make ordinary asm observable by default and preserve its occurrence on live execution paths without turning
      containing declarations into LinkRoots
    - do not add asm volatile, volatile asm, @volatile asm, or other C-style volatile source forms
    - represent memory as compiler-visible unknown memory interaction rather than hardware ordering/synchronization/completion
    - support precise known memory footprints where practical instead of forcing every asm operation to unknown memory
    - represent external/system effects separately from ordinary memory effects
    - preserve canonical hardware, atomic, ordering, completion, cache, DMA, and interrupt effects only through explicit
      owning compiler/platform contracts rather than mnemonic inference
    - ensure raw atomic instructions do not automatically provide Sec atomic/race-freedom proofs
    - ensure raw interrupt-mask instructions do not automatically provide Sec critical-section/preemption proofs
    - enforce one Sec entry and normal fallthrough or explicit no-return semantics for ordinary asm
    - allow target-local labels and internal branches while rejecting arbitrary jumps into or out of Sec CFG
    - reject ordinary inline asm as a direct machine return from the enclosing Sec function or canonical ISR/exception
      return
    - introduce compiler-visible bounded temporary stack-effect contracts and feed them to canonical stack analysis
    - reject persistent stack-pointer changes and permanent stack switching as ordinary inline asm
    - keep naked/manual machine-entry semantics behind a stronger compiler/platform contract rather than implicit
      asm behavior
    - represent machine calls to Sec/foreign/platform symbols through compiler-visible canonical symbol dependencies
      and resolved ABI/effect contracts
    - treat opaque runtime-address calls conservatively when positive callable/ISR/effect proof is required
    - permit target relocations derived from compiler-visible symbols while keeping local asm labels assembler-owned
    - reject ordinary inline asm directives that create sections, global/weak symbols, object placement, hidden file
      inclusion, or compiler-owned debug/unwind metadata
    - classify target assembler directives into local-allowed versus object-model-affecting/forbidden categories
    - permit target-approved raw instruction encodings without treating raw bytes as a waiver of asm effects/clobbers/control-flow
      contracts
    - validate ISA, CPU feature/extension, execution mode, privilege, platform authority, and known context requirements
      against CompilationPlan even when the assembler can encode the instruction
    - prevent inline assembly directives from silently enabling CPU/ISA capabilities absent from the CompilationPlan
    - model syscalls, supervisor calls, traps, hypercalls, firmware calls, and other execution-environment transitions
      through explicit platform contracts
    - keep raw machine/OS error conventions as low-level scalar outputs and construct Result/domain types outside
      the asm boundary
    - keep machine faults/exceptions/traps distinct from ordinary Result error propagation
    - propagate inline asm effects and trust provenance through canonical effect analysis
    - introduce a first-class resolved inline-assembly Semantic IR operation carrying all correctness-relevant contracts
      and source provenance
    - preserve the complete asm contract through Sec MLIR until dependent analyses consume it or equivalent lower-level
      facts are frozen
    - lower Sec constraints to LLVM/backend inline-asm representation without exposing LLVM constraint syntax as the
      source contract
    - reject backend materialization that would weaken clobber, width, observability, target, control-flow, ordering,
      completion, or symbol semantics
    - make LTO/inlining preserve live asm observability and target/context legality while still permitting unreachable
      containing code to be removed
    - export compatible separate-compilation summaries for functions containing asm without requiring consumers to
      reparse assembly text
    - make validation/materialization caches sensitive to asm text, semantic contract, relevant CompilationPlan facts,
      assembler dialect, ABI, and backend/toolchain semantics
    - map target assembler diagnostics back to exact inline-assembly source lines and contract entries
    - make LSP use the exact compiler CompilationPlan and target assembler semantics rather than host architecture
      assumptions
    - provide hover/navigation for resolved target, operands, outputs, clobbers, effects, validation state, and compiler-visible
      symbol dependencies
    - add the complete parser, unsafe, operand-width/type, clobber, observability, memory, control-flow, stack, directive,
      target-feature, privilege, syscall, embedded, hardware/concurrency, ISR, symbol/linking, LTO, separate-compilation,
      diagnostics/LSP, incremental, and determinism regression matrix
    required_tests:
    - instruction-only asm is accepted without artificial input/output sections
    - multi-instruction target assembly and local labels are accepted
    - asm outside explicit unsafe context is rejected
    - asm inside unsafe fn still requires an explicit unsafe context
    - uint32/int32 match a 32-bit machine operand and uint64/int64 match a 64-bit machine operand
    - implicit 32-to-64 and 64-to-32 asm integer conversions are rejected
    - supported RawPtr target-address operand is accepted without semantic integer conversion
    - string, bool, rune, user-defined, constrained, enum, aggregate, reference, owned-resource, and shaped direct
      register operands are rejected
    - fixed-register name resolves against selected target and an architecture-incompatible register is rejected
    - target operand class and immediate range validation is CompilationPlan-sensitive
    - same physical register may be both input and output while Sec input/output values remain distinct
    - asm output is unavailable before the operation and available after normal completion
    - no hidden target-specific default clobbers are inserted for ordinary asm
    - declared clobbers preserve surrounding live machine values correctly
    - ordinary live asm remains after optimization when outputs are unused
    - unreachable private function containing observable asm may be dead-stripped
    - interrupt/startup/platform roots retain asm-containing code through their owning LinkRoot semantics
    - memory clobber forces conservative compiler memory reasoning but does not imply or emit a hardware fence
    - precise declared memory footprint remains more precise than unknown memory
    - raw machine atomic asm does not automatically satisfy Sec atomic/race proof
    - canonical Atomic operation lowered through asm preserves the owning atomic contract
    - raw interrupt-mask asm does not automatically establish Sec critical-section exclusion
    - canonical platform masking primitive lowered through asm preserves interrupt masking semantics
    - internal asm branch/local label is accepted
    - arbitrary branch from asm into Sec CFG is rejected
    - ordinary machine ret is rejected as a direct Sec function exit
    - ordinary interrupt/exception-return instruction is rejected as a source-level ISR return mechanism where target
      classification is known
    - temporary stack use with a finite contract contributes to stack analysis
    - stack-pointer modification without a sufficient stack contract is rejected where known
    - permanent stack switching is not accepted as ordinary fallthrough asm
    - compiler-visible Sec/foreign/platform symbol dependency survives into LinkPlan and target relocation
    - source asm does not require the final mangled symbol spelling
    - ordinary asm global/weak symbol definition is rejected
    - ordinary asm section/object placement directives are rejected
    - ordinary asm hidden include/incbin build dependency is rejected
    - target-approved local/raw encoding directive is accepted where the target contract permits it
    - assembler-known instruction requiring absent CPU feature is rejected by CompilationPlan validation
    - assembler-known privileged instruction is rejected when current execution environment lacks authority
    - asm directive cannot silently enable an unavailable ISA extension
    - cross-compilation validates assembly for the target rather than the host
    - Linux/amd64 raw syscall regression uses fixed-width ABI operands, explicit rcx/r11/memory clobbers, and a raw
      scalar result
    - embedded ARM inline-assembly regression compiles through the target assembler path
    - embedded RISC-V inline-assembly regression compiles through the target assembler path as target support matures
    - syscall/trap raw error convention remains distinct from Sec Result construction
    - single-instruction system transition may carry MayBlock/NoReturn/external effects from platform contract
    - asm effect trust provenance is visible to effect/ISR analysis
    - Semantic IR retains assembly template, typed operands, constraints, clobbers, effects, control flow, stack,
      symbols, target requirements, observability, and source provenance
    - Sec MLIR preserves required asm semantic facts until lowering
    - LLVM/backend constraints are generated from Sec contracts rather than user-written LLVM constraint strings
    - backend failure to represent a required asm contract is diagnosed rather than approximated
    - LTO preserves observable asm on live paths and may eliminate unreachable containing code
    - separate-compilation summary carries asm effects/dependencies and stale summary cannot serve as positive proof
    - asm cache invalidates on assembly text, contract, target feature, dialect, ABI, or relevant toolchain change
    - assembler diagnostic maps to the exact source line within multiline asm
    - Sec contract diagnostics use Sec register/type/effect terminology rather than LLVM constraint syntax
    - LSP and compiler resolve identical asm target/register/feature facts
    - Pending target-assembly validation is not presented as completed Valid
    - identical source, CompilationPlan, contracts, and toolchain semantics yield deterministic resolved asm semantics
    excluded:
    - direct Sec MLIR source injection
    - direct LLVM IR source injection
    - LLVM constraint syntax as Sec source syntax
    - a general volatile keyword, @volatile attribute, asm volatile, or volatile asm form
    - direct high-level string/aggregate/user-defined/shaped asm operands in Sec 0.1
    - implicit integer width conversion at the asm boundary
    - implicit ownership transfer through register operands
    - general asm goto across Sec CFG boundaries
    - ordinary inline-asm naked functions
    - ordinary inline-asm permanent stack switching
    - a parallel global symbol/section/object-file/link model inside asm
    - automatic inference of atomicity, interrupt masking, ordering, completion, blocking, or other correctness-critical
      semantics from instruction mnemonics
    - a specific future GPU/SIMD machine-vector operand design
    - 'target applicability scope syntax such as the exact ownership of #target versus @target'
