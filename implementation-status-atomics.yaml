fragment:
  id: atomics-v2
  merge_target: implementation-status.yaml
  generated_for_rulebook: rules/concurrency/atomics.md
  repository_baseline: 0f5027d
  document_revision: "2.0"
  sec_language_version: "0.1"
  generated_at: "2026-09-06"
  purpose: >
    Synchronize the atomic source surface, core compiler-known declarations,
    type eligibility, memory-order validation, compare-exchange result model,
    fences, tooling, Semantic IR, lowering, and target capability separation.
  codex_instructions:
    - Reconcile with existing entries; do not duplicate stronger/newer evidence.
    - Preserve the language/target separation: Atomic[T] eligibility is semantic; concrete operation support is a CompilationPlan capability.
    - Do not hard-code target bit-width ceilings into language eligibility.
    - Use canonical public CamelCase spellings exactly.
    - Implement MemoryOrder and CompareExchangeResult[T] as real source-visible core declarations, not names only.
    - LSP hover/completion and compiler Sema must consume the same canonical declarations.
    - Do not replace CompareExchangeResult[T] with bool, Option[T], Result[T,T], or Result[void,E].
    - Do not invent weak CompareExchange, float atomics, decimal atomics, arbitrary struct atomics, or lock-free query APIs.
    - Do not enforce a rule that CompareExchange failure order must be weaker than success order.
    - Do reject Release and AcqRel as failure orders.
    - Do implement atomic.Fence(order: MemoryOrder) with mandatory explicit order and reject Relaxed.
    - Do not reintroduce lowercase atomic public methods.

