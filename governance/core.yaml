    implemented:
      - "ordinary private core-helper frontend (2026-10-09, user-scoped separately from low-level bodies): existing fn __Helper syntax is retained by lexer, parser, AST and formatter, including generic signatures and source owner tokens. Sema preserves source-file context across passes and enforces file-private access before direct/generic calls and callable-value binding; trusted core provenance grants no sibling-file access. Module-internal helpers remain callable from sibling files. Shadowing/confusable checks use the visible file surface, and LSP general/expected-return completion uses the same private-function boundary. Fixtures cover formatting fixed points, AST/source identity, both file orders and diagnosed invalid accesses."
      - checked string.Slice validates start <= end and end <= string length before calling the unchecked operation
      - the current compatibility path requires loader-proven core provenance, validates (string, uint, uint) -> string, and records sec/core/string.sec as its exact temporary owner
      - another trusted core source file cannot invoke the source-file-private compatibility helper
      - the current compatibility path keeps the operation out of ordinary LSP completion
      - directly emit pointer offset and end-minus-start length in the AST LLVM and MLIR generators without a helper symbol
      - remove the invalid core implementation that attempted to apply array slice syntax to string
    remaining:
