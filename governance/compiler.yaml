schema_version: 1
area: compiler
purpose: Compiler pipeline, linking, initialization, and artifacts.
integrations:
  - id: compiler.platform-resolution
    area: target-variant-platform-compilation-plan
    status: planned
    repository_baseline: 998d8d1
    remaining:
      - implement canonical Target and Variant identities instead of treating os-arch as Target identity
      - resolve one immutable verified CompilationPlan per selected Target x Variant
      - introduce typed resolved Architecture/CPU/TuneCPU/Device/ABI/TargetProfile/BuildProfile/runtime/execution/memory/link facts
      - separate platform semantic capability from CompilerTargetSupport and toolchain availability
      - remove downstream host-dependent target guessing
      - add deterministic resolution provenance and fingerprints
      - support multi-Variant plan isolation and safe target-independent reuse

  - id: compiler.backend-architecture
    area: semantic-ir-sec-mlir-backend-orchestration
    status: partial
    repository_baseline: 998d8d1
    implemented:
      - Semantic IR and dedicated verifier exist
      - P1-P14 provide versioned Sec MLIR schemas and executable verified vertical lowering slices
      - real sec-mlir-opt / MLIR verification participates in represented package paths
      - legacy direct LLVM and legacy AST-to-LLVM-dialect paths remain for represented subsets
    remaining:
      - make the Semantic IR -> Sec MLIR path cover all maintained Sec 0.1 features
      - retire or explicitly isolate semantic duplication in legacy direct LLVM/legacy MLIR emitters
      - make every maintained legacy backend consume canonical CompilationPlan layout/type facts or reject unsupported lowering
      - centralize implementation-capability diagnostics distinct from source/target errors
      - preserve verified target/profile/reference/ownership/effect facts through object/link generation
  - id: compiler.linking
    area: compiler-linking-and-artifacts
    status: partial
    integrated: "2026-08-24"
    document_revision: "1"
    repository_baseline: "c515862"
    summary: >-
      Implements the canonical Sec linking model: CompilationPlan-specific LinkPlan and
      LinkEnvironment authority, deterministic binary symbol identity, native/foreign
      symbol resolution, typed dependency inputs and provenance, archive fixed-point
      resolution, link roots/reachability, dead stripping/LTO constraints, reproducible
      toolchain invocation, and final artifact verification.
      The current sec build direct clang-driver path is recorded only as a
      legacy implementation slice, not as the canonical model.
    rules:
      - rules/compiler/linking.md
      - rules/compiler/initialization.md
      - rules/platform/platform_model.md
      - rules/platform/target_profiles.md
      - rules/platform/interrupts.md
      - rules/platform/abi.md
      - rules/platform/ffi.md
      - rules/projects/modules.md
      - rules/projects/projects.txt
      - rules/declarations/static.md
      - rules/memory/destruction.md
      - rules/concurrency/concurrency.md
      - rules/mlir/sec_mlir.md
      - rules/compiler/semantic_ir.md
    code:
      - cmd/compiler/main.go
      - cmd/compiler/target.go
    implemented:
      - sec build has a concrete external clang-driver invocation after LLVM or MLIR generation
      - target definitions provide an LLVM triple and coarse CanLink compiler-support gate
      - build accepts an explicit clang executable candidate override
      - external process stdout and stderr are surfaced and unsupported CanLink targets are rejected
    incorrect_or_partial:
      - no canonical LinkPlan is constructed before concrete invocation
      - no resolved LinkEnvironment owns target linkage semantics
      - the default clang executable is resolved through host PATH
      - explicit clang override compatibility is not validated against LinkEnvironment capabilities
      - target linkage currently depends on LLVMTriple and external driver defaults
      - link inputs, dependencies, roots and symbols are not typed provenance-bearing canonical facts
      - output-affecting host environment is not modeled as canonical link state
      - successful external process exit is accepted without canonical artifact verification
    remaining:
      - introduce one canonical LinkPlan for every concrete CompilationPlan that requires binary linkage
      - make CompilationPlan.LinkEnvironment authoritative for object format, symbol model, entry convention, relocation model, platform linkage requirements, and linker capabilities
      - replace unstructured canonical linker-argument construction with typed link inputs carrying dependency provenance
      - resolve logical native dependencies into target-specific ResolvedNativeDependency and LinkInput forms before concrete invocation where supported
      - preserve provenance for project, FFI binding, initialization, shutdown, runtime, platform, and explicit-build link inputs
      - introduce deterministic collision-resistant BinarySymbolIdentity distinct from SemanticDeclarationIdentity, ABISignature/ABIFingerprint, and EncodedLinkSymbol
      - separate Sec-native mangling from target object-format symbol encoding and keep import aliases, traversal order, host state, and worker scheduling out of native binary identity
      - keep foreign @link_name limited to foreign linkage identity and independent from dependency selection, ABI family, ownership, effects, and Sec declaration identity
      - define explicit binary linkage categories for private, native, foreign, generated-entry, generated-runtime, generated-callback, and platform-required symbols
      - keep object-unit identity separate from Sec module/declaration identity and support module, multi-object, whole-program, and LTO unit strategies
      - consume ProgramInitializationPlan and ProgramShutdownPlan requirements for startup objects, entry adapters, runtime/shutdown components, sections, and termination integration
      - represent symbol definitions and references using canonical native BinarySymbolIdentity or foreign linkage identity rather than source spelling
      - implement output-kind-specific symbol-resolution policy for executables, static libraries, shared libraries, and object outputs
      - permit static-library/object outputs to preserve unresolved external references where later consumers are expected to provide them
      - require final executable symbol requirements to resolve through included definitions or valid declared dynamic/platform imports
      - reject duplicate non-coalescible native Sec definitions independent of link order and preserve diagnostics for all conflicting providers
      - support explicitly coalescible compiler-generated/specialization definitions with canonical identity and ABI compatibility verification
      - do not add a general Sec 0.1 source-level weak-linkage mechanism
      - model static archives as containers of link units and implement canonical fixed-point member extraction from reachable unresolved requirements
      - materialize archive rescans, groups, or equivalent target mechanisms as toolchain strategy rather than source/library-order semantics
      - permit cyclic native-library dependency graphs when the selected LinkEnvironment can realize the required fixed-point resolution and reject plans when it cannot
      - model shared libraries as dynamic provider dependencies and import libraries/frameworks as target-specific realizations of logical dependencies
      - represent dynamic/provider ambiguity and interposition only when explicitly permitted by the selected LinkEnvironment
      - carry target-specific foreign/provider version metadata where supplied without adding Sec source syntax
      - introduce canonical LinkReachabilityGraph and LinkRoot concepts for executable, library, runtime, initialization, shutdown, static-storage, callback, and platform retention
      - ensure Sec public visibility does not automatically make a declaration a binary root or externally exported symbol
      - retain executable physical entry, generated startup chain, source-level main, required runtime/shutdown facilities, and platform retention roots
      - integrate static-storage reachability with deterministic static-destruction requirements so linker GC cannot remove storage required by ProgramShutdownPlan
      - avoid live foreign-import requirements for unused foreign declarations and create them only from reachable foreign references
      - retain compiler-generated callback thunks only through actual live callback contracts while preserving their address-based foreign reachability
      - support compiler-known PlatformRetentionRequirement inputs for reset vectors, interrupt vectors, fixed-address objects, hardware tables, and related target facilities
      - permit dead stripping as an optimization while rejecting removal of any canonical root or reachable dependency
      - materialize canonical retention into concrete linker garbage-collection/section mechanisms rather than treating external-linker GC as the definition of Sec reachability
      - retain reusable library binary surface independently of internal call reachability while permitting removal of private implementation details
      - allow LTO to inline, internalize, merge units, coalesce compatible definitions, and remove private dead code while preserving binary surfaces, ABI contracts, foreign requirements, initialization/shutdown requirements, dynamic-link constraints, and platform roots
      - prevent whole-program optimization assumptions that violate LinkEnvironment dynamic-resolution, external-consumer, or interposition contracts
      - run final artifact verification against the resolved LinkPlan after external linker/toolchain success
      - verify target/output identity, entry contract, mandatory symbol resolution, permitted dynamic imports, required roots/surfaces, startup/shutdown facilities, ABI compatibility, native dependency realization, and stale-artifact constraints
      - resolve concrete LinkToolchain through LinkEnvironment and reject toolchains lacking required object-format, relocation, archive, LTO, dynamic-link, response-file, or platform capabilities
      - permit host configuration for locating compatible tools without allowing PATH/default-linker behavior to define target semantics
      - make linker search paths explicit LinkPlan inputs with provenance and prohibit accidental current-directory/host-global resolution from becoming canonical dependency semantics
      - reject ambiguous dependency resolution when no owning dependency rule defines canonical selection and avoid using search-path order as package/provider precedence
      - expand target default libraries, runtime objects, startup objects, and similar driver defaults into canonical LinkPlan requirements even when materialized implicitly
      - support explicit target/toolchain-specific raw linker options only as build escape-hatch inputs that participate in fingerprints and cannot silently invalidate canonical invariants
      - treat response files as transport/serialization details and keep LinkPlan semantics identical between direct argv and response-file invocation
      - materialize concrete linker inputs in deterministic plan-derived order independent of filesystem, map, source traversal, and worker completion order
      - control or explicitly model output-affecting tool execution state such as working directory, toolchain path, SDK/sysroot, search paths, and relevant environment variables
      - use reproducible-output toolchain facilities where supported without making non-semantic timestamps or random build IDs part of Sec program semantics
      - include LinkPlan, LinkEnvironment, toolchain identity/version, input artifacts, resolved dependencies, generated startup/runtime/shutdown inputs, explicit options, LTO mode, output kind, and relevant reproducibility settings in link cache identity
      - map external linker errors to BinarySymbolIdentity, ForeignSymbolRequirement, source use, dependency provenance, and LinkRoot information where possible
      - distinguish ToolchainInvocationFailure, LinkResolutionFailure, and ArtifactVerificationFailure diagnostics
      - expose resolved toolchain, inputs, dependencies, search paths, startup/runtime/shutdown components, effective explicit options, LTO mode, and output path for build diagnostics
      - add cross-compilation tests proving host startup objects, host system libraries, host object defaults, and host linker behavior cannot leak into target LinkPlan
      - add multi-Variant tests proving each selected Target Variant receives an independent LinkPlan, link operation, and output artifact
      - add deterministic symbol, archive, provider, reachability, dead-stripping, LTO, toolchain-materialization, search-path, artifact-verification, cross-compilation, and diagnostic regression tests
      - update repository-level implementation-status verification commands once the first canonical LinkPlan vertical slice is implemented
    excluded:
      - Sec module and source declaration identity semantics
      - ABI parameter/return classification
      - FFI source-position legality and foreign resource ownership
      - program initialization and shutdown ordering semantics
      - storage-layout semantics
      - target-profile capability definitions
      - general source-level weak linkage
      - general source-level C ABI export of Sec functions
      - source-level linker command, search-path, or library-order syntax
      - one-object-per-module requirements
      - universal object-format or linker implementation requirements
      - byte-identical output on toolchains without reproducible-output support
    corrections_applied:
      - rules/corrections/applied/correction32-20260828.md
    governance_reconciliation:
      - cross-link compiler.program-initialization linking-facing handoff
      - cross-link platform model LinkEnvironment work and ABI stale-artifact checks
      - keep CanLink as a coarse compiler/toolchain support summary rather than target-linkage semantics
      - do not describe the existing direct clang invocation as canonical linking completion
  - id: compiler.program-initialization
    area: projects-initialization-and-build
    status: planned
    integrated: "2026-08-18"
    document_revision: "1"
    repository_baseline: "20b3606"
    summary: >-
      Implements canonical Sec executable initialization and shutdown planning:
      target-kind entry contracts, no implicit module initialization, optional
      runtime-free startup, CompilationPlan-specific ProgramInitializationPlan
      and ProgramShutdownPlan artifacts, dependency-ordered startup and teardown,
      startup-failure rollback, deterministic static-destruction integration,
      and explicit lowering/linking handoff.
    rules:
      - rules/compiler/initialization.md
      - rules/projects/modules.md
      - rules/projects/projects.txt
      - rules/declarations/static.md
      - rules/memory/destruction.md
      - rules/concurrency/concurrency.md
      - rules/concurrency/structured_concurrency.md
      - rules/platform/platform_model.md
      - rules/platform/target_profiles.md
      - rules/platform/interrupts.md
      - rules/platform/abi.md
      - rules/mlir/sec_mlir.md
      - rules/compiler/semantic_ir.md
    remaining:
      - introduce canonical ProgramInitializationPlan and ProgramShutdownPlan artifacts for every executable concrete CompilationPlan
      - validate command entry as exactly one concrete non-generic module-level fn main() int in the designated entry module
      - validate firmware entry as exactly one concrete non-generic module-level fn main() void in the designated entry module
      - ensure library targets acquire no program entry, startup, shutdown, or hidden module-initialization behavior merely by being compiled
      - support compiler-generated test harness entry through the same executable initialization and shutdown model
      - remove or reject any implementation path that executes user code merely because a module is imported or present in ModuleGraph
      - keep lifecycle init strictly tied to explicit instance construction rather than module or program startup
      - consume compile-time static values and model only physical static-storage establishment during runtime startup
      - model startup actions as typed compiler-known requirements with explicit prerequisites
      - derive an acyclic deterministic startup dependency graph independent of source, import, linker, map, or worker order
      - add deterministic tie-breaking for independent startup actions when concrete order is observable
      - resolve runtime requirements from semantic program needs and TargetProfile before lowering rather than in the backend
      - support valid runtime-free executable plans where no reachable feature requires runtime facilities
      - separate execution-environment startup, required Sec runtime startup, and transfer to source entry
      - track establishment state for fallible pre-entry actions and roll back only established resources
      - make startup-failure cleanup respect resource lifetime and teardown dependencies
      - distinguish ProgramStartupFailure from ordinary execution failure after main begins
      - treat command main return as logical status while leaving external encoding to ExecutionEnvironment
      - avoid implicit Result-to-exit, error-printing, panic, retry, or argument-injection semantics for main
      - generate or select physical platform entry adapters separately from source main using resolved target and ABI rules
      - ensure ordinary main-scope defer and destruction cleanup finishes before ProgramShutdown
      - integrate structured concurrency so entry cannot complete while owning unresolved child execution
      - transfer legal detached execution to program shutdown ownership and cancel or clean it before dependent runtime teardown
      - derive ProgramShutdownPlan from actual lifetime and teardown dependencies rather than reversing startup
      - integrate deterministic static destruction only where TargetProfile supports it and order it from canonical dependency and use relations
      - reject unresolved deterministic shutdown dependency cycles instead of selecting arbitrary destruction order
      - keep runtime facilities alive until every dependent cleanup completes
      - distinguish NormalTermination and ForcedTermination without weakening owning panic, destruction, or platform rules
      - record entry, runtime, static-lifetime, detached-execution, and termination requirements before target lowering
      - materialize resolved plans in MLIR and platform lowering and treat late missing semantic runtime requirements as invariant failures
      - expose linking-facing startup object, runtime component, entry adapter, termination adapter, and relevant section requirements without owning linker assembly
      - verify target-kind entry, TargetProfile support, runtime availability, startup and shutdown acyclicity, static-destruction capability, detached shutdown support, and termination policy before lowering
      - add diagnostics for missing, invalid, or duplicate entry, unsupported runtime requirements, startup cycles, rollback failures, unsupported termination policy, static destruction support, and shutdown cycles
      - track incremental dependencies on target kind, entry identity and signature, runtime requirements, detached execution, static destruction, TargetProfile, environment models, ABI adapter requirements, and termination policy
      - add cross-compilation and multi-Variant tests proving initialization planning depends on CompilationPlan rather than compiler host
      - add determinism tests covering source traversal, filesystem enumeration, map order, import order, linker input order, and worker scheduling
      - add end-to-end tests proving hidden module initialization is absent and runtime-free programs do not acquire unconditional runtime startup
      - update repository-level implementation-status verification commands after the first initialization-plan vertical slice is implemented
    excluded:
      - lifecycle init semantics beyond distinction from program startup
      - compile-time static-expression evaluation
      - ordinary block or function cleanup semantics
      - module import and visibility semantics
      - linker symbol spelling, object or library assembly, section naming, and dead stripping
      - target-profile capability definitions
      - ABI call-classification rules
      - exact Sec MLIR operation syntax
      - operating-system loader or firmware startup implementation details
      - C++-style global constructors and Go-style package initialization
  - id: compiler.compile-time-evaluation
    area: compiler-semantic-evaluation
    status: partial
    integrated: null
    document_revision: '1.0'
    repository_baseline: 0f5027d
    summary: 'Tracks canonical Sec 0.1 compile-time evaluation: restricted plan-time contexts plus typed semantic CTE over canonical Sec semantics, including ordinary user functions, path-sensitive effect legality, loops/recursion, transient allocation, ownership/borrowing/destruction, cross-module semantic execution, generic concrete callables, dependency tracking, resource limits, typed compile-time values, static materialization, diagnostics, caching, and integration around the Semantic IR -> Sec MLIR -> MLIR -> LLVM -> artifact pipeline. The repository already contains partial compile-time/constant evaluation behavior for several declaration and folding paths, but the complete semantic CTE service is not yet implemented.'
    rules:
    - rules/compiler/compile_time_evaluation.md
    - rules/foundations/attributes.md
    - rules/declarations/static.md
    - rules/declarations/generics.md
    - rules/compiler/generics_lowering.md
    - rules/compiler/monomorphization.md
    - rules/compiler/compiler_known_members.md
    - rules/compiler/semantic_ir.md
    - rules/compiler/compiler_pipeline.md
    - rules/projects/modules.md
    - rules/memory/layout.md
    - rules/memory/ownership.md
    - rules/memory/borrowing.md
    - rules/memory/copy_move.md
    - rules/memory/destruction.md
    - rules/memory/raw_pointers.md
    - rules/analysis/effect_analysis.md
    - rules/errors/panic.md
    - rules/errors/runtime_checks.md
    - rules/mlir/sec_mlir.md
    - rules/mlir/sec_mlir_dialect.md
    - rules/mlir/sec_mlir_lowering.md
    implemented:
    - parser/Sema infrastructure already recognizes multiple compile-time-required declaration facts such as enum values, fixed sizes/extents, static facts, attributes, and compiler-known layout/member queries
    - compiler-known SizeOf already resolves target-plan-dependent layout information in value/type/global forms prior to the property-only correction
    - current frontend and semantic analyses already perform constant propagation/folding and static validation in several narrow language paths
    - generic frontend and Semantic IR infrastructure can represent concrete generic identities required by future generic CTE execution
    - module and separate-compilation infrastructure already defines canonical declaration identities and semantic artifacts that can be extended for CTE bodies/dependencies
    - effect analysis already provides canonical effect facts that CTE can consume for permitted-effect decisions
    - ownership, borrowing, destruction, layout, and Semantic IR rulebooks already define the semantic facts the CTE service must preserve
    remaining:
    - implement explicit PlanTimeRequiredContext and SemanticCompileTimeRequiredContext classification in compiler semantic state
    - preserve the existing restricted plan-time evaluator for attributes/source selection and prevent ordinary semantic function calls from creating phase cycles
    - implement a canonical typed Semantic IR CTE execution service rather than relying only on AST/literal-specific constant evaluation
    - execute ordinary user-defined functions during semantic CTE without requiring const-fn/comptime source modifiers
    - implement nested calls, if/switch/match/for/while execution, recursion, and mutual recursion
    - implement path-sensitive CTE effect legality so forbidden effects on unexecuted branches do not invalidate the concrete evaluation
    - reject executed filesystem, network, environment, clock, ambient-random, target-memory, volatile, atomic, barrier, concurrency, foreign-call, and unsupported-runtime operations
    - support deterministic transient evaluator-local allocation independently of runtime target allocators
    - execute ordinary Sec ownership, move, borrow, destruction, defer, Result/Option, try, assert, and panic semantics during CTE
    - represent evaluator-local references/raw pointers using deterministic semantic identity independent of compiler-host addresses
    - prevent transient addresses and generational/liveness identities from escaping materialization
    - implement typed CompileTimeValue representation with canonical Sec TypeIdentity and SemanticValue
    - separate evaluation, owning-context validation, and static materialization
    - materialize supported scalar, fixed aggregate, enum/union/Option/Result, and immutable string values through ordinary target storage/layout lowering
    - allow dynamic owning collections transiently in CTE while rejecting static escape when the concrete type lacks defined materialization
    - implement recursive materialization graph validation and explicit materialization-failure reasons
    - detect compile-time value/type/layout dependency cycles without conflating them with ordinary terminating function recursion
    - implement finite ExecutionSteps, CallDepth, TransientMemory, and AggregateValueSize evaluator budgets
    - distinguish resource exhaustion from semantic nontermination and from target runtime out-of-memory
    - implement cross-module CTE body availability using compatible canonical semantic artifacts
    - preserve origin scope for private/sourcefile-only helper execution without leaking source visibility to importers
    - request and execute canonical generic concrete instances through the monomorphization/generic-lowering contracts
    - implement conservative CTE dependency tracking for declaration semantics, immutable values, generic concrete instances, type facts, layout facts, CompilationPlan facts, and imported semantic artifacts
    - implement deterministic CTE result memoization and correct invalidation
    - prevent resource-limit and cancellation outcomes from becoming permanent semantic negative caches
    - implement CompileTimeProvenance including RequiredBy, RootExpression, CurrentCallStack, GenericInstantiationContext, and OriginModule
    - distinguish NotEvaluable, EvaluationFailed, DependencyCycle, ResourceLimit, ResultNotMaterializable, ImplementationGap, Cancelled, and CompilerInvariantFailure
    - rename/standardize ordinary semantic operation failure classification as SemanticOperationFailed
    - make required CTE fail closed rather than silently emitting runtime initializers or host-executed substitutes
    - permit optional optimizer early evaluation to reuse evaluator machinery without turning optional failure into source diagnostics
    - integrate CTE as a semantic service around typed Sema/Semantic IR and the Sec MLIR -> MLIR -> LLVM -> artifact pipeline
    - allow MLIR infrastructure reuse internally only when canonical Sec and target-plan semantics are preserved
    - ensure required CTE does not depend on optional MLIR/LLVM constant folding
    - synchronize compiler-known SizeOf to property-only value.SizeOf and TypeName.SizeOf forms
    - remove canonical global SizeOf(TypeName) from parser/Sema/registry/tooling/tests/docs
    - synchronize compiler-known ToString fallback/replacement governance through the companion correction
    - audit every compiler-known Sec declaration for complete canonical declaration and owning module
    - update language-rulebook-status.md from Planned to Written and remove resolved CTE closure questions
    - narrow the Sec 0.1 reflection exclusion to general-purpose structural compile-time reflection and declaration metaprogramming
    - expose compiler CTE values/provenance/diagnostics through LSP without a separate editor evaluator
    required_tests:
    - plan-time attribute expression accepts permitted plan inputs and rejects ordinary semantic user-function dependency
    - semantic CTE executes an ordinary user function without const-fn/comptime syntax
    - same ordinary function executes at runtime when used from an ordinary local runtime context
    - ordinary local constant expression remains valid when optional folding is disabled
    - required static initializer fails compilation when semantic CTE cannot produce a value
    - required static initializer never falls back to hidden runtime initialization
    - path-sensitive CTE succeeds when a forbidden-effect branch is not executed
    - path-sensitive CTE rejects the same function when the forbidden-effect branch is executed
    - immutable compile-time value may be read during CTE
    - mutable runtime static may not be read or mutated during CTE
    - filesystem, network, environment, clock, ambient random, MMIO, volatile, atomic, barrier, concurrency, and foreign operations are rejected when executed by required CTE
    - explicit deterministic PRNG state using only compile-time values remains ordinary deterministic computation
    - unsafe block does not grant extra CTE capability
    - transient allocation succeeds without using target runtime heap state
    - explicit runtime allocator resource is not silently replaced by evaluator allocation
    - move-only value preserves move semantics during CTE
    - borrow/reborrow/lifetime rules remain valid during CTE
    - destruction and defer ordering follow ordinary Sec execution during successful CTE
    - assert failure becomes required CTE evaluation failure with provenance
    - panic reached during required CTE becomes evaluation failure without crashing the compiler
    - Result.Err remains a successfully evaluated Result value
    - semantic operation failure uses owning language diagnostic plus SemanticOperationFailed category
    - ordinary recursion can succeed during CTE
    - compile-time value dependency cycle is rejected distinctly from function recursion
    - type/layout/value dependency cycle is diagnosed with the semantic cycle
    - ExecutionSteps limit exhaustion reports resource limit rather than semantic nontermination
    - larger evaluation budget may retry an earlier resource-limited evaluation
    - transient-memory exhaustion is not target runtime OOM
    - scalar/fixed-array/struct/enum/union/Option/Result values materialize when their owning rules permit
    - CTE-generated immutable string materializes without preserving evaluator-host address
    - dynamic list may be used transiently to compute a scalar result
    - dynamic list result without static materialization reports ResultNotMaterializable rather than NotEvaluable
    - transient safe-reference address cannot escape static materialization
    - transient raw-pointer numeric host address cannot escape static materialization
    - target platform address metadata is distinct from evaluator-local address identity
    - public cross-module function executes under semantic CTE
    - public cross-module function may execute its already-resolved private origin-module helper without exposing that helper to importing source
    - sourcefile-only origin helper remains inaccessible to other source files/importers
    - generic concrete callable uses the same canonical specialization identity for CTE and runtime demand
    - unresolved generic parameter never executes as runtime-like CTE generic state
    - SizeOf result uses active CompilationPlan and cross-target tests do not use host size
    - TypeName.SizeOf and value.SizeOf resolve as canonical properties
    - global SizeOf(TypeName) is rejected after correction migration
    - CTE cache invalidates on relevant body/helper/immutable-value/layout/CompilationPlan changes
    - cancellation does not produce a source diagnostic or permanent negative cache
    - optional early evaluation resource failure leaves ordinary runtime code intact
    - valid-but-unimplemented semantic CTE path reports implementation gap
    - impossible evaluator type/value mismatch reports compiler invariant failure
    - LSP displays compiler-established CTE result/provenance without re-evaluating source independently
    excluded:
    - source-level const fn or comptime fn modifiers
    - source-level comptime expression or block syntax
    - a source-visible CTE namespace or IsCompileTime-style query
    - first-class Sec Type/TypeInfo values introduced solely by this rulebook
    - TypeOf introduced by this rulebook
    - arbitrary value/const generic parameters
    - general-purpose structural compile-time reflection
    - declaration generation, AST rewriting, source-string reparsing, or Zig-style compiler-language metaprogramming
    - runtime generic dictionaries, type erasure, hidden reflection metadata, or runtime specialization as CTE fallback
    - ambient host filesystem/environment/time/random/network as implicit semantic CTE input
    - target hardware execution or MMIO reads during CTE
    - optional MLIR/LLVM constant folding as the semantic implementation of required CTE
    corrections_applied:
    - rules/corrections/applied/compile-time-evaluation-cross-rulebook-correction-20260907.md
    - rules/corrections/applied/compiler-known-fundamentals-cross-rulebook-correction-20260907.md
