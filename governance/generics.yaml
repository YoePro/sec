    implemented:
      - "Constrained generic parameter as a borrowed interface view (2026-11-02; MD-057; MD-120; interfaces.md §§ 7.1, 9): `ref mut W` with `W: I` passes to `ref mut I`, directly, through a child interface, through generic inference of `ref mut I[E]`, and at pack forwarding. An unconstrained parameter, an unrelated constraint and a shared reference to a mutable view stay rejected (TestConstrainedGenericPassesAsBorrowedView). Such a call stops at the same named Semantic IR boundary as any view."
      - "Pack forwarding into borrowed interface views (2026-11-02; MD-057; MD-120 § 6; functions.md § 38A): typePackForwardCandidate accepts a conforming ordinary argument and a conforming pack position as a view, as a call without a spread does, so `FormatComposite(format, ref mut sink, values...)` passes Sema. An exact overload still ranks first; a non-conforming type and a shared reference to a mutable view stay rejected (TestPackForwardingAcceptsBorrowedInterfaceViews). Such a call then stops at the named Semantic IR boundary 'type Sink', the open MD-057 dispatch item in governance/declarations.yaml."
      - "MD-120 frontend ownership/pattern conformance (2026-11-02; correction §11(4)): source-backed Sema, CLI and LSP tests cover move-only concrete E, explicit generic argument/return transfers, Err construction, Result forwarding, whole-error match/try bindings, non-consuming guards, exact-to-open try propagation, Result.Err projection and generic error-union outer patterns. Negative cases reject implicit copies, missing moves, use after move, unproved generic or known lifecycle-bearing Err(_) discard and consuming guards. Resolved transfer/match/try plans retain move or conditional ownership actions and exact channel identity. Guard rejection now has registered S1194 ownership.guard-consumes-binding and repair guidance. This closes frontend conformance independently of executable specialization: direct package-17 Semantic IR still rejects ownership-sensitive E; public package-16 emission stops at custom free lifecycle destruction without an output artifact. Existing backend ownership/destruction and open-error gates remain with compiler.monomorphization and lowering.sec-mlir-package17; MD-108 interface representation remains open. No backend gate is lifted."
      - "MD-120 LSP (2026-11-01; correction §§10(7),11(6)): interface and requirement declarations, borrowed instantiated type references and selected interface calls expose exact Result error channels (unknown E, concrete IOError or explicit error root). Hover distinguishes error-category constraints from root arguments and never substitutes an unrelated value named error. Signature help retains receiver mode, borrowed parameters, active argument and selected channel, including inherited requirements and zero-argument calls during incomplete editing. Member completion uses instantiated requirements and preserves shared/exclusive receiver authority. Generic Err(. recovery offers a fresh whole-channel binding instead of guessing concrete variants or unproved discardability; accepting edits is re-analyzed. Canonical source type-use facts are detached, read-only and reanalysis-safe; final existing interface instances supply completed requirement metadata. Source diagnostics still reject bare interfaces and non-error arguments; navigation retains the requirement declaration. No new source inference, erasure, variance, runtime dispatch or backend representation is introduced."
      - "MD-120 Sema (2026-11-01; generics.md §§ 11–15A, 18, 22–23): [E: error] is a compiler-known category constraint, alone or with & interfaces; arguments are the error root or declared error types; [T: int] and [E error] stay invalid; template E has Result/Option/ref positions, Err/Ok, try propagation and widening to error, whole-channel Err(e); variant patterns, members, narrowing, implied copy and unproved Err(_) are rejected; E is inferred from arguments, expected results, explicit arguments and a unique interface conformance, with no fallback to error (rules/corrections/applied/MD-120-generic-error-parameters-approved-20261031-20261101.md; TestGenericErrorParameters, TestGenericErrorChannelSpecializations, TestGenericErrorUnionInstance, TestErrorCategoryConstraintSyntax, TestGenericErrorParameterHover)"
      - "MD-117 declaration/tooling milestone completed 2026-10-30: the parser and AST retain a trailing [...Types] type-pack parameter with its real spread/name tokens, distinct from an ordinary T; one-pack/final-position/callable-owner diagnostics retain later declarations. Existing SPREAD tokens are reused, ordinary array and spread grammar are unchanged, and empty call argument lists stay syntactically valid. Compiler declaration facts use GenericTypePackType and retain the pack name plus pointwise owned/shared/mutable signature modes, without representing a runtime container or granting runtime SizeOf/ToString members. Formatter/CST round trips preserve the declaration kind and ...Types/...ref Types/...ref mut Types spellings; LSP hovers show exact free-function/method declarations and type-sequence parameter facts. S1177 compiler.type-pack-expansion-unavailable reports unsupported parameter modes, demanded pack-body expansion and call preparation and prevents emission instead of silently using ordinary homogeneous generic semantics. Ordinary homogeneous ref variadic restrictions remain intact. The generic-parameter parser is extracted into a focused sibling file. The subsequent unused shared-pack frontend milestone under frontend.functions-v2 supports ordered direct-call inference and pointwise borrow checks; its detached facts are available to compiler clients, but LSP call-site presentation remains open. Pack body expansion/transfer/iteration, complete specialization and lowering remain with their existing MD-117 owners; MD-117 is not complete."
      - generic parameter parsing on type, function, and interface declarations
      - generic type-argument parsing, nested generic references, and attached explicit generic calls
      - generic declaration arity registration, parameter scopes, and duplicate parameter diagnostics
      - generic struct template instantiation with recursive concrete field substitution and preserved nominal identity
      - canonical caching of repeated concrete generic type instances by declaration identity and ordered arguments
      - generic function template registration, exact full explicit argument calls, argument-based inference, and expected-result inference
      - generic function calls bind a positional prefix of explicit type arguments left-to-right and infer every remaining parameter from call arguments or permitted expected-result context
      - canonical caching of repeated concrete generic function instances within one analysis
      - generic named types with concrete carriers close as canonical nominal instances, and `type Wrapped[T] T` substitutes the concrete carrier while preserving declaration identity and ordered arguments
      - generic union template registration, concrete payload substitution, and empty and single-payload construction paths
      - generic enum parameter parsing in direct and type-declaration forms, including concrete Enum[T].Member expressions
      - generic enum template registration, phantom identity parameters, ordinary member semantics, arity and unknown-constraint diagnostics, canonical concrete instance caching, and distinct nominal identities by ordered argument list
      - generic enum impl scopes make the owning type parameters available to associated declarations
      - generic impl target correspondence, owning parameter scopes, and concrete nested type and property substitution paths
      - generic interface declaration parsing, header registration, and use of interface-owned parameters in requirement types
      - focused rejection of method-level generic parameters on interface requirements without follow-on unknown-type diagnostics
      - concrete generic interface method, property, and event type substitution, exercised by compiler-known Iterator[T] conformance
      - local generic interface inheritance composes method, property, and event requirements from the resolved concrete parent specialization instead of reloading its unspecialized template
      - rejection of unknown constraints and constraints that do not name interfaces
      - generic function templates retain their resolved interface constraint and recheck every explicit or inferred concrete substitution
      - generic function constraint satisfaction requires valid explicit conformance rather than structural member matching, including concrete generic-interface identity and inherited interface guarantees
      - generic parameters preserve ordered interface-constraint conjunctions joined by &, parser recovery retains the valid prefix and later parameters after a missing conjunct, and declaration analysis diagnoses every unknown or non-interface member independently
      - generic function templates retain every resolved conjunct in source order and require all of them for both explicit and inferred concrete substitution; the resulting failure is published through ordinary compiler and LSP diagnostics
      - generic struct, named-type, union, enum, and interface templates retain every resolved constraint in source order and require valid explicit conformance for every concrete type argument before specialization; partial conjunction satisfaction and structural similarity are insufficient
      - generic function and declaration bodies may call instance methods guaranteed by one or more interface constraints; duplicate equivalent requirements are composed once, unconstrained parameters gain no structural members, and mutable receiver requirements remain enforced by ordinary call analysis
      - parser-owned concrete conjunction tokens project onto lossless CST roles, allowing canonical ` & ` formatter spacing while preserving ordinary bitwise expressions, recovered missing constraints, exact source ownership, and idempotence
      - Sema retains a GenericParameterFact per parameter declaration with its ordered constraint conjunction and the composed guaranteed instance methods; GenericParameterDisplays renders template headers from the retained GenericConstraints without consulting syntax
      - LSP hover shows ordered multiple-constraint headers on generic function and type templates, and hover at a generic parameter declaration or use lists every required conjunct in source order plus the guaranteed instance methods with mut receivers, composing equivalent requirements once and claiming no members for unconstrained parameters
      - "`ref T` and `ref mut T` types retain the referent name token, so navigation and hover bind the referent to its declaration instead of the `ref` keyword"
      - generic impl target parameters are the target declaration's own parameters and keep its ordered constraint conjunction in the impl scope, so impl method parameters and locals typed by them may call constraint-guaranteed instance methods while unconstrained parameters gain none; their facts name the owning impl target and LSP hover presents the inherited constraints at the impl target and every use
      - conservative copy/move treatment when a generic parameter lacks a proven copy capability
      - direct, array-mediated, and changing-argument recursive generic struct storage diagnostics with indirection cases retained
      - "expected-type generic calls (2026-10-10): a generic call selected through its expected type (return values, typed let initializers) now gets the same unsafe, ownership, implicit-borrow, resolved-call and call-graph treatment as the main call path; previously such calls skipped borrow and move validation and were missing from the call graph, so their effects were invisible to @noPanic/@noAlloc/@noBlock"
      - "generic argument inference through implicit call-site borrows (2026-10-10): a ref or ref mut T parameter infers T from an owned argument's type (borrowing.md §15.2); borrow authority is still checked on the instantiated call"
      - "forwarded constraints and overload fallback (2026-10-10): a template parameter passed as a generic argument satisfies a constraint that its own declaration guarantees (Concat[I: Iterator[string]] calling Join[I: Iterator[string]]), and a call selected through its expected type no longer reports a generic candidate's constraint failure while non-generic overloads remain for the main call path; both surfaced in sec/stdlib/str/join.sec"
      - generic primary and extended impl scopes retain the owning type declaration’s ordered interface constraints and recheck every conjunct when those parameters are reused as generic type arguments; concrete substitutions still require valid explicit conformance, and parameterized interface arguments remain distinct
      - generic function parameter and result substitution recursively updates resolved struct field types alongside nested type arguments; inferred and explicit Box[Item] results expose Item fields rather than stale T, and detached field slices keep concrete specializations independent while @noCopy and unconstrained template copy restrictions remain enforced
      - "MD-117 call hover increment (2026-10-30): LSP callee hover projects ResolvedTypePackCallOf ordered concrete types and pointwise receiving reference types, including empty packs and shared reborrows, alongside the ordinary function information. No LSP inference or overload model is added. Declaration hover no longer claims that all inference is unavailable. TestTypePackCallHover covers empty, heterogeneous, reordered and reference arguments using the existing shared_unused.sec fixture. Signature help and pack-body/executable expansion remain unchanged."
      - "S1177 editor presentation (2026-10-30, user decision; diagnostics.md §24(4h)): recognized type-pack implementation limitations appear as Information in LSP instead of a source-code Error. CLI checking/emission retains the mandatory error and compilation stop. Other mandatory diagnostics are unchanged. TestTypePackDeclarationTooling and TestTypePackCapabilityPresentationOnly verify the editor severity, stable identity/help and unchanged ownership Error; TestTypePackDeclarationCLI retains CLI exit and no-artifact checks. No pack expansion is claimed."
      - "MD-117 resolved-call signature help (2026-10-30): LSP projects ResolvedTypePackCallOf into an expanded concrete receiving signature and ordered pack documentation, with per-source-argument active-parameter selection. Empty packs omit the trailing parameter; scalar generic prefixes and shared/reborrow modes retain concrete types. Ordinary fixed overloads are not replaced by pack candidates. Presentation shares the concrete reference renderer with hover and performs no inference. Unresolved/incomplete pack calls, other modes and executable expansion remain outside this increment (TestTypePackSignatureHelp, TestTypePackSignatureHelpDoesNotReplaceFixedOverload)."
      - "MD-122 universal ToString() in Sema (2026-11-01, owner decision A): value.ToString() type-checks on unconstrained and constrained generic parameters, E: error, opaque pack elements in every loop mode and through values[k], and interface values, returning Result[string, StringError]; a constraint's requirement takes precedence. In a template the call is an unknown callee, so @noPanic and @noAlloc are rejected there. No other member or formatting interface is granted; interpolation holes keep their own contract rule."
    partial:
      - "Started (moved to partial 2026-11-21; the text records the done part and what remains): MD-117 call-site tooling (correction § 10(3)). Hover and signature help project selected ordered types and concrete pointwise receiving signatures for resolved shared-pack calls; the formatter round-trips ...Types, ...ref Types, ...ref mut Types and <-values... idempotently; the syntax reference documents the forms; diagnostics name the template location plus the concrete instantiation and argument position (§ 10(1)-(2)). Since 2026-11-21 signature help shows the declared template `fn F[...Types](...)` with the pack parameter active while a free-function pack call is open, incomplete, unresolved or the cursor is past the selected positions, never for a call resolved to an ordinary overload or an overload set with ordinary candidates (cmd/lsp/type_pack_signature.go; TestTypePackTemplateSignatureHelp). Remaining: the same template fallback for pack methods (instance and static calls) and hover on unresolved pack calls."
      - "Cross-module symbol identities partial (2026-11-19): imported functions, static/instance methods and property accessors use the defining module's canonical FunctionID (util::Counter.Make(int)) and the deterministic BinarySymbol sec_sym_<sha256>. Specializations of imported generics are instantiated per module with private/internal linkage; type identities drop the doubled module qualifier. Remaining: static storage across modules (blocked on cross-module module-level bindings, frontend.modules) and concrete type symbols where a backend needs them."
      - "Started (moved to partial 2026-11-20; the text records the done part and what remains): complete generic named-type contracts, implementation-member composition, Semantic IR, deterministic symbols, ABI, and lowering beyond the implemented concrete frontend identity, carrier substitution, and ordinary explicit conversions"
    remaining:
      - "MD-122 lowering (generics.md § 15; compiler_known_members.md Generic lookup): in a specialization select an exact user ToString or the concrete fallback; the call stops at a named boundary until P23 string lowering. Interface values need dispatch of ToString, which needs a view-table entry for every interface. A per-specialization @noPanic and @noAlloc proof through the selected ToString replaces today's conservative unknown callee."
      - "MD-117 conformance and acceptance (correction § 14): one regression matrix covering § 14(1) positive syntax/inference, § 14(2) negative checks, § 14(3) iteration, § 14(4) ownership/spread, § 14(5) lifetimes and § 14(6) lowering/tooling; MD-117 may be marked implemented only when every owner item passes (§ 14(7)); the correction itself was archived 2026-11-21 once every point had its own governance item (owner rule: corrections do not track implementation). The matrix also carries the MD-119 conformance cases (applied correction § 8; references.md § 3.4(10)): carried holders keep ref T/ref mut T, explicit *value/projection/reborrow, no implicit deref, no ref ref T, no copied or moved-out ref mut element, origin-preserving returned reborrows, each case distinguishing Sema from Semantic IR/Sec MLIR/executable support. MD-118 (fmt API) stays open separately and is not counted here."
      - show concrete specialization arguments at instantiated uses in generic-parameter hover
      - complete generic interface inheritance validation across modules and canonical cross-module specialization identity beyond the implemented local concrete requirement substitution
      - extend explicit-conformance checks to generic impl scopes; concrete struct, named-type, union, enum, and interface substitutions are now checked
      - extend constraint-guaranteed generic-body operations beyond implemented instance method calls to interface properties, events, static requirements, operators, ownership capabilities, defaultability, and copyability
      - complete generic primary and impl extends member composition for every substituted member category
      - specialize static storage independently for every concrete generic instantiation
      - complete generic-union layout, match, ownership, destruction, Semantic IR, and backend lowering after substitution
      - complete generic-enum representation-dependent substitution, match and switch provenance, Semantic IR identity, deterministic symbols, Sec MLIR, ABI, FFI, and backend lowering
      - implement the canonical InstantiationGraph termination model, distinguishing finite canonical cycles, recursive by-value layout, proven distinct-key non-convergence, and compiler resource limits; current recursive-storage diagnostics cover only represented subsets
      - represent generic templates and canonical concrete instances explicitly in Semantic IR with declaration identity, ordered arguments, resolved constraints, substitution, and source provenance
      - prevent unresolved generic parameters or constraints from reaching ABI, FFI, Sec MLIR, LLVM, or any representation-dependent lowering
      - add the complete revision-2.0 parser, Sema, formatter, LSP, interface, ownership, recursion, Semantic IR, ABI, and backend regression matrix
    excluded:
      - runtime generic dispatch, type erasure, implicit boxing, and runtime reflection-based specialization
      - higher-kinded types, generic argument holes, and default generic arguments; MD-117 trailing callable type packs are approved and tracked above
      - negative constraints, union-of-types constraints, inferred structural conformance, and automatic interface implementation
