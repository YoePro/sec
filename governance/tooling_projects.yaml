    implemented:
      - new-project scaffold `.sec/sec.toml`, `cmd/<target>/main.sec`, `bin/`, and `internal/` (§ 37(6))
      - an existing starter source is never overwritten and a repeated init on an existing manifest is a no-op (§ 40, § 42)
      - nested manifests are rejected (§ 4)
      - the new-project manifest contains the revision-2.0 `[version]` table with major 0, minor 1, revision 0, build 0, format `[major].[minor].[revision].[build]`, and no userdefined, validated before it is written (§ 37(1)–(3), 2026-10-04)
      - "`sec init --minimal` creates only `.sec/sec.toml` and root `main.sec` with a command Target whose source is `.` (§ 14(8), § 37(8)). Scaffold selection is independent of the build profile. Existing sources and manifests remain unchanged on repeat init, including cross-layout requests, and CLI module assembly skips the `.sec` metadata directory when collecting root siblings."
      - Both standard and minimal init scaffolds write a complete [format] table with the canonical defaults and TOML comments describing supported alternatives, meanings and numeric constraints (§ 4 of rules/tooling/formatter.md). Existing manifests are not rewritten by init.
      - "`sec init module <path>` with module/path validation, including internal modules (§ 38)"
      - conformance tests for dry run, conflict rollback, and no-op idempotent init (§ 50(1))
      - dry run (§ 44) and project-root invocation rules (§ 45)
      - conflict detection with rollback and transactional writes (§ 42, § 43)
      - sec init module resolves the ancestor project root, validates identity/version and relative logical paths, creates <path>/<ModuleName>.sec, and supports internal marker paths without changing the manifest or adding a Target. Compatible user sources survive repeat init; source conflicts, invalid identifiers, traversal, reserved roots, nested manifests and symlink directories fail before writes. Project and module creation share the transactional plan executor.
      - Current project/minimal/module commands fully plan directory and exclusive file creates before application, inspect existing source membership and command-entry conflicts, and preserve compatible user files. Apply rechecks inspected directories and preserved content; file creation/write/sync/close failures remove only owned files and empty directories in reverse order, never overwrite concurrent files, and report rollback failures or replaced paths. New manifests are published last (§§42–43).
      - "--dry-run is supported for project and module init, performs the same discovery, validation and change planning, prints creates/preserved files or no changes, and never writes or prompts. Invocation from any project subdirectory uses its governing manifest without generating a nested scaffold or changing UUID/name/version; actual nested manifests and new-project creation enclosing a child project are rejected (§§4,44–45)."
      - additive extension of an existing manifest instead of the current no-op, preserving its contents (§ 41)
      - "`sec init command|library|firmware|test <name>` additive Target creation that inherits the Project version (§ 39)"
      - sec init command|library|firmware|test <ProjectKey> [--target <os-arch>] [--dry-run] creates a validated entry/source scaffold and an additive Target declaration in the ancestor project. Command and firmware entries use the canonical int/void signatures, libraries receive an ordinary module, and test products receive an ordinary test declaration and compiler-generated harness rather than main or friend visibility. Registered existing Variants are reused or a canonical selected-platform Variant is added. Targets inherit Project versions; existing artifacts, source modules, explicit version overrides and optional metadata are preserved, with no implicit counter activation.
      - TOML syntax is parsed with github.com/BurntSushi/toml v1.6.0 while source edits insert only missing requested table fields or append new tables. Existing comments, spelling, ordering, CRLF and unrelated parameter text remain unchanged; multiline strings/arrays cannot forge headers. Source creation and same-directory staged, permission-preserving atomic manifest replacement share rollback, with original-content checks and exclusive Target transaction locks. Compatible repeats do not rewrite metadata or acquire a lock; dry run plans creates and edits without mutation.
      - Requested Source/Kind/Variant conflicts, invalid ProjectKeys and invalid entry signatures fail before writes. Target plans protect changed manifests and metadata symlink directories. internal remains an access marker and module init rejects direct files in a terminal internal segment while permitting child modules (§15.5(6)). General discovered-project schema/diagnostic validation remains owned by tooling.project-discovery-and-boundary and tooling.project-targets-and-configuration.
