    implemented:
      - "maintained default backend conformance (2026-10-08): one source matrix covers scalar, named and explicit defaults, nested mutable/omitted/partially explicit structs, fixed and zero-length arrays, constrained range/membership defaults, empty owning arrays/lists and non-defaultable borrowed slices on 32/64-bit scalar plans; supported LLVM scalars and legacy decimal zero are compiled with clang and executed on x86-64, while unsupported forms must fail before emitting output"
      - "Sec MLIR default verification: canonical Semantic IR verifies scalar values and widths, explicit default precedence, complete nested struct operands and compact fixed-array defaults; emitted modules pass the actual sec-mlir-opt array guard, scalar-core and trivial-core passes with verify-each on both widths, without undef/poison; contracts, nontrivial mutable strings, owning arrays and lists remain explicit capability boundaries, and executable aggregate/collection lowering remains separate work"
      - "default scalar identity fix and organic refactor: synthesized scalar bindings now consume canonical DefaultValueOf facts instead of re-inferring compatibility AST literals, retaining native float32/float64 and named explicit-float return/storage types; cohesive materialization lives in internal/ir/semantic/defaults.go, and the cross-backend tests live in a dedicated internal/lowering/defaults package"
      - "opt-in default code actions (2026-10-08): textDocument/codeAction publishes refactor.rewrite edits to insert an explicit mutable initializer, expand omitted struct fields, or declare an explicit scalar type default; values come from canonical DefaultValueOf and ResolvedStructLiteralPlanOf facts, with generic constructor arguments and nominal empty-list conversions preserved"
      - "default action source safety: capture source sites before Sema synthesizes values, keep written fields/spreads and their evaluation order, preserve comments and UTF-16/CRLF positions, and publish each edit only after parsing and analyzing its exact replacement with the same target and document overlays; diagnostic-bearing programs and incomplete or oversized source renderings produce no action; ordinary formatting still leaves defaults implicit"
      - "organic tooling refactor: default actions and completion presentation share internal/lsp/features/defaults; LLVM readiness and LSP source-site discovery share internal/ast/walk, whose traversal retains once-only pointer identity and source order across shared nodes/cycles"
      - "complete default diagnostic ID inventory (2026-10-08): mandatory registered S1136 types.default-cycle and S1137 backend.default-left-undefined fill the two missing names required by default_values.md; semantic namespace S covers these compiler/lowering rules, with types/backend topic families; registry, human/JSON compiler transport and LSP code/source/help/error-severity tests pin both identities; LSP enforces mandatory registry severity while retaining effective configurable policy"
      - "the diagnostic identity work reserves both definitions without claiming new failure detection: source by-value default cycles are still rejected by existing recursive-layout diagnostics (S1055/S1070); default-origin/verifier/lowering work and any future producers of backend.default-left-undefined remain tracked by their existing remaining items"
      - "default formatter and LSP conformance (2026-10-08): a shared 63-case source/expectation matrix pins every resolver default kind, all scalar families and widths, explicit folded expressions and inheritance, inclusive/exclusive integer ranges, binary/decimal ranges, membership, enum, union payload/field defaults, nested and generic aggregates, fixed/empty/large/owning arrays, empty lists and named list derivations, plus non-defaultable references, slices, callables, temporal types and ambiguous ranges; formatting is idempotent, preserves source tokens and omitted fields, and retains resolved default values; hover pins values and provenance and completion pins values before and after formatting"
      - "tooling fixes found by the default matrix (2026-10-08): completion shares hover bounded array previews; compiler-owned empty-list defaultability and fixed element/capacity facts survive named derivation and reference resolution, including synthesized mutable defaults; type-reference resolution and default completion details now have focused owner files"
      - one compiler-owned DefaultValueOf and IsDefaultable resolver shared by Sema, mutable declarations, omitted struct fields, fixed arrays, and LSP default display
      - allocation-free primitive defaults for bool, string, char, rune, integer, unsigned, binary-float, and exact-decimal families
      - inherited named-type defaults validated against every represented contract
      - exact integer nearest-to-zero range defaults with inclusive and exclusive bounds, multipleOf, even, odd, and ambiguous-tie handling
      - exact inclusive-decimal nearest-to-zero range defaults without binary-float conversion
      - source-ordered in-list defaults with duplicate detection, base-type compatibility, and S1011 cross-contract validation
      - duplicate in-contract values use mandatory S1053 types.duplicate-in-contract-value with a focused range, the first occurrence as a related location, actionable help, and unchanged identity through LSP
      - empty in-contract lists are retained by parser recovery and rejected by Sema with mandatory S1054 types.empty-in-contract, a focused range, actionable help, and unchanged identity through LSP
      - explicit type-default parsing and AST retention of the default token, expression, and source range
      - constant folding for the supported primitive expression subset and S1008 invalid-explicit-default validation
      - recursive struct defaultability and complete synthesis of omitted defaultable stored fields
      - fixed-array defaultability including zero-length arrays and recursive element construction
      - mutable T[] declarations may omit their initializer and synthesize an allocation-free empty owning array independently of element defaultability
      - mutable typed declaration synthesis marked by AST SynthesizedDefault and S1009 rejection for non-defaultable types
      - immutable declarations without initializers are rejected consistently by parser and Sema with mandatory S1047 variables.immutable-requires-initializer, and LSP preserves its identity, severity, focused name range, and help text
      - S1010 rejection of omitted non-defaultable struct fields
      - safe references and slices remain non-defaultable and no origin-free safe slice is synthesized
      - unions, Result, Option, functions, interfaces, and intrinsic resource types remain non-defaultable unless an owning rule defines a semantic default
      - date, time, datetime, and duration are explicitly non-defaultable; default initialization never performs a wall-clock read
      - LSP hover and completion display resolved default value and source from the Sema-owned resolver
      - LSP hover abbreviates large fixed-array defaults as a bounded preview such as [0, ...] without materializing or rendering every element
      - legacy MLIR materialization of complete struct and constrained scalar defaults without runtime calls or undefined fields
      - "explicit type defaults are classified in rulebook order: a non-constant default keeps S1008 types.invalid-explicit-default, a default outside the base type keeps mandatory S1060 types.default-not-representable, and a representable default failing a contract keeps mandatory S1059 types.default-violates-contract whose help names the first violated contract in source order"
      - storage sites needing an implicit default distinguish an ambiguous nearest-to-zero tie with mandatory S1061 types.ambiguous-implicit-default naming both equally near values and requesting an explicit default; the type itself stays legal
      - omitted struct fields whose type has an invalid explicit default report mandatory S1063 struct.invalid-defaulted-field instead of the generic S1010
      - omitted union payload fields without a default report mandatory S1062 types.no-default-value, or S1061 when the cause is an ambiguous tie
      - list[T] {} and list[T, Capacity] {} parse as a dedicated ast.CollectionLiteral (not a struct literal), including the capacity constant in expression position; elements inside the braces get one focused parser diagnostic and an invalid retained literal
      - Sema types empty list literals as their list type, rejects zero capacity and capacity mismatches, and resolves list[T] and list[T, Capacity] as defaultable (CollectionDefault) independently of element defaultability, for mutable declarations, omitted struct fields, and nested aggregates; the default displays as `list[T] {}`
