schema_version: 1
area: collections
purpose: Collection APIs, shaped values, and iteration semantics.
integrations:
  - id: frontend.shaped-types
    area: frontend-and-lowering
    status: partial
    integrated: "2026-08-11"
    revised: "2026-09-21"
    summary: >-
      Tracks vector, matrix, tensor, tensor_view, Shape, Strides, TensorLayout,
      and MemorySpace independently from ordinary collections. The canonical
      shaped rulebook now also specifies runtime-shaped owning tensors,
      compiler-known shaped properties, affine view slicing and step semantics,
      explicit broadcasting, ownership-preserving reshape operations,
      structured storage requests and transfers, vector algebra, matrix
      multiplication, and general tensor contraction.
    rules:
      - rules/collections/shaped-types.md
    implemented:
      - parser and AST accept mixed type/value generic arguments used by shaped types
      - Sema recognizes vector, matrix, tensor, and tensor_view identities and validates basic arity and dimensions
      - loader-proven core sources may attach additive impl helpers to all shaped families and their Shape, Strides,
        TensorLayout, and MemorySpace support identities without redefining compiler-owned intrinsic semantics
      - rank-one vector values participate in iterable type inference
      - contextual x parsing, multiplicative precedence, and static matrix/matrix and matrix/vector Sema with inner-dimension checks; scalar result algebra is partial
      - the shared compiler-known member registry exposes read-only uint Rank and Len properties for statically shaped vector,
        matrix, and tensor values and their type-level inventory; tensor_view exposes only its type-known Rank
      - Sema, LSP completion, and hover consume those same shaped Rank/Len entries, including useful compile-time rank and total-element-count facts
    remaining:
      - recognize owning runtime-shaped tensor[T, Shape[Rank]] without conflating it with tensor_view
      - implement Shape, runtime Len where required, Strides, Layout, MemorySpace, IsContiguous, Ptr, and shaped instance SizeOf member semantics
      - implement ShapedStorageRequest composition with StorageRequest and explicit Create request validation
      - implement Reshape as borrowed zero-copy view formation with runtime ShapeError checking where required
      - implement ToShape as consuming zero-copy ownership-preserving shape reinterpretation
      - implement Materialize as fallible new owning backing from tensor_view
      - implement explicit TransferTo and Relayout storage-producing semantics without implicit cross-space transfer
      - implement Axes and AxisList compiler-known identities and validation
      - implement Permute and rank-two Transpose as zero-copy view transformations
      - implement multidimensional shaped slicing with exactly one selector per axis and scalar/range rank reduction rules
      - implement step on shaped range selectors including negative step reversal and zero-step rejection
      - implement right-aligned explicit BroadcastTo with zero-stride aliasing and shared-only expanded views
      - implement elementwise shaped + - * / with no implicit shaped broadcasting
      - complete contextual x scalar product/result algebra, accumulation proof, Semantic IR, lowering, and runtime ShapeError checking; static matrix/matrix and matrix/vector Sema already exists partially
      - implement Dot, Outer, Magnitude, Normalize Option semantics, and extent-three Cross
      - implement explicit Contract with AxisList pairs and canonical result-axis ordering
      - preserve no-allocation semantics for logical shaped arithmetic and view transformations
      - integrate shaped runtime checks with ShapeError, IndexError, RangeError, and StorageError
      - integrate shaped Place/view overlap, borrow, lifetime, escape, and destruction semantics
      - synchronize shaped operations and invariants with the canonical rules/mlir dialect and lowering documents
      - add formatter, LSP hover/completion, diagnostic, valid/invalid, analysis, and end-to-end shaped test coverage
    verification:
      - command: go test ./internal/sema -run CompilerKnownStaticShapedFacts -count=1
        result: passed
      - command: go test ./cmd/lsp -run ShapedRankAndLenCompletionAndHover -count=1
        result: passed

  - id: frontend.collections
    area: frontend
    status: partial
    integrated: "2026-08-07"
    audited: "2026-08-18"
    revised: "2026-09-11"
    summary: >-
      Tracks fixed arrays, owning dynamic arrays, slices, list, map, and set
      against the unified collections rulebook. Parser/type recognition and
      Place-backed indexing provide a usable slice; canonical public members,
      allocation-aware owners, library collections, and lowering remain.
    rules:
      - rules/collections/collections.md
    code:
      - internal/ast
      - internal/parser
      - internal/sema/analyzer.go
      - internal/sema/place.go
      - internal/sema/semantic_facts.go
      - internal/sema/compiler_known_members.go
      - internal/formatter
      - internal/lsp
    tests:
      - internal/parser/parser_test.go
      - internal/sema/analyzer_test.go
      - internal/sema/effect_analysis_test.go
      - internal/sema/semantic_facts_test.go
      - internal/sema/compiler_known_members_test.go
      - testdata/sema/list_indexing_valid.sec
      - testdata/sema/list_indexing_invalid.sec
      - testdata/sema/list_indexing_no_panic_invalid.sec
    implemented:
      - parser and AST support for canonical fixed-array, dynamic-array, slice, list, map, and set type forms
      - Sema recognition and arity validation for compiler-known collection families
      - loader-proven core sources may define ordinary impl members for list, map, and set through the shared
        compiler/LSP privilege gate; stdlib and user sources remain rejected
      - Place-backed fixed-array and slice indexing used by borrow and ownership analysis
      - contextual collection type identities exposed to formatter and LSP registries
      - omitted initialization of mutable owning T[] produces its canonical allocation-free empty default
      - list[T] indexing resolves ordinary reads, shared and mutable element Places, and indexed replacement through the canonical element type
      - list indexing accepts built-in and compatible named integer indexes, rejects invalid types and statically provable negative or bounded-capacity failures, and records mandatory runtime Len checks otherwise
      - list index facts remain separate from array facts so unavailable list Semantic IR and lowering cannot be inferred accidentally
    remaining:
      - preserve owning dynamic-array identity across copyability, destruction, equality, initialization, and ownership transfer instead of inheriting fixed-array traits through ArrayType
      - complete parser, AST, and Sema coverage for the canonical fixed-array and slice syntax contract
      - array literal inference, bounds, indexing, slicing, assignment, equality, and ownership validation
      - full borrow and lifetime validation for slice creation, reborrowing, and returned sub-slices
      - compiler-defined layout, overflow, alignment, and length validation
      - explicit array, slice, and list operations in Semantic IR and lowering through MLIR and LLVM
      - focused valid, invalid, recovery, analysis, and backend test coverage
    verification:
      - command: go test ./internal/sema -run 'ListIndex' -count=1
        result: passed

  - id: frontend.collection-member-migration
    area: frontend-and-tooling
    status: partial
    integrated: "2026-08-11"
    rules:
      - rules/collections/collections.md
      - rules/compiler/compiler_known_members.md
      - rules/library/core-library.md
    code:
      - internal/sema/compiler_known_members.go
      - internal/sema/analyzer.go
      - cmd/lsp/main.go
    tests:
      - internal/sema/compiler_known_members_test.go
      - internal/sema/analyzer_test.go
      - cmd/lsp/main_test.go
    implemented:
      - one canonical Sema registry supplies compiler and LSP member availability
      - Len, IsEmpty, Ptr, and property-form instance and associated SizeOf resolution
      - global len validation and property-form SizeOf semantics without treating an associated type receiver as a runtime value
      - list, map, set, dynamic-array, and mutable-slice member surfaces with stable semantic IDs
      - LSP completion, hover, and semantic-token classification consume registry and resolved Sema facts
      - removed LSP-local array, rune-sequence, and RawPtr completion duplication
    remaining:
      - migrate remaining bootstrap and source-corpus uses of legacy .len and .ptr spellings
      - represent stable member IDs and collection payload-byte SizeOf explicitly in Semantic IR and lowering
      - add target-layout evaluation and backend verification for instance and type SizeOf
      - complete synthetic definitions and signature documentation for editor navigation

  - id: frontend.dynamic-array-public-api
    area: frontend-and-lowering
    status: partial
    integrated: "2026-08-11"
    rules:
      - rules/collections/collections.md
      - rules/mlir/packages/sec-mlir-dialect_package18.md
    depends_on:
      - SEC-MLIR-P18
      - allocation-context semantics from P19 where required
    implemented:
      - Sema and LSP expose exactly Len, IsEmpty, Ptr, SizeOf, Append, Clear, RemoveAt, and ToString
      - byte, char, and rune arrays and slice views use distinct compiler-known ToString materialization identities; other concrete arrays retain the universal type-oriented fallback
      - Append validates element type and returns Result[void, CollectionError]
      - Append accepts contextually typed struct literals directly as values, including under naked try propagation
      - Clear resolves as infallible void mutation
      - RemoveAt validates an integer index and returns Option[T]
    remaining:
      - resolve omitted mutable T[] initialization as an allocation-free empty owning value with zero length, zero internal capacity, no backing storage, and no live elements
      - implement transactional Append on the P18 growth substrate
      - make Clear reverse-destroy live elements while retaining backing
      - make RemoveAt return Option[T], compact the suffix, and preserve the initialized prefix
      - enforce active-borrow and storage-invalidation rules on mutating methods
    tests:
      - internal/sema/compiler_known_members_test.go
    verification:
      - command: go test ./internal/sema -run TestCompilerKnownAppendAcceptsTypedStructLiteralUnderTry -v
        result: passed

  - id: frontend.compiler-known-fill
    area: frontend-and-lowering
    status: partial
    integrated: "2026-08-11"
    rules:
      - rules/collections/collections.md
      - rules/compiler/compiler_known_members.md
    code:
      - internal/sema/analyzer.go
      - internal/sema/compiler_known_members.go
      - internal/codegen/mlir/generator.go
    tests:
      - internal/sema/compiler_known_members_test.go
      - internal/codegen/mlir/generator_test.go
      - testdata/ir/test_fixed_array_fill.sec
    implemented:
      - reserve fill as a compiler-known global and expose it through ordinary compiler/LSP function inventories
      - resolve fixed-array fill(value) from expected target element type and extent
      - resolve fallible dynamic-array fill(value, count) and string fill(fragment, count) from expected target type
      - reject missing target context, wrong arity, incompatible values, and non-integer counts
      - expose mutable-slice Fill only on ref mut T[] and reject non-copyable element types
      - lower fixed-array fill to one source-value evaluation followed by one inline aggregate insertion per element without allocation, runtime helpers, memset, or a runtime fill symbol
    remaining:
      - lower dynamic-array and string fill through explicit allocation and CollectionError paths
      - represent fill and mutable-slice Fill as stable Semantic IR operations
    verification:
      - command: go test ./internal/codegen/mlir -run 'TestGenerateFixedArray' -v
        result: passed
      - command: go run ./cmd/compiler emit-mlir testdata/ir/test_fixed_array_fill.sec --verify -o /tmp/sec-fixed-array-fill.mlir
        result: passed; value evaluated once, seven total inline insertions emitted, and no allocation or runtime fill dependency introduced
      - command: SEC_MLIR_BIN=$PWD/build/sec-mlir/bin go test ./... && go vet ./...
        result: passed

  - id: frontend.map-indexed-upsert
    area: frontend
    status: planned
    integrated: "2026-08-11"
    rules:
      - rules/collections/collections.md
    remaining:
      - make existing map entries produce indexed Places and missing lookup use checked key-access failure
      - make indexed assignment an upsert, including bodyless try for fallible upsert
      - support key-value iteration with unspecified order
      - do not add map Set or repurpose declaration assignment as mutation

  - id: frontend.collection-errors
    area: frontend-and-core
    status: planned
    integrated: "2026-08-11"
    rules:
      - rules/collections/collections.md
      - rules/library/core-library.md
    remaining:
      - use bool or Option for normal absence and rejection where specified
      - normalize CollectionError with AllocationFailed, CapacityExceeded, and SizeOverflow
      - map lower-level AllocationError at collection API boundaries
      - retain IndexError, RangeError, and key-access errors for checked access
