    obligations:
      - id: formatter-lossless-syntax
        status: partial
        rules:
          - "§ 5(1)"
          - "§ 5(2)"
          - "§ 5(3)"
          - "§ 5(4)"
          - "§ 5(5)"
          - "§ 5(6)"
          - "§ 5(8)"
          - "§ 25(1)"
          - "§ 25(2)"
          - "§ 25(3)"
          - "§ 25(4)"
          - "§ 25(5)"
          - "§ 25(6)"
          - "§ 25(7)"
        requirement: >-
          Provide one shared lexer/parser syntax authority that produces the
          lossless, error-tolerant CST used by the formatter.
          Preserve exact token lexemes, whitespace trivia, comments,
          source-sensitive string text, exact source ranges, and explicit
          uncertain/error regions. AST and CST may be parallel products of the
          same parser logic; no formatter-only grammar is permitted.
        acceptance:
          - Reconstruct all formatter-owned and formatter-preserved source bytes.
          - Format valid syntax surrounding an uncertain region without altering the uncertain region.
          - Preserve every uncertain/error region byte-for-byte.
          - Never synthesize missing source tokens as an ordinary formatting action.
          - Keep ordinary formatting independent of semantic analysis.

      - id: formatter-cst-engine-migration
        status: partial
        rules:
          - "§ 5(1)"
          - "§ 5(2)"
          - "§ 5(3)"
          - "§ 5(4)"
          - "§ 5(5)"
          - "§ 25(1)"
          - "§ 25(2)"
          - "§ 25(3)"
          - "§ 25(5)"
          - "§ 25(7)"
        requirement: >-
          Migrate the shared formatter from its current bespoke, line-oriented
          implementation to a CST-based engine. internal/cst is the primary
          source of grammatical structure, exact tokens, trivia ownership,
          safe formatting regions, and preservation boundaries. The AST may
          remain a parallel compiler product, but it is not the formatter's
          source of truth and must not compensate for missing CST structure
          through an expanding collection of formatter-specific rescans.
        acceptance:
          - The formatter entry point builds or receives one lossless, error-tolerant CST and formats from that representation.
          - Structural indentation, spacing, wrapping, alignment, and comment placement decisions use CST nodes and owned trivia rather than trimmed physical lines.
          - Existing line scanners and parser/lexer-assisted special cases are removed as their CST replacements become available.
          - New language-surface formatting is implemented by extending shared CST/parser roles, not by adding a formatter-only grammar.
          - CLI and LSP continue to use the same formatter and retain byte-identical output throughout the migration.
          - Focused migration tests preserve idempotence, valid syntax meaning, exact literals/comments, and malformed-region bytes.

