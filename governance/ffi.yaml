schema_version: 1
area: ffi
purpose: Foreign-function interface contracts and boundary behavior.
integrations:
  - id: frontend.ffi-v2
    area: frontend-and-lowering
    status: partial
    integrated: "2026-08-16"
    updated: "2026-10-02"
    summary: >-
      Tracks the revision-2.0 foreign interface model. Existing frontend and
      lowering support covers imported extern signatures, supported calling
      convention names, explicit link symbols, basic ABI type gating and linked
      calls. Ordinary extern calls no longer require unsafe solely because they
      cross a foreign boundary; unsafe extern declarations retain explicit
      caller proof obligations. Call-bounded foreign reference parameters are
      accepted, and C:: fundamental scalars resolve through each target's C ABI
      model, while c:: binding resolution, foreign data types, null syntax,
      callbacks, C varargs, ABI-driven legality and complete Semantic IR remain.
    rules:
      - rules/platform/ffi.md
      - rules/foundations/grammar.md
      - rules/foundations/attributes.md
      - rules/types/types.md
      - rules/memory/raw_pointers.md
      - rules/memory/borrowing.md
      - rules/memory/layout.md
      - rules/memory/unsafe.md
      - rules/compiler/semantic_ir.md
    code:
      - internal/parser/parser.go
      - internal/sema/analyzer.go
      - internal/sema/ffi.go
      - internal/sema/types.go
      - internal/diagnostics/diagnostics.go
