        target-scalar conversion, P8 wrapper boundary, P11/P12 union values, P13
        struct nesting, schema-9 compatibility, and maintained legacy array
        paths behind explicit representability checks.
      safety_boundary: >-
        Dynamic arrays, slices, element references, array-to-slice borrowing,
