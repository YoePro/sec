      - cmd/lsp/main.go
    tests:
      - internal/sema/analyzer_test.go
      - cmd/lsp/main_test.go
    implemented:
      - ordinary non-named compiler-known types are rejected as user impl targets unless the core privilege predicate succeeds
      - interface types are rejected as ordinary impl targets
      - an explicit allowlist limits which compiler-known targets may receive core implementations
      - the allowlist includes the compiler-known temporal identities date, time, datetime, and duration for trusted core sources
      - trusted core sources may attach ordinary methods to the canonical list, map, and set collection families while stdlib and user sources remain unable to monkey-patch them
      - trusted core sources may attach additive helpers to vector, matrix, tensor, tensor_view, Shape, Strides, TensorLayout, and MemorySpace without replacing their compiler-owned intrinsic semantics
      - compiler and LSP analysis share the same provenance gate and builtin-target allowlist for collection impls
      - ast.Program carries explicit source provenance independently of token path text
      - compiler and LSP core loaders canonicalize roots and resolve symlinks before assigning trusted-core provenance
      - Sema requires trusted-core provenance and the target allowlist for compiler-known implementations
      - forged core-looking paths remain ordinary user sources
    remaining:
      - audit core target/module ownership against the canonical core-library rulebook when that ownership matrix is centralized
    bug_reference:
      - correction9.md
    required_tests:
      - trusted compiler-selected core source may implement permitted builtin
      - ordinary user source cannot implement permitted builtin
      - user project/sec/core source does not gain core privilege
      - absolute user path containing /sec/core/ does not gain core privilege
      - module name alone cannot grant core privilege
      - trusted core source cannot implement a compiler-known target outside the explicit allowlist
      - LSP and CLI Sema enforce identical provenance rules

