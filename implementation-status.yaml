updated: "2026-09-12"
purpose: >-
  Canonical implementation ledger for compiler and tooling work. Normative
  language behavior remains in rules/, while implementation status is migrated
  here as rulebooks are rewritten.

status_values:
  implemented: The described scope is integrated and verified.
  partial: A usable vertical slice is integrated, with listed work remaining.
  planned: The scope is documented but no implementation slice is integrated.

integrations:

  - id: lowering.sec-mlir-package14
    package: SEC-MLIR-P14
    name: Fixed Array Semantic Value Representation
    area: frontend-semantic-ir-sec-mlir-and-lowering
    status: implemented
    implementation_phase: complete
    integrated: "2026-09-02"
    baseline: repository HEAD 069c111b96714ee4c9423f5f7a64d1e7a6045f31 with completed SEC-MLIR-P13 schema 9
    repository_head: 475add863959208ea2af90dfe0c8755352617ec8
    audited_state: repository HEAD 475add863959208ea2af90dfe0c8755352617ec8 plus the pending P14-48 and P14-70 through P14-77 completion diff
    mlir_toolchain: LLVM 24.0.0git optimized build with assertions
    lit_toolchain: lit 24.0.0dev
    summary: >-
      Implements canonical arbitrary-precision fixed-array shapes, compact Sema
      literal/default/index plans, verified fixed-array Semantic IR, and the
      high-level schema-10 Sec MLIR type, operations, emitter, guard verifier,
      and target-scalar compatibility. Package 14 introduces no mandatory
      runtime or physical array representation.
    integrated_surface:
      frontend_and_sema: >-
        Explicit fixed/dynamic shape, exact decimal length identity,
        plan-specific target-uint validation, compact literal/spread/default
        facts, exact bounds classification and proof provenance, typed
        IndexError fallibility, bounds effects, noPanic enforcement, and
        explicit ownership diagnostics.
      semantic_ir: >-
        Canonical fixed-array types; compact construct/default/length,
        bounds-predicate, guarded/proven extract, trivial replace, and bounds
        failure operations; high-level trivial storage; nested transactional
        replacement; complete type, operation, CFG, and no-partial-module
        verification.
      sec_mlir_schema10: >-
        High-level !sec.array with canonical arbitrary-precision StringAttr
        length; all six sec.array operations plus terminating sec.fail.bounds;
        schema-10 metadata and local verifiers; the registered array-index guard
        dominance/SSA verifier.
      lowering_and_compatibility: >-
        Deterministic Go emission for 32-bit and 64-bit plans, recursive P6
        target-scalar conversion, P8 wrapper boundary, P11/P12 union values,
        P13 struct nesting, schema-9 compatibility, and maintained legacy array
        paths behind explicit representability checks.
      safety_boundary: >-
        Dynamic arrays, slices, element references, array-to-slice borrowing,
        move-out, semantic-copy/non-trivial ownership, equality/membership
        lowering, foreign array ABI, physical layout, MemRef, LLVM arrays, GEP,
        allocation, and runtime helpers remain explicitly rejected or deferred.
