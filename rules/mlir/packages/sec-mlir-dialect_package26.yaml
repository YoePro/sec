- no mandatory runtime generation manager
- default logical epoch 64 bits independent of pointer width
- no silent epoch wrap
- checked stale direct ref -> panic.invalid-reference-generation
- no safe ref from arbitrary RawPtr
- proof-specific check removal
- no new owner from descriptor splitting
- no ABI classification in P26
