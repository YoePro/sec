      - "constant tracking precision (2026-11-08, TestFirstIterationOverflowAndBranchConstantJoin): a first-iteration domain keeps the pre-loop values of loop-assigned bindings for S1023 only, so an overflow certain on the first iteration warns with that qualifier; it is used only when the loop condition can hold with those values (a condition false on entry, or unknown over a loop-assigned binding, disables it) and follows top-level writes exactly; if/else joins keep a constant both continuing branches end with"
