schema_version: 1
area: concurrency-cancellation
purpose: Cancellation model, requests, and propagation.
integrations:
  - id: concurrency.cancellation-v2
    area: cooperative-execution-cancellation
    rulebook: rules/concurrency/cancellation.md
    status: partial
    revised: "2026-09-21"
    normative:
      - Task[T] and Thread[T] owning handles expose fn RequestCancel() void.
      - RequestCancel is idempotent, non-consuming, and has no effect after terminal completion.
      - Task.Current().CancelRequested observes logical task cancellation.
      - Thread.Current().CancelRequested observes physical thread cancellation.
      - Task and Thread cancellation identities remain distinct.
      - bare cancel is a terminating statement and runs deterministic cleanup.
      - bare cancel targets the current logical Task when one exists, otherwise an explicit cancellable Thread.
      - cancel is invalid outside cancellable execution and inside defer.
      - cancellation points preserve exactly-one operation/cancellation commit.
      - current-execution cancellation is terminal control flow rather than a generic runtime error.
    implemented:
      - Task[T] and Thread[T] expose the shared compiler-known fn RequestCancel() void member through Sema and LSP.
      - RequestCancel calls enforce the exact zero-argument signature, return void, and do not consume or resolve the owning handle lifecycle obligation.
      - LSP completion and hover project the canonical member identity, exact signature, and cooperative idempotent non-consuming semantics from Sema's registry.
      - "current-execution surface (2026-11-09, execution_context.go, TestExecutionContextSurface): Task.Current() TaskContext and Thread.Current() ThreadContext with the bool CancelRequested property in CamelCase (lowercase spellings get the canonical-name help), Task.Yield()/Thread.Yield() void, exact zero-argument signatures; CancelRequested is never selectable"
    remaining:
      - Reject Thread.Current() on a target/profile without the physical-thread capability (cancellation.md § 24); the logical-task requirement is enforced by frontend.cancellation-effect-v1.
      - Implement runtime request/observation state and wakeup integration.
      - Implement cancellation-point registration and commit races.
      - Integrate deterministic cleanup and terminal outcome publication.
      - Integrate completion synchronization after cancelled termination.
    required_tests:
      - id: task-request-cancel
        expectation: Task[T].RequestCancel() is void, idempotent, non-consuming and distinct from terminal completion.
      - id: thread-request-cancel
        expectation: Thread[T].RequestCancel() has symmetric cooperative semantics.
      - id: task-current-cancel-requested
        expectation: Task.Current().CancelRequested follows logical task identity across permitted worker migration.
      - id: thread-current-cancel-requested
        expectation: Thread.Current().CancelRequested observes the physical thread identity and remains distinct from task cancellation.
      - id: cancel-cleanup
        expectation: cancel executes defer/destruction cleanup and yields terminal Cancelled rather than normal T.
      - id: cancel-in-defer-reject
        expectation: cancel inside defer is rejected specifically.
      - id: cancellation-point-single-winner
        expectation: operation commit and current-execution cancellation cannot both win or lose ownership state.
    corrections_applied:
      - rules/corrections/applied/cancellation-v2-cross-rulebook-correction-20260907.md
    verification:
      - command: go test ./internal/sema ./cmd/lsp -run 'RequestCancel|CancellationRequest' -count=1
        result: passed with Task and Thread registration, exact call arity, non-consuming lifecycle use, completion, and semantic hover coverage

  - id: frontend.cancellation-effect-v1
    area: inferred-cancellable-execution-effect
    status: partial
    normative:
      - Functions containing cancel require current cancellable execution.
      - The requirement propagates transitively through calls.
      - The requirement is compiler-inferred with no @cancellable source annotation in v0.1.
      - Callable/function values preserve the requirement and cannot erase it.
      - Task.Current carries a specific current-logical-task requirement.
      - Thread.Current carries a physical-thread capability requirement.
    code:
      - internal/sema/task_context_requirement.go
      - internal/sema/execution_context.go
    tests:
      - internal/sema/task_context_requirement_test.go
      - internal/sema/concurrency_test.go
    implemented:
      - "per-callable inferred requirements (2026-11-09): `cancel` records a cancellable-execution requirement and Task.Current()/Task.Yield() a logical-task requirement on the containing callable, lambdas included; the former lexical rejection of cancel in every named function is removed (cancellation.md §§ 19-20)"
      - "requirements propagate through synchronous and deferred call-graph edges, recursion included, and are checked from every root: ordinary program entry rejects both (scheduling.md § 22), a spawned thread rejects only the logical-task requirement, a spawned task satisfies both; spawn edges start new roots; the diagnostic lands on main's first call on the path naming the requiring callable and operation, or on the operation itself (TestExecutionContextRequirements)"
      - "test bodies run like ordinary program entry (owner decision 2026-11-09, testing.md § 9.7): every test body node is checked as an entry, so Task.Current()/Task.Yield()/cancel reached from a test without spawning are rejected (TestExecutionContextRequirementsInTests)"
    remaining:
      - Carry the requirement in callable values and function types so assignment/conversion cannot erase it (§ 21(3)-(4)); calls through function values with unknown target sets are not checked yet.
      - Preserve the effect into Semantic IR indirect-call metadata.
    required_tests:
      - id: direct-cancel-effect
        expectation: Function containing cancel is callable only from valid cancellable execution.
      - id: transitive-cancel-effect
        expectation: Caller of cancellation-dependent helper inherits the requirement.
      - id: callable-cancel-effect
        expectation: Storing a cancellation-dependent function in a callable does not erase the requirement.
      - id: task-current-specific-effect
        expectation: Task.Current cannot be satisfied merely by a physical Thread context.

  - id: concurrency.context-v1
    area: context-cancellation-surface
    status: partial
    normative:
      - Context and ContextSource are @noCopy.
      - Context does not expose Cancel().
      - ContextSource owns one child Context, cancellation authority and registrations.
      - ContextSource.Context is ref Context and cannot outlive the source.
      - ContextSource.Cancel() is idempotent and leaves Context/source alive.
      - Context.Error is Option[ContextError].
      - ContextError is exactly Cancelled | DeadlineExceeded.
      - Context terminal cause is first-wins and immutable.
      - Parent cancellation propagates downward; child cancellation does not propagate upward.
      - ContextSource destruction is not itself a cancellation event.
    remaining:
      - Implement ownership/borrow/lifetime checks.
      - Implement first-wins terminal state and coherent IsCancelled/Error observation.
      - Implement parent-child cancellation propagation and deadline registration.
    required_tests:
      - id: context-first-terminal-cause
        expectation: Whichever of cancellation/deadline commits first remains Context.Error permanently.
      - id: context-error-coherence
        expectation: After terminal commit, IsCancelled is true and Error is the committed Some(ContextError).
      - id: context-no-cancel-method
        expectation: Context has no Cancel completion/member; ContextSource does.
      - id: contextsource-destruction-not-cancel
        expectation: Destroying ContextSource ends child lifetime without synthesizing ContextError.Cancelled.
    implemented:
      - canonical opaque @noCopy Context and the closed ContextError error enum Cancelled and DeadlineExceeded have source-visible core declarations and matching reserved compiler identities, sufficient for the mutex Context overload; ContextSource, Context operations, runtime cancellation state and propagation are not implemented by this declaration slice
      - "Context/ContextSource source surface completed 2026-11-11 (cancellation.md sections 35-38,43): canonical trusted opaque @noCopy ContextSource declaration, reserved nominal core identity, move-only classification and destruction requirement; malformed trusted declarations, untrusted replacement, representation fabrication and implicit copies are rejected. Shared registry provides Context.Background, WithCancel, WithTimeout(duration), WithDeadline(Instant), IsCancelled: bool, Error: Option[ContextError], Deadline: Option[Instant], and ContextSource.Context: ref Context plus non-consuming Cancel() void callable on immutable bindings/shared references. Exact type/value arity, temporal distinctions and read-only property syntax are enforced; the borrowed Context retains source origin for ordinary local-reference escape checking. Shared LSP completion, hover and warm/cold member navigation cover all nine members. Ordinary functions named Context retain normal overload resolution. Runtime helper effects remain conservatively unknown, and emit-ir still fails closed at unsupported type Context; runtime state, parent/child lifetime dependencies, deadlines and lowering remain separately tracked."
      - "Context/ContextSource LSP hover/completion/navigation completed 2026-11-11: all nine public members project exact signatures, temporal and borrowed result types, cancellation-authority separation, stable identities and rule references from the shared Sema registry; instance/type-qualified completion excludes opposite-scope operations and Context has no Cancel. Warm source navigation and cold member-ID navigation share registry metadata. Borrowed Context and ContextSource receiver hover and typeDefinition reach their real opaque core declarations. Sema type navigation now unwraps unnamed references when no declaration exists for the wrapper, preserving named alias declarations and withholding targets for unresolved/generic/builtin-without-source types. This closes source presentation; runtime state and parent-child lifetime proofs remain separate."
    revised: "2026-11-11"
    rules:
      - rules/concurrency/mutex.md
      - rules/concurrency/cancellation.md
    code:
      - sec/core/context.sec
      - internal/sema/context_types.go
      - internal/parser/parser.go
      - internal/sema/types.go
      - internal/sema/type_declarations.go
      - internal/sema/context_members.go
      - internal/sema/context_calls.go
      - internal/sema/compiler_known_members.go
      - internal/sema/compiler_known_calls.go
      - internal/sema/compiler_known_interfaces.go
      - internal/sema/copy_classification.go
