schema_version: 1
area: stdlib
purpose: Standard-library implementation and catalog status.
integrations:
  - id: stdlib.units-catalog
    area: standard-library
    status: partial
    integrated: "2026-08-07"
    audited: "2026-08-18"
    revised: "2026-10-08"
    summary: >-
      Expands the units package into a documented, metadata-complete catalog of
      148 physical units across SI and commonly used non-SI systems.
    rules:
      - rules/types/units.md
    code:
      - sec/stdlib/unit/base.sec
      - sec/stdlib/unit/core_derived.sec
      - sec/stdlib/unit/electricity.sec
      - sec/stdlib/unit/imperial_us.sec
      - sec/stdlib/unit/light.sec
      - sec/stdlib/unit/mechanics.sec
      - sec/stdlib/unit/power_energy.sec
      - sec/stdlib/unit/scaled_derived.sec
      - sec/stdlib/unit/science.sec
      - sec/stdlib/unit/time_frequency.sec
    implemented:
      - documentation comments on every unit declaration
      - complete LongName, Symbol, BaseUnit, Status, Dimension, Scale, and System metadata
      - SI base units and commonly used scaled SI units
      - geometry, motion, mechanics, pressure, density, viscosity, and flow units
      - time, frequency, angular, electrical, energy, power, and photometric units
      - radiation, chemistry, thermal, Imperial, US customary, and nautical units
      - exact rational scales where standardized exact relationships are available
      - semantically valid reciprocal helper naming for frequency and conductance formulas
      - 33 units have explicit safety-relevant Kind metadata; frequency/rotational frequency, energy/torque and other equal-dimension families are semantically distinct (frontend.units-v2, 2026-10-08)
    tests:
      - internal/sema/unit_catalog_test.go
    verification:
      - command: go test ./internal/sema -run TestUnitCatalogKinds -count=1
        result: passed on 2026-10-08; projects actual declaration/metadata lines from all ten files, validates all Kind families and conversion/arithmetic boundaries; legacy helper bodies remain outside this verification
    remaining:
      - migrate legacy helper-function bracket-dimension annotations to revision-2 structural unit syntax and validate complete helper bodies
      - offset-temperature units after offset conversion support exists
      - scale-sensitive algebra and automatic fixed scale-path conversion
      - logarithmic conversion semantics for units such as decibel
      - additional domain, currency, astronomical, and specialized engineering catalogs

  - id: stdlib.hardware-bus-infrastructure
    area: standard-library
    status: planned
    reviewed: "2026-08-28"
    summary: >-
      Tracks the canonical runtime-independent stdlib/hw area and reusable,
      target-aware bus/controller infrastructure reserved for SPI, I2C, I2S, and
      UART above compiler/core hardware-register semantics.
    rules:
      - rules/library/stdlib.md
      - rules/platform/hardware-register-access.md
      - rules/platform/target_profiles.md
    remaining:
      - define the public ownership, borrowing, failure, effect, target-availability, ordering, completion, blocking, suspension, and allocation contracts for hw/spi
      - define the corresponding public contracts for hw/i2c
      - define the corresponding public contracts for hw/i2s
      - define the corresponding public contracts for hw/uart
      - select ordinary Sec, compiler-known, intrinsic, Semantic IR/MLIR, FFI, or platform implementations per target without changing public contracts
      - implement and test direct bare-metal/RTOS realizations without an intrinsic general-runtime dependency
      - implement hosted realizations only where the selected target profile exposes a compatible platform/OS facility
      - keep device-specific addressing, register indexes, command protocols, polling, reset, and initialization in drivers or device libraries
    corrections_applied:
      - rules/corrections/applied/stdlib-hw-correction-20260828.md

  - id: stdlib.net-url-percent-encoding
    area: standard-library
    status: partial
    integrated: "2026-09-25"
    summary: >-
      Implements the RFC 3986 ASCII byte classification used by net/url percent
      encoding while retaining the public percent encode, decode, and
      normalization bodies as separately unfinished standard-library work.
    rules:
      - sec/stdlib/net/url/std-net-url.md
    code:
      - sec/stdlib/net/url/percent.sec
    implemented:
      - classify ASCII letters, digits, hyphen, period, underscore, and tilde as unreserved bytes
      - classify the complete RFC 3986 sub-delimiter set as literal bytes
      - classify component-specific colon, at-sign, slash, and question-mark bytes without implicit char-to-byte conversion
      - keep literal-percent input outside every literal-byte class so PercentEncode emits its percent escape
    remaining:
      - implement UTF-8 PercentEncode(string, Component)
      - complete PercentDecode UTF-8 validation and string construction
      - implement NormalizePercentEncoding
      - add executable standard-library behavior tests for every byte value and component context
    verification:
      - command: go run ./cmd/compiler sema sec/stdlib/net/url/percent.sec
        result: passed with 0 errors and 0 warnings on 2026-09-25

  - id: stdlib.io-root
    area: standard-library
    status: partial
    integrated: "2026-10-02"
    document_revision: "0.2"
    summary: >-
      Tracks the root io package from stdlib/io/std-io.md: the common IOError
      family (owned by core/error.sec), capability interfaces, and streaming
      transfer helpers. The root files type-check together with the existing
      Linux file API, which now uses IOErrorLegacy until the two error families
      are merged. The transfer helpers cannot yet be called with concrete types
      because conversion to borrowed interface references is undecided (MD-026).
    rules:
      - sec/stdlib/io/std-io.md
      - rules/library/stdlib.md
      - rules/declarations/interfaces.md
      - rules/errors/errorhandling.md
      - rules/memory/copy_move.md
    code:
      - sec/core/error.sec
      - sec/stdlib/io/interfaces.sec
      - sec/stdlib/io/transfer.sec
      - sec/stdlib/io/file.linux.amd64.sec
      - internal/sema/analyzer.go
    tests:
      - internal/sema/analyzer_test.go
    implemented:
      - IOError with the std-io § 6.2 variants is declared in core/error.sec with the error marker, so Result channels and every package can use it without importing io; results.sec is dropped from the root manifest
      - IOErrorLegacy keeps the 27-variant errno-oriented family of the existing file and directory API beside IOError in core/error.sec, each variant documenting its inferred meaning and closest IOError variant for the planned merge
      - interfaces.sec declares Reader, Writer, ReaderAt, WriterAt, SeekOrigin, Seeker, Flusher, Closer, and the seven composite interfaces exactly as std-io.md § 7 specifies, with mut fn receivers for sequential operations
      - transfer.sec implements ReadAtLeast, ReadExactly, bounded ReadAll, WriteAll with zero-progress detection, streaming Copy, and CopyN through the root interfaces with bounded 4096-byte working storage
      - file.linux.amd64.sec stays in module io, uses IOErrorLegacy, and maps the shared io.SeekOrigin to Linux whence values instead of declaring its own SeekOrigin
      - Sema registers the error marker on enum and union type headers, so interface requirements analyzed before type bodies accept declared error types in Result channels
    remaining:
      - merge IOErrorLegacy into IOError, or define the concrete-resource error family the file API keeps (std-io.md § 27), and make File and Directory implement the root interfaces
      - decide and implement conversion of borrowed concrete references to borrowed interface references so the transfer helpers can be called with concrete readers and writers (MD-026)
      - write the io sub-books and packages listed in std-io.md § 29 (reader, writer, seek, buffer, buffered, text, memory, pipe, limit, multi, section, tee, stdio)
      - add the std-io.md § 28 behavior tests, including deliberately short reads and writes, once interface dispatch can execute
    verification:
      - command: go run ./cmd/compiler sema sec/stdlib/io
        result: passed on 2026-10-02 with no io diagnostics; only the known S1040 core date/duration parameter shadowing remains
      - command: go test ./internal/sema -run TestInterfaceRequirementsAcceptDeclaredErrorTypes -count=1
        result: passed on 2026-10-02

  - id: stdlib.unicode-tables
    area: standard-library
    status: partial
    integrated: "2026-10-10"
    summary: >-
      Generates the sec/stdlib/unicode tables with cmd/unicodegen from a
      version-locked Unicode Character Database instead of Go's built-in unicode
      package, so the library follows Unicode 18.0.0 rather than the Unicode
      version of the Go toolchain.
    rules:
      - sec/stdlib/unicode/unicode.sec
    code:
      - cmd/unicodegen/main.go
      - cmd/unicodegen/ucd.go
      - third_party/unicode/18.0.0/ucd/UnicodeData.txt
      - third_party/unicode/18.0.0/ucd/SpecialCasing.txt
      - third_party/unicode/18.0.0/ucd/DerivedCoreProperties.txt
      - third_party/unicode/18.0.0/ucd/CaseFolding.txt
      - sec/stdlib/unicode/unicode.sec
    implemented:
      - "version lock: unicodeVersion 18.0.0, a -input UCD directory (default third_party/unicode/18.0.0/ucd), SHA-256 pinning of all four official files, and # Name-18.0.0.txt header checks for the versioned files"
      - "UnicodeData.txt: General_Category with First/Last range expansion and Cn for unassigned code points; simple upper/lower/title mappings with the UAX #44 defaults (identity, title falls back to upper)"
      - "SpecialCasing.txt: full lower/title/upper sequences with language and context conditions; commented-out entries ignored"
      - "DerivedCoreProperties.txt: Cased and Case_Ignorable as sorted merged ranges"
      - "CaseFolding.txt: simple (C+S), full (C+F) and Turkic (T) case folding"
      - "IsLetter tables generated from UCD 18.0.0 General_Category L (Lu, Ll, Lt, Lm, Lo): 694 maximal ranges; every Go unicode 15.0.0 letter is kept and 22068 letters are added"
    remaining:
      - decide and generate the Sec casing API and tables (simple and full upper/lower/title mapping, SpecialCasing conditions, Cased/Case_Ignorable contexts, case folding) from the parsed data
      - add executable standard-library behavior tests for the generated unicode module
    tests:
      - cmd/unicodegen/main_test.go
      - cmd/unicodegen/ucd_test.go
    verification:
      - command: go test ./cmd/unicodegen -count=1
        result: passed on 2026-10-10 with fixture parsing of all four files, malformed-input and wrong-version rejection, tampered-file hash rejection, Unicode 18.0.0 data facts, Go unicode 15.0.0 letter preservation and the generated unicode.sec being current
      - command: go run ./cmd/compiler sema sec/stdlib/unicode/unicode.sec
        result: passed with 0 errors and 0 warnings on 2026-10-10

  - id: stdlib.temporal-arithmetic-error
    area: standard-library
    status: partial
    integrated: "2026-10-18"
    revised: "2026-10-18"
    summary: >-
      MD-083 (decided 2026-10-18): TemporalArithmeticError is the canonical
      public error type of stdlib temporal/arithmetic; core ArithmeticError
      keeps its own identity and is never redeclared or repurposed.
    rules:
      - sec/stdlib/temporal/arithmetic/std-temporal-arithmetic.md
      - sec/stdlib/temporal/std-temporal.md
    code:
      - sec/stdlib/temporal/arithmetic/period.sec
      - sec/stdlib/temporal/arithmetic/apply.sec
    implemented:
      - TemporalArithmeticError (NotImplemented, InvalidTarget, OutOfRange, UnsupportedSystem) is declared in arithmetic/period.sec and returned by AddMonths and AddPeriod; std-temporal-arithmetic.md § 3(3) and std-temporal.md § 18(3a) fix the name; a temporal declaration named ArithmeticError is rejected by S1028 and core ArithmeticError stays usable beside the temporal type
    tests:
      - cmd/compiler/temporal_arithmetic_error_test.go
    verification:
      - command: go test ./cmd/compiler -run TestTemporalArithmeticErrorKeepsCoreIdentity -count=1
        result: passed on 2026-10-18
    remaining:
      - extend the variant set only through revision of the temporal rulebooks as temporal arithmetic is implemented (the success paths are still NotImplemented)

  - id: stdlib.fmt
    area: native-formatting-library-dependency
    status: planned
    revised: "2026-10-28"
    summary: >-
      Originating library dependency for heterogeneous native formatting
      arguments. MD-117 settles the general type-pack language mechanism; MD-118
      separately owns the public fmt API, grammar, materialization, allocation
      and output/error contracts. This entry owns library work, not duplicate
      parser, Sema, ownership or lowering implementations.
    rules:
      - rules/library/stdlib.md
      - rules/library/core-library.md
      - rules/corrections/md117-heterogeneous-variadic-type-packs-correction.md
    code:
      - sec/stdlib/fmt/fmt.sec
    implemented: []
    remaining:
      - Specify and implement the public fmt surface after MD-118 settles format grammar/validation, builtin and user participation, text materialization versus output, allocation and StringError/IO errors; the existing Println(string) stub does not define Printf or the unresolved API.
      - Integrate the implemented MD-117 native type-pack facility for mixed concrete arguments without fmt-specific compiler rules, implicit any/boxing or C-vararg adaptation; language owners are frontend.generics-v2, frontend.functions-v2 and frontend.spread, with ownership/control-flow, Semantic IR, specialization and P25 ABI work in their existing owners. MD-119 separately owns pack-carried reference dereference spelling.
    required_tests:
      - Mixed string/int/bool and empty calls from ordinary user modules use the same native language semantics as library calls.
      - Format validation, materialization/output errors, exact evaluation/cleanup and no hidden type erasure follow the eventual MD-118 API.
    verification:
      - command: go run ./cmd/compiler sema testdata/generics/heterogeneous_pack_pending.sec
        result: baseline reproduced on 2026-10-28 with a standalone Trace[...Types] fixture; parser rejects the generic parameter name at the ellipsis. No MD-117 implementation or public fmt API acceptance is claimed.
