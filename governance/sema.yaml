  - id: frontend.dynamic-array-membership
    area: frontend-and-lowering
    status: partial
    integrated: "2026-09-09"
    revised: "2026-11-27"
    summary: Accepts in and not in over owning dynamic T[] arrays through canonical element compatibility. Scalar equality on bound owners, stored fields and reference-reached owners with known provenance now reaches verified Semantic IR and schema-14 Sec MLIR without owner copying or allocation. Temporary/opaque-reference owners, broader element equality and native execution remain explicit implementation boundaries.
    rules:
