schema_version: 1
area: concurrency-mutex
purpose: Mutexes, locking, and mutual-exclusion semantics.
integrations:
  - id: concurrency.mutex-v2
    area: mutex-language-surface
    rulebook: rules/concurrency/mutex.md
    status: partial
    reviewed: "2026-09-22"
    normative:
      - Mutex[T] and MutexGuard[T] are @noCopy compiler-known/source-visible generic types.
      - Mutex[T] owns exactly one protected T and one synchronization identity.
      - MutexGuard[T] represents exactly one exclusive acquisition and releases on deterministic destruction.
      - Public acquisition surface is Lock(), TryLock(), Lock(duration), Lock(ref Context).
      - Lock() returns MutexGuard[T].
      - TryLock() returns Option[MutexGuard[T]].
      - Lock(duration) returns Option[MutexGuard[T]].
      - Lock(ref Context) returns Result[MutexGuard[T], ContextError].
      - There is no portable LockError and no Lock(timeout, context) overload in v0.1.
      - MutexGuard[T] forwards accessible members to protected T.
      - Guard-specific lookup precedes protected-T lookup.
      - The complete protected T cannot be moved out.
      - No public Unlock/Value/Get guard API exists.
      - Mutex is non-reentrant.
      - Live guards cannot cross spawn/await/suspending join/select.
    implemented:
      - Sema rejects a live MutexGuard[T] across await and select while accepting a guard explicitly consumed before the boundary.
      - basic acquisition uses the canonical Lock and TryLock names across Sema, blocking diagnostics, existing call sites and tests; shared compiler member facts provide the matching result types, signatures, completion, hover and synthetic navigation, and lowercase aliases are rejected
      - Mutex[T] and MutexGuard[T] have exact loader-proven opaque @noCopy core declarations and matching reserved compiler templates, each with one type parameter and no public storage fields; concrete and inferred owners retain the no-copy policy independently of T, explicit moves and shared-reference copies remain valid, and ordinary struct construction cannot fabricate synchronization or acquisition state; guard destruction and execution-bound movement remain separate obligations
      - Lock resolves exactly the zero-argument, duration and ref Context overloads, returning MutexGuard[T], Option[MutexGuard[T]] and Result[MutexGuard[T], ContextError] respectively; TryLock remains zero-argument only; canonical temporal conversion admits time quantity literals but rejects implicit conversion of typed quantities, wrong dimensions and inexact nanoseconds; Context calls preserve ordinary shared-borrow checks without consuming or retaining the Context, and shared compiler facts expose the selected result and complete signatures to LSP; runtime wait/commit behavior remains separate work
      - Sema rejects proven same-execution reacquisition by Lock or TryLock using canonical synchronization-resource identity, with both acquisitions in CLI/LSP diagnostics; local guard moves, replacement, lexical lifetime and successful Option/Result extraction preserve held-resource evidence, while released or consumed guards, disjoint resources and unresolved aliases do not produce false self-lock proofs; mutable writes and calls conservatively invalidate stale resource provenance
      - Execution-bound guard escape checks reject task/thread spawn arguments, receivers, known closure environments (including nested captured callables), child results, channel sends and static/thread-local stores that carry MutexGuard capabilities; canonical type/Place/capture facts preserve references, named types, aggregates and acquisition provenance, while ordinary same-execution calls/returns and local closures remain valid; opaque callable/aggregate and unresolved generic dependencies require positive guard-freedom evidence and report S1125 Unproven when that evidence is unavailable, preventing capture erasure from permitting transfer; rejected spawn transfers restore source ownership/borrows, canonical escape facts retain known and unknown boundaries, CLI/LSP share the proof classification and navigable guard origins, and a spawned call returning a function keeps the complete callable result type
    remaining:
      - Implement deterministic guard destruction/release lowering.
      - Implement suspending-join live-guard diagnostics; spawn guard transfers and await/select boundaries are enforced.
      - Complete direct forwarding for fields/properties/methods and lifetime-aware references.
      - Reject consuming complete-T forwarded operations.
      - Integrate acquire/release synchronization with memory-model facts.
      - Integrate target/platform lock capability through CompilationPlan.
    required_tests:
      - id: mutex-camelcase-api
        expectation: Lock and TryLock are canonical; legacy lowercase public spellings are not offered as the public source API.
      - id: mutex-basic-lock-type
        expectation: Lock() has static type MutexGuard[T].
      - id: mutex-try-lock-type
        expectation: TryLock() has static type Option[MutexGuard[T]].
      - id: mutex-timeout-type
        expectation: Lock(duration) has static type Option[MutexGuard[T]].
      - id: mutex-context-type
        expectation: Lock(ref Context) has static type Result[MutexGuard[T], ContextError].
      - id: mutex-no-lockerror
        expectation: Ordinary portable lock acquisition does not synthesize LockError.
      - id: guard-forwarding
        expectation: Accessible fields/properties/non-consuming methods resolve through MutexGuard[T] with correct mutability/lifetime.
      - id: guard-no-complete-move
        expectation: Complete protected T cannot be consumed/moved through a guard.
      - id: guard-no-unlock-member
        expectation: Completion does not expose public Unlock/Value/Get on MutexGuard[T].
      - id: guard-suspension-reject
        expectation: Live guard across await/suspending join/select is rejected.
      - id: guard-spawn-reject
        expectation: Move/borrow/capture of live guard across spawn is rejected.
      - id: mutex-nonreentrant
        expectation: Statically provable same-execution reacquisition while guard is live is rejected.
