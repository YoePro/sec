      - ISR root rejects prohibited transitive allocation
      - static capacity proof accounts for loops/recursion

  - id: semantic-ir.allocation
    area: semantic-ir-allocation
    status: planned
    repository_baseline: 57cd774
    remaining:
      - represent surviving dynamic allocations explicitly
      - represent allocation context/domain, type/count/size, alignment and fallibility
      - represent resulting storage origin/domain, lifetime/generation dependency, ownership/borrow mode and destruction responsibility
      - keep allocation, initialization, destruction and reclamation distinct
      - verify contradictory or incomplete allocation facts before lowering
    required_tests:
      - explicit allocation op
      - context/domain preserved
      - count/size/alignment/fallibility preserved
      - storage origin and generation dependency preserved
      - invalid allocation IR rejected

  - id: lowering.allocation
    area: allocation-lowering-backends
    status: planned
    repository_baseline: 57cd774
    remaining:
      - lower allocation operations through maintained Sec MLIR and LLVM paths
      - preserve selected allocation domain and never invent allocator choice in backend
      - lower overflow, alignment, capacity and allocation failure semantics
      - preserve value destruction before storage reclamation
      - implement target-specific Arena backing storage/allocator behavior
      - eliminate allocations only after lifetime/capacity/address-stability/concurrency/failure/cleanup proof
      - support valid stack/static placement without hidden escape promotion
      - prove allocation-free paths contain no runtime allocation helper
    required_tests:
      - allocating operation lowers with correct domain
      - allocation-free copy/move/ref path has no allocator call
      - overflow/failure path preserved
      - value destruction before Arena reclamation
      - proven static placement removes allocation without semantic change

