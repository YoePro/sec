      - formatter-ownership-v2-correction
      - correction30
    required_tests:
      - ordinary copy of copyable reusable source preserves source availability
      - ordinary value syntax never silently moves a reusable @noCopy/move-only source
      - explicit move initialization :<- consumes reusable source
      - explicit move assignment <- consumes reusable source and handles destination replacement
      - explicit <- may consume a copyable reusable source
      - ordinary by-value move-only call requires Call(<-source)
      - explicit -> parameter requires Call(<-source) even when source type is copyable
      - fresh temporary to ownership-taking parameter requires no <- marker
      - later argument failure does not commit earlier outer-call source move
      - Some(source), Ok(source), union payload, and aggregate payload reject implicit move-only reusable source transfer
      - Some(<-source), Ok(<-source), union payload <-source, and aggregate field <-source transfer ownership
      - legacy union move-word spelling is rejected in favor of :<- / <-
      - capture(value) copies and rejects non-copyable reusable source
      - capture(<-value) consumes source and capture(-> value) is rejected
      - return value and return <-value both transfer owned local
      - fresh returned value can initialize destination without move marker
      - ordinary method cannot consume whole self
      - method may move/discard an owned member with sufficient receiver authority
      - immutable root does not permit ordinary field assignment
      - mutable/exclusive self permits member mutation without per-field mut declaration
      - partial move leaves sibling field usable and whole aggregate unusable
      - immutable aggregate permits explicit partial move but not field reinitialization
      - mutable aggregate field reinitialization restores whole availability when complete
      - custom free type rejects partial move
      - Available plus Unavailable continuing paths merge to ConditionallyAvailable
      - terminating moved path is excluded from post-branch availability merge
      - is available and is not available refine ownership state without Option/null/generation semantics
      - partial aggregate whole is available is false
      - partial aggregate is not available preserves available sibling fields and recursive masks
      - uninitialized is not available preserves uninitialized provenance
      - availability tests never invent moved, discarded, or detached provenance
      - statically provable availability tests require no runtime bookkeeping
      - static-ownership target rejects ownership code that genuinely requires runtime state
      - earlier explicit call move reserves against later overlapping read, borrow, move, discard, and mutation
      - pending call-transfer reservation permits proven-disjoint sibling Places
      - later argument failure cancels only the outer reservation
      - successful outer call commits every prepared transfer exactly once
      - committed nested-call transfer is not rolled back by outer-call failure
      - conditional discard, replacement, and scope-exit cleanup can require runtime state without an availability query
      - discard Available destroys when required and converges to Unavailable
      - discard already-Unavailable place is legal no-op
      - discard ConditionallyAvailable converges all paths to Unavailable
      - discard remains blocked by non-discardable obligation and incompatible active borrow
      - assignment to Unavailable mutable place is reinitialization
      - assignment to Available mutable place automatically ends old value before replacement
      - hosted assignment to ConditionallyAvailable mutable place conditionally ends old value and repairs to Available
      - static-ownership policy may require discard convergence before conditional replacement
      - partial aggregate cleanup destroys only still-owned available sub-places
      - moved/discarded/detached sub-place is never destroyed twice
      - Result.Ok()/Err() consumption and OkRef/ErrRef borrowing integrate with availability
      - try/match guarded move ownership commits only on selected guard success
      - formatter preserves ownership markers and LSP reports canonical compiler facts
      - mentor diagnostics show source operation, ownership consequence, and practical correction
    traceability:
      availability_and_refinement: rules/memory/ownership.md sections 5, 18, and 20-25
      call_transfer: rules/memory/ownership.md sections 13-14 and 18
      runtime_state_and_policy: rules/memory/ownership.md sections 21-25 and 31-32

