schema_version: 1
area: compiler
purpose: Compiler pipeline, linking, initialization, and artifacts.
integrations:
  - id: frontend.compiler-source-selection
    area: target-and-config-source-selection
    status: partial
    repository_baseline: 998d8d1
    implemented:
      - "legacy file-level #target(os, arch) parsing/validation exists"
      - target-aware platform file filtering exists in current frontend/LSP bootstrap paths
      - project/platform imports and target-aware source assembly exist in partial bootstrap form
      - "2026-11-12: canonical @target forms with os, arch, cpu, device and board selectors: a @target that is the file's first source-bearing line becomes the file's canonical target selection (ast.TargetDirective with Canonical and ordered Selectors; it cannot be accompanied by other attributes and never attaches to the module declaration), and a later @target or @when attaches to the next top-level statement of every kind, including imports, impl blocks, interfaces, units, structs, let groups, tests and hardware declarations (ast.StatementAttributes). Sema applies them through SetSourceSelection: all supplied selectors must match the plan (logical AND, os/arch normalized), a selector the plan does not define never matches, and a matching file's or declaration's variants coexist (internal/parser/attributes.go, internal/sema/source_selection.go; TestCanonicalTargetForms, TestSourceSelectionActivatesMatchingSource)."
      - "2026-11-12: target variants are validated per plan: two variants of one symbol active together are S1237 attribute.overlapping-target-variants naming the plan, never resolved by specificity, and mutually exclusive @target variants must keep one public shape (functions: generic arity, parameter types, result; variables: declared type and mutability; types by declaration kind), else S1235 attribute.incompatible-variant-shape with the other variant as related location (TestSourceSelectionVariantDiagnostics)."
      - "2026-11-12: @when reads typed compile-time parameters: project [parameters] (bool, integer, float, string) with [target.<name>.parameters] overrides that keep the type and add no parameter (project.ParseManifestParameters), evaluated by the restricted condition language config.<name>, true, false, !, &&, ||, ==, != at plan time without calling user code; an undeclared or non-boolean condition is S1236 attribute.unknown-config-parameter. The CLI and the LSP derive the selection from the plan target and the manifest (TestParseManifestParameters, TestSourceSelectionVariantDiagnostics, TestCLISourceSelection)."
      - "2026-11-12: excluded source stays parsed and tool-visible but is absent from active symbols, Sema, CTE and Semantic IR: selection runs at the start of Analyzer.Analyze (and in the CTE probe through the recorded configuration), Analyzer.ActiveProgram feeds emit-ir and the native track, ExcludedDeclarations lists what was removed, and the formatter never merges or reorders an import that carries @target/@when. A linux-amd64 build of a module with linux/windows variants, a windows-only sibling file and @when-selected functions runs the selected code (TestCLISourceSelection, TestFormatterKeepsSelectedImports)."
      - "2026-11-12: a use of a symbol whose every variant source selection excluded is S1238 attribute.no-active-variant naming the plan and the available variants (`Linux` is unavailable for this compilation plan (os = windows, arch = amd64); available variants: os = linux, arch = amd64), built from the excluded declarations' file-level @target, @target selectors and @when conditions (TestSourceSelectionActivatesMatchingSource)."
      - "2026-11-12: legacy selection paths are compatibility-only: no #if directive and no compiler.target_os/compiler.target_arch source facility exist, and #target stays the file-level os+arch compatibility form (rejected after code, no other selectors, @target selectors contradicting it are rejected); the opt-in Language Corrections (`sec fmt --fix`) migrate it to the canonical file-level @target with the same selection, omitting `arch: \"any\"`, while ordinary formatting never rewrites it (attributes.md § 25(5); TestFormatterMigratesLegacyTargetOnlyWithFix)."
    remaining:
      - diagnose unknown target selector values and incompatible cpu/device/board combinations from target knowledge (attributes.md § 20(4)); supply cpu, device and board identity from the resolved target or hardware plan (hardware facts are Sec 0.5), until then a declaration selecting by them is never active
      - route platform source selection from canonical CompilationPlan identities rather than directory heuristics

  - id: frontend.compiler-pipeline
    area: workspace-plan-source-and-frontend-boundaries
    status: partial
    repository_baseline: 998d8d1
    implemented:
      - project/target-aware source assembly exists for current CLI/LSP paths
      - target filtering occurs before target-aware Sema for represented platform sources
      - frontend parsing/Sema stop lowering on mandatory semantic failures
      - compiler-owned test plan model is specified and partially integrated through testing governance
      - current Iterator[T] frontend governance has explicit conformance/Next lowering requirements
    remaining:
      - formalize one canonical CompilationRequest/CompilationPlan construction path for CLI, LSP, build, emit and test commands
      - move all target-dependent source selection/platform routing to canonical plan facts
      - eliminate duplicated bootstrap module/platform source-resolution paths
      - integrate compile-time evaluation as a query service at every consuming frontend phase
      - integrate compiler_analysis.md graph scheduling rather than relying on one hard-coded semantic pass ordering
      - implement explicit lowering-readiness/implementation-capability classification

  - id: compiler.platform-resolution
    area: target-variant-platform-compilation-plan
    status: planned
    repository_baseline: 998d8d1
    implemented:
      - "WebAssembly target registration (2026-10-16): planned freestanding targets unknown-wasm32 (wasm32-unknown-unknown, ILP32) and unknown-wasm64 (wasm64-unknown-unknown, LP64) with the WebAssembly BasicCABI data models (signed char, binary128 long double); parse and check only, emission/link/run rejected (TestWebAssemblyTargetsArePlannedFreestanding); naming, environment and profile await MD-075"
      - "2026-11-12: plan resolution has deterministic semantic fingerprints and provenance: layout.ResolvedScalarPlan.Fingerprints gives the Architecture, Layout, Memory, Runtime, Execution, ABI and Link domain fingerprints and a composite Plan fingerprint, each computed from canonical resolved facts only (versioned schema, no display text, registry order or provenance), and platform/target.Resolve records in a fixed order where each fact came from (the request's source such as a command-line --target, a manifest Target or the host default, and the target registry entry for derived facts) without affecting any fingerprint. Sema consumes them: the analyzer keeps the plan's fingerprints, CTE CompilationPlanFact dependencies name the layout fingerprint, and ProgramInitializationPlan.PlanFingerprint enters the initialization contract fingerprint (internal/layout/plan_fingerprints.go, internal/platform/target/provenance.go; TestPlanResolutionFingerprintsAndProvenance)."
      - "2026-11-12: platform semantic capability, compiler target support and toolchain availability are separate facts: the resolved plan carries the platform's semantics (scalar, ABI, profile and allocation capabilities); platform/target.CompilerTargetSupport records the current compiler's support per pipeline stage (semantic validation, analysis, Sec MLIR lowering, object emission, linking, execution) and a missing stage is an UnsupportedStageError implementing diagnostics.CapabilityFailure (`the compiler does not implement object emission for target unknown-wasm32 yet; the target's semantic plan is valid, so check and analyse can still use it`), used by sec build/emit gates instead of untyped `cannot emit LLVM yet` errors; host toolchain availability (sec-mlir-opt, llc, the C driver) stays a separate toolchain-resolution failure that never invalidates the plan (internal/platform/target/support.go, cmd/compiler/target.go; TestCompilerTargetSupportIsSeparateFromPlatformSemantics)."
    remaining:
      - implement canonical Target and Variant identities instead of treating os-arch as Target identity
      - resolve one immutable verified CompilationPlan per selected Target x Variant
      - introduce typed resolved Architecture/CPU/TuneCPU/Device/ABI/TargetProfile/BuildProfile/runtime/execution/memory/link facts
      - remove downstream host-dependent target guessing
      - support multi-Variant plan isolation and safe target-independent reuse

  - id: compiler.backend-architecture
    area: semantic-ir-sec-mlir-backend-orchestration
    status: partial
    repository_baseline: 998d8d1
    implemented:
      - Semantic IR and dedicated verifier exist
      - P1-P14 provide versioned Sec MLIR schemas and executable verified vertical lowering slices
      - real sec-mlir-opt / MLIR verification participates in represented package paths
      - "single compilation track (2026-10-17, MD-101 user decision; compiler_pipeline.md § 45(6)): sec build, emit-mlir and emit-llvm run Sema -> Semantic IR (package level 14) -> Sec dialect -> sec-mlir-opt --sec-lower-to-llvm (existing scalar/integer core lowering, sec-lower-failure-endpoints, sec-lower-command-entry, sec-finalize-for-llvm, upstream arith/cf/memref/func-to-llvm) -> mlir-translate -> clang; the legacy direct LLVM and AST-to-LLVM-dialect generators (internal/codegen/llvm, /mlir, /readiness) and --pipeline are removed; executable evidence: TestNativeTrackBuildsAndRuns (status, while, &&, uint division, overflow and division traps), TestNativeTrackNamesUnloweredConstructs, lit Conversion/SecToLLVM/*"
      - "track gates: sec-check-lowering-support names every Sec operation outside the lowered set and sec-finalize-for-llvm rejects remaining Sec operations/types; both surface as [unsupported-lowering] capability diagnostics through internal/mlir LoweringCapabilityError"
      - SecLowerCheckedIntegers keeps a normalized storage load's source signedness through a folded cast pair, fixing checked comparison of loaded locals in loops (lit Conversion/SecToLLVM/loop-storage-signedness.mlir)
      - "track widening 2026-10-18: explicit discard and implicit call-result discard (Semantic IR discard.value, discard.md §§ 3, 10, 36; no instruction for trivially destructible values), bool switch subjects, compile-time constant range steps with an exact wider-type distance test (no increment past end, flowcontrol_for.md § 29), sec.fail.panic for explicit panic/failed assert/checked unreachable lowered to trap (user decision 2026-10-18), static storage as LLVM globals; executable evidence in TestNativeTrackBuildsAndRuns (range_steps, bool_switch, discard, statics, panic_trap, assert_trap)"
      - emit-ir builds Semantic IR through the newest completed package, P14, by default (2026-10-05); constructs outside the SEC-MLIR package sequence (while loops, compound assignment, &&/||/!, range membership) are admitted from package gate 13; since 2026-10-17 emit-sec-mlir and the whole track also build at level 14
      - "plan-specific exact conversion proofs (MD-104 decided 2026-10-18, Option A; types.md \"Exact integer conversion proof\", semantic_ir.md § 124): sema.IntegerConversionProof (basis constant/source-domain/closed-enum-domain/open-enum-domain, compared domains, plan width) is computed for the selected CompilationPlan (all supported widths when none is resolved) and attached to ResolvedIntegerConversion and enum-to-integer ResolvedEnumConversion; Semantic IR carries it as Operation.ConversionProof (printed proof=<basis> plan=<bits>) on numeric.convert-exact and enum.to-integer, Module.PointerWidthBits records the plan, the verifier rejects a missing, unknown or other-plan proof, and an unproven enum conversion fails closed; open bit[N] enums use 0..2^N-1 (TestExactConversionsCarryPlanProofs, TestUnprovenConversionsFailClosed, TestConversionProofVerifierRejectsStaleProofs, TestConversionProofIsRecomputedPerPlan)"
      - "Ordinary integer enums now reach executable binaries through sec-lower-integer-enums in the one track (2026-10-17; lowering.integer-enum-representation): exact constants/aliases/defaults, eq/ne, enum match CFG, local storage and direct calls; 32/64-bit representation tests and native execution evidence. Enum conversions and bit-backed enums remain unsupported."
      - "MD-104 proof transport (2026-10-18; lowering.integer-enum-representation): the emitter preserves ConversionProof as sec.conversion_proof (basis and plan_pointer_width) on enum.to_integer and numeric.convert_exact; dialect verification rejects missing/malformed/unknown-basis or incompatible-plan contracts. IntegerEnums.cpp consumes the verified contract without recomputing enum domains and forwards it to numeric.convert_exact. Schema 7-10 enum read compatibility remains, but lowering without a proof fails closed."
      - Optional terminal `return <-expression` now reaches the single source-to-binary track with the same result ownership and Semantic IR as `return expression` (frontend.functions-v2, 2026-10-18). The marker is parser-retained syntax, not a backend unary move operation; TestNativeTrackBuildsAndRuns/explicit_return compiles and runs marked literal, arithmetic and call returns and checks exactly-once operand evaluation.
      - "Capability diagnostic regression fixed (2026-10-26): internal/mlir recognizes both historical and categorized unsupported-lowering messages from the native gates, retaining typed LoweringCapabilityError feature and source coordinates. Tests cover both spellings, multiple limits, colon-containing paths and unrelated errors/notes; TestNativeTrackNamesUnloweredConstructs again verifies the source file:line:column suffix."
      - "native Result/union/Option with scalar payloads (2026-10-30; lowering v11.33; mlir/lib/Conversion/SecToLLVM/TaggedValues.cpp): sec-lower-tagged-values selects an internal LLVM struct (discriminator plus non-overlapping payload slots, no ABI promise) across construction, tests, guarded projections, calls, returns, merge arguments and entry-block storage; sec-lower-integer-enums resolves enums nested in payloads; other payloads stop by name at sec-check-lowering-support. Executed: testdata/build/native/tagged_values.sec, error_variant_patterns.sec, control_flow/if_try/valid.sec, sema/atomics/compare_exchange_result/lowering_valid.sec. Lit: Conversion/SecToLLVM/tagged-values.mlir, tagged-values-unsupported.mlir (194/194). Boundaries: Result[void, E] (dialect requires non-void), statement-position try, struct/string/array/reference payloads, place-based borrowed payload projection."
      - "2026-11-12: implementation-capability diagnostics are centralized and distinct from source and target errors: pipeline boundaries (Semantic IR, Sec MLIR emission, MLIR toolchain gates, allocation lowering readiness) implement diagnostics.CapabilityFailure with a typed ImplementationCapability, and every Sema implementation limit now carries a compiler-capability identity, either its dedicated one (S1177 type packs, hardware schema/context, S1101 compile-time execution) or the new S1239 compiler.capability-unavailable through Analyzer.reportCapabilityUnavailable (unimplemented attributes, impl instance storage, method-level generic parameters, escaping captured lambdas, rounded conversion to non-integer carriers, spawned block bodies, spawn process, ThreadLocal factories); diagnostics.IsImplementationCapability and sema.Error.IsImplementationCapability classify them, and a source-scan guard rejects any new Sema producer that reports an implementation limit without such an identity (internal/sema/capability.go; TestSemaCapabilityLimitsUseCapabilityIdentity, TestCapabilityBoundaryDiagnostic)."
    remaining:
      - make the Semantic IR -> Sec MLIR path cover all maintained Sec 0.1 features
      - "widen the single track (Known hole, verified 2026-10-18): Semantic IR P14 rejects runtime for steps, collection/iterator for loops, string/named switch subjects, floating core methods/properties and float conversions (the P20 operator subset is lowered, lowering.sec-mlir-package20), checked integer conversions needing try, extern calls, inline asm and discard of values that need destruction; the LLVM track rejects structs, arrays, enum.from_integer and bit-backed enums, Result/union/Option values whose payloads are not scalars (scalar payloads are lowered since 2026-10-30, sec-lower-tagged-values, lowering v11.33), references, strings, physical lowering of address-taken statics and interface dispatch (MD-116 high-level roots and identity verification are implemented under lowering.sec-mlir-package15). Lowered since 2026-10-17: for (implicit and constant steps), integer/subjectless/enum/bool switch, exact int(x) and enum-to-integer conversions, char/rune comparison, integer enums, explicit/implicit discard of trivial values, explicit panic and failed assert (sec.fail.panic -> trap), module constants and mutable statics (LLVM globals). Each widening adds lowering plus its operations to sec-check-lowering-support"
      - "MD-104 follow-up: checked conversions (ConversionError, try) remain unlowered; no foreign/C enum surface exists to exercise the ABI-domain rule. Semantic IR proof transport and consumption by the enum pass are implemented (lowering.integer-enum-representation)."
      - "panic reporting: the minimal endpoint traps without a message (MD-101); a hosted panic policy with bounded reporting is not lowered"
      - preserve verified target/profile/reference/ownership/effect facts through object/link generation
      - preserve, transform, or explicitly invalidate canonical debug provenance through final emission under compiler.debug-information-v1
    verification:
      - command: GOCACHE=/tmp/sec-go-cache SEC_MLIR_BIN=$PWD/build/sec-mlir/bin go test ./cmd/compiler -run TestNativeTrackNamesUnloweredConstructs -count=1
        result: passed on 2026-10-26 after restoring structured parsing of categorized capability diagnostics
      - command: SEC_MLIR_BIN="$PWD/build/sec-mlir/bin" go test ./internal/lowering/secmlir ./cmd/compiler -run 'TestConversionProofTransport|TestNativeTrack|TestIntegerEnumTrack' -count=1
        result: passed on 2026-10-18 after extracting the shared proof verifier into ConversionProof.cpp; 32/64 proof transport and tamper rejection plus native binaries and enum emission boundaries
      - command: SEC_MLIR_BIN="$PWD/build/sec-mlir/bin" go test ./cmd/compiler ./internal/lowering/secmlir -count=1
        result: passed on 2026-10-17; includes native integer-enum executable (exit 0), all emission boundaries, deferred-operation rejection preserving output and existing compiler/emitter regressions
    tests:
      - internal/mlir/capability_diagnostics_test.go

  - id: compiler.debug-information-v1
    area: compiler-debug-information-and-artifact-correlation
    status: partial
    integrated: null
    document_revision: "1.0"
    repository_baseline: main-reviewed-2026-09-23
    summary: >-
      Implements the canonical Sec 0.1 debug-information model with exactly
      three levels (None, LineTables, Full), range/origin-aware source
      provenance, semantic step points, truthful optimized-value tracking,
      ownership/lifetime availability, concrete generic-specialization
      identities, logical Task / physical Thread / Process debug identities,
      embedded or separate debug artifacts with exact image and source-content
      correlation, target-neutral lowering to supported physical debug formats,
      and compiler verification plus conformance obligations. Debug information
      is artifact/tooling metadata and never changes Sec program semantics.
    rules:
      - rules/compiler/debug_information.md
      - rules/compiler/semantic_ir.md
      - rules/compiler/compiler_pipeline.md
      - rules/compiler/monomorphization.md
      - rules/compiler/compiler.md
      - rules/compiler/linking.md
      - rules/mlir/sec_mlir.md
      - rules/platform/target_profiles.md
      - rules/platform/abi.md
      - rules/concurrency/tasks.md
      - rules/concurrency/await.md
      - rules/concurrency/threads.md
      - rules/concurrency/processes.md
      - rules/errors/panic.md
      - rules/memory/ownership.md
      - rules/memory/borrowing.md
      - rules/memory/destruction.md
      - rules/memory/memory_model.md
      - rules/memory/storage.md
      - rules/memory/layout.md
      - rules/platform/hardware-register-access.md
      - rules/tooling/lsp.md
      - rules/compiler/compiler_testing.md
    implemented:
      - "Canonical compiler-internal DebugInformationLevel (2026-10-14): internal/debuginfo defines exactly None, LineTables and Full with canonical names, explicit validation and internal text metadata round trips. Invalid values and extra tiers are rejected without changing an existing selection; backend support, debug emission and CLI/manifest spellings remain separate obligations."
      - "Target-neutral debug placement (2026-10-14): internal/debuginfo represents exactly Embedded and Separate and preserves the independent Level and Placement axes in Selection. Canonical internal metadata round trips preserve all six combinations; invalid placements fail without changing the prior selection. Physical emission, target capability resolution and exact companion correlation remain separate remaining items."
      - "Source-content identity (2026-10-14): immutable algorithm-tagged SHA-256 metadata fingerprints exact in-memory compiler input without retaining source text. Lexer.SourceContent associates the fingerprint with token-source provenance before BOM/UTF-8 decoding, preserving editor overlays, path independence and parser rewind. Consumers detect source-version mismatch; missing or malformed identity fails closed. Physical debug emission and debugger mismatch policy remain separate."
    existing_foundations:
      - Semantic IR already preserves canonical source provenance and semantic identities required by debug lowering.
      - Monomorphization already distinguishes concrete semantic specialization identity from physical PlanEntry and implementation-body identity.
      - Compiler/linking governance already owns final artifact verification, LTO, reproducibility, and artifact identity concerns needed by debug companions.
      - Task, await, thread, and process rulebooks already define the execution identities and suspension/lifecycle relations consumed by debugger metadata.
      - LSP/source-position infrastructure already provides shared source-coordinate concepts that debug mapping must not contradict.
    remaining:
      - keep debug level orthogonal to optimization, runtime checks, panic strategy, ABI, ownership, scheduling, and program semantics
      - introduce target-neutral debug step-point and source-provenance facts with source range, lexical scope, semantic operation identity, user/synthetic/inlined origin, and inline chain
      - preserve same-line distinct source step points using columns/ranges/discriminators where the target encoding permits
      - implement LineTables emission for source mapping, concrete function/specialization identity, inline chains, breakpoints, stepping, and source symbolization
      - implement Full lexical-scope, parameter, local, static/global, capture, canonical Sec type, generic substitution, and exact value-location/reconstruction metadata
      - integrate Semantic IR ownership/lifetime availability so moved, discarded, destroyed, uninitialized, inactive-variant, partially available, and conditionally available Places are never represented as stale live values
      - support projection-level partial aggregate debug availability where the target/Sec-aware debugger path can represent it
      - support exact constant, register, memory, piecewise, and pure-expression value reconstruction without executing user code or other program-visible effects
      - preserve semantic struct fields, enum members, active union variants, Option/Result alternatives, named types, units, references, strings, arrays, slices/views, and opaque-resource boundaries instead of exposing lowered carriers as canonical source types
      - add device/MMIO debug-read safety metadata so ordinary Full inspection never performs a potentially side-effecting read without an explicit debugger/platform operation
      - preserve concrete generic specialization identity in both LineTables and Full independently of machine address, mangled name, PlanEntry sharing, or implementation-body sharing
      - bind generic source breakpoints to all executable concrete specializations without causing monomorphization demand
      - preserve enclosing specialization identity for generic methods, closures/lambdas, captures, and per-instantiation static storage
      - implement logical Task frame identity across suspension/resumption and worker migration without requiring physical worker stack preservation
      - preserve distinct Process, physical Thread, and logical Task identities plus causal spawn/await/join relations without fabricating call frames
      - provide debugger-facing runtime hooks for active logical-task inspection where selected target support requires them while keeping them outside Sec source reflection
      - introduce exact generated-image/debug-companion correlation identity and reject stale or incompatible companion artifacts
      - make debug mapping image-aware and relocatable across ASLR, shared libraries, dynamic images, and firmware placement
      - separate debug stripping from generation and protect metadata required by runtime, ABI, panic, loader, or other non-debug semantics
      - separate canonical SourceFileIdentity from SourceLookupPath and support deterministic source-root/path remapping
      - make debug artifact generation deterministic/reproducible under the build reproducibility contract and exclude incidental host paths, timestamps, random IDs, process IDs, and traversal order where configured/avoidable
      - define backend lowering from the target-neutral Sec debug model to target-supported physical formats such as DWARF or CodeView without relabeling Sec as another source language
      - use Sec-specific debugger extensions/companion records when a standard physical debug format cannot faithfully encode required Sec availability, logical-task, or causal facts
      - preserve canonical Sec source signatures independently of hidden ABI parameters, sret, split registers, tag/payload transport, closure environments, and generated thunks
      - model physical stack-walk support separately from source debug level and never infer Sec panic/runtime unwinding from debugger CFI/frame recovery
      - preserve mixed-language stack boundaries and Sec callback source identity without requiring foreign dependencies to carry Sec-equivalent debug metadata
      - retain optimization freedom for inlining, tail calls, frame omission, code sharing, dead stripping, and LTO while reducing debug precision rather than fabricating frames/values when exact reconstruction is impossible
      - add granular CompilationPlan debug capabilities for requested level, placement, active source/value/type support, logical-execution support, artifact/source correlation, and physical stack walking where needed
      - reject unsupported level/placement/active-feature combinations at compile/build time with no silent downgrade
      - make every transforming compiler pass preserve, accurately transform, or explicitly invalidate debug provenance through final emission
      - add compiler-development verifier invariants for stale value locations, inactive variants, unresolved generic runtime types, merged specialization identities, synthetic step points, and invalid source/artifact identity relations
      - add independent None, LineTables, and Full conformance matrices across representative optimization levels and targets
      - add structural compiler debug-model tests, target physical-format tests, and supported debugger/Sec-aware integration tests
      - add LineTables tests for mapping, same-line step points, inline chains, generic identities, breakpoints, stepping, synthetic suppression, optimized-away operations, relocation, split artifacts, and source mismatch
      - add Full tests for locals/parameters, shadowing, reinitialization, ownership availability, partial moves, unions, exact constants, piecewise values, optimized-out values, named/unit types, Option/Result, references, strings, arrays/views, generics, per-instantiation statics, suspended-task locals, and MMIO-safe-read behavior
      - add companion-artifact mismatch, source-content mismatch, path-remapping, reproducibility, and negative target-capability tests
    excluded:
      - source-level DebugInfo, DebugFrame, DebugVariable, or debugger-control APIs
      - a Sec debugger expression evaluator
      - a mandatory remote-debugging protocol
      - symbol-server, source-server, or debuginfod protocol standardization
      - mandatory embedded source text
      - one universal physical debug format or format version
      - mandatory frame pointers
      - a general runtime/panic unwinder introduced for debugging
      - runtime generic reflection or dictionaries introduced by debug metadata
      - arbitrary safe debugger mutation of Sec values
      - complete serialization of Semantic IR or the compiler semantic database into Full debug artifacts
    corrections_applied:
      - rules/corrections/applied/debug-information-cross-rulebook-correction-20260923.md
      - rules/corrections/applied/compiler-testing-cross-rulebook-correction-20260926.md
      - rules/corrections/applied/incremental-compilation-cross-rulebook-correction-20260928.md
    governance_reconciliation:
      - keep governance/index.yaml unchanged because compiler.yaml already owns compiler pipeline, linking, initialization, and artifacts
      - cross-link compiler.backend-architecture and compiler.linking to debug-provenance and final-artifact obligations without duplicating their existing work
      - leave target/platform capability ownership in the existing CompilationPlan/target governance model; debug-information consumes resolved target facts
      - testing.compiler-verification-v1 in governance/testing.yaml actively owns the shared compiler-test harness and debugger-driving infrastructure; this integration retains feature-specific debug-information evidence obligations
      - rules/compiler/incremental_compilation.md and compiler.incremental-compilation-v1 own cache invalidation and reuse rules for debug/backend artifact state
    revised: "2026-10-14"
    code:
      - internal/debuginfo/level.go
      - internal/debuginfo/placement.go
      - internal/debuginfo/content.go
      - internal/lexer/source.go
    tests:
      - internal/debuginfo/level_test.go
