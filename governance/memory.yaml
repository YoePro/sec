  - id: frontend.raw-pointers
    area: raw-pointer-types-and-operations
    status: partial
    document_revision: "2.0"
    reviewed: "2026-09-22"
    repository_baseline: "814a584"
    summary: >-
      Tracks the revision-2.0 RawPtr address-value model and its integration
      with unsafe operations, ownership, borrowing, lifetime, references,
      allocation, destruction, target address spaces, volatile access and ISR
      policy. The bare type grants no pointee ownership, borrow, lifetime,
      bounds, generation or hardware authority. Exact RawPtr-to-reference and
      reference-to-RawPtr source spelling remains intentionally unresolved.
    rules:
      - rules/memory/raw_pointers.md
      - rules/memory/unsafe.md
      - rules/memory/references.md
      - rules/memory/borrowing.md
      - rules/memory/lifetime_analysis.md
      - rules/memory/ownership.md
    code:
      - internal/sema/compiler_known_members.go
      - internal/sema/analyzer.go
      - internal/sema/types.go
      - cmd/lsp/main.go
    implemented:
      - RawPtr[T] is registered as a compiler-known generic type
      - RawPtr[T] is usable in locals, parameters, returns and extern declarations
      - RawPtr is treated as a copyable non-owning address value
      - ordinary compiler-known RawPtr Read, Write, Offset, AddBytes and Difference members exist
      - Offset, AddBytes and Difference require unsafe and validate represented argument and pointee constraints
      - VolatileRead and VolatileWrite have stable compiler-known identities, unsafe gating and effect publication
      - LSP completion and hover consume compiler-known raw-pointer member definitions for represented operations
      - basic explicit conversions between uint, RawPtr and compatible RawPtr forms are recognized under unsafe gating in the represented frontend
      - RawPtr[void] is rejected for typed Read, Write, VolatileRead, VolatileWrite, element Offset, AddBytes, and element Difference even inside unsafe
    remaining:
      - implement canonical null source syntax and rules end to end
      - implement ordinary Read and Write frontend semantics completely where compiler-known member classification is incomplete
      - implement complete target-pointer-width and address-space validation for integer/raw conversions
      - implement complete RawPtr arithmetic target layout and range validation
      - integrate ownership-v2, borrowing-v2, lifetime-analysis-v2 and references-v2 proof facts into raw-to-safe conversion validation
      - reject compiler-known null, dangling, unaligned, uninitialized and conflicting raw-to-safe operations even inside unsafe
      - lock and implement exact source spelling for ref/ref mut to and from RawPtr in a dedicated conversion decision
    required_tests:
      - RawPtr[T] and RawPtr[void] type construction
      - copy, move, store and return RawPtr without pointee ownership transfer
      - Read and Write require unsafe
      - RawPtr[void].Read and Write rejected
      - RawPtr[void] element Offset, AddBytes, and Difference rejected
      - known null dereference rejected in unsafe
      - known dangling raw use rejected when lifetime fact exists
      - known alias-conflicting raw-to-ref mut conversion rejected
      - target-width overflow rejected
    corrections_applied:
      - rules/corrections/applied/raw-pointers-null-domain-correction-20260816.md
    verification:
      - command: go test ./internal/sema -run 'TestRawPtr(Void|PointerArithmetic|Conversion)|TestCompilerKnownRawPointer' -count=1
        result: passed on 2026-09-22

