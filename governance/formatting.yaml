      - id: formatter-language-corrections
        status: partial
        rules:
          - "§ 26"
          - "§ 27"
        requirement: >-
          Implement Language Corrections as a separate opt-in, grammar-aware
          source-fix layer. A correction is permitted only when the intended
          Sec construct is locally unambiguous. Do not infer programmer intent,
          mutability, ownership policy, missing types, overloads, control-flow
          meaning, error policy, or allocation policy.
        acceptance:
          - "`language_corrections = false` performs no correction-catalogue rewrites."
          - Corrections operate on proven syntax context, not blind regular-expression substitution.
          - Positive and negative tests exist for every correction rule.
          - "Historical consuming parameter syntax `name: <- Type` corrects to `->name: Type` only when that syntax is unambiguous."
          - "Statement `i++` corrects to `i += 1` without introducing expression-level post-increment semantics."
          - The correction catalogue can expand through dogfooding without weakening the unambiguity rule.
        implemented:
          - ordinary formatting no longer rewrites a locally recognizable foreign `func` declaration to `fn`
          - the existing explicit formatter fix option performs the bounded `func` to `fn` correction and remains idempotent
          - ambiguous identifier, call-like, and incomplete `func` shapes remain unchanged even when fixes are enabled
          - ordinary formatting preserves redundant nested parentheses while the explicit fix option removes only a directly nested inner pair proven by complete CST delimiter parentage
          - redundant-parenthesis correction preserves precedence-sensitive groups, comment-separated nesting, and parenthesis-like text inside literals, and remains idempotent
          - "§ 27(37) (2026-10-03): the missing-list-separator correction inserts the comma the parser proved missing between later-line struct fields, parameters, call arguments, and array elements, before any trailing comment; same-line adjacency and line-separated enum, union, register, and struct-literal lists stay unchanged; tests in internal/formatter/missing_separator_corrections_test.go"
          - "§ 11(2) (2026-10-03): ordinary formatting adds the trailing comma after the last field of an already multiline struct declaration, before any trailing comment; open: a multiline parameter list whose first parameter shares the opener line is still not reflowed to one parameter per line with its closer on its own line (§ 11(3), § 16(2)) and is mis-aligned"
          - explicit fixes remove parser-confirmed whole-condition parentheses from valid if, while, and switch headers while preserving partial-expression grouping and ordinary formatter output
          - "§ 27(33) (2026-10-03): explicit fixes rewrite `type Name = T` to `type Name T`, never the compact variant form `type Name = A B ...` (§ 27(34)); ordinary formatting keeps the invalid legacy form"
          - "`sec fmt --fix` applies the Language Corrections from the CLI, also with --check and --stdin; lexically malformed source stays byte-for-byte unchanged in fix mode too (§ 25)"
          - "§ 27(36), MD-006 (2026-10-03): explicit fixes rewrite `(state is Idle) == true` to `state is Idle` and `!(state is Idle)` to `state is not Idle` (including `is None` and `is available`) only where the parent binds more loosely than the equality/state-test level; Option binding tests, the null test, already negated tests, comment-bearing groups, and documents with parse errors are never rewritten, and ordinary formatting leaves every form unchanged"

