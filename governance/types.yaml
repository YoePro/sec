    repository_baseline: c515862
    document_revision: '2.0'
    document_created: '2026-08-18'
    document_last_updated: '2026-08-18'
    summary: Ordinary unit identities are declaration/catalog driven. Sema has no spelling-based physical-unit prelude,
      and omitted physical Dimension is represented as not established rather than a fabricated identity axis.
    rules:
    - rules/types/units.md
    - rules/projects/modules.md
    code:
    - internal/sema/units.go
    - internal/sema/analyzer.go
    tests:
    - internal/sema/analyzer_test.go
    - testdata/units_valid.sec
    - testdata/units_advanced_valid.sec
    implemented:
    - omitted numeric carrier defaults to decimal
    - omitted category defaults to other
    - ratio omitted Dimension resolves to the canonical dimensionless vector
    - information omitted Dimension resolves to information^1
    - currency omitted Dimension receives an identity-derived currency axis
    - other omitted Dimension receives an identity-derived semantic axis
    - explicit Dimension metadata replaces the initially retained unit dimension
    - ordinary units enter Sema only through analyzed declarations and imported catalogs
    - physical units without Dimension retain DimensionEstablished=false and no fabricated axis
    - explicit Dimension metadata establishes the exact declared vector
    - undeclared former builtin spellings receive the ordinary unknown-unit diagnostic
    bug_reference:
    - correction6.md
    governance_reconciliation:
    - Keep frontend.units-v2 implemented claims for ratio, information, currency, and other omitted-Dimension defaults.
    - Replace the existing required-test wording "all five categories and their omitted Dimension defaults resolve
      correctly". Revision 2.0 does not define a synthesized omitted-Dimension default for physical.
    - 'Suggested replacement tests: ratio omitted Dimension -> []; information -> information^1; currency -> unique
      currency axis; other -> unique semantic axis; physical -> no synthesized Dimension.'
    - The existing stdlib.units-catalog entry remains authoritative for the standard-library unit declarations and
      metadata. It should replace, not be supplemented by, a hidden Sema-only ordinary-unit catalog.
    required_tests:
    - undeclared ordinary unit factor is rejected
    - undeclared m is rejected when no standard unit catalog declaration is present
    - standard unit catalog declaration makes m available
    - ordinary identifier spelling does not inject hidden unit semantics
    - ratio omitted Dimension becomes dimensionless
    - information omitted Dimension becomes information^1
    - currency omitted Dimension gets a unique currency axis
    - other omitted Dimension gets a unique semantic axis
    - physical omitted Dimension is not synthesized
    - explicit physical Dimension is authoritative
