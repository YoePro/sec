  - id: compiler.linking
    area: compiler-linking-and-artifacts
    status: partial
    integrated: "2026-08-24"
    document_revision: "1"
    repository_baseline: c515862
    summary: >-
      Implements the canonical Sec linking model: CompilationPlan-specific
      LinkPlan and LinkEnvironment authority, deterministic binary symbol
      identity, native/foreign symbol resolution, typed dependency inputs and
      provenance, archive fixed-point resolution, link roots/reachability, dead
      stripping/LTO constraints, reproducible toolchain invocation, and final
      artifact verification. The current sec build direct clang-driver path is
      recorded only as a legacy implementation slice, not as the canonical
      model.
    rules:
      - rules/compiler/linking.md
      - rules/compiler/initialization.md
      - rules/platform/platform_model.md
      - rules/platform/target_profiles.md
      - rules/platform/interrupts.md
      - rules/platform/abi.md
      - rules/platform/ffi.md
      - rules/projects/modules.md
      - rules/projects/projects.md
      - rules/declarations/static.md
      - rules/memory/destruction.md
      - rules/concurrency/concurrency.md
      - rules/mlir/sec_mlir.md
      - rules/compiler/semantic_ir.md
      - rules/compiler/debug_information.md
    code:
      - cmd/compiler/main.go
      - cmd/compiler/target.go
    implemented:
      - sec build has a concrete external clang-driver invocation after LLVM or MLIR generation
      - target definitions provide an LLVM triple and coarse CanLink compiler-support gate
      - build accepts an explicit clang executable candidate override
      - external process stdout and stderr are surfaced and unsupported CanLink targets are rejected
      - "2026-11-12: foreign @link_name is limited to foreign linkage identity: it is accepted only on extern declarations, Sec code calls the declaration by its Sec name (the link name never becomes a Sec name), its ABI family and effects are the declaration's, a second declaration with the same Sec signature is a duplicate whatever its link name, two Sec declarations cannot share one foreign symbol, and no native dependency or link input is derived from it (it reaches emission only as the sec.link_name symbol attribute); the call-graph node key includes it as foreign linkage identity per call_graph.md § 19(2) (TestLinkNameIsOnlyForeignLinkageIdentity)."
      - "2026-11-12: Sec 0.1 has no source-level weak-linkage mechanism: the closed attribute set has no weak, link-once or optional linkage attribute and no declaration form selects one; @weak, @linkonce, @linkage(...) and @optional are unknown attributes (TestNoSourceLevelWeakLinkage)."
    incorrect_or_partial:
      - no canonical LinkPlan is constructed before concrete invocation
      - no resolved LinkEnvironment owns target linkage semantics
      - the default clang executable is resolved through host PATH
      - explicit clang override compatibility is not validated against LinkEnvironment capabilities
      - target linkage currently depends on LLVMTriple and external driver defaults
      - link inputs, dependencies, roots and symbols are not typed provenance-bearing canonical facts
      - output-affecting host environment is not modeled as canonical link state
      - successful external process exit is accepted without canonical artifact verification
    remaining:
      - introduce one canonical LinkPlan for every concrete CompilationPlan that requires binary linkage
      - make CompilationPlan.LinkEnvironment authoritative for object format, symbol model, entry convention, relocation model, platform linkage requirements, and linker capabilities
      - replace unstructured canonical linker-argument construction with typed link inputs carrying dependency provenance
      - resolve logical native dependencies into target-specific ResolvedNativeDependency and LinkInput forms before concrete invocation where supported
      - preserve provenance for project, FFI binding, initialization, shutdown, runtime, platform, and explicit-build link inputs
      - introduce deterministic collision-resistant BinarySymbolIdentity distinct from SemanticDeclarationIdentity, ABISignature/ABIFingerprint, and EncodedLinkSymbol
      - separate Sec-native mangling from target object-format symbol encoding and keep import aliases, traversal order, host state, and worker scheduling out of native binary identity
      - define explicit binary linkage categories for private, native, foreign, generated-entry, generated-runtime, generated-callback, and platform-required symbols
      - keep object-unit identity separate from Sec module/declaration identity and support module, multi-object, whole-program, and LTO unit strategies
      - consume ProgramInitializationPlan and ProgramShutdownPlan requirements for startup objects, entry adapters, runtime/shutdown components, sections, and termination integration
      - represent symbol definitions and references using canonical native BinarySymbolIdentity or foreign linkage identity rather than source spelling
      - implement output-kind-specific symbol-resolution policy for executables, static libraries, shared libraries, and object outputs
      - permit static-library/object outputs to preserve unresolved external references where later consumers are expected to provide them
      - require final executable symbol requirements to resolve through included definitions or valid declared dynamic/platform imports
      - reject duplicate non-coalescible native Sec definitions independent of link order and preserve diagnostics for all conflicting providers
      - support explicitly coalescible compiler-generated/specialization definitions with canonical identity and ABI compatibility verification
      - model static archives as containers of link units and implement canonical fixed-point member extraction from reachable unresolved requirements
      - materialize archive rescans, groups, or equivalent target mechanisms as toolchain strategy rather than source/library-order semantics
      - permit cyclic native-library dependency graphs when the selected LinkEnvironment can realize the required fixed-point resolution and reject plans when it cannot
      - model shared libraries as dynamic provider dependencies and import libraries/frameworks as target-specific realizations of logical dependencies
      - represent dynamic/provider ambiguity and interposition only when explicitly permitted by the selected LinkEnvironment
      - carry target-specific foreign/provider version metadata where supplied without adding Sec source syntax
      - introduce canonical LinkReachabilityGraph and LinkRoot concepts for executable, library, runtime, initialization, shutdown, static-storage, callback, and platform retention
      - ensure Sec public visibility does not automatically make a declaration a binary root or externally exported symbol
      - retain executable physical entry, generated startup chain, source-level main, required runtime/shutdown facilities, and platform retention roots
      - integrate static-storage reachability with deterministic static-destruction requirements so linker GC cannot remove storage required by ProgramShutdownPlan
      - avoid live foreign-import requirements for unused foreign declarations and create them only from reachable foreign references
      - retain compiler-generated callback thunks only through actual live callback contracts while preserving their address-based foreign reachability
      - support compiler-known PlatformRetentionRequirement inputs for reset vectors, interrupt vectors, fixed-address objects, hardware tables, and related target facilities
      - permit dead stripping as an optimization while rejecting removal of any canonical root or reachable dependency
      - materialize canonical retention into concrete linker garbage-collection/section mechanisms rather than treating external-linker GC as the definition of Sec reachability
      - retain reusable library binary surface independently of internal call reachability while permitting removal of private implementation details
      - allow LTO to inline, internalize, merge units, coalesce compatible definitions, and remove private dead code while preserving binary surfaces, ABI contracts, foreign requirements, initialization/shutdown requirements, dynamic-link constraints, and platform roots
      - prevent whole-program optimization assumptions that violate LinkEnvironment dynamic-resolution, external-consumer, or interposition contracts
      - run final artifact verification against the resolved LinkPlan after external linker/toolchain success
      - verify target/output identity, entry contract, mandatory symbol resolution, permitted dynamic imports, required roots/surfaces, startup/shutdown facilities, ABI compatibility, native dependency realization, and stale-artifact constraints
      - resolve concrete LinkToolchain through LinkEnvironment and reject toolchains lacking required object-format, relocation, archive, LTO, dynamic-link, response-file, or platform capabilities
      - permit host configuration for locating compatible tools without allowing PATH/default-linker behavior to define target semantics
      - make linker search paths explicit LinkPlan inputs with provenance and prohibit accidental current-directory/host-global resolution from becoming canonical dependency semantics
      - reject ambiguous dependency resolution when no owning dependency rule defines canonical selection and avoid using search-path order as package/provider precedence
      - expand target default libraries, runtime objects, startup objects, and similar driver defaults into canonical LinkPlan requirements even when materialized implicitly
      - support explicit target/toolchain-specific raw linker options only as build escape-hatch inputs that participate in fingerprints and cannot silently invalidate canonical invariants
      - treat response files as transport/serialization details and keep LinkPlan semantics identical between direct argv and response-file invocation
      - materialize concrete linker inputs in deterministic plan-derived order independent of filesystem, map, source traversal, and worker completion order
      - control or explicitly model output-affecting tool execution state such as working directory, toolchain path, SDK/sysroot, search paths, and relevant environment variables
      - use reproducible-output toolchain facilities where supported without making non-semantic timestamps or random build IDs part of Sec program semantics
      - include LinkPlan, LinkEnvironment, toolchain identity/version, input artifacts, resolved dependencies, generated startup/runtime/shutdown inputs, explicit options, LTO mode, output kind, and relevant reproducibility settings in link cache identity
      - map external linker errors to BinarySymbolIdentity, ForeignSymbolRequirement, source use, dependency provenance, and LinkRoot information where possible
      - distinguish ToolchainInvocationFailure, LinkResolutionFailure, and ArtifactVerificationFailure diagnostics
      - expose resolved toolchain, inputs, dependencies, search paths, startup/runtime/shutdown components, effective explicit options, LTO mode, and output path for build diagnostics
      - add cross-compilation tests proving host startup objects, host system libraries, host object defaults, and host linker behavior cannot leak into target LinkPlan
      - add multi-Variant tests proving each selected Target Variant receives an independent LinkPlan, link operation, and output artifact
      - add deterministic symbol, archive, provider, reachability, dead-stripping, LTO, toolchain-materialization, search-path, artifact-verification, cross-compilation, and diagnostic regression tests
      - update repository-level implementation-status verification commands once the first canonical LinkPlan vertical slice is implemented
      - integrate requested debug level and placement, exact image/companion correlation, post-LTO mapping finalization, and safe strip policy under compiler.debug-information-v1
      - "Moved from P15-42a (owner decision 2026-10-31): statics and static return origins of another module, which today fail closed in Semantic IR, need separately compiled module surfaces"
    excluded:
      - Sec module and source declaration identity semantics
      - ABI parameter/return classification
      - FFI source-position legality and foreign resource ownership
      - program initialization and shutdown ordering semantics
      - storage-layout semantics
      - target-profile capability definitions
      - general source-level weak linkage
      - general source-level C ABI export of Sec functions
      - source-level linker command, search-path, or library-order syntax
      - one-object-per-module requirements
      - universal object-format or linker implementation requirements
      - byte-identical output on toolchains without reproducible-output support
    corrections_applied:
      - rules/corrections/applied/correction32-20260828.md
    governance_reconciliation:
      - cross-link compiler.program-initialization linking-facing handoff
      - cross-link platform model LinkEnvironment work and ABI stale-artifact checks
      - keep CanLink as a coarse compiler/toolchain support summary rather than target-linkage semantics
      - do not describe the existing direct clang invocation as canonical linking completion

  - id: compiler.program-initialization
    area: projects-initialization-and-build
    status: partial
    integrated: "2026-08-18"
    revised: "2026-10-05"
    document_revision: "1"
    repository_baseline: 20b3606
    summary: >-
      Implements canonical Sec executable initialization and shutdown planning:
      target-kind entry contracts, no implicit module initialization, optional
      runtime-free startup, CompilationPlan-specific ProgramInitializationPlan
      and ProgramShutdownPlan artifacts, dependency-ordered startup and
      teardown, startup-failure rollback, deterministic static-destruction
      integration, and explicit lowering/linking handoff.
    rules:
      - rules/compiler/initialization.md
      - rules/projects/modules.md
      - rules/projects/projects.md
      - rules/declarations/static.md
      - rules/memory/destruction.md
      - rules/concurrency/concurrency.md
