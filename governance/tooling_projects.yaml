        result: passed on 2026-10-13
      - command: go test ./cmd/compiler ./internal/project ./internal/formatconfig -count=1
        result: passed on 2026-10-13; full affected compiler, project and formatconfig suites; identity conformance verifies UUIDv4 generation, repeated init and human-name rename without changing UUID, and rejection of malformed or nil UUID without writes; module CLI verifies normal/internal paths, root-relative invocation, compatible-source preservation, unchanged manifest, invalid paths, source and directory conflicts, symlinks and nested boundaries; remaining project-identity 5 to 3, sec-init 6 to 5, tooling_projects.yaml 26 to 23

