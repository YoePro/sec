      - add stable diagnostic IDs for types.default-violates-contract, types.default-not-representable, types.ambiguous-implicit-default, types.no-default-value, types.empty-in-contract, types.duplicate-in-contract-value, types.default-cycle, struct.invalid-defaulted-field, variables.immutable-requires-initializer, and backend.default-left-undefined
      - add related-location metadata for membership failures, range ambiguity and representability failures, explicit defaults, omitted fields, and missing initializers
