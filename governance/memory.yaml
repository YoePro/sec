    required_tests:
      - borrow-only program lowers with no runtime borrow counter/table
      - ref mut call reborrow lowers without consuming caller reference storage
      - final borrow use precedes invalidating replacement/destruction in lowered control flow
      - generation/epoch check remains when required even though borrow legality was compile-time
      - FFI call-bounded borrow address is not retained by generated wrapper
      - volatile access count/order remains unchanged by snapshot borrow optimization

  - id: semantic-ir.destruction
