      - rules/compiler/semantic_ir.md
    remaining:
      - "Preserve storage identity, T, operation kind, success/failure order, RMW classification, fence semantics, execution context and source provenance."
      - "Preserve successful CompareExchange as modification/RMW and failure as read-only."

  - id: lowering.atomics-v2
    area: atomic-lowering
    status: planned
    rules:
      - rules/concurrency/atomics.md
      - rules/concurrency/concurrency_memory_model.md
    remaining:
      - "Consume immutable CompilationPlan capability facts."
      - "Preserve or strengthen requested order; never weaken."
      - "Return failed CompareExchange observed value from the same atomic operation."
      - "Preserve fence and release-sequence semantics."

  - id: platform.atomics-v2
    area: compilation-plan-atomic-capability
    status: planned
    rules:
