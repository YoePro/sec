      - internal/lowering/secmlir/semantic_schema_version_test.go
    implemented:
      - "2026-11-19: Canonical internal Semantic IR schema ownership is defined in internal/ir/semantic/SCHEMA.md and linked from governance/README.md. semantic.Version in model.go is the single executable authority; module verification and emission use that authority independently of document revision, work-package number and selected dialect output schema. The policy specifies incompatible-change version bumps, coordinated producer/verifier/consumer updates, dependency validation and governance synchronization; diagnostic printing is not claimed as a serialized loader. Regression tests verify current metadata and reject unspecified/previous/future versions before content inspection, with no emitted output across supported dialect selections and 32/64-bit plans. No schema bump or language change was required."
      - "2026-11-19: Complete package-local Semantic IR crosswalk in governance/semantic-ir-amendments.md covers all 17 installed amendment files and all 314 numbered local sections, mapping their responsibilities to canonical Semantic IR v2 sections and existing live implementation owners. All eight retained implementation reports/acceptance matrices now link directly to canonical responsibilities and the live ledger. Their original dated content is byte-for-byte preserved after removal of the additive navigation note. Proposed statuses, historical completion claims and current implementation/decision boundaries are retained; the map does not promote any package or physical lowering."
      - "2026-11-19: Future package maintenance now follows the canonical crosswalk/workflow linked from codex.md, governance/README.md and internal/ir/semantic/SCHEMA.md. Implementation inventories, gates, test results and progress update the owning fragmented ledger and dated package reports; semantic changes follow the correction workflow in responsible canonical sections. Package-specific status fragments must not be appended to the normative book. The workflow requires amendment/report navigation, one live status owner, preserved historical evidence, independent executable/dialect version review and bounded validation before completion claims."
    remaining: []
    required_tests:
      - governance has one canonical Semantic IR rulebook path
      - package reports link to canonical semantic sections
      - schema changes update version metadata deterministically
    verification:
      - command: go test ./internal/ir/semantic ./internal/lowering/secmlir -run 'TestSemanticSchema' -count=1 -timeout=120s; bin/yamlstatus books --check
        result: "Passed 2026-11-19: focused schema compatibility tests 0.002s/0.002s; all 115 canonical rulebooks and 131 static publication files validate. Read-only crosswalk audit confirms all 17 amendment files exactly once, complete local-section coverage (314 numbered sections), all eight existing reports/matrices, 118 existing local links and valid heading anchors, and existing live-owner IDs. Saved pre-edit fingerprints confirm original report bodies are byte-identical after removing only the additive navigation notes. Both remaining governance points closed: ID 2 to 0, status implemented; governance.yaml 11 to 9. This is documentation/maintenance closure, not new compiler, package or runtime implementation acceptance."
      - command: go test ./internal/ir/semantic ./internal/lowering/secmlir -run 'TestSemanticSchema' -count=1 -timeout=120s; go vet ./internal/ir/semantic ./internal/lowering/secmlir
        result: "Passed 2026-11-19: focused schema boundary tests (0.002s / 0.003s) and vet. Current schema accepted and emitted metadata preserves the canonical version; unspecified, previous, future and maximal versions rejected with no output under default and explicit dialect schemas 11 through 14 on 32/64-bit plans. This verifies schema ownership boundaries, not a serialized-module reader or the full package suites. ID remaining 3 to 2; governance.yaml remaining 12 to 11."

