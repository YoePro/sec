  - id: tooling.formatter-declaration-comment-alignment
    area: tooling
    status: implemented
    integrated: "2026-08-27"
    revised: "2026-10-26"
    summary: >-
      Aligns structural type, initializer, tag and trailing-comment columns
      within compatible declaration groups through the shared CLI/LSP formatter,
      including let, type-first and named-value declarations.
    rules:
      - rules/tooling/formatter.md
    code:
      - internal/cst/roles.go
      - internal/cst/binding_roles.go
      - internal/formatter/cst_spacing.go
      - internal/formatter/binding_alignment.go
      - internal/formatter/trailing_comment_alignment.go
      - internal/formatter/struct_field_alignment.go
      - internal/formatter/parameter_alignment.go
      - internal/formatter/named_type_alignment.go
      - internal/formatter/formatter.go
      - cmd/compiler/main.go
      - cmd/lsp/main.go
    tests:
      - internal/cst/binding_roles_test.go
      - internal/formatter/binding_alignment_test.go
      - cmd/compiler/header_spacing_test.go
      - cmd/lsp/header_spacing_test.go
      - testdata/formatter/binding_alignment.sec
      - testdata/formatter/binding_alignment.expected.sec
      - testdata/formatter/binding_alignment_padding.sec
      - testdata/formatter/binding_alignment_padding.expected.sec
      - internal/formatter/formatter_test.go
      - cmd/compiler/main_test.go
      - cmd/lsp/main_test.go
    implemented:
      - "2026-10-26: completed the whole declaration-alignment extension (§ 9(1)–(10)): parser-owned CST binding name/type/initializer roles drive compatible let, type-first and parenthesized named-value groups, including static/mutable declarations, := and :<- and attached line/block comments. Existing struct/register field type/tag, callable parameter and named-type tables cover the other declaration families. Columns use structural anchors, the colon binds left, primary/secondary padding candidates fall back per group, and blank lines, standalone/inline comments, multiple bindings on one line, incompatible rows and multiline expressions delimit safe groups. Golden tests preserve syntax/literal/comment tokens, cover widths 2/4/6, both styles, cap fallback and idempotence, and compare exact CLI/LSP output. Nominal trailing-comment alignment now consumes the configured indentation width and lives in trailing_comment_alignment.go. MD-099's independent comment-padding policy and MD-100's possible further exemptions remain unchanged; neither blocks this extension under the current rules."
      - align trailing comments in consecutive struct, enum, register, union, and equivalent nominal declaration items to one visual column
      - place the aligned comment column at least four spaces after the widest code item in its local group
      - end groups at blank lines, standalone or documentation comments, multiline items, and nested block boundaries
      - ignore comment-like text inside quoted strings, character literals, and struct tags while locating trailing line comments
      - preserve LF or CRLF, comment text, indentation, and formatter idempotence through the shared formatter package
      - provide in-place sec fmt formatting for one or more explicit source files with atomic replacement and permission preservation
      - expose identical output through LSP document formatting without editor-side alignment logic
      - "inline block comment fix (2026-10-18, formerly identified bug tooling.formatter.inline-block-comment-breaks-field-alignment): the root cause was the parser — a one-line `/* ... */` with code before and after it on the same line (`c: int /* inline */,`, `a /* note */ + b`) was not skipped and produced a parse error, so the formatter saw uncertain syntax and lost the following fields' roles. Parser.nextToken now treats such a comment as inline trivia (still recorded as an inline comment attachment); every field keeps the § 9(5) type column (TestFormatInlineBlockCommentKeepsFieldAlignment, TestParseInlineBlockCommentsAsTrivia; formatter.md § 9(5), § 9(8), § 12(9a)). TestFormatTokenSpacingLeavesUnroledAndMultilineGaps had only passed because of that parse error and now expects the canonical output"
    remaining:
      - complete range and on-type formatting; recursive directory and project selection is blocked on MD-037; document-formatting minimal enclosing edits, check, stdin, and fix modes are implemented
      - migrate the remaining trimmed-line indentation and alignment decisions to the parser-owned lossless comment/trivia attachments now returned by the shared formatter
    verification:
      - command: go test ./internal/cst ./internal/formatter -count=1; go test ./cmd/compiler ./cmd/lsp -run "BindingAlignment|Fmt|Format|Formatting" -count=1
        result: passed on 2026-10-26 with GOCACHE set; whole declaration-alignment extension verified including existing field/register/parameter/named-type families, exact CLI/LSP goldens, all indentation widths, both styles, padding fallback, literal/comment token preservation and idempotence; remaining for this ID 3 to 2 and formatting.yaml 20 to 19
      - command: go test ./internal/formatter ./cmd/compiler ./cmd/lsp -run 'TrailingComment|AlignsDeclaration|RunFmtCommand' -count=1
        result: passed

