      - mandatory braces and dedicated condition-only and C-style for rejection
      - break and continue loop-context validation
      - immutable lexical loop bindings with no-shadowing checks
      - exactly-once iterable, range-bound, and explicit-step evaluation model
      - finite inclusive and exclusive range forms with direct open-range rejection
      - bound and explicit-step type compatibility checking
      - compile-time zero-step and known wrong-direction rejection for established numeric cases
      - string iteration inferred as rune
