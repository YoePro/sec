    implemented:
      - canonical Place identity for roots, fields, selected indexes and slices, references, and union payload projections
      - direct unavailable tracking with moved, discarded, and detached source provenance
      - lexer, parser, AST, formatter, Sema, and initial LSP support for declaration and assignment move forms
      - named-source implicit copy rejection for compiler-known and @noCopy move-only values in direct declaration and assignment paths
      - intrinsically transferring returns reject ordinary indexed extraction of non-copyable collection elements with canonical ownership code, source range, and corrective help shared by CLI and LSP
      - terminal return ownership context propagates recursively through aggregate, Option, Result, union, and
        value-producing match construction while ordinary calls retain their declared argument ownership modes
      - reusable move-only aggregate and union/Option payload sources require explicit <- outside terminal returns;
        fresh temporaries remain marker-free and explicit terminal markers are ownership-equivalent
      - selected nested field moves, sibling use, whole-aggregate rejection, and mutable field reinitialization
      - projection-sensitive ownership facts across branches, matches, switches, selects, and loops, with a conservative pre-v2 merge model
      - borrow validation before supported moves and overlapping self-move diagnostics
      - independent copy and trivial-destruction classifications
      - left-to-right call argument evaluation with outer-call transfer commit delayed until every argument is ready
      - contextual ownership availability syntax now spans lexer, dedicated AST, parser, formatter, Sema, and static Semantic IR folding for place is available and place is not available; available/is/not remain ordinary identifiers outside the exact if-condition form
      - Sema records the exact tested Place and query polarity, resolves wholly available, unavailable, partially available, and uninitialized states statically where current Place facts suffice, and does not read the queried Place or reinterpret the test as Option/null/borrow/device state
      - continuing-path move-state joins retain an internal conditional marker; binary Available|Unavailable leaf tests refine the positive and negative branches, including a terminating negative branch whose fallthrough proves availability
      - negative whole-aggregate tests preserve existing recursive partial masks and still-owned sibling fields rather than collapsing them to a fabricated Unavailable reason
      - ordinary instance methods reject complete-self consumption through discard, explicit consuming calls, and explicit terminal return while preserving ordinary copy of copyable self values
      - struct-field Place projection preserves root mutation authority so immutable roots reject direct and nested field assignment, mutable roots remain writable, and method-body writes derive mutable/exclusive self authority for call-site enforcement
      - ordinary methods may explicitly move an independently tracked owned self member; declaration, assignment, argument, return, and discard scans propagate the required mutable/exclusive receiver contract without permitting whole-self consumption
      - immutable inline aggregates permit explicit partial ownership transfer from an independently tracked field while preserving sibling availability; immutability continues to forbid field replacement
      - legacy word-form move initializers are rejected with guidance toward canonical :<- and <- syntax while move remains available as an ordinary identifier
      - consuming -> parameters require explicit <- for reusable local and projected Places regardless of copyability, accept fresh temporaries marker-free, and commit successful transfers through the shared Place ownership path
      - explicit reusable-source moves into an outer call remain uncommitted until every argument is valid; failure of a later argument preserves earlier local and projected caller ownership
      - closure capture AST and parser distinguish plain copy capture from explicit <- move capture, reject legacy -> capture syntax, reject implicit move-only copy capture, consume copyable and move-only outer Places explicitly, and analyze the resulting environment binding with independent availability
