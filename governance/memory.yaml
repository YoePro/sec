  - id: lowering.destruction
    area: sec-mlir-llvm-destruction
    status: partial
    integrated: "2026-08-28"
    document_revision: "2.0"
    repository_baseline: 069c111
    rules:
      - rules/memory/destruction.md
      - rules/control-flow/defer.md
      - rules/memory/ownership.md
      - rules/mlir/sec_mlir.md
    code: []
    tests:
      - testdata/ir
    implemented:
      - MLIR currently emits multiple statically represented deferred blocks in reverse registration order and has selected cleanup-adjacent return/error behavior.
      - Existing SEC MLIR packages lower broad control-flow, Result/Option/union/struct, and typed-error semantics, providing infrastructure for explicit destruction lowering.
    remaining:
      - lower one unified cleanup plan containing defer and automatic destruction across ordinary return, error propagation, branches, loops, break, continue, and invocation exit
      - preserve earliest legal destruction for unrelated locals while extending values retained by defer/borrows
      - lower partial aggregate destruction and active variant destruction without touching moved/discarded payloads
      - lower conditional destruction using static control-flow facts first and hidden runtime state only when permitted/required
      - lower custom free before remaining owned-field destruction and representation deallocation
      - lower construction-failure cleanup for only successfully initialized obligations
      - lower conditional replacement/reinitialization with exact old-value cleanup
      - preserve allocator/deallocator and foreign release pairing
      - integrate owning interface/generic destruction specialization
      - integrate target-supported static destruction through ProgramShutdownPlan rather than a hidden registry
      - by LLVM translation, make every cleanup branch/call explicit and remove all unresolved Sec destruction decisions
      - ensure LLVM optimization cannot infer, duplicate, omit, or reorder source-observable destruction
    required_tests:
      - unified defer/automatic cleanup order survives MLIR and LLVM lowering
      - move/discard eliminates former-owner destroy in lowered IR
      - conditional destruction executes on exactly the runtime paths still owning the value
      - strict target policy rejects required hidden ownership flag before backend codegen
      - custom free executes before remaining field destruction
      - fallible construction rollback destroys only successful prior acquisitions
      - return try and bodyless try cleanup preserve transferred payload
      - break/continue loop cleanup does not destroy loop-carried values
      - volatile snapshot cleanup does not emit a hardware access
      - LLVM contains no unresolved semantic destroy-placement decision

  - id: target-policy.destruction
    area: target-runtime-static-ownership-destruction-policy
    status: planned
    integrated: "2026-08-28"
    document_revision: "2.0"
    repository_baseline: 069c111
    rules:
      - rules/memory/destruction.md
      - rules/memory/ownership.md
      - rules/compiler/initialization.md
      - rules/platform/volatile.md
    remaining:
      - provide a project/target compilation policy that rejects code requiring dynamic ownership/destruction bookkeeping when deterministic runtime-free ownership is required
      - resolve conditional ownership statically whenever control-flow facts suffice before considering hidden flags
      - permit explicit discard convergence to normalize conditional ownership before replacement/cleanup-sensitive operations
      - integrate static/global owned destruction only when TargetProfile and ProgramShutdownPlan support deterministic teardown
      - avoid hidden global destruction registries in runtime-free/freestanding profiles
      - respect ISR/execution-context restrictions once the canonical ISR rulebook defines permitted cleanup/effect behavior
      - respect future physical-addressing/register contracts without treating scope exit as device/reset/register-clear semantics
    required_tests:
      - runtime-free target accepts statically resolvable partial/conditional ownership without hidden flag
      - runtime-free target rejects ownership state that genuinely requires forbidden runtime bookkeeping
      - explicit discard convergence makes a previously rejected conditional replacement statically resolvable where applicable
      - target lacking static teardown rejects unsupported global owned destruction
      - target with supported ProgramShutdownPlan lowers deterministic static destruction in dependency-constrained order

