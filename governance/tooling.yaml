    integrated: "2026-08-28"
    document_revision: "2.0"
    repository_baseline: 069c111
    rules:
      - rules/memory/copy_move.md
      - rules/tooling/formatter.md
      - rules/tooling/lsp.md
      - rules/tooling/diagnostics.md
      - rules/analysis/escape_analysis.md
    implemented:
      - Formatter preserves established :<- and <- move operators.
      - LSP exposes initial move-related semantic facts and selected S1007 quick fixes.
      - Frontend already reports several move/copy safety errors with related source locations.
      - Ordinary by-value calls with non-copyable or unproven-copy reusable arguments explain the copy contract and recommend API redesign to ref/ref mut, a suitable slice/view, or an explicitly consuming parameter with a marked caller. They retain S1007 and compiler-owned source/API links, and LSP does not turn this advice into an automatic ownership edit.
      - S1007 explains missing explicit transfer to consuming parameters and owning struct/union/Option/Result payloads, suggests the source-specific <- marker, and links API ownership contracts and source ownership origins. Local Ok/Err payloads use the shared construction validation; invalid inferred and named-union construction does not commit a source move or cascade use-after-move diagnostics.
      - Use-after-ownership diagnostics explain the affected value, earlier ownership-ending action and why the later use cannot access an owned value. Canonical definite, partial and conditional state drives repair guidance and source links; Result.Ok()/Err() retain projection-specific inspection advice and the registered S1088 identity. CLI and LSP share these facts without automatic ownership repairs.
    remaining:
      - format and expose explicit consuming argument/payload syntax everywhere, capture(<-value), and optional return <-value
      - integrate reverse escape/parameter-usage advice for large valid copies without turning performance advice into ownership errors
      - surface copy classification, operation at cursor, move origin, destination, availability, consuming parameter, partial aggregate state, and consequence preview
      - make automatic <- fixes conditional on proof that later source uses and borrow/destruction rules remain valid
    required_tests:
      - "formatter round-trips Consume(<-resource), Field: <-resource, Some(<-resource), capture(<-value), and return <-value"
      - LSP marks a -> parameter and the corresponding <- call argument as one ownership transfer
      - diagnostic for Consume(resource) explains that the callee takes ownership and suggests Consume(<-resource)
      - diagnostic for ordinary by-value move-only argument explains that the parameter copies and suggests ref/slice/view or API redesign
      - large-copy advisory references known size/use facts and never changes program validity
      - use-after-Result.Ok()/Err() diagnostic identifies the consuming projection call
    verification:
      - command: go test ./internal/sema ./cmd/compiler ./cmd/lsp -count=1
