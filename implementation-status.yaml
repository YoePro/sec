      - must-closed intersection over all continuing branch paths
      - loop-header close-state intersection over entry, fallthrough, and continue edges
      - separate break and continue close-state snapshots
      - zero-iteration preservation for ordinary for and while loops
      - while-true post-state derived from reachable break exits
      - reassignment reopening a resource on a loop edge
      - removal of iteration-local resource state from recorded loop edges
