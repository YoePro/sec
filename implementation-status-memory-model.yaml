baseline_confirmed:
- Current memory_model.md is already the canonical abstract memory model and explicitly replaces the former legacy text rulebook.
- It embeds a large Current implementation status and migration appendix that are implementation governance rather than normative
  memory semantics.
- Current rules already define Places/subplaces/place paths, overlap/disjointness, value/storage distinctions, ownership/copy/move/borrow/reference/lifetime/allocation/destruction,
  memory spaces, volatile/fixed-address, and Semantic IR requirements.
- Current implementation is partial and still uses legacy storage-origin/root-symbol approximations in several analyses.
