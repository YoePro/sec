    summary: >-
      Tracks ownership revision 2.0. The existing frontend has structured Place
      identity, explicit declaration/assignment moves, direct move provenance,
      selected field-sensitive partial availability, borrow checks, recursive
      copy and destruction classification, and delayed outer-call transfer
      commit. Correction 30 clarifies that negative availability refinement must
      preserve partial/conditional masks, explicit outer-call moves require
      Place-sensitive pending reservations, and runtime ownership state may be
      required by any ownership-dependent operation. The frontend does not yet
      implement the revision-2 canonical Availability
      dimension, explicit reusable-source moves in every owning payload,
      new closure move capture syntax, availability tests/refinement, discard
      convergence, conditional cleanup/replacement, or static-ownership policy.
