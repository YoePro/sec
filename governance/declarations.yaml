      - local variables, loop bindings, pattern bindings, and lambda parameters that hide a visible generic parameter, a same-module source type, or an accessible free function report mandatory S1057 names.local-shadows-declaration with the hidden declaration's location; the binding is still declared to avoid cascades, and unit names are exempt because unit symbols occupy their own namespace
