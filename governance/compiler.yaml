  - id: compiler.incremental-compilation-v1
    area: compiler-incremental-compilation-and-cache-validity
    status: planned
    integrated: null
    document_revision: "1.0"
    repository_baseline: main-reviewed-2026-09-27
    summary: >-
      Implements the canonical Sec 0.1 incremental-compilation correctness
      model: logically consistent snapshots, dependency/fingerprint validity,
      fail-closed reuse, set-valued and negative invalidation, transactional
      publication, persistent/shared cache integrity, ModuleSurface-aware
      downstream invalidation, source/provenance separation, plan-specific
      lowering and artifact reuse, history independence, and
      cold-versus-incremental conformance. Incremental state is compiler
      acceleration state and never becomes Sec source semantics.
    rules:
