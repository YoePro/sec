  - id: frontend.arena-value-traits-and-domain-identity
    area: frontend-arena-semantics
    status: implemented
    audited: '2026-08-20'
    repository_baseline: c515862
    primary_rule: rules/memory/arena.md
    rulebook_status: canonical Sec 0.1 Arena rulebook
    explicit_document_revision: null
    summary: The Arena frontend preserves the canonical owner traits and domain identity. Arena is MoveOnly and
      non-trivially destructible, aggregates derive those traits compositionally, and owner moves preserve a stable
      ArenaDomain ID used by Reset/Release epoch validation while diagnostics retain source-friendly owner names.
    rules:
    - rules/memory/arena.md
    - rules/memory/copy_move.md
    - rules/memory/ownership.md
    - rules/memory/destruction.md
    - rules/memory/reference_model.md
    code:
    - internal/sema/types.go
    - internal/sema/analyzer.go
    tests:
    - internal/sema/allocation_test.go
    - internal/sema/lifetime_test.go
    - internal/sema/analyzer_test.go
    - internal/sema/copy_move_test.go
    - internal/sema/destruction_test.go
    implemented:
    - compiler-known Arena type exists
    - Arena New and Alloc return Arena-origin reference metadata
    - Arena Reset and Release update a represented generation state
    - stale-generation checks compare reference generation to current represented generation
    - Release marks the current lexical Arena owner consumed
    - generic ownership infrastructure can mark values requiring ownership transfer unavailable
    - Arena is MoveOnly and non-trivially destructible
    - containing aggregates derive Arena ownership/destruction traits compositionally
    - Arena creation assigns stable semantic ArenaDomain identity
    - owner moves preserve ArenaDomain identity and epoch state
    - diagnostics keep source display names separate from semantic domain identity
      to the destination
    - Reset through a moved-to owner can therefore fail to stale references created through the moved-from owner
    remaining:
    - make Arena explicitly MoveOnly in compiler-owned type traits
    - make Arena explicitly non-trivially destructible
    - derive containing aggregate copy/destruction traits correctly from Arena
    - introduce stable ArenaDomainID separate from lexical owner names
    - assign ArenaDomainID at all Arena creation sites
    - carry ArenaDomainID and current epoch through Arena ownership moves
    - key epoch validity by ArenaDomainID rather than source variable name
    - keep diagnostic naming/source provenance separate from semantic identity
    - update stale-reference validation to consume domain/epoch identity
    - add owner-move/Reset/Release regression coverage
    - add correction25 traceability comments to touched Arena/type-trait functions
    bug_reference:
    - correction29.md
    governance_reconciliation:
    - Keep analysis.arena-allocation partial, but explicitly record that Arena builtin copy/destruction traits are
      currently incorrect rather than only saying "complete ownership" remains.
    - Qualify "semantic arena name and generation metadata" as the current lexical-name-based mechanism, not stable
      canonical ArenaDomain identity.
    - Qualify stale-generation rejection as valid only within the represented identity/control-flow subset until corrections
      18, 25, 28, and 29 are implemented.

  - id: frontend.arena-borrowed-backing-lifetime
    area: frontend-arena-borrowing
    status: partial
    audited: '2026-08-20'
    repository_baseline: c515862
    primary_rule: rules/memory/arena.md
    summary: Arena.FromBuffer retains its supplied mutable backing Place as an exclusive borrow owned by the resulting
      Arena. The holder and ArenaDomain identity transfer across owner moves, Reset retains the backing borrow, Release
      ends it, and direct conflicting backing access is rejected. Escape, task, nested-Arena, and implicit-destruction
      integration remains partial.
    rules:
    - rules/memory/arena.md
    - rules/memory/borrowing.md
    - rules/memory/lifetime_analysis.md
    - rules/memory/reference_model.md
    code:
    - internal/sema/analyzer.go
    tests:
    - internal/sema/allocation_test.go
    - internal/sema/lifetime_test.go
    - internal/sema/analyzer_test.go
    implemented:
    - Arena.FromBuffer compiler-known member recognition
    - exact ref mut byte[] argument-shape validation
    - ArenaEffectCreateBorrowed call-graph event
    - general ref mut borrow conflict checking infrastructure
    - general borrow-holder registration for direct RefExpression bindings
    - borrow-holder transfer for represented reference-returning calls
    - FromBuffer attaches the backing mutable borrow to its result holder
    - Arena owner moves transfer backing-borrow responsibility
    - Reset retains and Release ends the backing borrow
    - direct conflicting backing access is rejected while the borrowed Arena lives
    partial:
    - implicit destruction does not yet end the represented backing borrow on every path
    - return/escape, nested Arena, capture, and task transfer remain incomplete
    remaining:
    - end the borrow on implicit Arena destruction
    - enforce backing lifetime on Arena return/escape
    - integrate nested Arena parent/backing dependencies
    - add focused borrowed-backing lifetime regression tests
    - add correction25 traceability comments
    bug_reference:
    - correction29.md

