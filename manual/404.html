<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Not Found</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Arial Black', Arial, sans-serif;
  }

  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, #0d0221 0%, #241539 40%, #4a226b 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* ===== STJÄRNER ===== */
  .stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, #fff, transparent),
      radial-gradient(2px 2px at 80% 20%, #fff, transparent),
      radial-gradient(1px 1px at 50% 10%, #fff, transparent),
      radial-gradient(2px 2px at 70% 40%, #fff, transparent),
      radial-gradient(1px 1px at 30% 60%, #fff, transparent),
      radial-gradient(2px 2px at 90% 70%, #fff, transparent),
      radial-gradient(1px 1px at 10% 80%, #fff, transparent),
      radial-gradient(1px 1px at 40% 85%, #fff, transparent);
    animation: cameraShake 7s ease-in-out infinite;
  }

  /* ===== MÅNEN ===== */
  .moon {
    position: absolute;
    top: 12%;
    right: 15%;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fffde7, #f9e79f 60%, #d4ac0d);
    box-shadow: 0 0 60px 20px rgba(249, 231, 159, 0.4);
    animation: cameraShake 9s ease-in-out infinite reverse;
  }

  /* ===== BERGEN (bakgrund) ===== */
  .mountain {
    position: absolute;
    bottom: -5%;
    width: 100%;
    height: 55%;
    background:
      radial-gradient(ellipse 30% 100% at 15% 100%, #1a0b2e 99%, transparent),
      radial-gradient(ellipse 40% 85% at 45% 100%, #251540 99%, transparent),
      radial-gradient(ellipse 50% 75% at 80% 100%, #1a0b2e 99%, transparent);
    animation: cameraShake 6s ease-in-out infinite;
  }

  /* ===== BAKGRUNDSSKAKNING (berg & dal!) ===== */
  @keyframes cameraShake {
    0%   { transform: translate(0, 0) rotate(0deg); }
    8%   { transform: translate(-30px, 25px) rotate(-1.5deg); }
    15%  { transform: translate(20px, -40px) rotate(1deg); }
    22%  { transform: translate(-45px, 10px) rotate(-2deg); }
    30%  { transform: translate(15px, 55px) rotate(1.5deg); }
    38%  { transform: translate(40px, -20px) rotate(-1deg); }
    45%  { transform: translate(-25px, -60px) rotate(2.5deg); }
    52%  { transform: translate(35px, 30px) rotate(-2deg); }
    60%  { transform: translate(-50px, -15px) rotate(1.5deg); }
    68%  { transform: translate(10px, 65px) rotate(-1deg); }
    75%  { transform: translate(45px, -35px) rotate(2deg); }
    82%  { transform: translate(-20px, 20px) rotate(-1.5deg); }
    90%  { transform: translate(30px, -50px) rotate(1deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  /* ===== TEXT ===== */
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #fff;
    animation: textShake 5s ease-in-out infinite;
  }

  .content h1 {
    font-size: clamp(5rem, 20vw, 12rem);
    line-height: 1;
    background: linear-gradient(180deg, #ff6b6b, #feca57);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 25px rgba(255, 107, 107, 0.5));
  }

  .content p {
    font-size: clamp(1rem, 4vw, 2rem);
    letter-spacing: 0.5em;
    margin-top: 1rem;
    color: #f8f0ff;
  }

  .content a {
    display: inline-block;
    margin-top: 2.5rem;
    padding: 14px 36px;
    font-size: 1rem;
    font-weight: bold;
    letter-spacing: 0.15em;
    color: #241539;
    text-decoration: none;
    background: linear-gradient(90deg, #feca57, #ff6b6b);
    border-radius: 50px;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .content a:hover {
    transform: scale(1.1) rotate(-2deg);
    box-shadow: 0 0 30px rgba(254, 202, 87, 0.7);
  }

  /* Texten skakar lite åt andra hållet än bakgrunden */
  @keyframes textShake {
    0%   { transform: translate(0, 0) rotate(0deg); }
    10%  { transform: translate(12px, -18px) rotate(1deg); }
    20%  { transform: translate(-20px, 22px) rotate(-1.5deg); }
    33%  { transform: translate(18px, 10px) rotate(1.5deg); }
    46%  { transform: translate(-15px, -25px) rotate(-1deg); }
    58%  { transform: translate(25px, 15px) rotate(2deg); }
    70%  { transform: translate(-28px, -10px) rotate(-2deg); }
    82%  { transform: translate(10px, 28px) rotate(1deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  /* ===== BÄNKEN ===== */
  .track {
    position: absolute;
    bottom: 8%;
    left: -10%;
    width: 120%;
    height: 120px;
    border-top: 6px solid #feca57;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    box-shadow: 0 -20px 40px rgba(254, 202, 87, 0.2);
    animation: cameraShake 8s ease-in-out infinite;
  }

  .track::before {
    content: "";
    position: absolute;
    top: 6px;
    left: 0;
    width: 100%;
    height: 80px;
    background: repeating-linear-gradient(
      90deg,
      transparent 0px,
      transparent 55px,
      #feca57 55px,
      #feca57 62px
    );
    opacity: 0.5;
  }

  /* ===== BANTERNA på bänken ===== */
  .bars {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
      90deg,
      transparent 0px,
      transparent 55px,
      #feca57 55px,
      #feca57 62px
    );
    opacity: 0.4;
  }

  .cart {
    position: absolute;
    bottom: 105px;
    left: 50%;
    z-index: 15;
    font-size: 70px;
    line-height: 1;
    /* Kombineras: åker runt + skakar */
    animation:
      rideTheCoaster 11s linear infinite,
      cartShake 0.6s ease-in-out infinite;
    filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
  }

  /* Vagnen åker hela banan upp och ner, vänster och höger */
  @keyframes rideTheCoaster {
    0%   { left: -10%;  bottom: 105px; }
    12%  { left: 20%;   bottom: 250px; }
    25%  { left: 45%;   bottom: 450px; }  /* toppen! */
    38%  { left: 70%;   bottom: 200px; }
    50%  { left: 90%;   bottom: 350px; }  /* liten kulle */
    62%  { left: 105%;  bottom: 105px; }
    75%  { left: 80%;   bottom: 300px; }  /* åker baklänges och upp */
    88%  { left: 40%;   bottom: 500px; }  /* stor sväng! */
    96%  { left: 10%;   bottom: 250px; }
    100% { left: -10%;  bottom: 105px; }
  }

  /* Rastlös skakning på vagnen själv */
  @keyframes cartShake {
    0%   { transform: translate(0, 0) rotate(0deg); }
    25%  { transform: translate(4px, -8px) rotate(4deg); }
    50%  { transform: translate(-5px, 6px) rotate(-5deg); }
    75%  { transform: translate(6px, 4px) rotate(3deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  /* Snurrar baklänges i svängarna */
  .cart-inner {
    display: inline-block;
    animation: spin 11s linear infinite;
  }

  @keyframes spin {
    0%, 30%  { transform: rotate(0deg); }
    40%      { transform: rotate(180deg); }
    50%      { transform: rotate(360deg); }
    60%      { transform: rotate(360deg); }
    70%      { transform: rotate(540deg); }
    80%      { transform: rotate(720deg); }
    85%      { transform: rotate(720deg); }
    100%     { transform: rotate(0deg); }
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="stars"></div>
    <div class="moon"></div>
    <div class="mountain"></div>

    <div class="track"></div>

    <div class="cart">
      <span class="cart-inner">🎢</span>
    </div>

    <div class="content">
      <h1>404</h1>
      <p>PAGE NOT FOUND</p>
      <a href="/">BACK TO HOMEPAGE</a>
    </div>
  </div>
</body>
</html>
