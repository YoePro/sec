package4:
  name: First Semantic IR to Sec MLIR bridge
  requirements:
  - extend rules/sec_mlir_dialect.md before new dialect constructs
  - minimum Sec MLIR surface for Package 2/3 subset
  - module/function/source provenance import
  - scalar and named type import
  - constants
  - storage operations
  - DirectCall and ForeignCall remain distinct
  - return
  - branch
  - conditional branch
  - metadata preservation
  - generated Sec MLIR verification
  - compiler dump path
  - sec-mlir-opt round-trip tests
  must_not_yet_include:
  - non-trivial ownership
  - copy/move/destruction
  - references/borrows
  - Result/try
  - defer/cleanup
  - aggregates
  - allocation
  - register/MMIO
  - concurrency
  core_invariant: valid Package 2/3 Semantic IR -> valid verified Sec MLIR without
    AST access or Sema rerun
