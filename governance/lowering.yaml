      - "P16-36 mutable-to-shared slice call boundary (2026-10-25): selected direct calls accept ref mut T[] as ref T[] with identical nominal element type. Sema retains the argument type for exact-overload ranking and publishes a shared pass only after ordinary ownership/borrow checks. Named mutable holders lower through a full-range slice.reborrow-shared with distinct resolved borrow/lifetime; caller authority and returned shared dependencies are retained. New source-to-schema-12 tests cover 32/64 plans and all four native verifiers before/after P6. Negative tests retain call-overlap/retention, authority, element identity and storage-initialization restrictions; forged child identity emits no bytes. Generic selection is Sema evidence only, and fresh/non-holder argument adaptation retains its unsupported boundary."
