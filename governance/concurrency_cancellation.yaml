      - "Sec 0.1.1 (MD-138, rules/corrections/applied/MD-138-callable-execution-requirements-v0.1.1-correction-2026-11-24-20261124.md): a callable may declare its execution requirements with require(task|thread|cancellable); inference stays the default, function types carry the normalized requirement set and conversions require D implies S."
      - Callable/function values preserve the requirement and cannot erase it.
