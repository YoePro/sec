  - id: lowering.abi-model
    area: platform-and-lowering
    revised: "2026-10-28"
    status: planned
    integrated: "2026-08-16"
    document_revision: "1"
    summary: >-
      Adds the canonical Sec ABI model selected by each CompilationPlan,
      including Sec, C, and system calling-convention resolution, target-neutral
      parameter and return classification, aggregate/direct/indirect transport,
      MLIR-stage CallABIPlan construction and verification,
      native-versus-foreign representation boundaries, ABI signatures and
      fingerprints, and separate-compilation compatibility without duplicating
      FFI legality or source ownership semantics.
