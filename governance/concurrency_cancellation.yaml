    implemented:
      - "per-callable inferred requirements (2026-11-09): `cancel` records a cancellable-execution requirement and Task.Current()/Task.Yield() a logical-task requirement on the containing callable, lambdas included; the former lexical rejection of cancel in every named function is removed (cancellation.md §§ 19-20)"
      - "requirements propagate through synchronous and deferred call-graph edges, recursion included, and are checked from every root: ordinary program entry rejects both (scheduling.md § 22), a spawned thread rejects only the logical-task requirement, a spawned task satisfies both; spawn edges start new roots; the diagnostic lands on main's first call on the path naming the requiring callable and operation, or on the operation itself (TestExecutionContextRequirements)"
      - "test bodies run like ordinary program entry (owner decision 2026-11-09, testing.md § 9.7): every test body node is checked as an entry, so Task.Current()/Task.Yield()/cancel reached from a test without spawning are rejected (TestExecutionContextRequirementsInTests)"
      - "MD-138 parser/AST completed 2026-11-24 (grammar.md sections 27(6),32(5),73(3),101(4),101A): optional require clauses on native function declarations/signatures, function types, interface methods and lambdas. AST retains ordered contextual entries, keyword/delimiter/comma tokens, repeated invalid clauses and returned-type grouping. Right-recursive attachment and parentheses are tested; malformed empty/repeated/unknown/expression/parameterized/misplaced/unclosed clauses recover to following declarations. Foreign declarations and c::fn gain no new clause syntax, and no MLIR body syntax was enabled. Lookahead leaves following documentation comments untouched. Until the remaining semantic contract/compatibility points are implemented, source-selected explicit clauses stop at S1239 rather than silently becoming inferred/context-free callables."
      - "MD-138 formatter completed 2026-11-24 (formatter.md sections 11,16(13a),25,29): parser-owned CST requirement lists use canonical require(task, thread) spacing, preferred-width breaking and multiline trailing commas, including comment-bearing lists. Formatting retains explicit presence, ordered and implied entries, callable ownership and returned-type grouping; no inferred clause is introduced. Nested callable parameter and requirement lists are laid out using non-overlapping edits and reparsed positions. Round-trip AST attachment, idempotence, indentation widths 2/4/6 and malformed-source preservation cover T03, T08-T10 and the source-preservation part of T40; semantic identity remains its separate point."
    remaining:
      - "MD-138 canonical requirement identity (types.md § 33(7); cancellation.md § 24A(7); correction § 6(1)-(2)): normalized requirement set in Sema callable type identity, task implies cancellable, order and written-versus-inferred origin excluded; declared clauses on function types; unresolved facts never a proven empty set (T02, T40)"
      - "MD-138 explicit contract verification (cancellation.md § 24A(5)-(6)): an explicit clause on a function, method or lambda is its contract; diagnose an insufficient declaration with the first originating operation or callee; keep a stronger declaration; inference vocabulary Task.Current/Task.Yield -> task, Thread.Current -> thread, cancel -> cancellable, normalized (T11-T14, T16-T17)"
      - "MD-138 conversion compatibility (cancellation.md § 24A(7)-(8); lambda-functions.md § 11 amendment): D implies S at every callable assignment, conversion, argument, return and storage in structs, unions, collections and generic arguments, independent of callable capability and site context; reject erasure to plain fn types also for closed targets and inside tasks; overloads compare requirement identity of callable parameters only (T18-T21, T26-T27, T37)"
      - "MD-138 indirect invocation and roots (cancellation.md § 24A(6), (9)): calls through a declared callable type use its contract (replaces the open-target erasure of MD-138); transporting a callable without invoking it adds no requirement; inference does not cross closure construction; every root and fixed-contract boundary is checked, ordinary entry gets no invented task; mandatory checks independent of analysis depth and folding (T22-T25, T38-T39, T45)"
      - "MD-138 interfaces (interfaces.md § 6 amendment; cancellation.md § 24A(9)): declared member requirements, conformance compatibility, inheritance conflict comparison with normalized requirements, interface dispatch and generic-constraint calls using the declared contract (T28-T30)"
      - "MD-138 generics and monomorphization (generics.md § 28, monomorphization.md § 8.3 amendments): preserve requirement components through substitution, infer per concrete specialization, no effect variables; plain fn in generic declarations stays context-free (T15, T30)"
      - "MD-138 spawn boundaries (spawn.md §§ 8(6), 16(6), 25(3); cancellation.md § 24A(10)): validate the spawned callable's contract against the child identity per kind (task, thread incl. deferred creation, process) and creator-side argument/capture requirements against the creator; compile-time diagnostics only (T31-T36)"
      - "MD-138 Semantic IR (semantic_ir.md § 52(7); cancellation.md § 57(6); spawn.md § 26(4)): carry requirement sets on callable values and function types, invocation contracts, call-site context proofs and spawn-boundary validation; verifier rejects erasure and unsatisfied invocation; no runtime mask or hidden ABI parameter (T43)"
      - "MD-138 diagnostics (diagnostics.md § 29(7); cancellation.md § 60(5)): registered IDs for unknown/unsupported entry, empty clause, repeated entry, repeated clause, insufficient explicit contract, erasing conversion, unsatisfied invocation context and spawn-child mismatch, with originating chains and correcting help"
      - "MD-138 LSP (lsp.md § 13(3); cancellation.md § 59(8)): hover and signature help render declared and inferred requirements in clause spelling marked as inferred, completion inside a clause offers exactly task, thread and cancellable"
      - "MD-138 incremental analysis (cancellation.md § 56(11); monomorphization.md amendment): a changed requirement set is a semantic dependency change for dependents, exported signatures and caches; no stale callable type or context proof after an edit (T42); attributes stay independently checked (T44)"
    required_tests:
      - id: direct-cancel-effect
        expectation: Function containing cancel is callable only from valid cancellable execution.
      - id: transitive-cancel-effect
        expectation: Caller of cancellation-dependent helper inherits the requirement.
