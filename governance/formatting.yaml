      - cmd/lsp/main_test.go
    implemented:
      - join single-line call arguments with one space after commas
      - remove a trailing argument comma only from single-line calls
      - preserve all existing multiline call boundaries and their required trailing comma
      - leave comment-bearing and incomplete single-line syntax unchanged
      - preserve formatter idempotence and expose the behavior through the shared LSP formatter
    verification:
