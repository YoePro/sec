      - testdata/semantic_ir/dynamic_references/opaque.sec
    implemented:
      - owning dynamic arrays expose their element type to membership validation
      - membership returns bool, uses equality-compatible elements, and contextually types numeric and rune literals
      - repeated searches preserve array availability and nominal type boundaries
      - incompatible values and non-comparable element types retain operator membership diagnostic metadata and help
      - HTTP Status.IsRegistered uses the user-provided table typed as Status[] to match the named receiver
    partial:
      - "exact-once left-to-right short-circuit dynamic-array membership lowering without allocation (started 2026-11-27): scalar integer/bool/float/enum searches over bound owners, stored struct fields and reference-reached owners with canonical known provenance now consume canonical ResolvedDynamicArrayPlanOf owner/backing-domain facts. The shared bounded-size sequence CFG evaluates the needle before observing the owner, searches the initialized Len in index order with guarded dynamic-array element Places and scalar reads, exits at the first equality, returns false on an empty/absent path and complements the completed result for not in. It does not copy, move, allocate or structurally mutate the owner; subsequent owner use remains valid. Source-backed 32/64-bit IR, schema-14 emission and CLI inspection tests cover ordinary/negated/empty/effectful/scalar-family/field forms and verifier rejection of missing bounds guards/backing domains. Still partial: fresh temporary or otherwise unrepresented owner expressions, opaque-reference owners without canonical backing-domain facts, and string/decimal/named-wrapper/aggregate element equality; these retain named unsupported boundaries. Executable dynamic-array lowering and execution tests remain separate existing remaining points. No checklist subdivision. Reference-reached observations now reuse canonical reference validation/dereference, authority and field projection for membership, Len, IsEmpty and guarded element read/write; no owner copy or invented referent identity. Source-backed 32/64-bit IR and deterministic schema-14 tests cover shared/mutable/nested fields, owner reuse and opaque-reference rejection."
    remaining:
      - dynamic array representation, construction, ownership and destruction in the compilation track
      - backend execution tests for empty arrays, first match, no match, operand effects and non-consuming search
    verification:
      - command: go test -race -p 4 ./internal/ir/semantic ./internal/lowering/secmlir -run 'DynamicArray|Membership' -count=1 -timeout=90s
        result: "Passed 2026-11-27 (2.031s/1.401s); vet passed both implementation packages. Governance check: 0 problems in 47 fragments; 23 owner path references present. Existing single partial point advanced without count changes: sema Remaining 15, Partial 19; compiler Remaining 1942."
      - command: go test -short -p 4 ./internal/ir/semantic ./internal/lowering/secmlir ./internal/traceability -count=1 -timeout=150s
        result: Passed 2026-11-27 (8.937s/2.044s/0.300s). Reference-reached dynamic owners with known provenance retain canonical validity, shared/mutable authority, guarded index and backing facts; 32/64-bit IR and schema-14 emission pass. Opaque membership remains explicitly unsupported; no physical/native execution claimed.
      - command: go test -p 4 ./cmd/compiler -run ^TestDynamicArrayMembershipCLI$ -count=1 -timeout=90s
        result: Passed 2026-11-27 (0.039s); check and emit-ir with isolated builtin-only source workspaces on linux-amd64 and linux-armv7. No native dynamic-array execution or external MLIR verifier run claimed.
      - command: go test -race -p 4 ./internal/ir/semantic ./internal/lowering/secmlir -run 'Membership|DynamicArray|Package18Nesting' -count=1 -timeout=90s
        result: Passed 2026-11-27 (1.796s/1.332s); new dynamic scalar search plus existing fixed-array/slice membership and dynamic-array regressions. Vet passed implementation packages and cmd/compiler.
      - command: go test -short -p 4 ./internal/ir/semantic ./internal/lowering/secmlir ./internal/traceability -count=1 -timeout=150s
        result: Passed 2026-11-27 (9.923s/2.264s/0.363s). Dynamic membership uses one guarded element-read site and runtime Len; source owner reuse and float equality semantics retained; incomplete guards/domains fail verification. Existing P18 boundary test now names the still-unsupported string equality family.
      - command: go test ./...
        result: passed
      - command: sema over the dynamic membership fixtures
        result: valid cases accepted; incompatible elements rejected
      - command: emit-ir testdata/sema/dynamic_membership_lowering_deferred.sec
        result: explicit unsupported array type uint[] error; no executable support claimed

  - id: frontend.negated-membership
    area: frontend-and-lowering
    status: partial
    integrated: "2026-09-11"
    summary: >-
      Accepts contextual not in as the boolean complement of membership without
      reserving not as a keyword. Parser, Sema and LSP share the canonical AST
      operator; lowering in the single compilation track is pending (the removed
      legacy range backends negated one membership search; MD-101).
    rules:
      - rules/foundations/lexical_structure.md
      - rules/foundations/grammar.md
      - rules/foundations/operators.md
    code:
      - internal/parser/expression.go
      - internal/sema/analyzer.go
