    implemented:
      - completed Package 13 predecessor with schema-9 structs and high-level aggregate storage
      - canonical fixed-array literal spread wording synchronized in collections and spread rulebooks
      - fixed-index failure synchronized to the concrete error IndexError.OutOfBounds
      - schema-v10 dialect, lowering-v10, and fixed-array Semantic IR rulebooks installed
      - existing parser and AST support for postfix fixed-array types, literals, spreads, and index expressions
      - existing Sema support for selected fixed-array inference, compact checked spread length accounting, constant bounds diagnostics, defaults, copy/destruction classification, Places, iteration, and call spread
      - existing legacy physical MLIR fixed-array iteration retained as a compatibility path and explicitly excluded as P14 semantic authority
      - absolute SEC_MLIR_BIN resolution shared by Package 13 and Package 14 acceptance tests
      - green pre-P14 repository gates for Go, vet, and all 78 Sec MLIR tests
      - explicit fixed/dynamic Sema array shape with immutable exact decimal fixed length and defensive big.Int access
      - AST length expressions retained as authority with int64 populated only as a checked compatibility cache
      - exact array type identity, display, generic matching, equality, bounds/slice checks, and target-shaped diagnostics
      - shape-aware defaults, copy/destruction, membership, Place, compiler-known members, call spread, escape snapshots, and LSP type presentation
      - compact arbitrary-precision array-literal spread accounting and exact compact fixed-array defaults with bounded legacy expansion
      - zero-length fixed-array defaults without inspecting or constructing an element default
      - independent 32-bit and 64-bit target-uint validation of one resolved array fact
      - explicit unsupported diagnostic at the legacy LLVM-array layout boundary for lengths outside int64
      - Package 14 section-90 frontend length and target-plan regression matrix
      - immutable compact ResolvedArrayLiteralPlan data model with exact per-source-entry lengths, Sema-owned defensive copies, and a read-only query that performs no inference, expansion, or analyzer mutation
      - authoritative array-literal analysis publishes source-ordered plans for inferred, target-shaped, spread-containing, and target-required empty fixed-array literals while result typing consumes the same plan
      - multiple fixed-array literal spreads retain distinct source indices, exact big.Int contribution lengths, runtime/mismatch rejection, and O(source entries) plans for conceptual lengths above host int64
      - array-literal transfer actions derive from compiler-owned copy classification; P14 admits construct-direct/copy-trivial and explicitly rejects semantic-copy, move, and borrow actions at the Semantic IR boundary
      - complete section-91/93 compact default matrix for scalar, wide, struct, nested, zero-length non-defaultable, positive non-defaultable, and huge fixed arrays
      - source-to-Semantic-IR compact array.default lowering with exact lengths, no undef/poison substitute, and package-tagged rejection without a partial module for deferred non-trivial ownership
      - complete Package 14 Semantic IR value-layer printer/verifier matrix for empty, scalar-wide, nested, struct, enum, compact huge, exact segment-sum, default, length, bounds, projection, replacement, guard, and failure operations
      - source-built ordinary fixed-array reads consume ResolvedArrayIndexPlan facts, preserve array-before-index exactly-once evaluation, and emit either proof-carrying extraction or one guarded runtime bounds CFG
      - runtime ordinary indexing preserves signed int128, unsigned uint128, target uint, and zero-length semantics and terminates failure in fixed-array-index fail.bounds
      - compiler-owned effect summaries record direct and transitive may-panic-bounds for runtime ordinary indexes while constant/range-proven indexes contribute no bounds panic
      - compact Sema array-literal plans lower source-order element/spread entries directly to one array.construct segment each without expansion
      - P5 high-level storage admits recursively trivial fixed arrays and lowers explicit, defaulted, spread-containing, and nested mutable locals through storage declare/init/load without selecting MemRef or LLVM array layout
      - non-trivial fixed-array literal and storage boundaries return Package 14 UnsupportedFeatureError without a partial module, placeholder, undef, or poison
      - simple-root mutable local indexed assignment lowers transactionally for proven-safe and runtime-checked plans with bounds-before-RHS ordering, exact guard SSA reuse, proof provenance, one RHS evaluation, one array.replace, and one root storage.store
      - nested fixed-array and stored-struct assignment paths evaluate root/index projections once, guard root-to-leaf, rebuild with array.replace and struct.replace-field leaf-to-root, and commit exactly one root store after the RHS completes
      - Package 14 section-99 replacement matrix covers scalar and int128 elements, runtime guards, two-dimensional arrays, struct-in-array, array-in-struct, RHS ordering, one store, high-level storage, and non-trivial rejection
      - schema-10 !sec.array<T, "N"> is registered as a high-level ODS/C++ type with exact canonical decimal StringAttr identity, arbitrary-precision lengths, nested arrays and struct elements, and no physical layout selection
      - the !sec.array verifier rejects empty, signed, whitespace-padded, and unnecessarily zero-prefixed lengths plus storage/function element types while accepting canonical zero and lengths above uint64
      - schema-10 sec.array.construct preserves one operand per source segment and verifies exact kind/length/action arrays, element and spread types, canonical arbitrary-precision lengths, spread-length identity, and an overflow-free exact sum equal to the result length
      - try fixed-array indexing publishes distinct bounds-propagation and handled-bounds Sema facts, converts runtime failure to IndexError.OutOfBounds, and removes the index check's MayBoundsPanic effect
      - source-built fallible bounds CFG evaluates array/index once, shares one guard with extraction, emits typed Result.err propagation or local enum handler flow, and contains no fail.bounds endpoint
      - validated fallible bounds flow removes only its own MayBoundsPanic site while preserving transitive panic effects from array/index operands and handler bodies; invalid try constructs retain the ordinary bounds effect
      - unsafe blocks do not bypass fixed-array runtime bounds checks or their MayBoundsPanic effect
      - argument-free @noPanic is parsed on functions and methods and verified against transitive callable panic summaries with a cause chain and introducing source location
      - "@noPanic accepts proven-safe and otherwise panic-free fallible fixed-array indexing while rejecting ordinary dynamic indexing, panic-capable operands, and unsafe-block attempts to bypass the guarantee"
      - the standalone compiler-owned IndexError fallback converges with the trusted sec/core declaration while ordinary source redeclaration remains rejected
      - Semantic IR TypeArray keyed by element TypeID plus canonical exact decimal length, with deterministic interning, formatting, and verifier diagnostics
      - Semantic IR builder admits fixed-array function parameter and return types at Package 14, keeps dynamic array types gated as UnsupportedFeatureError, and does not introduce array operations before P14-29
      - Semantic IR array.construct, array.default, and array.len operation records with compact segment metadata, exact length strings, P14 action gating, formatter output, and verifier checks
      - Semantic IR array.index-in-bounds, array.extract, and array.replace records preserving source index signedness, explicit proof/check metadata, and trivial ownership boundaries
      - fixed-array runtime projection verification requires a named dominating guard for the same array/index SSA pair and rejects any projection reachable from the guard's false edge
      - terminating Semantic IR fail.bounds endpoint for ordinary indexing plus explicit core::IndexError.OutOfBounds and Result.err validation for fallible bounds paths
      - immutable read-only ResolvedArrayIndexPlan facts preserve exact array length, array/element/index types, signedness, use/action, proof/check kind, failure mode, and runtime IndexError typing without downstream AST reconstruction
      - arbitrary-precision constant index plans cover valid uint256 values above host int64 and exact negative, at-length, and above-length rejection; remaining indexes preserve their signed or unsigned source type as runtime-checked
      - named integer ranges wholly contained in 0..<N produce explicit range-proven index plans while zero-length arrays remain runtime-checked unless rejected as an invalid constant
      - dominating branch and assertion conditions publish explicit branch or analysis index-proof provenance; inline range contracts retain contract provenance, binding identity prevents textual shadowing, and intervening assignments invalidate value proofs conservatively
      - source-built branch-proven extraction consumes the Sema proof in verified Semantic IR without array.index-in-bounds or fail.bounds while incomplete, disjunctive, out-of-scope, mutated, and zero-length cases remain runtime-checked
      - Package 14 source-builder unsupported boundary for non-trivial array literals returns UnsupportedFeatureError without returning a partial module or placeholder operation
      - Package 6 scalar-layout resolution recursively converts target-sized int/uint through fixed-array elements, nested arrays, type arguments, and surrounding P13 struct fields while preserving exact lengths, nominal identities, field tags, and high-level array operations on both 32-bit and 64-bit plans
      - Package 8 checked-integer lowering normalizes ordinary scalar operations to signless Arith without recursing through fixed-array wrappers or lowering zero-length, spread, or nested sec.array.construct operations
      - Package 13 integration preserves exact nominal struct identities for struct-in-array and array-in-struct values, including int128/uint256 fields, compact recursive defaults, guarded nested replacement, leaf-to-root rebuild, and one root commit
      - Package 11/12 integration admits copy-trivial fixed arrays as union payloads and match values while retaining ordinary union-variant patterns, copy-trivial transfer, compact fallback construction, and the existing matching-variant projection guard
      - schema-10 sec.array.default, sec.array.len, sec.array.index_in_bounds, sec.array.extract, sec.array.replace, and terminating sec.fail.bounds operations with exact local type, signedness, bounds-metadata, action, and result-identity verifiers
      - sec-verify-array-index-guards enforces same-array/index SSA identity, immediate single-use predicate branching, dedicated true-edge dominance, and closed proven-safe provenance for schema-10 extraction and replacement
      - generated high-level modules use schema 10 while schemas 1 through 9 remain accepted regression inputs and schema 11 remains rejected
      - Go schema-10 emission preserves exact nested array types, compact ordered construction segments and actions, defaults, length, source-typed bounds predicates, proof metadata, guarded extraction/replacement, bounds failure, locations, and high-level storage
      - schema-10 emission independently rejects nested fixed-array lengths that overflow the selected 32-bit or 64-bit target uint without host-width conversion
      - the complete Package 14 section-100/101 dialect matrix covers canonical and invalid array types, compact construction, every array operation, guard dominance and SSA identity, proven provenance, and schema-9 compatibility
      - compiler-known fixed-array Len lowers from its resolved Sema receiver fact to compact foldable ArrayLengthOp with exact decimal length
      - one unedited source fixture covers every section-102 case through parsing, target-aware Sema, verified Semantic IR, and deterministic schema-10 emission
      - the complete source-built section-102 module passes the absolute sec-mlir-opt guard-verification and scalar-layout pipeline on 32-bit and 64-bit CompilationPlans while preserving high-level arrays and introducing no unresolved cast, physical array layout, runtime helper, or LLVM dialect
      - Package 6 scalar-layout conversion covers every schema-10 fixed-array operation, including default, length, bounds predicate, extraction, and replacement rather than only construction
      - Package 14 explicitly rejects deferred move-only spread/read, indexed move-out, element borrow, non-trivial replacement/destruction, dynamic-array, slice, and array-to-slice source paths without returning partial Semantic IR
      - the fixed-array spread action adapter admits only copy-trivial and explicitly rejects semantic-copy, move, shared-borrow, and mutable-borrow actions; semantic-copy is tested at this immutable boundary because no current source type resolves to CopySemantic
      - ordinary indexed return of a non-copyable element is rejected by canonical Sema ownership diagnostics and published by the LSP for both direct and Result-wrapped terminal returns, while language-valid P14 lowering boundaries remain free of false frontend errors
      - source-valid fixed-array equality, inequality, and membership receive explicit Package 14 Semantic IR boundary errors without partial modules instead of falling through a generic unsupported-operator path
      - schema-10 emission explicitly rejects verified foreign fixed-array parameter/result ABI and physical LayoutRef requests on array-containing structs or unions without computing layout
      - successful source-built Package 14 modules prove exact full construction coverage and compact defaults, and contain no unreadable placeholder, hidden allocation, physical array layout, hard-coded signless i64 array index, trap, runtime symbol, mandatory helper call, or LLVM dialect on either 32-bit or 64-bit plans
      - repeated fresh source builds prove canonical decimal lengths, lexicographic source metadata, source-declaration function order, nested type printing, compact spread segment order, stable diagnostics, and byte-identical per-plan 32/64 schema output independent of build and target-validation order
      - all 56 Package 14 section-107 acceptance criteria are mapped individually to named focused tests or exact implementation and rule locations without promoting the still-partial package from aggregate suite success
      - the complete sections-95-through-98 indexing matrix covers exact constant widths and failures, proof provenance, signed/unsigned runtime boundaries and SSA guard reuse, fallible int32/int128 propagation, exact and catch-all handlers, effects, noPanic, and absence of partial or fallible fail.bounds IR
