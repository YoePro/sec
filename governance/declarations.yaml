  - id: frontend.struct-field-tags
    area: frontend-struct-parser-and-metadata
    status: implemented
    audited: "2026-08-27"
    repository_baseline: c515862
    document_revision: "2.0"
    document_created: "2026-08-13"
    document_last_updated: "2026-08-13"
    summary: Supplements frontend.structs with quote-aware field-tag parsing. The parser now scans key/value entries left-to-right, recognizes separators only outside quoted values, preserves whitespace and escape spelling, rejects malformed quote structure, and recovers at the current field comma. AST and Sema retain ordered open-key metadata. Section 4 supplies the normative raw-escape behavior where the compiler preserves escape spelling while recognizing the structural quote. The existing generic-specialization, Semantic IR, and Sec-MLIR paths preserve the resulting ordered metadata and now have regression coverage. Sema exposes immutable field metadata and LSP field hover consumes it without decoding values or assigning built-in meaning to open tag keys.
    rules:
      - rules/declarations/struct.md
      - rules/foundations/grammar.md
    code:
      - internal/parser/parser.go
      - internal/ast/ast.go
      - internal/sema/analyzer.go
      - internal/sema/types.go
      - internal/sema/semantic_facts.go
      - internal/ir/semantic/builder.go
      - internal/lowering/secmlir/emitter.go
      - cmd/lsp/main.go
    tests:
      - internal/parser/parser_test.go
      - internal/sema/analyzer_test.go
      - internal/sema/semantic_facts_test.go
      - internal/ir/semantic/package13_test.go
      - internal/lowering/secmlir/emitter_test.go
      - cmd/lsp/main_test.go
    implemented:
      - optional raw-string tag token recognized after a stored field type
      - multiple simple whitespace-separated key/value entries represented in AST
      - open key names with no compiler hard-coded consumer allowlist
      - tag key/value metadata copied from AST into semantic StructField metadata
      - generic struct specialization preserves StructField metadata while substituting field types
      - quote-aware key:"value" scanning without strings.Fields or destructive quote trimming
      - whitespace and empty content inside quoted values are preserved
      - malformed internal and unterminated quote structure is rejected
      - escape spelling is preserved while escaped quotes do not terminate the value
      - malformed tags recover at the current field comma and retain later fields
      - canonical raw escape semantics are consumed exactly as section 4 specifies; escapes remain metadata and are not decoded or normalized by the compiler
      - generic specialization, Semantic IR construction, and Sec-MLIR schema-v9 lowering preserve ordered tag metadata
      - resolved stored-field member facts expose ordered tag metadata through an immutable snapshot
      - declaration-oriented consumers can query immutable ResolvedStructFieldMetadata by semantic definition identity
      - LSP field hover displays compiler-resolved open-key metadata while retaining raw escapes, whitespace, and order
    verification:
      - command: go test ./internal/parser -run StructFieldTag -count=1
        result: passed
      - command: go test ./internal/sema -run GenericStructAndFunctionHeaders -count=1
        result: passed
      - command: go test ./internal/sema -run ResolvedStructPlansPreserveSourceOrderOverridesDefaultsAndMembers -count=1
        result: passed
      - command: go test ./internal/ir/semantic -run Package13BuildsEmptyAndConcreteGenericWideStructs -count=1
        result: passed
      - command: go test ./internal/lowering/secmlir -run EmitPackage13StructsEndToEnd -count=1
        result: passed
      - command: go test ./cmd/lsp -run StructFieldHoverPreservesOpenTagMetadata -count=1
        result: passed
    bug_reference:
      - correction16.md
    governance_reconciliation:
      - The correction16 quote-aware parsing and recovery requirements, together with the later canonical escape semantics in struct.md section 4, are now covered through parser, Sema, Semantic IR, and Sec-MLIR lowering.
      - struct.md requires metadata preservation for consumers but does not define built-in meanings for tag keys; package 13 sections 12.2 and 70 explicitly keep reflection and serialization behavior out of scope while requiring the metadata bridge now implemented and exposed to tooling.
    required_tests:
      - simple tag entry accepted
      - multiple simple tag entries accepted
      - custom key accepted
      - empty quoted tag value accepted
      - quoted tag value containing whitespace accepted
      - malformed internal quote structure rejected
      - unterminated quoted value rejected
      - tag source order preserved
      - malformed first-field tag still permits parsing later valid fields
      - malformed middle-field tag recovers at field boundary
      - generic specialization preserves ordered field tags
      - resolved member tag facts are immutable snapshots
      - declaration field-metadata facts are immutable snapshots
      - Semantic IR preserves field tags on concrete generic structs
      - Sec-MLIR emission preserves raw escapes, whitespace, and tag order
      - LSP field hover exposes resolved open-key metadata without decoding values

