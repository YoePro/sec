schema_version: 1
purpose: >-
  Canonical ledger for incoming, open, and fixed implementation bug reports.
  Report files live in open/ until a fix has validation evidence, then move to
  fixed/ while their ledger entry remains here.
status_values:
  open: Report received or triaged; no verified fix is recorded.
  fixed: Fix and appropriate validation evidence are recorded; report moved to fixed/.
reports:
  - id: BUG-000001
    source_id: NSV-01
    title: Contextual set example declares conflicting names in one scope
    status: open
    severity: medium
    kind: normative-self-contradiction
    reported: "2026-10-27"
    report: open/sec_names_scopes_visibility_audit_2026-10-27.md
    area: frontend-names-scopes-visibility
    rulebooks:
      - rules/foundations/names_scopes_visibility.md
      - rules/foundations/lexical_structure.md
    governance:
      - frontend.names-scopes-visibility
      - frontend.lexical-structure
    evidence: >-
      Confirmed by static audit: the contextual set example is marked valid
      while declaring both a variable and a function named set in one scope,
      contrary to the one-namespace-per-scope rule.

  - id: BUG-000002
    source_id: NSV-02
    title: Names and scopes implementation-status section contradicts set rules
    status: open
    severity: medium
    kind: rulebook-governance-consistency
    reported: "2026-10-27"
    report: open/sec_names_scopes_visibility_audit_2026-10-27.md
    area: frontend-names-scopes-visibility
    rulebooks:
      - rules/foundations/names_scopes_visibility.md
      - rules/foundations/lexical_structure.md
    governance:
      - frontend.names-scopes-visibility
      - frontend.lexical-structure
    evidence: >-
      Confirmed by static audit: section 23 says contextual set parsing must
      not allow set declarations, while the active rules explicitly allow the
      contextual identifier; the section also leaves implemented work stale.

  - id: BUG-000003
    source_id: NSV-03
    title: Module-level variables leak through a shared analyzer symbol table
    status: open
    severity: high
    kind: implementation-bug
    reported: "2026-10-27"
    report: open/sec_names_scopes_visibility_audit_2026-10-27.md
    area: frontend-names-scopes-visibility
    rulebooks:
      - rules/foundations/names_scopes_visibility.md
    governance:
      - frontend.names-scopes-visibility
    existing_tracking: >-
      Already tracked as the remaining module-variable scoping defect in
      frontend.names-scopes-visibility; this report must not create another
      governance integration.
    evidence: >-
      Static audit identifies a module-qualified namespace check alongside a
      shared name-only symbol table, which can cause false duplicate errors or
      incorrect cross-module name resolution. No fresh local reproduction was
      run by the audit.

  - id: BUG-000004
    source_id: NSV-04
    title: Contextual set regression test permits unrelated parameter shadowing
    status: open
    severity: low
    kind: regression-test-quality
    reported: "2026-10-27"
    report: open/sec_names_scopes_visibility_audit_2026-10-27.md
    area: frontend-names-scopes-visibility
    rulebooks:
      - rules/foundations/names_scopes_visibility.md
      - rules/foundations/lexical_structure.md
    governance:
      - frontend.names-scopes-visibility
      - frontend.lexical-structure
    evidence: >-
      Confirmed by static audit: the test checks only that the reserved-name
      diagnostic is absent even though its fixture introduces a local binding
      that shadows a parameter, so an unrelated analysis error can be hidden.

  - id: BUG-000005
    source_id: NSV-05
    title: Lexical structure rulebook refers to retired implementation ledger
    status: open
    severity: low
    kind: rulebook-governance-consistency
    reported: "2026-10-27"
