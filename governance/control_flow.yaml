        result: passed on 2026-10-29; source-backed advisory identity, policy, keyword ranges and help checks; CLI 6.334s and LSP 7.115s
      - command: go test ./internal/sema ./internal/diagnostics ./internal/ir/... ./internal/parser -count=1 -timeout=180s
        result: passed on 2026-10-29 with final constructors and negative fixtures; full Sema 17.518s, diagnostics 0.002s, Semantic IR 3.581s, nominal 0.119s and full parser 95.395s
      - command: go test -race ./internal/sema ./cmd/compiler ./cmd/lsp -run 'ImplicitDiscard' -count=1 -timeout=150s; go vet ./internal/parser ./internal/sema ./internal/diagnostics ./cmd/compiler ./cmd/lsp
        result: passed on 2026-10-29; final source fixtures cover ten ordinary/method/generic/conversion/construction occurrences, all policy levels and analysis depths, stable repeated/loop/defer visits, related declarations, human/JSON/LSP transport, explicit/void/value-consumer exclusions and mandatory Result/fallible-construction errors; Sema 1.560s, CLI 19.073s, LSP 14.669s under race; vet passed
      - command: go test ./internal/parser -run Discard -count=1
        result: passed
      - command: go test ./internal/sema -run 'Discard|MustUse' -count=1
