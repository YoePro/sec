legacy_sources:
- implementation-status.yaml
- implementation-status-default-values-additions.yaml
legacy_reconciliation:
- id: types.default-values-v2.reconcile.enum-status
  summary: The 2026-08-19 audit found that enum default support already existed while the then-current
    governance text described it as missing or incomplete. The canonical governance entry should preserve
    the implemented status rather than the stale legacy description.
- id: types.default-values-v2.reconcile.union-status
  summary: The 2026-08-19 audit found that explicit union default support already existed while the then-current
    governance text described it incorrectly. The canonical governance entry should preserve the implemented
    status and keep non-default union empty-state semantics owned by the union rulebook.
language_rulebook_status_sync:
  path: language-rulebook-status.md
  rulebook: rules/types/default_values.md
  expected_revision: '2.0'
  action: Ensure the status ledger identifies default_values.md as the current revision-2.0 rulebook.
    Do not infer revision from presence or absence of the newer metadata header.
sync_actions:
- Merge these stable-ID entries into the canonical governance owner for rules/types/default_values.md
  without discarding existing implementation evidence, history, or commit references.
- Register the canonical owner in governance/index.yaml if default_values.md does not already have one.
- Reconcile stale legacy enum/union default status with the verified implemented state before retiring
  duplicate mutable status.
- Preserve float range-derived defaults, Semantic IR/lowering, and conformance fixtures as remaining work
  until code evidence supports upgrading them.
- After migration, retire duplicate mutable status from legacy implementation-status files so governance/
  remains the canonical machine-readable ledger.
- Synchronize language-rulebook-status.md with revision 2.0 for default_values.md.
machine_contract:
  integration_required_fields:
  - id
  - status
  - summary
  - rules
  - implemented
  - remaining
  - identified_bugs
  - evidence
  status_values:
  - implemented
  - partial
  - unimplemented
  bug_kind_values:
  - implementation
  - governance
  - test
  - tooling
  bug_severity_values:
  - low
  - medium
  - high
  - critical
  bug_identity_rule: A bug is defined once under the most directly affected integration. Other integrations
    reference it through bug_refs.
