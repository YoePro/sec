      - "instance methods (since 2026-10-12, package 15): shared and mutable receivers lower as an explicit ref/ref mut `self` parameter with field reads/writes and receiver passing (sec-mlir-package15 P15-47); remaining are consuming receivers (by-value move), `self` used as a value, reborrowing a mutable `self` for nested calls, temporary receivers without a Place (needed by try-chain-intermediate-lowering), and generic implementations through specialization identities"
