      - fixed-array runtime projection verification requires a named dominating guard for the same array/index SSA pair and rejects any projection reachable from the guard's false edge
      - terminating Semantic IR fail.bounds endpoint for ordinary indexing plus explicit core::IndexError.OutOfBounds and Result.err validation for fallible bounds paths
      - immutable read-only ResolvedArrayIndexPlan facts preserve exact array length, array/element/index types, signedness, use/action, proof/check kind, failure mode, and runtime IndexError typing without downstream AST reconstruction
      - arbitrary-precision constant index plans cover valid uint256 values above host int64 and exact negative, at-length, and above-length rejection; remaining indexes preserve their signed or unsigned source type as runtime-checked
      - named integer ranges wholly contained in 0..<N produce explicit range-proven index plans while zero-length arrays remain runtime-checked unless rejected as an invalid constant
      - dominating branch and assertion conditions publish explicit branch or analysis index-proof provenance; inline range contracts retain contract provenance, binding identity prevents textual shadowing, and intervening assignments invalidate value proofs conservatively
      - source-built branch-proven extraction consumes the Sema proof in verified Semantic IR without array.index-in-bounds or fail.bounds while incomplete, disjunctive, out-of-scope, mutated, and zero-length cases remain runtime-checked
      - Package 14 source-builder unsupported boundary for non-trivial array literals returns UnsupportedFeatureError without returning a partial module or placeholder operation
