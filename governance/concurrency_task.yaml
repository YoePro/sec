    normative:
      - Task[T] is a move-only owning lifecycle handle.
      - spawn Work() and spawn task Work() have raw type Result[Task[T], TaskSpawnError].
      - TaskSpawnError is distinct from failures of an already-created task.
      - await Task[T] always yields TaskOutcome[T].
      - TaskOutcome[T] has Completed(T), Cancelled, Panicked(PanicInfo), and Failed(TaskError).
      - A task function returning Result[V,E] completes normally as Completed(Result[V,E]); Err(E) is not task execution failure.
      - TaskError is exactly OutOfMemory, ResourceLimit, ExecutorUnavailable, and NativeFailure; InvalidConfiguration remains exclusive to TaskSpawnError.
      - Task lifecycle ownership must be resolved through await, join, detach, or ownership transfer.
      - Observers are non-owning and must not duplicate lifecycle responsibility.
      - Task boundary ownership and borrowing are constrained by transferability analysis.
    implemented:
      - Task[T] is represented as a compiler-known generic task type in the frontend model.
      - Task handles are treated as non-copyable and move-only in existing semantic checks.
      - Frontend lifecycle checking rejects unresolved local task handles on supported control-flow paths.
      - Detach syntax and explicit discard forms have frontend support.
      - Spawned callable and lambda task forms have parser and frontend support.
      - Current-task context has partial frontend support for spawned lambda analysis.
      - TaskOutcome[T], TaskSpawnError, TaskError, and PanicInfo are compiler-known frontend identities shared with LSP consumers.
      - Awaiting Task[T] consumes the handle and has invariant static type TaskOutcome[T].
      - TaskOutcome[Result[V,E]] preserves the complete nested Result type.
      - TaskOutcome[void] retains four variants while Completed is normalized to a payload-less variant.
      - LSP hover consumes the shared Sema await type and exposes TaskOutcome[T] without a parallel task-typing path.
      - Core declares canonical TaskOutcome[T], TaskSpawnError, and the exact closed TaskError enum without requiring runtime support.
      - Only loader-proven core sources may refine the compiler-known TaskOutcome, TaskSpawnError, and TaskError identities.
      - "Canonical core panic metadata declarations completed 2026-11-11 (panic.md section 13(2)-(7)): sec/core/panic.sec declares nominal uint32 PanicID and exactly PanicInfo { ID: PanicID, File: string, Line: uint, Column: uint, Function: string }. Compiler fallback/source identities are module core; only loader-proven core may attach the exact non-generic, copyable declarations with real declaration/field locations. Malformed trusted replacements are rejected with registered reserved-declaration diagnostics; project or core-looking files cannot redeclare either name. Source and fallback TaskOutcome.Panicked use the same nominal PanicInfo. CLI check and LSP source navigation consume the real core declaration. This closes source declaration integration only, not runtime outcome production, panic allocation/transport or the whole panic correction."
      - "Task failure-domain diagnostics completed 2026-11-12 (tasks.md sections 5,11-15,30(1),(8-9),31(3-9); await.md sections 4-6): mandatory S1234 / task.failure-domain-mismatch identifies incompatible creation errors, execution errors, panic payloads, cancellation payloads and flattened task outcomes using canonical resolved type identities. Shared Sema explanations distinguish TaskSpawnError before any task exists from post-creation Failed(TaskError), payload-less Cancelled, Panicked(PanicInfo), and normal Completed(Err(E)) while preserving the complete nested callable Result type. Contextual and qualified outcome constructors, argument/initializer/field/return/Err boundaries, invalid try/await carriers and invalid TaskError categories carry source-spanned guidance; InvalidConfiguration points to TaskSpawnError.InvalidConfiguration. Existing missing-payload S1151 keeps its identity and gains the same category explanation. Ordinary compatibility and union checks remain authoritative: valid Completed(Err(E)), TaskOutcome[void] and unrelated user unions retain their semantics and diagnostics. The same Sema projection supplies LSP binding/type hover, without a second failure classifier. Source-backed tests cover 21 invalid cases, valid four-way/nested outcomes, explicit ordinary-union controls, compiler human/JSON and LSP parity, and no invalid IR artifact. Result return analysis was extracted from analyzer.go into a focused sibling file. Runtime production and raw spawn Result typing remain separate existing remaining items."
      - "Fallible task creation typing implemented 2026-11-12 for default/explicit task callable spawns, generic and method calls, named function values and explicitly typed lambdas: the shared Sema producer returns canonical Result[Task[T], TaskSpawnError] with the complete child T, including nested Result and void. Ordinary try unwraps or propagates TaskSpawnError; local handlers and match separate creation success from TaskOutcome. Raw Result cannot be awaited, returned as a direct Task, propagated into an incompatible error channel or discarded while containing a lifecycle owner. Compiler check/JSON diagnostics and LSP diagnostics/binding hover share these facts. Older semantic fixtures explicitly handle creation failure. Spawn inference was extracted from analyzer_inference.go into a focused sibling file and the direct taskType producer removed. Block forms remain explicitly unsupported pending MD-133; MD-128/MD-129 runtime commit/cancellation decisions and task runtime/IR/lowering remain outside this frontend typing change."
    remaining:
      - complete raw Result[Task[T], TaskSpawnError] typing for spawn block forms after MD-133 defines their callable return type; callable and explicitly typed lambda forms are complete
      - implement terminal outcome production for Completed, Cancelled, Panicked, and Failed
      - synchronize join semantics and terminal-value extraction with move-only payload rules
      - complete TaskObserver semantics and non-owning restrictions
      - complete path-sensitive task lifecycle analysis across every control-flow construct
      - complete transferability checks for owned values, borrows, captures, detach, and migration
      - represent task creation, lifecycle, outcome, cancellation, panic, failure, await, join, and detach explicitly in Semantic IR
      - lower task operations through the selected target/runtime model without host leakage or a mandatory universal runtime
    required_tests:
      - all task spawn expressions type as Result[Task[T], TaskSpawnError]
      - try spawn Work() unwraps successful creation and propagates TaskSpawnError under ordinary Result rules
      - await Task[T] types exactly as TaskOutcome[T], including when normal completion is statically proven
      - normal return produces Completed(T)
      - Task[Result[T,E]] returning Err(E) produces Completed(Err(E)), not Failed(TaskError)
      - cooperative cancellation produces Cancelled without fabricating T
      - recoverable task-boundary panic produces Panicked(PanicInfo) under the selected panic policy
      - execution failure after successful creation produces Failed(TaskError)
      - Task[T] cannot be copied for any T and reusable-source transfer uses canonical explicit move syntax
      - owning task handles cannot silently leave scope unresolved
      - observers cannot await, join as owner, detach, or take a move-only completion value
      - value-returning detached tasks require the canonical explicit discard form when applicable
