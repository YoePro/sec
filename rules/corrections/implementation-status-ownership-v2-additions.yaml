integrations:
  - id: frontend.ownership-v2
    area: frontend-ownership-analysis-and-lowering
    status: partial
    introduced: "2026-08-28"
    rulebook_created: "2026-08-26"
    document_revision: "2.0"
    rulebook_baseline_reviewed: "b3315f6"
    canonical_rulebook: rules/memory/ownership.md

    summary: >-
      Synchronize root governance with ownership.md revision 2.0. Existing
      frontend.copy-move and sema.place-analysis entries document substantial
      pre-v2 move/place infrastructure but do not enumerate the canonical
      availability lattice, availability tests, UnavailableReason, dynamic
      ownership-state policy, conditional cleanup, call-transfer transaction,
      return forwarding, and related revision-2 requirements.

    related_existing_integrations:
      - frontend.copy-move
      - sema.place-analysis
      - frontend.match-v2
      - frontend.discard-v2
      - frontend.defer-v2

    rules:
      - rules/memory/ownership.md
      - rules/memory/copy_move.md
      - rules/memory/borrowing.txt
      - rules/memory/destruction.txt
      - rules/memory/lifetime_analysis.txt
      - rules/control-flow/discard.md
      - rules/control-flow/flowcontrol_match.md
      - rules/declarations/functions.md
      - rules/declarations/lambda-functions.md
      - rules/errors/errorhandling.md
      - rules/compiler/semantic_ir.txt
      - rules/tooling/formatter.md
      - rules/tooling/lsp.md

    current_foundations:
      - explicit :<- and <- syntax
      - explicit move of copyable and move-only reusable sources
      - ordinary named move-only copy rejection
      - direct moved/discarded/detached reason tracking with source locations
      - structured Place identity and overlap
      - nested-field unavailable state and selected partial moves
      - field-sensitive reinitialization
      - selected control-flow ownership joins
      - borrow/move conflict infrastructure
      - selected parameter, return, aggregate, Result, Option, union, spread, and conversion transfer handling
      - formatter preservation and initial ownership semantic-token/LSP support
      - guarded-match prospective move concepts in match-v2 work

    partial:
      - >-
        Current move state is represented through pre-v2 moved/place maps rather
        than the complete source-semantic Availability lattice required by
        ownership.md revision 2.
      - >-
        Partial availability exists for selected Places, but recursive aggregate
        availability masks and complete conditional-partial state are not canonicalized.
      - >-
        Unavailability reasons are tracked in selected move maps but there is no
        canonical Availability plus UnavailableReason/provenance representation
        shared by every subsystem.
      - >-
        Ordinary call Sema evaluates all arguments before markMovedCallArguments;
        no pending call-transfer reservation prevents a later sibling argument
        from reusing an overlapping earlier <-source before final commit.
      - >-
        Semantic IR does not yet carry canonical ownership operations,
        availability masks, destination ownership, conditional cleanup,
        call-transfer transaction facts, or return forwarding.
      - >-
        LSP/diagnostic support exposes selected move facts but not the complete
        revision-2 availability and runtime/static-state model.

    required_frontend_steps:
      - define one canonical ownership fact model containing Place identity,
        Availability, UnavailableReason/provenance, partial masks, conditional
        alternatives, and destruction responsibility
      - keep Uninitialized, Available, PartiallyAvailable, Unavailable, and
        ConditionallyAvailable semantically distinct
      - preserve richer internal conditional-partial masks where needed
      - implement compiler-known `is available` and `is not available` parsing,
        AST/Sema, static folding, and path refinement
      - define `is available` over the exact tested Place; whole aggregate
        requires whole availability and sub-place tests only the sub-place
      - ensure negative availability refinement preserves PartiallyAvailable,
        Uninitialized, and richer conditional state rather than collapsing every
        true branch to Unavailable
      - preserve UnavailableReason/provenance through refinement without inventing
        a reason for a state test
      - implement runtime ownership-state requirement analysis independent of
        whether source spells an availability query
      - implement target/project static-ownership policy in the canonical
        CompilationPlan/target-policy path
      - reject only the ownership-dependent operation that genuinely requires
        forbidden runtime state
      - implement conditional discard convergence
      - implement conditional replacement/reinitialization with exactly-once old destruction
      - implement conditional scope-exit and partial-aggregate cleanup
      - implement pending call-transfer reservations during left-to-right argument evaluation
      - make pending reservations Place-sensitive using canonical overlap
      - reject later sibling read/copy/borrow/move/discard/replacement of an
        overlapping reserved source
      - cancel only the outer-call reservation when a later outer argument fails
      - commit prepared outer-call transfers only after all arguments and call validation succeed
      - keep nested-call effects/transfers committed when they completed during argument evaluation
      - apply the same call-transfer transaction model to compiler-known
        calls/constructors where equivalent ownership-taking semantics exist
      - implement return forwarding so `return value` and `return <-value` have
        identical ownership result at the terminal boundary
      - ensure explicit <- consumes copyable values too
      - infer required mutable/exclusive receiver authority when a method
        moves/discards/replaces/reinitializes owned members
      - reject ordinary whole-self-consuming methods
      - reject partial moves from types with custom free in Sec 0.1
      - implement closure capture(value), capture(<-value), capture(ref value),
        capture(ref mut value) ownership behavior and reject stale capture(-> value)
      - synchronize Result Ok/Err consuming projections and borrowed projections
        with canonical ownership facts
      - consume canonical match/try guarded prospective-move commit facts rather
        than reconstructing ownership separately
      - conservatively reject move from fixed-address/register/volatile/foreign
        Places unless their owning rulebooks permit transfer

    required_semantic_ir_steps:
      - represent copy versus consume explicitly
      - represent move source Place and destination ownership
      - represent Availability and recursive partial/conditional masks where lowering needs them
      - represent UnavailableReason/provenance where required for tooling
      - represent pending/committed call-transfer facts or an equivalent resolved call ownership plan
      - represent replacement versus reinitialization
      - represent conditional destruction/cleanup responsibility
      - represent return forwarding explicitly
      - verify ownership operations rather than infer moves from unused SSA
      - preserve source Place/rule provenance sufficient for diagnostics and LSP

    required_lowering_steps:
      - lower static ownership state without unnecessary runtime flags
      - lower genuinely dynamic conditional ownership with local SSA/drop-state representation when policy permits
      - eliminate runtime ownership state when static proof is sufficient
      - conditionally destroy exactly once for discard, replacement, and scope exit
      - lower call-transfer commit atomically/effectively at callee-entry boundary
      - ensure failure before outer-call commit retains caller ownership of reserved sources
      - preserve completed nested argument-expression effects
      - verify Sec MLIR and LLVM ownership/cleanup behavior
      - keep local ownership bookkeeping out of public ABI unless an ABI rule explicitly requires representation

    diagnostics_and_tooling:
      - stable ownership diagnostic IDs
      - mentor diagnostic identifies Place, earlier ownership-changing source, reason, and practical correction
      - missing call-site move marker quick fix only when compiler proves consuming intent
      - hover exposes available/unavailable/partial/conditional state
      - hover exposes unavailability reason and source
      - hover exposes copied versus consumed call arguments
      - expose pending/prospective versus committed move where useful
      - expose whether availability result is static or runtime-dependent
      - expose static-ownership policy rejection at the actual dynamic-state requirement
      - formatter preserves :<-, <-, Consume(<-value), capture(<-value), and optional return <-value without style insertion/removal

    required_tests:
      - all ownership.md section 35 conformance categories
      - partial aggregate whole `is available` is false
      - partial aggregate `is not available` preserves available sibling fields
      - uninitialized `is not available` preserves uninitialized provenance
      - conditional-partial negative refinement preserves recursive mask
      - availability test never invents move/discard/detach reason
      - earlier <-source call argument reserves against later sibling read
      - pending transfer reserves against later sibling borrow
      - pending transfer reserves against second move
      - disjoint sibling Place may remain usable during pending transfer
      - later argument failure cancels outer reservation
      - successful outer call commits transfer exactly once
      - completed nested-call transfer is not rolled back by outer failure
      - conditional discard can require runtime state without `is available`
      - conditional replacement can require runtime state without `is available`
      - conditional scope-exit cleanup can require runtime state without `is available`
      - strict static-ownership policy rejects actual runtime-state requirement
      - custom-free partial move is rejected
      - ordinary method whole-self consumption is rejected
      - return marker optionality preserves identical ownership result
      - closure capture ownership matrix
      - consuming and borrowed Result projections
      - guarded match move commit
      - partial aggregate destruction destroys only still-owned sub-places

    traceability:
      policy_source: correction25.md
      requirements:
        - every touched semantic implementation file cites ownership.md where applicable
        - ownership functions cite precise governing sections
        - call transfer code cites ownership.md §§13-14 and Place overlap §18
        - availability/refinement code cites ownership.md §§5 and 20-25
        - cleanup code cites ownership.md §§23-26 plus destruction/discard books
        - focused regression tests cite ownership.md and correction30.md where practical

    correction_reference:
      - correction30.md

  - id: governance.ownership-v2-sync
    area: implementation-governance
    status: correction-needed
    audited: "2026-08-28"

    summary: >-
      Root frontend.copy-move is integrated 2026-08-08, while the canonical
      ownership.md revision 2.0 was created 2026-08-26. The older entry remains
      useful for the first move/place implementation slice, but it is not a
      complete implementation plan for the revision-2 ownership model.

    required_changes:
      - add frontend.ownership-v2 as a dedicated canonical ownership entry or
        equivalently expand governance with the same explicit revision-2 steps
      - keep frontend.copy-move focused on copy classification and the existing
        first explicit-move slice
      - cross-link sema.place-analysis rather than duplicating Place implementation
      - track Availability and UnavailableReason separately
      - track recursive partial and conditional aggregate masks
      - track availability tests and refinement
      - track runtime ownership-state necessity and static-ownership policy
      - track conditional discard/replacement/destruction
      - track pending call-transfer reservation plus final commit/cancel
      - track return forwarding
      - track receiver/member and custom-free ownership rules
      - track closure capture ownership
      - track Result/try/match ownership reuse
      - track Semantic IR ownership representation and backend verification
      - track mentor diagnostics, formatter, LSP, and complete conformance tests
      - apply correction25 source-to-rulebook traceability to all implementation steps
