    implemented:
      - synchronous MayAllocate summaries with a deterministic shortest allocation path (ArenaSummary.AllocationPath)
      - separate unknown-allocation summaries (ArenaSummary.AllocationUnknown, UnknownAllocationPath) so unknown behavior is conservative under @noAlloc without being reported as allocation
      - source-ordered direct Arena and string-materialization allocation sites
      - initial allocation-context facts
      - transitive @noAlloc verification over the synchronous call graph (frontend.allocation)
      - ArenaSummary consumes a graph-wide cached least fixed point of independent definite/unknown allocation effects over canonical same-stack edges; the reverse monotone worklist converges through recursive and mutually recursive components without analysis-depth cutoffs, while seed-free cycles stay effect-free in this represented model
      - converged shortest distances reconstruct deterministic source-edge-ordered allocation and unknown witnesses without repeated per-callable path searches; defer effects propagate, spawned bodies remain separate, direct events and returned paths are detached, and incomplete operation/body coverage remains conservative in AllocationFacts
      - new direct allocation facts and canonical call edges invalidate the derived fixed point; graph cloning, plan binding and checkpoint reconstruction start with fresh derived state; immutable snapshot consumers may query summaries concurrently
      - all analysis depths, free/allocating/unknown/mixed/trusted-foreign mutual recursion, recursive defer, spawn exclusion, a 256-node cycle, effect/edge additions after queries, detached prior snapshots, deterministic shortest witnesses and real compiler/analyse/LSP owning diagnostics and presentation are verified
    verification:
      - command: go test ./internal/sema/... ./cmd/compiler ./cmd/lsp -count=1
        result: passed on 2026-10-08 after consolidating the call_graph family from 17 to 10 files (plan identity into call_graph_identity.go; contract, defer and test-root producers into call_graph_callables.go; effect-domain and arena allocation fixed-point summaries into call_graph_summaries.go; checkpoints into call_graph_workspace.go; tests regrouped, call_graph_scc_test.go renamed call_graph_test.go) without behavior or API changes
      - command: go test ./... -count=1
        result: passed on 2026-10-07 after graph-wide allocation fixed points and recursive compiler/analyse/LSP parity cases
      - command: go vet ./...
        result: passed on 2026-10-07 after cached immutable-view allocation summaries
      - command: go test ./internal/sema ./cmd/compiler ./cmd/lsp -race -run 'TestAllocation|TestNoAlloc|TestCallGraph.*(Workspace|Checkpoint|Defer|Effect)' -count=1
        result: passed on 2026-10-07 with recursive convergence, independent unknown facts, query invalidation, detached snapshots, concurrent immutable readers and actual compiler/analyse/LSP parity at all depths
      - command: Python YAML validation and git diff --check
        result: passed on 2026-10-07 with 46-fragment registry parity and 304 unique IDs; analysis.allocation remaining reduced from 7 to 6, allocation total from 38 to 37
    remaining:
      - infer allocation effects through every callable form (closure targets, deferred and destruction relations, generic specializations)
      - persist/import validated allocation-effect summaries
      - propagate allocation contexts without forcing source-level Arena threading
      - feed allocation-free facts into ISR, stack, target-policy and diagnostics analysis
      - implement static Arena capacity analysis including loops, recursion, target layout and simultaneous live allocations
      - support static placement/allocation elimination proof without hidden escape repair
    required_tests:
