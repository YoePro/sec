schema_version: 1
area: lexer
purpose: Lexical structure, tokens, literals, and source spelling.
integrations:
  - id: frontend.lexical-structure
    area: frontend-and-tooling
    status: partial
    integrated: "2026-08-09"
    revised: "2026-09-13"
    summary: >-
      Records the current lexer, parser, formatter, diagnostic, and LSP
      implementation baseline for the normative lexical structure rules.
    rules:
      - rules/foundations/lexical_structure.md
      - rules/foundations/grammar.md
      - rules/foundations/attributes.md
      - rules/foundations/operators.md
      - rules/memory/arena.md
      - rules/compiler/rules_implementations.txt
      - rules/tooling/formatter.md
      - rules/tooling/lsp.md
      - rules/tooling/diagnostics.txt
      - rules/compiler/parser_recovery.md
    code:
      - internal/lexer/escapes.go
      - internal/lexer/contract_words.go
      - internal/lexer/contextual_type_names.go
      - internal/lexer/reserved_names.go
      - internal/lexer/lexer.go
      - internal/diagnostics/diagnostics.go
      - ../bootstrap/internal/lexer/lexer.sec
      - go.mod
      - go.sum
      - internal/parser
      - internal/parser/interpolation.go
      - cmd/compiler/main.go
      - internal/codegen/llvm/expressions.go
      - internal/ast
      - internal/sema
      - internal/sema/reserved_names.go
      - internal/formatter
      - internal/lsp
      - cmd/lsp
      - vscode/syntaxes/sec.tmLanguage.json
    tests:
      - internal/lexer/character_length_test.go
      - testdata/lexer/character_length_valid.sec
      - testdata/lexer/character_length_invalid.sec
      - internal/lexer/escapes_test.go
      - testdata/lexer/escape_diagnostics_invalid.sec
      - internal/lexer/lexer_test.go
      - internal/lexer/diagnostic_categories_test.go
      - testdata/lexer/byte_string_absent.sec
      - cmd/compiler/lexer_cli_test.go
      - testdata/lexer/cli_diagnostics_invalid.sec
      - testdata/lexer/malformed_base_literals_invalid.sec
      - testdata/lexer/digit_separators_invalid.sec
      - testdata/lexer/invalid_numeric_suffix_invalid.sec
      - testdata/lexer/missing_exponent_digits_invalid.sec
      - testdata/lexer/malformed_decimal_candidates_invalid.sec
      - testdata/lexer/unterminated_block_comment_invalid.sec
      - testdata/lexer/unterminated_ordinary_string_invalid.sec
      - testdata/lexer/unterminated_raw_string_invalid.sec
      - testdata/lexer/unterminated_character_literal_invalid.sec
      - testdata/lexer/unterminated_interpolated_string_invalid.sec
      - testdata/lexer/invalid_source_character_invalid.sec
      - testdata/lexer/keyword_inventory_valid.sec
      - testdata/parser/semicolon_invalid.sec
      - internal/diagnostics/diagnostics_test.go
      - testdata/lexer/interpolation_balanced_valid.sec
      - testdata/lexer/interpolation_balanced_invalid.sec
      - testdata/lexer/identifier_nfc_valid.sec
      - testdata/lexer/identifier_nfc_invalid.sec
      - internal/parser/parser_test.go
      - testdata/parser/documentation_attachment_valid.sec
      - internal/parser/interpolation_test.go
      - internal/codegen/llvm/generator_test.go
      - testdata/parser/interpolation_parts_valid.sec
      - testdata/parser/interpolation_parts_invalid.sec
      - testdata/parser/interpolation_lowering_deferred.sec
      - internal/formatter/formatter_test.go
      - testdata/formatter/contextual_x.sec
      - internal/sema/analyzer_test.go
      - internal/sema/effect_analysis_test.go
      - internal/sema/reserved_names_test.go
      - cmd/lsp/main_test.go
      - testdata/lsp/contextual_x_semantic_tokens.sec
    implemented:
      - closed character literals require exactly one Unicode scalar after escape interpretation; L1009 lexer.character-literal-length preserves the original token span and suppresses cascades after malformed escapes
      - scalar-count diagnostics survive parser propagation and roll back with lexer snapshots; bootstrap source mirrors the check
      - escape validation in ordinary strings, character literals, and interpolation text emits L1006 for unknown codes, L1007 for malformed or incomplete escapes, and L1008 for invalid Unicode scalar values
      - one lexer-owned Sec escape decoder materializes ordinary string and character literals, including the non-Go \u{H...} form, into parser AST values without changing raw-string behavior; unit metadata reuses the same decoder
      - character literals default to char and context-shape to rune in Sema with the resolved type retained for downstream clients; exact decoded scalar values lower as typed Semantic IR const.int operations and through the legacy LLVM char/rune representations
      - exact escape source spans and original literal tokens survive recovery; raw strings and comments are exempt, and snapshot restore rolls back diagnostics
      - nested interpolation escape diagnostics retain original positions and deduplicate through parser results; CLI rejects lexical errors and LSP highlights escape spans
      - bootstrap lexer source mirrors escape validation and passes parser validation; runtime equivalence remains dependent on bootstrap execution support
      - Unicode-rune input processing
      - one-based line and column tracking
      - identifier starts using underscore, ASCII letters, and Unicode letters
      - Go frontend validates identifier NFC with Unicode-version-matched golang.org/x/text/unicode/norm, rejecting non-NFC spellings with mandatory L1004 and a normalized suggestion while preserving the original lexeme
      - combining marks are retained in malformed identifier candidates for whole-token diagnostics; NFC candidates containing marks still violate the letter/digit/underscore grammar and receive L1005
      - NFC diagnostics preserve source positions and snapshot rollback and propagate through parser errors and LSP diagnostics without normalizing literal or comment contents
      - ASCII digits after identifier start
      - canonical hard-keyword lookup is synchronized across the normative lexical inventory, Go lexer, bootstrap lexer, LSP completion vocabulary, and TextMate highlighting; extends is hard while arena, sec, and contextual set remain identifiers
      - the complete six-word contextual contract inventory is centralized in the lexer with value/marker grammar roles, consumed by the parser and LSP contract completion, mirrored in bootstrap source, and tested to remain IDENT tokens rather than hard keywords
      - the complete seven-name lowercase collection/shaped type inventory is centralized in the lexer with collection/shaped grammar roles and leading type-argument counts, consumed by the parser, mirrored in bootstrap source, and tested to remain IDENT tokens
      - LSP semantic tokens classify lowercase collection/shaped constructors as types only at parser-owned type-reference positions, so ordinary contextual set bindings and uses retain their variable class
      - formatter coverage preserves and normalizes all seven contextual type forms without rewriting an ordinary set identifier; TextMate highlighting requires generic-bracket lookahead for every lowercase contextual constructor instead of coloring the spellings globally
      - parser-owned LSP classifications cover explicit spawn task/thread/process modifiers, all contextual contract words, property set, collection set, x/in/not-in operators, and raw struct-field metadata without globally reclassifying ordinary identifiers or raw expression strings
      - LSP semantic tokens distinguish bare underscore, documentation block comments, attributes, and raw declaration metadata; compiler-known attributes retain their canonical modifier class while syntactically recoverable future attributes use the standard decorator class
      - formatter regression coverage preserves documentation comments, contextual contracts and spawn modifiers, raw declaration metadata, and bare underscore while remaining idempotent
      - TextMate distinguishes documentation comments, raw strings, attributes, visibility-prefixed identifiers, contextual spawn modifiers, and bare underscore; task is no longer globally colored outside spawn grammar
      - unused ARENA, SEC, and SET token categories are removed from the Go lexer; bootstrap additionally removes its stale BYTES placeholder and adds EXTENDS
      - dedicated bare underscore tokens while underscore-prefixed names remain identifiers
      - decimal integer literals
      - fractional literals including leading-period forms such as .5
      - scientific exponent literals including signed exponents and leading-period mantissas
      - focused parser diagnostics when an exponent marker or sign lacks decimal digits
      - binary, octal, and hexadecimal integer prefixes
      - canonical numeric family suffixes i, u, g, m, t, and r with fractional/exponent restriction to g and m
      - focused c/d/f to t/m/g migration diagnostics for unambiguous obsolete literals
      - require retained as a globally reserved keyword
      - numeric digit separators between valid digits in decimal, binary, octal, hexadecimal, fractional, and exponent components
      - separator-containing numeric source lexemes preserved in tokens and AST while parser and semantic constant evaluation ignore separators
      - misplaced, repeated, and trailing numeric separators rejected as one ILLEGAL numeric token for currently recognized malformed forms
      - ordinary strings
      - character-literal tokenization
      - backtick raw strings
      - interpolated-string tokenization using dollar-quoted syntax
      - balanced interpolation-expression lexing with nested aggregate braces, ordinary/character/raw/nested interpolated literals, and comments; complete source lexemes and positions are preserved
      - interpolation text scanning distinguishes doubled literal braces and Unicode escape braces from expression delimiters and rejects physical newlines and unmatched braces
      - bootstrap lexer source mirrors balanced interpolation scanning and remains parser-valid
      - interpolated-string AST retains ordered text and expression parts, original token spelling, and exclusive source ranges with original file and rune-based columns
      - interpolation expressions use ordinary Pratt parsing, including nested interpolation, aggregate expressions, raw strings, and comment trivia
      - interpolation text parts collapse doubled braces and materialize the lexer-validated ordinary Sec escape inventory, including hexadecimal and braced Unicode escapes, while their tokens retain exact source spelling and ranges for diagnostics and tooling
      - invalid interpolation expressions retain recovery metadata while later parts and enclosing statements survive; ordinary parser diagnostics reach LSP at original positions
      - Sema traverses every valid embedded interpolation expression under ordinary scope, type, ownership, and effect rules while retaining string as the enclosing literal type; nested definition/type facts are recorded, undefined and moved-value diagnostics retain embedded source positions, bounds-panic effects reach callable contracts, and LSP publishes the semantic diagnostics
      - raw string literals are accepted by the expression parser without escape decoding
      - legacy LLVM interpolation placeholder now explicitly rejects unsupported materialization instead of silently emitting source spelling and omitting expression evaluation
      - line comments
      - nested block comments
      - unterminated outer or nested block comments are retained through end of file as one ILLEGAL token with mandatory L1015 lexer.unterminated-block-comment; parser recovery preserves the invalid token without P2007 or Sema cascades, CLI/LSP publish only L1015, and multiline LSP ranges end at the true exclusive source position
      - unterminated ordinary strings are retained from their opening quote through the first physical line boundary or end of file as one ILLEGAL token with mandatory L1016 lexer.unterminated-ordinary-string; the line ending remains unconsumed so parsing resumes on the following line, parser recovery, CLI, and LSP preserve single-diagnostic lexer ownership and exact source ranges, and a more specific terminal escape diagnostic suppresses L1016 cascades
      - unterminated raw strings are retained from their opening backtick through end of file as one multiline ILLEGAL token with mandatory L1017 lexer.unterminated-raw-string; parser recovery suppresses P2007 and Sema cascades, CLI/LSP publish only L1017, and the LSP range ends at the true exclusive EOF position
      - unterminated character literals are retained from their opening quote through the first physical line boundary or end of file as one ILLEGAL token with mandatory L1018 lexer.unterminated-character-literal; LF, CRLF, and bare-CR recovery resumes on the following line, parser/CLI/LSP preserve single-diagnostic lexer ownership and exact ranges, and a more specific terminal escape diagnostic suppresses L1018 cascades
      - unterminated interpolated strings are retained from their $" prefix through the first physical line boundary or end of file as one ILLEGAL token with mandatory L1019 lexer.unterminated-interpolated-string, including EOF inside a started interpolation expression; line endings remain unconsumed for following-line recovery, parser/CLI/LSP preserve lexer ownership and exact ranges, and more specific nested lexer diagnostics suppress L1019 cascades
      - comment tokens
      - LF, CRLF, and bare-CR physical-line accounting, line-comment termination, and ordinary string/character newline rejection
      - comments treated as parser trivia before, between, and after struct-literal fields, including trailing line comments after commas
      - LSP semantic tokens for keywords, mutable variables, immutable bindings as readonly variables, types, functions, methods, comments, literals, and operators
      - multiline semantic tokens are split into protocol-valid single-line UTF-16 segments so every non-empty line of ordinary, documentation, and nested block comments remains colored, later tokens stay synchronized, and documentation modifiers survive on every segment; the VS Code TextMate grammar recursively matches nested block comments
      - position-specific LSP member classification and hover resolution so struct fields, struct-literal field names, and same-named methods retain distinct semantic identities
      - LSP member completion resolves self to its enclosing impl target including fields, register fields, properties, events, and instance methods
      - LSP member completion retains inferred local types from function and method return values including while an if condition is incomplete
      - LSP hover resolves self and self members against the enclosing impl target and displays member types, method signatures, and adjacent documentation comments where supported
      - semantic-token fallback to lexical classification when semantic analysis encounters an incomplete editor AST
      - LSP member-completion traversal ignores typed-nil AST nodes produced during parser recovery
      - LSP document outline for module, type, enum, interface, function, struct, variable, and impl members
      - LSP hover information from adjacent documentation comments above function declarations
      - common arithmetic, logical, bitwise, range, spread, delimiter, and assignment tokens
      - longest matching for existing multi-character punctuation
      - focused unterminated-token diagnostics are implemented for block comments, ordinary strings, raw strings, character literals, and interpolated strings with L1015-L1019
      - otherwise unrecognized ASCII and Unicode source scalars emit one L1020 lexer.invalid-source-character ILLEGAL token and advance exactly one scalar; embedded U+0000 is distinguished from physical EOF, remains ordinary content inside literals/comments, and cannot truncate following source; parser recovery suppresses dependent parser/Sema errors, CLI/LSP preserve focused diagnostics and exact ranges, and positions already owned by invalid UTF-8 or another specific lexer diagnostic do not receive L1020
      - structured lexer/parser diagnostic token ranges map one-based compiler Unicode-scalar columns to zero-based LSP UTF-16 positions for both starts and exclusive ends; astral scalars before or inside a token occupy two protocol character units, while LF, CRLF, and bare-CR multiline ranges retain their existing exact line mapping
      - every required lexical error category in lexical_structure.md §20 is covered by active mandatory stable IDs L1001-L1020 and an exhaustive representative lexer test that rejects missing, duplicate, retired, non-lexer, non-error, optional, generic, or overlapping diagnostic ownership; invalid escape syntax deliberately has separate unknown and malformed distinctions
      - lexer snapshot and restore
      - strict UTF-8 source decoding with L1001 diagnostics retained through parser results, including invalid bytes inside literals and comments
      - one optional initial UTF-8 byte-order mark ignored without shifting the first token position and removed by the formatter
      - unexpected byte-order marks rejected with L1002 at their exact source position while tokenization recovers
      - unsupported Unicode spacing outside literals and comments rejected as one ILLEGAL token with code-point-specific L1003 diagnostics
      - contextual set lexed as an ordinary identifier and resolved by parser context as collection type syntax, property setter syntax, or a value identifier
      - contextual set classified positionally by LSP semantic tokens and constrained by TextMate lookahead instead of globally reserved highlighting
      - parser-confirmed contextual matrix-multiplication x tokens receive the LSP operator class while ordinary identifiers named x retain their symbol class
      - contextual matrix-multiplication x hover presents compiler-resolved shaped operand and result identities while identifier x retains ordinary symbol hover
      - shared formatter normalizes parser-confirmed matrix-multiplication x as a binary operator and preserves declaration, call, use, and member identifiers named x
      - compiler-known type names protected against replacement by user type, enum, interface, or unit declarations
      - bootstrap lexer source synchronized with initial-BOM skipping, later-BOM and Unicode-whitespace diagnostics, diagnostic snapshot state, and a parser-valid DecodedSource boundary
      - Sec 0.1 exposes no BYTES placeholder token; bytes and a leading b before an ordinary string remain ordinary identifier and string tokens rather than inventing byte-string syntax
      - lex and token CLI commands print structured lexer diagnostic IDs and source positions, reject diagnostics attached to retained tokens, retain fallback counting for unstructured ILLEGAL tokens, and avoid counting a structured diagnostic within its enclosing ILLEGAL token twice
      - the lexer retains semicolons as dedicated recovery tokens and the parser rejects ordinary statement-terminator uses with focused P2012 diagnostics while preserving following statements
      - malformed binary, octal, and hexadecimal candidates are retained as one maximal ILLEGAL token; L1010 lexer.malformed-base-literal covers missing digits and invalid suffix tails while L1011 lexer.invalid-base-digit identifies decimal digits outside the selected base
      - parser, lex/token CLI, diagnostic registry, and bootstrap lexer paths preserve the focused base-literal IDs; legacy c/d/f suffixes remain owned by the existing parser migration diagnostic
      - invalid digit separators in decimal integers, fractions, exponents, and base-prefixed integers emit one L1012 lexer.invalid-digit-separator over the complete retained numeric token; parser, lex/token CLI, LSP, registry, and bootstrap paths preserve the ID
      - invalid decimal, fractional, and exponent suffixes emit one L1013 lexer.invalid-numeric-suffix over the maximal identifier-like numeric candidate; canonical suffixes followed by extra letters/digits are rejected as one token, fractional/exponent i/u/t/r suffixes are diagnosed, and legacy standalone c/d/f spellings retain parser-owned migration guidance
      - exponent markers whose optional sign is not followed by an ASCII decimal digit emit one L1014 lexer.missing-exponent-digits over the maximal malformed candidate; invalid exponent separators retain the more specific L1012 classification, and parser, CLI, LSP, registry, and bootstrap paths preserve lexer ownership
      - maximal malformed non-base decimal candidates are exhaustively covered across integer, fractional, leading-period fractional, and exponent shapes; identifier-like tails stay in one ILLEGAL token, L1012/L1013/L1014 precedence remains focused, and lexer, parser, CLI, and LSP recover at the following reliable token boundary without cascades
      - documentation block comments beginning with /** attach in the parser to source-ordered AST declaration nodes at top level, in statement blocks, and across struct, register, enum, union, interface, and impl member lists; raw comment tokens and contiguous groups are preserved, blank lines detach them, and /// remains an ordinary line comment
      - parser AST trivia retains every source comment once across speculative lexer rollback and classifies source-ordered leading, trailing, inline, detached, and documentation groups with exact lexical anchors and declaration/statement targets where attached
      - the shared formatter returns parser-owned comment attachments recalculated against canonical output, giving formatter and source-to-source clients stable trivia facts without reconstructing attachment from trimmed lines
      - LSP function and method hover consumes exact parser-owned documentation attachments and preserved comment tokens; it no longer rescans adjacent source or crosses a blank-line detachment boundary
      - one lexer-owned reserved-declaration-name classifier covers hard keywords, task/thread/process, all six contract words, compiler-known lowercase type names, and bare underscore while explicitly preserving contextual set, x, not, init, arena, and sec
      - Sema applies stable mandatory S1028 names.reserved-declaration-name diagnostics across module names, explicit import aliases, variables/constants, functions/methods, parameters, generic parameters, fields, properties, events, enum members, loop/select bindings, assembly output bindings, setter parameters, and match payload bindings; parser-owned underscore discard/register roles and trusted core module provenance are exempt
      - compiler-known type, enum, interface, and unit redeclarations retain their focused messages while sharing S1028 ownership; the bootstrap lexer mirrors the centralized reservation inventory
    partial:
      - interpolation formatting/conversion contracts and runtime lowering remain incomplete; AST/parser expression parts, source ranges, text escape materialization, semantic traversal, ownership checks, and effect propagation are implemented
      - source-position integration across lexer, parser, diagnostics, and LSP
      - bootstrap L1001 invalid-byte equivalence awaits a byte-preserving string decode API; ToRuneArray currently discards the original invalid byte before lexical inspection
    remaining:
      - port Go identifier NFC validation and combining-mark recovery to the bootstrap lexer once a Sec Unicode normalization API exists; the translated source records this dependency explicitly
      - confusable-identifier warning policy remains normatively undecided and must not be implemented before that decision is recorded
      - materialize formatted interpolation expression values through resolved semantic conversion contracts and maintained backends; doubled-brace and text-escape decoding in AST text parts are implemented
      - port interpolation AST parts and expression parsing to the bootstrap parser; blocked on the bootstrap AST and ordinary expression-parser infrastructure, which do not yet exist
    verification:
      - command: go test ./...
        result: passed; scalar-count fixtures, escape diagnostics, snapshot rollback and retained-AST Sema validation
      - command: parse character_length_valid.sec and character_length_invalid.sec
        result: valid fixture accepted; invalid fixture rejected with five lexical length errors
      - command: parse ../bootstrap/internal/lexer/lexer.sec
        result: passed; translated scalar-count check is parser-valid, runtime parity is not verified
      - command: go test ./internal/lexer ./internal/parser ./cmd/lsp -run Escape -count=1
        result: passed; valid escapes, unknown codes, malformed syntax, Unicode scalar bounds, nested positions, recovery, newline rejection, snapshot rollback and LSP spans
      - command: go test ./internal/parser ./internal/codegen/llvm ./cmd/lsp -run Interpolat -count=1
        result: passed; AST parts, nested positions, invalid-expression recovery, LSP diagnostics, and explicit unsupported LLVM materialization
      - command: go test ./internal/sema ./cmd/lsp -run 'InterpolatedStringExpression|SemanticDiagnosticsInsideInterpolation' -count=1
        result: passed; embedded expressions retain resolved types and definitions, undefined and moved-value diagnostics, bounds-panic contract effects, and exact LSP diagnostic ranges
      - command: go test ./internal/lexer ./internal/parser -run Interpolation -count=1
        result: passed; nested literals, comments, braces, token positions, parser retention, malformed input, and LF/CR/CRLF rejection
      - command: go test ./internal/lexer ./internal/parser -run 'Decode(StringText|Quoted)|Interpolation(TextMaterializes|Parts)' -count=1
        result: passed; valid interpolation text materializes the complete Sec escape inventory and doubled braces while preserving exact source tokens and ranges
      - command: go test ./internal/lexer ./internal/parser ./internal/diagnostics ./cmd/lsp
        result: passed; NFC validity, normalized suggestions, original token positions, rollback, grammar exclusions, parser rejection, and LSP publication
      - command: go test ./internal/lexer -run TestBytesIsOrdinaryIdentifierWithoutByteStringToken -count=1
        result: passed; relative bytes spellings remain identifiers and no byte-string token category exists
      - command: go test ./cmd/compiler -run TestLexerCLI -count=1
        result: passed; lex and token reject retained-token diagnostics, print stable IDs and positions, preserve unstructured ILLEGAL counting, and deduplicate structured diagnostics throughout enclosing ILLEGAL token spans
      - command: go test ./internal/lexer ./internal/parser ./internal/diagnostics ./cmd/compiler ./cmd/lsp -run 'MalformedBase|LegacyBase|RegistryIsValid|KnownDiagnostic|LexerCLI' -count=1
        result: passed; maximal base candidates emit L1010/L1011 once, parser, CLI, and LSP preserve them, registry metadata is valid, and legacy suffix mentor diagnostics retain ownership
      - command: go test ./internal/lexer ./internal/parser ./cmd/lsp -run 'ContractWord|ContractModifier|ContractSequence' -count=1 && go run ./cmd/compiler parse ../bootstrap/internal/lexer/lexer.sec
        result: passed; the canonical six-word inventory drives parser recognition and LSP completion, remains lexically contextual, returns defensive copies, and is mirrored by parser-valid bootstrap source
      - command: go test ./internal/lexer ./internal/parser ./cmd/compiler ./cmd/lsp -run 'MalformedDecimalCandidate' -count=1
        result: passed; eleven invalid candidates cover separator, suffix, and missing-exponent diagnostics across every decimal shape with maximal tokens, exact diagnostic ownership, CLI rejection, LSP publication, and parser recovery without cascades
      - command: go test ./internal/parser ./internal/ast ./internal/formatter ./cmd/lsp -run 'Documentation|Comment' -count=1
        result: passed; documentation groups attach to source-ordered declaration AST nodes across top-level, block, aggregate, interface, and impl contexts while blank-line-detached and /// comments remain unattached
      - command: go run ./cmd/compiler parse ../bootstrap/internal/lexer/lexer.sec
        result: passed; synchronized bootstrap maximal base-literal recovery, separator-state propagation, and L1010/L1011/L1012 emission are parser-valid
      - command: go test ./internal/lexer ./internal/parser ./internal/diagnostics ./cmd/compiler ./cmd/lsp -run 'DigitSeparator|MalformedBase|Numeric|LexerCLI|KnownDiagnostic|Registry' -count=1
        result: passed; eight invalid separator placements emit exactly one L1012 over each full token, survive parser and CLI consumption, preserve following source, and the focused LSP path retains L1012
      - command: go test ./internal/lexer ./internal/parser ./internal/diagnostics ./cmd/compiler ./cmd/lsp -run 'InvalidNumericSuffix|RegistryIsValid|KnownDiagnostic' -count=1
        result: passed; invalid suffix tails remain one ILLEGAL token with L1013, parser, CLI, and LSP preserve the diagnostic, and bootstrap lexer source remains parser-valid
      - command: go test ./internal/lexer ./internal/parser ./internal/diagnostics ./cmd/compiler ./cmd/lsp -run 'MalformedScientificExponent|MissingExponent|RegistryIsValid|KnownDiagnostic' -count=1
        result: passed; missing exponent digits emit one L1014 over the maximal token, parser-owned reconstruction is removed, CLI and LSP preserve the lexer diagnostic, and bootstrap lexer source remains parser-valid
      - command: go test ./internal/lexer ./internal/parser ./internal/diagnostics ./cmd/compiler ./cmd/lsp -run 'UnterminatedBlockComment|RegistryIsValid|KnownDiagnostic' -count=1
        result: passed; nested unmatched depth emits exactly one L1015, parser and Sema cascades are suppressed, CLI and LSP preserve lexer ownership, multiline LSP range mapping is exact, and bootstrap lexer source remains parser-valid
      - command: go test ./cmd/lsp -run 'SemanticTokens(CoverEveryMultilineCommentLine|UseUTF16WidthsAndStarts)|HoverSurvivesNestedMultilineComment' -count=1
        result: passed; semantic coloring covers all non-empty physical comment lines with UTF-16 coordinates and hover remains available after a nested multiline comment
      - command: go test ./internal/lexer ./internal/parser ./internal/diagnostics ./cmd/compiler ./cmd/lsp -run 'UnterminatedOrdinaryString|RegistryIsValid|KnownDiagnostic' -count=1
        result: passed; EOF, LF, CRLF, and bare-CR boundaries emit exactly one L1016 over the retained string candidate, following-line tokenization resumes, parser and Sema cascades are suppressed, CLI/LSP preserve lexer ownership, and the LSP range excludes the physical line ending
      - command: go test ./internal/lexer ./internal/parser ./internal/diagnostics ./cmd/compiler ./cmd/lsp -run 'UnterminatedRawString|RegistryIsValid|KnownDiagnostic' -count=1
        result: passed; multiline raw-string candidates remain one ILLEGAL token through EOF with exactly one L1017, parser and Sema cascades are suppressed, CLI/LSP preserve lexer ownership, and the LSP range ends at the exclusive multiline EOF position
      - command: go test ./internal/lexer ./internal/parser ./internal/diagnostics ./cmd/compiler ./cmd/lsp -run 'UnterminatedCharacterLiteral|RegistryIsValid|KnownDiagnostic' -count=1
        result: passed; EOF, LF, CRLF, and bare-CR boundaries emit exactly one L1018 over the retained character candidate, following-line tokenization resumes, terminal escape errors suppress L1018 cascades, CLI/LSP preserve lexer ownership, and the LSP range excludes the physical line ending
      - command: go test ./internal/lexer ./internal/parser ./internal/diagnostics ./cmd/compiler ./cmd/lsp -run 'UnterminatedInterpolatedString|RegistryIsValid|KnownDiagnostic' -count=1
        result: passed; text and expression EOF plus LF, CRLF, and bare-CR boundaries emit one L1019 over the retained candidate, following-line tokenization resumes, terminal escape errors suppress L1019 cascades, and CLI/LSP preserve lexer ownership and exact ranges
      - command: go test ./internal/lexer ./internal/parser ./internal/diagnostics ./cmd/compiler ./cmd/lsp -run 'InvalidSourceCharacter|InvalidUTF8|RegistryIsValid|KnownDiagnostic' -count=1
        result: passed; ASCII, BMP/astral Unicode-symbol, and U+0000 token starts each emit one L1020 and advance one scalar, U+0000 inside ordinary/raw strings and comments does not imitate EOF, following source survives parser recovery, CLI/LSP preserve lexer ownership, astral prefixes map to exact UTF-16 ranges, and invalid UTF-8 retains only its more specific L1001
      - command: go test ./internal/lexer -run TestRequiredLexicalErrorCategoriesHaveStableDiagnostics -count=1
        result: passed; all nineteen required lexical error categories and their twenty stable diagnostic distinctions have representative inputs that emit exactly one active mandatory lexer error ID across L1001-L1020
      - command: go test ./internal/lexer ./internal/parser ./cmd/lsp -run 'CanonicalKeyword|HardKeyword|ContextualKeyword|KeywordCompletion|ContextualSet|Property|ImplExtend' -count=1
        result: passed; all canonical hard keywords map correctly, contextual spellings remain identifiers, property set and impl extends still parse, and LSP completion contains every hard word without arena or sec
      - command: node -e 'JSON.parse(require("fs").readFileSync("vscode/syntaxes/sec.tmLanguage.json", "utf8"))'
        result: passed; synchronized TextMate keyword changes remain valid JSON
      - command: go run ./cmd/compiler parse testdata/lexer/keyword_inventory_valid.sec && go run ./cmd/compiler parse ../bootstrap/internal/lexer/lexer.sec
        result: passed; ordinary arena/sec/set bindings, impl extends, and the synchronized bootstrap lexer are parser-valid
      - command: go test ./cmd/lsp -run TestSemanticTokensClassifyOnlyContextualXAsOperator -count=1
        result: passed; parser-confirmed infix x is an operator while parameter and ordinary-use x tokens remain variables
      - command: go test ./internal/formatter -run TestFormatContextualMatrixXWithoutRewritingIdentifiers -count=1
        result: passed; irregular and delimiter-adjacent operator spacing is canonical and ordinary x identifiers remain unchanged
      - command: go test ./cmd/lsp -run TestHoverUsesResolvedContextualOperatorFacts -count=1
        result: passed; matrix x hover exposes compiler-resolved shaped operands and result dimensions
