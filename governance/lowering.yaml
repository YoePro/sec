    implemented:
      - "MD-115 / P16-27 completed (2026-10-27): the canonical ReturnOriginStep algebra transports detached exact arbitrary-precision half-open intervals or genuinely indeterminate ranges, with deterministic Semantic IR and schema-12 spelling [A..<B] / [?]. Sema's resolved source projections remain authoritative; exact nested intervals compose by addition, full-open views preserve prior narrowing and call summaries compose over actual arguments. Native parsing preserves arbitrary precision, legacy root/index widths and strict grammar; schemas 1–11 reject range suffixes. The focused MD-085 verifier proves endpoints from normalized/check SSA, preserves guards/source identity and checks typed sequence transitions, result elements and mutable authority; copies/moves, direct calls, block forwarding, finite alternatives and anchored loops retain their proofs. Source/IR/native tests cover exact/empty/inclusive/omitted/dynamic/nested intervals, fixed arrays/slices, shared/mutable/reduced authority, huge endpoints, clone independence, deterministic 32/64 round trips before/after P6 and forged metadata rejection without output. Unsupported source/CFG relations remain fail-closed; this does not close physical slice lowering, projected holders, general CFG endpoints or final P16 acceptance."
      - "exact slice bounds (P16-09, 2026-10-17): sema PlaceProjection.SliceStart/SliceEnd are detached *big.Int half-open bounds (nil = unknown endpoint) replacing int64 plus known flags; source normalization (missing start 0, inclusive end + 1 without overflow, missing end of a fixed array = exact length), nested slice and index composition, emptiness, disjointness, equality, index containment, storage overlap, parameter-usage places and identity comparison use exact arithmetic; persisted parameter-demand summaries move to schema version 2 so int64-era summaries are invalidated (TestSliceProjectionBoundsAreExactBeyondInt64, TestSlicePlaceProjectionNormalizesEndpointsExactly, existing overlap/relationship tests)"
      - "slice Place presentation (MD-089 decided 2026-10-18; borrowing.md § 12(9), diagnostics.md § 10(7)): Place.String prints an unknown start as `*`, omits a zero start, prints an unknown end as `..` and a known exclusive end exactly as `..<N` (values[*..<3] versus values[..<3]); presentation never alters the Place bounds (TestSlicePlacePresentationDistinguishesUnknownBounds)"
      - "canonical slice-range classification (P16-13, 2026-10-17): ClassifySliceRange applies the package16.md § 19 precedence (negative endpoint -> InvalidRange, start after end -> StartAfterEnd, source bound -> OutOfBounds) with exact arithmetic and defines the runtime RangeError for the same values; constant slice ranges report exactly the precedence-first error, now also start-after-end for sources of unknown length (TestClassifySliceRangePrecedence, TestConstantSliceRangeDiagnosticsFollowPrecedence; MD-094 decided 2026-10-18 and integrated in collections.md § 7.5 and package16.md §§ 18–19)"
      - "P16-10 (2026-10-18): SliceRangeID identifies a dynamic range evaluation site, with deterministic first-use allocation, zero absence, per-analysis reset and detached allocator snapshots/ResolvedPlaceOf queries. Static ranges allocate no ID. Nested dynamic slices/indexes preserve symbolic parent projections; dynamic IDs do not prove runtime equality or disjointness, and disjoint relative children cannot establish disjointness through unknown parents. IDs are excluded from persisted parameter summaries. Cohesive slice projection functions moved from place.go to slice_places.go; samePlaceIdentity moved out of analyzer.go."
      - "P16-12 (2026-10-18, Sema Place scope): known source-slice extents supply omitted ends before projection normalization so static inclusive/open nested subranges compose exactly, remain provably disjoint and allocate no dynamic identity. staticSliceExtent requires complete static ranges and unanimous lengths across origin alternatives. Source tests cover simultaneously live mutable subranges, nested empty borrows, zero-length array slices, retained root/storage/borrow/lifetime facts and rejection of empty local-origin returns. Dynamic overlap and exact wide-range regression coverage remain in force; IR/runtime slice work remains separate."
      - "P16-14 (2026-10-18): ResolvedSliceCreationPlanOf publishes analysis-time source kind/Place/type, authority and element type, original signed/unsigned endpoint types and exact constants, source length, source-relative normalized range or dynamic identity, canonical conservative range-check/proof facts, existing P15 reference plan/BorrowID/LifetimeID and core RangeError. Queries deeply detach range, origin, endpoint and error-case data without allocating or re-analyzing. Endpoint integer inference occurs in source order; known nested source extents participate in the existing canonical range diagnostic classifier. RangeError standalone/trusted-core identity is synchronized (compiler.compiler-known-surfaces). Slice inference and diagnostics moved out of analyzer monoliths. New IR and fallible CFG remain separate; broader query coverage is implemented by P16-16."
      - "P16-15 (2026-10-18): ResolvedSliceIndexPlanOf publishes source slice type/authority/Place and exact known extent, original integer type/signedness/constant, reused P14 check/proof/use/transfer enums, ordinary/fallible failure mode and canonical IndexError. Fixed arrays and slices share sequenceIndexProof for exact constants, integer domains and dominating branch/assertion facts; unknown lengths retain runtime checks. Known out-of-bounds/negative/empty-slice indices receive owning compile-time bounds diagnostics. Read/write/shared/mutable element borrow producers and accepted try failure sets update the stored slice plan without creating array/list facts. Queries detach types, origin projections, exact integers and enum cases, perform no inference or identity allocation and reset per analysis. Cohesive shared index plan/proof/use functions extracted from analyzer.go into index_plans.go. Slice Semantic IR, schema 12, nontrivial elements and complete effects remain separate; broader query coverage is implemented by P16-16."
      - "P16-16 (2026-10-18): creation and index plan queries are read-only and defensively detached, including exact integer bounds/indices, nested element/endpoint/Place types, origin alternatives, normalized ranges, enum error cases and embedded P15 reference/storage facts. Dedicated slice_plan_snapshots.go helpers preserve complete finite origin trees instead of losing deeper alternatives through flat Place/reference clones. Source-backed mutation/repeat-query tests cover both public APIs with emptied inference/Place caches, unchanged identity tables and borrow/plan/error counts, and unknown/nil queries; existing wide exact index/range snapshot regressions remain in force."
      - "P16-20 (2026-10-19): Semantic IR has distinct TypeSharedSlice/TypeMutableSlice kinds and TypeTable.InternSlice keyed by element TypeID and authority, separate from direct references and array types; length/range/origin/target width do not enter type identity. Type verification rejects missing/non-value elements and noncanonical length/layout/nominal/authority metadata; deterministic printing retains element and mode. SliceFacts reuses P15 ReferenceMetadata (borrow/lifetime/source borrow, storage, validity/epoch, address space and AddressStability), adding Place SSA origins, runtime length SSA, exact half-open static range and symbolic range identity, with detached cloning. Tests cover 32/64 plans, nominal/wide elements, invalid type forms, wide/empty range snapshots and source-resolved creation plans. No source slice-operation route, schema 12 or physical layout is introduced; whole-module unsupported boundaries remain at P14/P15/P16."
      - "P16-21 (2026-10-19): slice.range-normalize/check retain ordered source uint length and original present endpoint TypeIDs/signedness, omitted/open and inclusive/exclusive metadata. Normalize requires established range proof provenance and returns uint start/length; check has the total uint start/length, failed bool, canonical P11 core RangeError tuple. Verifiers reject wrong operand/result types, missing/assumed proofs and error domains, require an immediate exact failure branch, and confine normalized outputs to success and error output to failure through dominance/path and successor-argument checks. Deterministic printing preserves metadata. Tests include 32/64 plans, all endpoint-presence/end-mode combinations, extreme original int128/uint256 inputs, guarded Result flow and malformed/wrong-edge/bypass CFGs. Source production, remaining P16-26 validity/ownership checks, schema 12 and physical lowering remain separate."
      - "P16-24 (2026-10-19): slice.length observes shared/mutable slice values and returns target-sized uint for both .Len and len semantics, without element reads, holder consumption, a new borrow or signed conversion. Slice parameters reuse canonical P15 ReferenceMetadata; ref.is-valid accepts distinct slice types. Existing reference verification now covers length, verifies complete source/guard borrow/epoch identity, and requires the matching validity guard block and success edge to dominate the observation with no stale-edge bypass. InvalidReferenceGeneration remains independent of spatial failure handling and @noPanic. Tests cover source uint inference for all four authority/spelling combinations, 32/64 plans, proven/dynamic metadata, deterministic printing and malformed result/source/guard/epoch/endpoint CFGs. Source production is P16-34; schema 12 and binary lowering remain separate."
      - "P16-23 (2026-10-19): Semantic IR slice.copy-shared and slice.move-mut preserve bounded-reference identity and complete P15 borrow/lifetime/storage/epoch facts without element transfer or backing observation. Canonical ref.end-borrow accepts slice holders; copied shared holders end independently, while move/end invalidate the old holder and forwarded aliases. Generic SSA slice discard requires the canonical end marker. Lifetime verification moved into reference_lifetimes.go and includes parameter identity checks and fresh loop-holder boundaries. Tests cover 32/64 plans, proven/dynamic holders, independent shared ends, invalid authority/metadata, double end and use after move/end including forwarded block arguments. Complete slice CFG fact joins remain P16-26, source production P16-36, schema 12 and physical lowering separate."
      - "P16-25 (2026-10-19): slice.index-in-bounds retains bounded source and original signed/unsigned integer index; slice.element-place produces the matching P15 element Place with shared/read-only or mutable/read-write authority and complete source reference facts. Proven accesses require P14 proof provenance; runtime accesses require an immediate bounds predicate branch for the same slice/index, dominating success and canonical slice-index panic or IndexError.OutOfBounds failure. Dynamic temporal validity dominates predicate and Place formation independently of try. Existing P15 copy-trivial reads, trivial replacement and element reference borrows are reused without array copy/load or element ownership transfer. Ending/moving the source holder also invalidates derived element/sub-Places. Shared sequence failure verification was extracted from verifier.go into sequence_bounds.go. Tests cover 32/64 plans, all supported use modes, proven/runtime bounds and proven/dynamic validity, original wide carriers/extreme constants, typed fallible propagation, malformed metadata/SSA/authority/guards/epochs/failure paths and nontrivial element rejection. Complete verification remains P16-26, source production P16-35, schema 12 and physical lowering separate."
      - "P16-29 (2026-10-19): opt-in BuildOptions.MaxPackage 16 snapshots canonical Sema slice creation and index/use plans for the requested module before function construction. Missing/incomplete plans fail without re-inference or guessed proof; detached snapshots retain borrow/lifetime, original endpoints, source kind, index use and transfer action. Slice expression dispatch precedes P15 reference/array handling and retains explicit fixed-array borrow, reborrow, index use, dynamic-owner P18 and value/signature P16-36 capability gates. Every failed build returns no module, including after earlier function construction. Tests cover snapshot detachment and re-preparation, missing creation/index plans, module selection, unchanged P14/default and P15 boundaries, identical slice-free P15/P16 IR and unavailable dependency rejection. This is the route/precondition layer only: source producers P16-30..P16-36, schema 12 and binary slice lowering remain separate; no CLI/default capability is promoted."
      - "P16-38 (2026-10-19): sec-mlir-opt registers schema 12 with complete existing module/target metadata validation, retains schema 1–11 input compatibility and rejects unknown 13. EmitWithOptions selects output schema 12 through the existing verified emitter; Emit/zero options and CLI/build defaults remain schema 11. Output schema downgrades and unknown versions fail explicitly, and invalid Semantic IR or unsupported slice types produce no bytes. Emitter setup extracted into emitter_options.go. Tests cover deterministic 32/64 emission, unchanged default/explicit-11 output, real-tool round trips, accepted predecessor inputs, rejected 13 and retained slice/IR-verification gates. Full lit suite passes 118/118. P16-39/P16-41 subsequently add slice types and local reference/bounds extensions; dedicated slice operations, whole-function verifiers and emission remain P16-40 and P16-42..P16-45; no executable slice or physical representation support is claimed."
