    implemented:
      - "Per-atomic modification-order and RMW coherence representation (2026-11-17, §§16–17,52): validated canonical atomic calls publish detached ResolvedAtomicMemoryOperation analysis facts carrying source/callable, storage/referent provenance, established orders and separate outcome paths. Per-object total order and happens-before coherence are explicit semantic requirements, not an invented global order or runtime schedule. Store and successful RMW/CAS participate; Load and failed CAS are read-only and do not enter modification order. Only RMW success requires reading the immediately preceding modification. Independent CAS success/failure and default/immutable-alias orders are retained without rerunning order CTE. Canonical resource/Place relationships retain Same, Disjoint, MayAlias and Unknown; relationship proofs require an explicitly caller-qualified common ownership/execution state, and cross-analysis facts cannot alias by reused root numbers. Queries detach paths, nested types and projection data and reset with analysis. Invalid operations and ordinary same-named methods publish no facts; Fence has no atomic-object modification. This closes the analysis-fact representation point; release-sequence/fence/SeqCst/completion/race/FFI integration and physical atomic IR/lowering remain independently pending."
      - "Release-sequence head and RMW-chain representation (2026-11-18, §§18–20,25–28,52): every validated AtomicMemoryPath publishes an immutable AtomicReleaseSequenceEffect from its established order and modification/RMW facts. Release/AcqRel/SeqCst modifications start heads; every RMW continues all heads carried by its exact predecessor, including Relaxed/Acquire RMWs and successful CAS. Release RMWs both retain predecessor heads and start their own, preserving overlapping release sequences. Every plain Store breaks preceding heads, including a release Store that starts anew; Load and failed CAS are non-modifying and neither extend nor break chains, independently of their acquire/SeqCst read order. Continuation explicitly requires the same canonical live atomic object and a contiguous RMW path in modification order, without a same-execution restriction. Head source/callable/outcome provenance remains on the owning operation/path. These symbolic transfer constraints never infer runtime membership, a read-from edge or publication from source order, alias uncertainty or equal values. Source-backed tests cover every operation family on 32/64-bit plans and all analysis depths, independent CAS orders, overlapping heads, Store breaks, qualified identity, query mutation isolation and reset. This completes representation only; fence synchronization, runtime/lowering realization and the race solver remain separately pending."
      - "Fence/atomic, atomic/fence and fence/fence synchronization (2026-11-27, §§29–33): Analyzer.ResolveAtomicFenceSynchronization derives detached, deterministic synchronizes-with edges from canonical Sema operations/outcomes and an explicitly producer-qualified execution witness. Execution instances and sequenced-before positions, exact read-from modifications and normalized common live-object identity are required; neither source adjacency, equal values, callable names nor MayAlias/Unknown establishes publication. Release, AcqRel and SeqCst fence roles are supported. Contiguous RMW carriers preserve overlapping release heads, ordinary Store breaks earlier chains, successful CAS is RMW and failed CAS remains a read which can acquire but cannot carry a modification. Missing read-from/chain/identity is returned explicitly as unresolved. Duplicate identities/positions, impossible outcome references, dangling/non-modifying carriers, disjoint storage, cyclic RMW predecessors and competing immediate successors fail without partial output. Only reachable validated canonical fences are eligible and all fence facts reset with analysis. This closes the three synchronization-pattern rules in the memory-model query; it is conditional on the supplied execution evidence, not an invented program-wide execution or race-freedom proof. Data-race integration, completion publication and global SeqCst preservation remain below; physical atomic/fence lowering retains its separate owner in concurrency_atomics.yaml."
    remaining:
