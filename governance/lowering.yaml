  - id: lowering.abi-model
    area: platform-and-lowering
    status: planned
    integrated: "2026-08-16"
    document_revision: "1"
    summary: >-
      Adds the canonical Sec ABI model selected by each CompilationPlan,
      including Sec, C, and system calling-convention resolution,
      target-neutral parameter and return classification,
      aggregate/direct/indirect transport, MLIR-stage CallABIPlan construction
      and verification, native-versus-foreign representation boundaries, ABI
      signatures and fingerprints, and separate-compilation compatibility
      without duplicating FFI legality or source ownership semantics.
    rules:
      - rules/platform/abi.md
      - rules/platform/platform_model.md
      - rules/platform/ffi.md
      - rules/memory/layout.md
      - rules/memory/copy_move.md
      - rules/memory/ownership.md
      - rules/memory/borrowing.md
      - rules/memory/raw_pointers.md
      - rules/declarations/functions.md
      - rules/projects/modules.md
      - rules/compiler/semantic_ir.md
      - rules/mlir/sec_mlir.md
    remaining:
      - add canonical ABIIdentity and ABIModel selection to CompilationPlan and make downstream consumers use that resolved model instead of inferring ABI behavior from OS, architecture, target triple, host, or backend defaults
      - resolve Sec, C, and system calling-convention families independently and allow system to reuse C only where the active CompilationPlan explicitly declares physical equivalence
      - define canonical target-neutral ABIArgInfo and ABIValuePart representations for direct, indirect, ignored, split, alignment-sensitive, extension, and transport-attribute classification
      - separate semantic type identity, resolved physical representation, ABI transport representation, ABI signature identity, and final linker symbol identity throughout frontend and lowering metadata
      - implement position-sensitive ABI classification for parameters, returns, and foreign variadic arguments
      - implement scalar transport rules including sign and zero extension and target-dependent machine classes without treating ABI extension as a Sec numeric conversion
      - implement aggregate classification from canonical ResolvedLayout plus ABI-specific field and category rules without a universal size-only register threshold
      - represent indirect parameters and hidden return storage as compiler ABI machinery without introducing source RawPtr, ownership, borrow, lifetime, copy, or move semantics
      - consume complete resolved native Sec safe-reference representations rather than hard-coding ref T as one native pointer
      - classify RawPtr values using the active address-space raw-pointer representation without attaching ownership, lifetime, bounds, or non-null guarantees
      - classify native Sec descriptors, structs, enums, tagged unions, Result, Option, and callable values from their canonical resolved representations without recreating their layout rules in the ABI subsystem
      - keep ABI physical representability separate from FFI source-position legality and reject any implicit string, slice, list, or collection decomposition that is not explicitly defined by FFI
      - "resolve compiler-known C scalar physical representation through the active C ABI and keep C:: identities distinct from physically similar Sec scalar types"
      - integrate C struct, union, enum, bitfield, flexible-array, function-pointer, and foreign-vararg representation and classification with one coherent C ABI identity while leaving legality to ffi.md
      - implement verified FFI ref and ref mut boundary adaptation from call-bounded Sec borrow semantics to the selected foreign address representation without changing native Sec reference representation
      - implement native callable and C::fn as distinct representation families and construct callback thunks as explicit two-sided ABI bridges validated by FFI and Sema
      - make callback and other ABI bridges materialize only semantic adaptations already approved by owning rules and never invent conversions or ownership changes to fit a foreign signature
      - build whole-call assignment state after classification so register and resource exhaustion, stack fallback, split-value rules, hidden parameters, and outgoing stack layout follow the selected ABI
      - represent stack argument offsets, sizes, alignments, and call-stack requirements explicitly in the final ABI plan rather than recomputing them approximately in later lowering
      - keep target-neutral ABI classification independent of Sec MLIR and LLVM encoding and avoid requiring concrete physical register names unless an owning target rule needs them
      - retain high-level semantic callable shape and calling-convention intent before Sec MLIR ABI lowering rather than materializing the final physical signature prematurely
      - construct and verify CallABIPlan objects during the canonical Sec MLIR ABI-lowering stage from resolved semantic representations and the active ABIModel
      - verify ABI-lowered Sec MLIR functions and calls against CallABIPlan for calling convention, return transport, hidden parameters, parameter part ordering, stack placement, variadic state, and required attributes
      - prevent lower MLIR, LLVM dialect, LLVM IR, and backend stages from reclassifying a competing Sec ABI after the canonical ABI plan has been verified
      - derive deterministic canonical ABISignature values for every concrete callable crossing a binary ABI boundary
      - derive stable ABI fingerprints from canonical physical contract facts and ABI and schema identity while excluding source locations, display names, and other presentation-only metadata
      - implement semantic ABI compatibility checks distinct from Sec type and callable compatibility and permit fingerprint equality only as an implementation optimization for canonical contract comparison
      - persist sufficient semantic declaration identity, semantic signature identity, ABI signature, ABI fingerprint, ABI schema and model identity, and CompilationPlan ABI identity for separate compilation
      - reject stale or incompatible native Sec artifacts before or during linking when persisted ABI metadata proves caller and callee physical contracts are incompatible
      - introduce a native Sec ABI schema and version identity without promising binary compatibility across arbitrary Sec 0.1 compiler revisions
      - keep native Sec ABI schema identity distinct from selected C and system ABI identity
      - invalidate ABI-dependent lowering and artifacts when layout, parameter or result signature, calling convention, reference representation, ABI model or schema, hidden parameters, target, or other ABI-relevant CompilationPlan facts change
      - avoid downstream ABI invalidation solely for implementation-body edits that preserve the complete canonical ABI contract where dependency tracking can prove equivalence
      - preserve semantic-to-physical parameter and result correspondence for diagnostics and debug-information generation even when ABI lowering introduces hidden storage, widened transports, split parts, or machine-only temporaries
      - add deterministic scalar, aggregate, reference, descriptor, C ABI, system ABI, callback, variadic, hidden-parameter, stack-layout, separate-compilation, stale-artifact, multi-Variant, and MLIR-boundary regression tests
      - add cross-compilation tests proving ABI selection and classification come from the CompilationPlan rather than the compiler host
      - add determinism tests proving identical ABI classification, CallABIPlan, ABISignature, ABIFingerprint, and diagnostics independent of map order, source traversal, and compiler worker scheduling
      - update implementation-status verification commands when the first canonical ABI-model vertical slice is integrated
    excluded:
      - source ownership, borrow, copy, move, and destruction semantics
      - FFI source-position legality and foreign resource ownership
      - general storage-layout ownership
      - linker symbol spelling, mangling, dead stripping, and export policy
      - stable native Sec ABI compatibility across arbitrary compiler releases
      - implicit string or collection decomposition for C ABI
      - hard-coded physical register names in the target-neutral ABI classification model
