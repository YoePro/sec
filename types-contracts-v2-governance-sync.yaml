sync_actions:
- 'Merge these stable-ID entries into the canonical governance owner for rules/types/contracts.md without
  discarding existing implementation evidence, history, or commit references.

  '
- 'Register the canonical owner in governance/index.yaml if contracts.md does not already have one.

  '
- 'After migration, retire duplicate mutable status from legacy implementation status files so governance/
  remains the canonical machine-readable ledger.

  '
- 'Verify language-rulebook-status.md identifies rules/types/contracts.md as the current revision-2.0
  normative contracts rulebook.

  '
machine_contract:
  integration_required_fields:
  - id
  - status
  - summary
  - rules
  - implemented
  - remaining
  - identified_bugs
  - evidence
  status_values:
  - implemented
  - partial
  - unimplemented
  bug_severity_values:
  - low
  - medium
  - high
  - critical
  bug_identity_rule: A bug is defined once under the most directly affected integration. Other integrations
    reference it through bug_refs.
