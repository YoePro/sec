schema_version: 1
area: platform
purpose: Target profiles, hardware access, interrupts, and inline assembly.
integrations:
  - id: platform.hardware-register-access
    area: platform-register-access-and-lowering
    status: planned
    reviewed: "2026-08-28"
    document_revision: 1.0
    repository_baseline: "6a63b37"
    summary: >-
      Implements canonical Sec hardware-register access semantics above register layout and volatile access,
      including safe implicit field observation, explicit register Read/Write, shadow state, hardware
      resource/endpoint identity, alias operations, transaction planning, width/alignment/footprints,
      coherence, ordering/completion, access context, runtime mappings, fault semantics, and verified
      Semantic IR/MLIR lowering.
    rules:
      - rules/platform/hardware-register-access.md
      - rules/declarations/registers.md
      - rules/platform/volatile.md
      - rules/platform/fixed-address-bindings.md
      - rules/platform/target_profiles.md
      - rules/memory/storage.md
      - rules/memory/ownership.md
      - rules/memory/borrowing.md
      - rules/memory/destruction.md
      - rules/memory/raw_pointers.md
      - rules/compiler/semantic_ir.md
      - rules/mlir/sec_mlir.md
    confirmed_existing_foundations:
      - register[N] is already canonical as a nominal fixed-width bit-layout type independent of MMIO
      - register field permissions already include read-write default, read-only, and write-only in the v2 rulebook
      - register frontend already recognizes W1C, W0C, and destructive-read semantics in the current design/implementation work
      - "@address already implies hardware-facing volatile access and canonical region validation"
      - volatile.md already separates compiler ordering from hardware ordering and delegates stronger register/device transaction semantics
      - Sec ownership/destruction already forbids hidden runtime ownership tracking and implicit hardware access at register-view destruction
    remaining:
      - rename canonical destructive-read source spelling from clear-on-read to read-clear across parser/sema/formatter/tests/status
      - add read-set and the complete write-one/write-zero clear/set/toggle modifier family
      - add shadow and noshadow field modifiers plus register-level default inheritance
      - implement shadow observed-state and pending-logical-write analysis without a global runtime manager
      - add compiler-known hardware register Read() returning a detached coherent snapshot
      - add compiler-known shadow commit Write() and legal whole-register Write(value) semantics
      - implement safe-only implicit hardware field observation with collateral-effect rejection
      - introduce canonical HardwareResourceIdentity, EndpointIdentity, and physical operation identities
      - model endpoint kinds including memory-mapped, port-mapped, instruction-encoded, runtime-mapped, and target-defined
      - represent read/write aliases and set/clear/toggle operations by resource effects rather than address heuristics
      - implement RegisterOperationPlanner candidate enumeration, validation, and deterministic selection
      - model legal read/write widths independently from field/register widths and reject arbitrary narrowing/widening/splitting/merging
      - model required alignment and runtime view alignment validation
      - model physical read/write transaction footprints and collateral side-effect analysis
      - implement coherent multi-step read plans, including target-defined latch sequences
      - carry operation atomicity and failure-atomicity contracts
      - represent hardware ordering and completion edges separately from generic volatility
      - lower semantic ordering/completion requirements to target-specific barriers/read-backs/stronger operations
      - add context-sensitive hardware access requirements for privilege, security, execution unit/mode, virtualization, and acquired authority
      - "extend @address to one named canonical endpoint expression while retaining validated numeric canonical-linear form"
      - implement compiler-known move-only runtime mapped hardware region resources
      - implement lifetime-bounded checked RegisterView[T] derivation from runtime mappings
      - ensure RawPtr does not acquire endpoint identity, authority, ownership, alias, or transaction semantics implicitly
      - model legal-but-fault-capable hardware operations without converting ordinary hardware access automatically to Result
      - model explicit checked mapping/access failure separately from architecture/platform faults
      - preserve special operations, shadow effects, footprints, context, ordering, completion, and fault facts through Semantic IR and Sec MLIR
      - reject any target lowering that cannot materialize the required hardware semantics exactly
      - add LSP hover/diagnostics for resource, endpoint, shadow, access widths, implicit-read safety, aliases, and context requirements
    required_test_families:
      - field permissions and specialized read/write semantics
      - safe implicit field observation and destructive collateral rejection
      - explicit Read snapshots and no duplicate hardware access from detached values
      - shadow field/register inheritance, Unknown/Known state, pending operation commits, and no automatic write-back
      - read/write aliases and resource identity
      - width, alignment, footprint, and coherent multi-step accesses
      - ordering, completion, and posted writes
      - access context and runtime-acquired authority
      - runtime mapping ownership and RegisterView lifetime
      - fault-capable versus Result-returning operations
      - Semantic IR/MLIR preservation and target lowering
    corrections_applied:
      - rules/corrections/applied/hardware-register-access-cross-rulebook-correction-20260828.md
      - rules/corrections/applied/stdlib-hw-correction-20260828.md
  - id: platform.volatile
    area: platform-memory-and-volatile-access
    status: partial
    integrated: "2026-08-27"
    document_revision: 1
    repository_baseline: "fc8d632"
    summary: >-
      Implements Sec volatile physical-storage semantics, including explicit
      RawPtr VolatileRead/VolatileWrite operations, canonical @address region
      validation, target access contracts, address-space, width, alignment and
      ordering preservation, optimizer constraints, representation eligibility,
      and lowering/tooling support. The canonical compiler-known RawPtr frontend
      slice is integrated; physical eligibility, CompilationPlan validation,
      Semantic IR, lowering and target realization remain.
    rules:
      - rules/platform/volatile.md
      - rules/platform/fixed-address-bindings.md
      - rules/platform/hardware-register-access.md
      - rules/platform/platform_model.md
      - rules/platform/target_profiles.md
      - rules/foundations/attributes.md
      - rules/memory/memory_model.md
      - rules/memory/raw_pointers.md
      - rules/declarations/registers.md
      - rules/compiler/semantic_ir.md
      - rules/mlir/sec_mlir.md
    code:
      - internal/sema/compiler_known_members.go
      - internal/sema/analyzer.go
      - internal/sema/call_graph.go
      - cmd/lsp/main.go
    implemented:
      - accepted @address bindings retain Addressed and Volatile metadata while binding mutability remains separate
      - ordinary RawPtr Read, Write, Offset, AddBytes and Difference remain distinct compiler-known operations
      - RawPtr[T].VolatileRead() has stable identity CKM-RAWPTR-VOLATILE-READ and resolves to T
      - RawPtr[T].VolatileWrite(value) has stable identity CKM-RAWPTR-VOLATILE-WRITE and resolves to void
      - both volatile operations require unsafe and reject invalid arity or value types
      - RawPtr[void] direct volatile read and write are rejected before value materialization
      - successful volatile calls publish ordered volatile-read or volatile-write effect sites
      - LSP completion, semantic classification and hover consume the same compiler-known registry entries
      - LSP completion marks the operations unsafe and effectful while hover exposes their stable identity and effect
    incorrect_or_partial:
      - current accepted @address Symbol.Volatile metadata is not end-to-end volatile support
      - volatile frontend eligibility is currently limited to concrete non-void pointee and assignment compatibility
      - physical VolatileReadable and VolatileWritable eligibility is not CompilationPlan-sensitive yet
      - the effect sites do not yet carry resolved physical-access contracts or occurrence identities into Semantic IR
    remaining:
      - introduce canonical volatile/external-storage access semantics distinct from type qualification
      - keep ordinary RawPtr Read/Write distinct from explicit volatile access
      - make every @address binding resolve against an applicable canonical region/storage contract for its complete extent
      - reject numerically valid @address bindings not covered by an applicable target region
      - permit Hosted @address only for explicitly modeled compatible mapped regions rather than arbitrary process addresses
      - ensure unsafe cannot waive @address region validation
      - model physical access contracts with address domain/space, permissions, widths, alignment, byte order, ordering, memory attributes, and side effects
      - support non-unified address-space models without compiler-host address assumptions
      - preserve exact physical access width and reject illegal split, merge, narrow, or widen transformations
      - validate @address alignment statically and preserve dynamic RawPtr alignment obligations
      - resolve MMIO/device byte order from target/device contracts rather than compiler-host endian behavior
      - keep volatile distinct from cacheability, coherence, DMA ownership, atomics, synchronization, and hardware barriers
      - preserve distinct volatile reads/writes against removal, duplication, speculation, hoisting, coalescing, and deduplication
      - keep volatile from acting as a global compiler barrier and emit stronger ordering only when its contract requires it
      - represent compiler ordering and hardware ordering separately
      - prevent volatile from substituting for shared-memory atomic or synchronization semantics
      - preserve stronger register/device effects without redefining their transaction model in volatile.md
      - allow read-modify-write only when the complete owning contract defines a semantics-preserving operation
      - introduce CompilationPlan-sensitive volatile readable and writable eligibility
      - reject physical materialization that bypasses value domains, ownership, validity, destruction, or runtime invariants
      - require explicit physical layout/access contracts for aggregate volatile access
      - prevent unconstrained generic T from implicitly satisfying volatile eligibility
      - ensure @address declarations themselves perform no physical access or implicit initialization
      - carry external-storage/volatile effects and resolved contracts through Semantic IR and Sec MLIR
      - make target lowering reject impossible physical materialization rather than approximate semantics
      - ensure volatile access has no intrinsic Sec runtime dependency
      - consume target/device region knowledge without making volatile.md own its package format
      - make LSP and CLI use the same CompilationPlan region/access facts
      - add diagnostics for region, space, permission, width, alignment, representation, unsafe, ordering, and lowering failures
      - add the complete volatile, @address, RawPtr, representation, physical-access, ordering, device, IR, Hosted, and cross-target regression matrix
      - update verification commands after the first end-to-end volatile vertical slice is implemented
    corrections_applied:
      - rules/corrections/applied/foundations-correction-20260827.md
      - rules/corrections/applied/platform-correction-20260827.md
      - rules/corrections/applied/correction31-20260828.md
    governance_reconciliation:
      - keep frontend.fixed-address-bindings as the @address-specific slice and cross-link it to this integration
      - keep this existing platform.volatile integration canonical rather than adding duplicate frontend.volatile-access governance
      - synchronize rules/compiler/compiler_known_members.md with rules/platform/volatile.md
      - do not treat current Symbol.Volatile metadata as end-to-end volatile support
    excluded:
      - logical register-field transaction semantics
      - register physical read groups and selective field observation
      - register snapshot and destructive-read grouping semantics
      - interrupt semantics
      - DMA ownership protocol and cache-maintenance API definitions
      - atomic memory-order semantics
      - target/device knowledge-pack format
      - general C-style volatile types or @volatile source syntax
  - id: platform.interrupts-v1
    area: platform-interrupts
    status: planned
    integrated: "2026-08-29"
    document_revision: "1.0"
    repository_baseline: fafd8cb
    summary: >-
      Tracks Sec 0.1 interrupt semantics across platform identity/binding, ISR
      roots, priority/preemption/nesting/masking, interrupt classes,
      source/route/entry lifecycle, generated claim/dispatch/completion,
      configuration, ISR-safe effects, concurrency, stack/resources,
      startup/linking, and compiler/LSP analysis.
    rules:
      - rules/platform/interrupts.md
      - rules/foundations/attributes.md
      - rules/platform/platform_model.md
      - rules/platform/target_profiles.md
      - rules/platform/hardware-register-access.md
      - rules/memory/memory_model.md
      - rules/memory/destruction.md
      - rules/control-flow/defer.md
      - rules/compiler/initialization.md
      - rules/compiler/linking.md
      - rules/analysis/isr_analysis.md
      - rules/analysis/stack_analysis.md
    implemented: []
    remaining:
      - add canonical platform interrupt identities and resolution into CompilationPlan, including domains, logical sources, routes, entries, classes, bindability, ABI, priority/masking, pending/active, claim/completion, stack domains, profiles, and provenance
      - resolve @interrupt named identities and raw numeric bindings through the same canonical platform interrupt model
      - reject ordinary calls to ISR entry functions while preserving ordinary reusable @interruptSafe helpers
      - model directional MayPreempt, MayNest, and MayReenter relations independently of raw numeric priority ordering
      - model target entry/return mask effects, unmaskable classes, and effective masking relationships
      - model external IRQ, software-triggered, fault/exception, non-maskable, and target-defined interrupt classes
      - distinguish pending and active state and avoid treating repeated occurrence as implicit reentrancy or counted queueing
      - support target-defined synchronous/asynchronous classes and handler context shapes
      - distinguish logical interrupt source, route, and physical entry for multiplexed controllers
      - model peripheral source generation, controller pending/active, claim/accept, source service, and completion/EOI as distinct concepts
      - generate canonical claim/dispatch/completion around source handlers where the resolved platform fully defines the controller lifecycle
      - keep peripheral-specific source service device-owned and do not invent device protocols from interrupt metadata
      - carry interrupt completion obligations into canonical hardware-register ordering/completion planning before interrupt return
      - add target-defined interrupt control capabilities for enable/disable, pending, priority, software trigger, routing/affinity, and masking
      - ensure @interrupt binding alone never enables, unmasks, clears pending, configures priority, starts a peripheral, or otherwise activates delivery
      - support structured save/apply/restore masking that restores exact previous relevant state on ordinary Sec exits
      - enforce noPanic, noAlloc, and noBlock transitively through direct/indirect calls, generics, callbacks, FFI, runtime helpers, defer, destruction, cleanup, error paths, and compiler helpers
      - verify @interruptSafe as a compiler-checked contract while allowing ordinary helpers proven equivalent for the active CompilationPlan
      - ensure unsafe cannot waive ISR execution-context requirements
      - integrate canonical ISR/FFI contracts and preserve ISR context across synchronous foreign callbacks
      - integrate interrupt execution with the canonical concurrency model without creating a separate interrupt memory model
      - permit masking-based exclusion only for execution contexts the resolved platform proves excluded
      - reject local interrupt masking as universal protection against other cores, non-maskable execution, DMA, devices, or other external actors
      - allow atomic/nonblocking synchronization in ISR only when target lowering and race/deadlock/progress proofs satisfy the ISR contract
      - reject blocking synchronization and ISR-incompatible atomic emulation
      - support preallocated nonblocking ISR handoff structures such as queues/ring buffers
      - integrate roots, nesting, ABI wrappers, dispatchers, and physical stack topology with canonical stack analysis
      - enforce interrupt stack budgets using exact/upper-bound/unknown/unbounded proof semantics and preserve UnknownLimit versus NoDeclaredLimit
      - support resolved bounded-execution/realtime requirements without making numeric WCET mandatory for every Sec 0.1 ISR
      - include generated wrappers, controller lifecycle, cleanup, and target helpers in applicable resource proofs
      - preserve ordinary Sec defer/destruction ordering on normal ISR exits and prevent interrupt return from bypassing required cleanup
      - keep machine faults/exceptions distinct from ordinary Result/error exits and do not promise normal cleanup after target faults unless the target contract does
      - provide canonical platform/device interrupt catalogs exposing named Interrupt.* identities
      - validate platform interrupt registry data before freezing CompilationPlan
      - generate target-correct vector tables, entry wrappers, dispatchers, ABI adapters, and required platform interrupt data
      - treat generated vector tables, wrappers, dispatchers, and source handlers as explicit link roots/retained artifacts
      - keep source visibility separate from ISR binary reachability and avoid requiring general source-level weak handlers
      - contribute required interrupt infrastructure to ProgramInitializationPlan without conflating infrastructure setup with delivery enablement
      - model early-startup interrupt availability using runtime/context facts actually established in that phase
      - make interrupt integration Variant-scoped, deterministic, cross-compilation safe, and based only on target CompilationPlan/LinkEnvironment facts
      - invalidate dependent ISR analysis, generated artifacts, initialization requirements, and LinkPlan work when relevant platform interrupt semantics change
      - integrate interrupt resolution and ISR results consistently across compiler builds, sec analyse, LSP, separate-compilation summaries, and incremental recomputation
      - produce provenance-rich diagnostics that identify logical interrupt roots and distinguish Invalid, Unproven, and tooling Pending
      - add complete semantic, analysis, target-integration, startup/linking, cross-compilation, incremental, false-positive, and determinism regression coverage
    excluded:
      - platform registry file syntax for interrupt metadata
      - logical hardware-register transaction semantics
      - hardware-register access width, ordering, completion mechanism, and fault semantics
      - a separate interrupt-specific memory model
      - atomic memory-order definitions
      - race-analysis algorithm definitions
      - deadlock-analysis algorithm definitions
      - stack-analysis algorithm definitions
      - a universal WCET algorithm
      - one universal numeric priority convention
      - one universal interrupt-controller model
      - one universal InterruptContext source type
      - general source-level weak linkage
      - hidden interrupt activation caused solely by handler declaration
    required_tests:
      - named interrupt identity resolves through CompilationPlan
      - raw numeric interrupt resolves through canonical platform metadata
      - unknown or non-bindable interrupt identity is rejected
      - duplicate active interrupt binding is rejected
      - mutually exclusive target bindings are accepted when only one survives resolution
      - bound ISR entry cannot be called as an ordinary function
      - directional preemption, nesting, and self-reentry are modeled independently
      - pending while active does not imply self-reentry
      - ordinary masking does not exclude non-maskable execution
      - structured masking restores exact previous state
      - runtime priority or route mutation invalidates or widens dependent proofs
      - fault/exception is not lowered as ordinary Result propagation
      - shared physical entry dispatches distinct logical sources
      - generated claim/dispatch/completion is emitted where required
      - spurious/no-source claim does not fabricate a handler invocation
      - peripheral source service remains distinct from controller completion
      - required hardware completion is satisfied before interrupt return
      - "@interrupt declaration alone does not enable or configure delivery"
      - enable and disable do not imply clear-pending
      - SetPending remains distinct from SoftwareTrigger where target distinguishes them
      - panic, dynamic allocation, and blocking are rejected from ISR
      - preallocated non-allocating operations are accepted from ISR
      - "@interruptSafe is verified transitively"
      - ordinary helper with equivalent compiler proof is accepted from ISR
      - unsafe does not waive ISR requirements
      - synchronous FFI callback remains under ISR context
      - safe defer/destruction is accepted and unsafe cleanup is rejected
      - compiler-generated ISR-incompatible helper rejects otherwise simple source
      - volatile shared memory is not accepted as synchronization
      - target-supported atomic ISR operation is accepted and incompatible atomic emulation is rejected
      - single-core masking can prove exclusion where the platform establishes it
      - local masking does not protect against another core or DMA
      - blocking mutex acquisition is rejected
      - nonblocking synchronization requires complete proofs
      - spin waiting on a preempted owner is rejected
      - preallocated ISR queue/ring-buffer handoff is accepted when contracts succeed
      - nested stack accounting uses physical stack topology and separate stack domains are not double-counted
      - generated ABI/wrapper stack cost is included where required
      - finite stack budget succeeds only with sufficient proof and unknown stack yields Unproven
      - bounded recursion is accepted where proven and unbounded recursion is rejected where a finite bound is required
      - noBlock polling remains distinguishable from bounded execution
      - vector table, wrapper, dispatcher, and source ISR remain link-live where required
      - startup establishes interrupt infrastructure without implicitly enabling delivery
      - early ISR is checked against early runtime/profile facts
      - Variant-specific interrupt artifacts remain isolated
      - cross-compilation never uses host interrupt ABI/vector assumptions
      - LTO preserves required interrupt roots, lifecycle, ABI, and completion
      - LSP and compiler resolve the same logical interrupt identity
      - diagnostics preserve logical root/provenance and distinguish Invalid, Unproven, and Pending
      - relevant platform edits invalidate dependent ISR work while unrelated edits preserve unrelated caches
      - stale separate-compilation summaries cannot serve as positive ISR-safety proofs
      - interrupt analysis and generated artifact identities are deterministic
  - id: frontend.fixed-address-bindings
    area: frontend-analysis-and-lowering
    status: partial
    integrated: "2026-08-13"
    summary: >-
      Tracks Sec 0.1 @address hardware bindings as fixed-address storage
      contracts independent from register type identity and storage origin.
    rules:
      - rules/platform/fixed-address-bindings.md
      - rules/platform/volatile.md
      - rules/platform/hardware-register-access.md
      - rules/memory/storage.md
      - rules/declarations/registers.md
      - rules/memory/unsafe.md
    code:
      - internal/ast/ast.go
      - internal/parser/parser.go
      - internal/sema/types.go
      - internal/sema/analyzer.go
      - internal/sema/place.go
    tests:
      - internal/parser/parser_test.go
      - internal/sema/analyzer_test.go
      - internal/sema/allocation_test.go
    implemented:
      - parse @address(...) on explicitly typed register bindings
      - reject ordinary initializers on addressed bindings
      - require the current source form to use an integer-literal address
      - retain addressed and volatile semantic markers
      - represent AddressStability.Fixed independently from conservative Unknown storage origin for platform-owned hardware without a stronger target contract
      - reject field writes through non-mut addressed register bindings
    remaining:
      - propagate AddressStability.Fixed independently from storage origin through Place, Semantic IR, MLIR, and tooling facts
      - require every binding, including raw numeric spelling, to resolve against a canonical target region covering its complete extent
      - validate target address domain/space, alignment, extent, access width, memory space, layout, representation, availability, and permissions
      - reject unmodeled Hosted process addresses and ensure unsafe cannot waive canonical region validation
      - accept arbitrary compile-time-known integer address expressions rather than only integer literals
      - accept exactly one named canonical Platform or Project endpoint expression while retaining the validated numeric canonical-linear form
      - diagnose statically known incompatible overlapping bindings
      - preserve volatile semantics through impl receivers and all field/property access paths
      - lower volatile loads/stores and safe addressed field updates
      - preserve read-only, write-only, W1C, W0C, canonical read-clear, nested-register, shadow, and byte-order semantics at addressed boundaries
      - specify and implement the separate checked or unsafe dynamic-address mechanism
      - add complete target-profile, diagnostics, LSP, IR, lowering, and end-to-end coverage
    verification:
      - command: go test ./internal/parser -run Register -count=1
        result: passed
      - command: go test ./internal/sema -run 'Register|StorageOrigin' -count=1
        result: passed
  - id: compiler.platform-model
    area: compiler-platform-and-tooling
    status: planned
    summary: >-
      Adds the canonical Sec platform registry and resolver, producing immutable
      per-Target/per-Variant CompilationPlans with typed architecture, CPU, Device,
      memory, runtime, execution, ABI, link, source-selection, capability,
      fingerprint, diagnostic, and LSP-invalidation facts without host-dependent
      target guessing or duplicated downstream platform resolution.
    rules:
      - rules/platform/platform_model.md
      - rules/platform/target_profiles.md
      - rules/platform/interrupts.md
      - rules/projects/projects.txt
      - rules/compiler/compiler.md
      - rules/compiler/compiler_pipeline.md
      - rules/memory/storage.md
      - rules/memory/layout.md
      - rules/platform/ffi.md
      - rules/declarations/registers.md
      - rules/platform/fixed-address-bindings.md
      - rules/concurrency/concurrency_runtime_model.md
      - rules/concurrency/concurrency_memory_model.md
      - rules/concurrency/concurrency.md
      - rules/analysis/stack_analysis.md
      - rules/analysis/data_races.md
      - rules/analysis/deadlock_analysis.md
      - rules/analysis/isr_analysis.md
      - rules/tooling/lsp.md
      - rules/tooling/diagnostics.txt
    governance_reconciliation:
      - Selected immutable CompilationPlan facts are the sole target and runtime capability source for concurrency validation and lowering.
      - semantic Atomic[T] eligibility is distinct from concrete layout, operation, order, native/emulated, blocking and interrupt-safety capability in the selected CompilationPlan
