      - id: formatter-imports-and-file-layout
        status: implemented
        rules:
          - § 13
          - § 14
          - § 29(7)
        requirement: >-
          Implement the canonical import region and top-level file layout.
          Preserve attached comments, sort imports canonically within their
          explicit groups alphabetically by logical path without classifying
          import origins, and never reorder ordinary top-level declarations.
        acceptance:
          - Imports are never removed by ordinary formatting.
          - Attached import comments move with their import.
          - Ordinary top-level declarations retain source order.
        implemented:
          - "2026-10-03 (internal/formatter/import_region.go): every top-level import is gathered into one canonical region after the module declaration and before the first ordinary declaration (including its attributes and parser-attached leading comments); one import keeps single-import form, two or more form one group"
          - "MD-033 (2026-10-12): imports are sorted alphabetically by logical path, never by alias and never by a guessed standard-library, project or platform origin; blank-line-separated groups of one import group, with or without headings, are kept in source order and sorted internally without exchanging imports; sorting needs no module lookup, stdlib inventory or CompilationPlan (TestFormatImportsSortWithinExplicitGroups, TestFormatImportRegionHasNoImportClasses); duplicates and apparently unused imports are kept"
          - parser-attached leading, documentation, and trailing line comments move with their import; a comment the pass cannot attribute to exactly one import (dangling group comments, inline block comments, group-level comments) leaves the source unchanged, as does any parse error or a line holding more than one import item
          - ordinary top-level declarations keep source order
          - "MD-055 import group headings (2026-10-12, formatter.md § 13(11)-(14)): a single grouped import declaration whose blank-line-separated runs start with standalone `//` heading comments keeps its runs in source order, sorts imports only within each run, places each heading directly above its run's first import (removing blank lines between them) and separates runs with one empty line; comments between imports of a run lead the next import and trailing line comments stay with their import; a comment that ends a run or the group, an inline block comment, or headings across several import declarations leave the region unchanged; verified for widths 2, 4 and 6 and idempotence (TestFormatImportGroupHeadings)"
