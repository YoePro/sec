schema_version: 1
area: concurrency-blocking
purpose: Blocking operations and blocking-context policy.
integrations:
  - id: frontend.blocking-effects
    area: frontend-blocking-effect-analysis
    status: partial
    revised: "2026-11-10"
    rules:
      - rules/concurrency/blocking.md
      - rules/foundations/attributes.md
      - rules/concurrency/channels.md
      - rules/analysis/effect_analysis.md
      - rules/tooling/lsp.md
    code:
      - internal/sema/analyzer_noblock.go
      - internal/sema/analyzer.go
      - internal/sema/analyzer_closure.go
      - internal/sema/call_graph.go
      - cmd/lsp/blocking_hover.go
      - cmd/lsp/attributes.go
      - cmd/lsp/call_graph_hover.go
    tests:
      - internal/sema/noblock_test.go
      - cmd/lsp/blocking_hover_test.go
      - testdata/tooling/blocking_hover.sec
    implemented:
      - "blocking effects (2026-10-05): the call graph keeps a separate blocking-effect summary (BlockSummary) over synchronous edges; represented waiting operations (await, Sender.Send, Sender.SendRevocable, Receiver.Receive, Mutex.Lock, select without default) are direct sites, while TrySend, TryReceive, TryLock, a select with default, and operations inside select branches are not; extern calls without a trusted @noBlock contract and calls with unknown targets are conservative sites; @noBlock is verified from it (frontend.attributes-v2)"
      - LSP declaration and resolved-call hover expose the canonical BlockSummary may-block result, its selected shortest synchronous cause path and source locations (2026-11-10). Completed the existing basic line by distinguishing unverified foreign calls and unresolved targets as conservative unknown blocking behavior, and retaining every direct cause at the selected path endpoint instead of hiding all but the first. A mixed endpoint now presents both unknown foreign behavior and its represented Mutex.Lock wait. The renderer is extracted from attributes.go into blocking_hover.go; ordinary function and guarantee hovers share it. Source-backed tests cover pure/direct/transitive/recursive/deferred/foreign/unknown/mixed callables and exact callee selection at a call occurrence. This is presentation of existing compiler facts, with no new wait classification, thread semantics or target-policy proof.
    remaining:
      - represent and classify join (Task, Thread, Process, Command), ProcessObserver.Wait, pipe and IPC waits, SharedValue.Lock, timer waits, and Context-based or duration Lock overloads
      - separate task suspension (maySuspend) from physical blocking per target profile
      - feed blocking facts into ISR, deadlock, guard-across-wait, and executor-starvation analysis
    required_tests:
      - each represented waiting operation blocks and its Try form does not
      - select with default is nonblocking
      - blocking reached through a spawned task does not block the spawner
    verification:
      - command: go vet ./cmd/lsp
        result: passed on 2026-11-10
      - command: go run ./cmd/compiler check testdata/tooling/blocking_hover.sec
        result: passed on 2026-11-10; zero errors and zero warnings.
      - command: go test ./cmd/lsp -run "TestBlockingHover|TestAttributeHover|TestHoverShowsCallGraphReachabilityAndRecursion" -count=1
        result: passed on 2026-11-10; 16.118s. All nine source callables and a resolved call-site hover agree with canonical summaries; mixed evidence and unknown/foreign explanations are visible. Existing attribute and call-graph hover tests pass. The original renderer fails the valid-source regression on the unexplained foreign effect. Remaining 4 to 3.
