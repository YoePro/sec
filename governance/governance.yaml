    implemented:
      - statistics and remaining-point selection (-file, -id, -point, -random, -exclude, -json)
      - fmt harmonizes fragments into one canonical layout without changing any decoded value, and reports type hazards that only fmt -fix-types rewrites
      - set, add, remove, move, verify, repath and new edit exact integrations, print a unified diff, write only with -write, and fail closed on unknown, ambiguous or out-of-range targets
      - check validates the ledger (loading, fragment header, index.yaml fragment list, unique IDs, id/status, status vocabulary, verification items, checklist item shapes, merged list items) with file, line and integration ID, and edit commands refuse changes that add a problem; its first run found and fixed 24 problems
      - "library scope (2026-10-10): index.yaml fragments with implementation_scope: library (stdlib.yaml) are not compiler implementation; yamlstatus statistics exclude their integrations and checklist items, report them on a separate Not counted line, and keep their points selectable"
      - "HTML reporting (-html): a complete escaped document using the sec-lang.com manual layout, shared stylesheet/logo, navigation/sidebar/breadcrumb/footer, compiler-only overview and progress, separate integration/checklist/metadata tables and explicit library exclusion. Embedded html/template keeps markup separate from Go; no plain-text prefix or printf interpretation of generated percentages. Source-backed CLI tests cover report output, escaping, empty states, stable metadata ordering and unchanged library scope; text-statistics regression uses nonempty input and current labels."
      - "-uses PATH (2026-11-01): read-only reverse references in code/tests/rules with exact YAML scalar file/line, integration ID, status and field; includes completed and library integrations without requiring remaining points or source-file existence. Exact normalized repository-relative/native absolute paths, stable human/JSON output, -dir/-file/-id filters, empty reports and malformed/incompatible/ambiguous-request rejection are covered. Structured rule requirements and prose are not path references; source files and YAML stay unchanged (IDEAS.md §3)."
      - "-paths (2026-11-04): read-only existence checks for code/tests/rules, including evidence and nested plan lists, completed and library integrations, with exact YAML file/line, owner, status, field and original path. Normalized repository-relative and native absolute paths, symlink handling, deterministic human/JSON output, -dir/-file/-id scope and optional -go filter for internal/cmd Go paths are supported. Structured rule requirements and paragraph references are not filenames. Findings return a full report and nonzero status; other filesystem errors fail without false missing findings. No source or YAML edits; IDEAS.md section 2 complete."
      - "-grep TEXT (2026-11-04): read-only literal case-insensitive search of all top-level remaining checklist items, including library owners, decoded Unicode/multiline strings and structured item ID/description/expectation values. Reports retain original point, exact YAML file/line, owner/status and 1-based checklist index/count in deterministic human/JSON output. -dir/positional-directory/-file/-id filters, successful empty reports, unknown/ambiguous IDs and incompatible/empty-request rejection are covered. Metadata, mapping keys, implemented/partial and nested plan notes are excluded. Selection shares its existing item-location lookup with search. No source/YAML changes during queries; IDEAS.md section 9 complete."
      - Versioned -snapshot FILE creates portable per-integration checklist-count baselines without overwriting files. -diff FILE or HEAD reports deterministic before/after/delta remaining, implemented and partial counts per fragment and integration, with separate compiler/library totals and explicit added/removed IDs, file moves and status/scope changes; -json emits the versioned report. HEAD reads committed YAML without checkout/index changes. Invalid schemas, duplicate IDs, negative counts, nonportable paths and conflicting flags fail explicitly. Equal-count text rewrites are outside count comparison (2026-11-10; IDEAS.md section 7).
      - "--listfiles: list every YAML input file in the selected governance directory in filename order, with the filename followed by three columns named Implemented, Remaining and Partial. Each column shows a checklist-item count and its percentage of the per-file total (implemented + remaining + partial). Include files with zero checklist items (0 and 0.0%) and library-scope files while preserving their exclusion from compiler totals. Use the existing canonical counting rules in a read-only report."
      - "2026-11-18: -md MD-NNN lists every exact-ID text occurrence grouped by repository-relative file, with Unicode line/column positions, across the selected governance directory, rules, language-rulebook-status.md and Go/Sec sources. -md closed audits adjacent explicit blocker wording for IDs absent from missing-decisions.yaml, including wrapped lines, while keeping present implementation-pending decisions tracked and excluding neutral historical mentions and negated blockers. Results are possible stale wording for review, not authoritative decision closure or implementation status. Plain/JSON output is deterministic and read-only; malformed/duplicate ledger IDs and incompatible flags fail explicitly. Symlinks, binary data and build/dependency directories are excluded; source locations are portable."
      - "2026-11-18: -corrections audits every corrections_applied link against regular files under rules/corrections/applied/, preserving owning integration and YAML source locations. Archive entries require a canonical integration/rulebook path mention or a local rulebook-relative Markdown link; self-references in archived corrections and prefixed filenames do not establish provenance. Pending corrections under rules/corrections/ and root candidates with correction filename/heading evidence retain explicit document statuses; applied candidates outside the archive are reported separately. Normative application is never equated with runtime implementation completion. Plain and JSON reports are deterministic/read-only with portable paths; duplicate valid links remain valid, symlinks are not followed, and malformed lists, filesystem errors and incompatible flags fail before output. Findings are review data, not automatic file moves or status changes (IDEAS.md §6)."
      - "2026-11-18: -diagnostics compares diagnostics.All/Validate, including retired definitions, with exact textual diagnostic-ID mentions across selected governance and Markdown/YAML rulebooks. Reports retain portable file/line/Unicode-column locations for unregistered mentions and symbolic name/topic-family/retired metadata for registered IDs lacking governance references. New-ID candidates are reported per canonical namespace L/P/S/A/B/F, independently of topic families or semantic numeric subranges: append above the highest registered number, skip all active/retired and documentary reservations, never recycle gaps, and explicitly report exhausted append space. Empty namespaces begin at 0000; suggestions are not allocations or reservations. Deterministic plain/JSON output is read-only; malformed registry IDs, duplicate IDs, invalid document text, filesystem errors and conflicting flags fail before output. Shared audit option validation and textual source-position extraction also serve -md/-corrections instead of introducing parallel implementations (IDEAS.md §8; diagnostics.md §§3,5–6)."
      - "2026-11-18: Canonical integration field order is shared by fmt and every editing command (IDEAS.md section 4.1). Known metadata, references and checklist fields use an explicit order; unknown extension fields retain relative order after them. Wrapped integrations, standalone mappings and top-level integration lists are supported without reordering headers, registry metadata, nested mappings or list entries. Source nodes remain unmodified; decoded values/types are checked before writing. Preview/check/write and subsequent edits are covered, including stable extension fields, typed scalars and idempotence. Existing fragments adopt the order explicitly through fmt; no mass rewrite is required."
    remaining: []
    verification:
      - command: go test ./cmd/yamlstatus -count=1; go test -race ./cmd/yamlstatus -count=1; go vet ./cmd/yamlstatus
        result: "2026-11-18: full suite passed (0.047s), race suite passed (1.211s), vet passed. Canonical field ordering covers all three integration shapes, stable unknown fields, unchanged header/registry/nested/list order, source-tree immutability, typed scalar/value preservation, idempotence, read-only preview/check and subsequent edits. Real governance formatting changed zero decoded values and zero checklist counts before the explicit closure. ID remaining 1 to 0 and status implemented; governance.yaml remaining 15 to 14."
