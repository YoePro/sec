purpose: Statements, loops, matching, try, defer, and flow facts.
integrations:
  - id: frontend.defer-cleanup-state-isolation
    area: frontend-control-flow-and-lifetime
    status: partial
    audited: "2026-08-19"
    repository_baseline: c515862
    document_revision: "2.0"
    document_created: "2026-08-16"
    document_last_updated: "2026-08-16"
    summary: Defer registration analysis now isolates Arena generations and current resource-close state along with symbols, assignment, move, borrow, and reference state. Cleanup-time effects still require explicit Semantic IR representation and application on cleanup edges.
    rules:
      - rules/control-flow/defer.md
      - rules/memory/ownership.md
      - rules/memory/borrowing.md
      - rules/memory/lifetime_analysis.md
      - rules/compiler/semantic_ir.md
    code:
      - internal/sema/analyzer.go
      - internal/sema/semantic_facts.go
    tests:
      - internal/sema/analyzer_test.go
      - internal/sema/copy_move_test.go
      - internal/sema/destruction_test.go
      - testdata/defer_valid.sec
      - testdata/defer_invalid.sec
    implemented:
      - defer body is analyzed in copied symbol state
      - defer body is analyzed in copied definite-assignment state
      - defer body is analyzed in copied move/move-reason state
      - defer body is analyzed in copied borrow state
      - defer body is analyzed in copied local-reference-container state
      - defer body is analyzed in copied Arena-generation and current resource-close state
      - captured outer uses are converted to pending deferred-use borrow records after defer-body analysis
      - immediate Arena.Reset and Arena.Release increment arena generation so older arena-derived references become stale
    partial:
      - deferred cleanup effects are not yet represented independently for later cleanup-edge consumers
    remaining:
      - isolate arena generation state while validating a deferred body
      - represent deferred Arena.Reset/Release invalidation as a future cleanup effect rather than mutating the ordinary continuation
      - audit every mutable Sema flow domain touched by defer-body analysis for registration-time versus cleanup-time semantics
      - separate current resource lifecycle state from registered future cleanup where the present closedResources model conflates them
      - preserve deferred cleanup effects explicitly in resolved Sema/Semantic IR facts with registration point and canonical cleanup order
      - apply arena/resource invalidation only on cleanup edges in later flow analysis and lowering
      - add focused regression coverage for ordinary use between defer registration and cleanup
    bug_reference:
      - correction18.md
    governance_reconciliation:
      - "Keep frontend.defer-v2 partial. Qualify the implemented registration and delayed-use statements: pending outer-value use restrictions are represented, but cleanup-time state mutation is not completely isolated from registration-time analysis."
      - Add "isolate cleanup-time state mutations such as Arena.Reset/Release generation invalidation from ordinary post-registration flow state" to remaining work.
      - Existing remaining work for unified cleanup order, callable contexts, dynamic loop registration, Semantic IR, and backend lowering remains unchanged.
    required_tests:
      - deferred Arena.Reset does not stale a pre-existing arena reference before cleanup
      - immediate Arena.Reset still stales an older arena reference
      - deferred Arena.Release does not advance current arena generation before cleanup
      - multiple deferred arena invalidations do not mutate current generation at registration
      - conditional deferred arena invalidation does not leak into ordinary continuation
      - cleanup-time arena invalidation retains canonical LIFO ordering

  - id: frontend.loop-arena-generation-fixed-point
    area: frontend-control-flow-and-reference-validity
    status: implemented
    audited: "2026-08-20"
    repository_baseline: c515862
    primary_document: rules/control-flow/flowcontrol_while.md
    primary_document_revision: "2.0"
    related_documents:
      - rules/control-flow/flowcontrol_for.md
      - rules/memory/reference_model.md
    summary: Loop fixed-point analysis carries ArenaDomain generations with move state, resources, borrows, and local reference origins. Fallthrough and continue backedges merge generations into the loop header, generation changes participate in convergence, and replay uses the merged header state for both while and for loops.
    code:
      - internal/sema/analyzer.go
      - internal/sema/analyzer_for.go
      - internal/sema/analyzer_while_flow.go
      - internal/sema/analyzer_arena_flow.go
    implemented:
      - arena reset/release advance current Sema arena generation
      - stale arena-reference checks compare reference generation to current arena generation
      - loop fixed-point state carries move state
      - loop fixed-point state carries close-tracked resource state
      - loop fixed-point state carries borrow state
      - loop fixed-point state carries local reference-origin state
      - break edges record arena generation for post-loop merging
      - post-loop arena generations are conservatively merged
      - loop header/backedge state carries ArenaDomain generations
      - continue edges snapshot and merge ArenaDomain generations
      - fixed-point convergence compares generation maps
      - replay restores the merged header generation state
      - while and for use the corrected shared fixed-point helper
      - "one structured loop edge state (2026-10-10): loopEdgeState carries every loop-carried domain (definite assignment, move state and reasons, close-tracked resources, borrows, local reference origins, ArenaDomain generations); every break and continue edge records a complete loopEdgeState, the loop-header snapshot embeds the same structure, and every merge, backedge and scoped-binding cleanup consumes edges instead of thirteen parallel per-domain lists, so a new domain cannot be carried on one edge kind and forgotten on another"
    remaining: []
    bug_reference:
      - correction25.md
    governance_reconciliation:
      - Add loop-carried arena-generation validity to frontend.while-statements-v2 remaining work. The existing generic loop/fixed-point claims do not document this omitted semantic state.
      - Add the same shared-helper limitation to for-loop governance where loop-header fixed-point support is described.
      - correction21.md continues to own nested break-target return/fallthrough analysis; correction22.md continues to own logical short-circuit frontend runtime-state analysis.
    required_tests:
      - while second iteration sees Arena.Reset from first iteration
      - for second iteration sees Arena.Reset from first iteration
      - while continue edge carries arena generation
      - for continue edge carries arena generation
      - Arena.Release has identical generation behavior
      - break-only arena generation affects exit but not nonexistent backedge
      - nested loops preserve generation on the correct loop edge
    tests:
      - internal/sema/loop_edge_state_test.go
    verification:
      - command: go test ./... -count=1
        result: passed on 2026-10-10 after the loopEdgeState refactor with unchanged loop, arena-generation, move, resource, borrow and reference-origin behavior; TestLoopEdgesCarryEveryDomain guards that every edge records every domain; remaining reduced from 1 to 0
    revised: "2026-10-10"

  - id: frontend.discard-v2
    area: frontend-ownership-and-lowering
    status: partial
    integrated: "2026-09-04"
    document_revision: "2.0"
    repository_baseline: 56be75d
    summary: Tracks revision-2.0 explicit and implicit discard semantics. The lexer, parser, AST, semantic analysis, compiler dump, and current backend path support explicit discard expressions, simple-binding invalidation, mutable-binding reinitialization, reference-holder release, ordinary call-result discard, recursive must-use/discardability checks, and the current Task/Thread/spawn safety rules plus configurable implicit-result advisories. Arbitrary Place support, path-sensitive aggregate state, additional advisory diagnostics, explicit Semantic IR provenance, and complete destruction/cleanup lowering remain.
    rules:
      - rules/control-flow/discard.md
      - rules/types/types.md
      - rules/declarations/functions.md
      - rules/memory/ownership.md
      - rules/memory/copy_move.md
      - rules/memory/borrowing.md
      - rules/memory/destruction.md
      - rules/control-flow/defer.md
      - rules/concurrency/tasks.md
      - rules/concurrency/threads.md
      - rules/concurrency/spawn.md
      - rules/concurrency/concurrency.md
      - rules/compiler/semantic_ir.md
      - rules/tooling/diagnostics.md
      - rules/tooling/formatter.md
      - rules/tooling/lsp.md
    governance_reconciliation:
      - Concurrency lifecycle discard remains explicit; task and thread rulebooks own detach/discard details, and fallible creation is handled before a lifecycle handle exists.
    code:
      - internal/ast/ast.go
      - internal/lexer/lexer.go
      - internal/parser/parser.go
      - internal/sema/analyzer.go
      - internal/sema/analyzer_discard.go
      - internal/sema/analyzer_lifetime.go
      - internal/sema/place.go
      - internal/sema/parameter_usage.go
      - internal/diagnostics/diagnostics.go
      - internal/formatter/formatter.go
      - cmd/compiler/main.go
      - internal/sema/expression_statements.go
      - internal/sema/implicit_discard_advisory.go
      - internal/sema/discard_advisory.go
    tests:
      - internal/parser/parser_test.go
      - internal/sema/analyzer_test.go
      - internal/sema/discard_diagnostic_test.go
      - internal/sema/copy_move_test.go
      - internal/sema/destruction_test.go
      - internal/sema/concurrency_test.go
      - internal/sema/parameter_usage_test.go
      - internal/formatter/formatter_test.go
      - testdata/semantic_ir/unsupported_nonvoid_discard.sec
      - internal/sema/implicit_discard_advisory_test.go
      - cmd/compiler/implicit_discard_advisory_test.go
      - cmd/lsp/implicit_discard_advisory_test.go
      - testdata/tooling/implicit_discard.sec
      - testdata/tooling/implicit_discard_invalid.sec
      - internal/sema/explicit_discard_advice_test.go
      - cmd/compiler/explicit_discard_advice_test.go
      - cmd/lsp/explicit_discard_advice_test.go
      - testdata/tooling/explicit_discard_advice.sec
    implemented:
      - discard is a lexer keyword with parser and AST support for discard expression
      - discard without an operand is rejected by the parser
      - explicit discard operands are semantically analyzed
      - temporary function and method call results may be explicitly discarded
      - receiver mutability is enforced inside discarded method calls
      - discarding a local identifier makes the binding unavailable with reason discarded
      - later reads of discarded locals are rejected with the discard source as a related location
      - discarded mutable whole bindings may be reinitialized
      - reinitialization clears the prior unavailable state without destroying an old value
      - immutable discarded bindings remain non-reinitializable
      - discarding ref and ref mut local holders ends the reference binding without destroying the referent
      - direct unresolved Task and Thread values cannot be discarded
      - direct spawn-result discard is rejected when successful creation would abandon a lifecycle handle
      - ordinary non-void standalone calls are represented as implicit temporary discards
      - direct compiler-known must-use Result, Task, and Thread call results are rejected as standalone statements
      - current recursive must-use and discardability checks traverse type arguments, arrays, struct fields, and union payloads
      - named try and match error bindings may be explicitly discarded
      - standalone spawn expressions are rejected
      - unhandled Result expressions inside defer are rejected
      - parser, AST, and compiler dump output preserve explicitly discarded expressions
      - normative implementation-status prose was removed from the discard rulebook and migrated here
      - mutable reinitialization semantics were reconciled with ownership.md and copy_move.md
      - types.md now defines must-use and discardability as distinct recursive semantic properties
      - destruction.md now defines discard as terminal ownership with deterministic cleanup cancellation
      - semantic_ir.md now specifies canonical DiscardValue provenance and forbids backend inference from unused SSA
      - diagnostics.md now specifies discard-related mandatory and advisory diagnostic identities
      - formatter.md now preserves explicit discard without policy-driven insertion or removal
      - repeated discard of an already unavailable discardable local or tracked field Place is a legal no-op rather than an ordinary use-after-terminal-action read
      - repeated discard preserves compiler-owned operand type and definition facts for shared CLI and LSP consumers and never restores availability
      - frontend explicit discard marks independently tracked direct struct fields unavailable, including copyable fields, while sibling fields remain available
      - reads and borrows after explicit discard emit mandatory S4001 ownership.use-after-discard with the discard source location and actionable help
      - A3001 ownership.implicit-discarded-result reports legal ignored ordinary non-void function, method, generic and compiler-known call results and standalone constructions; default Information and off/info/warning/error project policy preserve one identity, resolved result type, actionable help and selected callable/initializer related location where available
      - implicit-result advice is deduplicated per source statement across summary and loop/defer visits and promoted only after mandatory analysis; explicit discard, consumed results, void and invalid calls receive no advisory, while existing must-use and fallible-construction errors cannot be suppressed by advisory policy
      - A3002 ownership.useless-explicit-discard and A3003 ownership.redundant-void-discard are independently configurable default-Information advisories with off/info/warning/error policy, stable keyword ranges and actionable help; shared semantic CTE proves constant temporaries without Places, trivial destruction excludes custom free, and void guidance preserves expression evaluation. Source-keyed explicit-discard facts avoid repeated loop/summary advice and are published after mandatory analysis; ordinary local/field discard, unknown calls, invalid operands and mandatory ownership rules remain unchanged. CLI/JSON/LSP preserve identities and independent policies.
    remaining:
      - register stable IDs, symbolic names, structured notes and help, and related locations for broader unhandled must-use, borrow conflicts; complete structured transport for existing non-discardable errors
      - complete path-sensitive active-payload reasoning for wrapper and union discardability without weakening conservative defaults
      - extend explicit discard beyond independently tracked direct struct fields to other supported Places and complete field-sensitive partial state
      - separate canonical Availability from moved/discarded/detached reason provenance across joins
      - complete conditional discard convergence with an explicit availability lattice and path-specific destruction responsibility
      - lower explicit and implicit discard through the resolved deterministic destruction plan, cancel consumed cleanup responsibility, prevent double destruction, and register cleanup after legal reinitialization
      - introduce canonical Semantic IR DiscardValue ownership operations with explicit, implicit-call-result, and compiler-temporary provenance
      - ensure backend stages never infer semantic discard from unused SSA values
      - add non-discardable unresolved Process handling when Process becomes a complete compiler-known lifecycle type
      - complete recursive Result of lifecycle-handle spawn modelling for every supported spawn kind
      - account for fallible task spawn before a Task[T] exists and the TaskOutcome[T] observation layer after successful creation when validating detach and discard
      - complete parser, Sema, ownership, borrow, destruction, formatter, diagnostics, LSP, Semantic IR, MLIR, and backend regression coverage
    required_tests:
      - explicit discard of trivial local binding
      - explicit discard of move-only local resource
      - discarded binding becomes unavailable
      - use after discard reports related discard location
      - discard of an already unavailable place is a legal no-op
      - discard of a conditionally available place converges every continuing path to unavailable
      - mutable whole binding may be reinitialized after discard
      - immutable binding cannot be reinitialized after discard
      - reinitialization after discard performs no old-value destruction
      - reinitialization after discard registers new cleanup when required
      - ordinary non-void standalone call result is implicitly discarded
      - implicit ordinary call result executes required destruction
      - implicit discard advisory supports off, info, warning, and error without changing diagnostic identity
      - void standalone call emits no implicit-discard advisory
      - explicit discard suppresses implicit-discard advisory for that result
      - standalone Result call is a mandatory error
      - explicit discard of discardable Result is accepted
      - Result with non-discardable possible payload is rejected
      - ordinary discardable Option call may be implicitly discarded
      - Option with non-discardable possible payload is rejected
      - reference discard ends holder but not referent
      - ref mut discard releases exclusive holder when no retained alias exists
      - discard of owned value while incompatible borrow is active is rejected
      - unresolved task and thread discard is rejected
      - spawn result discard is rejected when successful payload is an unresolved lifecycle handle
      - direct field discard updates partial availability where supported
      - already discarded field is excluded from later aggregate destruction
      - branch merge conservatively preserves conditional unavailability
      - active defer use prevents early discard
      - discard literal advisory
      - discard void advisory
      - discard underscore is rejected
      - Semantic IR records explicit discard provenance
      - Semantic IR records implicit call-result discard provenance
      - backend never infers semantic discard from unused SSA
    verification:
      - command: go test ./internal/sema ./internal/diagnostics ./internal/ir/... -count=1 -timeout=180s
        result: on 2026-10-29 diagnostics and both IR suites passed; full Sema failed TestStructuralMutationDuringIterationIsRejected/append_during_ref_mut_iteration and TestNonStructuralMutationDuringIterationRemainsValid in the concurrently changed iteration-borrow implementation. Both failures reproduced with a Go source overlay disabling the new recordExplicitDiscardAdvisory call; not caused by this advisory and not recorded as a full Sema pass.
      - command: go test -race ./internal/sema ./cmd/compiler ./cmd/lsp -run 'ExplicitDiscardAdvice|RedundantDiscard|ImplicitDiscard' -count=1 -timeout=150s; go vet ./internal/sema ./internal/diagnostics ./cmd/compiler ./cmd/lsp
        result: passed on 2026-10-29; Sema 2.844s, CLI 42.455s, LSP 34.632s; default/off/info/warning/error plus independent mixed policy, repeats/loop probes, local ownership and custom-free exclusions verified
