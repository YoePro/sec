schema_version: 1
updated: "2026-10-02"
purpose: >-
  Tracks normative decisions that are missing or insufficiently precise and
  therefore constrain implementation. Remove an entry only after the owning
  rulebook records the decision and affected governance has been synchronized.

classification_scale:
  blocking: The named implementation cannot proceed without inventing language semantics.
  constraining: Related work can continue, but conformance or migration behavior cannot be completed consistently.
  localized: The gap blocks a narrow optional feature without destabilizing adjacent language behavior.

decisions:
  - id: MD-004
    area: strings-semantic-ir-and-lowering
    rulebooks:
      - rules/foundations/operators.md
      - rules/foundations/lexical_structure.md
      - rules/compiler/semantic_ir.md
      - rules/memory/allocation.md
    description: >-
      Partly decided by
      rules/corrections/applied/missing-decisions-md001-md004-correction-20261002.md
      § 5: runtime string concatenation and interpolation are one fallible
      materialization producing one string, require ordinary `try` handling,
      have no observable intermediate strings, and fold to static data when
      fully resolved at compile time. Still open (§§ 5.8 and 6.4): which
      allocator or allocation context runtime string materialization uses, so
      Semantic IR and backends can consume the frontend StringConcatPlan
      without inventing allocator selection.
    classification: blocking
    status: open

  - id: MD-005
    area: interpolated-string-lexing-and-diagnostics
    rulebooks:
      - rules/foundations/lexical_structure.md
      - rules/tooling/diagnostics.md
    description: >-
      Define the mandatory diagnostic identity, primary range, retained token
      shape, and recovery boundary for an unmatched single `}` in interpolated
      string text. The syntax requires literal closing braces to be doubled,
      but currently does not specify whether the offending brace or the whole
      interpolated-string candidate owns the error, and the Go lexer therefore
      returns ILLEGAL without a structured lexer diagnostic.
    classification: localized
    status: open

  - id: MD-006
    area: parser-sema-and-operators
    rulebooks:
      - rules/foundations/operators.md
      - rules/declarations/unions.md
      - rules/control-flow/flowcontrol_if.md
      - rules/control-flow/flowcontrol_while.md
      - rules/memory/ownership.md
    description: >-
      Define the precedence and expression contexts of the contextual `is`
      state tests (`is Variant`, `is empty`, `is None`, `is Some(binding)`,
      `is available`). operators.md has no `is` entry in its precedence table,
      and the if/while/union rulebooks only show whole-condition forms. The
      parser therefore accepts `is` only as the trailing operator of a
      complete if or while condition, so `ready && state is Idle` tests the
      whole `ready && state` operand, and `let b := state is Idle` or
      `return state is Idle` is not a state test. Decide whether `is` binds
      tighter than comparison/logical operators, whether it may appear in
      arbitrary bool expression contexts, and whether `is not Variant` and
      `!(value is Variant)` are valid.
    classification: constraining
    status: open

  - id: MD-008
    area: errors-and-match
    rulebooks:
      - rules/errors/errorhandling.md
      - rules/control-flow/flowcontrol_match.md
      - rules/corrections/applied/match-errorhandling-correction-20260824.md
    description: >-
      flowcontrol_match.md and the applied match correction allow the
      concrete-variant pattern Err(IOError.NotFound) only as open-error
      narrowing of Result[T, error]; otherwise match forbids nested patterns.
      try handlers, however, accept Err(IOError.NotFound) on a concrete
      Result[T, IOError] channel. Decide whether match on a concrete error
      channel may also use Err(ConcreteError.Variant) (with ordinary closed
      enum exhaustiveness) or must bind the payload and use a guard. The
      compiler currently rejects it in match with a focused diagnostic.
    classification: localized
    status: open


  - id: MD-009
    area: lexer-parser-and-contracts
    rulebooks:
      - rules/types/contracts.md
      - rules/foundations/grammar.md
      - rules/foundations/lexical_structure.md
    description: >-
      contracts.md makes `regex pattern` a normative string contract
      ("Applicability" and "String and collection contracts"), but the
      grammar.md TypeContract production has no regex alternative and
      lexical_structure.md §7.3 omits `regex` from the reserved contract-word
      inventory, although §7.3 states that compiler-known contract spellings
      are reserved and must be added there when they become canonical. Decide
      (1) the grammar production, e.g. Contextual("regex") ConstantExpression,
      and (2) whether `regex` becomes a reserved declaration name like the
      other contract words or stays contextual. The parser currently follows
      the contracts.md shape `regex ConstantExpression`, recognizes `regex`
      only on the same line as the preceding type or contract, and does not
      reserve the spelling.
    classification: constraining
    status: open

  - id: MD-010
    area: types-and-contracts
    rulebooks:
      - rules/types/contracts.md
    description: >-
      contracts.md requires the concrete regular-expression syntax and engine
      to be fixed before runtime validation is implemented. Decide the pattern
      syntax (dialect, escapes over the escape-decoded string, anchoring
      semantics: whole-value match or search), matching unit (UTF-8 bytes or
      Unicode scalars), complexity guarantees (e.g. linear-time, no
      backreferences), compile-time validation of invalid patterns and of
      literal initializers/defaults, and how implicit defaults (the empty
      string) interact with a regex contract. Also decide what "string-like
      named types" covers beyond string (char, rune, string slices). Until
      decided, Sema checks applicability (string only) and a compile-time
      string pattern, retains the decoded pattern, and rejects every regex
      contract with S1058 types.regex-contract-unavailable instead of
      dropping it.
    classification: blocking
    status: open

  - id: MD-011
    area: types-contracts-and-compile-time-evaluation
    rulebooks:
      - rules/types/contracts.md
      - rules/types/default_values.md
      - rules/compiler/compile_time_evaluation.md
      - rules/foundations/grammar.md
    description: >-
      contracts.md states that a position requiring a contract bound, member,
      divisor, or other value before runtime lowering "must classify that
      source position explicitly" under compile_time_evaluation.md, and CTE
      § 8(2) requires the owning rulebook to specify the construct, evaluator
      class (plan-time or semantic), result type, legal domain,
      materialization, and permitted compiler-known inputs. contracts.md and
      default_values.md never provide that classification for multipleOf,
      minLen/maxLen/exactLen, in [...] members, regex patterns, or default
      clauses, and grammar.md restricts range bounds to SignedNumericConstant
      while the other positions use ConstantExpression. Decide whether these
      positions are SemanticCompileTimeRequiredContexts, whether named static
      initializers (module-level `let Max := 100`) and calls are permitted, and
      whether range bounds stay literal-only. The compiler currently accepts
      only literal and literal-operator constants, rejects named statics with
      S1066/S1008, and rejects non-numeric range bounds with a parser
      diagnostic.
    classification: constraining
    status: open

  - id: MD-012
    area: types-contracts-and-errors
    rulebooks:
      - rules/types/contracts.md
      - rules/types/types.md
      - rules/errors/errorhandling.md
    description: >-
      contracts.md makes runtime conversion into a constrained named type
      fallible (`try percentage = Percentage(value) { Err(error) => ... }`)
      and types.md has runtime-checked scalar conversions such as
      `try rune(codePoint)`, but no rulebook names the Result error type of a
      failed contract validation or checked conversion, its variants (e.g.
      which contract failed, out-of-range versus invalid code point), or
      whether it is a core library union. Decide the canonical error type and
      its payload. Until decided, the fallible conversion and constrained
      try-assignment paths cannot get their complete typed frontend contract
      or runtime validation.
    classification: blocking
    status: open

  - id: MD-013
    area: formatter
    rulebooks:
      - rules/tooling/formatter.md
    description: >-
      formatter.md § 9(5) and § 15(3) require structural alignment of struct
      fields, but do not say whether register fields (`Name: bit[N]`, a
      structural declaration block under § 15(1)) align the same way; the
      existing formatter and tests keep register fields unaligned. Separately,
      § 9(8) says "comments and blank lines terminate an alignment group"
      while § 7(9) speaks of standalone comments; decide whether a trailing
      comment on a field ends that field's alignment group (current behavior
      and tests) or only standalone comments do.
    classification: localized
    status: open

  - id: MD-014
    area: types-floating-point
    rulebooks:
      - rules/types/types.md
      - rules/types/default_values.md
      - rules/memory/layout.md
    description: >-
      types.md calls plain `float` "the general target/compiler-known binary
      floating-point type" without fixing its width or naming the target fact
      that selects it, and no layout or CompilationPlan rule supplies it.
      default_values.md requires a range-derived float default to be the
      nearest exactly representable valid value, which depends on that width.
      Decide whether `float` is always binary64, target-selected (and through
      which ResolvedScalarPlan fact), or otherwise defined. Until decided,
      float32 and float64 range defaults are computed exactly while a
      range-constrained plain `float` whose range excludes zero has no implicit
      default and needs an explicit default.
    classification: constraining
    status: open

  - id: MD-015
    area: types-units-and-temporal
    rulebooks:
      - rules/types/units.md
      - rules/types/temporal.md
      - rules/foundations/grammar.md
      - rules/concurrency/mutex.md
      - rules/concurrency/channels.md
      - rules/concurrency/select.md
      - rules/concurrency/cancellation.md
    description: >-
      mutex.md § 12, channels.md § 28(7), select.md § 30(3) and
      cancellation.md let a time-unit expression such as `5<s>` or
      `250<ms>` materialize as `duration` "through the canonical
      temporal/unit conversion rules", but units.md and grammar.md define only
      unit-annotated types (`decimal<s>`, `<m>`) and no `5<s>` quantity
      literal, and neither units.md nor temporal.md defines a conversion from a
      time-dimension quantity to `duration` (scale resolution, carrier,
      rounding to nanoseconds, overflow, negative values). Decide the
      quantity-literal syntax and the conversion contract before
      frontend.temporal-duration can be implemented.
    classification: blocking
    status: open

  - id: MD-016
    area: compiler-known-declarations
    rulebooks:
      - rules/compiler/compiler_known_members.md
      - rules/library/core-library.md
      - rules/collections/shaped-types.md
      - rules/corrections/applied/compiler-known-fundamentals-cross-rulebook-correction-20260907.md
    description: >-
      Correction § 21 requires every rulebook that names a compiler-known Sec
      type or member only by name, prose shape, or partial pseudodeclaration
      to choose exactly one: (A) a real Sec declaration with its complete
      canonical declaration and owning module, or (B) compiler-semantic only
      with a complete structural contract. § 21(4) explicitly does not invent
      the missing declarations. Each affected rulebook (shaped, storage, and
      compiler-known metadata in particular) needs that A/B decision; the
      implementation registry already classifies member authority (§ 6) but
      cannot choose a declaration form on the rulebooks' behalf.
    classification: constraining
    status: open
  - id: MD-017
    area: analysis-cli
    rulebooks:
      - rules/compiler/compiler_analysis.md
      - rules/analysis/pitfall_analysis.md
      - rules/analysis/parameter_usage_analysis.md
      - rules/analysis/isr_analysis.md
      - rules/analysis/data_races.md
      - rules/analysis/deadlock_analysis.md
    description: >-
      `sec analyse` and `sec analyse --all` are implemented and run every
      available analysis at Deep depth. Every analysis rulebook requires that
      one analysis can also be selected individually, but says that "the exact
      CLI spelling is owned by CLI/tooling rules", and no such CLI rulebook
      exists. The conceptual examples are inconsistent: `sec analyse isr` and
      `sec analyse deadlocks` use positional words, while pitfall and
      parameter-usage selection have no spelling at all. Decisions needed:
      (1) the spelling for selecting individual analyses (positional words,
      flags, or both) and the canonical name of each analysis; (2) whether
      `--depth interactive|standard|deep` or another option may lower the
      budget of `sec analyse`; (3) whether a versioned machine-readable report
      (as with `sec.diagnostic-occurrences`) is required and what its schema
      is.
    classification: constraining
    status: open
  - id: MD-018
    area: union-recursion-indirection
    rulebooks:
      - rules/declarations/unions.md
      - rules/memory/layout.md
      - rules/memory/destruction.md
    description: >-
      unions.md §18 shows `next: Box[List[T]]` as recursion "through a valid
      finite indirection", but no rulebook defines `Box`. The only `Box`
      elsewhere (destruction.md § 28) is an ordinary user struct
      `Box[T] struct { value: T }`, which stores T by value; under layout.md
      § 25(5) that makes `List[T]` infinite. The implementation therefore
      treats a source-declared `Box` as by-value and rejects the example, and
      the test fixture testdata/union_valid.sec was changed to the dynamic
      storage boundary `List[T][]`. Decisions needed: whether Sec has a
      compiler-known or library owning heap indirection (`Box[T]` or another
      name), what it is called, which module owns it, and whether the
      unions.md example should use it or an existing boundary.
    classification: constraining
    status: open
  - id: MD-019
    area: explicit-layout-syntax
    rulebooks:
      - rules/memory/layout.md
      - rules/memory/arena.md
      - rules/platform/ffi.md
    description: >-
      layout.md § 4.3 defines explicit layout contracts, § 8(5) rejects
      alignment requests stricter than the target supports, and arena.md
      § 17(5) makes statically impossible alignment a compile-time error. But
      layout.md § 1(12) explicitly does not introduce syntax for packing,
      alignment, offsets, endianness, or explicit representation, and no other
      rulebook defines it. As a result, no source program can request a
      non-native alignment, and the § 8(5), § 4.3(3), and arena § 17(5)
      diagnostics cannot be implemented. Decisions needed: the syntax (an
      attribute, a type contract, or something else) for explicit alignment,
      packing, field offsets, endianness, and representation, and which
      rulebook owns it.
    classification: blocking
    status: open
  - id: MD-020
    area: lexer-foreign-qualification
    rulebooks:
      - rules/foundations/lexical_structure.md
      - rules/foundations/grammar.md
      - rules/platform/ffi.md
    description: >-
      grammar.md ForeignTypeReference uses "::" as a terminal (`"C" "::"
      Identifier`, `"c" "::" Identifier { "::" Identifier }`), but the
      operator and punctuation list in lexical_structure.md § 16 and the
      longest-match list in § 17 do not contain `::`. The lexer therefore
      produces two ':' tokens. Without touching the lexer, the parser
      currently accepts exactly two adjacent ':' tokens, with no whitespace
      and directly attached to the surrounding names, as the "::" terminal.
      Decisions needed: whether `::` is a lexical token (and its place in
      § 16/§ 17 longest match relative to `:`, `:=`, and `:<-`), and whether
      whitespace may appear around or inside `::`.
    classification: localized
    status: open
  - id: MD-021
    area: c-binding-environment
    rulebooks:
      - rules/platform/ffi.md
      - rules/platform/abi.md
      - rules/platform/target_profiles.md
    description: >-
      ffi.md § 6 says c:: binding types (c::stddef::size_t,
      c::time::time_t, c::stdarg::va_list, c::posix::socklen_t) are
      "supplied by the selected target/library binding environment", and
      § 52 requires Sema to resolve them through that environment. No
      rulebook defines what the environment is, where its declarations live
      (Sec source under sec/platform, compiler-known tables, or package
      metadata), which namespaces and names exist per target, or how a
      library selects or extends them. The parser accepts
      c::namespace::name, and Sema reports S1078
      ffi.unresolved-c-binding-type for every c:: name. Decisions needed:
      the binding environment's form, ownership, per-target contents, and
      selection mechanism.
    classification: blocking
    status: open
  - id: MD-022
    area: c-scalar-literal-shaping
    rulebooks:
      - rules/platform/ffi.md
      - rules/types/types.md
    description: >-
      ffi.md § 8 permits literal shaping such as `let count: C::int := 10`
      "when the literal is representable", but it shows only integer
      literals. The implementation shapes integer and floating literals into
      C:: numeric types and, by analogy, the boolean literals true and false
      into C::bool. It does not shape character literals into C::char,
      C::schar, or C::uchar, because those are C integer types. Decisions
      needed: whether boolean literals shape into C::bool, whether character
      literals shape into the C character types (and with what encoding),
      and whether a C:: type may initialize another C:: type of a different
      name implicitly. The implementation currently rejects this, matching
      the general Sec rule that distinct scalar types need explicit
      conversion.
    classification: localized
    status: open
  - id: MD-023
    area: ffi-legal-sec-scalars
    rulebooks:
      - rules/platform/ffi.md
      - rules/foundations/grammar.md
      - rules/types/types.md
    description: >-
      ffi.md § 9 lists the fixed-width Sec scalars that may appear directly
      in foreign signatures (byte, int8 through uint64, float32, float64)
      "when they exactly describe the foreign ABI type", and § 45 adds
      C:: scalars, RawPtr, call-bounded references, and extern "C" enums.
      Three points are open. (1) The target-sized int and uint are not
      listed, but grammar.md's extern example writes `length: uint` and
      `int64`, and existing tests and bindings use `int`/`uint` in C
      externs. (2) int128, uint128, int256, and uint256 are fixed-width but
      have no C:: counterpart in the C ABI model. (3) § 45 allows
      extern "C" enums, which are not implemented yet, while ordinary Sec
      enums with an integer underlying type are neither listed as legal nor
      listed as forbidden in § 46. The C/system legality check (S1079)
      currently keeps the earlier behavior and accepts all three. Decisions
      needed: whether int/uint, the 128/256-bit integers, and integer-backed
      Sec enums are FFI-legal, and if so under which ABI-model conditions.
    classification: constraining
    status: open
  - id: MD-024
    area: null-sentinel-syntax
    rulebooks:
      - rules/platform/ffi.md
      - rules/memory/raw_pointers.md
      - rules/memory/unsafe.md
      - rules/foundations/grammar.md
      - rules/foundations/lexical_structure.md
    description: >-
      ffi.md § 11 defines the null sentinel by example: `null` is legal only
      lexically inside unsafe, has no standalone type, and is tested with
      `raw is null`, while `== null` is invalid. Four points are open.
      (1) Neither lexical_structure.md nor grammar.md mentions `null` or
      `is null`. The implementation treats `null` as a contextual word in
      expressions and in the contextual if/while `is` test, so a visible
      binding named null shadows it; whether `null` is a reserved word is
      undecided. (2) raw_pointers.md § 5.1 and unsafe.md § 19(1) say that
      testing a raw pointer for null is not inherently unsafe, but the only
      defined spelling, `is null`, is unsafe-only, and unsafe.md § 12's safe
      example uses `pointer.IsNull()`, which no rulebook defines. (3) No
      negated form (`is not null`) is defined; the parser rejects it like
      other undefined `is not` forms. (4) Whether `is null` is usable outside
      if/while conditions, as an ordinary bool expression. Decisions needed:
      the lexical status of null, the safe null-test spelling, the negated
      form, and the expression positions of `is null`.
    classification: constraining
    status: open
  - id: MD-025
    area: custom-free-semantics
    rulebooks:
      - rules/memory/destruction.md
      - rules/memory/ownership.md
      - rules/memory/copy_move.md
      - rules/declarations/impl.md
      - rules/foundations/grammar.md
    description: >-
      Custom `free` is now parsed and analyzed per impl.md § 19 and
      destruction.md §§ 10.3 and 15, but six points are not decided by the
      rulebooks. (1) Copy classification: copy_move.md § 3 never states whether
      a type with custom free may be implicitly copied; an implicit copy would
      run free twice for one resource. The implementation leaves the
      classification derived from the fields (an int-only type with free stays
      copyable). (2) `discard value.Field` on a custom-free type ends a field
      and leaves the value partially available, but ownership.md § 19 and
      destruction.md § 10.3 forbid only partial moves; discard of a field is
      currently still accepted. (3) grammar.md "free operation syntax" still
      says the parser creates an invalid statement, contradicting impl.md § 19
      and grammar.md FreeDeclaration; the implementation follows impl.md.
      (4) Which impl targets may declare free: interfaces are rejected, every
      other impl target (enums, named scalars, unions, registers, generic
      templates) is accepted. (5) destruction.md § 15.4(4) requires rejecting a
      statically provable manual release of an owned field but defines no
      proof criterion. (6) Bare `return` inside free is accepted as in any
      void body; a return value is rejected. Decisions needed: copyability of
      custom-free types, field discard on custom-free types, the grammar.md
      status text, legal free targets, the § 15.4(4) criterion, and whether
      bare return is allowed in free.
    classification: constraining
    status: open
  - id: MD-026
    area: stdlib-io-root
    rulebooks:
      - sec/stdlib/io/std-io.md
      - rules/declarations/interfaces.md
      - rules/memory/copy_move.md
      - rules/foundations/language_philosophy.md
    description: >-
      Implementing the root io package from std-io.md leaves five points open.
      (1) The transfer helpers take `ref mut Reader` and `ref mut Writer`, and
      copy_move.md § 21(5) acknowledges borrowed interface references, but no
      rulebook defines converting `ref mut File` (a type that explicitly
      implements Reader) to `ref mut Reader` at a call site, nor how such a
      call dispatches; language_philosophy.md § 10 warns against unexpected
      dynamic dispatch and generics.md forbids runtime generic dispatch. Sema
      rejects the call today, so the helpers type-check but cannot be called
      with concrete types. A generic form such as
      `fn Copy[W: Writer, R: Reader](destination: ref mut W, source: ref mut R)`
      would be statically dispatched instead. (2) WriteAll must detect
      "repeated" zero progress (§§ 7.3, 8.6) but no count is given; the
      implementation reports NoProgress after two consecutive Ok(0) results.
      (3) ReadAll returns Result[byte[], IOError], but IOError has no
      allocation-failure variant; Append failure is currently mapped to
      NativeFailure. (4) Whether the helpers retry on IOError.Interrupted (the
      legacy File API does) is unspecified; they propagate it. (5) How the
      helpers treat a Reader or Writer that violates its contract by returning
      a count larger than the buffer is unspecified. Decisions needed:
      interface-reference conversion and dispatch (or generic signatures), the
      zero-progress count, ReadAll's allocation error, Interrupted retry, and
      contract-violation handling.
    classification: constraining
    status: open
  - id: MD-027
    area: contextual-none-arguments
    rulebooks:
      - rules/types/types.md
      - rules/errors/errorhandling.md
      - rules/foundations/grammar.md
      - rules/foundations/language_philosophy.md
    description: >-
      Bare `None` (and the empty literal `[]`, grammar.md "requires contextual
      type information") needs an expected type, but no rulebook lists which
      positions supply one. Declarations, assignments, and returns already
      did. Call and `new` arguments did not, so stdlib code such as
      `new Reference(None, None, new Path(), None, None)` failed with
      "undefined variable None". The implementation now types a bare None
      argument from the parameter in its position when every candidate that
      accepts the argument count agrees on the same Option[T], mirroring the
      null-sentinel rule of ffi.md § 11; disagreeing overloads still give no
      context. Decisions needed: confirm call and initializer arguments as
      contextual positions for None, whether overload disagreement should
      instead pick by the other arguments first, and whether `[]` arguments
      follow the same rule.
    classification: clarifying
    status: open

  - id: MD-028
    area: try-protected-subtree
    rulebooks:
      - rules/errors/errorhandling.md
      - rules/errors/runtime_checks.md
    description: >-
      runtime_checks.md says "Within its expression subtree, try converts
      language-defined checks into fallible control flow", and errorhandling.md
      § 11 shows `try values[index] + amount` with two failure sources. The
      implementation now applies this to the whole subtree, including the
      arguments and receiver of a protected call: `try Wrap(left + right)`
      protects the addition, and `try result.Append(data[i])` protects the
      index as well as Append, so `Err(error)` there binds a heterogeneous set
      and is rejected by § 11.1. An earlier implementation test assumed the
      opposite for call arguments. Confirm that call arguments and receivers
      belong to the protected subtree, or define a narrower boundary.
    classification: clarifying
    status: open

  - id: MD-029
    area: error-patterns
    rulebooks:
      - rules/foundations/grammar.md
      - rules/errors/errorhandling.md
      - rules/control-flow/flowcontrol_match.md
    description: >-
      grammar.md uses `ErrPattern` in TryPattern but never defines it. The
      implementation accepts Err(_), Err(name), and Err(Enum.Variant) (plus
      Err(Concrete.Variant) narrowing on an open error channel). Union error
      types with payload variants, such as `type DetailedError union error {
      OpenError { Path: string } ... }`, therefore cannot be handled per
      variant in try handlers: Err(DetailedError.OpenError(info)) is a nested
      pattern, which match forbids outside open-error narrowing. Decide the
      ErrPattern production, whether payload-variant patterns of union errors
      are allowed in try handlers and match arms, and their binding forms, so
      handler reachability for union payload patterns can be implemented.
    classification: constraining
    status: open

  - id: MD-030
    area: no-panic-attribute-placement
    rulebooks:
      - rules/foundations/attributes.md
      - rules/errors/panic.md
    description: >-
      panic.md § 21 and frontend.panic ask for @noPanic on every callable form,
      but attributes.md only says an attribute applies to the next top-level
      statement (and impl methods by extension); it defines no placement for
      init declarations, property get/set accessors, lambdas, or free. The
      parser therefore accepts @noPanic only before fn, unsafe fn, and extern
      fn. Decide where @noPanic may be written on these callable forms (for
      example before init, before get/set inside a property, or in a lambda
      header) so their bodies can be verified.
    classification: localized
    status: open


  - id: MD-031
    area: sec-mlir-try-handler-metadata
    rulebooks:
      - rules/errors/errorhandling.md
      - rules/mlir/dialect-versions/sec_mlir_dialect_v16.md
    description: >-
      Semantic IR now lowers guarded try handlers (guard-false continuation)
      and partial handler plans with residual propagation, but the Sec MLIR
      dialect schema only defines the handler kinds ok, err-variant,
      err-catch-all, and merge. Decide how the dialect represents guarded
      handlers and residual propagation (new handler kinds, attributes, or
      explicit CFG), so the emitter can stop rejecting these plans.
