    implemented:
      - internal/project ParseManifestVersions reads exactly one `[version]` table and every `[target.<name>.version]` table into structured fields, requiring major, minor, revision, build, and format and rejecting duplicates, unknown fields, and non-decimal, negative, leading-zero, or out-of-range VersionNumbers outside 0..9223372036854775807 (§ 8(1)–(3))
      - optional userdefined must match `[A-Za-z0-9][A-Za-z0-9._-]*`; an empty Project value is rejected, and an empty Target value clears the inherited component (§ 9(3), § 11(7)–(8))
      - Version.Render replaces exactly `[major]`, `[minor]`, `[revision]`, `[build]`, and `[userdefined]` from the parsed fields with unpadded base-10 numbers and verbatim userdefined, keeps every other character literal, and rejects unknown bracketed identifiers, a format that references a missing userdefined component, and an empty result (§ 10, § 49(3))
      - Version.Resolve applies a Target override field by field, and validation reports a Target whose cleared userdefined leaves an inherited format referencing `[userdefined]` (§ 11(4)–(9)); the § 8(10)–(11) and § 11(10)–(11) examples render as specified
      - "`sec init` validates the version model of the manifest it generates before writing it (§ 37(1))"
      - The version manifest reader explicitly rejects unsupported hexadecimal, octal and binary TOML integers with their form named and a decimal VersionNumber alternative. Multiline basic/literal strings are rejected with a single-line alternative and source line; recovery skips their contents, including escaped delimiters, so string text cannot become phantom version fields or Target tables. This is a reader capability restriction, not a language prohibition.
      - make the resolved ProjectVersion available as a Project fact to builds and tooling (§ 49(1)–(2))
      - ProjectVersion is available as a structured value in Manifest.Facts; declared Target versions are resolved once through existing inheritance/override rules and returned as value copies by TargetVersion. Unknown Target names have no version. Invalid identity/version input publishes no resolved project, located failures are retained with deterministic ordering, and explicit reload refreshes facts without mutating prior snapshots (§§8,11,49). Build-time version display is supplied by tooling.project-build-numbering; source-level build metadata remains unimplemented.
      - Version reading now skips multiline values in unowned sections as well, so permitted parameter text containing apparent version or Target-version headers cannot forge resolved version facts; complete TOML syntax parsing likewise separates real Target declarations from string contents.
      - Build-time rendered versions now come from the final automatic or explicit component in tooling.project-build-numbering. CLI success output follows commit, and retained LLVM artifacts include the same rendered value. The combined remaining item stays open for the separately owned source-level build-metadata API of §32.
      - validate `[version]` of discovered manifests in the compiler and the LSP, with registered diagnostics and source ranges in sec.toml (§ 48)
      - Shared version-snapshot validation emits registered mandatory S1150 (projects.invalid-version) with deterministic ordering and Unicode-scalar source spans in sec.toml. Required fields, duplicate/malformed TOML, numeric bounds, placeholder errors and Target inheritance are diagnosed independently of unrelated identity errors; reader-capability errors remain explicit. CLI sema/analyse/emission/build, named builds, init and test validate governing manifests before semantic compilation or writes, deduplicating manifests across sources. The analysis pipeline was extracted from main.go into a cohesive sibling file.
      - LSP distinguishes manifest TOML from Sec source, diagnoses open or discovered ancestor manifests on their own URI and consumes unsaved overlays. Manifest dependencies invalidate source batches on document/configuration changes, obsolete jobs are discarded and stale errors clear on correction, overlay close or deletion. Protocol spans use the same shared compiler renderer; cross-target Sec parsing is skipped for manifest documents. Allocation consumer-parity fixtures now declare the required version table so they retain their intended analysis coverage.
      - "MD-143 BuildInfo declaration (core-library.md § 28): core.BuildInfo is a core builtin struct with the 16 canonical fields (uint64 version components, Option[string] VersionUserDefined/SourceRevision, Option[bool] DirtySourceStatus, distinct BuildProfile and TargetProfile, no single Profile), cannot be redeclared, and BuildInfo.Current() is the compiler-known member CKM-BUILDINFO-CURRENT (internal/sema/build_info.go). Test: TestBuildInfoCurrentInCodeAndCTE field types"
      - "MD-143 BuildInfo.Current() population (§ 113B(1), (3)): the shared resolver internal/platform/buildinfo fills the snapshot from the manifest Facts, the owning or named Target, the named or unique Variant, the resolved Target version, the selected target OS/arch, [build].profile and the MD-139 resolved target profile; host values are never used and an unresolved Target, Variant or profile leaves Current() to the new mandatory S1258 build-info.unresolved-plan. Tests: TestBuildInfoCurrentRequiresResolvedPlan, TestCLIBuildInfoSnapshot (cross-target linux/arm64, variant-less platform, absent profile)"
      - "MD-143 BuildInfo in ordinary code and semantic CTE (§ 113B(2)): string and uint64 fields evaluate in semantic CTE (let constants, type defaults), and Semantic IR materializes each runtime Current() as a constant struct.construct of the snapshot with None/Some union.construct for Option fields, no environment inspection or allocation. Tests: TestBuildInfoCurrentInCodeAndCTE, TestBuildInfoCurrentMaterializesSnapshot"
      - "MD-143 build number view (§ 113B(4)): sec build passes its BuildInvocation (resolved number including the automatic candidate) to the snapshot of the named Target; sec check and LSP use the stored Target version and never reserve or increment; the LSP reads the unsaved manifest overlay, which its analysis fingerprint already includes. Test: TestLSPBuildInfoUsesOverlayManifest"
      - "source-level build metadata (projects.md § 32): no longer blocked; the API is core.BuildInfo with BuildInfo.Current() (MD-143, § 32(8)), implemented by the MD-143 entries above"
      - "MD-143 native BuildInfo field reads (§ 113B(2)): the new sec-fold-struct-projections pass runs before the LLVM track entry gate, folds a copy-trivial sec.struct.extract of a sec.struct.construct into the field operand and erases the dead copy-trivial construction tree (constants, Option union.construct); owner-moving constructions and every other struct/string value still reach the entry gate. Tests: mlir/test/Conversion/SecToLLVM/struct-projections.mlir, TestBuildInfoFieldsRunNatively (exit 42, manifest unchanged)"
      - "MD-143 Option fields and the whole value in semantic CTE (§ 113B(2)): buildInfoAggregate gives Current() as a CTE struct value with Some/None variant values for VersionUserDefined, SourceRevision and DirtySourceStatus; the semantic evaluator and the CTE executor both use it, so CTE functions match the fields, test them with `is`, read module constants of the whole value, and a module constant of an Option field becomes a static with a Some/None initializer. Tests: TestBuildInfoOptionFieldsInCTE, TestBuildInfoOptionFieldStatic"
      - "MD-143 hover and completion (2026-11-23): all 16 BuildInfo fields expose their canonical types and exact hover ranges, including Option[string]/Option[bool] and distinct BuildProfile/TargetProfile. Field completion reuses the shared field-hover signature; Current() uses the existing registry signature, availability and friendly documentation. Static and instance namespaces stay separate, and an inferred Current() result offers its fields. BUG-000041 fixed the Target reader rejecting TOML literal strings, which otherwise prevented a resolved BuildInfo snapshot. TestLSPBuildInfoMembers covers the complete surface and verifies analysis never changes the stored manifest."
      - "MD-143 explicit source facts (2026-11-23; core-library.md §28(3), projects.md §33(4)): the shared buildinfo.Request accepts independent request markers and already resolved revision/dirty-status facts. Only requested AND available facts become Some; false and empty values remain distinguishable from absence. Resolution copies producer inputs, and Sema freezes all optional metadata on ingress, public access and configuration replay (BUG-000049). The source-backed CTE and ordinary Current regression uses an empty project root and supplied manifest/facts; no Git or source probes, new flags or manifest syntax are introduced. CLI/LSP defaults continue to omit unrequested facts; collection UI and the separately listed cache/native representation work are not claimed."
      - "MD-143 whole BuildInfo as a module static (verified 2026-11-27; core-library.md §28; compiler_known_members.md §113B; static.md §§15-16): let Info := BuildInfo.Current() materializes the complete 16-field snapshot through the existing general Sema static-value and Semantic IR initializer tree, including all strings, uint64 fields and Option[string]/Option[bool]. The previous claim that staticMaterializable excludes string fields was obsolete after general static materialization changes; no BuildInfo-specific bypass or new lowering was needed. Added source-backed conformance on 32/64-bit plans: every optional-field presence combination, Some(empty string) and Some(false) distinct from None, Unicode/escaped strings, cross-target metadata, exact uint64 values beyond a 32-bit word, detached producer/query snapshots, one global shared by numeric/string/Option/whole-value reads, deterministic IR transport and schema-13 emission, no hidden runtime construction or metadata calls, and rejection of incomplete static values before serialization/emission. Native string/Option/whole-value representations and plan-time exclusion remain separate open points; this closes the whole-static Semantic IR point only."
    partial:
      - "MD-143 cache identity started 2026-11-23 (compiler_known_members.md §113B(4), projects.md §§33–34): BuildInfoSnapshot.CacheIdentity hashes every observable scalar and optional-presence value with a versioned value encoding, independent of pointer addresses and raw manifest spelling. The shared LSP document-analysis cache records the exact analyzed snapshot and validates metadata before reuse; unchanged Sec text is reanalyzed when build number/profile changes, metadata becomes unavailable, or an unresolved manifest is repaired. Equivalent complete metadata and TOML-comment-only disk changes retain the entry. Missing metadata conservatively fingerprints unresolved manifest input. The separate LSP target-summary cache now also consumes the configured analyzer snapshot identity through targetAnalysisIdentity; explicit revision and dirty-status facts change cache entries even when the prepared source, raw manifest and epoch are identical. A source-backed target analysis checks a CTE-derived range contract before and after a stored build-number change. Remaining: adopt the observable snapshot identity in future shared incremental semantic and code-generation caches and verify their cross-snapshot invalidation; this does not complete the original full cache-identity requirement."
    remaining:
      - "MD-143 plan-time exclusion (§ 113B(2)): reject BuildInfo.Current() in plan-time evaluation that determines source selection or the CompilationPlan once such evaluation exists; today no plan-time evaluator consumes Sec expressions"
      - "MD-143 native BuildInfo string and Option values: a runtime use that keeps a string field, an Option field or the whole BuildInfo value (pass, return, compare, match) still needs the LLVM track's string, struct and Option<string> representations, which no pass selects yet"
    verification:
      - command: go test -race -p 4 ./internal/sema ./internal/ir/semantic ./internal/lowering/secmlir -run 'TestBuildInfo' -count=1 -timeout=90s
        result: Passed 2026-11-27 (1.230s/1.217s/1.074s), including new whole-static source tests and existing BuildInfo snapshot/cache tests; vet passed all three packages.
      - command: go test -short -p 4 ./internal/sema ./internal/ir/semantic ./internal/lowering/secmlir ./internal/traceability -count=1 -timeout=150s
        result: Passed 2026-11-27 (36.149s/12.123s/3.327s/0.484s); whole BuildInfo static conformance, all 16 fields, option/target/immutability matrix, serialization and deterministic mixed-global emission. No external MLIR verification or native execution claimed.
      - command: GOTMPDIR="$HOME/.cache/sec-gotmp" go test -race ./cmd/lsp -run "^TestTargetAnalysisBuildInfo" -count=1 -timeout=90s; go test ./internal/traceability -count=1; go vet ./cmd/lsp
