      - rules/projects/projects.txt
    remaining:
      - add deterministic ISR-root discovery and resolved ISR-profile lookup from the active CompilationPlan and canonical platform/runtime execution model
      - keep ISR profile capabilities distinct from mandatory positive safety proofs such as bounded stack, race freedom, deadlock freedom, and foreign interrupt safety
      - add reusable per-function local ISR-requirement summaries over canonical semantic operations rather than source-name blacklists
      - represent ISR requirement facts per semantic dimension with proven absence, reachable presence, and localized Unknown rather than one global unknown state
      - retain deterministic representative semantic cause sites for local and transitive requirement facts
      - account for compiler-required runtime helpers and target-specific lowering requirements before a source operation can serve as positive ISR-safety evidence
      - define and enforce the invariant that lowering cannot silently introduce behavior that violates the active ISR profile assumptions used during analysis
      - build transitive function-requirement summaries over the canonical call graph rather than reanalyzing helper bodies independently for every ISR root
      - solve recursive and mutually recursive call-graph SCC requirement summaries with deterministic monotone fixed-point iteration
      - propagate ordinary synchronous callees in the current execution context and consume canonical execution transitions for deferred, worker, spawned, runtime, and foreign handoff behavior
      - preserve symbolic context requirements such as thread-local, runtime, memory-space, and interrupt-safety dependencies where this avoids per-root summary explosion
      - consume closed callable target sets and conservatively join requirements for every target that may execute in the interrupt context
      - consume open callable contracts and localize Unknown to missing blocking, allocation, runtime, context, or interrupt-safety dimensions
      - support symbolic generic requirement summaries and specialization-aware instantiation where layout, destruction, stack, runtime, or semantic behavior differs
      - consume canonical storage origins and distinguish automatic, static, thread-local, arena, and allocator-backed requirements rather than treating all dynamic storage as heap allocation
      - consume runtime reentrancy, thread-context, compiler-known helper, and interrupt-safety contracts as independent semantic dimensions
      - include destruction, defer, cleanup, panic, error, and compiler-required cleanup behavior in reachable ISR requirements
      - consume synchronous foreign reentry callbacks in the current ISR context when required by the FFI contract
      - consume asynchronous foreign handoff and callback context transitions without attributing later worker execution to the ISR while still checking the handoff operation itself
      - consume resolved platform preemption, nesting, masking, and reentry relationships rather than deriving interrupt behavior from raw priority values alone
      - consume nested physical stack-domain results from stack analysis without recomputing or double-counting nested ISR stack contributions
      - map Exact stack use below or at budget to satisfied and Exact stack use above budget to proven violation
      - map UpperBound stack use below or at budget to satisfied but treat UpperBound above budget as failure to prove safety unless actual overflow is independently proven
      - preserve stack Unknown as Unproven and stack Unbounded as a violation when a finite stack requirement is mandatory
      - consume relevant data-race results without duplicating Place, alias, race pairing, or happens-before logic
      - map ProvenRace to violated, ProvenRaceFree to satisfied, and Unknown to unproven when the ISR profile requires race freedom
      - consume relevant deadlock results without duplicating WaitForGraph or cycle-proof logic
      - preserve ProvenDeadlock, PotentialDeadlock, and Unknown proof strength when evaluating ISR deadlock-freedom requirements
      - keep ISR capability violations such as forbidden blocking synchronization distinct from supporting deadlock classifications
      - add deterministic per-profile constraint evaluation with statuses equivalent to Satisfied, Violated, Unproven, Pending, and NotApplicable where appropriate
      - classify an ISR root Invalid when any mandatory constraint is proven violated and Valid only when every mandatory proof is current and satisfied
      - distinguish Pending analysis from completed Unproven safety and never use stale or pending dependencies as positive ISR-safety evidence
      - preserve unresolved dimensions even when another proven violation already makes the root Invalid
      - add explicit supporting proof dependencies from ISR root results to function summaries, stack results, race results, deadlock results, runtime contracts, FFI contracts, and resolved profiles
      - integrate ISR analysis with the compiler's canonical dependency graph rather than introducing incompatible private invalidation where shared infrastructure exists
      - on edits, invalidate changed local summaries, dependent transitive summaries, and affected positive ISR-root proofs before expensive recomputation
      - propagate incremental recomputation through a dependency worklist only when an exported requirement summary changes
      - reevaluate profile-only changes such as ISR stack budgets without unnecessarily recomputing unaffected function summaries
      - invalidate target/CompilationPlan-sensitive summaries when runtime helpers, stack ABI, preemption/nesting, FFI/platform contracts, memory spaces, or lowering behavior changes
      - support fast Interactive reporting of direct proven ISR violations before unrelated supporting analysis completes
      - prevent the LSP from presenting a root as Valid while any mandatory supporting dependency is stale or Pending
      - use progressive Interactive refinement toward Standard-equivalent results and optional Deep precision without adding a separate global Intermediate mode
      - make Deep ISR analysis preferentially request stronger precision from the owning supporting analysis responsible for an unresolved dependency rather than reimplementing stack, alias, race, deadlock, or callable reasoning
      - expose proven violations and required ISR-safety proof failures as NeedToKnow LSP diagnostics while keeping positive proof explanations and detailed dependency chains configurable OptionalInsight
      - retain the applicable ISR root/profile and transitive semantic call/cause path in diagnostics
      - group multiple presentation consequences of one semantic cause without merging independent underlying proof states
      - avoid generic automatic fixes such as moving work to a thread or replacing synchronization unless a canonical transformation proves the edit correct
      - integrate ISR analysis into default sec analyse all-analysis behavior and support explicit ISR-only selection through canonical tooling
      - export compatible versioned function-requirement summaries for separate compilation and localize Unknown when required imported dimensions are missing
      - include summary schema, compiler/language semantic version, effect/runtime/storage/callable/FFI contract versions, and relevant CompilationPlan keys in compatibility decisions where they can change ISR meaning
      - make requirement summaries, ISR-root classifications, representative causes, and diagnostic ordering deterministic independent of declaration order, worklist order, cache iteration, or compiler worker scheduling
      - add required profile-resolution, effects, context-propagation, stack, race, deadlock, runtime/reentrancy, FFI, callable, generic, cleanup, incremental-LSP, progressive-result, performance, determinism, and false-positive regression tests
      - add explicit regression coverage for the UpperBound-above-stack-budget case so insufficient upper-bound precision is not misreported as proven stack overflow
