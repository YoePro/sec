    dependencies:
      - id: tooling.lsp-v2
        relationship: >-
          LSP formatting, format-on-save, diagnostics, and correction suggestions
          must use the shared formatter contract.
      - id: tooling.testing-v1
        relationship: >-
          Test declarations and testing.Run/lambda formatting follow ordinary
          formatter rules; test-name strings are preserved exactly.
      - id: frontend.lossless-syntax
        relationship: >-
          The parser/lexer must expose enough lossless, error-tolerant syntax
          information to satisfy § 5 and § 25. The exact internal CST storage
          design remains an implementation choice.

    required_tests:
      - golden canonical formatting
      - second-pass idempotence
      - parse-format-parse semantic round trip
      - comments and documentation comments
      - malformed and incomplete source byte preservation
      - width 80/120/200
      - width boundaries 119/120/121
      - structured and compact vertical styles
      - indentation widths 2/4/6
      - import grouping, sorting, aliases, and attached comments
      - ownership markers and consuming parameters
      - registers and units
      - assert and range/step formatting
      - patterns and destructuring
      - test declaration round trip and exact test-name preservation
      - Language Corrections positive cases
      - Language Corrections negative/ambiguous cases
      - CLI/LSP exact-output equivalence

    excluded:
      - semantic code migration or transpilation
      - guessing programmer intent
      - formatter-owned language grammar separate from the compiler parser
      - arbitrary malformed-source repair
      - automatic import removal
      - ordinary top-level declaration reordering
      - semantic normalization of numeric or string literals
      - automatic ownership, mutability, error-policy, or control-flow changes
