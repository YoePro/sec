      - rules/platform/interrupts.md
      - rules/platform/abi.md
      - rules/mlir/sec_mlir.md
      - rules/compiler/semantic_ir.md
    code:
      - cmd/compiler/test_command.go
      - internal/sema/program_plans.go
      - internal/sema/program_plan_verification.go
      - internal/sema/static_destruction.go
      - cmd/compiler/analysis_pipeline.go
      - cmd/lsp/analysis_configuration.go
      - internal/sema/program_entry.go
      - internal/project/targets.go
      - cmd/compiler/build_entry.go
      - cmd/lsp/program_entry.go
      - internal/diagnostics/diagnostics.go
    tests:
      - cmd/compiler/native_track_test.go
      - testdata/build/native/static_initialization.sec
      - internal/sema/program_plans_test.go
      - internal/sema/program_plan_verification_test.go
      - cmd/compiler/program_plans_multimodule_test.go
      - internal/sema/program_entry_test.go
      - internal/project/targets_test.go
      - cmd/compiler/build_entry_test.go
      - cmd/lsp/program_entry_test.go
    implemented:
      - "entry contract validation (2026-10-05): Analyzer.ValidateProgramEntry checks a command Target for exactly one concrete, non-generic, non-extern, module-level `fn main() int` without parameters in the entry module and a firmware Target for `fn main() void`; main in the entry module is the entry identity, so an overload is a duplicate; impl methods named main are not entries; library and test Targets are not checked. Diagnostics distinguish S1109 initialization.missing-entry (at the entry module declaration), S1110 initialization.invalid-entry (naming each departure: generic, extern, parameters, wrong return type such as Result), and S1111 initialization.duplicate-entry (with the first entry as related location), each with help (§ 21, § 22, § 25, § 26, § 27, § 42; TestProgramEntryContract covers the § 45.1 list except the generated test harness)"
      - Target kind and source come from `[target.<name>]` through internal/project ParseManifestTargets and TargetForSource; sec build validates the input file's module against the owning Target's kind, defaulting to command for a linked executable outside every declared Target, and the LSP reports the same diagnostics while a command or firmware Target's source is edited (TestBuildTargetKindComesFromTheManifest, TestLSPReportsProgramEntryContract)
      - "2026-11-12: canonical ProgramInitializationPlan and ProgramShutdownPlan artifacts exist for every executable Target: Analyzer.ProgramPlans (internal/sema/program_plans.go) builds both from the validated program, and sec build resolves them for every executable Target before lowering (TestProgramInitializationPlanRuntimeFree)."
      - "2026-11-12: library Targets acquire no program entry, startup or shutdown: ProgramPlans returns no plans for them, and SetProgramTargetKind, applied by the CLI pipeline and the LSP before analysis, keeps a library's `main` from becoming a program-entry call-graph root (TestProgramPlansLibraryAndDisabledAllocation)."
      - "2026-11-12: the compiler-generated test harness uses the same model: `sec test` analyzes as a test Target and resolves the harness plan, whose runtime requirements are derived from every validated test body (cmd/compiler/test_command.go; TestProgramInitializationPlanTestHarness)."
      - "2026-11-12: no implementation path executes user code because a module is imported or present: the plan's only startup action kinds are static storage establishment, runtime facility initialization and transfer to entry, and statics are compile-time values, so no module-initialization action can exist (TestProgramInitializationPlanRuntimeFree, TestStaticInitializationHasNoHiddenStartup)."
      - "2026-11-12: lifecycle init stays tied to explicit construction: a type with an `init` member contributes no startup action to the plan (TestProgramInitializationPlanRuntimeFree)."
      - "2026-11-12: startup consumes compile-time static values and models only physical storage establishment: StaticStorage records each static's CTE value or zero/default initialization, and the artifact carries them as initialized constants/globals (TestProgramInitializationPlanRuntimeFree, TestStaticInitializationHasNoHiddenStartup)."
      - "2026-11-12: startup actions are typed compiler-known requirements (EstablishStaticStorage, InitializeRuntimeFacility, TransferToEntry) with explicit prerequisite lists (TestProgramInitializationPlanRuntimeRequirements)."
      - "2026-11-12: the startup dependency graph comes from the canonical facility prerequisite relation and is ordered topologically, independent of source, import, linker, map or worker order (TestProgramInitializationPlanRuntimeRequirements, TestProgramPlansAreDeterministic)."
      - "2026-11-12: independent startup actions use a canonical deterministic tie-breaker (the lexicographically smallest ready action identity) (TestProgramPlansAreDeterministic)."
      - "2026-11-12: runtime-free executable plans are valid: a program whose reachable code needs no facility gets `runtime none` and only static storage plus transfer to entry (TestProgramInitializationPlanRuntimeFree)."
      - "2026-11-12: execution-environment startup (ExecutionEnvironmentRequirements, static storage), required Sec runtime startup (InitializeRuntimeFacility) and transfer to source entry (TransferToEntry) are separate plan layers (TestProgramInitializationPlanRuntimeRequirements)."
      - "2026-11-12: command main's int is recorded as a logical status whose physical encoding belongs to the ExecutionEnvironment; firmware returns into the TargetProfile policy (ProgramEntryFact.Status; TestProgramInitializationPlanRuntimeFree)."
      - "2026-11-12: no implicit Result-to-exit, error printing, panic, retry or argument injection exists: entry validation rejects any other main form and the plan has no such action (ValidateProgramEntry, ProgramPlans)."
      - "2026-11-12: ProgramShutdownPlan is derived from teardown dependencies rather than reversing startup: detached execution shuts down first and each facility is torn down after its dependents (TestProgramInitializationPlanRuntimeRequirements)."
      - "2026-11-12: runtime facilities stay alive until every dependent cleanup completes: each teardown action lists the dependents that must finish first (ShutdownAction.After; TestProgramInitializationPlanRuntimeRequirements)."
      - "2026-11-12: entry, runtime, static-lifetime (including static destruction requirements), detached-execution and termination requirements are recorded in the plans before target lowering (TestProgramShutdownPlanRecordsStaticDestruction)."
      - "2026-11-12: cross-compilation coverage: the same initializer establishes 2^40 on a 64-bit target and fails S1223 on a 32-bit one, and the allocator capability follows the profile, so planning depends on the CompilationPlan, not the host (TestProgramInitializationPlanFollowsCompilationPlan)."
      - "2026-11-12: end-to-end coverage: statics initialized by Sec function calls reach LLVM as internal constants/globals with no llvm.global_ctors and no runtime-initialization call, and the native program observes them at entry (testdata/build/native/static_initialization.sec; TestStaticInitializationHasNoHiddenStartup, TestNativeTrackBuildsAndRuns/static_initialization)."
      - "2026-11-12: repository verification commands for the initialization plans and the no-hidden-startup end-to-end test are recorded in this entry's verification list."
      - "2026-11-12: fallible pre-entry actions carry establishment state: runtime facility initialization is marked Fallible (static storage comes from the image and transfer to entry cannot fail), and ProgramInitializationPlan.StartupFailureCleanup(failed) records the established prefix, the never-attempted remainder and rollback actions for established runtime facilities only (internal/sema/program_plan_verification.go; TestProgramStartupFailureRollsBackOnlyEstablished)."
      - "2026-11-12: startup-failure cleanup follows lifetime dependencies, not reverse registration: an established facility is rolled back only after every established facility requiring it (rollback-TaskScheduler before rollback-AllocatorRuntime, ShutdownAction.After), ordered with the canonical tie-breaker (TestProgramStartupFailureRollsBackOnlyEstablished)."
      - "2026-11-12: ProgramStartupFailure is distinct from ordinary execution failure: ProgramFailureClass(entryBegun) separates the two, and a startup failure records EntryBegun=false and EntryScopeCleanup=false, so no main-scope cleanup runs (TestProgramStartupFailureRollsBackOnlyEstablished)."
      - "2026-11-12: shutdown dependency cycles are rejected rather than ordered arbitrarily: VerifyProgramPlans reports S1231 initialization.shutdown-dependency-cycle with a deterministic representative cycle rotated to its smallest member (teardown-X -> teardown-Y -> teardown-X), and an order that tears a facility down before a dependent is rejected the same way (TestVerifyProgramPlans)."
      - "2026-11-12: linking-facing requirements are exposed without owning linker assembly: ProgramLinkingRequirements gives the entry adapter for the Target kind, the startup and runtime components, the shutdown components (static destruction and runtime teardown), the termination adapter and the initialized/zero-initialized static-data sections (TestProgramLinkingRequirements)."
      - "2026-11-12: ProgramPlans verifies the plans before any lowering consumes them and rejects the concrete plan on failure: entry contract (ValidateProgramEntry), runtime facilities the profile resolves as disabled or unsupported (including the detached-execution manager), startup and shutdown acyclicity and order, demanded static destruction and the normal termination policy (VerifyProgramPlans; TestVerifyProgramPlans). Facilities whose profile capability is still unresolved are not rejected; resolving them stays with MD-034."
      - "2026-11-12: initialization diagnostics distinguish S1229 initialization.unsupported-runtime-requirement (in source terms at the requiring site, e.g. `this target cannot provide the task scheduler required by a task spawned in main`), S1230 startup-dependency-cycle, S1231 shutdown-dependency-cycle, S1232 unsupported-static-destruction and S1233 unsupported-termination-policy. The rollback graph is derived from the startup prerequisite relation, so a rollback cycle is reported as its startup cycle (TestVerifyProgramPlans)."
      - "2026-11-12: ProgramPlanFingerprint is the incremental identity of the initialization/shutdown contract: plan schema, TargetProfile, Target kind, entry module and callable identity, statics, runtime requirements with capabilities, startup and shutdown graphs, detached and static-destruction requirements, entry adapter, sections and termination policy. Source positions and reasons are excluded, so a contract-preserving edit keeps the fingerprint while a changed static, detach or Target kind changes it (TestProgramPlanFingerprintTracksTheContract). Environment models enter through the TargetProfile identity until they exist as separate plan facts."
      - "2026-11-12: multi-module determinism: a command importing two modules with statics, allocation and a task spawned from an imported module's local function gets the same plan and fingerprint when the import order and the order the files are written change (cmd/compiler/program_plans_multimodule_test.go; TestProgramPlansIgnoreImportAndFileOrder)."
      - "2026-11-12: entry cannot complete while owning unresolved structured child execution: a task or thread spawned in main and neither awaited, joined nor legally detached is rejected at main's scope exit, and a legal detach transfers the child to the detached-execution manager, which the plans require and shut down before every other facility (TestEntryCannotCompleteOwningChildExecution)."
      - "2026-11-12: NormalTermination and ForcedTermination are distinct plan paths (ProgramShutdownPlan.Terminations): normal termination is triggered by main returning (or the test harness completing) and runs entry cleanup, detached-execution shutdown, static destruction and runtime teardown as the Target has them; forced termination by root panic follows the resolved panic policy, the immediate trap of MD-101, guarantees no normal cleanup and ends in the process termination or firmware panic endpoint, so the plan never weakens the panic, destruction or platform rules (TestProgramTerminationPaths)."
      - "2026-11-12: deterministic static destruction is ordered from canonical dependency and use relations, never source or declaration order: when destroying static X runs code (the custom free of its type or of any owned field or payload type, and every callable reachable from it) that uses static Y, X is destroyed before Y; independent statics use canonical identity order, and a cyclic relation is S1231 `static destruction dependency cycle: main.Active -> main.Journal -> main.Active` instead of an arbitrary order (ProgramShutdownPlan.StaticDestructionOrder; internal/sema/static_destruction.go). It is integrated only as the profile allows: an `unsupported` capability rejects demanded destruction (S1232), and resolving `unresolved` capabilities stays with MD-034 (TestStaticDestructionOrderFollowsUse, TestVerifyProgramPlans)."
    remaining:
      - resolve the TargetProfile capability of every runtime facility (native threads, tasks/scheduler, detached execution, process support, static destruction) once profile families are resolved (MD-034); runtime requirements are already derived from the semantic program before lowering and heap allocation is resolved against the allocation profile
      - generate or select physical platform entry adapters separately from source main using resolved target and ABI rules
      - ensure ordinary main-scope defer and destruction cleanup finishes before ProgramShutdown
      - transfer legal detached execution to program shutdown ownership and cancel or clean it before dependent runtime teardown
      - materialize resolved plans in MLIR and platform lowering and treat late missing semantic runtime requirements as invariant failures
    verification:
      - command: go test ./internal/sema -run 'TestEntryCannotCompleteOwningChildExecution|TestProgramTerminationPaths' -count=1
        result: passed on 2026-11-12 (entry completion with child execution, normal and forced termination paths)
      - command: go test ./internal/sema -run 'TestProgram' -count=1
        result: passed on 2026-11-12 (initialization and shutdown plans, runtime-free and runtime-requiring plans, library Targets, static destruction, test harness, CompilationPlan dependence, determinism)
      - command: go test ./internal/sema -run 'TestProgramStartupFailure|TestVerifyProgramPlans|TestProgramLinkingRequirements|TestProgramPlanFingerprint' -count=1 && go test ./cmd/compiler -run TestProgramPlansIgnoreImportAndFileOrder -count=1
        result: passed on 2026-11-12 (startup failure rollback, plan verification diagnostics S1229-S1233, linking requirements, contract fingerprint, multi-module determinism)
