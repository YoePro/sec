    - decide whether lint/CI should verify traceability on new or modified semantic functions
    - migrate high-value semantic files incrementally
    - prioritize parser, Sema, Semantic IR, lowering, ABI/FFI, ownership, and diagnostics code
    - add correction references to focused regression tests where useful
