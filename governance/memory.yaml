  - id: frontend.references
    area: frontend-reference-provenance-lifetime
    status: partial
    integrated: "2026-08-29"
    document_revision: "2.0"
    repository_baseline: fafd8cb
    rules:
      - rules/memory/references.md
      - rules/memory/reference_model.md
      - rules/memory/borrowing.md
      - rules/memory/lifetime_analysis.md
      - rules/memory/ownership.md
      - rules/memory/copy_move.md
    code:
      - internal/sema/analyzer.go
      - internal/sema/place.go
      - internal/sema/types.go
      - internal/sema/escape_analysis.go
    implemented:
      - semantic reference types carry origin metadata including source symbol/token, local-storage indication and known storage origin
      - ref creation attaches origin metadata and local reference variables preserve it
      - returned references to local function storage are rejected in direct, local-reference, Result payload, aggregate and selected lambda escape paths
      - caller-owned reference parameters may be returned when origin proof is sufficient
      - field/index/slice projections propagate reference-origin metadata
      - local reference and slice bindings retain canonical structured referent Places
      - shared-reference copy and mutable-reference move preserve referent Place; moved mutable-reference holder takes over the granting borrow
      - match ref/ref mut payload bindings carry active-variant Place provenance and branch-scoped non-escaping origin
      - locally constructed struct/fixed-array values retain contained reference origins across supported transfers, assignments and control-flow joins
      - finite path-disjunctive origin sets are maintained with conservative unknown fallback beyond supported limits
      - functions infer deterministic returned-reference summaries over supported parameters, receiver projections, finite multi-source sets and aggregate result paths
      - arena-backed references/slices carry generation dependencies and stale use after Arena.Reset is rejected
    remaining:
      - complete canonical references-v2 integration with lifetime-analysis-v2 and borrowing-v2 facts instead of legacy parallel checks
      - complete reference creation/refinement from ownership-v2 ConditionallyAvailable Places while keeping is available distinct from borrow/generation/platform validity
      - complete provenance for dynamic containers, nested opaque aggregates, imported/foreign aggregates and symbolic range relationships
      - complete closure/reference escape validation for every callable/capture form
      - complete generic/interface/indirect/recursive returned-reference relationships
      - complete fixed-address, runtime mapping, register-view, remap and platform-lifetime integration
      - complete ISR/local/deferred-work reference escape checks using interrupts.md execution contexts
      - complete FFI retain/no-retain and raw-to-safe reference proof integration
      - complete mentor diagnostics and LSP parity for all reference failures
    required_tests:
      - shared ref creation does not consume owner
      - ref mut establishes exclusive authority without ownership transfer
      - Unavailable Place cannot be referenced
      - ConditionallyAvailable Place requires path refinement before safe ref creation
      - returned local reference rejected
      - returned caller-owned parameter accepted
      - finite multi-origin return accepted only when every origin is valid
      - aggregate-contained local reference escape rejected
      - shared-reference copy preserves origin
      - mutable-reference move transfers holder and granting borrow
      - arena reset invalidates prior reference
      - reference equality uses live storage identity plus location

