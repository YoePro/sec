schema_version: 1
area: errors
purpose: Result/error handling, panic, assertions, and unreachable behavior.
integrations:
  - id: frontend.errorhandling-v2
    area: frontend-error-control-flow-ownership-and-lowering
    status: partial
    integrated: "2026-08-28"
    revised: "2026-10-03"
    document_revision: "2.1"
    repository_baseline: "b3315f6"
    semantic_source_parent: "45e5cd4"
    replaces: rules/errors/errorhandling.txt
    summary: >-
      Migrates error handling to the revision-2 compiler-known error model,
      typed Result and Option short-circuiting, partial guarded try handlers,
      consuming and borrowed Result projections, explicit fallible-setter
      contracts, ownership-aware lowering, diagnostics, formatter, and LSP facts.
