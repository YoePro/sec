      - "Range membership over char, rune, binary floats and named integers (2026-11-20, operators.md §§ 63, 65; MD-105; P20 §§ 24-26): Semantic IR compares char, rune and named/constrained integers through int.compare on their carrier (char and rune unsigned) and binary floats through ordered float.compare with full P20 float semantics, so a NaN value or bound is never contained; not in negates. The native fixture range_membership_scalars.sec covers inclusive and exclusive ends, open ranges, astral runes, NaN, -0.0, infinity and Meters bounds (exit 42)."
