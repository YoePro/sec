schema_version: 1
area: sema
purpose: Frontend semantic analysis and semantic diagnostics.
integrations:
  - id: frontend.dynamic-array-membership
    area: frontend-and-lowering
    status: partial
    integrated: "2026-09-09"
    summary: >-
      Accepts in over owning dynamic T[] arrays using the existing element
      equality and contextual literal typing rules. The shared frontend supports
      diagnostics and LSP analysis; dynamic array backend support remains absent.
    rules:
      - rules/foundations/operators.md
      - rules/corrections/applied/operators-dynamic-array-membership-20260909.md
    code:
      - internal/sema/analyzer.go
      - sec/stdlib/net/http/status.sec
    tests:
      - internal/sema/analyzer_test.go
      - testdata/sema/dynamic_membership.sec
      - testdata/sema/dynamic_membership_invalid.sec
      - testdata/sema/dynamic_membership_lowering_deferred.sec
    implemented:
      - owning dynamic arrays expose their element type to membership validation
      - membership returns bool, uses equality-compatible elements, and contextually types numeric and rune literals
      - repeated searches preserve array availability and nominal type boundaries
      - incompatible values and non-comparable element types retain operator membership diagnostic metadata and help
      - HTTP Status.IsRegistered uses the user-provided table typed as Status[] to match the named receiver
    remaining:
      - dynamic array representation, construction, ownership and destruction in maintained backends
      - exact-once left-to-right short-circuit dynamic-array membership lowering without allocation
      - backend execution tests for empty arrays, first match, no match, operand effects and non-consuming search
    verification:
      - command: go test ./...
        result: passed
      - command: sema over the dynamic membership fixtures
        result: valid cases accepted; incompatible elements rejected
      - command: emit-ir testdata/sema/dynamic_membership_lowering_deferred.sec
        result: explicit unsupported array type uint[] error; no executable support claimed
  - id: frontend.negated-membership
    area: frontend-and-lowering
    status: partial
    integrated: "2026-09-11"
    summary: >-
      Accepts contextual not in as the boolean complement of membership without
      reserving not as a keyword. Parser, Sema and LSP share the canonical AST
      operator, and the legacy direct range backends perform one membership
      search followed by boolean negation.
    rules:
      - rules/foundations/lexical_structure.md
      - rules/foundations/grammar.md
      - rules/foundations/operators.md
    code:
      - internal/parser/expression.go
      - internal/sema/analyzer.go
      - internal/sema/semantic_facts.go
      - internal/ir/semantic/builder.go
      - internal/codegen/llvm/expressions.go
      - internal/codegen/mlir/generator.go
      - cmd/lsp/main.go
      - internal/lsp/features/semantic_tokens.go
    tests:
      - internal/parser/parser_test.go
      - internal/sema/analyzer_test.go
      - internal/sema/semantic_facts_test.go
      - internal/codegen/llvm/generator_test.go
      - internal/codegen/mlir/generator_test.go
      - cmd/lsp/main_test.go
      - testdata/sema/in_not_in.sec
      - testdata/lsp/contextual_membership_semantic_tokens.sec
      - testdata/sema/resolved_contextual_operator_facts.sec
    implemented:
      - lexer continues to emit not as IDENT and in as the existing hard keyword
      - parser recognizes the adjacent contextual token pair only in infix membership position
      - canonical AST operator spelling is not in at the same precedence as in
      - standalone identifiers named not remain legal outside the compound operator
      - Sema applies the same collection, element compatibility, ownership and diagnostic rules as in
      - LSP analysis accepts valid not-in expressions through the shared parser and Sema
      - LSP semantic tokens classify parser-confirmed in and both not-in token segments as operators while iteration in and identifier not retain their ordinary roles
      - compiler-owned ResolvedOperator facts preserve membership, negated-membership, and matrix-multiplication operand and result types without tooling re-analysis
      - hover on either token segment of not in presents one full compound-operator range, resolved operand/result types, and canonical complement behavior
      - legacy direct LLVM and MLIR range lowering negate the completed membership result
      - fixed-array Semantic IR deferral recognizes in and not in consistently
    remaining:
      - maintained Semantic IR membership lowering for fixed arrays, dynamic arrays and slices
      - executable backend coverage for negated array and slice membership after that lowering exists
    verification:
      - command: go test ./internal/parser ./internal/sema ./cmd/lsp ./internal/codegen/llvm ./internal/codegen/mlir
        result: passed
      - command: go run ./cmd/compiler parse testdata/sema/in_not_in.sec
        result: passed without diagnostics
      - command: go run ./cmd/compiler sema testdata/sema/in_not_in.sec
        result: passed without diagnostics
      - command: go test ./cmd/lsp -run TestSemanticTokensClassifyContextualMembershipOperators -count=1
        result: passed; membership tokens are operators and equal spellings in iteration or identifier roles remain positionally distinct
      - command: go test ./internal/sema ./cmd/lsp -run 'Test(SemanticFactsRetainResolvedContextualOperators|HoverUsesResolvedContextualOperatorFacts)' -count=1
        result: passed; contextual operators expose compiler-owned facts and position-specific hover without affecting iteration or identifiers
  - id: frontend.operators-v2
    area: frontend-semantic-ir-lowering-and-tooling
    status: partial
    audited: '2026-08-19'
    revised: '2026-09-28'
    repository_baseline: c515862
    document_revision: inferred 2.x
    document_revision_note: rules/foundations/operators.md has no explicit document-revision metadata. Repository
      history shows substantial updates during the revision-2 period, including 2026-08-13, 2026-08-14, and 2026-08-18.
      Later specialized rulebooks and newer governance entries take precedence on conflicts.
    summary: Tracks the canonical Sec operator model across lexer, Pratt parsing, Sema, resolved operator facts, Semantic
      IR, Sec MLIR, legacy/direct LLVM, formatter, diagnostics, and LSP. The frontend implements a substantial operator
      surface and the P7-P9 checked-integer path is implemented through Semantic IR and Sec MLIR. Matrix multiplication,
      aggregate/string operations, collection membership lowering, runtime concatenation, operator effects/tooling,
      and some legacy backend paths remain partial.
    rules:
    - rules/foundations/operators.md
    - rules/types/types.md
    - rules/types/contracts.md
    - rules/types/units.md
    - rules/collections/collections.md
    - rules/collections/shaped-types.md
    - rules/memory/copy_move.md
    - rules/memory/ownership.md
    - rules/errors/runtime_checks.md
    - rules/compiler/semantic_ir.md
    - rules/mlir/sec_mlir_dialect.md
    - rules/mlir/sec_mlir_lowering.md
    - rules/mlir/packages/sec-mlir-dialect_package7.md
    - rules/mlir/packages/sec-mlir-dialect_package8.md
    - rules/mlir/packages/sec-mlir-dialect_package9.md
    - rules/tooling/formatter.md
    - rules/tooling/lsp.md
    code:
    - internal/lexer/lexer.go
    - internal/parser/expression.go
    - internal/parser/parser.go
    - internal/parser/reserved_syntax.go
    - internal/sema/analyzer.go
    - internal/sema/constants.go
    - internal/sema/semantic_facts.go
    - internal/ir/semantic
    - internal/lowering/secmlir
    - internal/codegen/mlir
    - internal/codegen/llvm
    - internal/formatter
    - internal/lsp
    tests:
    - internal/lexer/lexer_test.go
    - internal/parser/parser_test.go
    - internal/sema/analyzer_test.go
    - internal/sema/semantic_facts_test.go
    - internal/ir/semantic
    - internal/lowering/secmlir
    - internal/codegen/mlir/generator_test.go
    - internal/codegen/llvm/generator_test.go
    - internal/formatter/formatter_test.go
    implemented:
    - "fallible text operands (decision 2026-10-03): string `+` accepts an operand of exactly Result[string, StringError] (isConcatOperand), recorded as a StringConcatFallibleText segment of the maximal StringConcatPlan, so `try \"A\" + value.ToString() + \"B\"` is one runtime plan with one StringError channel; constant text still folds without try, a missing try is S1097, other Result or non-text operands keep S1022, and compound += rejects a fallible operand with focused S1022 help while its failure policy is undecided (MD-039) (TestConcatenationAcceptsFallibleTextOperands)"
    - "MD-004 (rules/corrections/applied/missing-decisions-md001-md009-correction-20261003.md § 5, 2026-10-03): every maximal StringConcatPlan is classified as compile-time folded (constant text only, try-free) or runtime; a runtime plan records the resolved active allocation context (hosted and embedded-arena profiles provide the Arena context, noalloc and unassigned profiles none, MD-034) and its failure type StringError (amended 2026-10-03: allocation failure is StringError.Allocation), publishes an allocation effect, is a try failure point of kind allocation, and is rejected with S1097 without try or S1098 without an allocation context"
    - lexer recognition and longest-match tokenization for the established operator inventory
    - Pratt expression parsing with canonical logical, bitwise, equality, comparison/membership, shift, additive,
      multiplicative, prefix, call/index, and member precedence
    - contextual matrix-multiply spelling x at multiplicative precedence
    - boolean validation and short-circuit semantics for && and ||
    - numeric arithmetic operand validation in Sema
    - integer-only bitwise and shift validation
    - compile-time invalid shift-count and signed-left-shift-overflow diagnostics
    - rejection of chained comparisons
    - ordered-comparison validation for compatible numeric operands and matching char, rune, and string operands
    - recursive equality-comparability analysis for implemented fixed-array, struct, union, enum, reference, and scalar
      cases
    - rejection of ordinary equality for unsupported slice, interface, function, and opaque compiler-known categories
    - range membership frontend semantics
    - fixed-array and slice membership Sema validation
    - direct string-concatenation operand matrix for built-in string, char, and rune with S1022 rejection of hidden
      non-text conversion
    - direct string += frontend operand validation
    - resolved checked-integer operator facts, blocking constant division/remainder-by-zero diagnostics, and non-blocking S1023 potential-overflow warnings with checked runtime semantics retained
    - P7 checked-integer Semantic IR and Sec MLIR foundation
    - P8 signedness-correct integer Arith lowering including signed/unsigned comparison, division, remainder, and
      shifts
    - P9 typed arithmetic-failure reasons and Result integration
    - stable structured diagnostics S1016, S1017, S1018, S1019, S1021, and S1022
    - direct LLVM CFG short-circuit lowering for && and ||
    - legacy direct LLVM division, ordered comparison, and range membership preserve represented integer signedness
    - legacy direct LLVM rejects string comparison explicitly instead of emitting invalid or identity-based icmp
    - reserved question marks in statement and expression positions produce focused P2012 diagnostics with the canonical Sec 0.1 message, structured unexpected-token metadata, and retained invalid syntax for recovery and tooling
    partial:
    - operator precedence is duplicated rather than generated or shared from one canonical definition
    - contextual matrix x has parser and fixed-shape Sema support but incomplete Semantic IR, lowering, and tooling
      integration
    - floating comparison lowering does not yet fully satisfy the canonical NaN predicate matrix
    - float and decimal remainder support is incomplete
    - fixed-array and slice membership are type-checked but Semantic IR and short-circuit backend lowering remain
      incomplete
    - runtime string concatenation lacks complete allocation-context, panic-versus-AllocationError, noPanic, interpolation-contract,
      maximal-plan, and lowering semantics
    - string += lacks complete transactional failure and commit semantics
    - aggregate equality lowering and explicit identity/non-comparable metadata remain incomplete
    - string equality and Unicode-scalar lexicographic ordering are not complete across maintained backend paths
    - compound assignment still requires a complete exact-once, checked-failure, contract, volatile, atomic, ownership,
      and commit-order audit
    - operator Semantic IR metadata and effect metadata are not complete for all operator families
    - formatter, diagnostics, LSP explanations, and quick fixes are incomplete across the full operator matrix
    - parser recovery around malformed operator expressions is incomplete
    remaining:
    - centralize precedence and associativity metadata so parser, formatter, diagnostics, and tooling cannot drift
    - complete contextual matrix x Semantic IR, lowering, diagnostics, formatter, and LSP behavior
    - complete all floating NaN comparison predicates and float remainder semantics
    - complete decimal arithmetic/remainder/comparison lowering under the owning decimal rules
    - lower fixed-array and slice membership as exact-once left-to-right short-circuit search without allocation
    - implement exact string-content equality and Unicode-scalar lexicographic ordering through Semantic IR and every
      maintained backend
    - complete compile-time string concatenation materialization as one folded constant
    - "MD-004 lowering: represent StringConcatPlan with its resolved allocation context, StringError channel, ownership, and lifetime facts in Semantic IR and maintained backends; refine the context lifetime for results that escape a local allocation lifetime, and prove allocation elimination under profiles without dynamic allocation"
    - integrate interpolation formatting contracts and string.Concat with the same concat plan
    - implement transactional fallible string += and only apply in-place reuse after proof
    - complete derived aggregate equality lowering and identity/resource exclusion metadata
    - complete compound-assignment exact-once and failure-before-commit semantics
    - complete resolved operator/effect facts in Semantic IR for every accepted operator
    - complete formatter normalization, operator hover, precedence/result/failure explanations, and safe quick fixes
    - complete the canonical operator regression matrices across frontend, Semantic IR, Sec MLIR, direct LLVM where
      maintained, and end-to-end execution
    governance_reconciliation:
    - Do not migrate the operators.md statement that complete checked integer arithmetic/lowering is unimplemented
      as a current blanket status. Newer governance entries for the P7/P8/P9 pipeline supersede that stale embedded
      status for the implemented builtin-integer Sec MLIR path.
    - Keep feature-specific ownership with frontend.collections, frontend.shaped-types, frontend.types-core, lowering.sec-mlir-checked-integers,
      lowering.sec-mlir-checked-integer-arith, and lowering.sec-mlir-typed-arithmetic-failure rather than duplicating
      their detailed implementation matrices here.
    required_tests:
    - canonical precedence and associativity matrix
    - comparison chaining rejection
    - short-circuit exact-once side effects
    - signed and unsigned integer division
    - signed and unsigned ordered comparison
    - signed and unsigned range membership
    - dynamic invalid shift-count failure
    - signed-left-shift dynamic overflow failure
    - float NaN equality and ordering matrix
    - char and rune equality and ordering
    - exact string equality
    - string prefix ordering
    - Unicode-scalar string ordering
    - fixed-array membership first-match short-circuit
    - slice membership first-match short-circuit
    - all nine direct string-concatenation operand pairs
    - non-text concat rejection with S1022
    - runtime concat evaluation order and one maximal allocation plan
    - transactional failed string += leaves destination unchanged
    - struct and fixed-array equality short-circuit
    - unsupported equality and ordering categories rejected
    - reserved ? receives focused Sec 0.1 diagnostic
    - backend parity or explicit unsupported-lowering diagnostics
    verification:
    - command: go test ./internal/parser -run 'ReservedQuestionMark|FocusedRecoveryDiagnosticMetadata|RecoveryPreservesNewlyCentralizedStatementStarts' -count=1
      result: passed on 2026-09-26 with canonical P2012 diagnostics, invalid-expression retention, and statement recovery
    - command: go test ./internal/diagnostics ./internal/sema -count=1 && go test ./cmd/lsp -run TestConstantIntegerOverflowReachesLSPAsWarning -count=1
      result: passed on 2026-09-28 with S1023 registered and emitted as a non-blocking warning while constant division and remainder by zero remain errors
