schema_version: 1
area: tooling-projects
purpose: User-project discovery, configuration, and project-file tooling.
integrations:
  - id: tooling.project-discovery-and-boundary
    area: tooling-projects
    status: partial
    integrated: "2026-10-04"
    summary: >-
      Project discovery through the nearest `.sec/sec.toml`, the single-manifest
      project boundary, and project validation of rules/projects/projects.md
      revision 2.0.
    rules:
      - rules/projects/projects.md
      - rules/projects/modules.md
    code:
      - cmd/compiler/init.go
      - cmd/compiler/main.go
      - cmd/compiler/module_sources.go
      - cmd/lsp/target_plan.go
      - cmd/compiler/init_manifest.go
      - internal/project/source_layout.go
      - internal/sema/project_source_layout.go
      - cmd/compiler/import_sources.go
      - cmd/lsp/project_root_modules.go
      - cmd/lsp/import_sources.go
      - internal/diagnostics/diagnostics.go
    tests:
      - cmd/compiler/main_test.go
      - cmd/compiler/init_dry_run_test.go
      - internal/project/source_layout_test.go
      - internal/sema/project_source_layout_test.go
      - cmd/compiler/project_source_layout_test.go
      - cmd/lsp/project_source_layout_test.go
      - testdata/projects/source_layout/entry.sec
      - testdata/projects/source_layout/support.sec
      - testdata/projects/source_layout/bin_import.sec
      - testdata/projects/source_layout/internal_import.sec
      - testdata/projects/source_layout/store.sec
    implemented:
      - the nearest ancestor `.sec/sec.toml` is discovered by the compiler and the LSP (§ 36)
      - "`sec init` rejects a nested manifest below an existing project (§ 4, § 53(3))"
      - project-root source files (§ 14) and reserved and recognized directories `cmd`, `bin`, `.sec`, and `internal` (§ 15)
      - Shared project SourceLocation and ProjectImportAccess enforce root-only cmd/bin/.sec roles and internal access markers alongside the existing root ModuleName contract. Represented source files directly in cmd or any internal marker and source modules below root bin/.sec are rejected; ordinary nested bin/cmd directories remain ordinary. Imports from reserved storage and inaccessible internal subtrees are rejected before imported declaration visibility; nested internal markers all apply, root internal is project-wide, and component-aware prefix checks avoid granting similarly named siblings access.
      - CLI and LSP consume one shared Sema validator with registered mandatory S1149 on the exact module-name or import-path token. CLI checks selected and sibling sources and recursively loaded project imports; root cmd child entry modules assemble their module main helpers. LSP discovers ancestor disk or unsaved-overlay manifests and validates before recursive import loading, with UTF-16 protocol spans. Root naming, minimal entries and ordinary/internal children remain supported, trusted compiler library provenance is excluded, and validation never deletes output/user files. Complete whole-project discovery/schema validation remains a separate remaining point.
      - ordinary discovered-project nested-manifest validation in CLI/LSP is complete and owned by tooling.project-nested-manifest-discovery; init creation checks and the remaining schema constraints retain their separate ownership
    remaining:
      - complete remaining project validation of § 48 with registered diagnostics for manifest/schema constraints; discovered nested-manifest validation is implemented and owned by tooling.project-nested-manifest-discovery
      - standard library and platform roots (§ 16) resolved through the project model instead of repository-relative lookup
      - stable cache and module identity under Project directory moves (§ 34, § 50(1))
    revised: "2026-10-14"
    verification:
      - command: go vet ./...
        result: passed on 2026-10-13
      - command: go test ./cmd/compiler -run 'EntrySiblings|ProjectSource|RootModule' -count=1
        result: passed on 2026-10-13 after restricting the cmd entry-assembly exception to the Project-root cmd directory
      - command: go test -race ./cmd/compiler ./cmd/lsp ./internal/project ./internal/sema -run 'ProjectSource|ProjectInternal|EntrySiblings|RootModule|AssembleModule' -count=1
        result: passed on 2026-10-13
      - command: go test ./cmd/compiler ./cmd/lsp ./internal/project ./internal/sema ./internal/diagnostics -count=1
        result: passed on 2026-10-13; full compiler/LSP/project/Sema/diagnostic suites; root naming and minimal entries retained, cmd entry helper assembly, reserved storage rejection, nested/root internal access, segment-boundary checks, exact registered S1149 token spans, unsaved ancestor manifest overlays and output/user-file preservation; remaining discovery-and-boundary 4 to 3 and tooling_projects.yaml 10 to 9
      - command: go test ./cmd/compiler ./internal/project ./internal/formatconfig -count=1
        result: passed on 2026-10-13; init uses the governing ancestor manifest from any project subdirectory, rejects actual nested manifests and refuses new-project creation enclosing a child manifest; complete discovered-project CLI/LSP validation remains a separate remaining point

  - id: tooling.project-identity
    area: tooling-projects
    status: partial
    integrated: "2026-10-04"
    summary: >-
      Human-readable ProjectName and stable RFC 9562 ProjectUUID identity (§
      3.2, § 3.3, § 7).
    rules:
      - rules/projects/projects.md
    code:
      - cmd/compiler/init.go
      - internal/project/identity.go
      - cmd/compiler/init_module.go
      - cmd/compiler/init_manifest.go
