    implemented:
      - Sema rejects a live MutexGuard[T] across await and select while accepting a guard explicitly consumed before the boundary.
      - basic acquisition uses the canonical Lock and TryLock names across Sema, blocking diagnostics, existing call sites and tests; shared compiler member facts provide the matching result types, signatures, completion, hover and synthetic navigation, and lowercase aliases are rejected
      - Mutex[T] and MutexGuard[T] have exact loader-proven opaque @noCopy core declarations and matching reserved compiler templates, each with one type parameter and no public storage fields; concrete and inferred owners retain the no-copy policy independently of T, explicit moves and shared-reference copies remain valid, and ordinary struct construction cannot fabricate synchronization or acquisition state; guard destruction and execution-bound movement remain separate obligations
      - Lock resolves exactly the zero-argument, duration and ref Context overloads, returning MutexGuard[T], Option[MutexGuard[T]] and Result[MutexGuard[T], ContextError] respectively; TryLock remains zero-argument only; canonical temporal conversion admits time quantity literals but rejects implicit conversion of typed quantities, wrong dimensions and inexact nanoseconds; Context calls preserve ordinary shared-borrow checks without consuming or retaining the Context, and shared compiler facts expose the selected result and complete signatures to LSP; runtime wait/commit behavior remains separate work
      - Sema rejects proven same-execution reacquisition by Lock or TryLock using canonical synchronization-resource identity, with both acquisitions in CLI/LSP diagnostics; local guard moves, replacement, lexical lifetime and successful Option/Result extraction preserve held-resource evidence, while released or consumed guards, disjoint resources and unresolved aliases do not produce false self-lock proofs; mutable writes and calls conservatively invalidate stale resource provenance
      - Execution-bound guard escape checks reject task/thread spawn arguments, receivers, known closure environments (including nested captured callables), child results, channel sends and static/thread-local stores that carry MutexGuard capabilities; canonical type/Place/capture facts preserve references, named types, aggregates and acquisition provenance, while ordinary same-execution calls/returns and local closures remain valid; opaque callable/aggregate and unresolved generic dependencies require positive guard-freedom evidence and report S1125 Unproven when that evidence is unavailable, preventing capture erasure from permitting transfer; rejected spawn transfers restore source ownership/borrows, canonical escape facts retain known and unknown boundaries, CLI/LSP share the proof classification and navigable guard origins, and a spawned call returning a function keeps the complete callable result type
      - Standalone task and thread joins apply the shared live-MutexGuard boundary check after join-operand/lifecycle validation, with a related guard declaration. Consumed, discarded and scope-ended guards do not diagnose; moved bindings and multiple live guards do. Selected join branches commit a ready capability without a duplicate join-wait diagnostic; the enclosing select remains the suspension boundary. Source-backed Sema/CLI/LSP tests verify parity and prevent invalid IR artifacts; guard diagnostics are ordered by binding name (2026-11-10).
      - "Verified and closed on 2026-11-17: complete protected-T consumption is already prohibited by the shared ordinary receiver/ownership rules (mutex.md sections 33(4), 36(1-2); functions.md section 22; ownership.md section 9). Ordinary methods cannot consume complete self by argument transfer, return or discard, and constructed/recovered consuming-receiver declarations cannot publish that contract. MutexGuard[T] remains nominally distinct from T: moving a guard cannot initialize, return or constructor-convert it to an owned protected T. New source regressions verify six invalid operations and preserve same-execution guard moves, ordinary owned-T transfers and copies of protected scalar fields at all three analysis depths on 32/64-bit plans. Added mutex rule traceability to the existing shared receiver checks. This closes an already-satisfied older requirement through verification; it adds no forwarding or runtime behavior. Complete accessible member forwarding/lifetime support and guard release lowering remain separate remaining items."
      - "Ordinary source-declared protected fields, properties and non-consuming methods now share the normal member/Place/overload pipeline through MutexGuard[T], ref MutexGuard[T] and ref mut MutexGuard[T]. Forwarding retains the nominal guard expression and protected declaring-owner facts; field/property writes and mutating methods/getters require mutable guard access, private visibility and fallible-setter try requirements remain active, and owner/method generic arguments and overloads resolve normally. Direct field and reference-valued property access retain guard-root lifetime/borrow facts, including computed getters: escaping a local protected reference and releasing a still-borrowed guard are rejected with source provenance. Protected partial moves require a separate restoration/release proof and do not inherit ordinary local-owner permission. Source regressions cover valid operations, 15 authority/visibility/try/lifetime failures and four cross-module access failures at all analysis depths on 32/64-bit plans. The broad forwarding requirement remains open for compiler-known protected member dispatch; this frontend slice does not implement guard release or mutex IR/runtime support."
      - Target/profile mutex contracts are frozen in CompilationPlan scalar facts independently for blocking, try, timeout and context acquisition. Trusted producer evidence is validated, detached, target/profile-bound, deterministically inspectable and included by semantic meaning in memory/runtime/execution reuse fingerprints. Target definitions project the same facts into existing compiler/LSP analyzer construction. Sema rejects explicit Unsupported contracts with mandatory S1253 mutex.target-capability naming the selected profile, reason and evidence; accepted overloads retain detached selected-plan evidence and the canonical guard/Option/ContextError result type. Missing facts remain Unknown, including on every registered hosted target, and neither ordinary atomics nor IPCMutex support implies ordinary Mutex support. Supported acquisition contracts grant no extra ISR/nonblocking permission or physical lowering capability. Runtime acquisition, guard release, winner/cancellation handling and lowering consumption remain with their separate owners (verified 2026-11-21).
    partial:
