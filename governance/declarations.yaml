  - id: frontend.impl-core-privilege
    area: frontend-source-provenance-and-impl-coherence
    status: implemented
    audited: "2026-08-19"
    repository_baseline: c515862
    document_revision: "2.0"
    document_created: "2026-08-13"
    document_last_updated: "2026-08-14"
    summary: Compiler-known implementation authority requires immutable trusted-core source provenance supplied by the compiler or LSP loader after canonical source-root resolution. User-controlled path spelling cannot grant the privilege, and the explicit compiler-known target allowlist remains enforced.
    rules:
      - rules/declarations/impl.md
      - rules/projects/modules.md
      - rules/collections/collections.md
      - rules/collections/shaped-types.md
    code:
