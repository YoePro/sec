    semantic_ir_remaining:
      - represent copy versus consume explicitly
      - represent move source Place and destination ownership
      - represent Availability plus recursive partial and conditional masks where lowering needs them
      - preserve UnavailableReason and source provenance for tooling
      - represent pending and committed call-transfer facts or an equivalent resolved ownership plan
      - distinguish replacement from reinitialization
      - represent conditional destruction and cleanup responsibility
      - represent return forwarding explicitly
      - verify ownership operations instead of inferring moves from unused SSA values
      - retain source Place and rule provenance for diagnostics and LSP
    lowering_remaining:
      - lower static ownership state without unnecessary runtime flags
      - lower genuinely dynamic conditional ownership through local SSA or drop-state when policy permits
      - eliminate runtime ownership state when static proof is sufficient
      - conditionally destroy exactly once for discard, replacement, and scope exit
      - commit call transfers atomically at the callee-entry boundary
      - retain caller ownership when failure occurs before outer-call commit
      - preserve completed nested argument-expression effects
      - verify Sec MLIR and LLVM ownership and cleanup behavior
      - keep local ownership bookkeeping out of public ABI unless an ABI rule requires it
    tooling_remaining:
      - stable ownership diagnostic IDs
      - mentor diagnostics with Place, earlier operation, reason, and practical correction
      - missing call-site move quick fix only for compiler-proven consuming intent
      - hover for availability state, unavailability provenance, and copied versus consumed arguments
      - expose pending versus committed transfer where useful
      - expose static versus runtime-dependent availability and target-policy rejection
      - preserve every ownership marker without formatter insertion or removal
