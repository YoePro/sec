  status: implemented
  completed_on: '2026-08-08'
  repository_head: d48035c
  package_2_pre_status: implemented_and_green
  compiler_implementation_status_sync: deliberately_not_merged
  storage_api:
  - StorageID
  - Storage and StorageClass
  - storage.declare
  - storage.init
  - storage.load
  - storage.store
  sema_api:
  - BindingID and ResolvedBindingOf
  - ResolvedCall and ResolvedCallTarget
  - direct, foreign, and static-method call classification
  call_kinds_emitted:
