      - finite-loop zero-iteration preservation and infinite-loop non-continuation through a current-loop-targeted break query that excludes nested-loop and constant-unreachable breaks
      - LLVM lowering for infinite loops, integer ranges, explicit integer steps, break, and continue
      - MLIR lowering for infinite loops, integer and explicit floating ranges, break, and continue
      - MLIR fixed-array iteration with one value or two index/value bindings and discard support without runtime allocation
      - compiler-known generic Iterator[T] interface requiring mutable Next() Option[T], with explicit primary-impl conformance and no naming-based discovery
      - concrete generic interface method, property, and event type substitution for resolved instances
      - Iterator[T] loop inference for one owned value or discard binding, including mutable reusable-source enforcement and fresh-temporary acceptance
      - immutable Sema ResolvedForIteration fact carrying concrete source, element, Next method, compiler-known operation ID, and receiver authority for tooling and lowering
      - StringSplitIterator explicitly implements Iterator[string], enabling direct for iteration over string.Split results in core and HTTP clients
      - LSP analysis recognizes compiler-known Iterator[T] while the defining core string source is the active document, without suppressing unrelated diagnostics in that file
      - canonical grammar, collections, and copy/move documentation synchronized to explicit value, ref, ref-mut, and discard semantics
    remaining:
      - carry Arena generation through the shared loop-header and backedge fixed-point analysis, including continue edges and replay
      - add binding-mode representation to AST and parse, format, and expose canonical ref name and ref mut name loop bindings through compiler-owned LSP facts
      - require plain by-value iteration to copy only implicitly copyable yielded types without silently moving or borrowing move-only elements
      - implement shared element-reference iteration only for stable addressable iterable positions
      - implement mutable element-reference iteration with mutable authority and exclusive borrow tracking
      - keep a sequential two-binding index as ordinary int or discard and apply reference modes only to its element binding
      - enforce exact map key/value reference modes, including shared keys and values, mutable values with authority, and rejection of mutable key references
      - permit plain-copy or shared-reference set iteration and reject mutable set element references
      - ensure discard bindings introduce no transfer, copy, move, or copyability requirement for the discarded yielded component
      - reject consuming for-arrow and move-source syntax without adding a consuming iteration mode in Sec 0.1
      - make omitted integer-like range step unconditionally ascending +1 so start greater than end yields zero iterations in Sema, Semantic IR, MLIR, and LLVM
      - require explicit compatible negative steps for descending iteration without synthesizing signed conversion for unsigned ranges
      - require explicit steps for float and decimal range iteration
      - complete float and decimal range lowering with resolved-type arithmetic and stable source-visible endpoint behavior
