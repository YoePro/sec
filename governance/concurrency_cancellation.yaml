      - command: go test -race ./internal/layout ./internal/platform/target ./internal/sema ./cmd/compiler ./cmd/lsp -run 'TestPhysicalThread|TestThreadCurrent|TestMutexTarget' -count=1 -timeout=120s
        result: "Passed 2026-11-22: layout 1.011s, target 1.009s, Sema 1.676s, CLI JSON transport 1.061s and LSP transport 1.069s. Three depths and 32/64-bit plans preserve ThreadContext/logical-task separation, selected-plan evidence, reanalysis and query isolation. Explicit Unsupported produces S1254 with target/profile/reason; stale snapshots are rejected even for explicit Unknown. Every registry target remains Unknown without trusted producer evidence."
