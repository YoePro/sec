schema_version: 1
area: analysis
purpose: Standalone and interprocedural program analyses.
integrations:
  - id: sema.pitfall-analysis
    area: frontend-analysis
    status: partial
    integrated: "2026-08-11"
    audited: "2026-08-11"
    updated: "2026-10-05"
    document_revision: "2.0"
    repository_baseline: main-reviewed-2026-10-04
    corrections_applied:
      - rules/corrections/applied/pitfall-analysis-rev2-sync-20261004.md
    summary: >-
      Adds structured high-confidence pitfall analysis that correlates canonical
      bounds, range, control-flow, Place/provenance, collection, API usage, effect, and FFI
      contract facts to detect common human mistakes without redefining the
      normative semantics owned by those analyses.
    rules:
      - rules/analysis/pitfall_analysis.md
      - rules/compiler/compiler_analysis.md
      - rules/analysis/call_graph.md
      - rules/analysis/effect_analysis.md
      - rules/memory/ownership.md
      - rules/memory/borrowing.md
      - rules/memory/lifetime_analysis.md
      - rules/analysis/escape_analysis.md
      - rules/analysis/closure_analysis.md
      - rules/memory/storage.md
      - rules/memory/layout.md
      - rules/collections/collections.md
      - rules/platform/ffi.md
    code:
      - internal/sema/analyzer.go
      - internal/sema/place.go
      - internal/sema/pitfall_analysis.go
      - internal/sema/pitfall_bounds_guards.go
      - internal/sema/pitfall_final_element.go
      - internal/sema/pitfall_neighbor_bounds.go
      - internal/sema/pitfall_skipped_first.go
      - internal/sema/pitfall_intervals.go
      - internal/sema/constants.go
      - internal/sema/pitfall_guard_subject.go
