  - id: compiler.compile-time-evaluation
    area: compiler-semantic-evaluation
    status: partial
    integrated: null
    document_revision: "1.0"
    repository_baseline: 0f5027d
    summary: "Tracks canonical Sec 0.1 compile-time evaluation: restricted plan-time contexts plus typed semantic CTE over canonical Sec semantics, including ordinary user functions, path-sensitive effect legality, loops/recursion, transient allocation, ownership/borrowing/destruction, cross-module semantic execution, generic concrete callables, dependency tracking, resource limits, typed compile-time values, static materialization, diagnostics, caching, and integration around the Semantic IR -> Sec MLIR -> MLIR -> LLVM -> artifact pipeline. The repository already contains partial compile-time/constant evaluation behavior for several declaration and folding paths, but the complete semantic CTE service is not yet implemented."
    rules:
      - rules/compiler/compile_time_evaluation.md
      - rules/foundations/attributes.md
      - rules/declarations/static.md
      - rules/declarations/generics.md
      - rules/compiler/generics_lowering.md
      - rules/compiler/monomorphization.md
      - rules/compiler/compiler_known_members.md
      - rules/compiler/semantic_ir.md
      - rules/compiler/compiler_pipeline.md
      - rules/projects/modules.md
      - rules/memory/layout.md
      - rules/memory/ownership.md
      - rules/memory/borrowing.md
      - rules/memory/copy_move.md
      - rules/memory/destruction.md
      - rules/memory/raw_pointers.md
      - rules/analysis/effect_analysis.md
      - rules/errors/panic.md
      - rules/errors/runtime_checks.md
      - rules/mlir/sec_mlir.md
      - rules/mlir/sec_mlir_dialect.md
      - rules/mlir/sec_mlir_lowering.md
    implemented:
      - value.SizeOf and TypeName.SizeOf are the only SizeOf forms; global SizeOf(TypeName) is rejected as an unknown function and is absent from the registry, completion, and tests (TestCompilerKnownCanonicalPropertyAndCollectionRestrictions)
      - compiler-known registry entries carry an explicit CompilerKnownMemberCategory (CompilerProvidedFallbackMember, AuthoritativeCompilerSemanticProperty, CompilerKnownOperation, PrivilegedCoreMember, OrdinaryUserMember) with UserReplacementPermitted policy; ToString() is the replaceable fallback, compiler-known properties are authoritative, methods are operations
      - a user impl member that would replace an authoritative compiler-known property applicable to its target (SizeOf on any sized type, Len on a named sequence type, and similar) is rejected with mandatory S1070 members.authoritative-compiler-property and help; exact ToString() replacement and other ToString overloads keep ordinary method resolution, and loader-proven trusted core keeps its privileged implementing members
      - LSP hover states whether a compiler-known member is a fallback, authoritative property, operation, or privileged core member
      - language-rulebook-status.md lists compile_time_evaluation.md as Written and narrows the reflection exclusion to general-purpose structural compile-time reflection and declaration metaprogramming
      - parser/Sema infrastructure already recognizes multiple compile-time-required declaration facts such as enum values, fixed sizes/extents, static facts, attributes, and compiler-known layout/member queries
      - compiler-known SizeOf resolves target-plan-dependent layout information in the value and type property forms
      - current frontend and semantic analyses already perform constant propagation/folding and static validation in several narrow language paths
      - generic frontend and Semantic IR infrastructure can represent concrete generic identities required by future generic CTE execution
      - module and separate-compilation infrastructure already defines canonical declaration identities and semantic artifacts that can be extended for CTE bodies/dependencies
      - effect analysis already provides canonical effect facts that CTE can consume for permitted-effect decisions
      - ownership, borrowing, destruction, layout, and Semantic IR rulebooks already define the semantic facts the CTE service must preserve
      - "MD-011 (rules/corrections/applied/missing-decisions-md010-md014-correction-20261003.md § 3, 2026-10-03): compile_time_evaluation.md § 8(5)–(7) classifies contract arguments and explicit defaults as SemanticCompileTimeRequiredContexts; internal/sema/contract_cte.go evaluates them through the shared compile-time evaluation (literals and operators, immutable module bindings via the shared integer evaluator, immutable primitive bindings) instead of a contract-only evaluator, and classifies calls and property getters as legal semantic CTE awaiting the executor (S1101)"
      - "2026-11-11: ordinary user-defined Sec functions execute during semantic CTE without const-fn/comptime modifiers (internal/sema/cte_executor.go; TestSemanticCTEExecutesOrdinaryFunctions)."
      - "2026-11-11: CTE legality is path-sensitive: a forbidden operation on an unexecuted branch does not invalidate the evaluation (`Pick(true)` evaluates while `Pick(false)` reaches a foreign call) (TestSemanticCTEExecutesOrdinaryFunctions, TestSemanticCTEFailureCategories)."
      - "2026-11-11: resource exhaustion is distinguished from nontermination and from target out-of-memory: S1225 compile-time.resource-limit names the exhausted budget and states it is not a nontermination proof (TestSemanticCTEFailureCategories)."
      - "2026-11-11: required CTE fails closed: contract, default and static-initializer evaluations that establish no value report S1223/S1224/S1225/S1226 or S1101 and never emit a runtime initializer or host substitute (TestSemanticCTEFailureCategories, TestSemanticCTEStaticInitializers)."
      - "2026-11-11: static initializers and static property getters run on the semantic CTE executor (static.md §§ 15-16; compile_time_evaluation.md §§ 9, 21, 39, 65). validateStaticInitializerExpression routes calls to Sec functions and static getter reads to the executor instead of rejecting them (a direct foreign call stays a runtime-initializer error); the analysis defers them and executes them after every body is analyzed (executeDeferredStaticInitializers), immediately before freezeStaticScalarInitializers, which then materializes the established scalar value through the existing ResolvedStatic.Initializer path, so Semantic IR receives module statics such as init=4096 with no startup code. Contracts and defaults that read such a static use the probe. The executor reads immutable statics through their initializer, rejects reading a mutable static (S1223) and reports a static value that needs itself, also through called functions, as S1226 compile-time.dependency-cycle with the chain. Static property getters execute from their getter body (Sema's getter callable identity), in contracts, defaults and static initializers. A root that ordinary analysis already rejected gets no CTE follow-up diagnostic. Earlier tests that expected function-calling static initializers to be rejected were updated to the § 15 rule (TestSemanticCTEStaticInitializers, TestSemanticCTEStaticPropertyGetters, TestStaticInitializerValidationAndDependencyOrder)."
      - "2026-11-11: struct, Option and Result values in the semantic CTE executor (compile_time_evaluation.md §§ 2(2), 11, 20, 26, 32, 46). DefaultConstant carries a CompileTimeAggregate (struct type and ordered fields, or the active variant and payload) that scalar consumers ignore; a field write clones first, so copies keep Sec value semantics. Struct literals follow Sema's construction plan with omitted fields from resolved defaults; field reads and field/compound writes work on locals and the receiver; instance methods and instance getters execute with a receiver frame, and a method that mutates its receiver writes the value back to the receiver Place; implicit members resolve through ResolvedPlaceOf (receiver root plus projections). Ok/Err/Some/None construct variants; handler-free try unwraps Ok/Some and returns Err/None from the enclosing function; match runs in statement and expression position with variant payload bindings, guards and catch-all, and `if value is Some(binding)` binds the payload (TestSemanticCTEStructValues, TestSemanticCTEResultOptionTryAndMatch)."
      - "2026-11-11: required CTE never depends on MLIR/LLVM folding: the executor runs inside Sema before Semantic IR exists, and Semantic IR receives the established static values as ordinary initializers (verified init=4096 without startup code)."
      - "2026-11-11: CTE outcomes in LSP (§ 73). Analyzer.CompileTimeValueAt exposes the established value (rendered as Sec source, including struct and variant values) or the failure category, reason and executed call chain of a required root; hover on the root of a contract argument, explicit default or static initializer shows it without an editor evaluator (cmd/lsp/compile_time_value_hover.go; TestCompileTimeValueHover)."
      - "2026-11-12: ordinary semantic operation failures (checked overflow, division by zero, out-of-range conversion, non-positive loop step) are classified SemanticOperationFailed, separate from a reached assert or panic, reported as S1223 with distinct category text (TestSemanticCTESemanticOperationFailed)."
      - "2026-11-12: the TransientMemory (4,194,304 scalar cells per evaluation, including copies on write) and AggregateValueSize (65,536 flattened scalars per value) budgets are enforced as S1225 (TestSemanticCTEBudgetsAndMemoization)."
      - "2026-11-12: receiver-free calls are memoized per analysis by callable identity and rendered argument values; every analysis starts empty, which keeps invalidation exact (naive Fib(30) completes) (TestSemanticCTEBudgetsAndMemoization)."
      - "2026-11-12: resource-limit and other failure outcomes never become negative caches: only successful call results are memoized (TestSemanticCTEBudgetsAndMemoization). An evaluator fault is recovered as CompilerInvariantFailure, S1228 (TestSemanticCTECompilerInvariantFailure)."
      - "2026-11-12: evaluation, owning-context validation and static materialization are separate stages (compile_time_evaluation.md §§ 30, 62, 64). The executor only establishes a typed value or a failure outcome; the owning construct then validates it: a contract range bound evaluated outside the base type (`range 0..Big()` with 300 on int8) or a non-integer bound (also a literal `0..true`, previously accepted silently) is S1066 contracts.invalid-argument owned by the contract, an unrepresentable default is S1060, a static initializer keeps ordinary assignment compatibility; static materialization is a separate later stage (freezeStaticScalarInitializers -> ResolvedStatic.Initializer) that runs only for valid programs (TestSemanticCTEOwningContextValidation)."
      - "2026-11-12: union variant construction (tuple, field and payload-free variants, including error unions), field patterns, error-variant narrowing (`Err(E.Variant)`, `Err(.Variant)`, `Err(E.Variant(binding))`) and `try` with local handlers (binding, compared and catch-all handlers, guards, expression, return and final-value block bodies) execute during semantic CTE; variant and struct values compare structurally (internal/sema/cte_variants.go; TestSemanticCTEUnionsPatternsAndHandlers, TestSemanticCTEErrorPayloadPatternsAndBlockHandlers)."
      - "2026-11-12: a module-private helper executes in its origin module's scope when a public function of that module runs at compile time, while the importer still cannot name the helper (TestCLICompileTimeEvaluationAcrossModules)."
      - "2026-11-12: CompileTimeProvenance includes the executed callee's origin module (shown when it differs from the requesting module) and the generic instantiation (`Checked[T = int]`) in the reported call chain, alongside RequiredBy, RootExpression and the stop location (TestSemanticCTEGenericInstances)."
      - "2026-11-12: optional early evaluation reuses the executor through Analyzer.OptionalCompileTimeValue: a failed optional evaluation returns no value and records no source diagnostic, while an evaluator fault is returned as a compiler invariant error (TestOptionalCompileTimeValue)."
      - "2026-11-12: executed filesystem, network, environment, ambient-random, target-memory, volatile, atomic, barrier and concurrency operations are S1224 compile-time.forbidden-effect, classified from Sema facts only: spawn, await, select, detach and join; operations on Task, Thread, ThreadObserver, Channel, Sender, Receiver, Mutex, MutexGuard, Event and Subscription receivers; Atomic[T] operations; atomic.Fence barriers; RawPtr access and compiler-known members whose registry effects are memory or volatile access or ambient nondeterministic input; runtime @ calls (I/O). Filesystem, network and environment access reach Sec only through foreign or runtime calls, which are forbidden at the call. Constructing Atomic/Mutex values stays legal (valid runtime static initializers) (internal/sema/cte_effects.go; TestSemanticCTEForbiddenConcurrencyAndAtomicEffects)."
      - "2026-11-12: successful semantic CTE yields a typed CompileTimeValue (§ 11): the canonical Sec type (the root's resolved type or the static's declared type), its module-qualified TypeIdentity (canonicalTypeIdentity, e.g. main:struct:Point) and the SemanticValue; Analyzer.CompileTimeValueOf exposes it, CompileTimeValueFact carries the type for tooling and LSP hover shows `value: Type` (TestCompileTimeValueIsTyped, TestCompileTimeValueHover)."
      - "2026-11-12: conservative CTE dependency tracking in the § 58 categories: DeclarationSemantics (every executed function, getter and free), GenericConcreteInstance, ImmutableCompileTimeValue (statics and immutable bindings read), TypeSemanticFact (nominal types consulted by results, conversions and aggregates), LayoutFact (SizeOf), CompilationPlanFact (the platform scalar width of int, uint and float) and ImportedSemanticArtifact (modules other than the request's). Dependencies are collected per call and memoized with the call result, so a memo hit keeps its transitive inputs; Analyzer.CompileTimeDependencies returns them for successful and failed outcomes (internal/sema/cte_dependencies.go; TestSemanticCTEDependencies, TestCompileTimeDependenciesNameImportedModules)."
      - "2026-11-12: ownership, move, borrow, destruction and defer semantics execute during CTE, including reference parameters: moves (implicit, explicit `<-` and partial, from Sema's recorded move sources) end the source's responsibility; `ref`/`ref mut` parameters bind the argument Place and write it back (exact under the borrow rules), and `let r := ref mut x` reads and writes x; defer is invocation-scoped, runs in reverse registration order and reads each loop iteration's own binding instance; deferred blocks and automatic destruction share one LIFO order; owned bindings and by-value parameters are destroyed at scope end (custom free first, then fields in reverse declaration order), replacement destroys the old value, a moved binding's reinitialization registers anew, discard destroys now; temporaries in field reads, method receivers and match subjects end with their full expression and pattern bindings take over owned payloads. Every custom-free value has a logical identity, and one neither destroyed nor retained by the result fails closed as an ImplementationGap, so a free is never skipped silently (internal/sema/cte_ownership.go; TestSemanticCTEReferenceParametersAndDefer, TestSemanticCTEDestruction, TestSemanticCTEUnifiedCleanupOrder, TestSemanticCTETemporariesAndLocalReferences, TestSemanticCTEOwnershipAccountingFailsClosed)."
      - "2026-11-12: type/value dependency cycles through contract and default positions are detected without conflating them with recursion: deferred requests record the type fact they establish (range bound at its contract index, or the type default); executed code that needs a fact (a checked conversion into the type, a default-initialized field of it) establishes it on demand in dependency order, and a fact already being established is S1226 compile-time.dependency-cycle with the chain (`the range upper bound of Ping -> the range upper bound of Pong -> the range upper bound of Ping`, `the default of Level depends on itself`). Checked conversions execute with the runtime order of checks (OutOfRange, then contracts in source order as ContractError.Violation { Kind, DeclarationIndex }, the channel Sema types). Layout facts do not depend on CTE values in Sec 0.1 (a constrained type's layout is its base type's) (internal/sema/cte_conversions.go; TestSemanticCTECheckedConversions, TestSemanticCTETypeFactCycles, TestSemanticCTETypeDefaultFacts)."
      - "Deterministic evaluator-local transient storage completed 2026-11-12 (compile_time_evaluation.md sections 24-25,33,48-49): request-local budgets bound aggregate/copy-on-write cells and generated UTF-8 text independently of target allocators, heap capacity, generations, host addresses and wall-clock time. String concatenation reserves per-value and cumulative capacity before constructing text; failed reservations cannot overflow or change the ledger. ResourceLimit/S1225 aborts evaluation outside Sec try handlers, never becoming allocator Err. Successful fallible concatenation uses the ordinary try success edge; canonical explicit Arena operations are ForbiddenEffect/S1224, never substituted. Storage charging is extracted to cte_storage.go and tryOperand to cte_try.go, preserving checked conversion semantics. Source-backed tests cover hosted/noalloc/freestanding profiles and 32/64-bit plans, aggregate/string computation, per-value/cumulative exhaustion, independent requests after failure, compiler human/JSON diagnostics and invalid artifact rejection, and shared LSP diagnostics/hover. Dynamic collections, evaluator references and runtime materialization retain their separate remaining requirements."
      - "2026-11-12: every compile-time-required position of the parsed program, excluded source included, is classified in semantic state (Analyzer.CompileTimeContextOf): attribute arguments, @target selectors and @when conditions are PlanTimeRequiredContext; range bounds, in members, multipleOf divisors, length values, regex patterns, explicit type defaults, binding and struct-field contracts and module and function-local static initializers are SemanticCompileTimeRequiredContext, each with its construct; tooling shows it (`required by: range upper bound (SemanticCompileTimeRequiredContext)` in the compile-time value hover). Struct layout modifiers are not parsed yet and get their classification with them (internal/sema/cte_contexts.go; TestPlanTimeSelectionNeverExecutesUserCode, TestCompileTimeValueHover)."
      - "2026-11-12: the restricted plan-time evaluator selects source before Sema: @when evaluates only literals, typed config parameters and the restricted operators and @target only string selectors, so selecting the active source graph never executes user code and cannot form a phase cycle with it; a call in @when is S1118 attribute.argument-not-compile-time (`argument of @when must be known while the compilation is planned; a function call needs run-time execution`), while semantic CTE positions in the same program execute ordinary functions (TestPlanTimeSelectionNeverExecutesUserCode)."
      - "2026-11-12: evaluator-local references use deterministic semantic identity independent of host addresses: `ref`/`ref mut` arguments and `let r := ref x` bindings, and copies or moves of such bindings, denote the referenced Place (binding plus field path) and read and write it; a reference-valued binding with no Place identity fails closed. Raw pointers have no CTE representation: their operations are S1224 target-memory effects and nothing in the executor creates one (TestSemanticCTEReferenceIdentityNeverEscapes, TestSemanticCTETemporariesAndLocalReferences, TestSemanticCTEReferenceParametersAndDefer)."
      - "2026-11-12: transient identities never escape materialization: evaluator values hold no addresses or generations, a function or getter returning a reference fails closed instead of returning a copy that would lose writes through it (previously `Pick(ref mut acc)` silently yielded a copy), and the custom-free ownership identities are stripped from every established value before static materialization or later requests read it (prepareCTEMaterialization; TestSemanticCTEReferenceIdentityNeverEscapes)."
      - "Recursive materialization graph validation completed 2026-11-12 (compile_time_evaluation.md sections 28-37,48-49,54,56-59): prepareCTEMaterialization validates the complete represented typed value graph before recursive ownership accounting or storage handoff. It checks canonical struct fields and active Result/Option/union payloads including field payloads and void, preserves nominal/concrete type identity, removes evaluator ownership IDs from a fresh copy, accepts acyclic sharing, and rejects cyclic graphs or reference/pointer/view values without validated program storage identity as ResultNotMaterializable. Unknown array/function/generic representations fail as ImplementationGap; malformed compiler graphs are CompilerInvariantFailure and traversal has deterministic resource limits. Mandatory S1244 compile-time.result-not-materializable distinguishes successful computation from storage failure and names the stored-value path; failed graphs expose no established value. The unguarded withoutOwnerIdentities walk is replaced by this guarded boundary. Source-backed tests cover nine typed roots, compiler check and LSP hover; compiler-service fault injection verifies unsafe/cyclic graphs, hidden/missing payloads, immutable sanitation, bounded traversal and diagnostic identity without inventing unsupported source programs. Physical layout, static reference relocation (MD-081), dynamic-owner execution and physical lowering/materialization retain their separate remaining requirements."
    remaining:
      - "static reference materialization (MD-081 applied; compile_time_evaluation.md §§ 28(6), 36(5)): represent a `ref S` static initializer as a typed symbolic reference target (never an evaluator address or a read of a mutable static), and materialize it through a target symbol/relocation selected by the CompilationPlan with a fail-closed materialization diagnostic when the target cannot represent it; Sema validation is implemented; Semantic IR rejects such statics explicitly until P15-42 static-held borrows and P24 reference lowering exist"
      - implement a canonical typed Semantic IR CTE execution service rather than relying only on AST/literal-specific constant evaluation
      - materialize supported scalar, fixed aggregate, enum/union/Option/Result, and immutable string values through ordinary target storage/layout lowering
      - allow dynamic owning collections transiently in CTE while rejecting static escape when the concrete type lacks defined materialization
      - implement cross-module CTE body availability from separately compiled canonical semantic artifacts (functions of imported source modules in the same build execute since 2026-11-12, TestCLICompileTimeEvaluationAcrossModules)
      - request generic concrete instances through the monomorphization/generic-lowering contracts once the executor runs on Semantic IR (the concrete instance Sema selects for a call, with its substitution, executes since 2026-11-12, TestSemanticCTEGenericInstances)
      - produce the Cancelled outcome for cancellable analysis requests; ResultNotMaterializable classification and diagnostics are implemented at the recursive value-graph boundary, while transient reference/dynamic-collection execution remains under its separate requirements
      - integrate CTE as a semantic service around typed Sema/Semantic IR and the Sec MLIR -> MLIR -> LLVM -> artifact pipeline
      - allow MLIR infrastructure reuse internally only when canonical Sec and target-plan semantics are preserved
      - audit every compiler-known Sec declaration for complete canonical declaration and owning module (rulebook A/B choices are MD-016)
    required_tests:
      - plan-time attribute expression accepts permitted plan inputs and rejects ordinary semantic user-function dependency
      - semantic CTE executes an ordinary user function without const-fn/comptime syntax
      - same ordinary function executes at runtime when used from an ordinary local runtime context
      - ordinary local constant expression remains valid when optional folding is disabled
      - required static initializer fails compilation when semantic CTE cannot produce a value
      - required static initializer never falls back to hidden runtime initialization
      - path-sensitive CTE succeeds when a forbidden-effect branch is not executed
      - path-sensitive CTE rejects the same function when the forbidden-effect branch is executed
      - immutable compile-time value may be read during CTE
      - mutable runtime static may not be read or mutated during CTE
      - filesystem, network, environment, clock, ambient random, MMIO, volatile, atomic, barrier, concurrency, and foreign operations are rejected when executed by required CTE
      - explicit deterministic PRNG state using only compile-time values remains ordinary deterministic computation
      - unsafe block does not grant extra CTE capability
      - transient allocation succeeds without using target runtime heap state
      - explicit runtime allocator resource is not silently replaced by evaluator allocation
      - move-only value preserves move semantics during CTE
      - borrow/reborrow/lifetime rules remain valid during CTE
      - destruction and defer ordering follow ordinary Sec execution during successful CTE
      - assert failure becomes required CTE evaluation failure with provenance
      - panic reached during required CTE becomes evaluation failure without crashing the compiler
      - Result.Err remains a successfully evaluated Result value
      - semantic operation failure uses owning language diagnostic plus SemanticOperationFailed category
      - ordinary recursion can succeed during CTE
      - compile-time value dependency cycle is rejected distinctly from function recursion
      - type/layout/value dependency cycle is diagnosed with the semantic cycle
      - ExecutionSteps limit exhaustion reports resource limit rather than semantic nontermination
      - larger evaluation budget may retry an earlier resource-limited evaluation
      - transient-memory exhaustion is not target runtime OOM
      - scalar/fixed-array/struct/enum/union/Option/Result values materialize when their owning rules permit
      - CTE-generated immutable string materializes without preserving evaluator-host address
      - dynamic list may be used transiently to compute a scalar result
      - dynamic list result without static materialization reports ResultNotMaterializable rather than NotEvaluable
      - transient safe-reference address cannot escape static materialization
      - transient raw-pointer numeric host address cannot escape static materialization
      - target platform address metadata is distinct from evaluator-local address identity
      - public cross-module function executes under semantic CTE
      - public cross-module function may execute its already-resolved private origin-module helper without exposing that helper to importing source
      - sourcefile-only origin helper remains inaccessible to other source files/importers
      - generic concrete callable uses the same canonical specialization identity for CTE and runtime demand
      - unresolved generic parameter never executes as runtime-like CTE generic state
      - SizeOf result uses active CompilationPlan and cross-target tests do not use host size
      - TypeName.SizeOf and value.SizeOf resolve as canonical properties
      - global SizeOf(TypeName) is rejected after correction migration
      - CTE cache invalidates on relevant body/helper/immutable-value/layout/CompilationPlan changes
      - cancellation does not produce a source diagnostic or permanent negative cache
      - optional early evaluation resource failure leaves ordinary runtime code intact
      - valid-but-unimplemented semantic CTE path reports implementation gap
      - impossible evaluator type/value mismatch reports compiler invariant failure
      - LSP displays compiler-established CTE result/provenance without re-evaluating source independently
    excluded:
      - source-level const fn or comptime fn modifiers
      - source-level comptime expression or block syntax
      - a source-visible CTE namespace or IsCompileTime-style query
      - first-class Sec Type/TypeInfo values introduced solely by this rulebook
      - TypeOf introduced by this rulebook
      - arbitrary value/const generic parameters
      - general-purpose structural compile-time reflection
      - declaration generation, AST rewriting, source-string reparsing, or Zig-style compiler-language metaprogramming
      - runtime generic dictionaries, type erasure, hidden reflection metadata, or runtime specialization as CTE fallback
      - ambient host filesystem/environment/time/random/network as implicit semantic CTE input
      - target hardware execution or MMIO reads during CTE
      - optional MLIR/LLVM constant folding as the semantic implementation of required CTE
    corrections_applied:
      - rules/corrections/applied/compile-time-evaluation-cross-rulebook-correction-20260907.md
      - rules/corrections/applied/compiler-known-fundamentals-cross-rulebook-correction-20260907.md
