schema_version: 1
area: generics
purpose: Generic declarations, specialization, and monomorphization.
integrations:
  - id: frontend.generics-v2
    area: frontend-analysis-and-lowering
    status: partial
    integrated: "2026-08-14"
    revised: "2026-11-20"
    document_revision: "2.2"
    summary: >-
      Tracks revision-2.2 compile-time type generics and demand-driven
      monomorphization. Generic structs, functions, unions, enums, interfaces,
      impl scopes, inference, substitution, nominal instance caching, and basic
      constraint declaration validation have substantial frontend support;
      ordered multi-constraint conjunctions, explicit generic function and
      concrete generic-type conformance checks, and constraint-guaranteed
      instance method lookup in generic bodies now have frontend support, and
      LSP hover presents ordered constraint sets from compiler facts;
      method-level generics, complete specialization identity, and concrete-only
      backend lowering remain incomplete.
