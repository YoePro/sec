      - "P16-51 (2026-10-21): completed unsupported boundaries on actual 32/64 scalar plans. Eighteen source cases distinguish mandatory errors from named IR capability failures and require source-qualified failures with no partial module. Pointer extraction, Reverse and resolved membership now stop at compiler-owned P16 capability gates instead of generic missing member/call errors. Verified IR rejects shared/mutable foreign parameters/returns and nested struct/union carriers or explicit physical layouts with no bytes. Actual emitted source passes slice/P15 verifiers before support, composed LLVM and P8 physical boundaries reject without artifacts. Forty-eight CLI cases add a supported main and verify build/emit-mlir/emit-llvm error classes, source-owned JSON messages and absent stdout/output. Ordinary StableHandle/WeakHandle wrappers gain no implicit sequence API; no public handle syntax, FFI descriptor, element ownership or P17/P18/P24/default-schema promotion is introduced."
      - "P16-57 (2026-10-21): added rules/mlir/packages/sec-mlir-dialect_package16-implementation-report.md with all 43 current section-145 topics in order, current HEAD and P16-related dirty inventory, exact toolchain/source revision, source/IR/schema/physical boundaries, canonical unsigned length and checked signed conversion, P15 dependencies, MD-084/MD-085, unsupported no-artifact evidence, actual CMake commands and dated Go/lit results. Fresh configured MLIR suite passes 136/136 and focused P16 IR/lowering tests pass. Full-Go and final isolated acceptance remain explicit; no compiler behavior or default capability changes. Numbered P16 checklist remaining 9 to 8."
      - "P16-26 progress (2026-10-21): slice reference facts propagate through block arguments using a fixed point over all incoming roots, including anchored loops; any unknown/rootless/conflicting predecessor withholds facts and cannot inherit proof from a valid sibling. Published metadata is detached and independent of block order. Length, copy/move/end and dynamic validity consumers retain canonical borrow/lifetime/storage/epoch identity. New P15 element/subfield borrows must use a distinct borrow identity and preserve the granting slice validity, storage, domain, epoch, pin, address-space, stability and provenance facts, closing forged referent metadata accepted by standalone operation verification. Real source-derived IR corruption returns no emitted bytes on 32/64 plans. Separate white-box CFG forwarding of source-built IR verifies, emits schema 12 and round-trips through all four slice/P15 passes. Complete range/guard SSA forwarding, general joins, returned origins and source value production retain P16-26/P16-27/P16-36; no full checklist item is closed by this progress."
      - "P16-26 progress (2026-10-21): a shared fixed-point CFG value-origin utility now serves reference fact propagation and a detached slice-verification view. Range/index/source proof identity survives unambiguous block forwarding without changing original SSA/dominance or lifetime verification; distinct roots, equal constants/metadata, rootless cycles and absent guards cannot grant proof. P15 direct-reference/Place sources are deliberately not rewritten into authority absent from their original fact producer. 32/64 shared/mutable proven/dynamic IR tests retain exact tuples, temporal ordering and bounds-true edges, reject different source/index roots, swapped tuples, equal but unproved constants and guard bypasses, and preserve input/block-order behavior. White-box transformations of actual source-built IR emit and round-trip index and reborrow tuples through all four real verifiers before/after P6. These tests exposed generic multi-argument successor syntax using per-operand annotations; branch_targets.go now prints grouped operands and types for the common branch emitter, preserving zero/single-argument behavior. Corrupt tuples emit no bytes. Complete P16-26/general joins, P16-27 and P16-36 remain open; numbered remaining stays 8."
      - "P16 represented verifier integration: copy-only predecessor operations reject nested exclusive holders, including zero-length arrays; shared holders remain copyable without inspecting referents. Slice metadata merges operation properties, dictionaries and supplemental facts consistently; canonical omitted source_borrow remains supported. Unambiguous anchored-loop forwarding preserves proof identity, while rootless/conflicting cycles grant no proof. Returned-range verification rejects unrepresentable sub-slice origins (MD-115), including through copy/move/call wrappers, without rejecting whole-range returns or direct element-reference projections."
