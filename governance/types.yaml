      - "generic instance defaults (2026-10-07): synthesized default struct literals and struct-like union-variant literals carry their exact instantiated type, so `let mut b: Box[int]`, nested generic fields, and `Cell[int]` default variants are accepted instead of failing with \"Box requires 1 generic arguments, got 0\"; an unconstrained T and instances over NonDefaultable arguments stay rejected (TestGenericInstanceDefaultsUseExactInstantiatedType)"
