      - -> parameter accepts a fresh temporary without synthetic <- boilerplate
      - Some(resource) rejects reusable move-only source while Some(<-resource) consumes it
      - struct owning field rejects plain reusable move-only source and accepts Field: <-resource
      - non-terminal Ok(resource) rejects reusable move-only source while Ok(<-resource) is valid
      - return Ok(resource) remains valid as a terminal return transfer and return Ok(<-resource) is also accepted
      - return resource and return <-resource have identical ownership results
      - return Some(resource), returned union payloads, returned aggregates, and recursively nested returned construction forward reusable move-only sources
      - value-producing match arms inherit terminal ownership only when the match directly supplies return
      - ordinary calls and illegal indexed, borrowed, volatile, MMIO, or unavailable extraction do not inherit terminal structural forwarding
      - caller receives fresh move-only function result with ordinary initialization and no marker
      - capture(value) copies only copyable sources; capture(<-value) consumes reusable source
      - '@noCopy forbids copy but still permits explicit move'
      - explicit move of a copyable source makes the source unavailable
      - volatile source read produces ordinary snapshot; later copy of snapshot performs no extra volatile access
      - attempted :<- or <- ownership move from physical volatile/MMIO Place is rejected
      - ordinary method cannot consume whole self but may explicitly move an eligible owned member
      - Result.Ok()/Err() produce the corresponding Option type, consume an owned reusable Result, and diagnose later whole-result use at the consuming projection
      - Result.Ok()/Err() reject borrowed receivers and a potentially active non-discardable alternate payload
      - OkRef/ErrRef borrow without consuming and cannot outlive their Result
      - selected move-only Result payload moves into Option while the active alternate is destroyed exactly once
