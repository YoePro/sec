schema_version: 1
area: analysis
purpose: Standalone and interprocedural program analyses.
integrations:
  - id: sema.pitfall-analysis
    area: frontend-analysis
    status: partial
    integrated: "2026-08-11"
    audited: "2026-08-11"
    updated: "2026-09-21"
    summary: >-
      Adds structured high-confidence pitfall analysis that correlates canonical
      bounds, range, control-flow, Place/provenance, collection, API usage, effect, and FFI
      contract facts to detect common human mistakes without redefining the
      normative semantics owned by those analyses.
    rules:
      - rules/analysis/pitfall_analysis.md
      - rules/compiler/compiler_analysis.md
      - rules/analysis/call_graph.md
      - rules/analysis/effect_analysis.md
      - rules/memory/ownership.md
      - rules/memory/borrowing.md
      - rules/memory/lifetime_analysis.md
      - rules/analysis/escape_analysis.md
      - rules/analysis/closure_analysis.md
      - rules/memory/storage.md
      - rules/memory/layout.md
      - rules/collections/collections.md
      - rules/platform/ffi.md
    code:
      - internal/sema/analyzer.go
      - internal/sema/place.go
      - internal/sema/pitfall_analysis.go
    tests:
      - internal/sema/pitfall_analysis_test.go
    implemented:
      - canonical structured PitfallFinding model with stable rule identity, family, classification, confidence, subject, evidence for and against, suppression, owning-rule linkage, suggested actions, and analysis state
      - canonical defensive rule registry with required semantic facts, minimum Interactive/Standard/Deep analysis depth, and default confidence
      - distinct Finding, NoFinding, Suppressed, NotEvaluated, and Pending states plus per-rule evaluation counts
      - immutable deterministic Analyzer snapshot API for findings, suppressed results, evaluations, evidence, suppressions, and actions
      - direct index-at-Len detection correlated through resolved binding identity and Sema-owned compiler-known Len facts
      - inclusive range endpoint detection when the same resolved loop binding indexes the same collection that supplies Len
      - suppression of the inclusive endpoint finding when a preceding semantically matched equality or ordered endpoint guard exits before the indexed access
      - endpoint-exit proof also recognizes an else-branch break or return for matched strict-less-than or not-equal conditions, and applies only to statements after the guard
      - matched endpoint guards using continue also suppress only later indexed accesses in the current iteration; an index inside the guard and conditional continues remain findings
      - ProvenInvalid and Proven classification linked to the owning bounds rule without emitting a duplicate pitfall diagnostic
      - half-open ranges, different bound/index collection identities, and guarded inclusive endpoints covered as negative or suppression cases
      - boolean-intent rule correlating resolved bool operand types, exact 0/1 constants, equality operators, and redundant outer bool conversions
      - truth-table simplification for == and != with 0, 1, true, and false in either operand order
      - one-bit register-field comparison diagnostics retain the owning bool/int type error while supplying the intended direct or negated bool replacement
      - coalescing of outer bool conversion and inner literal comparison into one structured finding and one non-overlapping action
      - ProvenFix actions for valid true/false simplifications and SuggestedEdit actions for invalid but unambiguous bool/0-or-1 intent
      - negative coverage preventing boolean-intent inference from integers other than 0 and 1
      - API-usage finding for self.Method(self) when Sema resolves an instance method and self is both its implicit receiver and a direct explicit argument; ordinary functions, static methods, other receivers, unresolved calls, and indirect self expressions remain excluded
    remaining:
      - extend canonical fact consumption beyond resolved bindings and compiler-known Len to normalized range, bounds, control-flow, Place/provenance, collection-shape, effect, layout, and FFI contract facts
      - integrate direct index-at-Len and inclusive-length findings with the owning bounds diagnostic and coalescing pipeline
      - generalize endpoint-guard reachability beyond preceding direct comparisons with an unconditional break, continue, or return in the endpoint branch
      - implement upper-neighbor and lower-neighbor offset checks across normalized iteration domains
      - implement ineffective <= len and > len rejection-guard correlation
      - implement final-element access reasoning that consumes non-empty proofs
      - implement high-confidence skipped-first-element advisory with predecessor, prior-element-handling, explicit-contract, and other suppression evidence
      - implement omitted-last-element and count-versus-inclusive-endpoint advisory rules where semantic intent evidence is sufficient
      - implement collection bound-source correlation, equal/sufficient-length suppression, and copy/paste evidence
      - implement length-versus-capacity pitfall reasoning without conflating capacity with live element length
      - implement structural-mutation-during-indexed-iteration reasoning with safe-pattern suppression
      - implement wrong-guard-subject and ineffective-safety-check control-flow correlation
      - implement tautological/impossible range-condition enrichment and canonical range-membership suggestions using `in` when semantic equivalence is proven
      - add canonical-idiom suggestion support without inventing a new strict compilation mode
      - add Option/Result/state-check subject-correlation support when canonical state facts are available
      - add canonical FFI buffer/extent relationship consumption without inferring pointer/length semantics from parameter names
      - add FFI pointer/extent provenance mismatch detection when canonical contracts prove argument relationships
      - add FFI element-count versus byte-count mismatch detection using canonical extent units and resolved element layout
      - support explicit Sec FFI contracts, trusted imported metadata, generated binding metadata, and compiler-known platform/library metadata through one canonical FFI fact representation
      - coalesce pitfall findings with owning normative diagnostics so one root cause does not generate duplicate errors and warnings
      - extend the implemented ProvenFix versus SuggestedEdit distinction to further pitfall families
      - verify automatic fixes preserve evaluation count/order, effects, ownership/move behavior, and relevant failure semantics
      - add dependency-driven pitfall cache invalidation and reuse for unaffected semantic bodies
      - integrate Interactive, Standard, and Deep pitfall budgets without changing source-language semantics
      - expose configurable LSP diagnostics/code actions and refresh affected findings when project analysis configuration changes
      - integrate pitfall analysis into default `sec analyse --all` behavior and support explicit pitfall-only analysis selection
      - add required bounds/range, collection, control-flow, confidence/suppression, corrective-action, incremental/LSP, FFI, and performance tests
      - add false-positive regression corpus for neighbor traversal, sentinels, separately handled endpoints, equal-length parallel collections, ring buffers, capacity-level storage manipulation, protocol ranges, and byte-buffer FFI APIs
    verification:
      - command: go test ./internal/sema -run 'TestPitfallAnalysis(Recognizes|EndpointGuard|Suppresses)' -count=1
        result: passed; safe else exits suppress later indexes, ineffective guards and indexes inside a guard remain findings
      - command: go test ./internal/sema -run TestPitfallAnalysis -count=1
        result: passed, including ordered endpoint-exit guards and strict-inequality counterexamples
      - command: go test ./internal/sema ./cmd/lsp -count=1
        result: passed
      - command: go test ./...
        result: all packages passed except cmd/compiler, which still fails on six unrelated try requires Result expression errors in sec/core/string.sec
      - command: go test ./internal/sema -run TestPitfall
        result: passed
      - command: go test ./internal/sema -run 'TestPitfall|TestEqualityRequiresCompatibleTypes'
        result: passed
      - command: go test ./internal/sema -run 'TestPitfallAnalysisFindsExplicitSelfPassedToInstanceMethod|TestPitfallRuleRegistryIsStableAndDefensive' -count=1
        result: passed; the API-usage finding records resolved instance-method, implicit-receiver, and explicit-argument evidence
      - command: go test ./internal/sema -run 'TestPitfallAnalysis(RecognizesEndpointContinueGuards|ContinueGuardDoesNotProtectItsOwnIndex|EndpointGuardDoesNotProtectItsOwnIndex)' -count=1
        result: passed; matched continue guards suppress only later indexes while ineffective and conditional guards remain findings
      - command: go test ./...
        result: passed after the endpoint-continue pitfall analysis update
  - id: analysis.call-graph
    area: frontend-analysis-and-tooling
    status: partial
    integrated: "2026-08-07"
    summary: >-
      Provides the compiler-owned semantic call-graph slice consumed by Sema
      analysis and standard LSP call hierarchy without constructing a second
      tooling-owned graph.
    rules:
      - rules/analysis/call_graph.md
    code:
      - internal/sema/call_graph.go
      - internal/sema/analyzer.go
      - cmd/lsp/main.go
    tests:
      - internal/sema/analyzer_test.go
      - internal/sema/allocation_test.go
      - cmd/lsp/main_test.go
    implemented:
      - parser and Sema support for spawn and await with recorded task, thread, and process execution kinds
      - immutable compiler-owned graph snapshots from each completed Sema analysis
      - deterministic callable and call-site identities within one analyzed source snapshot
      - validated synchronous direct, static-method, and foreign-direct call sites
      - exact selected-overload and resolved-method targets
      - incoming and outgoing call-site queries with source locations
      - valid module-main program-entry root discovery
      - whole-graph root reachability with literal true and false branch pruning
      - Tarjan same-stack strongly connected components and direct or mutual recursion classification
      - task-spawn and thread-start execution relations on the resolved outer spawn call
      - synchronous classification of argument calls evaluated before spawning
      - derived task-entry and thread-entry roots only for reachable spawn sites
      - exclusion of task and thread spawn edges from same-stack recursion
      - standard LSP prepare, incoming, and outgoing call hierarchy
      - preserved dispatch and execution metadata in LSP call-hierarchy items
      - LSP hover summaries for callers, callees, roots, recursion, and spawn edges
      - source-ordered direct Arena create, allocate, reset, and release event sites
      - synchronous Arena MayAllocate propagation and shortest callable cause paths
      - exclusion of spawned-body allocation from the spawner synchronous summary
    verification:
      - command: go test ./...
        result: passed
      - command: go vet ./...
        result: passed
      - command: validate implementation-status.yaml
        result: passed
    remaining:
      - callable and call-site identity and reachability stable across snapshots and concrete CompilationPlan variants
      - generic-specialization, closure, defer, destructor, and compiler-generated callable nodes
      - indirect function-value and interface target sets with open callable contracts
      - target, initialization, test, benchmark, interrupt, foreign-export, generated, and open-world roots
      - complete semantic path pruning beyond literal boolean branches
      - process, interrupt, callback, await, join, defer, and destruction execution relations
      - dedicated task-spawn, thread-start, process-launch, and complete-execution SCC views
      - effect domains beyond the initial Arena allocation summary
      - path-aware ordered effect merging and general diagnostic cause paths
      - persistent workspace graph indexing, incremental invalidation, and stale-result suppression
  - id: analysis.arena-allocation
    area: frontend-analysis
    status: partial
    integrated: "2026-08-07"
    summary: >-
      Provides compiler-known Arena allocation validation, allocation generation
      tracking, and stale-reference diagnostics without allocator lowering.
    rules:
      - rules/memory/allocation.md
      - rules/memory/arena.md
    code:
      - internal/sema/analyzer.go
      - internal/sema/types.go
      - internal/sema/call_graph.go
    tests:
      - internal/sema/allocation_test.go
      - internal/sema/lifetime_test.go
      - internal/sema/analyzer_test.go
    implemented:
      - compiler-known Arena type and AllocationError enum
      - compiler-known Arena.New, Arena.FromBuffer, Arena.WithCapacity, Arena.Growable, Arena.Alloc, Arena.Reset, and Arena.Release member recognition in the represented frontend subset
      - semantic validation of Arena.Alloc[T](count) with Result[ref mut T[], AllocationError] result typing
      - Arena.Reset syntax, arity, mutable-receiver validation, and generation mutation
      - Arena.Release syntax, arity, mutable-receiver validation, generation mutation, and consumption of the represented lexical owner
      - lexical Arena binding-name and generation metadata on arena-backed references and slices in the represented subset
      - rejection of arena-backed references and slices after a reset through the same represented Arena identity advances their generation
      - initial conservative generation-state merging with known defer, switch-fallthrough, and loop-backedge limitations
      - initial allocation context, symbol storage-origin metadata, and allocation-effect facts
      - source-ordered direct Arena events and synchronous MayAllocate summaries in the compiler call graph
    verification:
      - command: go test ./internal/sema
        result: passed
      - command: validate implementation-status.yaml
        result: passed
    remaining:
      - prove that no validity-preserving dependency crosses Arena.Reset or Arena.Release
      - classify Arena itself as move-only and non-trivially destructible and derive those traits through containing aggregates
      - replace lexical Arena binding-name identity with stable compiler-owned ArenaDomain identity
      - retain Arena.FromBuffer backing identity as an exclusive mutable borrow for the complete Arena lifetime and transfer that responsibility with the Arena owner
      - allocation-context propagation and complete allocation-effect inference through function bodies
      - sized, trivially-destructible, default-value, overflow, and alignment checks required by the safe allocation contract
      - allocation failure handling beyond ordinary Result syntax
      - complete ownership, move-state, and storage-origin propagation through references, slices, and Semantic IR
      - explicit arena allocation operations in Semantic IR and lowering through MLIR and LLVM
      - allocator implementation, target-specific backing storage, capacity analysis, and runtime behavior
  - id: analysis.arena-reset-release-dependency-legality
    area: frontend-analysis
    status: partial
    audited: '2026-08-20'
    repository_baseline: c515862
    primary_rule: rules/memory/allocation.md
    canonical_arena_rule: rules/memory/arena.md
    summary: Arena.Reset and Arena.Release perform an operation-point dependency query in addition to receiver, arity,
      and generation/domain validation. The implemented query rejects represented escaping dependencies while allowing
      immediate locals to become stale and be diagnosed on later use. Complete NLL across containers, captures, tasks,
      foreign retention, and nested Arenas remains incomplete.
    code:
    - internal/sema/analyzer.go
    - internal/sema/types.go
    - internal/sema/call_graph.go
    tests:
    - internal/sema/allocation_test.go
    - internal/sema/lifetime_test.go
    - internal/sema/analyzer_test.go
    implemented:
    - Arena.Reset arity/type-argument validation
    - Arena.Reset mutable-receiver validation
    - Arena.Reset generation advancement
    - Arena.Release arity/type-argument validation
    - Arena.Release mutable-receiver validation
    - Arena.Release generation advancement
    - Arena.Release consumes the represented Arena owner
    - stale-generation diagnostics for represented Arena-backed references/slices
    - direct Arena Reset/Release call-graph effect recording
    - operation-point validation of represented validity-preserving Arena dependencies
    - stable ArenaDomain identity across owner moves
    - corrected defer, switch, match, and loop generation-state propagation in the represented frontend subset
    partial:
    - dependency liveness is conservative and does not yet model every nested Arena, container, capture, task/thread,
      foreign-retained, weak-handle, or implicit-destruction path
    remaining:
    - broaden the ArenaDomain dependency query to full NLL/last-use semantics
    - distinguish weak/stale-capable handles from strong validity-preserving dependencies
    - integrate nested Arena, container, capture, task/thread, foreign-retained, and deferred-use dependencies
    - consume corrected branch/switch/loop/defer flow state from the relevant corrections
    - add focused Reset/Release operation-point diagnostics and regression tests
    - add correction25 rulebook/rule traceability comments to touched semantic functions
    bug_reference:
    - correction28.md
    governance_reconciliation:
    - Narrow "semantic validation of mutable Arena.Reset calls" to syntax, receiver mutability, and generation mutation
      until dependency-crossing legality is implemented.
    - Keep stale-generation rejection as implemented in its represented subset; it is not the same as Reset legality
      proof.
    - Add Release dependency legality explicitly to remaining work.
    - Qualify "conservative generation-state merging across if, switch, match, for, while, and break" with correction18.md,
      correction24.md, and correction25.md until those flow-state bugs are implemented.
    - Keep the already-listed Alloc[T] sized/destructibility/default/overflow/ alignment gaps as existing remaining
      work; do not duplicate them as new correction28 findings.
