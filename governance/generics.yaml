  - id: frontend.method-level-generics
    area: method-level-generic-parameters
    status: implemented
    integrated: "2026-11-16"
    summary: "All MLG-1 through MLG-8 are implemented: composed declaration scopes, template guarantees, independent owner/method inference, argument-only overload resolution, finite explicit interface conformance, canonical specialization identity and demand, concrete Semantic IR method bodies and compiler-owned hover bindings. Method-local specializations preserve Sema identity through direct calls and physical symbol assignment, using the existing receiver/ownership lowering. Full Sema, Semantic IR and Sec MLIR suites and targeted LSP tests pass. This owner is complete; P17 final acceptance remains conditional on the separately required owner-run full Go suite and does not claim new downstream physical reference support."
