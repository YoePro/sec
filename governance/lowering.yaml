    implemented:
      - "MD-114 detached register integration (2026-10-28): typed #sec.register_def/#sec.register_field/#sec.register_write_proof attributes, the single canonical first-use sec.registers table, nominal sec.field_path extract/update operations and strict table/path/carrier/proof verification are installed in schemas 11/12. Required names/flags/ordinals, allocation-order coverage including reserved bits, nested nominal definitions/cycles, byte-order omission/domain and standard unsigned carriers are checked. Go emission serializes verified IR facts directly. Numeric writes require represented constant, extraction/type/mask or dominating immutable-SSA comparison evidence; unsupported proof transport fails before emission, while Sema-approved inspection IR remains available. Native verification preserves those facts through P5/P6/P8 bridges and rejects metadata-only forgeries. Source/public CLI tests cover bool, bit-backed enums, nested registers, all standard carriers through 256 bits, explicit little/big byte order, reserved fields, typed/constant/interval writes and deterministic 32/64 schema-11/12 round trips. Units without a quantity representation fail closed rather than losing identity. Physical register representation and hardware access remain outside this implementation."
      - "MD-110 shared-table conversion subset (2026-10-28): register.from_bits constant/source-domain proofs (including negative constants under the bit-pattern fit rule) and register.to_bits signed/unsigned results resolve width from the same MD-114 table, with exact P6 scalar resolution and P8 preservation. fits_bits/guarded transport remains blocked on its unspecified destination-identity attribute spelling; bit-extraction conversion proof transport retains its separately recorded MD-110 gap. No fourth proof basis or hardware authority is invented."
      - "MD-116 completed (2026-10-27): source-approved module/function-local scalar static references emit zero-operand sec.place.static roots linked to sec.static.global by symbol, with explicit nonzero module-local sec.static_id and address-taken facts. StaticID, PlaceRootID and storage identity remain independent; module-wide Semantic IR checks and native operation verification reject conflicting repeated-root storage/address-space facts and identity aliasing between distinct statics. Same-module static return origins are verified from declaration IDs through copies, branches and calls; imported linkage stays closed. Source tests cover deterministic 32/64 emission in schemas 11 and 12, P5/P6/P8 preservation and malformed Semantic IR emitting no bytes. Physical reference-dependent static lowering remains unsupported, as required; this does not close addressed roots, aggregate/non-literal static initialization or P15 final acceptance."
      - "MD-085 (2026-10-22, rules/corrections/applied/md085-return-origin-verification-correction-20261021.md): --sec-verify-borrow-semantics verifies return origins path-aware. It checks summaries against the canonical grammar and parameter referent types, traces fields, proven-safe constant [K], dynamic [*] and slice views through joins, instantiates the callee's own sec.return_origins at direct calls (no all-arguments fallback), and requires exact inclusion. Static roots, receivers of non-methods and union payloads are rejected (lit return-origins-paths.mlir, invalid-return-origins-paths.mlir; P15/P16 Go fixtures)."
      - "MD-087 (2026-10-22, rules/corrections/applied/md087-p5-p6-p8-reference-boundaries-correction-20261021.md): --sec-lower-checked-integers is selective. It lowers representable integer computation in modules that contain Places, references or slices, keeps their operations and facts, materializes exact-width siN/uiN <-> iN unrealized-cast bridges at Place, storage and call boundaries, and rejects any other surviving bridge. P5 (sec::isReferenceDependentStorage) and P6 (reference-bearing sec.call.direct, discardable call attributes preserved) were audited as conforming (TestCheckedIntegerLoweringCoexistsWithReferences 32/64; lit schema11-reference-scalar-layout.mlir, schema12-slice-architecture.mlir, invalid-reference-bridges.mlir)."
      - "P15-49/P15-65 (2026-10-22): TestPackage15SourceMatrix checks evaluation order, SSA reuse for holder moves and copies, reborrow sources, equality and Sema-placed ends. TestPackage15FixtureInvariants checks verification, no aggregate reads, and no undef/poison/allocation; a matrix fixture is added to the P15 fixtures. TestPackage15SourceToSchema11Pipeline runs every P15 emit fixture plus a P12/P13/P14 integration fixture through target-aware Sema, verified Semantic IR, schema 11 and sec-mlir-opt (absolute path), with the three verifiers, P6 wrapper preservation and selective P8, on 32/64-bit plans. Dynamic-epoch validity is not producible from P15 source (Arena allocation does not lower) and is covered from Semantic IR onward."
      - "MD-065 (2026-10-22): ref.end-borrow is placed at Sema's last-required-use end in the holder's own statement list (borrow_ends.go). Payload arm exits dominated by it get no second marker. Direct P15 reference endpoints inside nested blocks retain their existing limitation. P16 slice endpoints in nested blocks are now represented through the slice-specific CFG normalization recorded in lowering.sec-mlir-package16 (2026-10-26); broader Sema/CFG schedules remain open."
      - "MD-084 (2026-10-22, rules/corrections/applied/md084-schema11-reference-metadata-correction-20261021.md): the canonical sec.return_origins grammar and duplicate rejection are enforced by the dialect attribute verifier (mlir/include/sec/Dialect/Sec/ReturnOrigins.h; lit invalid-schema11-emitter-metadata.mlir). Compiler-materialized storage emits an empty sec.source_name with sec.synthesized = true instead of a fabricated name."
      - "MD-086 (2026-10-22, rules/corrections/applied/md086-p15-cli-emit-routes-correction-20261021.md): emit-ir and emit-sec-mlir build package-15 Semantic IR (inspectionMaxPackage). emit-sec-mlir publishes only after the Place, reference-guard and borrow-semantics verifiers pass. emit-mlir, emit-llvm and build stay at package 14 and reject reference programs as an unsupported lowering that names the missing physical representation (TestReferenceProgramsReachOnlyTheInspectionBoundaries, 32/64-bit)."
      - "MD-076 temporaries (2026-10-21): a Temporary borrow plan lowers by evaluating the producer once, then `place.value-root` + `ref.borrow-shared` for a shared borrow or address-taken compiler storage + `place.storage-root` + `ref.borrow-mut` for a mutable one. A returned reference carries the temporary's storage identity in `origins`, and `*call()` reads through `ref.deref-place` + `place.read` (MD-063). The schema-11 emission passes all three verifiers (TestTemporaryBorrowsMaterializeOwnPlaces, TestTemporaryBorrowsAndDereferenceEmitSchema11). Branch- and short-circuit-scoped temporaries (MD076-P10, 2026-10-22) exist only on reached paths and verify on 32/64 (TestTemporaryBorrowsExistOnlyOnReachedPaths, TestBranchScopedTemporariesEmitSchema11). Known hole (verified 2026-10-21): temporaries that need full-expression cleanup stay an explicit lowering boundary until P17."
