      - Semantic IR TypeArray keyed by element TypeID plus canonical exact decimal length, with deterministic interning, formatting, and verifier diagnostics
      - Semantic IR builder admits fixed-array function parameter and return types at Package 14, keeps dynamic array types gated as UnsupportedFeatureError, and does not introduce array operations before P14-29
      - Semantic IR array.construct, array.default, and array.len operation records with compact segment metadata, exact length strings, P14 action gating, formatter output, and verifier checks
      - Semantic IR array.index-in-bounds, array.extract, and array.replace records preserving source index signedness, explicit proof/check metadata, and trivial ownership boundaries
      - fixed-array runtime projection verification requires a named dominating guard for the same array/index SSA pair and rejects any projection reachable from the guard's false edge
      - terminating Semantic IR fail.bounds endpoint for ordinary indexing plus explicit core::IndexError.OutOfBounds and Result.err validation for fallible bounds paths
      - immutable read-only ResolvedArrayIndexPlan facts preserve exact array length, array/element/index types, signedness, use/action, proof/check kind, failure mode, and runtime IndexError typing without downstream AST reconstruction
      - arbitrary-precision constant index plans cover valid uint256 values above host int64 and exact negative, at-length, and above-length rejection; remaining indexes preserve their signed or unsigned source type as runtime-checked
      - named integer ranges wholly contained in 0..<N produce explicit range-proven index plans while zero-length arrays remain runtime-checked unless rejected as an invalid constant
      - dominating branch and assertion conditions publish explicit branch or analysis index-proof provenance; inline range contracts retain contract provenance, binding identity prevents textual shadowing, and intervening assignments invalidate value proofs conservatively
      - source-built branch-proven extraction consumes the Sema proof in verified Semantic IR without array.index-in-bounds or fail.bounds while incomplete, disjunctive, out-of-scope, mutated, and zero-length cases remain runtime-checked
      - Package 14 source-builder unsupported boundary for non-trivial array literals returns UnsupportedFeatureError without returning a partial module or placeholder operation
      - Package 6 scalar-layout resolution recursively converts target-sized int/uint through fixed-array elements, nested arrays, type arguments, and surrounding P13 struct fields while preserving exact lengths, nominal identities, field tags, and high-level array operations on both 32-bit and 64-bit plans
      - Package 8 checked-integer lowering normalizes ordinary scalar operations to signless Arith without recursing through fixed-array wrappers or lowering zero-length, spread, or nested sec.array.construct operations
      - Package 13 integration preserves exact nominal struct identities for struct-in-array and array-in-struct values, including int128/uint256 fields, compact recursive defaults, guarded nested replacement, leaf-to-root rebuild, and one root commit
      - Package 11/12 integration admits copy-trivial fixed arrays as union payloads and match values while retaining ordinary union-variant patterns, copy-trivial transfer, compact fallback construction, and the existing matching-variant projection guard
      - schema-10 sec.array.default, sec.array.len, sec.array.index_in_bounds, sec.array.extract, sec.array.replace, and terminating sec.fail.bounds operations with exact local type, signedness, bounds-metadata, action, and result-identity verifiers
      - sec-verify-array-index-guards enforces same-array/index SSA identity, immediate single-use predicate branching, dedicated true-edge dominance, and closed proven-safe provenance for schema-10 extraction and replacement
      - generated high-level modules used schema 10 while schemas 1 through 9 remained accepted regression inputs; since P15-50 (2026-10-16) they declare schema 11, schemas 1 through 10 stay accepted and schema 12 is rejected
      - Go schema-10 emission preserves exact nested array types, compact ordered construction segments and actions, defaults, length, source-typed bounds predicates, proof metadata, guarded extraction/replacement, bounds failure, locations, and high-level storage
      - schema-10 emission independently rejects nested fixed-array lengths that overflow the selected 32-bit or 64-bit target uint without host-width conversion
      - the complete Package 14 section-100/101 dialect matrix covers canonical and invalid array types, compact construction, every array operation, guard dominance and SSA identity, proven provenance, and schema-9 compatibility
      - compiler-known fixed-array Len lowers from its resolved Sema receiver fact to compact foldable ArrayLengthOp with exact decimal length
