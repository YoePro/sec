      - add canonical Target and Variant platform-resolution integration that produces one concrete CompilationPlan for each requested Target x Variant pair
      - keep Target as the logical product and Variant as the concrete platform-specific build configuration throughout compiler and tooling APIs
      - introduce typed canonical identities for platform, architecture, CPU, Device, ABI, TargetProfile, runtime, execution, memory, and link definitions instead of downstream free-form target strings
      - add deterministic alias normalization and reject unknown or ambiguous canonical platform identities
      - add explicit BuildProfile versus TargetProfile separation in platform resolution and downstream plan consumers
