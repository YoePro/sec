  - id: semantic-ir.copy-move
    area: semantic-ir-ownership
    status: planned
    integrated: "2026-08-28"
    document_revision: "2.0"
    repository_baseline: 069c111
    rules:
      - rules/memory/copy_move.md
      - rules/memory/ownership.md
      - rules/compiler/semantic_ir.md
    implemented:
      - Current Semantic IR carries selected call argument actions and ownership-adjacent facts, but the root implementation-status still records explicit copy/move/replace/destruction operations as deferred.
    remaining:
      - represent Copy, Move, Replace, Reinitialize, Discard, Destroy, TransferToReturn, TransferToArgument, and TransferToAggregate explicitly when needed for downstream ownership correctness
      - preserve source Place/projection identity, copy classification, destination ownership, partial availability, transfer commit, and destruction responsibility
      - preserve explicit <- call/payload actions instead of reconstructing them from types in lowering
      - represent recursive aggregate, Option, Result, union, and value-producing control-flow return forwarding without requiring source markers at every nested edge
      - represent volatile access boundaries separately from ordinary value copy/move operations
      - fail explicitly when an ownership-sensitive construct cannot be represented without losing semantics
    required_tests:
      - Semantic IR distinguishes copy from move even when both could lower to identical machine operations
      - Semantic IR preserves reusable-source explicit consuming call action
      - Semantic IR preserves explicit aggregate/Option/Result/union payload move
      - Semantic IR preserves return transfer with optional source marker normalized to one semantic transfer
      - Semantic IR preserves replacement versus reinitialization and cleanup responsibility
      - Semantic IR never models a volatile hardware read itself as ownership move-out

  - id: lowering.copy-move
    area: sec-mlir-llvm-abi-copy-move
    status: planned
    integrated: "2026-08-28"
    document_revision: "2.0"
    repository_baseline: 069c111
    rules:
      - rules/memory/copy_move.md
      - rules/memory/ownership.md
      - rules/platform/volatile.md
      - rules/mlir/sec_mlir.md
    implemented:
      - SEC-MLIR packages already lower many scalar, call, enum/union, match, and struct operations, including P13 struct semantics, but root governance still defers explicit ownership verification for general copy/move.
    remaining:
      - lower resolved copy/move/replace/reinitialize operations without re-deciding source semantics from physical representation
      - preserve source unavailability and exactly-once destination/destruction responsibility through copy elision, move elision, destination passing, buffer reuse, and stack-slot reuse
      - verify argument transfer commit after fallible left-to-right argument preparation
      - preserve partial aggregate ownership and conditional cleanup through supported control flow
      - preserve volatile access ordering and never merge source-level volatile observations because local snapshots are copyable
      - respect address stability/pinning/fixed-storage constraints independently of ownership transfer
      - verify ABI and FFI ownership contracts rather than inferring ownership from register/pointer passing strategy
    required_tests:
      - copy elision preserves source availability
      - move elision preserves source unavailability
      - replacement destroys old destination exactly once before new ownership is established
      - failed later call argument does not commit an earlier reserved reusable-source transfer
      - volatile snapshot copy does not emit an additional volatile read
      - physical MMIO/register storage is never relocated by value move lowering
      - P13 struct ownership-sensitive cases reject unsupported non-trivial ownership paths rather than silently copying

