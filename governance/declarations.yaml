  - id: frontend.property-readability
    area: frontend-property-access
    status: partial
    audited: '2026-08-19'
    revised: '2026-09-22'
    repository_baseline: c515862
    document_revision: '2.0'
    document_created: '2026-08-13'
    document_last_updated: '2026-08-13'
    summary: >-
      Supplements frontend.properties with read-access validation for write-only
      properties. Raw metadata lookup remains available to writes, while a
      dedicated readable-property path enforces HasGetter for ordinary,
      unqualified impl, early property-body, static, and represented
      guard-forwarded reads. Compound assignment requires both accessors and
      simple assignment remains setter-only. Sema now preserves explicit read,
      write, fallible-write, and compound-update facts; Semantic IR consumption
      and lowering remain incomplete.
    rules:
      - rules/declarations/properties.md
      - rules/declarations/interfaces.md
      - rules/declarations/impl.md
      - rules/declarations/static.md
      - rules/foundations/operators.md
      - rules/corrections/applied/semantic-ir-properties-correction-20260813.md
    related_integrations:
      - frontend.properties
    code:
      - internal/sema/analyzer.go
      - internal/sema/analyzer_properties.go
      - internal/sema/semantic_facts.go
      - internal/sema/types.go
    tests:
      - internal/sema/analyzer_test.go
      - internal/sema/semantic_facts_test.go
    implemented:
      - property semantic metadata records getter availability
      - property semantic metadata records setter availability
      - interface property conformance checks required getter availability
      - interface property conformance checks required setter availability
      - simple property assignment rejects properties with no setter
      - fallible simple property assignment requires try
      - ordinary property lookup resolves declared property type and definition
      - readable-property validation is distinct from raw metadata lookup
      - ordinary, static, and guard-forwarded member reads reject write-only properties
      - unqualified impl and early property-body reads reject write-only properties
      - compound assignment requires both getter and setter before RHS analysis
      - simple assignment to write-only properties remains valid when receiver and setter rules permit it
      - resolved Sema facts distinguish PropertyRead, PropertyWrite, FalliblePropertyWrite, and PropertyCompoundUpdate while preserving owner type, property type, static category, fallibility, and source operator
    partial:
      - Semantic IR and lowering do not yet consume the explicit resolved property access facts
      - future interface-runtime property reads must consume the same readable-property boundary when that access path is implemented
    remaining:
      - carry resolved property access facts into Semantic IR and semantics-preserving lowering
      - apply readable-property validation to future interface-runtime access paths
      - complete fallible compound-assignment execution and lowering behavior
    verification:
      - command: go test ./internal/sema -run 'TestWriteOnlyPropertyReadAndCompoundAssignmentAreRejected|TestProperty' -count=1
        result: passed
      - command: go test ./internal/sema -run 'TestResolvedPropertyAccessKinds|TestResolvedStructMemberDistinguishesPropertyFromStoredField' -count=1
        result: passed on 2026-09-22 with explicit read, write, fallible-write, and compound-update Sema facts
    bug_reference:
      - correction12.md
    governance_reconciliation:
      - Narrow frontend.properties implemented wording "property member access type inference and self-member resolution" to make clear that property lookup/type inference exists but read-access validation for write-only properties is incomplete.
      - Keep "complete getter and setter body analysis using ordinary function-body rules" as implemented; this correction concerns property use sites, not accessor body validation.
      - Keep the existing remaining item "complete fallible compound-assignment behavior". Add the getter requirement separately because it is a more basic frontend rule that also affects infallible compound assignments.
    required_tests:
      - read-write property member read accepted
      - getter-only property member read accepted
      - write-only property member read rejected
      - write-only property unqualified impl read rejected
      - write-only property simple assignment accepted
      - read-only property simple assignment rejected
      - write-only property compound assignment rejected for missing getter
      - getter-only property compound assignment rejected for missing setter
      - fallible read-write property compound assignment retains try requirement
      - resolved property accesses preserve read, write, fallible-write, and compound-update categories without reconstructing them from syntax

