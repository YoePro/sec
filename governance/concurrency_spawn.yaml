schema_version: 1
area: concurrency-spawn
purpose: >-
  Cross-execution-kind spawn syntax, semantic dispatch, input evaluation,
  creation-failure boundary, and shared ownership/capability integration.
integrations:
  - id: concurrency.spawn-v1
    area: concurrency
    feature: cross-kind-spawn-boundary
    status: partial
    integrated: "2026-11-09"
    document_revision: "2.0"
    repository_baseline: dce854ecb317eb62923c638c23a1baaac354be02
    summary: >-
      Tracks the common spawn syntax and compiler boundary for task, thread, and
      process execution; concrete lifecycle, configuration, transfer, runtime,
      and completion behavior remain with their specialist owners. The source
      rulebook is undergoing modernization while retaining every established
      paragraph number.
    rules:
      - rules/concurrency/spawn.md
      - rules/foundations/grammar.md
      - rules/concurrency/tasks.md
      - rules/concurrency/threads.md
      - rules/concurrency/processes.md
      - rules/concurrency/concurrency.md
      - rules/concurrency/cancellation.md
      - rules/concurrency/scheduling.md
      - rules/memory/ownership.md
      - rules/memory/borrowing.md
      - rules/memory/transferability.md
      - rules/compiler/semantic_ir.md
    code:
      - internal/ast/ast.go
      - internal/parser/parser.go
      - internal/sema/analyzer.go
      - internal/sema/types.go
      - internal/parser/expression.go
      - internal/sema/analyzer_inference.go
    tests:
      - internal/sema/concurrency_test.go
      - internal/parser/parser_test.go
      - internal/parser/spawn_forms_test.go
      - internal/formatter/spawn_forms_test.go
      - internal/sema/spawn_blocks_test.go
      - cmd/compiler/spawn_grammar_test.go
      - cmd/lsp/spawn_grammar_test.go
      - testdata/formatter/spawn_forms.sec
      - testdata/formatter/spawn_forms.expected.sec
      - testdata/parser/spawn_missing_operand_invalid.sec
      - testdata/sema/spawn_blocks_invalid.sec
    implemented:
      - >-
        The parser and AST represent spawn constructs and distinguish task,
        thread, and process execution-kind modifiers.
      - >-
        Initial frontend task and thread handle identities and spawn syntax
        exist; current task-spawn typing has legacy direct-Task[T] paths.
      - >-
        The frontend rejects process spawn where its process materialization,
        startup transfer, and lifecycle requirements are not implemented; it
        does not silently degrade it to task/thread spawn.
      - >-
        Initial task-handle must-use and unresolved-lifecycle checks exist, as
        documented by concurrency_task.yaml.
      - Grammar section 89 expression/block alternatives and default/task/thread/process contextual spellings are preserved through parser and formatter, including ordinary identifiers with those spellings; missing operands preserve surrounding syntax and produce one canonical parser diagnostic in CLI/LSP, while valid spawned blocks report their separate unimplemented semantic capability rather than deprecated syntax (2026-11-09)
      - "2026-11-17 (governance sync, verified): current-execution facts propagate per execution root without inventing a task parent or TaskContext (cancellation.md §§ 14, 19-23; scheduling.md § 22): Task.Current/Task.Yield record a logical-task requirement and cancel a cancellable-execution requirement that propagate through synchronous and deferred calls; a spawned task satisfies both, a spawned thread is cancellable but not a logical task, ordinary program entry and test bodies are neither (no implicit root task), spawn edges start new roots and are not followed, and process spawn stays rejected; S1213 names the operation, the root kind and the introducing site (internal/sema/task_context_requirement.go; TestExecutionContextRequirements, TestExecutionContextRequirementsInTests, TestMainTaskContext)."
    remaining:
      - >-
        Unify spawn typing with canonical fallible Result[Task[T],
        TaskSpawnError], Result[Thread[T], ThreadSpawnError], and
        Result[Process[T], ProcessSpawnError] without flattening callable T.
      - >-
        Preserve task, physical-thread, and isolated-process execution
        identities and reject unsupported target capabilities at compile time.
      - >-
        Preserve eager task/process creation and default eager / explicit
        deferred thread creation, including callable start boundaries.
      - >-
        Validate boundary-specific owned, borrowed, mutable, capture, callable,
        and method-receiver transferability and lifetime proofs.
      - "MD-128 Sema creation transaction (spawn.md §§ 6(7), 10(8), 10(10), 11(7), 13(5), 16(7), 25(4); ownership.md § 14.2 amendment): distinguish prepared, committed and independently completed transfers for task, thread and process spawns; commit at successful creation, cancel pending reusable-source transfers on creation Err so the source stays available; correct Place availability, owner identity, loans and lifecycle obligation on each creation-result path through match, try handlers, propagation and joins; no restoration of closure captures, receiver or configuration moves that completed independently (T01-T04, T07-T10, T12-T15, T17-T18, T21-T22, T24)"
      - "MD-128 failure-path cleanup (spawn.md § 10(8), threads.md § 20(5)-(7)): creation-only temporaries and temporary caller-owned arguments destroyed exactly once on creation failure, uncommitted reusable sources never destroyed, transaction-owned loans released and unrelated loans kept, reusable ThreadConfig retained, argument-evaluation failure never relabelled as a creation error, deferred Start() failure never rolls back the creation commit (T11, T16, T19-T20, T23, T26)"
      - "MD-128 Semantic IR and verifier (spawn.md § 26(5), semantic_ir.md § 77(4a)): keep kind, prepared input Places, transfer modes, creation commit boundary, success and failure paths, cleanup obligations and handle owner; reject a consumed source available on success, a lost uncommitted source on failure, duplicate destruction, user entry before commit and a creation error with an unresolved child lifecycle (T29-T30)"
      - "MD-128 lowering and runtime (spawn.md §§ 10(8), 26(5); processes.md §§ 8.6-8.8): one creation transaction per supported kind with input publication before child entry, provisional native thread or bootstrap child cleaned up on failure, deterministic creation-failure injection for tests; unsupported kinds and illegal process borrows stay compile-time diagnostics (T05-T06, T25, T27-T28)"
      - "MD-128 diagnostics and LSP (spawn.md § 25(4)): distinguish a move pending on a creation result from a committed move; never suggest that creation Err destroyed a directly prepared reusable source or restored an earlier consumed capture"
      - >-
        Ensure one-shot creation failure and lifecycle-owner facts survive
        Semantic IR verification, target lowering, and LSP presentation.
      - >-
        Integrate resource-amplification and recursive-spawn diagnostics
        according to the selected target/profile; do not make a universal
        static-bound rule for valid hosted dynamic creation.
      - "MD-129 Sema and analysis (cancellation.md §§ 55(5)-(9); spawn.md §§ 24(3), 26(6); tasks.md §§ 4(12), 8(7), 22(11)): record a structured parent-child cancellation link only for a real current logical task parent (none from ordinary entry or a native thread without a task), never treat a pending parent request as an invalid creation configuration, keep lifecycle diagnostics for detach (discard intent, escaping borrows) and unresolved handles (T17-T18, T24-T25, T27)"
      - "MD-129 Semantic IR and verifier (spawn.md § 26(6); semantic_ir.md § 77(4b)): keep creation kind, structured cancellation relationship, the child's initial request-state initialization, link removal at detach, creation outcome and lifecycle owner, with unknown requests as runtime state; reject clearing a pending request at detach, implicit detach, worker identity substituted for task identity and an existing request encoded as a creation error (T28)"
      - "MD-129 runtime creation, propagation and detach (cancellation.md §§ 55(6)-(8)): the linked child's own request is published before its first observation or cancellation point; link establishment, request delivery and link removal are coordinated so no committed or owed request is lost or revoked and no post-detach request travels the removed link; terminal outcomes stay immutable; data-race-free under the memory model; deterministic scheduler fixtures (T01-T11)"
      - "MD-129 outcomes and cross-kind independence (cancellation.md § 55(9)): a requested child may cancel, complete, panic or fail normally and creation never fabricates Cancelled; MD-128 rollback on genuine creation failure with no published link; no task-request inheritance for spawn thread, no implicit process termination for spawn process, Context cancellation handled through its own contract; await caller-cancellation cleanup unchanged (T12-T16, T19-T23, T26)"
      - "MD-129 tooling (spawn.md § 26(6)): diagnostics, hover and LSP distinguish a pending request, successful creation and terminal cancellation and never imply that detach resets a received request"
    required_tests:
      - default spawn and spawn task have canonical fallible task result
      - spawn thread has canonical fallible physical-thread result
      - spawn process has canonical fallible process result or rejects unsupported capability
      - spawn block and callable-expression forms preserve the chosen execution kind
      - nested Result callable return is preserved inside the created handle
      - deferred physical-thread callable does not execute before Start commit
      - successful task creation does not imply a physical-thread identity
      - spawn outside a task context does not fabricate Task.Current
      - spawned process receiver state is child-local, never an ordinary parent borrow
      - borrowed task/thread payloads obey lifetime, affinity, and transferability proofs
      - process spawn rejects ordinary cross-process ref and ref mut transfers
      - move-only named inputs require explicit move markers
      - failed creation never leaks or double-destroys prepared resources
      - created handles cannot be silently discarded or implicitly detached
      - dynamic recursive creation obeys target-profile resource constraints
    governance_reconciliation:
      - >-
        concurrency_task.yaml retains Task[T], TaskOutcome[T], task creation,
        task ownership and terminal outcome implementation ownership.
      - >-
        concurrency_thread.yaml retains ThreadConfig, eager/deferred start,
        Thread[T] lifecycle and physical-thread implementation ownership.
      - >-
        concurrency_process.yaml retains process-entry materialization,
        transactional process startup, Process[T], and process lifecycle.
      - >-
        concurrency_cancellation.yaml owns cancellation propagation, effects,
        and Context; concurrency_scheduling.yaml owns executor scheduling.
      - >-
        Spawn-block result inference for task, thread and process was decided
        by MD-133 on 2026-11-24 (spawn.md § 3A); its implementation items are
        owned by concurrency.tasks-v2 for all three kinds.
        Cancellation inheritance at creation and detach was decided by MD-129 on
        2026-11-24 (rules/corrections/applied/MD-129-spawn-parent-cancellation-correction-2026-11-24-20261124.md; cancellation.md §§ 55(5)-(9)). The universal failure-commit rule
        was decided by MD-128 on 2026-11-24 (rules/corrections/applied/MD-128-spawn-transactional-ownership-correction-2026-11-24-20261124.md; spawn.md § 10(8)).
